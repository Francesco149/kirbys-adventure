[[claim]]
id = "en25b.e5e.tick_wait"
about = ["e5e_tick_wait", "e5e_scripts", "e5e_fly"]
text = "e5e_tick_wait passes the record 39:8EC4; unless the hit test changed the object it calls obj_gravity and obj_collide0, and (not landed) the script becomes e5e_fly exactly when variable 5 is 0; with variable 5 = 3 no script starts."
