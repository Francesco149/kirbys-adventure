[[claim]]
id = "en25b.e5e.tables"
about = ["e5e_scripts", "e5e_tick_toss", "e5e_tick_wait", "e5e_tick_fly", "e5e_fly"]
text = "e5e_scripts is e5e_fly, 25:BB91 (both bank $25) and 22:8144. The record 39:8EDC: half sizes 8 and 8, flags $10, inhale number $FF, hurt byte 8, score entry 0, and one reaction: hit points gone 22:8100, with 19:B2A0 and 16:A9CE for the kinds 2 and 3. The record 39:8EC4: the same six bytes with the reactions inhaled 22:8003, hit points gone 22:8100, kind 2 19:B2A0, kind 3 16:A9CE."
kind = "static"
expect = "[(u8(O('e5e_scripts') + i) | u8(O('e5e_scripts') + 3 + i) << 8, u8(O('e5e_scripts') + 6 + i)) for i in range(3)] == [(A('e5e_fly'), 0x25), (0xBB91, 0x25), (0x8144, 0x22)] and [u8(O('39:8EDC') + i) for i in range(24)] == [8, 8, 0x10, 0xFF, 8, 0, 0, 0, 0, 0x00, 0x81, 0x22, 0, 0, 0, 0, 0, 0, 0xA0, 0xB2, 0x19, 0xCE, 0xA9, 0x16] and [u8(O('39:8EC4') + i) for i in range(24)] == [8, 8, 0x10, 0xFF, 8, 0, 0x03, 0x80, 0x22, 0x00, 0x81, 0x22, 0, 0, 0, 0, 0, 0, 0xA0, 0xB2, 0x19, 0xCE, 0xA9, 0x16]"

[[claim]]
id = "en25b.e5e.fly_speed"
about = ["e5e_fly"]
text = "The asm instruction at 25:BB7D (3F:E26A with $02A0) leaves the X velocity $02A0, negated when obj_dir has bit 7 set, and the set_vy behind it has the operand $FE80 (5 executions exist)."
kind = "vmop"
op = "asm_w"
at = "25:BB7D"
on = ["w1-v2-opus@15860+6", "w1-v2-sonnet@23868+6", "cov-minigame-arena@27097+6", "cov-minigame-arena-lose@27097+600"]
min = 5
use = ["en25b_model"]
expect = "b25_w(wr, 0x60E0 + rd[0x6E], 0x60F2 + rd[0x6E]) == b25_neg(0x02A0, rd[0x61DC + rd[0x6E]]) and [rom[O('25:BB82') + i] for i in range(3)] == [0xC4, 0x80, 0xFE]"

