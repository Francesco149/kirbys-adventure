expect = "wr[0x27] == 0xC4 and wr[0x28] == 0x8E and (not ran('25:BBBE') or ('obj_gravity' in calls and 'obj_collide0' in calls and rd[0x6224 + rd[0x6E]] in (0, 3) and (b25_script(wr, A('e5e_fly')) if rd[0x6224 + rd[0x6E]] == 0 else not b25_new(wr, rd[0x6E]))))"
