the bottom on the grass; main@108075, asleep on the ledge right of Kirby with what it breathes out above it). Its
inhale number is $0A; by its look and its sleep the game's Noddy. The kinds $31 and $32 create it with variable 1
= 0 or 1, its class. Bank 22, the position routine obj_pos_cull, the pose table 30:8F62, obj_param = the class
(obj_param_set), 2 hit points (variable 0), and from 25:AB79 (where the tick routines of the sleep and of the fall
would come back to; never ran): velocity 0, obj_face_kirby, tick routine e2e_tick_walk, e2e_timer (variable 2 = the
frames until it falls asleep), the X velocity of the class (asm_vx_tab with e2e_walk_tab: $0080, $0100), and from
25:AB89 (e2e_fall joins here) the two poses of its direction (0 and 2, + 1 facing left) for 13 or 10 frames each
(asm_tab_wait), for ever.
"""

