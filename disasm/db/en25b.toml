text = "The six set_vy instructions of e5e_start give the block the Y velocities $FC00, $FE00, $FF00, $0100, $0200, $0400 in this order (at 25:BB52, BB57, BB5C, BB61, BB66, BB6B)."
kind = "vmop"
op = "set_vy_w"
on = ["w12-opus@13555+50", "w1-v2-opus@15617+50", "w1-v2-sonnet@23818+50", "cov-minigame-arena@27047+50"]
min = 20
expect = "addr not in (0xBB52, 0xBB57, 0xBB5C, 0xBB61, 0xBB66, 0xBB6B) or (args == [{0xBB52: 0xFC00, 0xBB57: 0xFE00, 0xBB5C: 0xFF00, 0xBB61: 0x0100, 0xBB66: 0x0200, 0xBB6B: 0x0400}[addr]] and b25_w(wr, 0x6104 + rd[0x6E], 0x6116 + rd[0x6E]) == args[0])"
use = ["en25b_model"]

