unit = "en25b"
title = "Object types $2D, $2E, $58, $2F, $1A, $1B, $48, $5E, $0A: bank 25 from 25:A9A5"
summary = """
Bank 25 from 25:A9A5 to the end of its code (25:BD8C): six enemies, a mid-boss, and two things that these create,
in the pattern of the units en24a and en24b (a first script that sets the object up, scripts that are behaviours,
tick routines that begin with the hit test 3F:E31D and a record of bank 39 and start another script through
obj_set_script when something changed). In every type variable 0 is the hit points and obj_param the class that
the room's kind gave it in variable 1.

Type $2D (e2d_*; kinds $2F, $30; inhale number $11): a green ball with a face that bounces through the room. From
the ground (15 frames squashed, e2d_land) it jumps with a random height of three (e2d_pick_vy: -3, -4 or -5 pixels
per frame, gravity $20) and the X velocity 1 pixel per frame the way it faces; class 1 turns to Kirby and takes 1.5
with one chance in two (e2d_pick_vx). At a wall it turns round and sticks to the wall for 15 frames (e2d_wall), at a
ceiling it sticks for 15 frames and comes down with its velocity reversed (e2d_ceiling). Variable 3: low four bits
the animation count of e2d_anim, high four bits the height drawn.
Type $2E (e2e_*; kinds $31, $32; inhale number $0A): a green creature with a striped cap, by its look and its sleep
the game's Noddy. It walks (0.5 or 1 pixel per frame) without ever stepping off a ledge (e2e_edge looks at the
blocks ahead), for 120 or 240 frames (variable 2), then sleeps (e2e_sleep: variables 3 : 2 = 480 frames) and
breathes out an object of type $58 every 64 frames.
Type $58 (e58_start): that breath: a small sprite that drifts up for 48 frames and ends; no tick routine, no hit
test. The only spawn record of the ROM with this type is the one in e2e_sleep.
Type $2F (e2f_*; kinds $62-$66; inhale number $0E): an orange creature with pointed ears, in three behaviours by
variable 0. 2 (e2f_tick_hover): it flies level at 0.75 pixels per frame and bobs through eight phases of Y
velocity (variable 5 the phase, variable 3 the frames left in it, variable 6 the rounds left), stretching the
phases that bring it nearer to Kirby's height. 1 (e2f_walk): it walks toward Kirby at 0.5 pixels per frame and
once in every cycle of 217 frames (variable 3 the frame, variable 5 the random frame of the hop) hops straight up;
variable 6 = 1 once it has walked off an edge, after which it turns at edges. 0 (e2f_lurk): it runs at 1 pixel per
frame and, when Kirby is within 48 pixels in X and not below it, leaps (e2f_leap): up at 2 pixels per frame,
steering toward Kirby's side.
Type $1A (e1a_*; kinds $4F, $5E, $5F, $AC): the coconut in a palm tree. It hangs until Kirby's X is within 8
pixels of its own, then falls (gravity $15 with limit 3, or $30 with limit 4 by class) and bursts on the ground
(the script 22:8180).
Type $1B (e1b_*; kinds $33, $34): a pink creature that moves in lurches: a cycle of four phases with the X
velocities 1, 0.5, 0.25 and 0 pixels per frame (variable 2 the phase; e1b_step), 8, 8, 16, 16 frames long for class
0 and 4, 4, 6, 6 for class 1. It falls off edges and walks on where it lands. It tests for water under it and where
it is created (e1b_water_here); the two that were created in water sank at a quarter pixel per frame.
Type $48 (e48_*; kinds $B0, $B1; inhale number $0D): the mid-boss Mr. Frosty, 20 hit points. It stands for 90 or
60 frames (variable 2), then e48_tick_stand draws one of three actions by weights that depend on the last ones
(variable 6 is the row): the charge (e48_charge: back away, then run at Kirby), one or three high hops on the spot
(e48_hop), or the block of ice (e48_ice: it makes an object of type $5E above its head, steps or jumps back for 49
frames while the block goes up and comes down, then lunges forward and lets the block fly: e48_swing). A hit makes
it blink for 32 frames in which nothing hurts it (variable 5). With its hit points gone (e48_beaten) the room's
lock ends, it is thrown back, bounces (e48_bounce), lies flickering for 210 frames in which it can be inhaled
(e48_down), shakes for 30 frames and bursts (22:8162). Variable 3 holds the slot of its block (or of the child of
type $59 that the charge creates).
Type $5E (e5e_*): Mr. Frosty's block of ice: 48 frames up and down by six fixed velocities, then it falls until
its variable 5, which e48_ice set to 3, is set to 0 by e48_swing: then it flies along its direction at 2.6 pixels
per frame, bouncing, and breaks at a wall (22:8144). The only spawn record of the ROM with this type is the one in
e48_ice.
Type $0A (e0a_*; kinds $E0-$EF): an enemy on show that stands still to be inhaled (the pedestal of the museum, and
alcoves in the stages): one of 16 looks by variable 0, with the inhale number of that look in variable 4
(e0a_abilities), which the inhale of unit hit takes for this type instead of the record's byte.

Open:
- Never ran in any movie (not described beyond what the listing shows, no claims): the scripts 25:ABA0 / 25:ABA7
  and the code 25:ACA0 (type $2E without a floor while asleep), 25:ABD5 (its fall for class 1), the waking of type
  $2E (25:AC35-25:AC6B) and both exits of e2e_tick_fall; in type $2F the scripts 25:ADBA, 25:AF2E, 25:AF3E, 25:AF4E,
  25:AF6D, 25:AF77, 25:AFA6 with the tick routines 25:B075, 25:B0B3, 25:B0C7, 25:B0E1, 25:B12D and the tables at
  25:B177 and 25:B183-25:B190 (entries 2-7 and $0A of e2f_scripts: by their bytes a creature that teleports to the
  top of the screen, one that creates an object of type $0D, and more), the end of the hover after six rounds
  (25:AE18), the leap's exits at a ceiling and above the screen, its steering from the left, its slow pose
  (25:B061), the landing of e2f_tick_drop; in type $1B the scripts 25:B270 and 25:B280 (in water under it: by
  their bytes a far call of 21:9952), the landing of e1b_tick_sink and a floor in e1b_tick_wet; in type $48 the scripts
  25:B3EB, 25:B451, 25:B470, 25:B485, 25:B4AE, 25:B5AB, 25:B5D0 with the tick routines 25:B696, 25:B839, 25:B85B,
  25:B899, 25:B953 and the helpers 25:BACD-25:BAF3 (entries 5, $0A-$0C, $0E-$10 of e48_scripts; row 4 of
  e48_choice is reached only after a charge, which happened once and ended with the creature beaten), every exit of
  e48_tick_charge but the hit, the wall exits of the walks, e48_far freeing it, the hit paths of e48_hit_air; in
  type $5E the script 25:BB91 with the tick routine 25:BC27, the landing in e5e_tick_wait, e5e_tick_fly freeing it;
  13 of the 16 looks of type $0A.
- Type $2D ran almost only in main (class 1 from main@118619), e2e_tick_fall 4 times, e2f_leap for one object,
  e2f_drop for one, e1b_wet twice, the charge of type $48 once (cov-minigame-arena@27284), e48_tick_shake in two
  movies: their claims have what these calls carry, and where a path exists in one movie only the two windows are
  the same frames of a copy of that movie or two parts of the one stretch.
- Which creatures the types $2D, $2F and $1B are in the game's own names is not stated by anything in the ROM; the
  descriptions say what the pictures show. What the inhale numbers ($0A, $0D, $0E, $11) are as abilities belongs
  to Kirby's units.
- What the two classes of type $1A's variable 0 look like (pose 6 or 7 of 32:8934) was not compared in pictures.
- 22:8553 (a random index by limits), 22:8F32 / 22:8F69 (store into a variable of another object), 22:85B0 /
  22:859F (an effect at the object's place), 22:9591 (a child of type $59), 22:8FC6, 22:8C05 / 22:8C19 (X position
  forward / backward), 22:8CD9 (Y velocity 0), 22:86C5, 22:9F68 / 22:9F79 (tables by block shape), 3E:DED0 (a
  script's spawn), 3E:DE4B (a script's sound), 3E:DFDF (a random number for a script), 3F:E26A (an X speed toward
  the side the object faces), 3F:E2B6 (Kirby's script becomes 14:A1BB), 3F:E6E8, the scripts 22:8003, 22:8100,
  22:8144, 22:8162, 22:8180 and the reactions 19:B2A0 and 16:A9CE are used by address; the claims check what this
  unit relies on.
- The object types 8 (created by e48_bounce and e5e_fly with variable 0 = 1) and $59 are other units'.
- The pose tables 30:8F2F ($2D), 30:8F62 ($2E, $58), 30:8FBE ($2F), 32:8934 ($1A, $1B), 31:8BCD ($48, $5E) and
  those of the exhibits keep their address names in unit sprites. Sound numbers ($0E landing, $22 step, $34 hit,
  $40 beaten, $45 leap, $4E the block) are named by where the scripts play them.
- The tick models take the answers of the hit test and of the bank 22 tests from the branches the tick routine
  took, not from the room; "no script started" is checked as "obj_set_script did not reset this object's tick
  pointer".
"""

# ================================================================= shared model

[[model]]
name = "en25b_model"
code = '''
E1A_GRAV = [0x15, 0x30]
E1A_LIMIT = [3, 4]
E1B_POSE = [2, 0, 0, 0]
E1B_VX = [0x0100, 0x0080, 0x0040, 0x0000]
E1B_WAIT = [8, 8, 16, 16, 4, 4, 6, 6]
E1B_ROW = [0, 4]
E1B_SCRIPTS = [0xB251, 0xB262, 0xB270, 0xB280, 0xB278, 0xB288]
E2E_TIMER = [0x78, 0xF0]
E2E_VX = [0x0080, 0x0100]
E2E_WAIT = [13, 10]
E2E_FALL = [0xABCD, 0xABD5]
E48_STAND = [90, 60]
E48_HOPS = [0, 2]
E48_N = [7, 7, 3, 5, 6]
E48_THR = [[1, 3, 7], [1, 3, 7], [1, 3, 0], [1, 0, 5], [0, 2, 6]]
E48_NEXT = [[4, 3, 1, 0], [4, 3, 2, 0], [4, 3, 0, 0], [4, 0, 1, 0], [0, 3, 1, 0]]
E48_GRAV = [0x00, 0x20, 0x10, 0x20, 0x10, 0x20]
E48_SCRIPTS = [0xB3FE, 0xB4B8, 0xB4DA, 0xB3D5, 0xB3F7, 0xB3EB, 0xB422, 0xB4BB, 0xB573, 0xB60F, 0xB485, 0xB3DC, 0xB451, 0xB63C, 0x8003, 0xB470, 0xB4AE]
E2D_VY = [0xFD00, 0xFC00, 0xFB00]
E2D_POSES = [0, 2, 1, 2]
E0A_ABIL = [0x01, 0x05, 0x00, 0x04, 0x03, 0x11, 0x0A, 0x0E, 0x02, 0x12, 0x07, 0x08, 0x10, 0x0B, 0x0C, 0x0D]
E2F_BITS = [0x00, 0x01, 0x01, 0x01, 0x00, 0x80, 0x80, 0x80]
E2F_VY = [0x0000, 0x0080, 0x0100, 0x0080, 0x0000, 0xFF80, 0xFF00, 0xFF80]
E2F_HOPS = [0x1B, 0x36, 0x36, 0x51, 0x51, 0x51, 0x6C, 0x6C, 0x87, 0x87, 0xA2, 0xA2, 0xA2, 0xBD, 0xBD, 0xD8]
E2F_ACCEL = [0x0019, 0xFFE7]
E2F_SCRIPTS = [0xAF10, 0xAF9A, 0xAF3E, 0xAF2E, 0xAF4E, 0xAF77, 0xAFA6, 0xAEEA, 0xAE59, 0xAE44, 0xADBA, 0xAE5C]

def b25_script(wr, addr, bank=0x25):
    """obj_set_script gave a thread the address addr in this bank."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == bank for t in range(32))

def b25_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def b25_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def b25_neg(v, d):
    """v, negated as a 16-bit number when the direction d has bit 7 set."""
    return (-v) & 0xFFFF if d & 0x80 else v

def e48_near(rd, s, slot):
    """What e48_block_near answers for the object in this slot."""
    if slot >= 18 or rd[0x6128 + slot] & 0x80:
        return 2
    dx = abs(b25_s16((b25_w(rd, 0x82 + s, 0x94 + s) - b25_w(rd, 0x82 + slot, 0x94 + slot)) & 0xFFFF))
    return 0 if dx < 10 else 1

def b25_new(wr, s):
    """obj_set_script ran for the object in slot s (it resets the object's tick pointer)."""
    return (0x627E + s) in wr

def b25_spawned(wr, typ):
    """The slots 9-17 in which the call created an object of this type."""
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]
'''

# ================================================================= type $1A

[[script]]
at = "25:B1C7"
name = "e1a_start"
desc = """
First script of object type $1A: a coconut that hangs in a palm tree and falls when Kirby comes under it
(main@11790, at the right edge under the palm's leaves; main@11850 in its fall). The kinds $4F, $5E, $5F and $AC
create it with variable 0 = 0 or 1 and variable 1 = 0 or 1. The pose table 32:8934, pose 6, tick routine
e1a_tick_hang, then obj_setup with 2: 2 hit points in variable 0, obj_param = variable 1 as created (the class of
its fall), the position routine obj_pos_cull, bank 22. Created with variable 0 = 0 it takes pose 7 instead of 6
(the inc_pose at 25:B1DA). Then the thread parks; everything else is the two tick routines.
"""

[[sym]]
at = "25:B1DC"
name = "e1a_tick_hang"
desc = """
Tick routine of the coconut while it hangs. 3F:E31D with the record 39:8E34 (a box of 8 x 8, no flags, inhale
number $FF, touching it hurts Kirby, score entry 1, the reactions of an ordinary enemy); carry set: nothing more.
When the absolute difference between its world X and Kirby's is below 8, the tick routine becomes e1a_tick_fall
(written into obj_tick_lo / obj_tick_hi directly; the script stays parked).
"""
comments = { "B1E7" = "world X - Kirby's world X", "B1FF" = "within 8 pixels: it lets go" }

[[sym]]
at = "25:B20F"
name = "e1a_tick_fall"
desc = """
Tick routine of the falling coconut. obj_water_test, 3F:E31D with the record 39:8E34; carry set: nothing more.
obj_gravity_ax with e1a_gravity[obj_param] and the limit e1a_gravity[2 + obj_param], then obj_collide0: when it
lands, the script becomes 22:8180 of bank 22 (by unit en24c the star burst that has a hit test of its own: the
coconut bursts on the ground).
"""

