[[sym]]
at = "25:ACD4"
name = "e2e_edge"
desc = """
The walk of type $2E. obj_walk_level; without a floor it returns carry clear. It turns back when obj_walk_level
reports a wall or a slope (bit 0 of A), or when the block 10 pixels ahead (by the sign of the X velocity) and 16
below the position has a shape that the table 22:9F68 marks (nothing to walk on: an edge), or when the block 10
pixels ahead at its own height has a shape that the table 22:9F79 marks. Turning back (25:AD13): the same two tests
10 pixels behind; only when neither marks the block does it turn (obj_turn_pose); in every case the position is put
on the middle of its block (low four bits of X = 8, of Y = 9) and obj_copy_world. So it never walks off a ledge.
"""
