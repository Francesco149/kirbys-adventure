    dx = e2a_delta(rd, wr, 0x60E0 + s, 0x60F2 + s)
    dy = e2a_delta(rd, wr, 0x6104 + s, 0x6116 + s)
    if d & 0x1F or dx not in (0, 0x4D, -0x4D) or dy not in (0, 0x4D, -0x4D):
