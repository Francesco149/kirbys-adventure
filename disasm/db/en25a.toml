# ================================================================= type $2B

[[script]]
at = "25:A2F5"
name = "e2b_start"
desc = """
First script of object type $2B: a small creature with a blue helmet that walks up to Kirby and strikes with a
blade (main@4957: in the middle of the picture, the white arc at its left is the stroke). Kind $2E creates it; its
inhale number is 3. The script maps bank 22, installs obj_pos_cull and the pose table 30:8D6D, obj_param_set, 2 hit
points (variable 0), the tick routine e2b_tick_fall, and joins the loop of poses of e2b_walk at 25:A31A: it falls to
the floor first. (25:A304, the on_tick of this script, is also the script e2b_edge would start without a floor.)
"""

[[script]]
at = "25:A30B"
name = "e2b_walk"
desc = """
Type $2B walks toward Kirby (entry 0 of e2b_scripts_lo; e2b_tick_fall starts it at the landing): obj_face_kirby, X
velocity $0080 toward that side (3F:E26A), tick routine e2b_tick_walk, variable 2 = 0. From 25:A31A the loop of
poses that the other scripts share: the pose of its direction for 10 frames, then two further three times (8, 8 and
10 frames) and two back twice (8 frames each).
"""

[[script]]
at = "25:A325"
name = "e2b_attack"
desc = """
Type $2B within $40 pixels of Kirby (entry 1 of e2b_scripts_lo). Tick routine e2b_tick_attack, velocity 0,
obj_face_kirby, variable 2 = 3, variable 5 = obj_dir (the direction of the lunge). random below 4: not 0 (three
times in four): e2b_slash_down, then with a second random number of 0 e2b_slash_up from 25:A39F (without the
wait); 0: e2b_slash_up, then with a second random number of 0 e2b_slash_down from 25:A379. Then e2b_retreat.
"""

[[script]]
at = "25:A35E"
name = "e2b_retreat"
desc = "Type $2B after its strokes: variable 2 = $5A (the frames it backs away); from 25:A361: tick routine e2b_tick_retreat, obj_face_kirby, X velocity $0080 away from the side it faces (asm_vx with -$0080), and the loop of poses of e2b_walk."

[[script]]
at = "25:A370"
name = "e2b_slash_down"
desc = """
Called by e2b_attack: variable 3 = $FF (e2b_tick_attack leaves the velocity alone), the pose 8 of its direction
(the blade raised) for 16 frames. From 25:A379 (where a second stroke and e2b_parry enter): a new object of type
$57 (e57_start, the blade's box) at its place in a slot of 9-17, variable 3 = 0 and variable 6 = 1 (the lunge of
e2b_tick_attack begins on the next frame), then the poses $0A to $16 of its direction, two apart and two frames
each; the velocity is cleared before the last. Returns.
"""

[[script]]
at = "25:A396"
name = "e2b_slash_up"
desc = "Called by e2b_attack: as e2b_slash_down with the poses in the other order: the pose $16 for 16 frames, and from 25:A39F a new object of type $57, variables 3 and 6, and the poses $14 down to $08, two frames each."

[[script]]
at = "25:A3BC"
name = "e2b_parry"
desc = """
Type $2B when one of Kirby's shots is near (entry 2 of e2b_scripts_lo, from e2b_tick_walk): velocity 0, tick
routine e2b_tick_parry, and with a random number below 4: 0 the stroke of e2b_slash_down from 25:A379, else the
stroke of e2b_slash_up from 25:A39F, both without the wait. Then with variable 2 = 0 e2b_walk (variable 2 not 0
would go to e2b_retreat at 25:A361; that never ran).
"""

[[sym]]
at = "25:A41A"
name = "e2b_tick_walk"
desc = """
Tick routine of type $2B while it walks. e2b_hit_walk; carry set: nothing more. e2b_edge. Then the distance in X
between its world position and Kirby's (slot 1): below $40 the script becomes e2b_attack. Otherwise e2b_shot_near:
carry clear (a shot is near) the script becomes e2b_parry.
"""

[[sym]]
at = "25:A44F"
name = "e2b_tick_attack"
desc = """
Tick routine of type $2B during e2b_attack. e2b_hit_attack; carry set: nothing more. e2b_edge: when it turned the
object (carry clear) variable 5 gets $80 added (the lunge goes the other way). With bit 7 of variable 3 set (the
blade is raised) nothing more. Otherwise variable 6 counts down; at 0 it becomes 3 and the X velocity becomes entry
variable 3 of e2b_lunge_lo / _hi (7 further when bit 7 of variable 5 is set, the leftward half), and variable 3
goes up by one: the lunge loses speed every three frames.
"""

[[data]]
at = "25:A48F"
len = 14
name = "e2b_lunge_lo"
format = "bytes"
desc = "Low bytes of the X velocities of the lunge, by step: rightward $0480, $0300, $0240, $0180, $00C0, $0060, 0; then the same leftward. The steps 5 and 6 were never read."

[[data]]
at = "25:A49D"
len = 14
name = "e2b_lunge_hi"
format = "bytes"
desc = "High bytes of the X velocities of the lunge."

[[sym]]
at = "25:A4AB"
name = "e2b_tick_retreat"
desc = "Tick routine of type $2B while it backs away. e2b_hit_walk; carry set: nothing more. e2b_edge. Variable 2 counts down; at 0 the script becomes e2b_walk. Otherwise it ends in e2b_shot_near, whose answer nobody reads (a shot nearby only changes obj_dir)."

[[sym]]
at = "25:A4C3"
name = "e2b_set_script"
kind = "part"
desc = "The tick routines of type $2B jump here with Y = 0-2: obj_set_script for the current object with entry Y of e2b_scripts_lo / e2b_scripts_hi in bank 25."

[[data]]
at = "25:A4D6"
len = 3
name = "e2b_scripts_lo"
format = "bytes"
desc = "Low bytes of the scripts of e2b_set_script: 0 e2b_walk, 1 e2b_attack, 2 e2b_parry."

[[data]]
at = "25:A4D9"
len = 3
name = "e2b_scripts_hi"
format = "bytes"
desc = "High bytes of the scripts of e2b_set_script ($A3 three times)."

[[sym]]
at = "25:A4DC"
name = "e2b_shot_near"
desc = """
Is one of Kirby's shots near? For the slots 6, 7, 8 that hold an object: 22:8679 and 22:8665 give the distance in Y
and in X between it and the current object; the first with less than $0E in Y and less than $30 in X ends the
search: obj_dir = the direction to the object in slot 6 (obj_aim_at with Y = 6, whichever slot was near), carry
clear. None: carry set.
"""
out = "carry clear: a shot is near, and obj_dir points at slot 6"

[[sym]]
at = "25:A50D"
name = "e2b_edge"
desc = """
The walk of type $2B, for its three tick routines on the ground. obj_walk_level; without a floor (never seen) the
caller is abandoned and the script becomes 25:A304. It turns round when obj_walk_level reports a wall or a slope
(bit 0 of A), or when the block 8 pixels ahead (by the sign of the X velocity) and 16 below the position has a shape
that the table 22:9F68 marks (nothing to walk on: an edge), or when the block 8 pixels ahead at its own height has
a shape that the table 22:9F79 marks. Turning: the X velocity negated, obj_face_kirby, the pose of that direction
(the even pose it had, + 1 facing left), and the position is put on the middle of its block (low four bits of X =
8, of Y = 9). In every case obj_copy_world.
"""
out = "carry set: it walked on; carry clear: it turned"

[[sym]]
at = "25:A585"
name = "e2b_tick_fall"
desc = "Tick routine of type $2B from its creation to the floor. e2b_hit_attack; carry set: nothing more. obj_gravity, obj_collide0. Landed (carry set): sound $0E and the script e2b_walk. A wall (bit 0 of A) would turn it (obj_turn_pose; never ran)."

[[sym]]
at = "25:A5AD"
name = "e2b_tick_parry"
desc = "Tick routine of type $2B during e2b_parry: e2b_hit_attack and nothing else."

[[sym]]
at = "25:A5B1"
name = "e2b_hit_attack"
desc = "3F:E31D with the record 39:8DA4 (a box of 8 x 8, flags 0, inhale number 3, hurt byte 8, score entry 8; inhaled 22:8003, hit points gone 22:8100); when the hit test left the carry clear, obj_water_test2 (in water the object gets the script 22:833B and the caller does not go on)."
out = "carry set: the hit test changed the object"

[[sym]]
at = "25:A5BE"
name = "e2b_hit_walk"
desc = "As e2b_hit_attack with the record 39:8D8C, which holds the same bytes."
out = "carry set: the hit test changed the object"

