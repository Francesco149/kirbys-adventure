def e2a_delta(rd, wr, lo, hi):
    if lo not in wr:
        return 0
    return e25_s16((e25_w(wr, lo, hi) - e25_w(rd, lo, hi)) & 0xFFFF)

def e2a_chase_tick(rd, wr, ran, writes):
    s = rd[0x6E]
    v2, v3, v9 = 0x61EE + s, 0x6200 + s, 0x626C + s
    if rd[v9]:
