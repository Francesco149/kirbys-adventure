name = "e2a_free"
desc = """
The parasol on its own: the object of a killed carrier, or the object e2a_drop created (variant 8). 16 pixels up,
pose $0A, 1 hit point (variable 0), obj_face_kirby and then half a turn added to obj_dir (it faces away from Kirby),
the speed $0066 along obj_dir (3F:E23C), Y velocity 0, variable 9 = $20 (the frames before it can be hit), tick
routine e2a_tick_free, and the thread parks.
"""

