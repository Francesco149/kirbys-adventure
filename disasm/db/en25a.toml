unit = "en25a"
title = "Object types $2A, $2B, $57 and $2C: the first enemies of bank 25"
summary = """
The enemies of bank 25 from 25:A000 to 25:A9A3: for each type its scripts, the 6502 routines the scripts install as
the per-frame tick or call through the asm opcodes, and the tables between them. As in bank 24 (unit en24a) a script
is a behaviour and its tick routine is what can end it: the tick routine passes the type's 24-byte record of bank 39
to the hit test 3F:E31D (unit hit), asks the helpers of bank 22 (units ohelp, ocoll) where the object stands and
starts another script through obj_set_script when something changed. Variable 1 is obj_dir; every type gets 2 hit
points in variable 0 and the position routine obj_pos_cull (off the screen it is deleted).

Type $2A (e2a_*; kinds $26-$2D give the variant 0-7 in variable 0): an enemy that carries a parasol. Variable 3 is
the variant, and it decides everything: which enemy of bank 24 is under the parasol (e2a_base_type: variants 0, 2, 5
type $0F, variants 1, 3, 6 type $0E, variants 4, 7 the cannon $10; the variant picks the poses 0-3, 4-7 or 8-9 of
30:8CA4), what happens when it lands (variable 5 = e2a_rec_kind[variant]: 0 = it keeps the parasol and walks on;
1 and 2 = the parasol comes off as a new object of type $2A with variable 0 = 8, and the object itself becomes the
type under it, with that type's first script) and what the loose parasol does (e2a_free_kind: variants 0-4 it rises
ever faster and leaves the screen, variants 5-7 it follows Kirby for 256 frames). The carrier walks at 0.75 pixels per
frame and turns at walls (the cannon stands); with no floor under it it sinks at 0.5 pixels per frame and sways left
and right (variable 2 is the phase, 0-$5F, of e2a_sway_lo / e2a_sway_hi). When its hit points are gone the object
itself becomes the loose parasol (pose $0A; variable 9 = $20 frames in which it cannot be hit; obj_param = the
variant; variables 2 and 3 are then a 16-bit frame count for the one that follows Kirby).
Type $2B (e2b_*; kind $2E): a small creature with a blue helmet and a blade (main@4957, in the middle, the white arc
left of it is its stroke). Its inhale number is 3. It falls to the floor, walks toward Kirby at 0.5 pixels per frame
and turns at walls, edges and blocks (e2b_edge); within $40 pixels of Kirby it stops, raises the blade for 16 frames
and strikes downward or upward (one time in four upward first; one time in four a second stroke the other way) while
it lunges forward with a speed that falls from 4.5 pixels per frame (e2b_lunge_lo / e2b_lunge_hi; variable 3 is the
step, $FF while it raises the blade, variable 6 counts the three frames of a step, variable 5 is the direction of the
lunge). Then it backs away from Kirby for $5A frames (variable 2) and walks again. A shot of Kirby (slots 6-8) within
$30 pixels at its height makes it strike on the spot (e2b_parry).
Type $57 (e57_*) is the blade of type $2B: an object without a picture that every stroke creates (sound $3A). For 14
frames its tick routine puts it where the blade is in the parent's pose (e57_dx_lo ... e57_dy_hi; the parent's slot
is in variable 2) and tests its box of 16 x 24 pixels (record 39:8DBC: it hurts Kirby and nothing can happen to it).
Type $2C (e2c_*; kinds $60, $61 give obj_param 0, 1): a creature that sits on the ground and jumps (main@6856, upper
right, in the air; by its behaviour on land and in water a frog). On land (e2c_stand): it waits, then picks at
random (e2c_choose; variable 2 counts the decisions and its parity picks one of two rows of odds) a jump on the spot,
a high jump, either of them forward, a jump backward, or (only when variable 6 is not 0) it looks about a few times
first. Variable 5 is the gravity of the jump ($80 or $40). When the block 8 pixels above its position is water it
swims (e2c_swim, e2c_tick_swim): it sinks slowly on every second frame while variable 6 is not 0, turns at walls,
and when it is out of the water again it leaps out (e2c_leave_water).

Open:
- Never ran in any movie, read from the code only or left out: e2a_water finding water (25:A24F: the parasol comes
  off); entry 1 of e2a_scripts_lo / _hi; the turn at a wall in e2b_tick_fall (25:A595); e2b_edge without a floor
  (25:A512, which starts the script at 25:A304: e2b_tick_fall again); the end of e2b_parry for variable 2 not 0
  (25:A3D7); in e2c_tick_swim a landing or a ceiling (25:A8FF: obj_dir mirrored about $40 and 22:8503); of the swim
  strokes (e2c_strokes) everything but the beginning of the first and the third (25:A7C5-A7DD, 25:A7E0-A819,
  25:A83B-A84A, and 25:A81F).
- Never touched and not described: script bytes at 25:A3DA-A419 and code at 25:A5CB-A5FE (between the scripts and the
  routines of type $2B), code at 25:A8A4-A8B0.
- Table entries no movie read: e2a_base_lo / _hi / _bank / _type for the variants 0, 1, 2, 4, 5 (only the variants 3,
  6 and 7 were seen to lose the parasol at a landing or a hit); e2a_free_kind entries 4 and 5; e2a_rec_kind entry
  9; the rows of e2a_steer for obj_param 1-3; e2b_lunge entries 5 and 6 of each side; e2c_snap_dirs but for one
  entry.
- The reaction 25:A0A3 (e2a_struck) is in the records 39:8D5C (damaged) and 39:8D44; it ran only for the cannon.
- 22:886F (the velocity steps toward the octant of obj_dir with the caller's table), 22:8553 (a random index by a
  table of limits), 22:8679 / 22:8665 (the distances e2b_shot_near compares), 22:9F68 / 22:9F79 (two tables by
  block shape that e2b_edge reads), 22:82EB (a script of 6 frames that every struck object calls), 3F:E26A / 3F:E23C
  (a velocity from an operand), 3E:DED0 (creates an object from eight operand bytes) and 3E:DE4B (a sound) are used
  by address; the claims check what this unit relies on.
- Object type $0D (24:B9FC picks a script of bank 22 by variable 0) is what e2a_killed creates with variable 0 = 5
  and what the parasol that followed Kirby becomes with variable 0 = $0A; what those scripts show is not in this
  unit. Neither are the scripts 22:8003 (inhaled), 22:8100 (hit points gone) and 22:833B (water).
- Which of the two looks under the parasol (poses 0-3, poses 4-7) is which was seen for one picture only
  (main@12500, the round walker of type $0E); the names of the creatures are not in the ROM. The sound numbers ($0D,
  $0E, $1F, $3A) are known by where the scripts play them.
- The pose tables 30:8CA4 (type $2A), 30:8D6D ($2B), 30:8EED ($2C) keep their address names in unit sprites.
- The tick models take the answers of the hit test, obj_walk0, obj_walk_level and obj_collide0 from the branches
  the routine took, not from the room.
- e2b_shot_near always aims at slot 6, whichever of the slots 6-8 was near (25:A501); whether that is intended is
  not known.
"""

# ================================================================= shared model

[[model]]
name = "en25a_model"
code = '''
E2A_REC = [0x8D2C, 0x8D5C, 0x8D44]
E2A_REC_KIND = [0, 0, 1, 1, 2, 1, 1, 2, 3, 3]
E2A_TYPE = [0x0F, 0x0E, 0x0F, 0x0E, 0x10, 0x0F, 0x0E, 0x10]
E2A_BASE = [0xA149, 0xA000, 0xA149, 0xA000, 0xA325, 0xA149, 0xA000, 0xA325]
E2A_CHASES = [0, 0, 0, 0, 0, 1, 1, 1]
E2A_SWAY = [0x0100, 0x0080, 0x0020, 0xFFE0, 0xFF80, 0xFF00, 0xFF00, 0xFF80, 0xFFE0, 0x0020, 0x0080, 0x0100]
E2B_LUNGE = [0x0480, 0x0300, 0x0240, 0x0180, 0x00C0, 0x0060, 0x0000,
             0xFB80, 0xFD00, 0xFDC0, 0xFE80, 0xFF40, 0xFFA0, 0x0000]
E57_DX = [-10, 20, 20, -10, 10, -20, -20, 10]
E57_DY = [-10, -10, 10, 10, -10, -10, 10, 10]
E2C_ODDS = [[3, 4, 8, 9, 11, 16], [1, 2, 9, 13, 15, 16]]
E2C_ODDS_MAX = [11, 15]
E2C_SNAP = [0x40, 0x00, 0x80, 0x40, 0xC0, 0x80, 0x00, 0xC0,
            0x00, 0x40, 0x40, 0x80, 0x80, 0xC0, 0xC0, 0x00,
            0x20, 0x20, 0x60, 0x60, 0xA0, 0xA0, 0xE0, 0xE0]

def e25_script(wr, lo, hi, bank=0x25):
    """obj_set_script gave a thread the address hi:lo in the bank."""
    return any(wr.get(0x6380 + t) == lo and wr.get(0x63A0 + t) == hi and wr.get(0x63C0 + t) == bank for t in range(32))

def e25_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def e25_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def e25_fwd(rd, v):
    """The velocity v along the facing of the current object."""
    return -v & 0xFFFF if rd[0x61DC + rd[0x6E]] & 0x80 else v

def e25_grav(v, add, lim):
    """obj_gravity_ax: add to the Y velocity, with the limit in pixels per frame."""
    v = (v + add) & 0xFFFF
    return lim << 8 if not ((v >> 8) - lim) & 0x80 else v
'''

[[claim]]
id = "en25a.kinds"
about = ["e2a_start", "e2b_start", "e2c_start"]
text = "In the tables of unit rooms (13:A9D2 type, 13:AAD2 variables 0 and 1 as low and high nibble) the kinds $26-$2D are type $2A with variable 0 = 0-7 and variable 1 = 0, kind $2E is type $2B with both 0, kinds $60 and $61 are type $2C with variable 1 = 0 and 1."
kind = "static"
expect = "[u8(O('13:A9D2') + k) for k in range(0x26, 0x2F)] == [0x2A] * 8 + [0x2B] and [u8(O('13:AAD2') + k) for k in range(0x26, 0x2F)] == [0, 1, 2, 3, 4, 5, 6, 7, 0] and [u8(O('13:A9D2') + k) for k in (0x60, 0x61)] == [0x2C, 0x2C] and [u8(O('13:AAD2') + k) for k in (0x60, 0x61)] == [0x00, 0x10]"

# ================================================================= type $2A

[[script]]
at = "25:A000"
name = "e2a_start"
desc = """
First script of object type $2A: an enemy under a parasol (main@12500, on the ledge at the right: a round walker
holding a red and white parasol over its head), and also the parasol on its own. Kinds $26-$2D create it with the
variant 0-7 in variable 0; e2a_drop creates it with 8. The script maps bank 22, installs the position routine
obj_pos_cull and the pose table 30:8CA4 and calls e2a_setup. For the variant 8 (the register is 0) it goes to
e2a_free at 25:A079; otherwise it runs on into e2a_walk.
"""

[[script]]
at = "25:A00F"
name = "e2a_walk"
desc = """
Type $2A on the ground (also entry 0 of e2a_scripts_lo: a variant that keeps its parasol lands here). Tick routine
e2a_tick_walk, X velocity $00C0 toward the side it faces (3F:E26A). Then the picture, in a loop from 25:A018: the
pose of its direction (obj_pose_dir0), and by variable 3 through a jump table: variants 0, 2, 5 that pose, variants
1, 3, 6 the pose four further, each for 10 frames and then the pose two further for 10 frames (two steps of a
walk); variants 4 and 7 (the cannon) velocity 0, the pose eight further, and the thread parks.
"""

[[script]]
at = "25:A03B"
name = "e2a_float"
desc = """
Type $2A walked off a floor (entry 2 of e2a_scripts_lo): it turns toward Kirby (obj_face_kirby), the tick routine
becomes e2a_tick_float, the velocity 0 and then $0080 downward (half a pixel per frame; the tick routine adds the
sway), and the same loop of poses as in e2a_walk follows (the cannon parks without stopping).
"""

[[script]]
at = "25:A068"
name = "e2a_killed"
desc = """
The reaction "hit points gone" of the records 39:8D2C (from 25:A068: first the script 22:82EB that every struck
object calls) and 39:8D5C (from 25:A06B). A new object of type $0D with variable 0 = 5 at its place in a slot of
9-17 (3E:DED0), e2a_free_param (obj_param = the variant, variable 3 = 9), and the script runs on into e2a_free: what
is left of the object is its parasol.
"""

[[script]]
