unit = "cov11"
title = "What the eleventh batch of coverage movies ran first, and the batch's unreachable branches"
summary = """
What the 21 movies of the eleventh batch ran for the first time (tas/tasks/cov11-*.md; the triage that chose them
is tas/tasks/triage/b11-verdict-c1..c4.md), and the branches of that triage that the code itself rules out.

The fish of room 50 (type $18 variant 0). cov11-a-flee: the fleeing fish flees straight left; once its X velocity
sits at the limit and its Y velocity is 0 a steering step changes neither (24:B057), and e18_tick_flee starts
e18_pause_flee (24:AF90): tick routine e18_tick_flee_test and the pause's pose loop, until it leaves the screen
(e18_tick_flee_test's own exit, both velocities changed, 24:B075, never ran: $11 was 0 in its six steering frames).
cov11-a-chase: in a pause a step that changes both velocities (Kirby jumped out of the water above and right of the
fish) starts the chase again (24:B001-B010, the script 24:AF6A). Both run the pause loop's second half (24:AF82).

Room 61's type $1B (cov11-a-sink): it sinks to the pool floor (e1b_tick_sink lands, 25:B30C: e1b_wet), walks there
with e1b_tick_wet (25:B2EB) and Kirby's water spit hits it.

The knights of bank 27. cov11-b-lance (room 264): the flyer climbs above screen Y 32 and e34_st_fly holds it there
(27:B502); an axe knight with Kirby above it and the random number 1 jumps and throws (27:ADDC: e33_jump_axe).
cov11-b-lleap: the leaping lance knight's last landing with Kirby 40 pixels away or more (27:B61B) starts
e34_throw_spear: a crouch, a hop with Y velocity -2 (state 2, e34_st_fall) and a thrown spear, type $31 with
variable 0 = 5 (e31_thrown5): Y velocity -1 or -3.5 by Kirby's height (e31_thrown5_aim, e31_thrown5_vy), gravity
$17 a frame (e31_thrown5_tick), freed below screen Y $D0, hit record e31_thrown5_rec in bank 27 itself.
cov11-b-axedash (room 292): a dashing axe knight that leaves the screen is put back at the edge, turned and sent
back (27:AD0A, e33_edge_x). cov11-b-trident (room 106): with Kirby within 32 pixels at its ledge's end the trident
knight hops back (27:B343: e35_hop_back, state 2).

cov11-b-e3a: the only class-1 type $3A (room 111) makes its slide choice with random below 3 (26:B434).

The mid-bosses. cov11-c-shell (room 62, never loaded before): the shell's bounce lands (29:A9A0:
e4b_var5_param sets variable 5 = 1 for class 0, e4b_rock, 29:AA60, e4b_idle), its small shell plays out its poses
(29:ADE4), e4b_leap's loop ends (29:A7F2), and a shot hits it during its leaps (29:AC4D: e4a_blink). cov11-c-arena7:
room 113's lower door and the arena rooms 114-126 (the class-0 turtle, shell, beetle and mane: rooms 116, 122, 124,
126), with the class-0 mane plan step (2A:A301) and type $48's hit while it jumps back (25:B8ED). cov11-c-lion (room
301): the stage room's class-0 mane: plan step 2A:A301, e4d_param_random's class-0 answer (2A:A499), the slow-down
to 0 (2A:A0EA), and e4d_flame_a's tail (the flame hop, 2A:A522-A543). cov11-c-mane: the burning dash meets the wall
in a dash pose (2A:A142), state 10: e4d_wall_bounce (2A:A5EF), whose asm_vel_dir operands end on a page boundary (the first run
of 22:9382). cov11-c-wheel (room 209): the small wheels roll into walls (2A:AE8B: entry 8 of e49_scripts in bank
22, 22:8180) and turn their floor speed for a leftward roll (2A:AEA9). cov11-c-runner (room 220): the runner's third
change of side (2A:BE9B) starts e1c_leave (2A:BE4D): it leaps off the top of the screen with e1c_tick_hit.
cov11-c-wiz: the last boss's tenth placement (29:B6F2) and e4e_order's entries 7-9; attack 0 with variable 7 not 0
(e4e_stars_b, 29:B480).

The bosses of part D. cov11-d-mole: a slide into Heavy Mole's body and lower claw on one frame: both reactions of
kind 1 (2C:AFFA, 2C:B83B: kirby_knock_back). cov11-d-ddd: King Dedede below $21 hit points (2D:AC07: the X speed
$0220), his flight at the upward limit -$0180 (2D:B1F1), a shot in his fall after a flight (2D:AAE6), Kirby on his
right at swing 2 (2D:A818). cov11-d-kracko: Kracko's choices while Kirby floats high (row $10), on the left side
(e3d_choose_0), right of $50 on side 1 and floating low; attack 3 right after attack 3 (e3d_pick_alt); state 1 of
the fight (e3d_fs_slide, e3d_slide_vx), and the mirrored halves of the lightning sweep (2F:AB7F) and of attack 2
(2F:AD84). cov11-d-eye: e3d_st_after's reset (2F:A3EC) and e3d_near answering carry set (2F:A1FA, 2F:A594) with
the negative variable 5 path of e3d_watch (2F:A1A5). cov11-d-saucer: the saucer ends a pass with Kirby far in
height (2B:A158) and its climb ends at the first probe (2B:A0C8). cov11-d-paint: Paint Roller's mark doubled
(2C:A23A) and the random-bit pick (2C:A201).

The entries e18_pause_flee, e18_tick_flee_test, e33_jump_axe, e33_edge_x (was e33_st_tab_tail), e35_hop_back,
e34_throw_spear, e34_st_fall, e31_thrown5 and its tick, aim, speeds and record, e4b_var5_param, e1c_tick_hit,
e3d_choose_0, e3d_fs_slide, e3d_slide_vx and e3d_pick_alt were never = true in units dead_en1 / dead_en2; the
script tails e4b_leap_tail, e4b_bounce_tail, e4b_shell_tail, e4d_flame_hop, e4d_jump_up_tail (a part of
e4d_wall_bounce, not of e4d_jump_up), e31_thrown5_rest and e3d_sweep_l_rest are now parts of their scripts.

Unreachable, by the code (static verdicts of the batch's triage, each checked against the ROM; claims below):
- e12_slope_test: lda #$00 / beq at 24:AA6B: always taken.
- e4c_pick: lda #2 / jsr random / clc / adc #2 / bne at 28:A458: random below 2 is 0 or 1, the sum 2 or 3, never 0.
- e24_tick_fly: lda #$78 / sta / bne at 2B:A151: the fall-through of 2B:A156 never runs (2B:A158 is reached from
  2B:A13C / 2B:A142, the far-in-height side, which cov11-d-saucer ran).
- e44_pick_route: and #$03 / bpl at 2C:A1FD: the fall-through of 2C:A1FF never runs (2C:A201 is the target of the
  bpl at 2C:A1EC, which cov11-d-paint took).
- e4d_grip_pose: ldy #$01 / bne at 2A:A805: always taken; 2A:A809 only by the beq at 2A:A801.
- e3d_glide_start: ldy #$FE / bne at 2F:A669: always taken.
- e3d_choose_0 / e3d_choose_1's floating test: e3d_choose has already sent a floating Kirby with Y below $61 to row
  $10, and nothing between writes $00-$02, so the bcs at 2F:A9B5 and 2F:A9DF is always taken: 2F:A9B7-A9C1 and
  2F:A9E1-A9EC (rows 0 and 8 of e3d_choices) are dead. The triage counted 2F:A9DB-A9EC (18 bytes) reachable; only
  2F:A9DB-A9DE is.

Open:
- e18_tick_flee_test's exit back to e18_flee (both velocities changed, 24:B075-B086), e1b_tick_wet's wall, the
  hop-back script's loop after two poses (27:B19C-B1A1; the knight landed), e34_st_fall without a landing,
  e31_thrown5_aim's Y = 0 entry ($FC80), the airborne third change of the runner (2A:BECF, entry $0C),
  e4d_wall_bounce's jmp 2A:A2A5 (2A:A613), the blink-time slide into Heavy Mole (2C:AF83), e46_hit's 2C:AFA7.
- The rooms 114-126, 62, 209 and 301 hold more never-run branches than the movies took (the triage lists them).
- The static verdicts on room maps, object lists and value ranges (23:A2F0, 23:B019, 23:BEA1, 26:A30D, 26:A43B,
  26:A6F7, 26:A727, 27:A53D, 27:AA46, 27:AAF5, 27:BD05, 28:B186, 28:B1C6, 29:BCD3, 2B:B756, 2B:B75C, 2B:B7C5,
  2C:B1CF, 2D:B184, 2E:A995) are not claimed here.
"""

[[model]]
name = "cov11_model"
code = '''
def slide_ok(rd, wr, x):
    """e3d_fs_slide by $0787: 0 starts the slide toward the other side, odd tests the stop, even ends the attack"""
    m = rd[0x787]
    if m == 0:
        side = 1 if rd[0x82 + x] >= 0x80 else 0
        if wr.get(0x786) != side or (wr.get(0x60F2 + x), wr.get(0x60E0 + x)) != ((0x01, 0x40), (0xFE, 0xC0))[side]:
            return False
        m = 1
    else:
        side = rd.get(0x786)
    if m & 1:
        wx = rd.get(0x6074 + x, wr.get(0x6074 + x))
        stop = wx >= 0xB0 if side == 0 else wx < 0x50
        if not stop:
            return 0x788 not in wr and 0x785 not in wr
        t = 0xB0 if side == 0 else 0x50
        return (wr.get(0x786) == 1 - side and wr.get(0x82 + x) == t and wr.get(0x6074 + x) == t
                and wr.get(0x60F2 + x) == 0 and wr.get(0x60E0 + x) == 0 and wr.get(0x788) == 1 and wr.get(0x785) == 3)
    return wr.get(0x788) == 1 and wr.get(0x785) == 3 and 0x787 not in wr

def neg16(hi, lo):
    return (-(hi << 8 | lo)) & 0xFFFF
'''

