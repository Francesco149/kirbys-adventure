unit = "unread_sys"
title = "Poses, sprite groups and packed streams no movie read, read by force: banks 35, 37 and 3A, and the groups and streams nothing points to"
summary = """
After batch 12 these bytes stayed "described": a `format` claim covers them, and no movie read them. Every claim here
is an `effect` claim whose `nr(...)` counts the bytes the treated run read as data (the control run, the movie
untouched, reads none).

The draw recipe (unread_sys_draw, 26 claims, from main@5000). All 18 slots are frozen (obj_tick_bank = $80 held) and
hidden (obj_sprite_bank = $80); the active list is held to slots 1-n, each with a bank, a table address, a draw routine
(pose_draw for tables of poses, sprites_draw for tables of groups), obj_pos_camera at X 128, Y 120 and the camera held
at 0; and obj_run_all's pose load at 3E:CD3F is patched to `lda obj_frame / and #mask`, so every slot draws entry
obj_frame & mask of its table, a new entry each frame, for mask + 4 frames. A table of N pointers gets slots at
entries 0 and N - (mask + 1) when N is not a power of two. Groups no pointer names (the NO POINTER rows: mirrors and
copies in banks 30, 32, 33, 35, the groups at 38:A536 / A5E3 and 3A:99D6) are drawn through pointer lists held in RAM
at $7000 + $80 * slot (inside room_map, which nothing else uses while every object is frozen). Every pose table of
banks 35, 37 and 3A with an unread entry is drawn whole, so the claims read the tables too. sprites_35_93F3 and
sprites_37_96B1 are claimed by the ranges the corpus never read (the treated run reads 364 of 399 and 183 of 998
bytes of them).

The packed streams (5 claims). The two older staff pages (old_13_credits_1 / _2) through entry $2D of
packed_13_lo / hi on the staff roll (the first one expands to exactly what packed_13_BE72 expands to); the German
Star Rod text old_38_pause_rod through entry 0 of pause_desc_lo / hi; the desert halves packed_3C_A697 / A3FE
through the stream address in qd_desert_draw (3C:A1E5 / A1E9): they expand to the left and the right 1,024 bytes of
packed_3C_A7C9.

Who could draw them (the verdicts):

Not reachable.
- pose_tab_37_8000 entries 0-$41 (poses_37_8088 but its last two poses): 66 poses of Kirby alone, with CHR bank
  $D0. The four sprite_map instructions that name the table (23:ADFA, 23:B308, 23:BD3B, 23:BE19, the Warp Star) are
  followed only by poses $42 / $43 (the star with Kirby; e06_demo_pose, e06_arrive_80_pose, set_pose_w) and $FF
  before the next sprite_map; the flights that show Kirby alone switch to pose_tab_1A_8000 or bank 1C first.
- pose_tab_35_8896 entry 7 (lvcard_w5): the scripts set 0, 2, 3, 5, 8 and step by one to 1, 4, 6, 9 only.
- pose_tab_37_8406 entry 12 (the cannon's shot, 23:A831): set_pose_w $0C has wait 0 and the inc_pose_w after it
  runs in the same frame, so pose 12 is never on screen when obj_run_all draws.
- pose_tab_3A_87CE / 88AF (the claw with its doll as one picture) and every NO POINTER group: nothing names them
  (units dead_sys, dead_en2).
- The packed streams: no table names them (units bank_ends, dead_sys).

Reachable, never played (leads).
- Crane Fever's prize picture (crane_prizes, pose_tab_3A_9589 by crane_prize_rows): pose 0 one small doll, 2 two
  small, 3 small then big, 4 big then small, 5 two big; the corpus won only one big doll (pose 1). Winning other
  dolls draws the rest; the first credit's picture (pose_tab_3A_9651, crane_prize1_pic) entries 0 and 2 belong to
  the same results.
- Crane Fever's claw holding a doll of look 1 (crane_claw_look with the doll's variable 4 = 1: the whole table at
  3A:8D2F, most of pose_tab_3A_8D29 and the groups behind it); crane_claw_look ran three times, all with look 0.
  Entries 0, 1, 3 and 7-12 of the look-0 table (pose_tab_3A_8D0F) are the claw's other heights or steps.
- Quick Draw's hat landing in round 4 (qd_hat_land, pose_tab_3A_978C pose = round: entry 4).

Unsure (no instruction found that names the entry; the objects step or add to their poses, so a path that was not
played may reach it): pose_tab_35_93A5 (the level cards' Kirby: 3, 4, 7, 13-17, 19, 21, 22, 25), pose_tab_37_86CA
38/39 (type $22, pose arithmetic), pose_tab_37_8A5A 12-20 even and 32-49 (type $4D, a whole run of 18 poses),
pose_tab_37_9342 10/12 (type $25), pose_tab_37_93F2 0, 19, 20, 26-29 (the last fight, bank 36), pose_tab_37_967D
entry 2 (set only by 3D:AAB3, part 1 of the title object, which no spawn in the corpus creates), pose_tab_37_9A97
48/49 (the ending), the Egg Catcher tables pose_tab_3A_8160 14/15, pose_tab_3A_8337 1-3 and 12 (King Dedede),
pose_tab_3A_85DE 8-11 (the chick), the crane's pose_tab_3A_8652 entries 4 and 9, 3A_89C0 9/10 (the claw after a
drop), 3A_96EE 3 (the credit sign, pose = crane_credits), and Quick Draw's pose_tab_3A_971A 15-19 (pose = round +
5 * step), 3A_974C 24, 3A_9B40 9, 3A_9DEF 0 (3C:ADEE never ran), 3A_9E9C 6/7 and 3A_9EAC 3, 6, 7 (the result board,
set_pose_var; the path that sets variable 2 = 5 never ran).

Open:
- The unsure entries above: which state draws each, and whether a movie can reach it.
- What the 66 Kirby poses of poses_37_8088 were for (a Warp Star ride with Kirby drawn apart from the star?).
"""

[[model]]
name = "unread_sys_unpack"
code = '''
def unpk(o):
    """unpack's expansion of the stream at PRG offset o (unit unpack's format) -> list of bytes"""
    out = []
    while rom[o] != 0xFF:
        b = rom[o]
        if b & 0xE0 == 0xE0:
            c, n, h = b >> 2 & 7, ((b & 3) << 8 | rom[o + 1]) + 1, 2
        else:
            c, n, h = b >> 5, (b & 0x1F) + 1, 1
        a = o + h
        if c == 0:
            out += list(rom[a:a + n]); k = n
        elif c == 1:
            out += [rom[a]] * n; k = 1
        elif c == 2:
            out += [rom[a], rom[a + 1]] * n; k = 2
        elif c == 3:
            out += [(rom[a] + i) & 0xFF for i in range(n)]; k = 1
        else:
            r = rom[a] << 8 | rom[a + 1]; k = 2
            for i in range(n):
                v = out[r - i] if c == 6 else out[r + i]
                out.append(int(bin(v | 256)[3:][::-1], 2) if c == 5 else v)
        o += h + k
    return out
'''

