unit = "dead_en1"
title = "Code and data no movie reaches in banks 22-2A: the objects' helpers and the first enemy banks"
summary = """
The never-touched bytes in the middle of the banks 22-2A (the bank ends are unit bank_ends'), each named with
never = true and described from its bytes in the vocabulary of the units that own the neighbours, plus five
effect claims that make the most interesting of them run.

What there is, the most interesting first:
- The Warp Star Stations (23:ADAB e06_world_star and its routines) are now in the corpus (cov8-warp-star) and
  documented in unit cov8; their never-run neighbours stay here.
- The cannons' other shots (23:A70C-23:A9EF). e06_shot_kind gives shot kind 1 to world 6 (index 6; the cannon of
  kind $F9 in room $A6, which main passed at frame 123360 without being fired: reachable, never played) and to world 4
  with variable 1 = 1; kind 3 only to world 5 with variable 1 = 1. Both entries with variable 1 = 1 belong to the kind
  $FA, which no room lists, and no entry is 2: kinds 2 and 3 are unreachable. Kind 1 fires Kirby up and
  to the right with the camera following in both axes, kind 2 straight right, and kind 3 makes the cannon itself fly
  off, no flying Kirby being created (dead_en1.cannon.kind1-3 patch the world 3 entry; unused/dead_en1-cannon-1/-2/-3.png). In the X
  follower of kind 1 each axis's test clears the other axis's wait bit.
- A lives counter test (22:9385 obj_s_lives_count): a script subroutine that counts an object's variable 5 down from
  60 and writes it into lives every frame; no script calls it (dead_en1.lives_count.run, unused/dead_en1-lives-count.png).
- Behaviours of enemies that no room can start: the Blipper's variant 2 (24:B152, kind $1F in no room list), type
  $1E's variant 7 (26:A4A6-26:A626, kinds $A9 / $AA in no list: a creature that hops in arcs, walks and drops on a
  random plan of its own), the lance knight's throw (27:B40B) of a thing (type $31 variable 0 = 5, 27:B9AA) whose hit
  record sits in bank 27 instead of bank 39, the axe knight's jumping throw, the mane mid-boss's side spawn of a
  second hit area (2A:A000 / 2A:A665), the squid's scripts entered only from never-run branches (26:A06B, 26:A2C2).
- Type $2B's shake (25:A3DA e2b_resist): it gives back an inhale (inhale_coming - 1), holds its place and shakes,
  with its own hit tests in bank 22 (22:80C4 / 22:80E0) and the save / restore of its X from type $48's helpers
  (25:BACD / 25:BADA); dead_en1.e2b_resist.start shows its tick leaving at once when nothing inhales it.
- Helpers of bank 22 that nothing calls: obj_turn_pose_vy, obj_vx_accel (the X twin of obj_vy_accel),
  obj_integrate_world, objs_free_other_types, abs_diff8, obj_thread_save / obj_thread_restore (park and resume an
  object's script), two asm routines and two script entries just before live scripts (22:8000, 22:8338).
- Tails of live scripts that the static decoder cannot reach (after an asm_w or an endloop): museum exhibits 0, 3,
  6-8, $0B, $0D-$0F of type $0A, loops of types $38, $3B, $4C, $4D and others; small pads and one copy (29:BA70 = the
  32 bytes at 25:A222).

Claims: one static claim per bank says that no decoded instruction and no byte pair in the bank names any entry
except those listed, and pins its first bytes; the effect claims above run the code.

Open:
- What the hit records 39:8AD4 / 39:8B04 that obj_hit_8ad4_var4 and obj_hit_8b04_keep4 use answer, and so whether
  e2b_resist really is an inhale struggle, is not checked: no effect claim inhales a type $2B with the patch.
- The claims load the star room by poke; the station's message screen and what Kirby looks like when he comes in by
  the door are seen in the task's run, not claimed. The worlds of the other $F9 cannon rooms ($53, $12B, $145) are not
  checked; any of them in world 6 would also fire kind 1.
- en23 calls e06_hub_rooms "the room of each world's hub"; the rooms $1E-$24 are the star rooms that the hubs' doors
  of kind $1D lead to.
"""

# ================================================================= shared model

[[model]]
name = "dead_en1_model"
code = '''
def fmt(p):
    return f"{p >> 13:02X}:{cpu(p):04X}"

def named(at):
    """lo / hi byte pairs equal to the CPU address of `at` in its own bank, and, for bank 22 (always at $8000, so a
    script of any bank can name its helpers), the pairs that sit in the operand bytes of decoded script instructions
    of any bank; as 'BB:AAAA'."""
    o = O(at)
    b = o >> 13
    return sorted(fmt(p) for p in ptrs(at)
                  if (p >> 13) == b or (b == 0x22 and kind(p) == "t" and kind(p + 1) == "t"))

def dead(at, r=(), n=()):
    """The decoded instructions naming it (refs) are exactly r, and the byte pairs of named() exactly n."""
    return sorted(fmt(p) for p in refs(at)) == sorted(r) and named(at) == sorted(n)

def hx(at, s):
    b = bytes.fromhex(s.replace(" ", ""))
    o = O(at)
    return rom[o:o + len(b)] == b
'''

