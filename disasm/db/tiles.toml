# ------------------------------------------------------------------ scrolling

[[sym]]
at = "13:A7D0"
name = "scroll_init"
desc = "Sets the scroll state to the camera: drawn_x = cam_x, drawn_y = cam_y, scroll_x = cam_x, spawn_cam_x / spawn_cam_y = the low bytes; room_cell of the camera gives scroll_y (also left in $12) and the cell (in $10); $11 = the low byte of cam_x. $0573 and $0574 get the high bytes of cam_y and cam_x."
out = "$10 = the camera's cell, $11, $12 = its pixel inside the cell"

[[sym]]
at = "3F:E6F3"
name = "scroll_update"
desc = """Follows the camera, once per frame; does nothing when $051E is 0. With $051E = 1: scroll_x = cam_x. When bit 4 of the low byte of cam_x differs from spawn_cam_x, 3F:E945 is called for the column of objects that came into reach, and objs_spawn_row likewise for cam_y and spawn_cam_y; both bytes are then set to the camera's. scroll_dir becomes 7 when the low byte of scroll_x is above scroll_x_prev and 0 when it is below. While scroll_x + scroll_dir and drawn_x differ in bits 3-7 of the low byte, scroll_col draws a column, the one at drawn_x going left or at drawn_x + 256 going right, and drawn_x moves by 8. While cam_y and drawn_y differ in bits 3-7, scroll_row draws a row, at drawn_y - 8 going up or drawn_y + 184 going down, and drawn_y moves by 8. Last, scroll_y = the camera's Y inside its cell, and 13:AF9B and 13:A8E6 are called. In room $000C block rows are copied inside the map first; with $051E from 2 to 5, 13:A804 runs instead of the first part."""
comments = { "E717" = "$051E = 1", "E71F" = "room $000C only", "E799" = "16 pixels further in X: objects", "E7D1" = "16 pixels further in Y: objects", "E813" = "columns", "E876" = "rows", "E8C0" = "scroll_y, then 13:AF9B and 13:A8E6" }

[[sym]]
at = "3F:EB59"
name = "scroll_row"
desc = "Draws the row of tiles at a Y position, for scroll_update: tiles_row with the cell and pixel of X = scroll_x + scroll_dir + 8, Y = the position given (room_cell). Bank 12 is mapped at $8000 for the call."
in = "A = high byte and Y = low byte of the Y position"
out = "A = low byte of drawn_y"

[[sym]]
at = "3F:EB7E"
name = "scroll_col"
desc = "Draws the column of tiles at a column of the room, for scroll_update: tiles_col with X = the low byte of drawn_x inside screen column A, starting 8 pixels above the Y position given; when that is above the cell, in the cell one room row up (cell - room_width, Y + 184). Bank 12 is mapped at $8000 for the call."
in = "A = screen column, X = high byte and Y = low byte of the Y position"
out = "A = low byte of drawn_x"

[[ram]]
at = "00EA"
name = "scroll_y"
desc = "The camera's Y inside its cell (0-191): the vertical scroll position. Set by scroll_update and scroll_init, read by the interrupt's 3E:C3A4."

[[ram]]
at = "00EB"
len = 2
name = "scroll_x"
desc = "The X position the picture is scrolled to: scroll_update copies cam_x into it when $051E is 1."

[[ram]]
at = "056F"
len = 2
name = "drawn_x"
desc = "X position up to which columns of tiles have been drawn: scroll_update moves it by 8 with each column, until it agrees with scroll_x + scroll_dir to 8 pixels."

[[ram]]
at = "0571"
len = 2
name = "drawn_y"
desc = "Y position up to which rows of tiles have been drawn: scroll_update moves it by 8 with each row, until it agrees with cam_y to 8 pixels."

[[ram]]
at = "0577"
name = "scroll_x_prev"
desc = "Low byte of scroll_x at the last scroll_update, to tell the direction."

[[ram]]
at = "0578"
name = "scroll_dir"
desc = "7 after scroll_x last moved right, 0 after it moved left (room_draw sets 0). Added to scroll_x before the comparison with drawn_x."

[[ram]]
at = "057B"
name = "spawn_cam_x"
desc = "Low byte of cam_x when scroll_update last looked: a change of bit 4 calls the column spawner 3F:E945."

[[ram]]
at = "057C"
name = "spawn_cam_y"
desc = "Low byte of cam_y when scroll_update last looked: a change of bit 4 calls objs_spawn_row."

# ------------------------------------------------------------------ claims

[[claim]]
id = "tiles.attr_set.model"
about = ["attr_set", "nt_attr"]
text = "Every call of attr_set writes, besides $0D and $0E, exactly two bytes of nt_attr: the block's 2-bit field set to A in the byte for plane row Y and in the byte for plane row Y + 12, as the model computes them from the values the bytes had."
kind = "call"
fn = "attr_set"
on = ["main@600+14", "w3-sonnet@3325+8", "w12-opus@700+14", "attract@1240+30"]
min_calls = 200
max_calls = 400
expect = "{k: v for k, v in wr.items() if k not in (0x0D, 0x0E)} == both(rd, a, x, y)"
model = '''
def both(rd, v, bx, by):
    w = {}
    for p in (by, by + 12):
        nt, r = (0, p) if p < 15 else (1, p - 15)
        k = 0x66ED + nt * 64 + (r >> 1) * 8 + (bx >> 1)
        s = (bx & 1) * 2 + (r & 1) * 4
        w[k] = w.get(k, rd[k]) & ~(3 << s) & 0xFF | v << s
    return w
'''

[[claim]]
id = "tiles.attr_set.cases"
about = ["attr_set"]
text = "The windows of tiles.attr_set.model hold calls for block rows 3-11, whose second copy lies in the second name table with the field's vertical half exchanged, and each of them writes two different bytes of nt_attr, the second at offset 64 or more."
kind = "call"
fn = "attr_set"
on = ["main@600+14", "w12-opus@700+14"]
min_calls = 100
max_calls = 400
where = "y >= 3"
expect = "len([k for k in wr if 0x66ED <= k < 0x676D]) == 2 and max(k for k in wr if 0x66ED <= k < 0x676D) >= 0x672D"

[[claim]]
id = "tiles.attr.palette"
about = ["attr_set", "attr_put"]
text = "block_attr holds only the values 0-3 (the index attr_set and attr_put build from it stays inside their 16-entry tables), and not all of them are 0."
kind = "frames"
on = ["main@700+3", "w3-sonnet@3330+3", "main@70000+3", "w12-opus@9000+3"]
always = "all(ram[0x7E00 + i] < 4 for i in range(256))"
sometimes = "any(ram[0x7E00 + i] for i in range(256))"

[[claim]]
id = "tiles.attr.tables"
about = ["attr_col", "attr_row", "attr_flip", "attr_at", "attr2_at", "attr_mask", "attr_bits", "blk_attr_col", "blk_attr_row", "blk_attr_flip", "blk_attr_at", "blk_attr2_at", "blk_attr_mask", "blk_attr_bits"]
