[[sym]]
at = "12:8170"
name = "tiles_row"
desc = """Draws one row of 32 tiles. $10 is a cell, $11 and $12 a pixel inside it. The row is tile row $12 / 8 of the screen (0-23): the upper tiles of its blocks when bit 3 of $12 is clear (block_tile_0, block_tile_1), the lower ones otherwise (block_tile_2, block_tile_3). It takes 16 blocks starting at block column $11 / 16 of the cell and continuing in cell + 1, and puts each block's two tiles in the line buffer $0100 at twice its column, so the buffer is in name table order. Each block's palette goes to nt_attr (attr_set). Then four ppu_write calls: the 32 tiles to row r of the plane ($2000 + 32 r) and to row r + 24 ($2300... for r < 6, $2800 + 32 (r - 6) otherwise), and the 8 attribute bytes of each of the two rows from nt_attr."""
in = "$10 = cell, $11 = X and $12 = Y inside the cell"
out = "$00-$03, $05, $16, $17 used"
comments = { "8172" = "$00 = cell", "817E" = "$05 = tile row", "818E" = "per block: two tiles and the palette", "81CC" = "past column 15: the next cell", "81DD" = "the row, first copy", "81FC" = "the row, second copy", "820B" = "attributes of the first copy", "822D" = "attributes of the second copy" }

