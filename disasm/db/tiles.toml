name = "attr2_at"
format = "bytes"
desc = "attr_set, by block row: offset in nt_attr of the attribute bytes of the row's second copy, 12 block rows further down the plane."

[[data]]
at = "3F:ECD1"
len = 16
name = "attr_mask"
format = "bytes"
desc = "attr_set, by palette | field * 4: the mask that clears the field."

[[data]]
at = "3F:ECE1"
