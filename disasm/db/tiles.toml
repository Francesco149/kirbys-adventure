        ok = ok and abs(moved) == 8 * ncol
    else:
        ok = ok and 0x56F not in wr and 0x570 not in wr
    if nrow:
        moved = s16((mem(0x571) | mem(0x572) << 8) - (rd[0x571] | rd[0x572] << 8) & 0xFFFF)
        ok = ok and abs(moved) == 8 * nrow
    else:
        ok = ok and 0x571 not in wr and 0x572 not in wr
    ok = ok and not ((lo + d ^ mem(0x56F)) & 0xF8) and not ((cy ^ mem(0x571)) & 0xF8)
    ok = ok and wr[0x57B] == lo and wr[0x57C] == cy & 0xFF and wr[0xEA] == cy % 192
    ok = ok and ('3F:E945' in calls) == bool((lo ^ rd[0x57B]) & 0x10)
    ok = ok and ('objs_spawn_row' in calls) == bool((cy ^ rd[0x57C]) & 0x10)
    return ok
