unit = "tiles"
title = "Tile drawing: blocks to name tables, the attribute copy, scrolling, the PPU write queue"
summary = """How a room's map reaches the screen. A block of the map is 16x16 pixels: four tiles (block_tile_0 top left,
block_tile_1 top right, block_tile_2 bottom left, block_tile_3 bottom right) and a palette number 0-3 (block_attr).
The background is a plane of 32 x 48 tiles: name table $2000 (30 rows) with the first 18 rows of $2800 under it.
A screen of the room is 24 tile rows high, so every tile is written twice, at row r and at row r + 24 of the plane,
and the picture can be scrolled through 192 pixels without a seam. The palette numbers go the same way into
nt_attr, a copy of the two attribute tables (2 bits per block, so each write changes one field of a byte), twice.
tiles_row draws one row of 32 tiles, tiles_col one column of 24, block_draw one block; attr_set and attr_put change
one block's palette in nt_attr. Nothing here writes the PPU itself: everything goes through ppu_write, which
appends a record (length, address, bytes) to the ring ppu_queue while the display is on (render_on); the interrupt
routine has ppu_flush send the records up to a budget per frame. With the display off ppu_write writes at once,
and an address in $3Fxx goes to the copy of the palette at $6000 instead (palette, sent whole by palette_send).
scroll_update runs once per frame of play: it compares the camera with drawn_x / drawn_y and has scroll_col and
scroll_row draw the column or row that comes into view for every 8 pixels of difference, and calls the object
spawners for every 16 pixels. room_draw (unit rooms) draws a whole screen with 24 calls of tiles_row after
scroll_init.

Open: scroll_update's paths for room $000C (it copies block rows inside the map and can move the camera two
screens left; the second half never ran) and for $051E = 0 or >= 2 (13:A804) are not described, nor the routines
it calls at the end (13:AF9B, 13:A8E6) and the column spawner 3F:E945; the model claim covers $051E = 1 and
leaves room $000C out. The callers of block_draw (13:A804, 13:A93D, 38:A309, 38:AAF8, 3F:EF50) and the other writers of nt_attr
(13:ADCB, 3D:A3FC, 3D:A42B) are not in this unit. No movie scrolls vertically away from a cell's left edge, so
tiles_row with the display on always started at block column 0; rows that run into the next cell were seen in
room_draw only. 3E:C0BE and 3E:C0DA (a record of seven bytes: mode, address, length, count, source; tiles_col uses two) are
described only as tiles_col uses them. ppu_write's claim leaves out sources in ROM and calls that had to wait for
room in the queue; the PPU side of ppu_write, ppu_flush and palette_send (how many bytes reach $2007) is not
checked, the event log has no PPU. $0573/$0574 (written by scroll_init) and what $051E means are not named.
tiles_col sends only the first 96 bytes of nt_attr although the plane's second copy reaches byte 103. screen_lo /
screen_hi are taken as 16 entries (14 were read). block_prop is left to the round on collision. The bottom of the
stack page ($0100-$012F) is the line buffer of all three drawers and of other code; it has no name."""

# ------------------------------------------------------------------ the PPU write queue

[[sym]]
at = "3E:C067"
name = "frame_wait"
desc = "Waits for the next interrupt: clears frame_flag and loops until the interrupt routine (3E:C341) has incremented it. The branch for $35 without bit 7 (polling PPUSTATUS instead) never ran."
out = "A, X, Y unchanged"

[[sym]]
at = "3E:C086"
name = "display_on"
desc = "Sets render_on to $FF and continues as frame_wait. Entered at display_set (3E:C088) the value is A."

[[sym]]
at = "3E:C088"
kind = "label"
name = "display_set"
desc = "Entry of display_on that stores A in render_on."

[[sym]]
at = "3E:C175"
name = "ppu_write"
desc = """Writes $01 bytes at ($16) to PPU address $03:$02; with $00 not 0 the first byte is written $01 times instead. Bit 7 of $03 asks for the address to step by 32 (down a column) instead of 1. Three cases. (1) $03 & $3F = $3F: the bytes go to palette + $02 and no further; for each byte that differs its index is ORed into palette_dirty, and with render_on = 0 palette_send is called. (2) render_on = 0: written at once (PPUCTRL from $35 with bit 2 by bit 7 of $03, PPUADDR, PPUDATA). (3) otherwise a record is appended to ppu_queue at ppu_queue_end: length, $03, $02, the bytes; ppu_queue_end moves on. Before that it calls frame_wait as long as (ppu_queue_start - ppu_queue_end - 1) mod 256 is less than the length + 3."""
in = "$00 = 0 or fill, $01 = length, $02/$03 = PPU address, $16/$17 = source"
comments = { "C17D" = "the palette: compare with the copy, mark what changed", "C1AD" = "display off: write now", "C1E3" = "room in the queue?", "C1F7" = "append length, address high, address low, bytes" }

[[sym]]
at = "3E:C22F"
name = "ppu_flush"
desc = "Called by the interrupt routine with A = $6A, a budget. If palette_dirty is not 0, palette_send is called and the budget is $26 less. Then the records of ppu_queue from ppu_queue_start are written to the PPU (PPUCTRL from $35, bit 2 from bit 7 of the record's address) as long as the budget covers the record's length + 5; ppu_queue_start is left at the first record that was not sent, or at ppu_queue_end."
in = "A = budget"

[[sym]]
at = "3E:C282"
name = "palette_send"
desc = "Writes the 32 bytes of palette to PPU $3F00, with palette + 0 in the first place of each group of four, sets the PPU address to $3F00 and then $0000, and clears palette_dirty."

[[ram]]
at = "0037"
name = "render_on"
desc = "The interrupt routine writes $36 & render_on to PPUMASK: 0 switches the picture off. ppu_write queues when it is not 0 and writes directly when it is 0. Values seen: 0 and $FF."

[[ram]]
at = "0039"
name = "frame_flag"
desc = "Incremented by every interrupt (3E:C341); frame_wait clears it and waits for it to change."

[[ram]]
at = "0040"
name = "ppu_queue_end"
desc = "Index into ppu_queue where ppu_write appends the next record."

[[ram]]
at = "0041"
name = "ppu_queue_start"
desc = "Index into ppu_queue of the first record that has not been sent. ppu_flush advances it; with the picture off the interrupt routine sets it to ppu_queue_end."

[[ram]]
at = "0400"
len = 256
name = "ppu_queue"
desc = "A ring of records for the PPU: length, address high (bit 7: step 32), address low, then that many bytes. Written by ppu_write, sent by ppu_flush in the interrupt."

[[ram]]
at = "0500"
name = "palette_dirty"
desc = "Not 0 when palette has changed since it was last sent: ppu_write ORs the index of each changed byte into it, palette_send clears it."

[[ram]]
at = "6000"
len = 32
name = "palette"
desc = "The copy of the PPU's 32 palette bytes ($3F00-$3F1F). Only ppu_write changes it."

# ------------------------------------------------------------------ attributes

[[sym]]
at = "3F:EC58"
name = "attr_set"
desc = "Sets the palette of one block in nt_attr, in both copies of the plane. The block is column X (0-15), row Y (0-11) of the screen; A is the palette (0-3). First copy: byte (Y / 2) * 8 + X / 2, the 2-bit field picked by the low bits of X and Y. Second copy: the block 12 rows further down the plane (rows 12-14 are the rest of the first attribute table, rows 15-23 the start of the second, where the field's vertical half is the other one). Does not send anything to the PPU."
in = "A = palette, X = block column, Y = block row"
out = "$0D, $0E used"

[[sym]]
at = "12:811C"
name = "attr_put"
desc = "Changes one 2-bit field of nt_attr and sends the byte: nt_attr[A] = nt_attr[A] & blk_attr_mask[X] | blk_attr_bits[X], then ppu_write of that one byte to $23C0 + A (A < $40) or $2BC0 + A - $40."
in = "A = offset into nt_attr, X = palette | field * 4"

[[data]]
at = "3F:EC91"
len = 16
name = "attr_col"
format = "bytes"
desc = "attr_set, by block column: 4 for odd columns (the right half of an attribute byte)."

[[data]]
at = "3F:ECA1"
