model = '''
SCRATCH = (0x00, 0x01, 0x02, 0x03, 0x05, 0x0D, 0x0E, 0x16, 0x17, 0x2000, 0x2006, 0x2007)

def kept(wr):
    return {k: v for k, v in wr.items() if k not in SCRATCH}

def attr(w, rd, v, bx, by):
    for p in (by, by + 12):
        nt, r = (0, p) if p < 15 else (1, p - 15)
        k = 0x66ED + nt * 64 + (r >> 1) * 8 + (bx >> 1)
        s = (bx & 1) * 2 + (r & 1) * 4
        w[k] = w.get(k, rd[k]) & ~(3 << s) & 0xFF | v << s

def plane(p):
    return 0x2000 + p * 32 if p < 30 else 0x2800 + (p - 30) * 32

def queue(w, rd, recs):
    if rd[0x37]:
        i = rd[0x40]
        for addr, data in recs:
            for b in [len(data), addr >> 8, addr & 0xFF] + data:
                w[0x400 + i] = b
                i = i + 1 & 0xFF
        w[0x40] = i

def row(rd, mem):
    cell, px, py = rd[0x10], rd[0x11], rd[0x12]
    t = py >> 3
    lower = 0x200 if py & 8 else 0
    w = {}
    col = px >> 4
    tiles = [0] * 32
    for _ in range(16):
        b = mem(0x68C8 + 192 * rd[0x67F6 + cell] + (py & 0xF0) + col)
        tiles[2 * col] = rd[0x7A00 + lower + b]
        tiles[2 * col + 1] = rd[0x7B00 + lower + b]
        attr(w, rd, rd[0x7E00 + b], col, t >> 1)
        col += 1
        if col == 16:
            col = 0
            cell += 1
    for i in range(32):
        w[0x100 + i] = tiles[i]
    sh = lambda o: [w.get(0x66ED + o + i, mem(0x66ED + o + i) if 0x66ED + o + i not in w else 0) for i in range(8)]
    o1 = (t >> 2) * 8
    p = t + 24
    o2 = (p >> 2) * 8 if p < 30 else 0x40 + (p - 30 >> 2) * 8
    queue(w, rd, [(0x2000 + t * 32, tiles), (plane(p), tiles), (0x23C0 + o1, sh(o1)),
                  ((0x2BC0 if o2 & 0x40 else 0x23C0) + (o2 & 0x3F), sh(o2))])
    return w
'''

