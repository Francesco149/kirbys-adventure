unit = "unread_rooms"
title = "Packed streams no movie unpacks, unpacked by force: the 28 rooms no door leads into and the five tile sets no room names"
summary = """
After batch 12 every byte left at "described" was data that only a `format` claim covers and that no movie read: the
format claim compares readers, so a byte nothing read stays described (kd.levels). This unit reads the packed streams
among them by force, with `effect` claims whose `nr(name)` counts the bytes of a region that the treated run read as
data (the control run, main untouched, reads none).

Rooms. The 28 rooms no door leads into (unit cov12, part C; UNUSED.md "Rooms no door leads into"): 7, 20-23, 127-132,
168, 310, 311, 313-326. Each claim loads one by poke from main@5000, the recipe of cov12's pictures (room + 1 = $FF,
room_return = the room at cell 0, position $55, leave_code 1), and room_load_data has unpack read every byte of its
stream (room_data_lo / hi / bank entry n): 3,378 bytes in 28 regions.

Tile sets. room_tileset holds only 0-28, but tileset_lo / hi / bank also point at streams for the numbers 32, 34, 35,
36 and 48 (29-31, 33 and 37-47 are 0): five tile sets no room names, 2,137 bytes. Each claim patches room 168's
room_tileset entry (12:86C0) to the number and loads room 168 by poke; tileset_unpack reads the whole stream. Drawn
with room 168's block numbers and CHR banks they show no picture worth keeping: which room they were made for is not
known.
"""

[[claim]]
id = "unread.room7"
about = ["packed_10_A114"]
text = "Room 7 loaded by poke from main@5000 (room + 1 = $FF, room_return = 7 cell 0 position $55, leave_code 1): unpack reads all 137 bytes of packed_10_A114, room_data_lo/hi/bank entry 7; the control run reads none of them."
kind = "effect"
on = "main@5000"
frames = 150
poke = { "055F" = 0xFF, "0562" = 7, "0563" = 0, "0564" = 0, "0565" = 0x55, "056A" = 1 }
expect = "nr('packed_10_A114') == 137 and cnr('packed_10_A114') == 0"

