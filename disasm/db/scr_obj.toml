unit = "scr_obj"
title = "Script leftovers of the objects: Kirby's states, effects, items, enemies and bosses"
summary = """
The script runs that ran in the banks of Kirby (14, 15, 17, 18, 21), his effects and shots (16), the goal game, the
items and the ability scene (19) and the enemies and bosses (25-29, 2A, 2B, 2D), and that the owning units named only
by address: entries of jump and call tables, the second threads that spawn starts, subscripts, loops that a jump
reaches, and the scripts that a tick routine or a hit reaction gives with obj_set_script. Each [[script]] runs from
its address over its own jump targets up to the next named script; the names keep the owner's prefix (kirby_s_ for
Kirby's scripts, kfx_ for his effects and shots, abl_show_ for the entries of abl_show, eNN_ for object type $NN). The
descriptions say what the object does in the game while the script runs, from where it comes and where it goes; the
owner units (khelp, kst14, kst14b, kst15, kst17, kst18, kst_rest, kfx, en19, en25a, en25b, en26b, en27, en28, en29,
en2a, en2b, en2d, attract) describe the routines and tables these scripts use.
New here: type $00 (e00_start), the timer of the pictures in the status bar of the tutorial demo.

Every script has a vmop claim on one of its instructions (the first, or the one that sets what the script is about:
a variable, a sound, a pose, a tick routine, kirby_form, kirby_hurt_timer, lives), with min = the executions that the
windows hold; the entries of abl_show, of kirby_s_hurt_knock's call table and the four arcs of the trident share one
claim each, with a case per entry.

Open:
- Many of these scripts ran once, in one movie (the boss of bank 29 at main@135000-137000, e3b_hops_1, the water spit
  of kirby_s_water_spit_side, e2c_dart, e00_start, kfx_heal_freeze); their claims hold one or two executions.
- The paths that never ran inside them are only read from the bytes: kirby_s_hurt_toss with full_or_float_index 1
  (14:A372), e45_sun_sky's 28:AD4F, e45_moon_roll_loop's reverse 28:AE96, e45_moon_sky_pose's other pose (28:AF34),
  e4e_stand's 29:B480, the slower speeds of e2c_dart, abl_show_12 facing left (19:B26E), e00_start's end and its
  branch for demo_number not 0 (18:A3AC), e4d_beaten_wait's exit and the end of e4e_rise. (The loop of e4e_dive_poses
  ran in the third batch, the end of e61_start_1 in the fourth: e61_star_round, unit boss_cov4.)
- What kirby_ability numbers 0, 1, 4, 7, $0C, $0F, $12, $13 are as abilities in the game is not shown here; 9 gives
  the Parasol's form (kirby_s_para_init's pose table) by the tables of unit kst18.
- 29:A1B2 (e4a_brake's loop inside e4a_grab_fall) and the loop labels that the named scripts reach by their own
  jumps are not named separately.
"""

[[script]]
