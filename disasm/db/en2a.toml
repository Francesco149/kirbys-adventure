[[claim]]
id = "en2a.e4d.hit"
about = ["e4d_hit", "e4d_draws", "e4d_set_state"]
text = "e4d_hit: with variable 8 not 0 the draw routine is sprites_draw (bit 1 of variable 8 clear) or sprites_draw_pal1, variable 8 - 1, the record 39:91DC with variable 0 and obj_dir kept; else in state 7 obj_flicker and the record 39:91C4; else the record 39:91AC, and when the hit test changed the object (state 7 then) 3F:E6E8 and e4d_set_state with carry set, otherwise, after a hit that left variable 8 positive, 22:85B0 twice and a sound. obj_near runs exactly when variable 2 is not 0 and Kirby can be caught; it never caught him."
kind = "call"
fn = "e4d_hit"
on = ["main@112750+110", "main@112860+140"]
min_calls = 150
use = ["en2a_model"]
model = '''
def e4d_hit_ok(rd, wr, ran, calls, mem, rp):
    s = rd[0x6E]
    v8 = rd[0x625A + s]
    if ran("2A:A172"):
        return False
    if v8:
        draw = A("sprites_draw") if not v8 & 2 else A("sprites_draw_pal1")
        return ((wr[0x6182 + s] | wr[0x6194 + s] << 8) == draw and mem(0x625A + s) == v8 - 1 and a2_rec(wr) == 0x91DC
            and mem(0x61CA + s) == rd[0x61CA + s] and mem(0x61DC + s) == rd[0x61DC + s])
    if rd[0x626C + s] & 0x0F == 7:
        return "obj_flicker" in calls and a2_rec(wr) == 0x91C4
    if a2_rec(wr) != 0x91AC:
        return False
    if ran("2A:A1D1"):
        if mem(0x626C + s) & 0x0F == 7:
            return ran("3F:E6E8") == 1 and ran("2A:A24D") == 1 and rp & 1 == 1
        return ran("22:85B0") == 2 and "snd_play" in calls and rp & 1 == 0
    return rp & 1 == 0
'''
expect = "e4d_hit_ok(rd, wr, ran, calls, mem, rp)"
cases = { "rd[0x625A + rd[0x6E]] != 0" = 50, "ran('2A:A242')" = 20, "ran('2A:A1DC')" = 1, "ran('2A:A1F1')" = 1, "ran('2A:A16D')" = 20, "ran('2A:A1C7') and not ran('2A:A1D1')" = 70 }

