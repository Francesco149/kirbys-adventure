        and r(0x932C) == [8, 8, 0x10, 0xFF, 8, 0, 0x03, 0x80, 0x22, 0x80, 0x81, 0x22, 0, 0, 0, 0x80, 0x81, 0x22, 0xA0, 0xB2, 0x19, 0xCE, 0xA9, 0x16]
