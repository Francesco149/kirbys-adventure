unit = "en2a"
title = "Object types $1C, $49, $4F, $4D: bank 2A"
summary = """
Bank 2A: four object types in the pattern of the units en24a-en25b (a first script that sets the object up,
scripts that are behaviours, tick routines that begin with the hit test 3F:E31D and a record of bank 39 and start
another script through obj_set_script when something changed). Three of them are mid-bosses of a closed room in the
pattern of type $48 of unit en25b: 25 or 27 hit points, a blink after damage in which nothing harms them, a third
action that differs, and a beaten creature that is knocked back, lies flickering and can be inhaled. "The pose N of
its direction" is obj_pose_dir: pose N with bit 0 flipped when it faces left.

Type $1C (e1c_*; kinds $6B-$6F, inhale number $FF): a small pink creature with a black headband, an ordinary enemy
with 2 hit points, in three behaviours by variable 0. 0 (kinds $6B, $6C) e1c_hop_start: it steps on the spot 1-3
cycles of four poses (10 or 6 frames each by class, variable 2), then e1c_choose draws one of five hops by weights
of its class, never the same hop twice in a row (variable 5 the last): straight up at 3 or 4.5 pixels per frame, at
Kirby, or away from him facing him; it lands (e1c_tick_hop, e1c_tick_hop_back: gravity $20 to 6 pixels per frame) and
starts again. 1 (kinds $6D, $6E) e1c_lurk: it waits until Kirby is within 64 pixels (or 255 / 128 frames), fades out
in 48 frames (e1c_dither: bit 7 of obj_sprite_bank by a pattern of e1c_dither_tab), rides invisibly on Kirby's place
for 60 frames (e1c_tick_follow), comes back 32-48 pixels beside him and up to 64 above (e1c_reappear; it gives up
after 60 refused places) and fades in, then falls. 2 (kind $6F) e1c_run: it runs to a point 64 pixels beside Kirby
on its own side (e1c_steer: $20 more X velocity per frame toward it, cut to 1 pixel per frame when it reaches 3), stays
60 frames when it gets there and changes side (variable 3 the side, variable 6 the count of changes, variable 5 the
stay, variables 8 and 9 the point).

Type $49 (e49_*; kinds $B4, $B5, inhale number 7): a big wheel with one eye and a star (the game's Grand Wheelie), 25
hit points. It stands (shaking, 63 or 42 frames for class 0, 2 for class 1), then jumps (one time in four it rolls
at once): after the jump it spins on the spot for 45 frames and rolls at Kirby at 1.5 pixels per frame
(e49_tick_run); one time in three when Kirby comes within 64 pixels in front of it it feints (e49_feint: brakes,
rolls away, brakes again, rolls on); once it has passed Kirby by 64 pixels it brakes (e49_brake_step: 7 per frame on
a flat floor) and stands again. Every third decision (variable 3, e49_count) is e49_throw: two hops in which it loses
no hit points, then a small wheel (type $49 with variable 0 = 1, e49_wheel) rolls out at Kirby. Its speeds and pose
waits depend on the slope under it (e49_slope_speed; only flat floors were seen).
Type $4F (e4f_*; kinds $BA, $BB, inhale number 6): a blue turtle-like creature with a shell and a big round head, 25
hit points. From e4f_stand it mostly steps back and dashes at Kirby (e4f_back, e4f_dash at 1.5 pixels per frame);
near him it leaps and spins in its shell for 120 frames inside a whirl that hurts Kirby (type $4F with variable 0 =
1, e4f_whirl), far from him it chases and spins sliding to a stop; sometimes it retreats instead (e4f_retreat), and
when Kirby is far after a rest it paces (e4f_pace). Every third decision is e4f_toss: two hops, then for 100 frames
crescents (type $4F with variable 0 = 2, e4f_crescent) thrown every 24 frames at four speeds.
Types $49 and $4F share their hit test (e49_hit, e49_blink, the records of e49_recs), the decision count, the script
table e49_scripts with its exit e49_set_script, and the end: knocked back (e49_knock), a bounce, then lying down for
210 frames, bobbing and flickering, inhalable (records 39:92FC / 39:971C), after a new object of type 8 with variable
0 = 1 appeared at its place.
Type $4D (e4d_*; kinds $BE, $BF, inhale number 8): a four-legged creature with a white mane and a curled tail, 27 hit
points, a state machine in the low four bits of variable 9 (e4d_next). It ran once (main@112762-112960): it walked,
planned (state 6, e4d_pounce), lunged at Kirby at 3 pixels per frame, was beaten in the lunge and thrown back
(e4d_beaten), and was inhaled. e4d_hit can catch Kirby during a lunge (hit_kirby_off = 1) when kirby_form is not 8.

Open:
- Never ran (described from the bytes only where the text says so): type $1C: the fall-through of e1c_start for a
  variable 0 above 2, e1c_hop_far, the entries 2, 4, 7-$0C of e1c_scripts (2A:BAEE, 2A:BA2D, 2A:BB8A, 2A:BC53-2A:BC83,
  2A:BD1C-2A:BD79, 2A:BE46-2A:BE6E, 2A:BED4-2A:BF01: by their bytes a fall, a landing after the reappearance, and a
  jump of the runner that creates an object of type $0D after the third change of side), the end of e1c_tick_stand
  without a floor, the landing of e1c_tick_fade_in.
- Type $49: entry 8 of e49_scripts (22:8180 through 2A:B041), three jumps in a row (2A:A871), the wall exit of
  e49_brake_step, the slopes in e49_slope_speed, e49_brake_step and e49_tick_run (entries 1-4 of their tables), and the
  landing, wall and ceiling of the small wheel (2A:AE63-2A:AEB6), its thread 2A:AAF7 and the rest of e49_wheel
  (2A:AA14-2A:AA23). With 0 in $0C e49_floor_changed reads a byte of e49_scripts as its index (once). Entry 7
  (e49_hop_back, unit boss_cov3) ran in cov3-c-ball and to its end in cov5-i-wheel; entry 4 (2A:A921, the brake at once
  from 2A:AC66), e49_tick_run's wall rolling left (2A:AC08), the end of e49_hop_back (2A:A8EC-2A:A90E with
  e49_tick_daze) and e49_tick_down reaching 0 (2A:AE2A) ran in cov5-i-wheel: unit en_cov5.
- Type $4F: entries $0B and $11 of e49_scripts (2A:B0E4, 2A:B12B; $0D and $0E ran in cov3-b-e4f, unit boss_cov3;
  $17, the wall bounce 2A:B32E-2A:B369 with its tick routines 2A:B8B5-2A:B92F, in cov5-i-turtle, unit en_cov5),
  the rows 0-2 and 4 of e4f_choices, the class 1 variants of e4f_back, e4f_dash, e4f_chase and e4f_retreat, the
  third count at the end of a spin (e4f_tick_wait), the walls of the walks, e4f_free_whirl freeing a whirl. e4f_retreat_time reads obj_param of slot 0 ($0784, no index) and
  e4f_tick_chase variable 6 of slot 0 ($6236, because obj_walk leaves X = 0): both run as written; what the game
  meant is not known. e4f_retreat and e4f_pace ran once each, e4f_chase three times (w12-sonnet only).
- Type $4D: everything but the states 0, 1, 6 and 7 that ran once (2A:A000, 2A:A0A5-2A:A14C, 2A:A172-2A:A18A,
  2A:A226-2A:A241, 2A:A320-2A:A341, 2A:A37C-2A:A3B7, 2A:A3B8-2A:A616, 2A:A62B-2A:A6C6, 2A:A6F5-2A:A818): its other
  attacks, catching Kirby (the code after obj_near), state 8 and the end of e4d_beaten. Its claims carry the one run.
  Much of it ran later (unit boss_cov3, cov3-b-e4d); the slide into it (e4d_hit's kind-1 path 2A:A1E9), the catch in
  the air (2A:A085) and the rest of e4d_pounce's loop (2A:A6F5) ran in cov5-i-mane: unit en_cov5.
- The class 1 of type $49 stood 2 frames (cov-minigame-arena is a copy of main there); of type $4F only class 0 ran.
- The creatures' names: "Grand Wheelie" is the usual name for what type $49 looks like and does; the others are
  described. What the inhale numbers are as abilities belongs to Kirby's units.
- Used by address: 22:8FA2 (a weighted random choice that leaves out one entry), 22:91A9 / 22:91B8 (keep and restore
  the world X in variables 8 and 9), 22:943C / 22:944D / 22:9458 (velocities to 0), 22:962E (1 one time in four),
  22:9591 (a child of type $59), 22:859F / 22:85B0 (effects), 22:8FC6, 22:84CF, 22:8B24, 22:8BC0, 22:8E74, 22:9340,
  3E:DED0, 3E:DE4B, 3E:DFDF, 3F:E26A, 3F:E2B6, 3F:E6E8, the scripts 22:8003, 22:8100, 22:8147, 22:8162, 22:8180 and
  the reactions 19:B2A0 and 16:A9CE; the pose tables 30:9058, 33:8000, 30:9AA9, 33:9E5A, 32:9E98, 32:9EA8, 37:8A5A
  keep their address names in unit sprites; object types 8 and $59 are other units'.
- The tick models take the answers of the hit test and of the bank 22 tests from the branches the tick routine took;
  "no script" is checked as "obj_set_script did not reset the object's tick pointer" for the mid-bosses.
"""

# ================================================================= shared model

[[model]]
name = "en2a_model"
code = '''
E1C_SCRIPTS = [0xBA04, 0xBA61, 0xBAEE, 0xBA5A, 0xBA2D, 0xBC15, 0xBC27, 0xBC53, 0xBC72, 0xBC79, 0xBC5B, 0xBE4D, 0xBE46]
E1C_WEIGHTS = [[2, 2, 2, 1, 1], [1, 3, 1, 1, 2]]
E1C_STEP = [10, 6]
E1C_WAIT = [0xFF, 0x80]
E1C_DX = [0x20, 0x28, 0x30, -0x20, -0x28, -0x30]
E1C_DY = [0, -8, -0x10, -0x18, -0x20, -0x28, -0x30, -0x38, -0x40]
E1C_DITHER = [0x7F, 0x77, 0x57, 0x55, 0x15, 0x11, 0x01, 0x01, 0x11, 0x15, 0x55, 0x57, 0x77, 0x7F]
E1C_ACC = [0x0020, 0xFFE0]
E1C_CLAMP = [0x0100, 0xFF00]
E1C_SIDE = [-0x40, 0x40]

def a2_script(wr, addr, bank=0x2A):
    """obj_set_script gave a thread the address addr in this bank."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == bank for t in range(32))

def a2_new(wr, s):
    """obj_set_script ran for the object in slot s (it resets the object's tick pointer)."""
    return (0x627E + s) in wr

def a2_any_script(wr):
    return any((0x63C0 + t) in wr for t in range(32))

def a2_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def a2_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def a2_grav(old, a, x):
    """obj_gravity_ax: the Y velocity plus A, or X pixels per frame exactly when the high byte reaches X."""
    v = (old + a) & 0xFFFF
    return x << 8 if ((v >> 8) - x) & 0xFF < 0x80 else v

def a2_pick(w, prev, r):
    """22:8FA2: the first index other than prev whose running sum of weights is not below r."""
    s = 0
    for i in range(8):
        if i == prev:
            continue
        s += w[i]
        if s >= r:
            return i

E49_RECS = [0x92E4, 0x92FC, 0x9314, 0x932C, 0x9704, 0x971C, 0x9734, 0x974C, 0x9764]
E49_SCRIPTS = [0xA838, 0xA857, 0xA886, 0xA90F, 0xA921, 0xA92D, 0xA968, 0xA8CD, 0x8180, 0xB0D8, 0xB0ED, 0xB0E4, 0xB162,
               0xB198, 0xB1C8, 0xB1F9, 0xB0F6, 0xB12B, 0xB2A3, 0xB228, 0xB2C1, 0xB273, 0xB2E1, 0xB32E, 0xB2B4]
E49_STAND = [0x3F, 0x2A, 2, 2]
E49_SLOPE_VX = [0x0180, 0x00E6, 0x0200, 0x0099, 0x0300, 0x02A0, 0x0192, 0x0380, 0x010C, 0x0540]
E49_SLOPE_WAIT = [2, 2, 2, 4, 1]
E49_SLOPE_IDX = [[0, 2, 1, 4, 3], [0, 1, 2, 3, 4]]
E49_BRAKE = [7, 0x0A, 6, 0x0F, 5]
E4F_ROW3 = [0x0F, 0x0F, 0x0C, 0x0F, 0x0E, 0x0F, 0x0F, 0x0F, 0x0C, 0x0F, 0x0F, 0x0E, 0x0F, 0x0F, 0x0F, 0x0F]
E4F_CRESCENT_D = [(0, -8), (0, -4), (-4, -4), (4, -4)]
E4F_CRESCENT_VX = [0x00C0, 0x0180, 0x0240, 0x0300]

def a2_rec(wr):
    return wr.get(0x27, 0) | wr.get(0x28, 0) << 8

def e49_rec_ok(rd, wr, entry):
    """e49_hit with this entry: the record it passed, by the blink in variable 2."""
    v2 = rd[0x61EE + rd[0x6E]]
    if v2 == 0:
        return a2_rec(wr) == E49_RECS[entry]
    if v2 >= 0x80 or v2 == 1:
        return 0x27 not in wr
    return a2_rec(wr) == 0x9314

def a2_spawned(wr, typ):
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]
'''

# ================================================================= type $1C

[[claim]]
id = "en2a.e1c.kinds"
about = ["e1c_start"]
text = "In the tables of unit rooms the kinds $6B-$6F are type $1C with the variable bytes $00, $10, $01, $11, $02: variable 0 (the behaviour) 0, 0, 1, 1, 2 and variable 1 (the class) 0, 1, 0, 1, 0."
kind = "static"
expect = "[u8(O('13:A9D2') + k) for k in range(0x6B, 0x70)] == [0x1C] * 5 and [u8(O('13:AAD2') + k) for k in range(0x6B, 0x70)] == [0x00, 0x10, 0x01, 0x11, 0x02]"

[[script]]
at = "2A:B9E6"
name = "e1c_start"
desc = """
First script of object type $1C: a small pink creature with a black headband whose ends fly behind its head (main@6130,
on the step of the hill in the middle; w12-opus@45920, beside Kirby on the platform). Kinds $6B-$6F create it with
the behaviour in variable 0 and the class in variable 1. Bank 22, the position routine obj_pos_cull, the pose table
30:9058, obj_param = the class (obj_param_set), variable 5 = 0, variable 2 = the behaviour (as a copy), 2 hit points
(variable 0), and a jump by the behaviour: 0 e1c_hop_start (the hopper), 1 e1c_lurk (the creature that vanishes and
comes back beside Kirby), 2 e1c_run (the runner that keeps beside Kirby). Any other value would fall through to
e1c_land (2A:BA04), which never happened on this path.
"""

