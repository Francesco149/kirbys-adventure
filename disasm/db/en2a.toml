kind = "call"
fn = "e1c_steer"
on = ["main@33600+400", "main@58150+300", "main@86200+300", "w12-opus@45870+120", "w12-sonnet@59410+120", "w3-sonnet@45870+200"]
min_calls = 500
use = ["en2a_model"]
model = '''
def e1c_steer_ok(rd, wr, ra, mem):
    s = rd[0x6E]
    v3, v5, v6 = 0x6200 + s, 0x6224 + s, 0x6236 + s
    r5, side, flag = rd[v5], rd[v3], 0
    if r5:
        flag = 1
        n5 = r5 - 1
        if n5 in (0, 0x78, 0x3C):
            side = (side + 1) & 1
            if wr[v3] != side or wr[v6] != (rd[v6] + 1) & 0xFF or wr[v5] != 0:
                return False
        elif wr[v5] != n5 or v3 in wr or v6 in wr:
            return False
    tx = (a2_w(rd, 0x6075, 0x6087) + E1C_SIDE[side & 1]) & 0xFFFF
    if a2_w(wr, 0x625A + s, 0x626C + s) != tx:
        return False
    d = a2_s16((tx - a2_w(rd, 0x82 + s, 0x94 + s)) & 0xFFFF)
    if not flag and abs(d) < 2 and wr.get(v5) != 0xB4:
        return False
    y = 1 if d < 0 else 0
    vx = (a2_w(rd, 0x60E0 + s, 0x60F2 + s) + E1C_ACC[y]) & 0xFFFF
    if abs(a2_s16(vx)) >= 0x300:
        vx = E1C_CLAMP[y]
    return (mem(0x60E0 + s) | mem(0x60F2 + s) << 8) == vx and ra == mem(v6)
'''
