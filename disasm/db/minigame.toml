name = "egg_start"
desc = """
First script of object type $66, Egg Catcher; room_pick_kind creates it in slot 1 in place of Kirby. Variable 1 picks
the part (a jump table of 19 entries): 0 is the manager, 1 Kirby (3B:A170), 2 King Dedede (3B:A301), 3 the ball in
the corner that announces a throw (3B:A3C3), 4 a thrown egg or bomb (egg_obj), 5 and $0E-$12 decorations and the
banners of bank 3C. The manager (3B:A02C): minigame_clear, egg_title_setup (the title card with the rules:
"Press the buttons to make Kirby's mouth open! Try to eat eggs -- but not bombs!"), three decorations, fade in, tick
routine 3A:814A, which waits for A or B, then (3B:A068) fade out, minigame_clear, egg_setup, the ring: Kirby in slot 2,
Dedede in slot 3, the ball in slot 4, three more decorations, fade in, and it waits for $07B3 (the ball's script sets
it when it has landed), flashes the palettes (3B:A6FC), waits for $07B4 to fall back to 0 (Dedede's script holds it
at 1 while he enters), and gives the tick routine egg_tick_end. When that sees the game over it starts 3B:A0ED:
wait until slots 5-16 are empty (3A:80ED), music by the result (3A:8103), the bonus banner (3B:A49B / 3B:A4A9, by
