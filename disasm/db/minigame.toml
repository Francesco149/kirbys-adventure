about = ["crane_grab_quality", "crane_grab_steps", "crane_side"]
text = "crane_grab_quality stores in the claw's variable 0 the number of thresholds of crane_grab_steps (table [0, 18, 6, 24, 12, 30][2 * minigame_level + the doll's variable 6]) that d reaches, d = the claw's X - the doll's X (8 bits, inverted when bit 7 is set, with crane_side + 1 exactly then), or 5 when the claw's X is below $50. Values 1, 4 and 5 occur."
kind = "call"
