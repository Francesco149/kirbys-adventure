unit = "minigame"
title = "The three minigames: Egg Catcher, Crane Fever, Quick Draw"
summary = """
The three minigames of the hub. A door of kind $A-$C (room_pick_kind, unit rooms) sets stage_kind to 0-2,
minigame_level from the door and minigame_no_prize to 0, and replaces Kirby's object (slot 1) by an object of type
$65 (Quick Draw, first script 3C:A000), $66 (Egg Catcher, 3B:A000) or $67 (Crane Fever, 3B:AB7F); room stays the
hub's. Each type is a family of parts chosen by variable 1 through a jump table: slot 1 is the manager, which shows a
title card with the rules (a packed screen; A or B to go on), then draws the game's own screen with its own CHR banks
and no split (no status bar), creates the other parts and finally jumps to minigame_end (3C:B9E6, shared): 128 frames,
fade out, every object freed, leave_code = 5, which room_enter takes as a cleared stage (hp = hp_max, back to the hub).
The prize goes to score_pending / lives_pending (unit kst15), paid when Kirby leaves the hub's next door; it is paid
only when minigame_no_prize is 0. Bank 3B holds Egg Catcher and Crane Fever, bank 3C Quick Draw, the ending, the
banners shared by all three and Egg Catcher's thrown objects; seven routines of Egg Catcher are in bank 3A (3A:8059 on).

Egg Catcher: King Dedede (slot 3) throws eggs and bombs from the right of a boxing ring to Kirby at the left (slot 2).
Holding A or B keeps Kirby's mouth open (egg_tick_mouth). egg_setup sets rng_state to $7777, so a game at the same
level always begins with the same throws, and egg_pick_kind sets it to $7777 again at three egg counts chosen at
random (egg_reseed_at). Each frame Dedede throws with one chance in egg_throw_odds[egg_speed] (10 at the start), on
one of three arcs at random, unless another egg would arrive within 8 frames of it (egg_gap_ok). A throw is a bomb
with one chance in egg_bomb_odds (6, 5, 4, 4 by stage at level 0), otherwise an egg (egg_thrown + 1). It lands in
Kirby's mouth after egg_flight_times frames: with the mouth open an egg is eaten (egg_eaten + 1, one more icon in the
column at the left; at 10, 20, 30, 40 eggs egg_stage_up speeds the game up) and a bomb is eaten too (egg_bombs + 1),
which ends the game; with the mouth closed the thing bounces off. The game also ends after 30 eggs have been thrown.
The prize (egg_bonus) is by eggs eaten: 0-6 500 points, 7-12 1,000, 13-18 3,000, 19-24 5,000, 25-29 one life, 30 three
lives. The corpus game ate 14 eggs and a bomb: 3,000 points.

Crane Fever: a claw machine with two credits (crane_credits) and two dolls, a small and a big Kirby, which drop in at
one of five layouts chosen at random. Holding A or B moves the claw right (crane_pad_go, up to X = $D6); releasing it
lowers the claw over the nearer doll (crane_pick_target). How far the claw is from that doll decides
(crane_grab_quality: thresholds by level and doll size; crane_results): at level 0 a distance below 9 pixels (small
doll) or 7 (big) holds it, up to 22 / 25 it slips, beyond, or with the claw left of $50, it misses. A doll held is
carried back to the chute and counted (crane_count_prize); the result screen pays crane_life once for a small doll and
twice for a big one: 1UP or 2UP per doll. In the corpus: w12-opus missed twice, cov-minigame-crane slipped once and
won the big doll with the second credit (2UP), cov4-d-crane grabbed the big doll perfectly and
dropped the small one on the way home (unit scn_cov4).

Quick Draw: five duels against opponents at the right. Each round waits 224-248 frames (qd_pick_wait, twice); a press
in its last 20 frames is a false start (qd_tick_early). Then "FIRE!": from the next frame qd_tick_draw counts Kirby's
reaction time in frames on the sign (qd_time_tens, qd_time_units) and the opponent waits qd_foe_frames[level][round]
frames (81, 49, 19, 14, 9 at level 0). A or B before the opponent's time is up wins the round, otherwise Kirby is shot
and the game ends without a prize. After five won rounds the banner says "PERFECT!" and qd_pay gives qd_lives[5] = 3
lives. The win in the corpus reacted in 4-8 frames; the lost game never pressed in round 1; cov4-d-qd made both
false starts in the fifth duel (unit scn_cov4).

Open:
- Only level 0 was played (minigame_level 0 in all six sessions): the rows of the tables for levels 1 and 2 and the
  claw's extra step 3B:B056 never ran (its other steps 3B:B061 and 3B:B4DE ran in cov2-minigame-bonus). The ending
  after 30 throws (3A:80E7, 3A:8137) ran in cov4-d-egg, and so did egg_bonus's life prize (25-29 eggs, 3C:BEB1).
  qd_pay's score branch (3C:B93E) ran in cov2-minigame-qd2; crane_prize_1 being set was seen only in effects or not
  at all.
- Quick Draw: both false starts ran in cov4-d-qd and are described by unit scn_cov4 (qd_foul, qd_foul_2, qd_cross for
  3C:B371, the sign's qd_sign_foul); the result after them is qd_rounds_result of unit scenes3. 3C:B734 (the tick of
  the opponent's hat, which reads qd_lost) never saw it set. The scripts 3C:ADE8, 3C:AE06, 3C:AE4C, 3C:B6FD (entries 4,
  7, 19 and 26 of the jump table) never ran.
- Crane Fever: the perfect grab (result 0, 3B:B834), the doll dropped on the way home (3B:B4B5) and crane_prize_1's
  prize script (3B:B2C8), all in cov4-d-crane, are described by unit scn_cov4 (crane_claw_perfect, crane_doll_perfect,
  crane_doll_dropped, crane_doll_fell for $07C5, crane_prize1_big). Of the parts 0 and 1 of the dolls' call_table
  only 3B:ACE1 never ran (3B:AD2E, 3B:AE0B, 3B:AE3A were read in cov2-minigame-bonus, 3B:AE0B in cov4-d-crane too).
  3B:B3FC gives the claw a random X velocity from 3B:B411 that zero_vel clears at once at level 0; for an answer of 2
  it reads the two bytes of code at 3B:B415 ($D0AD). $07BE and $07C4 (written only, by crane_setup and
  crane_tick_doll_home) are not described; $07BF is the free place of crane_doll_replace (unit scn_cov4).
- What 3B:A6FC (palette flashes), the decorations and banners (3C:A0AE-3C:A0C9, 3C:B260-3C:B330) and the bounce
  3C:BEEA do is read from the code, not claimed. Egg Catcher's $07B3/$07B4 are handshakes between its scripts.
"""

