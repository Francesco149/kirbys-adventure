                0x05, 0x0A, 0x0F, 0x14, 0x19, 0x1E, 0x23, 0x28]
EGG_STAGE_SPEED = [1, 2, 3, 4, 0, 0, 0, 0,
                   3, 1, 4, 2, 3, 0, 3, 4,
                   4, 3, 4, 5, 4, 3, 4, 5]
EGG_GRAVITY = [0x20, 0x2A, 0x30, 0x40, 0x60, 0x70, 0x70, 0x70]
EGG_BONUS_AT = [7, 13, 19, 25, 30, 31]
EGG_BONUS_LIVES = [0, 0, 0, 0, 1, 3]
EGG_BONUS_SCORE = [50, 100, 300, 500, 0, 0]
QD_WAIT_ODDS = [4, 8, 16]
QD_WAIT_FRAMES = [0x70, 0x74, 0x78, 0x7C, 0x6A, 0x66, 0x62, 0x5E, 0xCE, 0xBE, 0xAE, 0x8E, 0x20, 0x2E, 0x3E, 0x4E]
QD_FOE_FRAMES = [0x51, 0x31, 0x13, 0x0E, 0x09, 0, 0, 0,
                 0x3D, 0x27, 0x0F, 0x0C, 0x08, 0, 0, 0,
                 0x28, 0x1E, 0x14, 0x0A, 0x07, 0, 0, 0]
QD_LIVES = [0, 0, 0, 0, 1, 3]
QD_SCORE = [0, 100, 300, 500, 0, 0]
QD_DIGITS = [0x92, 0x93, 0x80, 0x81, 0x82, 0x83, 0x84, 0x85, 0x86, 0x87, 0x88, 0x89, 0x8A, 0x8B, 0x8C, 0x8D, 0x8E, 0x8F, 0x90, 0x91]
CRANE_STEPS = [0x02, 0x09, 0x0D, 0x13, 0x17, 0xFF,
               0x01, 0x07, 0x0D, 0x13, 0x17, 0xFF,
               0x00, 0x04, 0x0D, 0x13, 0x17, 0xFF,
               0x01, 0x07, 0x0B, 0x15, 0x1A, 0xFF,
               0x00, 0x07, 0x0B, 0x15, 0x1A, 0xFF,
               0x00, 0x04, 0x0B, 0x15, 0x1A, 0xFF]
CRANE_RESULTS = [0, 1, 3, 3, 3, 2]

def mg_rol(v, c):
    return ((v << 1) | c) & 0xFF, v >> 7

def mg_step(lo, hi, acc):
    c = lo >> 7
    lo = (lo << 1) & 0xFF
    hi, c = mg_rol(hi, c)
    acc, c = mg_rol(acc, c)
    acc, c = mg_rol(acc, c)
    acc ^= lo
    acc, c = mg_rol(acc, c)
    acc ^= lo
    acc >>= 2
    acc = ((acc ^ 0xFF) & 1) | lo
    return acc, hi, acc

def mg_advance(lo, hi):
    """rng_state after one call of random (unit rng)."""
    acc = lo
    for _ in range(11):
        lo, hi, acc = mg_step(lo, hi, acc)
    return lo, hi

def mg_random(n, lo, hi):
    """(answer, new low, new high) of random with A = n."""
    lo, hi = mg_advance(lo, hi)
    return ((n * lo) >> 8 if n else lo), lo, hi

def mg_script(wr, bank, addr):
    """obj_set_script gave some thread the script bank:addr."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == bank
               for t in range(32))

def mg_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def mg_live(t):
    return t != 0xFF
'''

