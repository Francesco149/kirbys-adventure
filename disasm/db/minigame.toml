# ================================================================= Crane Fever (object type $67)

[[script]]
at = "3B:AB7F"
name = "crane_start"
desc = """
First script of object type $67, Crane Fever; room_pick_kind creates it in slot 1 in place of Kirby. Variable 1
picks the part (a jump table of 16 entries): 0 the manager (3B:ABA3), 1 the claw (slot 2, crane_claw), 2 and 3 the
small and the big Kirby doll (slots 3 and 4: they drop into the machine at one of three places, crane_pick_layout,
and then run crane_doll_tick), 4 and $0C the arrow and the A button on the panel, 5 the six bubbles of the pile,
6-9 the result screen and its prizes, $0A/$0B two puffs, $0D-$0F decorations of bank 3C. The manager:
minigame_clear, crane_title_setup, three decorations, fade in, tick routine crane_tick_title (A or B to go on), fade
out, minigame_clear, crane_setup, the claw, the two dolls, six bubbles, the arrow and the button, fade in, and it
waits for $07C1 (the claw's script sets it when no credit is left). Then 20 frames, the result screen (part 6:
3B:B259, whose banner is 3C:B27A when crane_won is 0, 3C:B28E otherwise), and for a prize the tick routine 3B:B64C
scrolls the picture down to the prizes (parts 7-9, which pay with crane_life), and minigame_end.
"""

[[script]]
at = "3B:AFF4"
name = "crane_claw"
desc = """
The claw of Crane Fever (slot 2). crane_pick_layout, its picture, (56, 88), and then for each credit: it waits until
both dolls have landed (crane_dolls_down 2 or more), then for A or B held (crane_pad_go), and moves right at $0080
per frame while the button is held and it is left of X = $D6 (at minigame_level 1 and 2 two more steps never ran).
On release: 3B:B3FC (a random X velocity, which zero_vel at once clears at level 0), the claw opens and goes down
(3B:B07F: crane_pick_target, crane_grab_quality, tick routine crane_tick_lower) until it reaches the doll's height,
then crane_tick_result decides. The claw rises (3B:B785: to Y = $58), moves left at $FF40 until it is home
(crane_home_test, or 3B:B498 when it carries a doll), crane_count_prize, one credit less (crane_credits - 1), and
either the next credit or $07C1 = 1.
"""

[[sym]]
at = "3B:B320"
name = "crane_title_setup"
desc = "The title card of Crane Fever: display off, CHR banks $80, -, $FF, $DB, $4D, $4E, no split, the packed screen 3B:BA82 expanded and sent with the record 3B:BA74, display on, fade_level -4."

[[sym]]
at = "3B:B369"
name = "crane_setup"
desc = "The machine of Crane Fever: display off, vertical mirroring, CHR banks $64, -, 0, $66, $67, $60, no split, the packed screen 3B:BBCE expanded and sent with the records 3B:BA74 and 3B:BA7B, display on, fade_level -4, the palette 3B:BA40 (3B:B3ED); then crane_dolls_down, crane_side, crane_holding, crane_won, $07BE, $07C1, crane_prize_1, crane_prize_2, $07C4, crane_doll_fell, lives_pending and score_pending = 0 and crane_credits = 2."

[[sym]]
at = "3B:B50D"
name = "crane_tick_title"
desc = "Tick routine of the manager on the title card: A or B newly pressed starts the script 3B:ABE2 (fade out and on to the machine)."

[[sym]]
at = "3B:B6EA"
name = "crane_pick_layout"
desc = "Where the dolls drop in: a row of four bytes at 3B:B705 + 4 * random(5); $07BF = its first byte, variable 2 of slot 3 and of slot 4 (the part of their scripts' call_table: one of three places) = the second and the third."

[[sym]]
at = "3B:B4EA"
name = "crane_pad_go"
desc = "For the claw's script: A = 1 when A or B is held and the claw (slot 2) is left of X = $D6, else 0."
out = "A = 1 move on, 0 stop"

[[sym]]
at = "3B:B4CD"
name = "crane_pad_right"
desc = "The same test for the arrow and the A button on the panel (their pictures light while the claw moves): A = 1 when A or B is held and the claw (slot 2) is left of X = $D6 (3B:B503), else 0."
out = "A = 1 or 0"

[[sym]]
at = "3B:B48C"
name = "crane_home_test"
desc = "A = 1 when the claw (slot 2) is left of X = $38 (back over the chute), else 0."
out = "A = 1 home, 0 not"

[[sym]]
at = "3B:B525"
name = "crane_pick_target"
desc = "The doll the claw goes for: variable 3 of the claw = 4 (the doll in slot 4) when variable 3 of slot 3 (that doll's distance from the claw, crane_doll_tick) is at least that of slot 4, else 3."

[[sym]]
at = "3B:B58E"
name = "crane_grab_quality"
desc = """
How well the claw is placed over its target doll (Y = variable 3 of the claw): d = the claw's X minus the doll's X,
eight bits; when bit 7 is set d is inverted (not negated) and crane_side + 1 (the doll is to the right). Then
q = the first i with d < crane_grab_steps[t + i], where the table t is chosen by minigame_level and the doll's size
(its variable 6: 0 small, 1 big); a claw left of X = $50 gives q = 5. The claw's variable 0 = q.
"""

[[sym]]
at = "3B:B7D0"
name = "crane_tick_lower"
desc = "Tick routine of the claw on the way down: when the claw's Y plus 3B:B7F3[the target doll's variable 7] (24 or 28) reaches the doll's Y (a signed compare), the claw's script becomes 3B:B097 (it closes; crane_tick_result)."

[[sym]]
at = "3B:B7F7"
name = "crane_tick_result"
desc = """
Tick routine of the closed claw: crane_results[the claw's variable 0]. 1: it holds the doll: the claw's variable 7 =
3B:B892[the doll's variable 7], 3B:B898 (variable 6 of slot 4 = 0 for a big doll), crane_holding + 1, the script
3B:B0BF. 2: it missed, the script 3B:B0E8. 3: it touched the doll and slipped: the claw's pose 9 (or $0B when
crane_side is set), $6214 = the doll's pose, the doll's pose + 1, the script 3B:B0AF. 0 (3B:B834, once, cov4-d-crane's perfect grab on the big doll) is a
grab as 1 with crane_perfect_hold and the script crane_claw_perfect (unit scn_cov4).
"""

[[sym]]
at = "3B:B9B6"
name = "crane_doll_tick"
desc = "Tick routine of a doll in the machine: with crane_credits 0 nothing. When the claw holds this doll (variable 3 of slot 2 = this slot and crane_holding set) the doll's script becomes 3B:AEDA (it hangs from the claw; for a claw variable 0 other than 1 3B:AEBD, crane_doll_perfect of unit scn_cov4, read once in cov4-d-crane's perfect grab). Otherwise variable 3 = |the doll's X - the claw's X|."

[[sym]]
at = "3B:B9FE"
name = "crane_count_prize"
desc = "When the claw is home: if it holds a doll (crane_holding), crane_won + 1 and the doll's size + 1 (1 small, 2 big) goes to crane_prize_2 when this was the last credit (crane_credits = 1), to crane_prize_1 otherwise."

[[sym]]
at = "3B:B417"
name = "crane_life"
desc = "One extra life (lives_pending + 1) unless minigame_no_prize is set. The prize scripts call it once for a small doll and twice for a big one."

[[data]]
at = "3B:B5DD"
len = 36
name = "crane_grab_steps"
format = "rows:6"
desc = "Thresholds of crane_grab_quality, six tables of six bytes, chosen through the pointers at 3B:B5CD / 3B:B5D3 by 2 * minigame_level + size: small doll at levels 0, 1, 2 (2, 9, 13, 19, 23, $FF; 1, 7, 13, ...; 0, 4, 13, ...), big doll at levels 0, 1, 2 (1, 7, 11, 21, 26, $FF; 0, 7, ...; 0, 4, ...). The answer is how many thresholds the distance reaches."

[[data]]
at = "3B:B888"
len = 6
name = "crane_results"
format = "bytes"
desc = "What crane_tick_result does by grab quality 0-5: 0, 1 (grab), 3, 3, 3 (slip), 2 (miss). Only distances below the second threshold hold the doll."

[[ram]]
at = "07B9"
name = "crane_dolls_down"
desc = "Dolls that have landed in the machine: crane_setup clears it, each doll's script adds 1 (3B:ACD7, 3B:ADBF), 3B:AEDA subtracts 1 when one is taken; the claw, the arrow and the button wait until it is 2."

[[ram]]
at = "07BA"
name = "crane_side"
desc = "Set when crane_grab_quality found the doll to the right of the claw; crane_tick_result picks the claw's pose by it; cleared when the claw is home."

[[ram]]
at = "07BB"
name = "crane_credits"
desc = "Credits left in Crane Fever: 2 at the start (crane_setup), 1 less each time the claw is home; the counter on the panel shows it. At 0 the game ends."

[[ram]]
at = "07BC"
name = "crane_holding"
desc = "The claw holds a doll: crane_tick_result adds 1 for a grab, the claw's script clears it when home."

[[ram]]
at = "07BD"
name = "crane_won"
desc = "Dolls won (crane_count_prize); the result screen picks its banner by it."

[[ram]]
at = "07C2"
name = "crane_prize_1"
desc = "The doll won with the first credit: 0 none, 1 small, 2 big (crane_count_prize). The result screen's part 8 shows it and calls crane_life once per size step."

[[ram]]
