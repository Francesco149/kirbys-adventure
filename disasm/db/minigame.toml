use = ["minigame_model"]
model = '''
def crane_q_ok(rd, wr):
    s = rd[0x6E]
    t = rd[0x6200 + s]
    d = (rd[0x6074 + s] - rd[0x6074 + t]) & 0xFF
    right = d & 0x80
    if right:
        d ^= 0xFF
    base = [0, 18, 6, 24, 12, 30][2 * rd[0x7D1] + rd[0x6236 + t]]
    q = 0
    while d >= CRANE_STEPS[base + q]:
        q += 1
    if rd[0x6076] < 0x50:
        q = 5
    return wr[0x61CA + s] == q and ((wr.get(0x7BA) == (rd[0x7BA] + 1) & 0xFF) if right else 0x7BA not in wr)
'''
