# ================================================================= Quick Draw (object type $65)

[[script]]
at = "3C:A000"
name = "qd_start"
desc = """
First script of object type $65, Quick Draw; room_pick_kind creates it in slot 1 in place of Kirby. Variable 1 picks
the part (a jump table of 30 entries): 0 the manager, which becomes Kirby the gunslinger; 2 the opponent (slot 6,
3C:B3FD); 3 the sign at the top (slot 2, 3C:B209: "FIRE!" and the round's picture); $15 the clock sign with the
reaction time (3C:ADCB); others the effects of a shot, the banners of the result and decorations (several of which
Egg Catcher and Crane Fever also use through far jumps: 3C:A0AE-3C:A0C9, 3C:B27A, 3C:B28E). The manager (3C:A040):
minigame_clear_3c, qd_title_setup (the title card), three decorations, fade in, tick routine qd_tick_title, which
waits for A or B; then fade out, minigame_clear_3c, qd_setup (the desert), the opponent in slot 6, Kirby's own
position and picture, fade in, the tick routine 3C:A195 scrolls the view to the left by $FF80 per frame until the
camera reaches 0, and the script becomes qd_round.
"""

[[script]]
at = "3C:AA42"
name = "qd_round"
desc = """
One round of Quick Draw (the manager, slot 1; variable 7 = the round, 0-4). qd_timer_clear, qd_pick_wait, then
twice wait_var 3: 224-248 frames at level 0 in which a press does nothing; then the tick routine qd_tick_early for
the last 20 frames, in which a press is a false start. Then the sign shows "FIRE!" (3C:B238 in slot 2), the opponent
starts its countdown (3C:B427 in slot 6: qd_foe_wait), a sound, and from the next frame the tick routine
qd_tick_draw decides the round: Kirby wins when A or B is pressed before the opponent's time is up.
"""

[[sym]]
at = "3C:A104"
name = "qd_title_setup"
desc = "The title card of Quick Draw: display off, CHR banks $80, $58, $FF, $DB, $4D, $4E, no split, the packed screen 3C:A2C2 expanded and sent (3C:A1C9), fade_level -4, display on."

[[sym]]
at = "3C:A13D"
name = "qd_setup"
desc = "The desert of Quick Draw: display off, vertical mirroring, CHR banks $56, $58, 0, $5E, $5F, $77, the packed screen 3C:A7C9 expanded and sent with its attributes (3C:A1E4), then variable 7 of the current object (the round) = 0, qd_lost = 0, lives_pending = 0, score_pending = 0, display on."

[[sym]]
at = "3C:A17F"
name = "qd_tick_title"
desc = "Tick routine of the manager on the title card: A or B newly pressed starts the script 3C:A070 (fade out and on to the desert)."

[[sym]]
at = "3C:ABA8"
name = "qd_timer_clear"
desc = "At the start of a round: two PPU records that put the tiles of 0 in both digits of the clock sign, and qd_time_tens = qd_time_units = 0."

[[sym]]
at = "3C:A255"
name = "qd_timer_step"
desc = "Every frame after FIRE (from qd_tick_draw): the reaction time + 1 as two decimal digits (qd_time_units carries into qd_time_tens at 10), and the two tiles of each digit (qd_digit_tiles) go to the sign through $07CA/$07CB and the records 3C:A290 and 3C:A29F."

[[sym]]
at = "3C:AC7C"
name = "qd_pick_wait"
desc = "Variable 3 of the current object = qd_wait_frames[random(qd_wait_odds[minigame_level])]: half of the wait before FIRE (the script waits it twice). At level 0: 112, 116, 120 or 124 frames."

[[sym]]
at = "3C:ACA2"
name = "qd_tick_early"
desc = """
Tick routine of the manager in the 20 frames before FIRE: A or B newly pressed is a false start. It adds 1 to
variable 2 of slot 2 ($61F0, set to $FF at the start of the duel). The first false start ($61F0 becomes 0): the sign
gets the script 3C:B23B, the opponent 3C:B410 and the manager 3C:B037, and the round does not go on to FIRE. A second
one ($61F0 becomes 1): qd_lost + 1, the sign gets 3C:B23B and the manager 3C:B87C. Both ran once, in cov4-d-qd (3C:ACB4
at 41994, 3C:ACE0 at 42375; unit scn_cov4: qd_foul, qd_foul_2, qd_sign_foul).
"""

[[sym]]
at = "3C:AD01"
name = "qd_tick_draw"
desc = """
Tick routine of the manager after FIRE. qd_timer_step first. When the opponent has fired (variable 2 of slot 6 not 0)
Kirby loses: the opponent gets the script 3C:B461, the manager 3C:AB15 (Kirby is shot; it sets qd_lost). Otherwise A
or B newly pressed wins the round: the opponent gets 3C:B476 (it is hit); in the fifth round (variable 7 = 4) four
patches of the sign (3E:C9E7 with qd's tiles) and the record 3C:AD80 and the manager goes to 3C:AAAD, in the others to
3C:AA74.
"""

[[sym]]
at = "3C:AD98"
name = "qd_tick_next"
desc = "Tick routine of the manager after a won round (one call): in the fifth round (variable 7 = 4) slot 5 gets the script 3C:B208 and the manager 3C:AAF2; otherwise the manager gets 3C:AAE2 (the walk back). Both wait for variable 6 and then install qd_round_won."

[[sym]]
at = "3C:AC3F"
name = "qd_round_won"
desc = "Tick routine (one call) that counts a won round: variable 7 of slot 2 (the sign's picture) + 1 and variable 7 of the manager + 1. At 5 the manager's script becomes 3C:B972 (the result: qd_pay); otherwise the sign gets 3C:B227 and the manager 3C:AB05 (the next round)."

[[sym]]
at = "3C:B559"
name = "qd_foe_wait"
desc = "The opponent's reaction time: the current thread's wait = qd_foe_frames[8 * minigame_level + variable 7] (variable 7 = the round, copied from the manager). When the wait is over its script sets its variable 2 = 1: it has fired, and qd_tick_draw gives Kirby the loss."

[[sym]]
at = "3C:B92D"
name = "qd_pay"
desc = "The prize after five won rounds, unless minigame_no_prize is set: lives_pending = qd_lives[variable 7 of slot 1] when that is not 0, otherwise score_pending = qd_score[the same] (3C:B93E, only in cov2-minigame-qd2). After five rounds variable 7 is 5: 3 lives (the banner \"PERFECT! 3UP\")."

[[data]]
at = "3C:A2AE"
len = 20
name = "qd_digit_tiles"
format = "rows:2"
desc = "The two tiles of each decimal digit 0-9 on the clock sign."

[[data]]
at = "3C:AC8F"
len = 3
name = "qd_wait_odds"
format = "bytes"
desc = "The A of qd_pick_wait's random by minigame_level: 4, 8, 16 entries of qd_wait_frames."

[[data]]
at = "3C:AC92"
len = 16
name = "qd_wait_frames"
format = "bytes"
desc = "Half the wait before FIRE in frames: 112, 116, 120, 124 (level 0), then 106, 102, 98, 94 and eight more for level 2 (206, 190, 174, 142, 32, 46, 62, 78)."

[[data]]
at = "3C:B56F"
len = 24
name = "qd_foe_frames"
format = "rows:8"
desc = "The opponent's reaction time in frames, by minigame_level (rows) and round (the first five columns): level 0 81, 49, 19, 14, 9; level 1 61, 39, 15, 12, 8; level 2 40, 30, 20, 10, 7."

[[data]]
at = "3C:B94F"
len = 6
name = "qd_lives"
format = "bytes"
desc = "Extra lives that qd_pay gives by variable 7 of slot 1: 0, 0, 0, 0, 1, 3."

[[data]]
at = "3C:B955"
len = 12
name = "qd_score"
format = "rows:2"
desc = "Score by the same index where qd_lives is 0, 16-bit in tens: 0, 100, 300, 500, 0, 0 (never read)."

[[ram]]
at = "07CD"
name = "qd_time_tens"
desc = "Tens digit of Quick Draw's reaction time in frames, shown on the clock sign."

[[ram]]
at = "07CE"
name = "qd_time_units"
desc = "Units digit of Quick Draw's reaction time: 0 at the start of a round, qd_timer_step adds 1 every frame from the frame after FIRE until the round is decided."

[[ram]]
at = "07CF"
name = "qd_lost"
desc = "Quick Draw was lost: qd_setup clears it, Kirby's shot-down script (3C:AB36) sets it to 1, a false start (qd_tick_early) adds 1. The clock sign (3C:ADD5) and the tick routine 3C:B734 read it."

