len = 11
name = "e24_reactions"
format = "bytes"
desc = """
Two reaction scripts of the record 39:926C, never fetched as scripts (their first byte was read as the last limit
of e24_fly_tabs): 2B:A083 for inhaled (pose 0, jmp $8003: 22:8003 with bank 22 at $8000) and 2B:A088 for kind 3 of
kirby_rect (pose 0, jmp_far 16:A9CE).
"""

[[sym]]
at = "2B:A08E"
name = "e24_tick_clear"
desc = """
Tick routine after e24_climb (one call exists, main@87814). obj_hit_fly; e24_spin_step and the pose + 4; then for
variable 2 = 4 down to 1 e17_probe on side variable 2 - 1: a probe that finds a surface in reach (by the same tests
as e17_attach) ends the call. When none does: variable 3 = $1F, variable 8 = 1 (variable 2 is 0 then) and the
script e24_ground: it falls back and starts over at e24_st_settle.
"""

[[sym]]
at = "2B:A0E3"
name = "e24_tick_climb"
desc = "Tick routine of e24_climb. e24_hit_fly; carry set: nothing more. e24_spin_step, pose = variable 6 + 4, Y velocity + $FFE7 (it rises faster by $19 every frame); when the high byte reaches $FE, variable 3 = $FE."

[[sym]]
at = "2B:A110"
name = "e24_tick_fly"
desc = """
Tick routine of type $24 in the air. e24_hit_fly; carry set: nothing more. e24_spin_step, pose = variable 6 + 4,
variable 3 - 1. At 0: with variable 9 = 2 the script e24_climb; otherwise obj_dy_kirby, and Kirby within $18 pixels
up or down: variable 2 = variable 2 xor 1 (the other side of Kirby), variable 9 = 2, variable 3 = $78 (a second
pass); farther (never happened): variable 9 + 1 and variable 3 = $28. Every 8 frames (obj_frame & 7 = 0): the point
is Kirby's position with X + $40 (variable 2 = 0) or - $40 (1), the direction to it (obj_aim_at_04); the Y velocity
becomes -$40 when that direction + $40 is below $80 (the point is above) and +$40 otherwise; the X velocity takes a
step of the class toward the point's side (e24_fly_tabs), which is undone when the new speed's high byte is not below
the class's limit.
"""
comments = { "A12E" = "a pass is over", "A144" = "Kirby is near in height: cross to his other side", "A160" = "every 8 frames: steer" }

[[sym]]
at = "2B:A1F4"
name = "e24_tick_rise"
desc = "Tick routine of e24_rise. e24_hit_fly; carry set: nothing more. e24_spin_step, pose = variable 6 + 4, variable 3 - 1; at 0: variable 2 = the side of Kirby from obj_dx_kirby ($04: 0 when he is to the right) and variable 9 = 0."

[[sym]]
