variable 8 = 1 and e17_set_dir with variable 6 (it goes on straight past the edge). Otherwise variable 6 = the
kind; moving along a floor or ceiling (variable 3 odd) the Y position takes the probe distance, moving along a wall
the X position is put in the middle of its cell column (low nibble 8, or 7 for a wall on its left). Then
e17_probe ahead (side variable 3): a wall in the way (A not 0, carry clear, the distance on the near side; moving
along a floor or ceiling only a wall of kind 2): an inner corner: the position is put against it, variable 3 = variable 2
- 2 (mod 4), variable 2 = the old variable 3, e17_set_dir. Otherwise e17_set_dir with variable 6. Both end in
2B:A9E5 (Y velocity 0 while variable 3 is odd).
Variable 8 = 1 (past an edge): nothing until the position along the way reaches the middle of the cell; then it is
put there, 2B:A9BC moves it one pixel toward the old surface side, variable 8 = 2 (or 0 for a surface of kind 3 or
more, never), and the outer corner: variable 2 = variable 3 - 2 (mod 4), variable 3 = the old variable 2,
e17_set_dir. Variable 8 = 2: nothing until the middle of the cell; then e17_reprobe, variable 8 = 0, 2B:A9E5.
"""
