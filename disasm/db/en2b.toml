model = '''
def clamp_ok(rd, wr, ra, rp):
    o = rd[0x6E]
    cam = x2b_w(rd, 0xDD, 0xDE)
    lo, hi = (cam + 0x10) & 0xFFFF, (cam + 0xF0) & 0xFFFF
    x = x2b_w(rd, 0x82 + o, 0x94 + o)
    if x2b_s16((x - lo) & 0xFFFF) < 0:
        new, edge = lo, 0
    elif x2b_s16((x - hi) & 0xFFFF) >= 0:
        new, edge = hi, 2
    else:
        return bool(rp & 1) and x2b_w(wr, 0x82 + o, 0x94 + o) == x
    if rp & 1 or wr[0x70 + o] != 0x80:
        return False
    if x2b_w(wr, 0x82 + o, 0x94 + o) != new or x2b_w(wr, 0x6074 + o, 0x6086 + o) != new:
        return False
    vlo, vhi = rd[0x60E0 + o], rd[0x60F2 + o]
    want = 0 if vhi & vlo == 0 else [0, 1, 1, 0][edge + (vhi >= 0x80)]
    return ra == want
