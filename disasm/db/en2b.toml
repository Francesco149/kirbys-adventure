# ================================================================= type $24

[[script]]
at = "2B:A000"
name = "e24_start"
desc = """
First script of object type $24: a saucer with a dome that sits on the ground spinning, takes off, flies to a place
beside Kirby at his height, crosses to his other side and flies up (main@12950: the pink saucer in the middle;
main@87600: in the air at the right). Kinds $44-$46 create it with the speed class 0-2 in variable 1. Bank 22, the
position routine obj_pos_cull, the pose table 32:84CE, obj_param = the class, 2 hit points, variable 5 = 0, variable
3 = 1, random below 4: 0 gives variable 2 = 3, anything else variable 2 = 1 (the first ground state), and on into
e24_ground.
"""

[[script]]
at = "2B:A026"
name = "e24_ground"
desc = """
Type $24 on the ground (also entry 2 of e24_scripts, after e24_tick_clear): tick routine e24_tick_ground, then a
loop of one frame until variable 2 is 4 (binop_reg add $FC, jne), sound $51, and the thread parks: e24_st_lift
starts e24_rise.
"""

[[script]]
at = "2B:A039"
name = "e24_rise"
desc = """
Entry 0 of e24_scripts (started by e24_st_lift): tick routine e24_tick_rise, Y velocity -$0080 (half a pixel per frame
upward), and a loop of one frame until variable 3 is 0 (e24_tick_rise counts it down from $28). Then (2B:A04A) tick
routine e24_tick_fly, velocity 0, variable 3 = $78 (the frames of a pass beside Kirby) and the thread parks.
"""

[[script]]
at = "2B:A053"
name = "e24_climb"
desc = """
Entry 1 of e24_scripts (started by e24_tick_fly after its second pass): tick routine e24_tick_climb, X velocity 0,
a loop of one frame until variable 3 is not 0 (e24_tick_climb sets it when the climb is at full speed); then with
variable 5 = 0 variable 5 = 1 and tick routine e24_tick_clear, and the thread parks (with variable 5 not 0 it would
park with e24_tick_climb, never happened). Ran once (main@87795).
"""

[[data]]
at = "2B:A071"
len = 18
name = "e24_fly_tabs"
format = "bytes"
desc = """
For e24_tick_fly: the X offset of the point beside Kirby by side (variable 2), low bytes 2B:A071 ($40, $C0) and high
bytes 2B:A073 (0, $FF); the high bytes 2B:A075 (FF 00 FF 00) shared by the Y velocities and the X steps; the low
bytes of the Y velocity 2B:A079 ($C0, $40, $C0, $40: -$40 up, +$40 down; index (direction + $40 has bit 7) + 2 for
a class not 0); the low bytes of the X step 2B:A07D ($9A, $66, $67, $99: -$66, +$66 for class 0, -$99, +$99 for the
others; index (direction below $80) + 2 for a class not 0); and the limits of the X speed's high byte by class at
2B:A081 (2, 3, and for class 2 the byte $50 at 2B:A083, which is also the first byte of e24_reactions).
Entry 0 of the Y velocities (2B:A079) was never read.
"""

[[data]]
