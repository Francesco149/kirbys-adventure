# ================================================================= type $17

[[script]]
at = "2B:A389"
name = "e17_start"
desc = """
First script of object type $17: a small creature that crawls along the edges of blocks, round every corner, and
now and then leaps off toward Kirby, steers at him and dashes through (main@6260: the two small things at the
cross of blocks; slots 10 and 14). Kinds $41-$43 create it with variable 0 = 0 and the speed class 0-2 in variable
1; kinds $47 and $48 with variable 0 = 1 (classes 0 and 2): those never leap. Bank 22, the position routine
obj_pos_cull (3E:D9BB), the pose table 30:83D5, obj_param = the class (obj_param_set), e17_set_wait (variable 9),
2 hit points, variable 3 = 1, variable 5 = 0, pose 0, variable 6 = 0, then e17_attach. Variable 6 not 0 (a surface
was found): e17_crawl_loop. Otherwise (2B:A3AE, e17_drop) variable 2 = 0 (the floor side), variable 6 = 2, tick
routine e17_tick_fall, velocity 0, pose 0, and the thread parks until a landing starts e17_crawl_loop.
"""

[[script]]
at = "2B:A3AE"
name = "e17_drop"
desc = "Type $17 without a surface: variable 2 = 0, variable 6 = 2, tick routine e17_tick_fall, velocity 0, pose 0, and the thread parks. Entered from e17_start and at the end of e17_recover."

[[script]]
