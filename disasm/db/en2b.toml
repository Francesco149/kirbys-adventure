name = "e17_crawl_loop"
desc = """
Type $17 on a surface (entry 0 of e17_scripts): tick routine e17_tick_crawl, velocity 0, then for ever pose 0 and
pose 1, each for e17_crawl_waits[obj_param] frames (asm_tab_wait). The bytes 2B:A3D1-2B:A3DB after it (entry 4 of
e17_scripts: tick routine 2B:A69E, X velocity 0, Y velocity $0080, park; 2B:A69E would land it with 22:8CD9) never
ran.
"""

[[script]]
at = "2B:A3DC"
name = "e17_leap"
desc = """
Type $17 leaps off its surface toward Kirby (entry 1 of e17_scripts, started by e17_tick_crawl). Tick routine
e17_hit (the hit test only: nothing moves it but the script), obj_face_kirby, the X velocity $0080 toward Kirby
(asm_vx); the poses 0, 2, 3 for 8 frames each with the Y velocities -$0300, -$0200, -$0180, then the poses 4, 5, 6,
4 for 6 frames each with -$0100, -$00B3, -$0066, 0; then five rounds of the poses 4, 7, 5, 8, 6, 9 (2 and 1
frames). Then (2B:A41E) tick routine e17_tick_home and from 2B:A422 (e17_home) obj_aim_kirby, variable 2 = 1 and
the poses 6-9 one frame each, for ever.
"""

