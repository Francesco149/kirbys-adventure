Type $17 dashes at Kirby (entry 2 of e17_scripts, started by e17_tick_home when it is near the point it steers
to). Tick routine e17_tick_dash, obj_face_kirby, Y velocity 0, and with the poses 6-9 stepping by 2: the X velocity
-$0180 (backward, asm_vx) for 8 frames, -$00C0 for 8, sound $3E, then $0400 (4 pixels per frame forward). While
