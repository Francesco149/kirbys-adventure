unit = "en2b"
title = "Object types $17, $23, $24, $42: the block crawler, the dropping blob, the saucer and the knight boss of bank 2B"
summary = """
Bank 2B from 2B:A000 to 2B:BC50: four object types, each with a first script, behaviour scripts, tick routines that
begin with the hit test 3F:E31D and a record of bank 39, and small tables, in the pattern of unit en24b.

Type $17 (e17_*; kinds $41-$43 with the speed class 0-2 in variable 1, $47 and $48 with variable 0 = 1): a small
creature that crawls along the outline of blocks (main@6260, at the cross of blocks). e17_attach finds a surface
round the new object (else it drops, e17_drop / e17_tick_fall, until it lands); variable 2 is the side the surface
is on and variable 3 the way it moves (0 down, 1 left, 2 up, 3 right), variable 6 the kind of the surface and
variable 8 the corner state. e17_crawl follows the surface with e17_probe (the four probes of unit probes at a point
8 pixels to that side), rounds outer corners in the middle of a cell and turns onto a wall in its way;
e17_set_dir gives obj_dir and the speed of the class ($00CD, $0140, $0300). Every 20 frames (variable 9; never for
variable 0 not 0) with Kirby in a box of $40 pixels, one chance in two to leap (e17_leap): it rises from the surface,
then steers every 12 frames by $10 toward a point $40 pixels beside Kirby (e17_tick_home) and, close to it, dashes
(e17_dash: back, then 4 pixels per frame through Kirby, leaving the puffs of type $54 of unit en24b), swings up, steers
once more, dashes again and leaves; after the first dash e17_tick_turn sends it back (e17_recover) when no surface
is near. Its records have the inhale number 4.
Type $24 (e24_*; kinds $44-$46, class 0-2): a saucer with a dome (main@12950, main@87600). On the ground
(e24_tick_ground, gravity) it goes through five states in variable 2 (e24_states), spinning (e24_spin_step: variable
6 the phase, variable 9 the sense, variable 8 the frames between steps) slower and faster; variable 3 counts each
state's frames. At the end of state 4 it rises for $28 frames (e24_rise), then flies to a point $40 pixels beside
Kirby at his height, steering every 8 frames (e24_tick_fly); after $78 frames it crosses to his other side when he is
within $18 pixels in height, and after a second pass climbs away faster and faster (e24_climb), and when no block is
near it falls and starts over. In the air its hit test keeps its hit points (e24_hit_fly): it can only be inhaled.
Inhale number $12.
Type $23 (e23_*; kind $90): a light blue blob (main@20960) that walks in bursts of a few frames, stands, and drops at
4 pixels per frame when it walks or stands off a ledge (e23_fall), landing with the effect $0C and a shudder
(e23_land). Inhale number $10. A hop at Kirby (2B:AA9C) is in the ROM but never ran.
Type $42 (e42_*; kind $D7): the boss of bank 2B, a masked knight with a cape and a sword (the game's Meta Knight; fought
once in main, main@105421-106925; the claims split that fight in two windows; the credits' demo fight from
cov2-save-finished@148144 also ran the walk steps 1 and 2 and action 14, e42_lunge, whose routines unit en_more
documents). It leaves Kirby an item of type 5 (the sword),
waits until he takes it, fills its bar (e42_fill: variable 0 up to $3C, shown through hud_boss_slot), leaps in and
chooses actions (e42_act and e42_actions; the globals $0785 timer to the next choice, $0786 flags, $0788 record
index, $0789, $078A hurt count, $078B blink frames, $07A9 palette flash): walk to a point $40 pixels beside Kirby
(e42_tick_walk, e42_approach), slash when he is within $20 pixels (e42_slash), run at him and dash (e42_run,
e42_dash), whirl down with the sword (e42_spin). Its hit test (e42_hit) reacts to a hit with a pause of $18 frames
with a palette flash (e42_hurt) and then 30 frames of blinking with a record that takes no damage. An object of the
same type with variable 0 = 1 is the sword's hit box (e42_tick_sword: placed by the boss's pose, 24 poses).
Beaten (e42_beaten), it changes its picture, the figure it was falls (e42_cape, variable 0 = 2), it hops to the
middle, two pieces fly apart (e42_piece, 3 and 4), it climbs out of the screen (e42_unmasked) and leaves an object of
type 6 (e42_gone).

Open:
- Never ran: type $17's slope corner (2B:A806-2B:A846), e17_reprobe failing (2B:A95C), the scripts 2B:A3D1 and
  2B:A3A1 (entries 4 and 5 of e17_scripts), e17_tick_turn finding a surface or water (2B:A603, 2B:A683 from there);
  type $24's state 4 entered with variable 9 not 2 at the end of a pass (2B:A158), the limit of its X speed being
  reached (2B:A1E9), e24_climb with variable 5 not 0, its reaction scripts (e24_reactions); type $23's hop
  (e23_unused, 2B:AB59-2B:AB6F, the tick routine 2B:AB8B) and the end of e23_stand (every stand ended with a drop),
  its inhaled script e23_inhaled; the boss's actions 0, 5-7, $0B, $0C, $0F, $11-$14, $16, $17 (e42_unused_*; 4, 9 and $15 ran in cov3-b-mk / cov3-c-mk), the
  reactions 1 (inhaled, 2B:B012) and 3 (kind 1, 2B:B021) of variable 5, a hit during the blink (2B:AFA7), Kirby
  without the sword (2B:AF37, record 39:887C), $0788 not 0 (39:884C, 39:8864), e42_clamp_x clamping, the tick routine
  e42_unused_l, and the inner paths of e42_cape_vx, e42_fall_stop, e42_after_leap's $FF.
- Seen one way only: the boss's spin poses with the boss facing left; e42_kirby_dx with the boss right of Kirby;
  e42_tick_run toward the left. Of the speed tables of type $17 the class 1 entries were never read, of e24_spin_times
  only class 0.
- The meaning of the inhale numbers ($04, $10, $12, $18) is Kirby's units'. What 22:8452, 22:8A6C, 22:8AC6, 22:8AE7,
  22:8D21, 22:8D84, 22:8DDC, 22:8777, 22:9340, 22:92B1, 3F:E26A and the position routine 3E:D97D compute is used here
  by address. The effect $0C and the objects of type 5 (variable 0 = 5) and 6 (variable 0 = 2) belong to other units.
- The bytes 2B:BC51-2B:BFFF after the last routine were never read.
- The names of types $17, $23 and $24 are left open: their pictures do not settle them.
"""

# ================================================================= shared model

[[model]]
name = "en2b_model"
code = '''
E17_DIRS = [0x80, 0xC0, 0x00, 0x40]
E17_SLOPE_DIRS = {3: 0x30, 4: 0x50, 5: 0x20, 6: 0x60, 7: 0x20, 8: 0x60}
E17_SPEEDS = [0x00CD, 0x0140, 0x0300]
E17_WAITS = [10, 8, 3]
E17_HOME_WAITS = [12, 9, 6]
E17_HOME_SPEEDS = [0x0100, 0x0100, 0x0280]
E17_SCRIPTS = [0xA3BC, 0xA3DC, 0xA431, 0xA4CD, 0xA3D1, 0xA3A1]

def x2b_script(wr, addr):
    """obj_set_script gave a thread the address addr in bank 2B."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == 0x2B for t in range(32))

def x2b_any_script(wr):
    return any(wr.get(0x63C0 + t) is not None for t in range(32))

def x2b_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def x2b_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def x2b_spawned(wr, typ):
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]
'''

