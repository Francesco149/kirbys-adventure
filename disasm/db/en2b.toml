desc = """
Tick routine of e24_ground. e24_hit; carry set: nothing more. obj_collide0: landed, or a ceiling (bit 1 of A): Y
velocity 0; otherwise obj_gravity. Then a jump (call_target) to the routine of the ground state in variable 2
