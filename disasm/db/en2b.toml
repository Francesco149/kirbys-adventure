[[sym]]
at = "2B:AF1F"
name = "e42_hit"
desc = """
What every tick routine of the boss begins with. obj_dir and variable 0 are pushed. With kirby_ability not 3 or bit
4 of kirby_flags set (2B:AF37-2B:AF84, never ran: Kirby without the sword) the record 39:887C would be used. Otherwise:
$078B not 0 (it blinks after a hit): bit 7 of obj_sprite_bank flips every 4 frames, $078B - 1, the hit test with the
record 39:8834, and both are put back. $078B = 0: bit 7 of obj_sprite_bank cleared; variable 5 not 0 (it is hurt):
2B:B0C3 (e42_hurt's count); otherwise the hit test with the record of $0788 (e42_recs: 39:881C for 0, the only one
used), and a reaction that set variable 5 is carried out at once through e42_reacts (1 inhaled: 2B:B012, 2 damaged:
e42_hurt, 3 kind 1: 2B:B021; only e42_hurt ran). With variable 5 still 0, obj_dir and variable 0 are put back and,
when the test answered carry set, the caller is dropped.
The records 39:881C / 884C / 8864 (by $0788) and 39:8834, 39:887C: a box of 8 x 8, flags $80, inhale number $18,
hurt byte 8, score entry $16 (39:8834 and 39:887C: 0); the reactions set variable 5 to 1 (inhaled), 2 (damage) or 3
(kind 1), and the hit points gone and kind 2 start e42_beaten (in some of them).
"""
comments = { "AF85" = "blinking after a hit", "AFCB" = "not blinking", "AFDD" = "the hit test by $0788", "AFFD" = "a reaction set variable 5" }

