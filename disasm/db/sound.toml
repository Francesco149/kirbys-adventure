    def __init__(s, rd, romrd):
        s.rd, s.rb, s.W, s.ev, s.seen = rd, romrd, {}, set(), set()
        b = {k >> 13 for k in romrd} - {0x1D}
        s.mb = b.pop() if len(b) == 1 else None

    def R(s, addr):
        return s.W[addr] if addr in s.W else s.rd[addr]

    def off(s, addr):
        addr &= 0xFFFF
        return 0x3A000 + addr - 0x8000 if addr < 0xA000 else s.mb * 0x2000 + addr - 0xA000

    def rom(s, addr):
        s.seen.add(s.off(addr))
        return s.rb[s.off(addr)]

    def also(s, addr):
        s.seen.add(s.off(addr))

    def base(s, x):
        return 0x607 if x < 5 else 0x617

    def vol_out(s, x):
        t = s.R(0x69B + x)
        v = max((t & 15) - ((0xFF - t) >> 4), 0)
        v = max(v - ((0xFF - s.R(0x603 if x >= 5 else 0x602)) >> 4), 0)
        c = s.R(0x637 + x)
        r = s.base(x) + c
        s.W[r] = (0xFF if v >= 4 else 0) if c == 8 else (s.R(r) & 0xC0) | 0x30 | v

    def env_vol(s, x, v):
        s.W[0x69B + x] = (s.R(0x69B + x) & 0xF0) | v
        s.vol_out(x)


