        W = s.W
        if num & 0x80:
            s.sfx_stop()
            return s
        mask, prio = s.rom(0x8AEF + num), s.rom(0x8B47 + num)
        if s.R(0x604) and s.R(0x604) & mask:
            for y in range(4, -1, -1):
                if s.R(0x6D7 + y) & mask:
                    if s.R(0x6DC + y) < prio:
                        s.ev.add("refused")
                        return s
                    s.ev.add("cut")
