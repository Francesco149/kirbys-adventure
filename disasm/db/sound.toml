unit = "sound"
title = "The sound engine of bank 1D: tracks, streams, envelopes and the APU"
summary = """Bank 1D ($8000) holds the whole sound engine; the fixed bank reaches it through four wrappers that map the bank
and restore it: snd_init_far (boot), snd_play (A = sound number, or $80-$FF to silence all sounds), snd_music (A = song
number, or $80-$FF to stop the music) and snd_frame_far, which the NMI handler 3E:C341 calls once per frame with the
song's bank (snd_music_bank) mapped at $A000.

There are ten tracks. Tracks 5-9 play the song, tracks 0-4 play sounds. A track is live while snd_count is nonzero. Each
has a channel (snd_chan: 0, 4, 8, $C = the APU register offset of square 1, square 2, triangle, noise; DMC commands ride
on a $C track), a stream pointer (snd_ptr_lo/hi), and an envelope with its own stream pointer (snd_env_lo/hi). Tracks
never write the APU: song tracks write a 16-byte copy of $4000-$400F in snd_music_regs, sound tracks one in
snd_sfx_regs, and at the end of snd_frame each channel's four registers are taken from the sound copy when a live
sound claims the channel (snd_sfx_busy, bit = channel / 4) and from the song copy otherwise, and sent to the APU only
where they differ from what was last sent (snd_apu_last). Only the DMC registers $4010-$4013 and $4015 are written
directly by stream commands.

snd_frame, for each track 9 down to 0 that is live: count snd_count down, and at 0 run the track stream
(snd_track_step) until a note, rest or wait sets a new count; then snd_release_tick; then count snd_env_count down and
at 0 run the envelope stream (snd_env_step). The output volume of a track is envelope volume - (15 - track volume) -
(15 - master volume), each step floored at 0 (snd_vol_out; snd_master_vol has one byte for sounds and one for the song,
and scripts fade the song by writing the second).

A sound request (snd_request) looks the number up in four parallel tables: header pointer (snd_sfx_lo/hi), channel
mask and priority. If a live sound holds one of the mask's channels with a priority value lower than the new one, the
request is dropped; otherwise the live sounds on those channels are cut and the new sound's tracks go into the free
slots from 4 down. snd_music_start stops tracks 5-9, takes header pointer and bank from snd_song_lo/hi/bank and
starts the header's tracks in slots 9 down.

STREAM FORMAT (every address below is the instruction that reads the byte; `ADV` is 1D:84E6, the load in
snd_next_byte, which is how every operand is read unless another reader is named. ADV reads more than operands. The
step that consumes the last byte of an element advances the pointer with snd_next_byte, so the first byte of the next
element is read by ADV before its own reader sees it: with two readers recorded per byte, an element's first byte shows
ADV and the dispatch read, and a first byte reached by a header, a jump, a call, a loop or a return shows the dispatch
read first. And the load is `lda ($22),y` with whatever Y the element left, so that advance can read a byte further on
instead, whose value is thrown away (the dispatch reads again with Y = 0). The stray read is at the next element's
address plus: snd_chan after $F0 and $F1; snd_chan + 3 after $E3; 4n and $FF after $F6 n with bit 7 set; after a note,
4 * snd_inst and $FF if bit 7 of snd_inst is clear, else 0 if snd_gate is nonzero, else the note's length; after a rest
with a table length, snd_len_row + the length code; the stack index before the drop when a $FD loop ends (track and
envelope streams). In every other case the offset is 0. The model of claim sound.frame.model predicts every one of
these reads.)

Header (sound: bank 1D, at snd_sfx_lo/hi[number], all 88 inside 1D:8B9F-8DBB; song: bank snd_song_bank[number], at
snd_song_lo/hi[number], in banks 1E, 1F, 20): one count byte N = 1-5 (read 1D:806F for a sound, 1D:813D for a song),
then N records of 3 bytes: stream address low (1D:80E9), high (1D:80EF), channel 0 / 4 / 8 / $C (1D:80F5). A stream
is in the bank of its header. A sound header is read only as far as free slots exist.

Track stream, element at P, dispatch read 1D:8250:
- $00-$DF note: bits 7-5 = length code, bits 4-0 = pitch field. Re-read at 1D:8262 (track on channel $C) or 1D:8288
  (other channels), then at 1D:8308 (snd_note_len). Length code 0-5: snd_len_tab[snd_len_row + code] frames, the element
  is 1 byte. Code 6 ($C0-$DF): 2 bytes, the second is the length in frames (ADV, called from 1D:8310). A length of 0
  makes the step go on with the next element in the same frame.
  Channel 0/4/8: field $10 = rest; otherwise the field is a signed note (0-$F = 0..15, $11-$1F = -15..-1) added to
  snd_transpose, and the sum indexes snd_periods. Channel $C: bit 4 set = start the DMC sample with rate = bits 3-0
  ($4010, then $4015 = $0F, $1F); bit 4 clear: bits 3-0 = $F is a rest, anything else the noise period.
- Commands ($E0-$FF), re-read at 1D:8326; one operand byte n unless stated:
  $E0 a b (3 bytes): $4012 = a, $4013 = b (DMC sample address and length).
  $E3 n: add signed n to the channel's period.
  $F0 n: track volume = n (low 4 bits).  $F1 n: add signed n to the track volume (below 0 gives 0).
  $F2 n: snd_len_row = 6n.  $F3 n: wait n frames (count = n, nothing else changes).
  $F4 n: snd_gate = n.  $F5 n: snd_transpose = n.  $F6 n: instrument n; with bit 7 set its first envelope starts at
  once and notes no longer restart it.
  $FF (1 byte): end of the track; the pointer stays on it.
  Flow, re-read at 1D:8441 (snd_flow), stack index snd_sp:
  $F8 lo hi (3 bytes): jump; operands read by 1D:8448 and 1D:844C, not ADV.
  $FA lo hi (3 bytes): call; pushes P+3 (the byte at P+3 is also read by ADV, called from 1D:8460).
  $FB (1 byte): return to the pushed address.
  $FC n (2 bytes): loop start; pushes P+2 and the count n.
  $FD (1 byte): loop end; counts the top entry down, goes back to its address while it is not 0, else drops it.
Envelope stream (bank 1D, 1D:873A-88B0, addressed by the pointer pairs of snd_inst_envs), element at Q, dispatch read
1D:8543; every element is 1 byte except the flow commands:
- $00-$1F: wait that many frames (re-read 1D:8549).
- $20-$3F: add the signed nibble (bits 3-0) to the period (re-read 1D:864A in snd_nibble, then 1D:855F).
- $40-$5F: envelope volume = bits 3-0 (re-read 1D:8571, 1D:855F).
- $60-$7F: add the signed nibble to the envelope volume, at most 15 (re-read 1D:864A, 1D:855F).
- $80-$9F: duty = bits 1-0 (re-read 1D:859D, 1D:855F).
  In $20-$9F bit 4 set means: stop here until the next frame; clear: go on with the next element at once.
- $FF: end; the envelope stays on it (re-read 1D:85BA).
- $F8, $FA, $FB, $FC, $FD: as in a track stream (re-read 1D:85BA, then 1D:8441), with stack index snd_env_sp.
An instrument is two envelope pointers: the first starts with each note (or once, see $F6), the second starts when
snd_release, set at a note to length * snd_gate / 256, has counted down to 0, or in the frame a rest begins if it has
not started yet.

Open: never ran, so not described: track commands $E1, $E2, $F7 and $FE (by the code $E1 n, $E2 a b, $F7 n, $FE a b;
$F7 would select another period table through snd_period_sel, which is always 0), the upper clamp of $F1; envelope
bytes $A0-$DF and $F0 (by the code $F0 n writes register 1 of the channel; $A0-$DF return without advancing), the
floor of $60-$7F below 0; any other byte $E4-$EF, $F9 reaching snd_flow (it returns without advancing). In the windows
the claims run on, $FA / $FB never occurred in an envelope stream and no $10-$1F, $30-$3F or $90-$9F byte was seen.
The early return of snd_play when demo_number is nonzero and of snd_music when bit 6 of $05FB is set never ran. Row 9
of snd_len_tab was never read; 13 of the 58 songs (1, 2, 4, $10, $12, $1C, $1F, $21, $26, $29, $2B, $33, $34) were never started (claim
cov6_extra.snd.headers: every byte of the other songs' headers was read; an older list here named 25), and every
sound was (the sound test of cov6-j-x starts all 88; before it 0, $16, $2A, $4D, $52, $53, $56 were listed as never
started). The track commands $E1, $E2, $F7, $FE and the envelope byte $F0 occur in no stream that a header or an
instrument reaches (claim cov6_extra.snd.no_unrun_commands), so nothing in this ROM can run them. What $0781 (set to $FF by snd_init,
never read), $0601 and snd_last_sfx are for is not known. Where the DMC samples are ($4012 values of the $E0 command)
and what the songs and sounds are in the game is not in the unit. The streams themselves (1D:8DBC up, banks 1E-20)
are not data regions here."""

# ---------------------------------------------------------------- routines
[[sym]]
at = "3F:F804"
name = "snd_init_far"
desc = "Maps bank 1D at $8000, calls snd_init and restores the bank that was there. Called by the boot routine 18:A000."

[[sym]]
at = "3F:F826"
name = "snd_play"
desc = """Requests a sound: with bank 1D mapped at $8000 it calls snd_request with A, then restores the bank. X and Y are
preserved; $10 is left holding the number. It tests demo_number first and would return at once when that is nonzero;
in the corpus it was 0 at every call."""
in = "A = sound number 0-$57, or $80-$FF to silence every sound"

[[sym]]
at = "3F:F859"
name = "snd_music"
desc = """Starts a song: stores A in snd_song, then with bank 1D mapped at $8000 calls snd_music_start with A and restores
both banks ($8000 and $A000). X and Y are preserved; $10 is left holding the number. Bit 6 of $05FB is tested after
snd_song is written and would skip the rest; it was clear at every call."""
in = "A = song number 0-$39, or $80-$FF to stop the song"

[[sym]]
at = "3F:F8A0"
name = "snd_frame_far"
desc = """The engine's entry from the NMI handler (3E:C341), once per frame: maps bank 1D at $8000 and the bank in
snd_music_bank at $A000, calls snd_frame, and restores both banks and mmc3_select."""

[[sym]]
at = "1D:8000"
name = "snd_init"
desc = """Resets the engine: $4011 = 0, both bytes of snd_master_vol = $FF, $0781 = $FF, $4015 = $0F, all 16 bytes of
snd_apu_last = $0E, snd_song = $FF; then snd_music_start with A = $FF (stop the song) and it falls into snd_request
with A = $FF (silence the sounds)."""

[[sym]]
at = "1D:8028"
name = "snd_request"
desc = """Starts sound A, or with A >= $80 goes to snd_sfx_stop. The sound's channel mask (snd_sfx_chan_mask) is tested
against snd_sfx_busy; where they overlap, slots 4 down to 0 whose snd_sfx_mask overlaps the new mask are examined: one
with snd_sfx_prio below the new priority (snd_sfx_prio_tab) ends the request there (slots already examined stay cut),
any other is cut (snd_count = 0). Then snd_last_sfx = A, snd_req_mask = the mask, and the header at snd_sfx_lo/hi is
read: for each free slot from 4 down, snd_track_init starts the next track of the header and the slot gets the new
priority and mask, until the header's count is used up or the slots are. It ends in snd_sfx_chans. Scratch: $01
(tracks left), $02 (priority), $18/$19 (header pointer)."""
in = "A = sound number, or $80-$FF"
comments = { "8033" = "does a live sound use one of these channels?", "8045" = "its priority value is lower: give up", "806F" = "header: number of tracks", "8075" = "free slots, 4 down" }

[[sym]]
at = "1D:808F"
name = "snd_sfx_chans"
desc = "snd_sfx_busy = the OR of the five snd_sfx_mask bytes. Returns it in A."

[[sym]]
at = "1D:809E"
kind = "part"
name = "snd_sfx_stop"
desc = "The A >= $80 case of snd_request: for slots 0-4 snd_count = 0, snd_sfx_mask = 0, snd_sfx_prio = $FF, and snd_sfx_regs is reloaded from snd_regs_init. snd_sfx_busy is left as it was (snd_frame recomputes it)."

[[sym]]
at = "1D:80CC"
name = "snd_track_init"
desc = """Starts track X from a 3-byte header record: snd_transpose = $27, snd_gate, snd_volume, snd_inst, snd_len_row and
snd_period_sel = 0, snd_sp = snd_sp_init[X], snd_ptr_lo/hi and snd_chan = the three bytes at ($18),Y+1..Y+3, snd_count
and snd_release = 1 (so the stream is read on the next frame). Y is advanced by 3 and $01 (tracks left) decremented;
Z is set when it reaches 0."""
in = "X = track; ($18),Y = the byte before the record; $01 = tracks left"
out = "Y + 3; Z set when $01 reached 0"

[[sym]]
at = "1D:8105"
name = "snd_music_start"
desc = """Stops the song (snd_count of tracks 5-9 = 0, snd_music_regs reloaded from snd_regs_init) and, with A < $80,
starts song A: snd_music_bank = snd_song_bank[A], which is also mapped at $A000 (bank_a000, MMC3 register 7), and for
the header at snd_song_lo/hi[A] one track per record is started with snd_track_init in slots 9 down to 5."""
in = "A = song number, or $80-$FF to stop only"
comments = { "813D" = "header: number of tracks" }

[[sym]]
at = "1D:8153"
name = "snd_frame"
desc = """One frame of the engine. $4017 = $C0. For each track 9 down to 0 with snd_count nonzero: $24/$25 = the address
of its register copy (snd_regs_lo/hi: snd_sfx_regs for tracks 0-4, snd_music_regs for 5-9); snd_count is decremented and
at 0 snd_track_step runs with the track's stream pointer in $22/$23, which is stored back afterwards; snd_release_tick;
snd_env_count is decremented and at 0 snd_env_step runs the same way on snd_env_lo/hi. Then every sound slot 0-4 whose
snd_count is 0 gets snd_sfx_prio = $FF and snd_sfx_mask = 0, snd_sfx_chans recomputes snd_sfx_busy, and for each of
the four channels the four register bytes are taken from snd_sfx_regs (bit of snd_sfx_busy set) or snd_music_regs and,
where a byte differs from snd_apu_last, stored there and written to $4000-$400F. Last, $4011 = $7F when bit 4 of $4015
(DMC playing) reads clear; in a frame in which a DMC note started the sample there was never such a write."""
comments = { "815A" = "tracks 9 down to 0", "8169" = "note counter", "8188" = "envelope counter", "81A9" = "free the sound slots that ended", "81BE" = "bit 0: square 1 from the sound copy", "823C" = "DMC idle: level $7F" }

[[sym]]
at = "1D:824B"
kind = "part"
name = "snd_track_next"
desc = "Where a track command ends: advances the stream pointer by one (snd_next_byte) and falls into snd_track_step."

[[sym]]
at = "1D:824E"
name = "snd_track_step"
desc = """Runs track X's stream at ($22) until an element sets a nonzero snd_count. A byte $E0-$FF goes to snd_track_cmd.
Any other byte is a note. On a channel $C track: bit 4 set writes $4010 = bits 3-0 and $4015 = $0F then $1F (DMC
start); bit 4 clear and bits 3-0 = $F is a rest; otherwise bits 3-0 go to register 2 of the channel's copy (noise
period). On other channels: bits 4-0 = $10 is a rest; otherwise the field, sign-extended from bit 4, plus snd_transpose
is given to snd_set_period. Then snd_note_len sets snd_count from the same byte. After a note snd_release = $FF, or with
snd_gate nonzero the high byte of length * snd_gate (a length of 0 counting as 256), and snd_env_restart starts the
envelope; after a rest snd_release becomes 1 if it was not 0. With a length other than 0 the pointer is advanced past
the element and the step returns; with 0 it goes on with the next element."""
in = "X = track; $22/$23 = stream pointer; $24/$25 = register copy"
out = "$22/$23 = pointer to the next element"
comments = { "8250" = "dispatch read", "8262" = "channel $C: noise / DMC byte", "8288" = "pitched channel: note byte", "82A1" = "rest", "82B8" = "note: length, release time, envelope", "82CE" = "length * gate, high byte" }

[[sym]]
at = "1D:82E6"
name = "snd_env_restart"
desc = "Starts the first envelope of the track's instrument (snd_env_start with A = snd_inst) unless bit 7 of snd_inst is set."

[[sym]]
at = "1D:82EB"
name = "snd_env_start"
desc = """Starts an envelope of track X: snd_env_lo/hi = the pointer at snd_inst_envs + (4A and $FF), snd_env_sp =
snd_env_sp_init[X], snd_env_count = 1 (the envelope stream is read later in this frame or on the next). snd_release_tick
enters at 1D:82EE with Y = 4 * snd_inst + 2, the instrument's second pointer."""
in = "A = instrument number; X = track"

[[sym]]
at = "1D:82EE"
kind = "label"
name = "snd_env_start_y"

[[sym]]
at = "1D:8306"
name = "snd_note_len"
desc = """Sets snd_count of track X from the note byte at ($22): bits 7-5 = 6 takes the next stream byte (the pointer
advances), otherwise snd_len_tab[snd_len_row + bits 7-5]."""
out = "A = the length"

[[sym]]
at = "1D:8326"
kind = "part"
name = "snd_track_cmd"
desc = """The track commands, a chain of compares on the byte at ($22). $F0 n: high nibble of snd_volume = n, then
snd_vol_out. $F1 n: n is added to the high nibble; with n negative a result below 0 becomes 0. $F2 n: snd_len_row = 6n.
$F3 n: snd_count = n, snd_release = $FF, and the step ends with the pointer after n. $F4 n: snd_gate = n. $F5 n:
snd_transpose = n. $F6 n: snd_inst = n, and with bit 7 of n set snd_env_start. $E0 a b: $4012 = a, $4013 = b. $E3 n:
snd_period_add with n sign-extended. $FF: snd_count = 0, snd_env_count = 0, envelope volume 0 (snd_env_vol_set), and
the step ends with the pointer still on the $FF. Any other byte goes to snd_flow with snd_sp as the stack index, and
the step continues at the pointer snd_flow leaves. All but $F3, $FF and the flow bytes continue at snd_track_next."""
comments = { "8326" = "command byte", "832C" = "$F0 n", "8349" = "$F1 n", "836D" = "$F2 n", "8380" = "$F3 n", "8392" = "$F4 n", "839F" = "$F5 n", "83AC" = "$F6 n", "83BE" = "$F7 n (never ran)", "83CB" = "$E0 a b", "83DE" = "$E2 a b (never ran)", "8408" = "$E3 n", "8418" = "$E1 n (never ran)", "8425" = "$FF", "8431" = "flow commands" }

[[sym]]
at = "1D:8441"
name = "snd_flow"
desc = """The flow commands shared by track and envelope streams. $26 is the stack index into snd_stack (the caller loads
it from snd_sp or snd_env_sp and stores it back). $F8 lo hi: pointer = hi:lo. $FA lo hi: the address of the byte after
the operands is pushed (high, then low, index - 2) and pointer = hi:lo. $FB: pointer = the pushed address, index + 2.
$FC n: the address after n is pushed and then n (index - 3); the pointer is left after n. $FD: the count on top is
decremented; not 0: pointer = the address above it; 0: index + 3 and the pointer advances past the $FD."""
in = "$22/$23 = pointer to the command; $26 = stack index; Y = 0"
out = "$22/$23 = where the stream continues; $26"
comments = { "8441" = "flow byte", "8447" = "$F8: operands read here, not by snd_next_byte", "8458" = "$FA", "847E" = "$FB", "8493" = "$FC", "84B4" = "$FD", "84D5" = "$FE (never ran)" }

[[sym]]
at = "1D:84E0"
name = "snd_next_byte"
desc = "Advances the stream pointer $22/$23 by one and returns the byte at ($22),Y. Where the byte is used (an operand) Y is 0; where a step only advances past an element Y can be anything and the byte read is discarded."
out = "A = the byte"

[[sym]]
at = "1D:84E9"
name = "snd_set_period"
desc = """Writes the period of note A to track X's register copy. The period table is the one snd_period_tabs names for
snd_period_sel (always 0: snd_periods), each entry high byte first. Register 2 of the channel = the low byte; register
3 = the high byte, OR snd_reg3_bits[X], OR $10 when bit 4 of the value last sent to that APU register (snd_apu_last) is
clear: the bit alternates, so the copy always differs from what was sent and the register is written again."""
in = "A = note number (pitch field + snd_transpose); X = track"

[[sym]]
at = "1D:8524"
name = "snd_release_tick"
desc = "Counts snd_release of track X down unless it is 0 or $FF; when it reaches 0 the instrument's second envelope starts (snd_env_start_y with Y = 4 * snd_inst + 2)."

[[sym]]
at = "1D:853E"
kind = "part"
name = "snd_env_next"
desc = "Where an envelope element that does not wait ends: advances the pointer by one (snd_next_byte) and falls into snd_env_step."

[[sym]]
at = "1D:8541"
name = "snd_env_step"
desc = """Runs track X's envelope stream at ($22) until an element waits. $00-$1F: snd_env_count = the byte, pointer
advanced, done. $20-$3F: snd_period_add with the signed low nibble (snd_nibble). $40-$5F: snd_env_vol_set with the low
nibble. $60-$7F: the signed low nibble is added to the low nibble of snd_volume, a result of 16 or more becomes 15, then
snd_env_vol_set. $80-$9F: bits 7-6 of register 0 of the channel's copy = bits 1-0 (duty). After each of these, bit 4 of
the byte set: snd_env_count = 1, pointer advanced, done; clear: snd_env_next. $FF: snd_env_count = 0, pointer unchanged,
done. Other bytes from $E0 go to snd_flow with snd_env_sp as the stack index."""
in = "X = track; $22/$23 = envelope stream pointer; $24/$25 = register copy"
out = "$22/$23 = pointer to the next element"
comments = { "8543" = "dispatch read", "8549" = "$00-$1F: wait", "8557" = "$20-$3F: bend", "855D" = "bit 4: wait a frame", "8571" = "$40-$5F: volume", "857C" = "$60-$7F: volume change", "859D" = "$80-$9F: duty", "85BA" = "$E0-$FF", "85C0" = "$F0 n (never ran)", "85D0" = "$FF: end", "85D6" = "flow commands" }

[[sym]]
at = "1D:85E7"
name = "snd_env_vol_set"
desc = "Low nibble of snd_volume of track X = A (the envelope volume), then it falls into snd_vol_out."
in = "A = 0-15; X = track"

[[sym]]
at = "1D:85F3"
name = "snd_vol_out"
desc = """Computes the output volume of track X and writes it to the register copy. v = low nibble of snd_volume - (15 -
high nibble), not below 0; then v - (15 - high nibble of the master volume), not below 0, with snd_master_vol for tracks
0-4 and snd_master_vol+1 for 5-9. Channel 8 (triangle): register 0 = $FF when v >= 4, else 0. Other channels: register
0 keeps bits 7-6 and gets $30 | v."""
in = "X = track; $24/$25 = register copy"

[[sym]]
at = "1D:8648"
name = "snd_nibble"
desc = "The low nibble of the byte at ($22) as a signed number: A = bits 3-0, and with bit 3 set A |= $F0 and Y = $FF; otherwise Y = 0."
out = "A = low byte, Y = sign extension"

[[sym]]
at = "1D:8666"
name = "snd_period_add"
desc = "Adds the 16-bit number Y:A to the period of track X's channel in the register copy (registers 2 and 3; the carry from the low byte goes into register 3)."
in = "A = low byte, Y = high byte; X = track; $24/$25 = register copy"

# ---------------------------------------------------------------- data
[[data]]
at = "1D:80BC"
len = 16
name = "snd_regs_init"
format = "rows:4"
desc = "The idle contents of a register copy, four bytes per channel: $30 $7F $00 $FF for the squares, zeros for the triangle, $30 $00 $00 $FF for noise. Copied to snd_sfx_regs by snd_sfx_stop and to snd_music_regs by snd_music_start."

[[data]]
at = "1D:8249"
len = 2
name = "snd_bit_masks"
format = "bytes"
desc = "$08 and $10: the operands of the BIT instructions that test the sign bit of a nibble (snd_nibble) and bit 4 of a note byte (snd_track_step)."

[[data]]
at = "1D:851A"
len = 10
name = "snd_reg3_bits"
format = "bytes"
desc = "By track: the bits snd_set_period ORs into register 3. 0 for the sound tracks 0-4, $20 for the song tracks 5-9. Entry 0 was never read."

[[data]]
at = "1D:867A"
len = 150
name = "snd_periods"
format = "rows:16"
desc = "The period table: 75 periods, high byte first, one semitone apart, from $7FF down to $01C. Indexed by pitch field + snd_transpose. Nothing limits the index: in the corpus snd_set_period also read past the end, into snd_regs_lo."

[[data]]
at = "1D:8710"
len = 10
name = "snd_regs_lo"
format = "bytes"
desc = "By track: low byte of the address of its register copy ($07 = snd_sfx_regs for tracks 0-4, $17 = snd_music_regs for 5-9)."

[[data]]
