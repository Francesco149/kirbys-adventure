    def rom(s, addr):
        s.seen.add(s.off(addr))
        return s.rb[s.off(addr)]

    def also(s, addr):
        s.seen.add(s.off(addr))

    def track_init(s, x, h):
        W = s.W
        W[0x687 + x] = 0x27
        for t in (0x691, 0x69B, 0x6A5, 0x6AF, 0x6B9):
