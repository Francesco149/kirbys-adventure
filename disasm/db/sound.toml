        s.W[0x673 + x] = s.rom(0x88B2 + i)
        s.W[0x6CD + x] = s.rom(0x872E + x)
        s.W[0x65F + x] = 1

    def period_add(s, x, v, ext=None):
        r = s.base(x) + s.R(0x637 + x) + 2
        t = s.R(r) + v
        s.W[r] = t & 0xFF
        s.W[r + 1] = (s.R(r + 1) + ((0xFF if v & 0x80 else 0) if ext is None else ext) + (t >> 8)) & 0xFF

    def flow(s, p, sp):
        b = s.rom(p)
        st = 0x6E1
        if b == 0xF8:
            return s.rom(p + 1) | s.rom(p + 2) << 8, sp
        if b == 0xFA:
            t = s.rom(p + 1) | s.rom(p + 2) << 8
            r = (p + 3) & 0xFFFF
            s.W[st + sp - 1] = r >> 8
            s.W[st + sp - 2] = r & 0xFF
            s.also(r)
            return t, sp - 2
        if b == 0xFB:
            return s.R(st + sp) | s.R(st + sp + 1) << 8, sp + 2
        if b == 0xFC:
            r = (p + 2) & 0xFFFF
            s.W[st + sp - 1] = r >> 8
            s.W[st + sp - 2] = r & 0xFF
            s.W[st + sp - 3] = s.rom(p + 1)
            s.also(r)
            return r, sp - 3
        if b == 0xFD:
            c = (s.R(st + sp) - 1) & 0xFF
            s.W[st + sp] = c
            if c:
                return s.R(st + sp + 1) | s.R(st + sp + 2) << 8, sp
            s.also(p + 1 + sp)
            return p + 1, sp + 3
