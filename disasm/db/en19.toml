[[model]]
name = "en19_model"
code = '''
G19_BOUNCE = [0x05, 0x0A, 0x0F, 0x14, 0x18, 0x1C, 0x20, 0x24, 0x27, 0x2A, 0x2D, 0x30, 0x32, 0x34, 0x36, 0x38,
              0x39, 0x3A, 0x3B, 0x3C, 0x3C, 0x3D, 0x3D, 0x3E, 0x3E, 0x3D, 0x3C, 0x3A, 0x38, 0x34, 0x30, 0x2A,
              0x24, 0x1C, 0x14, 0x0A, 0x00]
G19_FLIGHT = [0x0F, 0x12, 0x16, 0x1A, 0x1D, 0x20, 0x24, 0x28, 0x2B, 0x2E, 0x32, 0x36, 0x39, 0x3C, 0x40, 0x44,
              0x47, 0x4A, 0x4E, 0x52, 0x55, 0x58, 0x5C, 0x60, 0x63, 0x66]
G19_ROWS = [0x80, 0x00, 0x00, 0x00, 0x81, 0x01, 0x01, 0x01, 0x82, 0x02, 0x02, 0x02, 0x83, 0x03, 0x03, 0x03,
            0x84, 0x04, 0x04, 0x04, 0x85, 0x05, 0x05, 0x05, 0x86, 0x06]
G19_LAND = [0x0319, 0x02A9, 0x0239, 0x01C9, 0x0159, 0x00E9, 0x0079]
G19_SCORE = [0, 10, 30, 80, 200, 500]
G19_SKY_PALS = [0x4E, 0x4F, 0x50, 0x51, 0x52, 0x53, 0x54, 0x55, 0x56, 0x57, 0x58, 0x59]
G19_SKY_Y = [0x0269, 0x0239, 0x0201, 0x01C9, 0x0191, 0x0159, 0x0121, 0x00E9, 0x00B1, 0x0079, 0x0034, 0x0000]
E04_STAR_VX = [0x0080, 0x0040, 0xFF80, 0xFFC0]
E05_FALL = [(0x20, 0x0280), (0x10, 0x0140)]
E05_STAR_VX = [0x0166, 0x019D, 0x01CC]

def e19_script(wr, lo, hi, bank=0x19):
    """obj_set_script (or a script's jump) gave a thread the address hi:lo in the bank."""
    return any(wr.get(0x6380 + t) == lo and wr.get(0x63A0 + t) == hi and wr.get(0x63C0 + t) == bank for t in range(32))

def e19_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def e19_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def e19_spawned(wr, typ):
    return [i for i in range(0, 18) if wr.get(0x6128 + i) == typ]

def e19_sky(cam):
    """The index of the first height of goal_sky_y that is not above the camera's Y."""
    for i, h in enumerate(G19_SKY_Y):
        if cam >= h:
            return i
    return None
'''

[[claim]]
id = "en19.tables"
about = ["goal_bounce_tab", "goal_flight", "goal_rows", "goal_land_lo", "goal_land_hi", "goal_scores", "goal_sky_pals", "goal_sky_y", "e04_star_vx", "e04_star_vy", "e05_fall_acc", "e05_fall_lim_lo", "e05_fall_lim_hi", "e05_star_vx_lo", "e05_star_vx_hi"]
text = "The tables of the unit hold the literals of the model en19_model: the bounce heights (37), the flight times and the rows by power (26 each), the landing heights of the seven rows, the scores of the rows 0-5, the twelve sky palettes and their camera heights, the star's four X velocities and its Y velocity $0300, the items' fall steps and limits, the ability star's three X speeds."
kind = "static"
use = ["en19_model"]
model = '''
def en19_static(u8):
    b = lambda n, i: u8(O(n) + i)
    w2 = lambda n, i: u8(O(n) + 2 * i) | u8(O(n) + 2 * i + 1) << 8
    return ([b("goal_bounce_tab", i) for i in range(37)] == G19_BOUNCE
        and [b("goal_flight", i) for i in range(26)] == G19_FLIGHT
        and [b("goal_rows", i) for i in range(26)] == G19_ROWS
        and [b("goal_land_lo", i) | b("goal_land_hi", i) << 8 for i in range(7)] == G19_LAND
        and [w2("goal_scores", i) for i in range(6)] == G19_SCORE
        and [b("goal_sky_pals", i) for i in range(12)] == G19_SKY_PALS
        and [w2("goal_sky_y", i) for i in range(12)] == G19_SKY_Y
        and [w2("e04_star_vx", i) for i in range(4)] == E04_STAR_VX
        and [w2("e04_star_vy", i) for i in range(4)] == [0x0300] * 4
        and [(b("e05_fall_acc", i), b("e05_fall_lim_lo", i) | b("e05_fall_lim_hi", i) << 8) for i in range(2)] == E05_FALL
        and [b("e05_star_vx_lo", i) | b("e05_star_vx_hi", i) << 8 for i in range(3)] == E05_STAR_VX)
'''
expect = "en19_static(u8)"

# ================================================================= the goal game (Kirby's script)

[[script]]
at = "19:A000"
name = "goal_k_start"
desc = """
Kirby's script in the goal game, the room at the end of every stage where he bounces on a springboard and flies up
past seven rows of clouds (main@2259-2623). kirby_s_start (unit kst14) reaches it at 14:A04D for that room; it is not
a script of kirby_script_lo / hi. Sound volume $FF, the draw routine 3E:DDAA, sprite palette entries 24-31 from 19:AFD3
(3E:DF61), variable 8 = 0, goal_mark_off = 0, 3E:DEE1 with the bytes at 19:A018, tick routine goal_k_tick_fly, X
position - 8, sprite map 1A:9910 (the goal game's pose table), pose 8 for $1B frames. Then kirby_vy_zero, tick routine
goal_k_tick_wait, pose $0E, sound 5, variable 0 = 0 (the bounce counter), and every frame goal_bounce_step: Kirby rides
the springboard (the object of type 4 in slot 3) down and up, and goal_k_tick_wait starts goal_k_launch when A or B is
pressed. A whole bounce without a press (19:A049, 9 times) sets variable 1 (kirby_facing, the power) to 0, starts
goal_k_stars and goes on at 19:A06F of goal_k_launch.
"""

[[script]]
at = "19:A04F"
name = "goal_k_launch"
desc = """
Kirby jumps off the springboard (started by goal_k_tick_wait at a press of A or B). goal_power turns the bounce counter
(variable 0) into the power in variable 1 (kirby_facing: 1-25, highest at the bottom of the bounce), goal_mirror sets
the counter to the same height on the way up; variable 3 = 0 and goal_k_stars starts as a second thread. Every frame
kirby_step_from_speed and goal_bounce_step until the bounce has ended. From 19:A06F: sound $11, an object of type $0D
32 pixels above him (3E:DED0: slots 9-17, variable 0 = 7; type $0D is unit en24c's), sound $45, goal_prize (the flight
time into variable 0, the row 0-6 into variable 1, a flag into variable 2), tick routine goal_k_tick_rise, pose 2,
kirby_vy = -$0800 (21:885C), and he rises for variable 0 frames; tick routine goal_k_tick_fly for $20 frames; 3E:DF06
with 3. With variable 2 = 0: variable 8 = 1 (the stars stop), tick routine goal_k_tick_fall, pose 8, and the thread
parks until goal_k_tick_fall lands him on his row. With variable 2 not 0: goal_k_bump.
"""

[[script]]
at = "19:A0AE"
name = "goal_k_bump"
desc = """
The flight of a power whose entry in goal_rows has bit 7 set (the powers 0, 4, 8, 12, 16, 20, 24: the first of each
row; 10 times): variable 8 = 1, tick routine kirby_step_from_speed (21:95CD, no gravity), pose $20 for $18 frames, then
four times sound $23 with the poses $21-$23, and 2 x 4 steps of the camera's Y (add_e0 -1, every 2 frames) with poses
$22 and $23; Y position - 8; and on at 19:A0D8 (goal_k_land) without goal_k_tick_fall.
"""

[[script]]
