# ================================================================= claims: the goal game

[[claim]]
id = "en19.goal.bounce"
about = ["goal_bounce_step", "goal_bounce_tab", "goal_k_start", "e04_board"]
text = "goal_bounce_step sets Kirby's Y position (slot 1) to $0415 + goal_bounce_tab[v] and slot 3's to $0421 + the same, with v = Kirby's variable 0 before the call; slot 3's pose = 1 exactly when v = $18; variable 0 = v + 1, and A = 1 exactly when that is $25."
kind = "call"
fn = "goal_bounce_step"
on = ["main@2280+90", "main@5030+80", "w1-v2-opus@3700+60", "w12-sonnet@15960+60", "w1-v2-sonnet@6215+50"]
min_calls = 100
use = ["en19_model"]
model = '''
def goal_bounce_ok(rd, wr, ra):
    v = rd[0x61CB]
    if v >= 37:
        return False
    y1, y3 = 0x415 + G19_BOUNCE[v], 0x421 + G19_BOUNCE[v]
    return (wr[0xB9] == y1 & 0xFF and wr[0xCB] == y1 >> 8 and wr[0xBB] == y3 & 0xFF and wr[0xCD] == y3 >> 8
        and wr[0x62C9] == (1 if v == 0x18 else 0) and wr[0x61CB] == v + 1 and ra == (1 if v + 1 == 0x25 else 0))
'''
expect = "goal_bounce_ok(rd, wr, ra)"
cases = { "rd[0x61CB] == 0x24" = 5, "rd[0x61CB] == 0x18" = 3, "rd[0x61CB] < 0x18" = 40 }

[[claim]]
id = "en19.goal.power"
about = ["goal_power"]
text = "goal_power writes kirby_facing = v + 1 for a bounce counter v below $19 and ($18 - 2 * (v - $18) + 1) & $FF otherwise (both happen)."
kind = "call"
fn = "goal_power"
on = ["main@2280+20", "main@5040+40", "w12-opus@3340+20", "w1-v2-sonnet@6240+20", "w3-sonnet@3340+20"]
