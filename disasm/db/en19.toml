unit = "en19"
title = "Bank 19: the goal game, the dance after a boss, the items (type 5), the ice block (type 7)"
summary = """
Bank 19 apart from Kirby's states $D0-$D9: the goal game at the end of every stage (Kirby's script there and the
objects of type 4 it creates), Kirby after a boss (type $6E) and the dance that follows (type 4 again), the items
Kirby takes by touching them (type 5), the block of ice an enemy becomes (type 7) and the scene of a new ability.

The goal game (goal_k_*, Kirby's own script, reached from kirby_s_start; 216 times, main@2259 first). Kirby bounces
on the springboard (e04_board, slot 3): goal_bounce_step moves both by goal_bounce_tab, 37 frames a bounce, counting in
Kirby's variable 0. A or B (goal_k_tick_wait) launches him: goal_power makes the power 1-25 from the counter (25 at
the bottom of the bounce), goal_mirror continues the bounce upward; a bounce without a press gives power 0. While he
rises, goal_k_stars leaves six sparks (e04_star) that fall from him and come back to him until his variable 8 is set.
goal_prize turns the power into the frames of the rise (goal_flight) and the row 0-6 (goal_rows: power / 4), kept in
kirby_facing (his variable 1) from then on. He rises at 8 pixels per frame, falls with gravity profile 3 and stands on
the cloud of his row (goal_k_tick_fall, goal_land_lo / _hi); the first power of each row (0, 4 ... 24) takes
goal_k_bump instead. goal_sky changes the background palette with the camera's height (goal_sky_y, goal_sky_pals).
goal_mark_set gives goal_mark_off (unit roomtick) the row + 1. The sign of the prize (e04_sign) appears beside him
with a second figure (e04_kirby); for the rows 0-5 it jumps and shows the prize, goal_score adds goal_scores[row]
(0, 10, 30, 80, 200, 500 in the score's tens), and Kirby dances the row's dance (goal_k_row0-3; 4 and 5 never ran);
on the top row (once, w1-v2-opus@3896) the figure takes the sign, goal_1up adds a life, and three figures dance
(e04_dance_lead / e04_dance_side, a dance picked by goal_pick_dance). goal_k_end fades out and sets leave_code 4.
goal_seq ($05FF) counts goal games in a row whose rows went 0, 1, 2 ... (goal_seq_step; 7 was never reached).

Type 4 (e04_*): no room list names it; e04_start picks by variable 0 the springboard (0), a star block that, by the
picture, Kirby's inhale pulls out and that goes into bank 22's inhale script (1, w3-sonnet@64070), the dancers after a boss (2, 3), the sparks
(4), the second figure (6), the sign (7) and the top row's dancers (9, $0A); 5 and 8 never ran.

Type $6E (e6e_*): the Star Rod piece of a boss (unit en23) retypes Kirby to $6E; he falls (e6e_tick_drop), walks to
the middle of the screen (e6e_side, e6e_tick_walk) and creates three dancers of type 4 (e04_dancer, e04_dancer2),
which dance the dance of the world ($0557; e04_dance_w1 and six more) and end the stage through dance_end (leave_code
5).

Type 5 (e05_*): e05_start picks by variable 0 (copied to variable 2, which hit_item of unit hit reads): 0-3 the items
of the room lists (kinds $35-$37 and $91; 1 is the 1-up), which fall (e05_fall, slower in water) and stand on floors
(e05_floor) with a record whose only reaction is e05_inhaled (it flies into Kirby's mouth and takes effect by
variable 2); 4 the ability star Kirby drops (e05_star: $30 frames before it can be taken, bounces with sound $41,
stays inside Kirby's limits, is freed $180 pixels away from him, vanishes after 260 ticks or as soon as Kirby has an
ability); 5 the sword the sword boss leaves (e05_sword, once: it drops from the top of the screen and waits to be
taken).

Type 7 (e07_*): the script 19:B2A0 is the reaction to kind 2 of kirby_rect in the records of the ordinary enemies; it
retypes the enemy to 7 and makes it a shaking block (attract@4492, Kirby with ability $0C: by the picture a block of
ice); hit points gone, it ends with sound $4E and an effect.

abl_show (19:B0AD) is the scene of a new ability that bank 18 calls far: a pose animation per kirby_ability.

Open:
- Never ran: Kirby's states $D0-$D9 (19:B307-B768, kirby_script_lo / hi entries $D0-$D9, and kirby_form 8 / 11 of
  kirby_s_start's table) are not described; the dances of the rows 4 and 5 (19:A2EF, 19:A352); goal_seq reaching 7
  (19:AE0B, 19:AE1D, 19:AB96, 19:A3FE); the type 4 entries 5 (19:AB08) and 8 (19:AC54, with the unreached code
  19:AE2C-AE65 it calls); the ice block's end after its $78 frames (19:B2C3); the item 2 inhaled (19:B821); the ability
  star in water (19:B854 and the code 19:B918-B950); for extra_state 2 the test of kirby_min_x = $0010 (19:B95D-B962;
  the rest of that path ran once in cov4-b-star, claim kst_cov4.star_bounds.free); the abl_show entries listed in
  its entry; dance_end with $F4 = 2. The code at 19:ADBE, 19:AF6C-AFD2 and from 19:BB50 was never reached.
- 3E:DE51 (a spawn from six operand bytes: type, dX, dY, dZ, variable 0, a direction offset; slots 0-17, the creator's
  slot in variable 2), 3E:DE45 (music), 3E:DE4B (sound), 3E:DED0, 3E:DF61 (sprite palette entries from a record, used
  with 19:AFD3 and 19:AFDB, which are not named), 3E:DEE1, 3E:DF06, 3F:E2D9, 3F:EB2F, 21:99EA, 22:802E, 22:8090,
  22:8003, 22:8103, 22:8107 and 16:B22A / 16:B206 (what the items 0 and 3 do when inhaled) are used by address. What
  the items 0, 2 and 3 are in the game is not shown by the evidence here (hit_item's values 0 and 2 never ran).
- $0784 is used as the dance number of goal_pick_dance (other units use it as obj_param of slot 0); $0557 equals
  world in the windows. What goal_k_bump's camera steps and poses show was not looked at.
- Bank 2F was not documented this round. What was seen: type $3D (2F:A011, kind $D5, main@59542-61434: the cloud with
  one eye, main@60840) with a jump table on variable 0 (2F:A01F, 9 entries: 2F:A033 the boss,
  2F:A68B, whose first script is type $3E's, and parts it creates with 3E:DED0 as type $3D with variable 0 = 1, 5, 6,
  7) and its hit tests at 2F:A114, 2F:AEAB, 2F:B165; type $3F (2F:B2A9, kind $D9, main@130463-132400: the orb of the
  final fight in space, main@130900 / 131700, where Kirby flies with the Star Rod; unit kst17) with a jump table on
  variable 0 (2F:B2BF, 14 entries) and parts of type $3F with variable 0 = 2, 8-$0C; 2F:A000 sets the camera limits
  (2 runs); 2F:AFC2, 2F:AFFC, 2F:B7FA write palette_base (unit video). 436 instructions of the bank never ran.
"""

