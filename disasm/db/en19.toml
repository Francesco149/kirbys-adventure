text = "e05_star_bounds (extra_state was never 2 in these windows) writes the X position kirby_min_x when it was below it and kirby_max_x when it was above it, calling obj_turn exactly then, and the Y position kirby_min_y with Y velocity 0 when it was above it; each happens."
kind = "call"
fn = "e05_star_bounds"
on = ["main@22200+200", "main@52000+300", "w12-sonnet@34330+300", "w3-sonnet@56700+400", "w12-sonnet@67680+200"]
min_calls = 300
model = '''
def e05_bounds_ok(rd, wr, ran, calls):
    s = rd[0x6E]
    x = rd[0x82 + s] | rd[0x94 + s] << 8
    lo = rd[0x5C8] | rd[0x5C9] << 8
    sx = lambda v: v - 0x10000 if v & 0x8000 else v
    if sx((x - lo) & 0xFFFF) < 0:
        nx = lo
    else:
        hi = rd[0x5CA] | rd[0x5CB] << 8
        nx = hi if sx((x - hi - 1) & 0xFFFF) >= 0 else None
    if ("obj_turn" in calls) != (nx is not None):
        return False
    if nx is not None and (wr[0x82 + s], wr[0x94 + s]) != (nx & 0xFF, nx >> 8):
        return False
    y = rd[0xB8 + s] | rd[0xCA + s] << 8
    ylo = rd[0x5CC] | rd[0x5CD] << 8
    if sx((y - ylo) & 0xFFFF) < 0:
        return (wr[0xB8 + s], wr[0xCA + s], wr[0x6104 + s], wr[0x6116 + s]) == (ylo & 0xFF, ylo >> 8, 0, 0)
    return 0xB8 + s not in wr
'''
expect = "rd[0x78C9] != 2 and e05_bounds_ok(rd, wr, ran, calls)"
cases = { "ran('19:B982')" = 3, "ran('19:B99C')" = 1, "ran('19:B9B6')" = 2 }

[[claim]]
id = "en19.e05.star_near"
about = ["e05_star_near"]
text = "e05_star_near frees the star (obj_free) exactly when its world X or world Y differs from Kirby's by $180 or more; both happen."
kind = "call"
fn = "e05_star_near"
on = ["main@22200+200", "attract@6000+100", "main@1255+300", "w12-sonnet@34288+300"]
min_calls = 300
model = '''
def e05_near_ok(rd, ran):
    s = rd[0x6E]
    far = False
    for lo, hi in ((0x6074, 0x6086), (0x6098, 0x60AA)):
        d = ((rd[lo + s] | rd[hi + s] << 8) - (rd[lo + 1] | rd[hi + 1] << 8)) & 0xFFFF
        if d & 0x8000:
            d = 0x10000 - d
        if d >= 0x180:
            far = True
            break
    return far == (ran("19:BA13") > 0)
'''
expect = "e05_near_ok(rd, ran)"
cases = { "ran('19:BA13')" = 2 }

