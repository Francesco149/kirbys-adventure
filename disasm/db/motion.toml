[[claim]]
id = "motion.integrate"
about = ["obj_integrate", "obj_x_frac", "obj_x_lo", "obj_x_hi", "obj_y_frac", "obj_y_lo", "obj_y_hi", "obj_vx_lo", "obj_vx_hi", "obj_vy_lo", "obj_vy_hi"]
text = "Every call of obj_integrate leaves the 24-bit X position of the current object equal to the old one plus the sign-extended 16-bit X velocity, the same for Y, writes nothing else, and returns the object in X."
kind = "call"
fn = "obj_integrate"
on = ["main@500+200", "main@60000+200", "main@133557+200", "w12-opus@30000+200"]
min_calls = 400
max_calls = 1500
expect = "(lambda o: integrated(rd, wr, o) and len(wr) == 6 and rx == o)(rd[0x6E])"
model = '''
def s16(lo, hi):
    v = lo | hi << 8
    return v - 0x10000 if v & 0x8000 else v

def add24(p, v):
    return (p[0] | p[1] << 8 | p[2] << 16) + v & 0xFFFFFF

def pos(m, o, base):
    b = (0x70, 0x82, 0x94) if base == 'x' else (0xA6, 0xB8, 0xCA)
    return tuple(m[a + o] for a in b)

def val24(p):
    return p[0] | p[1] << 8 | p[2] << 16

def integrated(rd, wr, o):
    return (val24(pos(wr, o, 'x')) == add24(pos(rd, o, 'x'), s16(rd[0x60E0 + o], rd[0x60F2 + o]))
        and val24(pos(wr, o, 'y')) == add24(pos(rd, o, 'y'), s16(rd[0x6104 + o], rd[0x6116 + o])))

def w16(m, lo, hi, o):
    return m[lo + o] | m[hi + o] << 8

def world(wr, o):
    return (w16(wr, 0x6074, 0x6086, o), w16(wr, 0x6098, 0x60AA, o))

def cam(m):
    return (m[0xDD] | m[0xDE] << 8, m[0xE0] | m[0xE1] << 8)

def draw(wr):
    return (wr[0x6A] | wr[0x6B] << 8, wr[0x6C] | wr[0x6D] << 8)

def sub16(a, b):
    return a - b & 0xFFFF

def signed(v):
    return v - 0x10000 if v & 0x8000 else v

def culled(rd, wr, x):
    return wr.get(0x62FC + x) == 0xFF and (rd[0x6128 + x] >= 0x80 or wr[0x6128 + x] == 0xFF)

def cull_ok(rd, wr, x):
    dx = signed(sub16(w16(rd, 0x6074, 0x6086, x), rd[0xDD] | rd[0xDE] << 8))
    if not -16 <= dx < 272:
        return culled(rd, wr, x) and 0x6C not in wr
    dy = signed(sub16(w16(rd, 0x6098, 0x60AA, x), rd[0xE0] | rd[0xE1] << 8))
    if not -16 <= dy < 208:
        return culled(rd, wr, x)
    return draw(wr) == (dx & 0xFFFF, dy & 0xFFFF) and 0x62FC + x not in wr
'''

