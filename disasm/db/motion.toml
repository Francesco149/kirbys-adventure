unit = "motion"
title = "Object motion: coordinates, velocities, the move and position routines, the camera"
summary = """
Every object has a position of three 24-bit coordinates (fraction, low, high byte; X and Y on the zero page, the
third at $603E / obj_z_lo / $6062), two signed 16-bit velocities in 1/256 pixel per frame, and a second, 16-bit
copy of each coordinate, the world position (obj_wx / obj_wy / obj_wz), which is what the position routines and
other objects read.

The move routine of an object (obj_move_lo/hi of unit objects, called by obj_run after the object's threads)
turns one into the other. The default, `obj_move`, adds the velocities to the position (`obj_integrate`) and
copies the position to the world position (`obj_copy_world`). The variants: copy only (`obj_move_copy`), nothing
(`obj_move_none`, used by Kirby, whose own code moves him), position relative to slot 1 (`obj_move_rel_kirby`),
and position relative to the camera (`obj_move_screen`).

The position routine of an object (obj_position_lo/hi, called in the draw pass) leaves the 16-bit draw position
in draw_x / draw_y for the draw routine. The default, `obj_pos_camera`, subtracts the camera (cam_x, cam_y) from
the world position; `obj_pos_world` uses the world position as it is (objects placed in screen coordinates);
`obj_pos_cull` also deletes the object once it is more than 16 pixels outside a 256 x 192 window; `kirby_pos`
starts a script for slot 1 when its draw Y is 192 or more.

The camera is a 24-bit X and Y (fraction $DC / $DF) with a 16-bit velocity each; the script opcodes set_dd,
set_e0, set_e2, set_e4 of unit vm write these. In a scrolling stage other code sets cam_x from Kirby's position
every frame.

Open:
- Which object types use which variant, and what stores the pointers (the scripts' on_move / on_position
  operands), is not listed.
- Three more move routines ran in one stretch of one movie each (the last fights and the ending of `main`), which
  is one situation, so they have no entry: 3E:D91D (41 calls from frame 132,877; reads as cam_integrate, then
  obj_move_screen), 3E:D942 (168 calls from frame 137,541; reads as cam_integrate, obj_integrate,
  obj_copy_world) and 3E:D94B (8 calls from frame 132,868; reads as obj_integrate, then $E4/$E5 added to the
  object's Y fraction / low byte, a different use of those two bytes than the camera velocity). They need a
  second movie that reaches those scenes.
- obj_pos_near_kirby (3E:DA09): the branch that deletes the object when it is two or more screens from slot 1
  never ran.
- kirby_pos: the script it starts (14:A4F8) ran twice; what it is (falling off the bottom) is not checked.
- The third coordinate is only copied here; what uses it besides the draw order (obj_sort_draw) is unknown.
- The camera's own logic (13:A422 and the other writers of cam_x / cam_y) is not documented.
"""

[[sym]]
at = "3E:D864"
name = "obj_move"
desc = "The default move routine: obj_integrate, then (through obj_move_copy) obj_copy_world."

[[sym]]
at = "3E:D867"
name = "obj_move_copy"
desc = "A move routine without velocities: jumps to obj_copy_world. Also the second half of obj_move."

[[sym]]
at = "3E:D86A"
name = "obj_move_none"
desc = "A move routine that does nothing (a lone rts). Slot 1 (Kirby) uses it."

[[sym]]
at = "3E:D86B"
name = "obj_move_rel_kirby"
desc = "A move routine: obj_integrate, then obj_world_rel_kirby, so the object's position is an offset from slot 1."

[[sym]]
at = "3E:D871"
name = "obj_integrate"
desc = "Add the velocities of the current object to its position: X position (24-bit) += obj_vx (signed 16-bit, sign-extended), Y position += obj_vy. Leaves the object in X."
out = "X = cur_object"

[[sym]]
at = "3E:D8A6"
name = "cam_integrate"
desc = "Advance the camera: cam_x (24-bit with its fraction) += cam_vx (signed 16-bit), then falls into cam_integrate_y."

[[sym]]
at = "3E:D8BD"
name = "cam_integrate_y"
desc = "cam_y (24-bit with its fraction) += cam_vy (signed 16-bit)."

[[sym]]
at = "3E:D8D5"
name = "obj_copy_world"
desc = "Copy the current object's position to its world position: low and high byte of X, Y and the third coordinate (the fractions are dropped). Leaves the object in X."

[[sym]]
at = "3E:D8F8"
name = "obj_world_rel_kirby"
desc = "World position of the current object = its position + the world position of slot 1 (16-bit, X and Y; the third coordinate is not written)."

[[sym]]
at = "3E:D920"
name = "obj_move_screen"
desc = "A move routine for objects positioned in screen coordinates: obj_integrate, then world position = position + camera (obj_world_from_screen)."

[[sym]]
at = "3E:D923"
kind = "part"
name = "obj_world_from_screen"
desc = "World position of object X = its position + the camera (16-bit, X and Y). Entered by falling in from obj_move_screen and by a jump from 17:BB2B."

[[sym]]
at = "3E:D968"
name = "obj_pos_world"
desc = "A position routine: draw_x / draw_y = the world position of object X, unchanged."
in = "X = object"

[[sym]]
at = "3E:D97D"
name = "obj_pos_camera"
desc = "The default position routine: draw_x = world X - cam_x, draw_y = world Y - cam_y (16-bit). Returns with the zero flag from the high byte of draw_y."
in = "X = object"

[[sym]]
at = "3E:D99C"
name = "kirby_pos"
desc = "Position routine of slot 1: obj_pos_camera; then, when draw_y is not in 0-191, sets slot 1's obj_pose to $FF and replaces its threads by the script at 14:A4F8 (obj_set_script)."
in = "X = object"

[[sym]]
at = "3E:D9BB"
name = "obj_pos_cull"
desc = "A position routine that deletes objects that left the screen: draw_x = world X - cam_x; draw_y = world Y - cam_y; when draw_x is outside -16..271 or draw_y outside -16..207, obj_sprite_bank of the object is set to $FF (so it is not drawn this frame) and the object is deleted (obj_free). When X is already outside, draw_y is not computed."
in = "X = object"

[[sym]]
at = "3E:DA09"
name = "obj_pos_near_kirby"
desc = "A position routine: compares the high byte of (world X - slot 1's world X); in the corpus it always continues in obj_pos_camera. The other branch (two or more screens away: obj_sprite_bank = $FF, obj_free) never ran."
in = "X = object"

