text = "Experiment: with obj_integrate patched to return at once (an rts as its first byte) for 60 frames from main@600, obj_move still runs but the X position low byte of at least one slot differs from the untouched run."
kind = "effect"
on = "main@600"
frames = 60
patch = { "3E:D871" = 0x60 }
expect = "n('obj_move') > 0 and any(ram[0x82 + s] != ctl[0x82 + s] for s in range(18))"
