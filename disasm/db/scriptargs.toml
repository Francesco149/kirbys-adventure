unit = "scriptargs"
title = "Parameter bytes of the 6502 routines that scripts call"
summary = """A script calls 6502 code with asm_w (an address in the $8000 window, the script's own $A000 window or the
fixed banks) or asm_far (address and bank). Many of those routines read parameter bytes from behind the calling
instruction with script_arg (3E:D7B1), which moves the script pointer past them, so the script goes on after the
bytes. [script_args] says how many bytes each such routine takes: by CPU address for a routine in the $8000 window
or a fixed bank (the bank at $8000 is the thread's, set by set_bank), by bank and address for one in the $A000
window (the script's own bank) or called by asm_far. The script model reads the bytes as operands of the calling
instruction and decodes the script on after them. The counts were found from the evidence: at every place that
ran, the bytes after the instruction up to the next opcode fetch were read as data and never ran; 17:BA52 and
14:BA52 (once the bank is part of the key) agree. The claim below checks every execution in its windows: the
thread never continues among the declared bytes.

Open: routines whose count differs by call site (none found), routines that ran at no site where the next opcode
was fetched (they move the script pointer themselves, or end the thread) are not declared."""

