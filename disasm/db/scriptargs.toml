[[claim]]
id = "scriptargs.continue"
about = ["script_arg"]
text = "On every execution of asm_w and asm_far in the windows that calls a routine declared in [script_args], the thread does not continue at one of the declared parameter bytes; asm_w and asm_far each run at least 3 times in the windows."
kind = "vmlen"
ops = ["asm_w", "asm_far"]
on = ["main@400+3000", "main@20000+3000", "main@60000+3000", "main@105000+3000", "w12-opus@19000+3000", "attract@1000+3000", "cov-minigame-egg@17900+1500", "main@134700+1500"]
min = 3
