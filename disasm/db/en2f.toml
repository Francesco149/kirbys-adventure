kind = "part"
name = "e3d_glide_count"
desc = "e3d_tick_eye in the states 1 and 2: variable 4 + 1; at $40 variable 4 = 0 and, with a random number below 16 under 4, velocity 0 and state 0 (2F:A198: once, cov4-a-kracko@60867, which ended a state 2, e3d_steer of unit boss_cov4; in main the glide went on). Then on in e3d_watch."

[[sym]]
at = "2F:A1A0"
kind = "part"
name = "e3d_watch"
desc = """
e3d_tick_eye in the states 0-2: when the eye charges. Variable 5 (the count of frames since the last charge;
negative never happened, 2F:A1A5 by its code e3d_near) + 1. From $20 on, every 16 frames (low four bits 0) a
