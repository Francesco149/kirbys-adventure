        and e(9) == (0x81, 1) and all(e(i) == (0x82, 0xFF) and e(i + 1) == (0x89, 0xB9) for i in (14, 20, 26, 32))
        and e(34) == (0x81, 0x0A) and e(51) == (0x81, 0x0A) and e(72) == (0x81, 0x44) and e(77) == (0x81, 0x49)
        and A('e3f_anim_count') == 0xB989 and A('e3f_anim_speed') == 0xB98F
        and b('e3f_burst_anim', 32)[30:] == [0x81, 0x0B])
'''
