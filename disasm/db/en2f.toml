unit = "en2f"
title = "Bank 2F: the cloud boss with one eye and its ring, cloud and lightning; the orb of the last fight in space and its stars"
summary = """
Bank 2F: two bosses and their parts, in the pattern of unit en24a (first scripts that jump by variable 0, tick
routines that make the hit test 3F:E31D with a record of bank 39 and switch the object's script through
obj_set_script). Each fight happens once in main (cov-abilities-sword is a copy of main up to after the first one),
so the claims' windows split each fight in two and min_calls is what exists. The cloud boss is also shown in a short
demo fight in the credits after the ending (from cov2-save-finished@146277), which ran the rest of e3d_sweep_r, the
attacks 1 and 2 and the states 0, 2 and 5 of e3d_tick_fight; unit en_more documents those (e3d_bob, e3d_sweep2,
e3d_state_set, e3d_state_count, e3d_state_idle, e3d_pick3).

Type $3D (e3d_*; kind $D5): a boss that is an eye. By its look (a white cloud with one eye and spikes that rains
lightning) the game's Kracko. e3d_start jumps by variable 0: 0 the boss (e3d_eye), 1 the ring of four balls around
it (e3d_ring; this is also the first script of type $3E, which no object had), 5-7 the pieces of a lightning bolt.
The climb (main@59542-60457): the eye follows Kirby up a tall room; e3d_tick_eye keeps it in a box around the camera
(22:9498), the hit test with variable 0 put back (nothing hurts it), and a state machine in variable 3: 0 e3d_hover
(33 frames), 1 e3d_glide (at -$0140 along X or Y toward Kirby), and from e3d_watch (one chance in 32 every 16 frames
after frame $20, 24 in 32 from frame $78) a charge: e3d_charge_start (direction away from Kirby), 4 e3d_wind, 5
e3d_recoil (a pull back from $0400), 6 e3d_dash (back at Kirby, $0400 for $20-$28 frames), 8 e3d_brake (it turns
toward Kirby while it slows), and back to 0 (or, 3 in 16, another charge). Variable 7 tells the ring how fast to turn
(e3d_ring_waits) and when to face Kirby. When the camera reaches the top (cam_y below $0170) e3d_rise: the eye flies
off the top, the camera scrolls up by itself into the arena (e3d_rise_scroll), the eye comes back on the side away
from Kirby, the ring becomes the cloud (e3d_wake_cloud, e3d_cloud), the bar fills to 60 hit points (22:846C) and
e3d_fight begins. e3d_tick_fight: the record 39:9404; a hit shakes the boss for $18 frames (variable 5, 22:8D21 /
22:8DDC / 22:8D84) and then it blinks for 60 frames (variable 6) without a hit test; the cloud (e3d_cloud_tick)
follows, blinks along and changes its animation with the eye's variable 7. The one attack of the fight in main (e3d_pick0 picks
attack 3 first): e3d_sweep_r, a swoop down and to the right, the sky darkens (e3d_pal_storm), and the boss drifts
left raining bolts (e3d_s_bolt every 5 frames: three pieces of 2 frames each, e3d_bolt, e3d_bolt2, e3d_bolt3, that
zigzag by their pictures, e3d_bolt_zig). Beaten (e3d_beaten): the sky clears, effects, bank 22's flash and burst, and
the piece of the Star Rod (type 6, variable 0 = 2).

Type $3F (e3f_*; kind $D9): the last fight in space, Kirby with the Star Rod against a blue ball with stars (by the
place, the power orb before the last boss). e3f_start jumps by variable 0 through 14 entries. The orb (e3f_orb):
e3f_intro (the screen comes up from white, the camera pans, the orb flies in) while e3f_arrival plays Kirby flying in
and gives Kirby's object kirby_form $0E and his start script (e3f_kirby_hide, e3f_kirby_go); then a fixed order of
moves (e3f_bob, e3f_circle, e3f_burst, e3f_dashes with e3f_shot, e3f_sweep with e3f_wave) that set variable 3 for
e3f_tick: 0 e3f_spin (40 frames, the turns slower with more hit points: e3f_anim_speed), 1 e3f_fire (a volley object,
e3f_volley, when $0786 allows it: three stars, a fan of three, two that bend, in turn), 2 e3f_open (1-4 openings),
3 e3f_hold. A hit (record 39:9614) sets variable 6: e3f_blink flashes the orb for 24 frames. e3f_colors runs the
orb's colours every 8 frames and sets the sky's. Beaten (e3f_beaten): the same end as type $3D's, a type 6 with
variable 0 = 2, and the orb rises off the screen (e3f_tick_fall).

Open:
- Never ran, type $3D: the jump table's entries 2, 3, 4, 8 (2F:A7B4, 2F:A750, 2F:A782, 2F:B21F and the bytes to
  2F:B2A8: by their bytes small objects with the pose table 30:9F66 that move by 16 pixels, and 2F:B21F a creature
  with its own tick 2F:B25A and the pose table 30:8FB2); the script bytes 2F:A05E-2F:A0D7; e3d_tick_eye's states 3,
  7, 9, $0A (2F:A471-2F:A4DC, 2F:A2F5-2F:A3FB, 2F:A3E4; by its bytes 2F:A2F5 flies to the point kept in $079E-$07A2
  and state $0A ends it with the script 2F:A05E); the counting of variable 6 for kirby_action $0D (2F:A141) and its
  use in e3d_kirby_test (2F:A52E) (state 2, e3d_steer of unit boss_cov4, e3d_glide_test answering carry set and
  e3d_glide_count ending a glide ran in cov4-a-kracko); e3d_near answering carry set, the variable-5-negative path of e3d_watch (2F:A1A5), the glides to
  the right and down (2F:A648, 2F:A66D), e3d_rise_scroll's
  cam_min_y step and the side 0 (2F:A8F3, 2F:A91C), the attacks 0 (2F:AB55) and 4 (2F:AC8F), the mirror of attack 3
  (2F:AB7F and the bytes to 2F:ABFE), the mirror of attack 2 (2F:AD84-2F:AE4B), the rest of e3d_bob after its first
  two steps, e3d_tick_fight's states 1 and 4 (2F:AF08, 2F:AF9D), e3d_pick's entries 1 and 2 (2F:B0D6, 2F:B140). The
  attacks 1 (e3d_bob) and 2 (e3d_sweep2), the states 0, 2 and 5, e3d_pick's entry 3 (e3d_pick3) and e3d_pick0 with
  $078A not 0 (2F:B094) ran in the credits' demo fight only (unit en_more); what $0784-$078A count beyond its three
  attacks (3, 2, 1) is not known.
- Never ran, type $3F: the bytes after the loop of e3f_orb (2F:B37B), e3f_sweep's entries 1 and 2 (2F:B4E0,
  2F:B538) and the other wave (2F:B631-2F:B6B4), state 4 (2F:B788) and 5, e3f_top_test's state 5 (cam_y $030A or
  more), e3f_hold's stop (2F:B77B), 2F:B85F-2F:B885 (by its bytes more colours: $0F, $30). e3f_kirby_row answered 0
  only.
- What 22:8A5D, 22:8DDC, 22:8D21, 22:8D84, 22:8E7E, 22:9498, 22:93FA, 22:932F, 22:9340, 22:91D8, 3F:E2F1, 3E:DED0
  and 21:9952 compute is in their units; they are used here by address. The globals $0784-$078C (obj_param's bytes of
  the slots 0-8) are this unit's scratch for both bosses and are described per routine, not named.
- The bosses' names (Kracko, the power orb) are the usual ones for what the pictures show; nothing in the ROM states
  them. Whether the type $3E entry of the type tables is used anywhere is not known.
"""

# ================================================================= shared model

[[model]]
name = "en2f_model"
code = '''
E3D_ST_A = [0xA1A0, 0xA180, 0xA180] + [0xA204] * 8
E3D_ST_B = [0xA4DD, 0xA501, 0xA50D, 0xA471, 0xA235, 0xA24A, 0xA2BC, 0xA2F5, 0xA3FC, 0xA3E4, 0xA234]
E3D_JT = [0xA033, 0xA68B, 0xA7B4, 0xA750, 0xA782, 0xB143, 0xB195, 0xB1C5, 0xB21F]
E3D_RING_WAITS = [6, 2, 1]
E3D_DASH_RUNS = [0x20, 0x24, 0x28]
E3D_BOX = [0x20, 0xC0, 0x10, 0x10]
E3D_FIGHT_ST = [0xAEF3, 0xAF08, 0xAF67, 0xAF82, 0xAF9D, 0xAEF2]
E3D_PICK = [0xB07F, 0xB0D6, 0xB140, 0xB0A9]
E3D_BOLT_DX = [0x00, 0x07, 0xF9]
E3D_BOLT_DX3 = [0xF9, 0x00, 0x07]
E3D_PAL_DAY = [0x21, 0x20, 0x10, 0x0F, 0x21, 0x20, 0x31, 0x23, 0x21, 0x20, 0x33, 0x03]
E3D_PAL_STORM = [0x11, 0x10, 0x00, 0x0F, 0x11, 0x10, 0x21, 0x13, 0x11, 0x10, 0x23, 0x03]
E3F_JT = [0xB2DD, 0xBAF0, 0xBB2B, 0xBB6D, 0xBB79, 0xBB85, 0xBBB0, 0xBBCA, 0xB9C8, 0xB9F1, 0xBA16, 0xBA3B, 0xB99B, 0xBD09]
E3F_ST = [0xB709, 0xB732, 0xB757, 0xB773, 0xB788, 0xB708]
E3F_BLINK = [0xFF, 0x06, 0x06, 0x00, 0x07, 0x07, 0x01, 0x06, 0x06, 0x02, 0x07, 0x07, 0x03, 0x06, 0x06, 0x00, 0x07, 0x07, 0x01, 0x06, 0x06, 0x02, 0x07, 0x07, 0x03, 0xFF]
E3F_ORB_A = [0x21, 0x11, 0x01, 0x11]
E3F_ORB_B = [0x11, 0x01, 0x0F, 0x01]
E3F_SKY = [0x38, 0x02, 0x20, 0x20, 0x33, 0x35]
E3F_VOLLEY = [0xBAFB, 0xBB43, 0xBB91]
E3F_SWEEP = [0xB4B3, 0xB4E0, 0xB538]

def e2f_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def e2f_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def e2f_script(wr, addr):
    """obj_set_script gave a thread the address addr in bank 2F."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == 0x2F for t in range(32))

def e2f_spawned(wr, typ):
    """The slots 9-17 in which the call created an object of this type."""
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]
'''

[[claim]]
id = "en2f.types"
about = ["e3d_start", "e3f_start"]
text = "In the tables of unit rooms the kind $D5 is type $3D and the kind $D9 type $3F, both with variables 0 and 1 = 0; in the type tables of unit objects the first scripts of types $3D, $3E and $3F are 2F:A011, 2F:A68B and 2F:B2A9."
kind = "static"
expect = "u8(O('13:A9D2') + 0xD5) == 0x3D and u8(O('13:A9D2') + 0xD9) == 0x3F and u8(O('13:AAD2') + 0xD5) == 0 and u8(O('13:AAD2') + 0xD9) == 0 and [u8(O('type_script_lo') + t) | u8(O('type_script_hi') + t) << 8 for t in (0x3D, 0x3E, 0x3F)] == [0xA011, 0xA68B, 0xB2A9] and [u8(O('type_script_bank') + t) for t in (0x3D, 0x3E, 0x3F)] == [0x2F, 0x2F, 0x2F]"

# ================================================================= type $3D: the start and the eye

[[script]]
at = "2F:A011"
name = "e3d_start"
desc = """
First script of object type $3D (kind $D5 of the room's list creates it with variable 0 = 0): the CHR bank at
$0400 of the sprites (chr_bank + 1) = $98, bank 22, obj_param_set (22:84A4), obj_face_kirby (22:8851), and a jump
table on variable 0 (2F:A01F, 9 entries): 0 e3d_eye (the boss), 1 e3d_ring (the four balls around the eye; also
the first script of type $3E, which no object of the corpus had), 5, 6, 7 the three pieces of a lightning bolt
(e3d_bolt, e3d_bolt2, e3d_bolt3); the entries 2 (2F:A7B4), 3 (2F:A750), 4 (2F:A782) (the block breaker of state 7) and 8 (2F:B21F, the walker of
attack 4) first ran in cov9-b-kracko (unit cov9: e3d_blk_start, e3d_blk_left, e3d_blk_right, e3d_walker).
"""

[[script]]
at = "2F:A033"
name = "e3d_eye"
desc = """
Variable 0 = 0: the boss, at first an eye without its cloud that follows Kirby up a tall room of clouds and
pillars (main@59600: the eye with four balls around it, at the right). e3d_cam_limits; variables 3-7 = 0; a new
object of type $3D in a slot of 9-17 at its own place with variable 0 = 1 (3E:DED0 with the bytes at 2F:A048):
the ring, e3d_ring; its slot goes into variable 2 (store_var). The pose table 30:9C7C, the tick routine
e3d_tick_eye, e3d_look, and the thread halts: everything else is done by the tick routine. The bytes from 2F:A05E to
2F:A0D7 were never touched (by their look more of the same script).
"""

[[sym]]
at = "2F:A000"
name = "e3d_cam_limits"
desc = "For e3d_eye: cam_min_x = 0 and cam_end_x = $0100 (unit kmove's camera limits): the camera stays in the first screen across."

[[data]]
at = "2F:A0D8"
len = 4
name = "e3d_eye_box"
format = "bytes"
desc = "For 22:9498 (called by e3d_tick_eye with this address in X / Y): $20, $C0, $10, $10, the box around the camera inside which the eye is kept."

[[sym]]
at = "2F:A0DC"
name = "e3d_tick_eye"
desc = """
Tick routine of the eye (variable 0 = 0) during the climb. e3d_look (pose by Kirby's quadrant); cam_end_y = cam_y +
$0100 (the camera's lower limit follows it, so the room never scrolls back down). When cam_y is below $0170 (the
camera has reached the top of the room) the script becomes e3d_rise and nothing more. Otherwise: 3F:E31D with
the record 39:93EC (a box of 8 x 8, no flags, touching it hurts Kirby, no reactions), with variable 0 (its hit
points) kept around the test and put back, so that nothing can hurt the eye here; unless variable 3 is 7, 9 or $0A,
22:9498 with e3d_eye_box keeps it inside the box around the camera. Variable 6 (when not negative) = 0: by the code
it would count the frames in which kirby_action is $0D up to $78 and then become $80 (never ran). Then two jumps
through tables by variable 3 (the state): e3d_states_a (state 0: e3d_watch; 1 and 2: e3d_glide_count, which goes
on into e3d_watch; 3 and more: nothing) and, with the state as it is then, e3d_states_b: 0 e3d_hover, 1 e3d_glide,
4 e3d_wind, 5 e3d_recoil, 6 e3d_dash, 8 e3d_brake, 2 e3d_steer (unit boss_cov4; cov4-a-kracko from @59599); 3, 7, 9,
$0A never ran. A state of $0B or more would hang in
a loop on itself (2F:A157, 2F:A20B).
"""
comments = { "A0F9" = "the top of the room: the cloud phase", "A10F" = "the hit test may not take hit points", "A13F" = "kirby_action $0D: never", "A150" = "the first table: the watch", "A157" = "a state of $0B or more hangs here" }

[[sym]]
at = "2F:A10A"
kind = "part"
name = "e3d_eye_hit"
desc = "The rest of e3d_tick_eye below the top of the room: the hit test with variable 0 kept on the stack, 22:9498, variable 6, and the first jump through e3d_states_a."

[[data]]
at = "2F:A16A"
len = 22
name = "e3d_states_a"
format = "ptr16"
desc = "First jump table of e3d_tick_eye by variable 3: 2F:A1A0 (e3d_watch), 2F:A180 (e3d_glide_count) twice, then eight times 2F:A204 (only the second table). Read were the entries 0, 1, 3, 4, 5, 6 and 8."

[[data]]
