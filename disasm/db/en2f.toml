[[claim]]
id = "en2f.e3d.tick_eye"
about = ["e3d_tick_eye", "e3d_eye_hit", "e3d_states_a", "e3d_states_b", "e3d_eye_state", "e3d_eye_box", "e3d_rise", "e3d_look"]
text = "e3d_tick_eye calls e3d_look first and sets cam_end_y = cam_y + $0100. With cam_y below $0170 it starts the script e3d_rise and makes no hit test. Otherwise it passes the record 39:93EC to the hit test, leaves variable 0 as it was, calls 22:9498 exactly when variable 3 is not 7, 9 or $0A, sets variable 6 to 0, runs e3d_glide_count exactly in the states 1 and 2 and e3d_watch exactly in the states 0-2, and then the entry of e3d_states_b for the state (4 when e3d_watch started a charge)."
kind = "call"
fn = "e3d_tick_eye"
on = ["main@59542+458", "main@60000+458"]
min_calls = 880
max_calls = 1000
use = ["en2f_model"]
model = '''
def e3d_eye_ok(rd, wr, ran, calls, mem):
    s = rd[0x6E]
    if calls[0] != '2F:A683':
        return False
    cy = rd[0xE0] | rd[0xE1] << 8
    if (wr[0x5C6] | wr[0x5C7] << 8) != (cy + 0x100) & 0xFFFF:
        return False
    if cy < 0x170:
        return e2f_script(wr, 0xA80D) and 0x27 not in wr
    if (wr[0x27], wr[0x28]) != (0xEC, 0x93) or mem(0x61CA + s) != rd[0x61CA + s]:
        return False
    st = rd[0x6200 + s]
    if (ran('22:9498') > 0) != (st not in (7, 9, 10)) or rd[0x6236 + s] >= 0x80 or wr[0x6236 + s] != 0:
        return False
    if (ran('2F:A180') > 0) != (st in (1, 2)) or (ran('2F:A1A0') > 0) != (st <= 2):
        return False
    st2 = 4 if (st <= 2 and ran('2F:A598')) else st
    return ran('2F:%04X' % E3D_ST_B[st2]) > 0
