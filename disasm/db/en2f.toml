[[claim]]
id = "en2f.e3d.jump"
about = ["e3d_start", "e3d_eye", "e3d_ring", "e3d_bolt", "e3d_bolt2", "e3d_bolt3"]
text = "The jump_table at 2F:A01F goes to entry (variable 0, in the register) of the nine targets 2F:A033, 2F:A68B, 2F:A7B4, 2F:A750, 2F:A782, 2F:B143, 2F:B195, 2F:B1C5, 2F:B21F; the eye (0), the ring (1) and the three pieces of a bolt (5, 6, 7) happen."
kind = "vmop"
op = "jump_table"
at = "2F:A01F"
on = ["main@59540+5", "main@60830+130"]
