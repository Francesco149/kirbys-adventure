the number 0 counts, and then e3d_near decides (it answered carry clear: e3d_charge_start). So from frame $20 a chance
of one in 32 every 16 frames, from frame $78 one of 24 in 32.
"""
comments = { "A1B4" = "below $20: nothing", "A1C9" = "$78 and more", "A1E0" = "below $78: only a 0" }

[[sym]]
at = "2F:A204"
kind = "part"
name = "e3d_eye_state"
desc = "The second jump of e3d_tick_eye: through e3d_states_b by variable 3 as it is now (e3d_watch may just have set 4)."

[[sym]]
at = "2F:A235"
kind = "part"
name = "e3d_wind"
