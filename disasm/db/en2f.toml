use = ["en2f_model"]
expect = "args[0] == 9 and next == E3D_JT[rd[0x63E0 + thread]]"

[[claim]]
id = "en2f.e3d.ring_spawn"
about = ["e3d_eye", "e3d_ring"]
text = "The asm instruction at 2F:A045 (3E:DED0) creates one object of type $3D in a slot of 9-17 with variable 0 = 1, the eye's slot in its variable 2 and the eye's world position; the store_var at 2F:A050 then puts the register (the new slot) into the eye's variable 2 (one fight in main, one in its copy cov-abilities-sword)."
kind = "vmop"
