frames = 5
patch = { "1A:8044" = 0xF4, "1A:8045" = 0x80 }
expect = "len(diff) > 0 and all(0x200 <= k < 0x400 for k in diff) and ram[0x62C7] == 0x22 and (ram[0x62D9], ram[0x62EB], ram[0x62FD]) == (0x00, 0x80, 0x1A)"

[[claim]]
id = "objects.lists.writers"
about = ["obj_active_head", "obj_free_head", "obj_next", "obj_type", "next_object", "obj_frame", "spawn_x_hi", "spawn_y_hi"]
text = "In the whole corpus: obj_active_head is written only by obj_link, obj_unlink and obj_init_all; obj_free_head only by obj_slot_alloc, obj_slot_free and obj_init_all; obj_next only by those five; obj_type only by obj_spawn_tail, obj_free, obj_init_all and three routines that store a type directly (19:B2E9, 25:A135, 28:A0FA); next_object only by obj_run_all, obj_link and obj_unlink; obj_frame only by obj_run_all, 18:A000 and demo_init; obj_spawn is among the readers of spawn_x_hi and spawn_y_hi spawn_vars is read only by obj_spawn, 21:9955 and 22:9591, and spawn_slot_min and spawn_slot_end only by obj_slot_alloc."
kind = "xref"
expect = "writers('obj_active_head') == {'obj_link', 'obj_unlink', 'obj_init_all'} and writers('obj_free_head') == {'obj_slot_alloc', 'obj_slot_free', 'obj_init_all'} and writers((0x613A, 18)) == {'obj_link', 'obj_unlink', 'obj_init_all', 'obj_slot_alloc', 'obj_slot_free'} and writers((0x6128, 18)) == {'obj_spawn_tail', 'obj_free', 'obj_init_all', '19:B2E9', '25:A135', '28:A0FA'} and writers('next_object') == {'obj_run_all', 'obj_link', 'obj_unlink'} and writers('obj_frame') == {'obj_run_all', '18:A000', 'demo_init'} and 'obj_spawn' in readers('spawn_x_hi') and 'obj_spawn' in readers('spawn_y_hi') and readers((0x6023, 8)) == {'obj_spawn', '21:9955', '22:9591'} and readers('spawn_slot_min') == {'obj_slot_alloc'} == readers('spawn_slot_end')"

