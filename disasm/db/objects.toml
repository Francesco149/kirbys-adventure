[[claim]]
id = "objects.draw.pointer"
about = ["obj_run_all", "obj_pose", "obj_sprite_lo", "obj_sprite_hi", "obj_sprite_bank"]
text = "Experiment: at main@613 slot 1 (Kirby) has obj_pose $22 and its pointer table at 1A:8000. With entry $22 of that table (1A:8044) patched to the value of entry 0, after 5 frames the only RAM that differs from the untouched run lies in $0200-$03FF (the sprite buffers), and something there does differ."
kind = "effect"
