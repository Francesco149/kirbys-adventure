unit = "objects"
title = "Object pipeline: slots, the per-frame pass, creation and deletion"
summary = """
The game has 18 object slots (slot 1 is Kirby). A slot is either on the list of active objects or on the list of
free slots; both are singly linked through obj_next. Once per frame `obj_run_all` makes two passes.

Pass 1 walks the active list in creation order. For every object whose obj_tick_bank has bit 7 clear, `obj_run`
maps the object's own bank at $8000 (obj_bank, when set), steps every thread of the object's chain through the
script interpreter (unit vm), calls the object's move routine (obj_move_lo/hi; 3E:D864 by default), maps
obj_tick_bank at $A000 and jumps to the tick routine (obj_tick_lo/hi; a lone rts by default). next_object holds
the successor while an object runs, so an object can delete itself or create others during the pass; an object
appended behind the last one still runs in the same pass.

Between the passes: when $6600 is not zero, 38:A000 is called with bank 38 at $A000; then the frame hook
(frame_hook, set once to `obj_sort_draw`) builds a second list of the same objects, ordered by the low byte of
their third coordinate, descending.

Pass 2 walks that draw list. For every object it calls the position routine (obj_position_lo/hi; 3E:D97D by
default) and then, unless obj_sprite_bank has bit 7 set or obj_pose is $FF, maps obj_sprite_bank at $8000, takes
entry obj_pose of the object's table of 16-bit pointers (obj_sprite_lo/hi) and calls the draw routine
(obj_draw_lo/hi; 3E:DA89 by default) with that pointer in A (low) and X (high). The pointer selects what the
object looks like: patching one entry of Kirby's table changes nothing but bytes of the sprite buffers at
$0200-$03FF.

`obj_spawn` (`obj_spawn_plain` with default parameters) creates an object of type A at X / Y: it takes a free slot inside the range the caller left in
spawn_slot_min / spawn_slot_end, appends it to the active list, fills in defaults and starts one thread at the
type's script (three tables of 112 entries in bank 18). `obj_set_script` replaces all threads of an object by
one new thread at a given address; `obj_free` returns the threads and the slot.

The script opcodes on_tick, on_move, on_position, on_draw, sprite_map, set_bank and the pose opcodes of unit vm
write the per-object fields that this unit reads.

Open:
- The default routines themselves (3E:D864 move, 3E:D97D position, 3E:DA89 draw) and 3E:DE03 (called first by
  obj_run_all; it resets $68/$69 and fills one of two 256-byte buffers with $F0) are not documented here; nor is
  38:A000 or what $6600 means.
- obj_spawn also fills a second set of coordinates ($6074, $6086, $6098, $60AA, $60BC, $60CE + object) with the
  same values as the position; when the two sets differ is not documented.
- $602D / $602E are cleared by obj_spawn_plain and written by other routines; nothing in the corpus reads them.
- $01A5 is cleared at the end of every pass; its reader (3E:C401) is not documented.
- Object types $70 and up, and the types whose table entries were never read, are unknown; the three tables are
  taken as 112 entries long because the next table starts there.
- In obj_run_all the branch for a pose of $80 or more (a ninth bit for the pointer index) never ran.
- obj_set_script and obj_retype return without doing anything for a free slot; that never happened in the corpus.
"""

[[sym]]
at = "3E:CB71"
name = "obj_init_all_far"
desc = "Calls obj_init_all in bank 18 through the far-call helper 3E:D805, which takes the target address and bank from the three bytes after the jsr."

[[data]]
at = "3E:CB74"
len = 3
name = "obj_init_all_far_target"
format = "bytes"
desc = "Inline parameter of the far call in obj_init_all_far: address $A051, bank $18 (obj_init_all)."

[[sym]]
at = "3E:CB77"
kind = "part"
name = "obj_init_all_far_ret"
desc = "The rts that the far call in obj_init_all_far comes back to."

[[sym]]
at = "18:A051"
name = "obj_init_all"
desc = """Reset the object system. frame_hook = obj_sort_draw; the active list is empty (obj_active_head = $FF); all 18 slots are chained in order on the free list (obj_free_head = 0, obj_next[i] = i + 1, the last $FF) and marked free (obj_type = $FF); all 32 threads are chained in order on the free thread list (free_thread = 0); $6600 = 0; the globals $DD/$DE, $E0/$E1, $E2-$E5 are cleared and $DC, $DF set to $80. Ends by jumping to 3E:DE03."""

[[sym]]
at = "3E:CB78"
name = "obj_spawn_plain"
desc = "obj_spawn with default parameters: sets spawn_vars (all eight) and $602D / $602E to 0 and the slot range to all 18 slots (spawn_slot_min = 0, spawn_slot_end = $12), then falls into obj_spawn with A, X and Y as given. spawn_x_hi and spawn_y_hi are not reset."
in = "A = object type, X = X position (low byte), Y = Y position (low byte); spawn_x_hi, spawn_y_hi"
out = "as obj_spawn"

[[sym]]
at = "3E:CBA2"
name = "obj_spawn"
desc = """Create an object. Takes a free slot from the range spawn_slot_min <= slot < spawn_slot_end (obj_slot_alloc); when there is none, or no thread is free, returns A = $FF and changes nothing. Otherwise: one thread is allocated as the object's only thread; the position, draw and move routines get their defaults (3E:D97D, 3E:DA89, 3E:D864); obj_bank = $FF; object variables 0-7 are copied from spawn_vars; X position = spawn_x_hi : X register with fraction $80, Y position = spawn_y_hi : Y register with fraction $80, the third coordinate $80:$80 with fraction $80, and the second set of coordinates at $6074.. gets the same values; the slot is appended to the active list (obj_link). The tail obj_spawn_tail, shared with obj_retype: obj_type = A, both velocities and object variables 8 and 9 = 0, obj_pose = $FF, and the first thread starts at the script of type A (type_script_lo/hi, bank type_script_bank, also left in new_script_bank) through obj_start_thread. The bank at $A000 is restored."""
in = "A = object type, X = X position (low byte), Y = Y position (low byte); spawn_vars, spawn_x_hi, spawn_y_hi, spawn_slot_min, spawn_slot_end"
out = "A = X = the new object's slot, or A = $FF when there was none"
comments = { "CBAC" = "no slot: drop the three saved registers" }

[[sym]]
at = "3E:CC4B"
kind = "part"
name = "obj_retype"
desc = "Turn object X into type A, keeping its slot, position and variables 0-7: returns the object's threads to the free list, allocates one new thread, then continues in obj_spawn_tail (type, zero velocities, pose $FF, the type's script). Reached by a jump from 22:8E71 only. Does nothing for a free slot."
in = "A = object type, X = object"

[[sym]]
at = "3E:CC63"
kind = "part"
name = "obj_spawn_tail"
desc = "The tail that obj_spawn and obj_retype share: obj_type[X] = A; both velocities, object variables 8 and 9 = 0; obj_pose = $FF; new_script_bank and the first thread's address and bank from entry A of type_script_lo / hi / bank (obj_start_thread, with bank 18 mapped at $A000 for the tables and the old bank restored after). Returns the slot in A."
in = "A = object type, X = slot"
out = "A = X = slot"

[[sym]]
at = "3E:CCA0"
kind = "part"
name = "obj_set_script_here"
desc = "obj_set_script for the current object with a script in the bank now mapped at $A000: stores the bank ($49) in new_script_bank, loads X from cur_object and falls into obj_set_script. Reached by jumps from 6502 routines that scripts call."
in = "A = script address low, Y = high"

[[sym]]
at = "3E:CCA7"
name = "obj_set_script"
desc = "Replace all threads of object X by one thread at address Y:A in bank new_script_bank: the object's chain goes back to the free list (obj_free_threads), one thread is allocated (the object's old first thread when it had one) and becomes the whole chain, then obj_start_thread. Does nothing for a free slot."
in = "A = script address low, Y = high, X = object; new_script_bank"
out = "A = X = object"

[[sym]]
at = "3E:CCC4"
name = "obj_start_thread"
desc = "Point the first thread of object X at address Y:A in bank new_script_bank, with wait 0 and an empty script stack, and reset the object's tick routine (obj_clear_tick). Returns the object in A."
in = "A = script address low, Y = high, X = object"
out = "A = X = object"

[[sym]]
at = "3E:CCE5"
name = "obj_run_all"
desc = """The object pass of a frame. Calls 3E:DE03. Pass 1: for every object on the active list (from obj_active_head along obj_next) sets cur_object, saves the successor in next_object, and calls obj_run unless obj_tick_bank has bit 7 set. Then, when $6600 is not zero, calls 38:A000 with bank 38 at $A000 and restores the bank. Then calls the frame hook (obj_sort_draw). Pass 2: for every object on the draw list (from obj_draw_head along obj_draw_next) sets cur_object, calls the position routine (call_ay with obj_position_lo/hi) and, unless obj_sprite_bank has bit 7 set or obj_pose is $FF, maps obj_sprite_bank at $8000 and calls the draw routine (obj_draw_lo/hi, through call_target) with A = low and X = high byte of entry obj_pose in the pointer table at obj_sprite_lo/hi. Finally $01A5 = 0 and obj_frame is incremented."""
comments = { "CCF8" = "bit 7 of the tick bank: the object is skipped", "CD02" = "between the passes", "CD19" = "pass 2: the draw list", "CD48" = "pose * 2 indexes the pointer table" }

[[sym]]
at = "3E:CD76"
name = "obj_run"
desc = "Run object X for one frame: map obj_bank at $8000 unless it has bit 7 set; step every thread of the object's chain (vm_step_thread), taking the successor from next_thread so that the running thread may end or spawn; call the move routine (obj_move_lo/hi); map obj_tick_bank at $A000 and jump to the tick routine (obj_tick_lo/hi)."
in = "X = object (also in cur_object)"

[[sym]]
at = "3E:D622"
name = "obj_slot_alloc"
desc = "Take the first slot on the free list that lies in spawn_slot_min <= slot < spawn_slot_end off the list and return it in X with carry clear. Returns with carry set, changing nothing, when no free slot is in the range or when no thread is free (free_thread has bit 7 set)."
out = "carry clear: X = slot; carry set: none"

[[sym]]
at = "3E:D655"
name = "obj_free"
desc = "Delete object X: when the slot is in use, obj_type becomes $FF, the tick routine is reset (obj_clear_tick), the threads go back to the free list (obj_free_threads), the slot is taken off the active list (obj_unlink) and put at the head of the free list (obj_slot_free). Nothing happens for a slot that is already free. A, X and Y are preserved."
in = "X = object"

[[sym]]
at = "3E:D672"
name = "obj_link"
desc = "Append slot X to the end of the active list (obj_next[X] = $FF; the last object, or obj_active_head when the list was empty, points to X). When the list was not empty and next_object has bit 7 set (the object running now was the last), next_object becomes X, so the new object still runs in this pass."
in = "X = slot"

[[sym]]
at = "3E:D694"
name = "obj_unlink"
desc = "Take slot X off the active list: the object before it (obj_find_prev) gets X's successor, or obj_active_head does when X was first. When X is the object that was going to run next (next_object), next_object becomes X's successor. X is preserved."
in = "X = slot"

[[sym]]
at = "3E:D6AF"
name = "obj_slot_free"
desc = "Put slot X at the head of the free list: obj_next[X] = obj_free_head, obj_free_head = X."
in = "X = slot"

[[sym]]
at = "3E:D6B9"
name = "obj_free_threads"
desc = "Return the whole thread chain of object X to the free thread list in one step: the chain's first thread becomes free_thread and the chain's last thread points to the old head. obj_first_thread[X] is not changed. Nothing happens when the object has no thread. X is preserved."
in = "X = object"

[[sym]]
at = "3E:D6D7"
name = "obj_find_prev"
desc = "Walk the active list from obj_active_head until slot X is found; returns the slot before it in Y, or $FF when X is first. X is preserved (kept in scratch $11)."
in = "X = slot"
out = "Y = previous slot or $FF"

[[sym]]
at = "3E:D777"
name = "obj_clear_tick"
desc = "Reset the tick routine of object X to its default: address 3E:D786 (obj_tick_none), bank byte 0."
in = "X = object"

[[sym]]
at = "3E:D786"
name = "obj_tick_none"
desc = "A lone rts: the default tick routine of an object, and the last instruction of obj_clear_tick."

[[sym]]
at = "3E:D7A5"
name = "call_ay"
desc = "Stores A (low) and Y (high) in call_target and falls into call_vector, which jumps there: a jsr to call_ay calls the routine at Y:A."
in = "A = address low, Y = address high"

[[sym]]
at = "3E:D7AE"
name = "call_frame_hook"
desc = "One instruction, jmp (frame_hook): a jsr to it calls the routine stored in frame_hook."

[[sym]]
at = "3E:DA29"
name = "obj_sort_draw"
desc = """Build the draw list: empty it, then insert every object of the active list, in list order, by the low byte of its third coordinate (obj_z_lo). An object goes behind all objects already in the list whose value is greater than its own, so the list is in descending order and, among equal values, the object inserted later comes first. On frames where obj_frame is odd, an object whose value is exactly $80 instead goes behind all objects with $80 or more, so objects on the default value alternate their draw order from frame to frame."""

[[data]]
at = "18:A0A7"
len = 112
name = "type_script_lo"
format = "bytes"
desc = "Per object type ($00-$6F): low byte of the address of the script a new object of that type starts at."

[[data]]
at = "18:A117"
len = 112
name = "type_script_hi"
format = "bytes"
desc = "Per object type: high byte of the script address."

[[data]]
at = "18:A187"
len = 112
name = "type_script_bank"
format = "bytes"
desc = "Per object type: the bank of the script."

[[ram]]
at = "6023"
len = 8
name = "spawn_vars"
desc = "Parameters for obj_spawn: the initial values of object variables 0-7 of the next object created."

[[ram]]
at = "602B"
name = "spawn_x_hi"
desc = "Parameter for obj_spawn: high byte of the new object's X position."

[[ram]]
at = "602C"
name = "spawn_y_hi"
desc = "Parameter for obj_spawn: high byte of the new object's Y position."

[[ram]]
at = "602F"
name = "spawn_slot_min"
desc = "Parameter for obj_spawn: the lowest slot the new object may take."

[[ram]]
at = "6030"
name = "spawn_slot_end"
desc = "Parameter for obj_spawn: one more than the highest slot the new object may take."

[[ram]]
at = "6031"
name = "new_script_bank"
desc = "The bank that obj_start_thread gives to the thread it starts. Callers of obj_set_script store it first; obj_spawn stores the type's bank."

[[ram]]
at = "6032"
name = "obj_active_head"
desc = "First slot of the list of active objects (linked through obj_next, in creation order); bit 7 set when there is none."

[[ram]]
at = "6033"
name = "obj_free_head"
desc = "First slot of the list of free slots (linked through obj_next); bit 7 set when there is none."

[[ram]]
at = "6035"
name = "obj_draw_head"
desc = "First slot of the draw list that obj_sort_draw builds every frame (linked through obj_draw_next); bit 7 set when empty."

[[ram]]
at = "6036"
name = "next_object"
desc = "During pass 1 of obj_run_all: the object to run after the current one, bit 7 set for none. obj_unlink and obj_link keep it right when the running object deletes or creates objects."

[[ram]]
at = "6038"
len = 2
name = "call_target"
desc = "The address that call_vector jumps to. call_ay and the callers of call_vector store it just before the call."

[[ram]]
at = "603B"
len = 2
name = "frame_hook"
desc = "Address of the routine that obj_run_all calls between its two passes. obj_init_all sets it to obj_sort_draw; nothing else writes it."

[[ram]]
at = "603D"
name = "obj_frame"
desc = "Counts the passes of obj_run_all (incremented at the end of each, wraps at 256). Its low bit alternates the draw order in obj_sort_draw; many routines read it as a frame counter."

[[ram]]
at = "6050"
len = 18
name = "obj_z_lo"
desc = "Per object: low byte of the third coordinate ($80 by default). obj_sort_draw orders the draw list by it, greater values first."

[[ram]]
at = "6128"
len = 18
name = "obj_type"
desc = "Per object slot: the object's type (index into type_script_lo/hi/bank), or $FF (bit 7 set) for a free slot. Besides obj_spawn_tail, three routines (19:B2E9, 25:A135, 28:A0FA) store a type directly, without restarting the script."

[[ram]]
at = "613A"
len = 18
name = "obj_next"
desc = "Per object slot: the next slot on the list this slot is on (the active list or the free list); bit 7 set at the end."

[[ram]]
at = "615E"
len = 18
name = "obj_position_lo"
desc = "Per object: low byte of the position routine, called for every object in pass 2 of obj_run_all. Default 3E:D97D; set by the script opcode on_position."

[[ram]]
at = "6170"
len = 18
name = "obj_position_hi"
desc = "Per object: high byte of the position routine."

[[ram]]
at = "6182"
len = 18
name = "obj_draw_lo"
desc = "Per object: low byte of the draw routine, called in pass 2 of obj_run_all with a pointer from the object's pointer table in A / X. Default 3E:DA89; set by the script opcode on_draw."

[[ram]]
at = "6194"
len = 18
name = "obj_draw_hi"
desc = "Per object: high byte of the draw routine."

[[ram]]
at = "61A6"
len = 18
name = "obj_move_lo"
desc = "Per object: low byte of the move routine, called by obj_run after the object's threads. Default 3E:D864; set by the script opcode on_move."

[[ram]]
at = "61B8"
len = 18
name = "obj_move_hi"
desc = "Per object: high byte of the move routine."

[[ram]]
at = "627E"
len = 18
name = "obj_tick_lo"
desc = "Per object: low byte of the tick routine, the last thing obj_run runs for the object, with obj_tick_bank mapped at $A000. Default obj_tick_none; set by the script opcode on_tick."

[[ram]]
at = "6290"
len = 18
name = "obj_tick_hi"
desc = "Per object: high byte of the tick routine."

[[ram]]
at = "62A2"
len = 18
name = "obj_tick_bank"
desc = "Per object: the bank of the tick routine. With bit 7 set, pass 1 of obj_run_all skips the object: its threads, move routine and tick routine do not run."

[[ram]]
at = "62B4"
len = 18
name = "obj_draw_next"
desc = "Per object: the next object on the draw list; bit 7 set at the end."

[[ram]]
at = "62C6"
len = 18
name = "obj_pose"
desc = "Per object: index into the object's pointer table (obj_sprite_lo/hi); the selected pointer is handed to the draw routine. $FF: the draw routine is not called. Set by the pose opcodes of the scripts."

[[ram]]
at = "62D8"
len = 18
name = "obj_sprite_lo"
desc = "Per object: low byte of the address of a table of 16-bit pointers, one per pose. Set by the script opcode sprite_map."

[[ram]]
at = "62EA"
len = 18
name = "obj_sprite_hi"
desc = "Per object: high byte of the pointer table's address."

[[ram]]
at = "62FC"
len = 18
name = "obj_sprite_bank"
desc = "Per object: the bank mapped at $8000 for the pointer table and the draw routine. With bit 7 set the draw routine is not called."

[[ram]]
at = "630E"
len = 18
name = "obj_bank"
desc = "Per object: the bank obj_run maps at $8000 before the object's threads run; $FF (the default) leaves the mapping alone. Set by the script opcode set_bank."

# ---------------------------------------------------------------- claims

[[claim]]
id = "objects.init.far"
about = ["obj_init_all_far", "obj_init_all_far_target", "obj_init_all_far_ret"]
text = "The three bytes after the jsr in obj_init_all_far, as read by the far-call helper, are the address and bank of obj_init_all, and every call of obj_init_all_far in the windows leaves the state that obj_init_all sets up (frame_hook pointing at obj_sort_draw, an empty active list, obj_free_head 0)."
kind = "call"
fn = "obj_init_all_far"
on = ["main@0+500", "main@11000+1000", "attract@0+2000"]
min_calls = 3
expect = "romrd[O('obj_init_all_far_target')] | romrd[O('obj_init_all_far_target') + 1] << 8 == A('obj_init_all') and romrd[O('obj_init_all_far_target') + 2] == 0x18 and (wr[0x603B] | wr[0x603C] << 8) == A('obj_sort_draw') and wr[0x6032] == 0xFF and wr[0x6033] == 0"

[[claim]]
id = "objects.init.model"
about = ["obj_init_all", "obj_type", "obj_next", "obj_active_head", "obj_free_head", "frame_hook"]
text = "obj_init_all leaves: frame_hook = obj_sort_draw, obj_active_head = $FF, obj_free_head = 0, free_thread = 0, obj_next[i] = i + 1 for slots 0-16 and $FF for slot 17, thread_next[i] = i + 1 for threads 0-30 and $FF for thread 31, obj_type = $FF in all 18 slots, $6600 = 0."
kind = "call"
fn = "obj_init_all"
on = ["main@0+500", "main@11000+1000", "attract@0+2000"]
min_calls = 3
expect = "(wr[0x603B] | wr[0x603C] << 8) == A('obj_sort_draw') and wr[0x6032] == 0xFF and wr[0x6033] == 0 and wr[0x6034] == 0 and all(wr[0x613A + i] == (i + 1 if i < 17 else 0xFF) for i in range(18)) and all(wr[0x6320 + i] == (i + 1 if i < 31 else 0xFF) for i in range(32)) and all(wr[0x6128 + i] == 0xFF for i in range(18)) and wr[0x6600] == 0"

[[claim]]
id = "objects.spawn_plain"
about = ["obj_spawn_plain", "spawn_vars", "spawn_slot_min", "spawn_slot_end"]
text = "Every call of obj_spawn_plain writes 0 to the eight spawn_vars, to $602D, $602E and spawn_slot_min and $12 to spawn_slot_end, calls obj_slot_alloc first, and returns $FF or a slot whose obj_type it set to the A it was called with."
kind = "call"
fn = "obj_spawn_plain"
on = ["main@0+3000", "main@60000+3000", "attract@0+8000"]
min_calls = 3
expect = "all(wr[0x6023 + i] == 0 for i in range(8)) and (wr[0x602D], wr[0x602E], wr[0x602F], wr[0x6030]) == (0, 0, 0, 0x12) and calls[0] == 'obj_slot_alloc' and (ra == 0xFF or wr[0x6128 + ra] == a)"

[[claim]]
id = "objects.spawn.model"
about = ["obj_spawn", "obj_type", "spawn_vars", "spawn_x_hi", "spawn_y_hi", "new_script_bank", "type_script_lo", "type_script_hi", "type_script_bank", "obj_position_lo", "obj_position_hi", "obj_draw_lo", "obj_draw_hi", "obj_move_lo", "obj_move_hi", "obj_bank", "obj_pose", "obj_tick_lo", "obj_tick_hi", "obj_tick_bank", "obj_z_lo"]
text = "On every call that returns a slot s (A = X = s, not $FF): obj_type[s] = A at entry; the routine pointers are 3E:D97D (position), 3E:DA89 (draw), 3E:D864 (move) and obj_tick_none with bank 0; obj_bank = $FF, obj_pose = $FF; variables 0-7 equal spawn_vars and variables 8, 9 and both velocities are 0; X position = spawn_x_hi : X with fraction $80, Y position = spawn_y_hi : Y with fraction $80, third coordinate $80:$80 with fraction $80, and the six bytes of the second coordinate set equal them; obj_next[s] = $FF; the object's first thread is the thread that headed the free list, with no successor, wait 0, empty stack, and its address and bank are entry A of type_script_lo / hi / bank, the bank also in new_script_bank; the bank at $A000 is the one mapped at entry."
kind = "call"
fn = "obj_spawn"
on = ["main@452+3000", "main@60000+3000", "main@133557+2000", "w12-opus@30000+3000", "attract@7000+3000"]
where = "ra != 0xFF"
min_calls = 40
model = '''
def spawned(s, a, x, y, rd, wr, romrd, O):
    t = wr[0x614C + s]
    vec = lambda lo, hi: wr[lo + s] | wr[hi + s] << 8
    return (wr[0x6128 + s] == a
        and vec(0x615E, 0x6170) == 0xD97D and vec(0x6182, 0x6194) == 0xDA89 and vec(0x61A6, 0x61B8) == 0xD864
        and vec(0x627E, 0x6290) == 0xD786 and wr[0x62A2 + s] == 0
        and wr[0x630E + s] == 0xFF and wr[0x62C6 + s] == 0xFF
