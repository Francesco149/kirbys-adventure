[[model]]
name = "en29_boss"
code = '''
E4E_RX = [0x71, 0xA1, 0xA1, 0x71, 0x01, 0xA1, 0x01]
E4E_X0 = [0x40, 0x30, 0x30, 0x40, 0x80, 0x30, 0x80]
E4E_RY = [0x01, 0x29, 0x29, 0x01, 0x01, 0x51, 0x01]
E4E_Y0 = [0x40, 0x38, 0x38, 0x38, 0x30, 0x30, 0x42]
E4E_ORDER = [0, 1, 3, 2, 4, 0, 3, 1, 4, 2]
E4E_WAITS = [0x0F, 0x1E, 0x2D, 0x3C, 0x0F, 0x1E, 0x2D]
E4E_SCRIPTS = [0xB1C5, 0xB41A, 0xB325, 0xB26A, 0xB261, 0xB220]

def e4e_placed(rd, wr, s, k):
    """The position the placement routines leave for entry k of the tables."""
    cx = rd[0xDD] | rd[0xDE] << 8
    cy = rd[0xE0] | rd[0xE1] << 8
    x = (wr[0x82 + s] | wr[0x94 + s] << 8) - cx - E4E_X0[k]
    y = (wr[0xB8 + s] | wr[0xCA + s] << 8) - cy - E4E_Y0[k]
    return 0 <= x < E4E_RX[k] and 0 <= y < E4E_RY[k]

def e4e_set(wr, n):
    """obj_set_script gave a thread the n-th script of e4e_scripts."""
    a = E4E_SCRIPTS[n]
    return any(wr.get(0x6380 + t) == a & 0xFF and wr.get(0x63A0 + t) == a >> 8 and wr.get(0x63C0 + t) == 0x29 for t in range(32))
'''

