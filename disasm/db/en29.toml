unit = "en29"
title = "Bank 29: the beetle mid-boss and its bugs, the rolling armoured mid-boss, the switch on its pedestal, the last boss's second form"
summary = """
Bank 29: four object types that fight Kirby and three that belong to them, in the pattern of unit en24a (a first
script that sets the object up, scripts that are behaviours, tick routines that begin with the hit test 3F:E31D and
a record of bank 39 and start another script through obj_set_script when something changed). Kinds: $B6, $B7 type
$4A; $B8, $B9 type $4B; $FE, $FF type $6F (variable 1 = 0 or 1, which the mid-bosses keep as obj_param); $DA type
$4E.

Type $4A (e4a_*): a purple beetle with a horn and pincers, a mid-boss (by its look and its grip the game's Bugzzy;
main@31548, main@112350, w3-sonnet@59546, attract@5895). 30 hit points; it does not hurt by touch. A round
(e4a_idle) is 4 steps (2 for obj_param 1) picked by e4a_step_pick from Kirby's distance (stand, step back, step
forward), then an attack by e4a_pick: every third e4a_summon (two bugs), otherwise by row 0 of e4a_pick_lims three
chances in eight a charge, two a hop, three a leap. The charge (e4a_charge, $0240) grabs Kirby when he is in front
of the pincers (e4a_grab_test): e4a_grab gives Kirby the script e4a_held (he follows the beetle, e4a_held_step,
e4a_holder), e4a_throw_dir picks a throw by the blocks in front, the beetle leaps up and back with him and slams him
down (e4a_slam: e4a_kirby_slammed takes 8 hp and shows the OUCH card; e4a_kirby_thrown throws him off with
kirby_hurt_timer $60). e4a_hit (shared with type $4B) skips the hit test while variable 2, the blink after a hit
($20 frames, e4a_blink, by the damage reaction of the record), runs. Hit points gone or kind 2 of kirby_rect:
e4a_beaten: knocked back, an object of type 8 by 3E:DED0, then it lies flickering ($B6 frames) where it can be
inhaled (record 39:87A4, inhale number $15). The bugs (e4a_bug: type $4A with variable 0 = 1, 2) rise out of its
back on the third coordinate, then cross the screen at $0100 swaying toward Kirby's height (e4a_bug_follow); touching
them hurts.
Type $4B (e4b_*): a mid-boss with a round shell that curls up and rolls (main@53092, main@111906). The same frame
of code as the beetle (e4a_setup, e4a_hit with its own three records, inhale number $16, e4a_fall, e4a_blink): a
round of 4 or 2 steps as two little hops each, then e4b_pick; the corpus has one attack, e4b_roll (a run-up and a
roll at $0300 / $0540 until a wall, e4b_bounce). Beaten (e4b_beaten) it rocks on its shell (e4b_rock).
Type $6F (e6f_*): a pink dome with a star on a grey pedestal (main@28635, w3-sonnet@53626, w3-sonnet@79005). It
sits there; e6f_done_test removes it when the flag of the stage door is set in the row $0529 + world; e6f_tick
offers a box that nothing in the corpus hit.
Type $4E (e4e_*): the last boss's second form, a dark winged figure (main@134756-137527, once in the corpus). His
bar is his variable 0 (e4e_bar; 60 hit points from 22:8452); he cannot be hit himself: type $62 (e62_*) is his
body's boxes by his pose (e62_boxes: one body box, record 39:96EC, and parts that hurt Kirby and only flash when hit),
the running colours of his cape (e62_colors), and the bar's copy of his hit points (e62_hp_back). He appears
(e4e_appear) at a place picked for the attack to come (e4e_place, e4e_order), hovers e4e_hover_wait frames and
attacks: 0 stand, 1 and 2 swoop across and back (e4e_swoop; 1 then drops to Kirby's height and throws a type $61,
2 throws one at once), 3 charge (with less than 25 hit points: up off the screen and down at Kirby), 4 a loop
through the air, 5 (every fourth action) three blinks across the screen; then he fades out (e4e_vanish) and
reappears elsewhere. A hit on the body starts e4e_hurt (thrown back, shaking); the last one his end: he bursts in
the middle of the screen, the palette fades and e4e_end sends the game to room $0011 with leave_code 1. Type $61
(e61_*): what he throws, freed when he is hit.

Open:
- Never ran in any movie, type $4A: the throw 1 entered directly (29:A1CD; it ran after the throw 3), the landing in
  e4a_tick_charge (29:A540), e4a_hit for kirby_action 7 and its path for variable 2 negative (29:AFC2: Kirby's script
  14:A1BB through 3F:E302; the kind-1 reaction of 39:878C would set $FF), the ceiling of e4a_tick_drop (29:A508), the
  rows 4 and 5 of e4a_pick_lims, Kirby's death in e4a_kirby_slammed (kirby_s_die), e4a_beaten after its $B6 frames
  (29:A2D5: it was always inhaled before), e4a_leap's answer 0 into e4a_fly (29:A199), e4a_bug_follow's clamp with
  Kirby above. Bytes never touched: 29:A700-29:A70C.
- Ran in later batches of coverage movies, type $4A: attack 1 (e4a_fly, e4a_dive and their routines, 29:A0E3-29:A13F
  and 29:A44C-29:A4D9; cov4-a-bugm@60717, unit boss_cov4), the throw 0 (e4a_throw_0, cov4-a-bugm@60268 and
  cov4-a-bug7@112741, unit boss_cov4), the throws 3 and 1 and the wall of e4a_tick_charge (e4a_throw_3, e4a_throw_1,
  e4a_bounce, unit boss_cov3), a grab by touch (e4a_touch, e4a_touch_test: cov3-a-bugzzy@31585, cov4-a-bugm@60265),
  e4a_throw_dir with no block or facing right (cov4-a-bug7@112741), e4a_grip_pose and e4a_throw_kirby with kirby_form
  1 (cov4-a-bugm), e4a_throw_kirby facing left (cov3-a-bugzzy@31669), the rows 1-3 of e4a_pick_lims, obj_param 1 in
  e4a_leaps and e4a_bug_fly (cov4-a-bug7), a bug facing left (cov3-a-bugzzy@32496). 29:B0BE-29:B116 is
  e4b_kirby_flown (unit boss_cov3).
- Type $4B: what follows e4b_bounce's landing (29:A9A0) and e4b_rock (29:A9FA) never ran. The start with variable 0
  not 0 (e4b_shell), the attacks 1-3 (e4b_jump_at, e4b_leaps, e4b_leap), its grab, spin and throw (e4b_grab, the code
  29:AAE9-29:ABF4, 29:AC15-29:AC4F, 29:AC9C-29:ADB9) ran in cov3-a-turtle (unit boss_cov3) and the throw 1 in
  cov4-a-turtle (e4b_throw_1, unit boss_cov4). In main e4b_pick ran once; the speed $0300 of obj_param 0's roll was
  never read.
- Type $6F: variable 1 = 1 (kind $FF), $05A2 not 0 (29:BF57), being hit (the reaction 29:BF45, 3E:DFE5), the skip for
  kirby_ability 6 with kirby_action $0C, e6f_done_test freeing it (shown only by an experiment), 29:BF85-29:BFB6.
  What the dome is for in the game is not shown by the corpus.
- Type $4E: the creations of attack 0 (the threads 29:B44F / 29:B480 with 22:8C87, cut short both times), the
  bob's loop end (29:B1B4), e4e_tick_wait reaching 0, e4e_face_side's $40, 29:B261, the high-hp charge after 60
  frames (29:B2ED, 29:B655), the rest of the dive (29:B33E-29:B35F), e4e_order beyond entry 6 and its wrap. What
  22:8A6C, 22:89F3, 22:8452, 22:83C8, 3E:DE45, 22:8860, 3F:E26A, 22:932F and 22:9340 compute is used by address; $07F5,
  $0564 / $0565 (room_return+2 / +3 = 1, $5A at the start) are described by what is stored.
- Type $62: freeing when the boss is gone, a shot turned by e62_reflect (29:BD65), the pose test at 29:BCD5; only
  some poses' entries of e62_body_of / e62_hurt_of and their offsets were read. e62_beside adds its X offset to slot
  0 (obj_dir_left leaves obj_dir in Y): the boss's body keeps his X after a hit.
- Type $61: the low-hp variants (the second entries of e61_counts and e61_waits, e61_star_shot's 29:B874). What
  follows 29:B7E7 and 29:B82E (in main both were freed when the boss was hit) ran in cov3-c-rodwiz (e61_star,
  e61_done: unit boss_cov3) and cov4-a-wiz (e61_star_round, e61_star_shot: unit boss_cov4).
- Type $60 (first script e60_start, the stars of e4e_stars and e61_star) was never started in main; it is documented
  in unit boss_cov3, its launched stars (e60_launch) in unit boss_cov4.
- Bank 22 helpers used by address: 22:85B0, 22:859F (effects), 22:8C71 / 22:8C87 (children), 22:9340 / 22:932F
  (velocities from operands), 22:9591 (dust), 22:8FC6 (score), 22:90BA, 22:8C19, 22:9458; 3E:DED0 (a script's
  spawn), 3E:DFA3, 3F:E2F1 (Kirby's script from operands), 3F:E247, 3F:E26A, 3E:DE4B (sound), 3F:E6E8.
"""

# ================================================================= shared model

[[model]]
name = "en29_model"
code = '''
M29_RECS = {0: 0x8774, 2: 0x878C, 4: 0x87A4, 6: 0x87D4, 8: 0x87EC, 10: 0x8804}
M29_PICK4A = [(3, 3, 5), (1, 3, 5), (0, 5, 7), (5, 5, 7), (3, 5, 8), (0, 5, 7)]
M29_PICK4B = [(3, 5), (2, 6), (1, 5), (4, 6), (4, 6), (5, 7)]

def m29_script(wr, lo, hi, bank=0x29):
    """obj_set_script (or a script's jump) gave a thread the address hi:lo in the bank."""
    return any(wr.get(0x6380 + t) == lo and wr.get(0x63A0 + t) == hi and wr.get(0x63C0 + t) == bank for t in range(32))

def m29_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def m29_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def m29_r(n, rnd):
    """random with A = n, from the new low byte of rng_state."""
    return (n * rnd) >> 8

def m29_spawned(wr, typ):
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]
'''

[[claim]]
id = "en29.kinds"
about = ["e4a_start", "e4b_start", "e6f_start", "e4e_start"]
text = "In the tables of unit rooms (13:A9D2 type, 13:AAD2 variables 0 and 1 as low and high nibble) the kinds $B6, $B7 are type $4A, $B8, $B9 type $4B, $FE, $FF type $6F, each pair with variable 1 = 0 and 1, and the kind $DA is type $4E; variable 0 is 0 for all of them."
kind = "static"
expect = "[u8(O('13:A9D2') + k) for k in (0xB6, 0xB7, 0xB8, 0xB9, 0xFE, 0xFF, 0xDA)] == [0x4A, 0x4A, 0x4B, 0x4B, 0x6F, 0x6F, 0x4E] and [u8(O('13:AAD2') + k) for k in (0xB6, 0xB7, 0xB8, 0xB9, 0xFE, 0xFF, 0xDA)] == [0, 0x10, 0, 0x10, 0, 0x10, 0]"

