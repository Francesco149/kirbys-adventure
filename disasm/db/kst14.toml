[[sym]]
at = "14:AB5A"
name = "kirby_st_dive"
desc = """
The frame step of the dive: kirby_face_pad, kirby_speed_pad_10, the move step (no gravity: the Y velocity stays
what the fall left), kirby_dive_rect and break_rect_0_mark (he hits what is under him), kirby_walls_stop. Then in
order: kirby_floor_bump = script $0D (dive landing); kirby_ceiling_bump = $0B (never ran); bit 3 of kirby_flags
(21:88CA) = $0C (dive hit); kirby_ladder_test = $11; B pressed = $4B; Up held = $12; water_entered = $17;
pad_up_door = $00 (never ran). Otherwise kirby_upkeep.
"""

[[sym]]
at = "14:ABC5"
name = "kirby_dive_rect"
desc = "kirby_rect_set with kirby_dive_rect_rec and X = 2: the rectangle of the dive, centred on Kirby."

[[data]]
at = "14:ABCE"
len = 7
name = "kirby_dive_rect_rec"
format = "bytes"
desc = "The record of the dive for kirby_rect_set: kind 6, offsets 0 and 0, half width 4, half height 8."

[[sym]]
at = "14:ABE1"
name = "kirby_st_dive_hit"
desc = """
The frame step of the bounce after the dive hit something: kirby_gravity with profile 0, kirby_face_pad,
kirby_speed_pad_10, the move step, kirby_walls_stop_bump, kirby_floor_bump, kirby_ceiling_bump; then kirby_falling
(kirby_vy not negative) = script $0B (fall). Of the tests after it (ladder, B, Up, water, door) B pressed = $4B
and Up held = $12 answered in cov5-h-abdive (claim kst_cov5.dive_hit.exits); the ladder, water and door and the exits
of the floor and the ceiling never answered. Otherwise kirby_upkeep.
"""

[[sym]]
at = "14:AC6C"
name = "kirby_st_dive_land"
desc = """
The frame step of the bounce after the dive reached the floor: kirby_gravity with profile $0B, the move step (the
pad does not steer), kirby_walls_stop. Then: kirby_floor_bump = script $02 (resume); Up held = $12 (inflate);
water_entered = $17 (never ran). Otherwise kirby_upkeep.
"""

[[sym]]
at = "14:ACC4"
name = "kirby_st_duck"
desc = """
The frame step of ducking: kirby_speed_step with A = 0 and profile slope_profile (he brakes), the move step,
kirby_walls_stop. Then in order: kirby_floor_near carry set = script $0B (fall); A or B pressed (pad_ab_new) = $10
(slide); down_bit5_test = $0E (never ran); Down not held = $02 (resume). Otherwise kirby_duck_pose and
kirby_upkeep.
"""

[[sym]]
at = "14:AD03"
name = "kirby_duck_pose"
desc = "Kirby's pose = $2E + 2 * floor_kind_index, plus 1 when he faces left (obj_pose_faced)."

[[sym]]
at = "14:AD29"
name = "kirby_st_slide"
desc = """
The frame step of the slide: kirby_speed_step with A = 0 and profile slope_profile (the script gave the speed
$02B3; it only brakes), the move step, kirby_slide_rect and break_rect_0 (he hits what is before him). Then in
order: kirby_walls_bump = script $03 (stand); kirby_floor_near carry set = $0B (fall); kirby_slow_stop (the speed
below $C0) = $03. Otherwise kirby_upkeep.
"""

[[sym]]
at = "14:AD5E"
name = "kirby_slide_rect"
desc = """kirby_rect_set with X = 2 and the record for his pose: kirby_slide_rect_lo / hi [pose - $38], pose $38
facing right, $39 facing left."""

[[data]]
at = "14:AD70"
len = 2
name = "kirby_slide_rect_lo"
format = "bytes"
desc = "Low bytes of the addresses of the two records of kirby_slide_recs."

[[data]]
at = "14:AD72"
len = 2
name = "kirby_slide_rect_hi"
format = "bytes"
desc = "High bytes of the addresses of the two records of kirby_slide_recs."

[[data]]
at = "14:AD74"
len = 14
name = "kirby_slide_recs"
format = "rows:7"
desc = """Two records for kirby_rect_set, the slide to the right and to the left: kind 1, X offset +6 / -6, Y offset
+5, half width 4, half height 2."""

[[sym]]
at = "14:AE60"
name = "kirby_st_inflate"
desc = """
The frame step while Kirby takes air in: kirby_gravity_hold (profile 1, or 8 while A or Up is held),
kirby_face_pad, kirby_speed_pad_12, the move step, kirby_walls_stop, kirby_ceiling_stop, kirby_floor_stop. Then
pad_up_door = script $00 (door). Otherwise kirby_upkeep.
"""

[[sym]]
at = "14:AE9C"
name = "kirby_st_flap"
desc = """
The frame step of a flap: kirby_gravity with profile 8 (he rises), kirby_face_pad, kirby_speed_pad_12, the move
step, the three collision stops. Then in order: B pressed = script $16 (puff); water_entered = $14; pad_up_door =
$00. Otherwise kirby_upkeep.
"""

[[sym]]
at = "14:AEEC"
name = "kirby_st_float"
desc = """
The frame step of floating: kirby_gravity with profile 1 (he sinks slowly), kirby_face_pad, kirby_speed_pad_12,
the move step, the three collision stops. Then in order: A or Up held (pad_a_up_held) = script $13 (flap); B
pressed = $16 (puff); water_entered = $14; pad_up_door = $00 (never ran: Up flaps first). Otherwise kirby_upkeep.
"""

[[sym]]
at = "14:AFA9"
name = "kirby_st_puff"
desc = """
The frame step while Kirby lets the air out: kirby_gravity with profile 1, kirby_face_pad, kirby_speed_pad_12,
the move step, the three collision stops; water_entered = script $17 (never ran). No button is read: the puff
cannot be interrupted. Otherwise kirby_upkeep.
"""

