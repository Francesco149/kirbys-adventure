# ---------------------------------------------------------------- claims: buttons from a standing frame
[[claim]]
id = "kst14.duck.effect"
about = ["kirby_st_duck", "kirby_s_duck", "kirby_st_stand"]
text = "From a frame where Kirby stands (w12-opus@19010; the movie leaves him standing for 30 frames more), holding Down for 30 frames makes kirby_st_duck run 29 times and kirby_st_stand once; kirby_action ends as 6 and the pose as $2E. In the movie kirby_st_stand runs all 30 frames and kirby_st_duck never."
kind = "effect"
on = "w12-opus@19010"
frames = 30
input = "D*30"
expect = "n('kirby_st_duck') == 29 and n('kirby_st_stand') == 1 and cn('kirby_st_stand') == 30 and cn('kirby_st_duck') == 0 and ram[0x5E1] == 6 and ctl[0x5E1] == 0 and ram[0x62C7] == 0x2E"

