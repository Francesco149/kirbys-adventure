unit = "kst14"
title = "Kirby's states in bank 14: standing, walking, running, jumping, falling, ducking, sliding, floating"
summary = """
Bank 14 holds the states of Kirby without a copy ability (scripts $00-$1D of kirby_script_lo / hi / bank), the same
states again for Kirby who holds one (scripts $1E-$39 and $41), the start script of his object (type 1, 14:A000) and the
scripts of being hurt ($E8-$EB, $ED, $EE). This unit documents the first set and the start.

kirby_s_start runs once per room: kirby_start_init resets his variables, the screen fades in, and a jump table on
kirby_form ($05E0) picks the set of scripts: 0 goes to kirby_s_reset (script 1, this unit), 2 to 14:B2D9 (the set
with an ability), the other values to banks 15, 17, 18 and 19. kirby_s_reset stores form 0 and kirby_ability $FF
and falls into kirby_s_resume (script 2), which is where every state goes when it does not know what comes next:
21:9BF7 answers 0-7 and a jump table starts standing, walking, running, falling, three water states or floating.

A state is a script that stores its number in kirby_action, names its routine with on_tick and then only animates.
The routine runs once per frame and is a chain of tests in a fixed order; the first test that answers carry set
ends the frame with `ldx #n` / `jmp kirby_script_upkeep`, and when none does the routine ends with
`jmp kirby_upkeep`. The claims model each chain: which exit ran, that the exit left Kirby's script at the address of
script n, and for the tests that read the pad or a speed, that the exit ran exactly when the test was reached and
the button was down.

  state (script)        action  routine            leaves to
  stand ($03)           0       kirby_st_stand     fall (no floor), walk (Left / Right with room), ladder, duck (Down),
                                                   jump (A), inhale $4B (B), door (Up at a door), inflate (Up), stand
                                                   again (the floor's kind changed)
  walk ($04, $05)       1       kirby_st_walk      stand (wall, speed 0), fall, turn (the other direction), run (double
                                                   tap), ladder, duck, jump, inhale, door, inflate, walk again (floor)
  run ($06, $07)        2       kirby_st_run       stand (wall), fall, turn, walk (no direction and slow), ladder, duck,
                                                   jump, inhale, door, inflate, run again (floor)
  turn ($08)            3       kirby_st_turn      stand (speed 0), jump, inhale
  jump ($09, $0A)       4       kirby_st_jump_held (23 frames: A released = script $0A), kirby_st_jump_rise, then
                                                   kirby_st_fall: fall (ceiling, top of the room), inhale, door
  fall ($0B)            5       kirby_st_fall      resume (floor), fall again (a bump waits), ladder, inhale, inflate
                                                   (Up), water $17, door; after 28 frames (17 after a jump): dive
  dive (no number)      5       kirby_st_dive      dive landing $0D (floor), dive hit $0C (bit 3 of kirby_flags),
                                                   ladder, inhale, inflate, water
  dive hit ($0C)        5       kirby_st_dive_hit  fall (he falls again)
  dive landing ($0D)    5       kirby_st_dive_land resume (floor), inflate
  duck ($0F)            6       kirby_st_duck      fall, slide (A or B), resume (Down released)
  slide ($10)           7       kirby_st_slide     stand (wall, speed below $C0), fall
  inflate ($12)         (kept)  kirby_st_inflate   door; after 24 frames: float
  flap ($13)            $0D     kirby_st_flap      puff (B), float in water $14, door; float when Up is released
  float (no number)     $0D     kirby_st_float     flap (A or Up), puff (B), float in water $14
  puff ($16)            $0A     kirby_st_puff      after 24 frames: inflate again (Up held, not in water) or resume

Speed and gravity profiles: walking and running use kirby_ground_speed_0 / _5, turning kirby_ground_brake, ducking
and sliding brake with profile slope_profile (0-4), the jump, the fall and the dives steer with profile 10
(kirby_speed_pad_10), the floating states with profile 12. Gravity: profile 0 for jump and fall, $0B for the dive
landing, kirby_gravity_hold (1, or 8 while A or Up is held) while inflating, 8 for the flap, 1 for float and puff.
The jump starts with a Y velocity of $FC70; after 23 frames, or when A is released, the script stores $FF50, five
frames later 0, and the fall routine takes over.

Open:
- Never ran, so not described: the exits of kirby_st_turn to stand at a wall and to fall; of kirby_st_jump_rise to
  resume (the ladder, $11, first ran in cov7-l-wheel: claim cov7.jump_rise.exits); of kirby_st_fall and kirby_st_dive at a ceiling bump and at a door; the exits of
  kirby_st_dive_hit to the floor, the ceiling, the ladder, water and the door (its B, $4B, and Up, $12, first ran
  in cov5-h-abdive: claim kst_cov5.dive_hit.exits); the water exit of kirby_st_dive_land and kirby_st_puff; the door exit of
  kirby_st_float; the exit of kirby_st_duck to script $0E (down_bit5_test: Down on blocks with bit 5 of prop_shape) and script $0E
  itself first ran in cov5-f-del@203952 (kirby_s_drop_through, unit cov5_tour).
- Rare exits that ran but are not required by `cases` (the model covers them when a window holds one): the ladder
  from stand, walk, run, fall and dive (1-4 times each in the corpus), stand to fall (4 times), turn to 18:ACD7 (4),
  duck to fall (5), dive to 18:ACD7 (4), the door from kirby_st_jump_rise (once), water from kirby_st_flap and
  kirby_st_float (once each), water from kirby_st_fall and kirby_st_dive.
- Script $00 (kirby_s_door) is described from its listing; only its start (Up at a door) is claimed. Its call
  table by 14:A6CC (the way Kirby looks when he enters: exhaling when kirby_action is $0D, by kirby_form otherwise)
  and the fade are not claimed.
- Script $11 (14:AD82, the ladder, action 8, routine 14:AD96, 96 calls): Up climbs with a Y velocity of $FECD
  unless shape 2 is at 7 above him, Down descends with $0133 and pose $6F, neither stands still; when the block at
  +6 (Up) or +7 (Down) is not shape 1, or Left or Right is held, the routine sets script 14:A74E (resume) itself.
  Up ran 4 times; not documented.
- Script $14 / $15 (14:AF34 / 14:AF42: floating in water, routine 14:AF48 with gravity profile $0C; water_left
  goes to $15, which goes back to float; 38 calls), $17 (14:AFD3: entering water: reset, 21:9883, an object, then
  resume), $18 (14:AFE3, routine 14:B001: standing in water), $19 (14:B042, routine 14:B082: walking in water),
  $1A (14:B0EE, routine 14:B126: swimming, pose by $05F5), $1B / $1C (14:B173 / 14:B18E, routines 14:B222 and
  14:B218: the spit of water, ran once), $1D (14:B2CC: leaving water upward, then the jump script): seen in the
  listing only.
- Scripts $1E-$39 and $41 (form 2, Kirby with a copy ability, sprite map 1A:8676) repeat the set: $1E reset
  (14:B2D9), $1F stand (14:B300, routine 14:B31A), $20 / $21 walk (14:B3D0 / B3DA, 14:B473), $22 / $23 run
  (14:B4FE / B509, 14:B525), $24 turn (14:B5A6, 14:B5BE), $25 / $26 jump (14:B5F9 / B60E, 14:B62C, 14:B636), $41
  (14:B6BF, inside the script at 14:B68C, routines 14:B6C6, B6D3, B6DD), $27 fall (14:B783, 14:B7A9; dive 14:B81D,
  14:B82B), $28 dive hit (14:B8A6, 14:B8B2), $29 dive landing (14:B926, 14:B947), $2A (14:B973, 14:B984), $2B duck
  (14:B992, 14:B99F), $2C slide (14:B9E7, 14:BA04), $2D (14:BA5D), $2E inflate (14:BB2B, 14:BB3B), $2F flap
  (14:BB63, 14:BB77), float (14:BBB5, 14:BBC7), $30 / $31 (14:BC0F / BC1D), $32 puff (14:BC61, 14:BC84), $33-$39
  the water states (14:BCAE onward, never ran). Not documented; the numbers are from the table, the meanings from
  the action numbers and the shape of the scripts.
- The hurt scripts $E8-$EB, $ED, $EE (14:A4BC, A37B, A4B2, A240, A1C8, A4F8) and 14:A703 (an ability taken from an
  item) are not documented. $ED starts from kirby_spike_test and a hit: a jump table on 14:A1E8 (variable 0 of slot
  1, or 5 for form $0E) picks one of six reactions (14:A1F6 the common knock-back with routine 14:A24A, others with
  routines 14:A3B2, A3E7, A4C3, A2F2).
- In kirby_s_start the rest of the script (the fade loop with 14:A196, the branches on $07DA, $07F5, $05A2, the
  room tests 14:A162 / 14:A173, the low-HP sound) is not claimed. kirby_start_init restored an ability from
  $05EA-$05EC once in the corpus; that branch is described from the code.
- What 21:9D82 waits for at the start of the fall (it answers 1 while kirby_vy is negative) is only read from the
  code. That script $4B (18:ACD7) is the inhale is taken from the B button, not from that bank.
"""

[[model]]
name = "kst14_chain"
code = '''
def kst14_script(rd, wr):
    """The address Kirby's script was set to during the call (the program counter of his first thread,
    obj_first_thread of slot 1), or None when no thread's program counter was written."""
    if not any(0x6380 <= k < 0x63C0 for k in wr):
        return None
    t = rd[0x614D]
    return wr[0x63A0 + t] << 8 | wr[0x6380 + t]

def kst14_exits(ran, rd, wr, exits, stay):
    """exits = [(instruction of the exit, address of the script it starts)], stay = the jmp kirby_upkeep at the end.
    Exactly one of them ran; an exit left Kirby's script at its address, staying left the script alone."""
    took = [e for e in exits if ran(e[0])]
    if ran(stay):
        return not took and kst14_script(rd, wr) is None
    return len(took) == 1 and kst14_script(rd, wr) == took[0][1]

def kst14_fki(kind):
    """floor_kind_index: 0-3 for floor_kind 2-5, else 4."""
    return kind - 2 if 2 <= kind <= 5 else 4

def kst14_s16(v):
    return v - 0x10000 if v & 0x8000 else v
'''

# ---------------------------------------------------------------- the start
[[script]]
at = "14:A000"
name = "kirby_s_start"
desc = """
The first script of object type 1 (Kirby), started once per room. A jump table on $07F5 goes on here for 0 and to
banks 2E and 36 otherwise; with $07DA nonzero it jumps to 23:B0D5. Then: kirby_start_init, the position, draw and
move routines of the object, Z $C0, the first move step, a loop that fades the screen in (14:A196), a branch to bank
15 for rooms below 7 (14:A162), and at 14:A0A3 a jump table on kirby_form with 15 entries: 0 = kirby_s_reset, 1 =
18:AF50, 2 = 14:B2D9, 3 = 15:A000, 4 = 17:ABCF, 5 = 15:AC09, 6 = 17:A000, 7 = 18:AB7C, 8 = 19:B669, 9 = 18:ABDB, 10 =
18:A847, 11 = 19:B307, 12 = 18:AAEC, 13 = 17:B800, 14 = 17:BAA9. With hp below 8 a sound ($3C) is requested first.
"""

[[sym]]
at = "14:A0D5"
name = "kirby_start_init"
desc = """
Resets Kirby for a room. kirby_facing = $40 (right), floor_kind = 2; kirby_action, kirby_hurt_timer, cam_locked,
$05E5, hit_kirby_off, floor_flag and foot_flags = 0; tap_timer, bump_kind and $05E2 = $FF; kirby_flags keeps bits 5
and 6 only; kirby_in_water = 1 when the block at his position has bit 7 of prop_shape, else 0. When $05EA is not
$EE, kirby_ability, kirby_form and $0598 are taken from $05EA-$05EC, $05EA becomes $EE and bit 5 of kirby_flags
is cleared. Then kirby_form is replaced by entry kirby_form of kirby_start_forms, and when that is 0 kirby_ability
becomes $FF. Ends in kirby_stop (21:987D).
"""

[[data]]
at = "14:A14D"
len = 15
name = "kirby_start_forms"
format = "bytes"
desc = """The form Kirby starts a room in, by the form he ended the last one in: 0, 0, 2, 3, 4, 5, 6, 0, 2, 2, 2,
2, 2, $0D, $0E for forms 0-14. Forms 8-12 start as 2, forms 1 and 7 as 0, the others as themselves. Entries 0-3, 6
and 13 were read."""

[[ram]]
at = "05E0"
name = "kirby_form"
desc = """Which set of scripts Kirby runs. kirby_s_start jumps through a table on it at the start of a room. 0 =
without a copy ability (kirby_s_reset stores it; scripts $00-$1D); 2 = with one, not using it (14:B2F1 stores it;
scripts $1E-$39); $0A was seen while ability 7 is used. The scripts store it with set_mem8; kirby_start_init
maps it through kirby_start_forms."""

# ---------------------------------------------------------------- scripts
[[script]]
at = "14:A5AE"
name = "kirby_s_door"
desc = """
Script $00: Kirby goes through a door. Every state whose routine asks pad_up_door starts it. Objects 9-17 are
stopped (14:A186), a sound ($43 in rooms below 7, else $07), a call table on 14:A6CC for how he looks (floating:
