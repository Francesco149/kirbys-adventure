unit = "scn_cov4"
title = "What the fourth coverage batch ran in the scene, pause and minigame banks: the scene after World 7's card, EXIT STAGE, Egg Catcher's 30 throws, Crane Fever's perfect grab and dropped doll, Quick Draw's fouls"
summary = """
Code, scripts and small tables of the banks 36, 38, 3A, 3B and 3C that ran for the first time in the fourth batch of
coverage movies (cov4-d-*) and that no unit described, named in the style of the units that own their neighbours
(scenes2, scr_scn, rooms2, minigame, leftovers, tail). Bank 2E has no new code; its new script lines are none.
Paths that first ran inside routines and scripts of other units are claimed here and named by those units' names.

World 7's card played out (cov4-d-w7, from 130449). After w7card_kirby's three steps (w7card_step now also ran its last
two instructions) Kirby goes down the slope (36:A0A1: pose 8, Y velocity $100, pose $21 for 47 frames) and creates part
3, w7card_dedede: King Dedede falls in from ($FC, 1) at $400 per frame for 44 frames, lands (the thread
w7card_land_shake shakes the view twice through w7card_shake: add_dd / add_e0 every two frames), hops at Kirby,
skids on the spot with a trail of dust (part $0C, w7card_dust_16: sixteen puffs that w7card_dust_place starts at his
feet, 10 pixels left and down, moving left and up) and turns to Kirby. Meanwhile Kirby creates part $0B, w7card_redraw:
w7card_redraw_start expands packed_36_A85E (1024 bytes: a name table with its attributes) to $68C8 and sends its first
row to $2000 through the record at $07E5 (w7card_redraw_rec), then one row per frame (w7card_redraw_step, 32 times):
the card's LEVEL 8 and KIRBY'S ADVENTURE boxes on the first screen give way to the landscape. The movie ends at 130900
during Dedede's script (36:A2F7).

The pause in a stage cleared before (cov4-d-pause, frame 3010): pause_exit_test answers 1 (38:B111), pause_open sets
split_mode 0 and the script goes to pause_exit_box: a hand (picture 1A:8000) at ($50, $BA) beside CONTINUE, variable 0
= 0, display on, fade in, the tick pause_exit_tick: Up sets variable 0 = 0, Down 1 (Select would toggle it: never), each
change plays sound $2C, and the hand's Y (slot 0) is pause_exit_hand_y[variable 0] ($BA CONTINUE, $CA EXIT STAGE); A, B
or Start starts pause_exit_chosen: variable 0 = 0 goes on to pause_end (the ordinary close), 1 to pause_exit_stage:
sound 7, fade out, pause_close, room = room_return = $FFFF and leave_code = 6 (3106-3118). The story skipped
(cov4-d-story@7300): story_skip's path story_skip_go ran once.

Egg Catcher to 30 throws (cov4-d-egg from 18741): egg_tick_end sets egg_over = 2 (3A:8137), egg_over_test waits for
egg_air_clear (3A:80E7), the ball (egg_ball_gone) waits the same and ends, and egg_result_kind answers 2 (eggs eaten, no
bomb, fewer than 30: 3A:8120) for Kirby, Dedede and the manager: Kirby's egg_kirby_full makes min(egg_eaten, 10)
chicks (egg_chick_count; part $0D egg_chick, one every 35 frames) that hop out to the right and blink away, Dedede
plays the poses at 3B:A38C, the manager waits 300 more frames (egg_end_long) before egg_end_wait.

Crane Fever (cov4-d-crane): the first credit stops the claw exactly over the big doll: crane_tick_result's result 0
(3B:B834) gives the claw's variable 7 from crane_perfect_hold and the script crane_claw_perfect (no slip, no shake),
and crane_doll_tick gives the doll crane_doll_perfect (lifted straight, no sideways step). It is carried home and drops
into the chute with a credit left: crane_doll_replace (3B:AEA7) puts a doll back at a free place (the place X of
crane_place_x; $07BF is the place not taken) and the doll drops in again. The second credit's grab has quality 1:
crane_tick_doll_home's drop test (crane_drop_odds, crane_drop_rows, crane_drop_far) drops the small doll at X $B7:
crane_doll_dropped sets crane_doll_fell, falls (crane_doll_fall_small), waits for the floor (crane_doll_floor_test,
crane_doll_floor_y), adds itself to crane_dolls_down and waits for the claw to be home; crane_tick_carry sees
crane_doll_fell (3B:B4B5) and sends the empty claw home. The result screen pays the big doll of the first credit
(crane_prize1_big: crane_life twice; crane_prize1_pay) and crane_prize_pose read the rows after the first four
(crane_prize_rows_2).

Quick Draw (cov4-d-qd, the fifth duel): the first false start (qd_tick_early, 3C:ACB4) gives the sign qd_sign_foul
(its tick qd_sign_tick_foul: "FOUL!" and a cross in slot 7, qd_sign_foul_1), the opponent a halt and the manager
qd_foul (Kirby's picture 3A:9B40, sound $1D, shakes); the cross (part 5, qd_cross) drops onto Kirby, bounces left
(qd_cross_vx) and lands below the field; qd_tick_foul then restarts the duel (qd_round_again, qd_sign_restart). The
second false start (3C:ACE0, qd_lost + 1) gives the sign the same and a cross in slot 8 (qd_sign_foul_2), the manager
qd_foul_2, which after 80 frames goes by qd_any_won to qd_lost_later (four rounds won) and qd_rounds_result.

Open:
- World 7's scene: the rest of w7card_kirby (36:A0EA on), of w7card_dedede (36:A2FB-36:A3E4), the parts 4, 5, $0D, $0E
  (36:A5D1, 36:A4C4, 36:A46E, 36:A5D0), 36:A281 and 36:A3FA-36:A42E never ran; the camera path of w7card_tick still never
  ran (the card is ended by lvcard_done here?) and why the redraw's 33rd row goes to $2400 from $6CC8 is not known.
  What the pictures 35:8EA6 / 35:8EB6 / 35:9397 show is taken from the screen.
- The pause: Select in the exit box (38:B090) never ran; what leave_code 6 does is unit frame's.
- Egg Catcher: 30 eggs (egg_result_kind 3, 3A:8125) never; egg_end_long's and egg_kirby_full_snd's last waits were cut
  short by Start (minigame_end_tick).
- Crane Fever: the big doll dropped (3B:AF86, 3B:AF98-3B:AFFF), crane_doll_replace's random place (3B:B739), the drop
  left of X $38 and the bytes of crane_drop_odds for levels 1 and 2 never ran; crane_perfect_hold is taken as four
  bytes up to crane_hold_tab.
- Quick Draw: qd_tick_foul's second-foul path (3C:B05C) never ran (the second foul goes to qd_foul_2 instead); the
  meaning of picture 3A:9B40 (Kirby after a foul) is taken from the screen.
"""

