about = ["kirby_ladder_test"]
text = "Every call of kirby_ladder_test returns carry set exactly when $05E2 is negative, the low four bits of Kirby's world X are 2-14, Up or Down is held and the one prop_shape byte read has shape 1; then the low bytes of his X position and world X position are written with the low four bits made 8, and otherwise neither is written."
kind = "call"
fn = "kirby_ladder_test"
on = ["w3-sonnet@29700+200", "w12-sonnet@38900+200", "main@32450+150", "main@400+1000", "w3-sonnet@500+1500", "w1-v2-sonnet@800+1500"]
