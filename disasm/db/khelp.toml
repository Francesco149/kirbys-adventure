expect = "(rp & 1) == (rd[0x5E2] >= 0x80 and 2 <= rd[0x6075] & 15 < 15 and rd[0xE6] & 0x0C != 0 and shapes(romrd) == [1]) and ((wr.get(0x83), wr.get(0x6075)) == ((rd[0x6075] & 0xF0) | 8, (rd[0x6075] & 0xF0) | 8) if rp & 1 else not writes & {0x83, 0x6075})"

[[claim]]
id = "khelp.floor.near"
about = ["kirby_floor_near"]
text = "Every call of kirby_floor_near writes foot_flags = 0 and, in the order centre, left, right, takes the first foot of the model with a floor at a distance of 0-9 or $F6-$FF: it then writes floor_dist, floor_kind and floor_flag from that foot, adds the distance (signed) to the Y position of slot 1, copies it to the world Y position, sets the Y fraction to $80 and returns carry clear. With no such foot it returns carry set and writes none of them."
kind = "call"
fn = "kirby_floor_near"
on = ["main@400+1000", "w3-sonnet@500+4000", "w12-sonnet@1200+4000", "w1-v2-sonnet@800+3000", "attract@1100+2500", "main@15600+300"]
min_calls = 1500
max_calls = 3000
use = ["probe_geometry", "kirby_feet", "khelp_model"]
cases = { "rp & 1" = 12, "not rp & 1 and wr[0x5F3] >= 0xF6" = 20, "not rp & 1 and 0 < wr[0x5F3] < 10" = 20 }
expect = "wr[0x78E7] == 0 and near(rd, romrd) == (rp & 1, landed(wr)) and (not writes & {0xB9, 0xCB, 0xA7} if rp & 1 else (h16w(wr, rd) == (rd[0xB9] | rd[0xCB] << 8) + hs8(wr[0x5F3]) & 0xFFFF and wr[0x6099] == wr[0xB9] and wr[0x60AB] == wr[0xCB] and wr[0xA7] == 0x80))"
model = '''
def near(rd, romrd):
    for dx in (0, -6, 6):
        c, d, k, fl = foot(rd, romrd, dx)
        if not c and (d < 10 or d >= 0xF6):
            return (0, (d, k, fl))
    return (1, None)

def h16w(wr, rd):
    return wr[0xB9] | wr[0xCB] << 8
'''

