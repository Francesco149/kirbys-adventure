unit = "khelp"
title = "Kirby's helpers in bank 21: the per-frame upkeep, the script table, poses, bumps and the small tests"
summary = """Kirby (object slot 1) is run by scripts in banks 14-19, and the 6502 routines those scripts call ("state
routines", 122 of them) lean on the helpers of bank 21. This unit has the ones that the units kblocks, kmove, kcoll and
kvel left.

There is no state number in RAM: Kirby's state is the script his object runs. The scripts call 6502 routines of their own bank through call_vector, once per frame; kirby_script_set (X = 0-$EE) looks the
script's address and bank up in kirby_script_lo / hi / bank (239 entries, all in banks $14-$19) and hands it to
obj_set_script for the current object; kirby_script_upkeep is the same followed by kirby_upkeep. A state routine ends
by jumping to kirby_upkeep (stay) or to kirby_script_upkeep (change).

kirby_upkeep is what every state runs once per frame: it counts kirby_hurt_timer down (values 1-$7F only) and
derives kirby_blink from its bit 2 (kirby_draw of unit draw draws Kirby in palette 1 while it is not 0), runs the
hook (kirby_hook_run: a routine address in kirby_hook that scripts set with kirby_hook_set; the hooks animate
Kirby's palette), makes a bubble every 64 frames in water (kirby_bubble), tests the block at Kirby's position for
shape $E (kirby_spike_test), writes kirby_body of unit hit ($0509-$050B: Kirby's world Y plus kirby_body_dy, and
kirby_body_half; entry 1 of both when kirby_action is 6) and, when hp is negative, switches to script $EE.

Shape $E of prop_shape is a block that hurts: kirby_spike_test takes 8 from hp (kirby_hp_sub), stores 4 in
variable 0 of slot 1 and switches to script $ED, unless bit 7 or bit 6 of kirby_flags is set, the blink timer runs,
or 3F:E2C4 answers carry set. kirby_hp_sub (A = amount) also clears bit 0 of kirby_flags, frees objects, resets
the hook and the palette, and takes the copy ability away (kirby_ability = $FF, with a sound and an object of type 5
that carries it) when one is held, the HP did not go below 0 and bit 5 of kirby_flags is clear. pad_select_drop
does the same loss of the ability on a new press of Select.

Poses: bit 0 of a pose number is the facing. kirby_pose_face copies bit 7 of kirby_facing into bit 0 of Kirby's
pose; obj_pose_faced stores A, plus 1 when variable 1 of the current object is negative; obj_pose_script takes the
number from the script.

Bumps: bump_kind is $FF or the number of a bump that waits to be shown: 0 a ceiling (kirby_ceiling_bump, rising
faster than 179/256 pixel per frame), 2 a floor (kirby_floor_bump, falling at 179/256 or more, kirby_action not 9),
1 / 3 a wall to the right / left (wall_bump_set, kirby_speed at $B3 or more). bump_pending and bump_index test it.
The three *_bump routines are the collision tests of unit kcoll with that store and the stop of the velocity.

The rest are tests that answer in the carry, for the scripts' conditional jumps: pad tests (pad_back_held,
pad_a_up_held, pad_a_released, pad_down_released, pad_ab_new, pad_idle_slow, pad_side_free, pad_double_tap with
tap_timer), kirby_ladder_test (shape 1 under Up or Down: Kirby is centred on the block), kirby_floor_near (a floor
within 10 pixels of a foot: Kirby is put on it), floor_kind_changed (floor_index_prev), kirby_speed_zero,
kirby_slow_stop, kirby_falling; and movers: kirby_gravity_water, kirby_gravity_hold, kirby_air_step, kirby_stop,
kirby_rect_set (kirby_rect of unit kblocks from a 7-byte record), kirby_pal_set.

Open: kirby_body is read in unit hit (the Y of the centre of Kirby's body and half its height); that kirby_action 6
is the crouch is not claimed here. The Start branch of kirby_upkeep (bit 4 of pad1_new_copy: object type 9 in slot 0)
never ran. In kirby_ladder_test $05E2 was negative on every call; in pad_double_tap bit 6 of kirby_flags was clear
on every call; kirby_slow_stop never saw a negative kirby_speed in the windows; in kirby_ceiling_bump the kind was 2 on every hit (the other kinds also clear the X velocity); the
left half of pad_side_free's "inside the wall" answers is thin. kirby_spike_test hurt Kirby once in the corpus (15
calls found shape $E); the Y offsets it takes from 21:80FB are both 0. Bit 0 of prop_class (floor_flag): 21:9B96 and
21:9BAA return slope_profile + (0 or 5 / 5 or 10 by floor_flag) in A and store floor_index_prev, but floor_flag was 0
on all their calls, as in unit kvel; no meaning. kirby_action is only compared here (4, 6, 9, 13); the scripts store
it. What the script numbers are (which state is which) is not claimed beyond $ED (hurt by a block) and $EE (HP
below 0). The second entry of kirby_pose_face at 21:8FCF (pose in A, 292 runs) is not claimed.
Bank 21 routines not taken (one line each, from the listing): 21:8921 / 21:892F carry tests on $05E5 / $05E6 and a
countdown in variable 2 of slot 1 (inhale); 21:8883 gravity profile 2 or 4 with a 15-frame timer $05F6 that A or Up
restart with a Y velocity of -1 (swimming); 21:89F7 A or Up held: $05F6 = 0, carry; 21:8A06 / 21:9BBE a direction
number from the pad through 21:9BD5, carry when it differs from $05F5; 21:801F a pose from bump_kind through 21:8045
and the script; 21:9955 / 21:9952 / 21:99D8 / 21:99EA / 21:9A01 create objects from script operands (slots 3-5, 0-17,
6-8), 21:9955 frees an older one of the same kind first; 21:9A94 / 21:9AC0 / 21:9AEE / 21:9B06 / 21:9B6C the hooks
(palette flashes through palette_load (3E:C90E); 21:9B6C makes kirby_blink bit 1 of obj_frame while kirby_action is 4); 21:9CDC
palette write unless bit 6 of kirby_flags; 21:9BF7 a state number 0-7 after a door from water, floor and speed;
21:9BE0 0 / 1 / 2 by kirby_speed; 21:9D72, 21:9D82, 21:9DA3, 21:9DCD, 21:9DF2, 21:8FF5, 21:98D5 small values in A for
the scripts' tables; 21:9D8C clears $05D1-$05D3, $05E5-$05E7, $05E9; 21:9DB6 a fixed knock-back velocity; 21:9883 /
21:988D / 21:9893 set and clear kirby_in_water; 21:88CA / 21:9EE1 test and clear bit 3 of kirby_flags; 21:9EEA /
21:9EF6 set and clear bit 7 of kirby_flags around 3E:DFE5 / 3E:DFFB; 21:9ED3 / 21:9ED9 change $01A2; 21:9E59 /
21:9E72 free objects of slots 3-5 / look for type 7 in slots 9-17; 21:9E8D creates the object of type 5 that carries
the lost ability; 21:88DE (8 runs), 21:8C2F / 21:8C39 (side limits, as in unit kvel), 21:8AFC."""

# ------------------------------------------------------------------ routines

[[sym]]
at = "21:805B"
name = "kirby_upkeep"
desc = """What every state of Kirby runs once per frame, as its last step. kirby_hurt_timer, when it is 1-$7F, is decremented; kirby_blink = bit 2 of the timer. Then kirby_hook_run, kirby_bubble, kirby_spike_test. Then $0509/$050A = the world Y of slot 1 + kirby_body_dy[i] and $050B = kirby_body_half[i], with i = 1 when kirby_action is 6 and 0 otherwise. Then (never ran) a new press of Start with bit 7 of kirby_flags clear creates an object of type 9 in slot 0. Last, with hp negative, it jumps to kirby_script_set with X = $EE."""
comments = { "8068" = "bit 2 of the countdown: Kirby blinks", "8078" = "kirby_action 6: the second entry of the two tables", "809E" = "Start: never ran", "80B1" = "HP below 0: script $EE" }

[[sym]]
at = "21:9A8B"
name = "kirby_hook_run"
desc = "With the high byte of kirby_hook 0: returns. Otherwise jumps to the address in kirby_hook."

[[sym]]
at = "21:9A6A"
name = "kirby_hook_set"
desc = "Called from a script with four operand bytes (script_arg four times): they go to $05EE-$05F1, the first two being kirby_hook, the other two the hook's own counters."

[[sym]]
at = "21:9A83"
name = "kirby_hook_clear"
desc = "Clears the high byte of kirby_hook (no hook) and jumps to kirby_pal_set."

[[sym]]
at = "21:9CB3"
name = "kirby_pal_set"
desc = "Writes Kirby's three colours (palette entries 17-19) from kirby_pal_tab through 3E:C90E ($18/$19 = the row's address, A = $10, Y = 4): row 0 when kirby_ability is negative (none), row 1 for abilities $0C and $0D, row 2 for any other."

[[sym]]
at = "21:80FD"
name = "kirby_bubble"
desc = "With kirby_in_water nonzero and the low six bits of obj_frame 0 (every 64th frame): spawn_vars+3 = $0E and a jump to 21:9955, which creates that object at the point in $4B:X, $4C:Y. Otherwise nothing."

[[sym]]
at = "21:80C0"
name = "kirby_spike_test"
desc = """obj_point_off with X = 0 and Y = entry 0 or 1 of 21:80FB (by the sign of kirby_vy; both are 0), then prop_shape_at: the shape of the block at Kirby's position. With shape $E, bits 7 and 6 of kirby_flags clear, kirby_hurt_timer 0 and carry clear from 3F:E2C4: kirby_hp_sub with A = 8, variable 0 of slot 1 ($61CB) = 4, and a jump to kirby_script_set with X = $ED. Otherwise nothing."""

[[sym]]
at = "21:9DFD"
name = "kirby_hp_sub"
desc = """Takes A from hp. Clears bit 0 of kirby_flags, calls 21:9E59 and 21:9E72 (they free objects), clears the high byte of kirby_hook and calls kirby_pal_set. Then, when the HP is not negative, kirby_ability is not negative and bit 5 of kirby_flags is clear, the ability is lost: sound $27, 21:9E8D (an object of type 5 with the ability in its variable 4), $05FD is incremented when below 2, $05E0 = 0, kirby_ability = $FF, $0598 = 0. Carry set when the HP is now negative."""
in = "A = amount"
out = "carry set: the HP went below 0"

[[sym]]
at = "21:8CEE"
name = "kirby_script_set"
desc = "Starts script X for the current object: new_script_bank = kirby_script_bank[X], then a jump to obj_set_script with the address kirby_script_hi[X] : kirby_script_lo[X] and the object in cur_object."
in = "X = script number 0-$EE"
out = "A = X = the object (obj_set_script)"

[[sym]]
at = "21:8CE8"
kind = "part"
name = "kirby_script_upkeep"
desc = "kirby_script_set, then a jump to kirby_upkeep: how a state routine changes Kirby's script and ends the frame."
in = "X = script number"

[[sym]]
at = "21:8FCC"
name = "kirby_pose_face"
desc = "Bit 0 of Kirby's pose (obj_pose of slot 1) = bit 7 of kirby_facing; the other bits stay. 21:8FCF is a second entry that takes the pose from A."

[[sym]]
at = "21:8FE6"
name = "obj_pose_faced"
desc = "obj_pose of the current object = A, plus 1 when its variable 1 ($61DC + slot: the facing) is negative."
in = "A = pose number for facing right"

[[sym]]
at = "21:8FDC"
name = "obj_pose_script"
desc = "Called from a script with one operand byte: A = the byte after the script's current byte, script_ptr advances by 1, then it falls into obj_pose_faced."

[[sym]]
at = "21:8C7D"
name = "kirby_ladder_test"
desc = """Carry set when Kirby can take a ladder: $05E2 is negative, the low four bits of his world X are 2-14, and Up is held with shape 1 (prop_shape_at) at his position + 6 in Y, or Up is not held, Down is, and shape 1 is at + 7. Then the low byte of his X position and world X position becomes the block's centre (low four bits = 8). Carry clear otherwise."""
out = "carry"

[[sym]]
at = "21:8B4E"
name = "kirby_floor_near"
desc = """foot_flags = 0, then kirby_foot_mid, kirby_foot_left, kirby_foot_right in that order: the first that finds a floor at a distance (low byte of probe_dist) of 0-9 or $F6-$FF (-10 to -1) ends the search: kirby_land_set (floor_kind = A, floor_flag = X, floor_dist = the distance), the distance is added to the Y position and the world Y position of slot 1, the Y fraction becomes $80, and the answer is carry clear. With no such foot: carry set."""
out = "carry clear: Kirby was put on a floor within 10 pixels; carry set: none"

[[sym]]
at = "21:8A5D"
name = "floor_kind_changed"
desc = "floor_kind_index (X = 0-4 from floor_kind), compared with floor_index_prev and stored there. Carry set when it differs from the stored one."
out = "carry; X = the index"

[[sym]]
at = "21:8BFA"
name = "kirby_walls_bump"
desc = "kirby_walls. When it moved Kirby out of a wall and the direction of his X velocity (vx_index) is the one he faces (facing_index): wall_bump_set, kirby_vx_zero, carry set. When the two differ, or there was no wall: carry clear."
out = "carry set: he ran into a wall facing it"

[[sym]]
at = "21:9034"
name = "kirby_walls_stop_bump"
desc = "kirby_walls. No wall: carry clear. Otherwise wall_bump_set, then kirby_vx_zero unless the high bytes of kirby_vx and of the X velocity of slot 1 differ in sign, and carry set. It is kirby_walls_stop (unit kcoll) with the bump."
out = "carry set: he was moved out of a wall"

[[sym]]
at = "21:8C16"
name = "wall_bump_set"
desc = "With kirby_speed at $00B3 or more (as an unsigned 16-bit number): bump_kind = wall_bump_kind[vx_index], 1 for an X velocity to the right, 3 to the left. Otherwise nothing."

[[sym]]
at = "21:8BAB"
name = "kirby_floor_bump"
desc = "kirby_floor. Not landed: carry clear. Landed: land_bump_set, kirby_vy_zero, carry set."
out = "carry set: he stands on a floor"

[[sym]]
at = "21:8BB9"
name = "land_bump_set"
desc = "bump_kind = 2 when kirby_action is not 9 and kirby_vy is $00B3 or more (as an unsigned 16-bit number). Otherwise nothing."

[[sym]]
at = "21:8BD3"
name = "kirby_ceiling_bump"
desc = "kirby_ceiling. No ceiling: carry clear. Otherwise bump_kind = 0 when kirby_vy is negative and below $FF4D (rising faster than 179/256 pixel per frame); kirby_vx_zero when the ceiling's kind is not 2 (never ran); kirby_vy_zero; carry set."
out = "carry set: he was pushed out of a ceiling"

[[sym]]
at = "21:88D5"
name = "bump_pending"
desc = "Carry set when bump_kind is not negative (a bump waits), else clear."
out = "carry"

[[sym]]
at = "21:8015"
name = "bump_index"
desc = "A = X = 1 when bump_kind is not negative, 0 when it is."
out = "A = X = 0 or 1"

[[sym]]
at = "21:8957"
name = "pad_select_drop"
desc = """Without a new press of Select (bit 5 of pad1_new_copy), or with bit 5 of kirby_flags set: carry clear. Otherwise Kirby gives his ability up: sound $28, 21:9E72, 21:9E8D (the object of type 5 that carries kirby_ability in its variable 4), kirby_hook_clear, kirby_ability = $FF, $0598 = 0, carry set. It does not look whether he has an ability."""
out = "carry set: Select was pressed and handled"

[[sym]]
at = "21:8A78"
name = "pad_back_held"
desc = "Carry set when the direction button opposite to Kirby's facing is held: Left (bit 1 of pad1_held_copy) when he faces right, Right (bit 0) when he faces left. The mask is facing_pad[facing_index + 1], the second being the byte at 21:8002 (facing_pad_back)."
out = "carry"

[[sym]]
at = "21:894D"
name = "pad_a_up_held"
desc = "Carry set when A or Up is held (pad1_held_copy & $88), else clear."
out = "carry"

[[sym]]
at = "21:8A40"
name = "pad_a_released"
desc = "Carry set when A is not held (bit 7 of pad1_held_copy clear), else clear."
out = "carry"

[[sym]]
at = "21:8A36"
name = "pad_down_released"
desc = "Carry set when Down is not held (bit 2 of pad1_held_copy clear), else clear."
out = "carry"

[[sym]]
at = "21:8ADE"
name = "pad_ab_new"
desc = "Carry set when A or B is newly pressed (pad1_new_copy & $C0), else clear."
out = "carry"

[[sym]]
at = "21:8A4A"
name = "pad_idle_slow"
desc = "Carry set when neither Left nor Right is held and kirby_speed_above answers carry clear for $014C (the speed is negative or at most $014C). Carry clear otherwise."
out = "carry"

[[sym]]
at = "21:8B1A"
name = "pad_side_free"
desc = """With Left held: probe_left from Kirby's position at (-8, -6); carry set when there is no wall in reach or the distance is negative, carry clear when it is 0 or positive. Otherwise, with Right held: probe_right at (8, -6); carry set when there is no wall in reach or the distance is positive, clear when it is 0 or negative. With neither held: carry clear. So carry set = the held side is free."""
out = "carry"

[[sym]]
at = "21:8A86"
name = "pad_double_tap"
desc = """The double tap of a direction, with tap_timer. (With bit 6 of kirby_flags set it takes another path that never ran.) Neither Left nor Right held: a timer that is not negative counts up, and becomes $FF when it reaches 16; carry clear. One held (Left wins): the timer becomes 0; carry set when it was 1-15 and the held direction is the one Kirby faces (Left with bit 7 of kirby_facing set, Right with it clear), else carry clear."""
out = "carry set: a direction was pressed again within 15 frames of its release"

[[sym]]
at = "21:8A6C"
name = "kirby_speed_zero"
desc = "Carry set when kirby_speed is 0, else clear."
out = "carry"

[[sym]]
at = "21:8A23"
name = "kirby_slow_stop"
desc = "With kirby_speed below $00C0 (as an unsigned 16-bit number, so not negative): kirby_vx_zero and carry set. Otherwise carry clear."
out = "carry set: he was stopped"

[[sym]]
at = "21:88C1"
name = "kirby_falling"
desc = "Carry set when kirby_vy is not negative, clear when it is (he rises)."
out = "carry"

[[sym]]
at = "21:8874"
name = "kirby_gravity_water"
desc = "kirby_gravity with profile fall_profile[0] (0), or fall_profile[1] (2) when kirby_in_water is nonzero."

[[sym]]
at = "21:88B0"
name = "kirby_gravity_hold"
desc = "kirby_gravity with profile hold_profile[0] (1), or hold_profile[1] (8) while A or Up is held."

[[sym]]
at = "21:8049"
name = "kirby_air_step"
desc = "A whole frame of a simple state: kirby_brake, kirby_gravity_water, kirby_step_from_speed, kirby_walls_stop, kirby_floor_stop, then a jump to kirby_ceiling_stop, whose carry it returns."

[[sym]]
at = "21:987D"
name = "kirby_stop"
desc = "kirby_vx_zero, then a jump to kirby_vy_zero: Kirby's own velocities, kirby_speed and both velocities of slot 1 become 0."

[[sym]]
at = "21:98CC"
name = "vx_index"
desc = "X = 1 when the X velocity of slot 1 is negative (high byte), else 0."
out = "X = 0 right, 1 left"

[[sym]]
at = "21:9C72"
kind = "part"
name = "kirby_rect_set"
desc = """Fills kirby_rect (unit kblocks) from a record of seven bytes at Y:A, and stores X in $0508. Byte 0 goes to kirby_rect+0; bytes 1-2 (16 bits) plus the world X of slot 1 to +1/+2; bytes 3-4 plus the world Y to +3/+4; bytes 5 and 6 to +5 and +6."""
in = "A = low byte, Y = high byte of the record's address; X = the value for $0508"

# ------------------------------------------------------------------ data

[[data]]
at = "21:8CFF"
len = 239
name = "kirby_script_lo"
format = "rows:16"
desc = "By script number 0-$EE: low byte of the address of one of Kirby's scripts. Read by kirby_script_set."

[[data]]
at = "21:8DEE"
len = 239
name = "kirby_script_hi"
format = "rows:16"
desc = "High bytes of kirby_script_lo's addresses ($A0-$BF: the scripts sit at $A000)."

[[data]]
at = "21:8EDD"
len = 239
name = "kirby_script_bank"
format = "rows:16"
desc = "The bank of each of Kirby's scripts ($14-$19)."

[[data]]
at = "21:80BC"
len = 2
name = "kirby_body_dy"
format = "bytes"
desc = "What kirby_upkeep adds to Kirby's world Y for $0509/$050A: 0, and 6 when kirby_action is 6."

[[data]]
at = "21:80BE"
len = 2
name = "kirby_body_half"
format = "bytes"
desc = "What kirby_upkeep stores in $050B: 4, and 1 when kirby_action is 6."

[[data]]
at = "21:8002"
len = 1
name = "facing_pad_back"
format = "bytes"
desc = "$01 (Right): the byte after facing_pad, which pad_back_held reads as facing_pad[2] when Kirby faces left."

[[data]]
at = "21:8C2D"
len = 2
name = "wall_bump_kind"
format = "bytes"
desc = "By vx_index: the bump_kind of a wall, 1 (X velocity to the right) and 3 (to the left)."

[[data]]
at = "21:8881"
len = 2
name = "fall_profile"
format = "bytes"
desc = "kirby_gravity_water's profiles of kirby_gravity: 0, and 2 in water."

[[data]]
at = "21:88BF"
len = 2
name = "hold_profile"
format = "bytes"
desc = "kirby_gravity_hold's profiles of kirby_gravity: 1, and 8 while A or Up is held."

[[data]]
at = "21:9CD0"
len = 12
name = "kirby_pal_tab"
format = "rows:4"
desc = "Three rows of four palette bytes for palette entries 16-19 ($FF = entry 16 is left alone): Kirby without an ability ($35 $25 $0F), with ability $0C or $0D ($30 $21 $01), with any other ability ($36 $26 $0F)."

# ------------------------------------------------------------------ RAM

[[ram]]
at = "05F9"
name = "kirby_hurt_timer"
desc = "A countdown that runs after Kirby was hurt: kirby_upkeep decrements it once per frame while it is 1-$7F and makes kirby_blink from its bit 2; kirby_spike_test (and, in unit hit, the touch of an object) does not hurt Kirby while it is not 0. Values of $80 and more are not counted down; the scripts store those."

[[ram]]
at = "05F2"
name = "kirby_blink"
desc = "Nonzero = kirby_draw (unit draw) draws Kirby with palette 1. kirby_upkeep stores bit 2 of kirby_hurt_timer here every frame (4 or 0); the hook 21:9B6C stores bit 1 of obj_frame after it."

[[ram]]
at = "05EE"
len = 2
name = "kirby_hook"
desc = "The address of a routine that kirby_upkeep runs every frame (kirby_hook_run); a high byte of 0 = none. Set by kirby_hook_set from a script; the hooks clear the high byte themselves when they are done."

[[ram]]
at = "05E1"
name = "kirby_action"
desc = "A number the scripts of Kirby store (set_mem8) for the state he is in. This unit compares it: 6 selects the second entry of kirby_body_dy / kirby_body_half, 9 stops land_bump_set (and is what 3F:E2C4 looks for), 4 keeps the hook 21:9B6C alive."

[[ram]]
at = "05E4"
name = "bump_kind"
desc = "$FF, or the number of a bump that waits: 0 ceiling (kirby_ceiling_bump), 1 / 3 wall with the X velocity to the right / left (wall_bump_set), 2 floor (land_bump_set). The script at 21:8003 sets it back to $FF."

[[ram]]
at = "05ED"
name = "floor_index_prev"
desc = "The floor_kind_index (0-4) that floor_kind_changed, 21:9B96 or 21:9BAA saw last."

[[ram]]
at = "05BF"
name = "tap_timer"
desc = "pad_double_tap's timer: 0 while Left or Right is held, 1-15 = frames since the release, $FF = too long ago."

[[ram]]
at = "05E3"
name = "kirby_ability"
desc = "Kirby's copy ability, $FF = none. pad_select_drop and kirby_hp_sub set it to $FF and pass the old value to the object of type 5 they create; kirby_pal_set picks his colours by it."

# ------------------------------------------------------------------ the model

[[model]]
name = "khelp_model"
code = '''
def h16(d, lo):
    return d[lo] | d[lo + 1] << 8

def hs8(v):
    return v - 256 if v & 0x80 else v

def outside(writes):
    return {w for w in writes if w >= 0x200 or w < 0x100}

def shapes(romrd):
    return [v & 0x1F for o, v in sorted(romrd.items()) if O('prop_shape') <= o < O('prop_shape') + 127]

def script_set(rd, wr, romrd, k):
    # what kirby_script_set leaves for script k: the object's one thread at the table's address and bank
    o = rd[0x6E]
    t = wr.get(0x614C + o)
    e = (romrd.get(O('kirby_script_lo') + k), romrd.get(O('kirby_script_hi') + k), romrd.get(O('kirby_script_bank') + k))
    return t is not None and None not in e and (wr.get(0x6380 + t), wr.get(0x63A0 + t), wr.get(0x63C0 + t)) == e and wr.get(0x6031) == e[2]

def upkeep(rd, wr, romrd, hp):
    t = rd[0x5F9]
    dec = 0 < t < 0x80
    t2 = t - 1 if dec else t
    if (0x5F9 in wr) != dec or (dec and wr[0x5F9] != t2):
        return 'timer'
    hook = (rd[0x5EF], rd.get(0x5EE), rd[0x5E1]) == (0x9B, 0x6C, 4)
    if wr[0x5F2] != (rd[0x603D] & 2 if hook else t2 & 4):
        return 'blink'
    i = 1 if rd[0x5E1] == 6 else 0
    wy = rd[0x6099] | rd[0x60AB] << 8
    if h16(wr, 0x509) != (wy + romrd[O('kirby_body_dy') + i]) & 0xFFFF or wr[0x50B] != romrd[O('kirby_body_half') + i]:
        return 'box'
    if hp >= 0x80:
        return 'ok' if script_set(rd, wr, romrd, 0xEE) else 'dead'
    return 'script' if O('kirby_script_bank') + 0xEE in romrd else 'ok'

def sucking(rd):
    # 3F:E2C4 answers carry set
    return rd[0x5E1] == 9 and bool(rd.get(0x5E6) or rd.get(0x5E5))

def tap(rd):
    # pad_double_tap -> carry, tap_timer written (None: not written)
    t = rd[0x5BF]
    d = 1 if rd[0xE6] & 2 else 0 if rd[0xE6] & 1 else -1
    if d < 0:
        if t >= 0x80:
            return 0, None
        return 0, (0xFF if t + 1 >= 0x10 else t + 1)
    return (1 if 0 < t < 0x80 and d == rd[0x61DD] >> 7 else 0), 0

def wall_bump(rd):
    # wall_bump_set -> bump_kind written, or None
    return (3 if rd[0x60F3] & 0x80 else 1) if h16(rd, 0x5BB) >= 0xB3 else None

def sp(rd):
    # kirby_speed as a test read it: the low byte is not read when the high byte decides
    return rd.get(0x5BB, 0) | rd[0x5BC] << 8

def seq(calls, names):
    return [c for c in calls if c in names] == names
'''

