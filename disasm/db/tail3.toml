# ----------------------------------------------------------------- claims: the digging boss's tables

[[model]]
name = "tail3_e46"
code = '''
E46_TURN_LEGS = [2, 6, 0x0A, 0x0E, 0x12, 0x16, 0x1A, 0x1F, 0x24, 0x29]
E46_YDIR_ROWS = [6, 0x0C]
E46_YDIR_BY_SIDE = [2, 0, 1, 2]
E46_CHOICE_MASKS = [1, 1, 1, 3]
E46_CHOICE_WEIGHTS = [0xC0, 0x3F, 0, 0, 0x60, 0x40, 0x40, 0x1F, 0x40, 0x20, 0x20, 0x7F]
E46_CHOICE_SKIP = [0, 0x3F, 0, 0, 0, 0x40, 0x40, 0x1F, 0, 0x20, 0x20, 0x7F]

def e46_choose_model(v787, r):
    """(choice, A) of e46_choose for $0787 = v787 and the random number r."""
    ph, last = v787 & 0x0F, v787 >> 4
    excl = 4 * ph + last if last else 0xFF
    s, y = 0, 4 * ph
    while y < 4 * ph + 3:
        if y != excl:
            s = (s + E46_CHOICE_WEIGHTS[y]) & 0xFF
            if s >= r:
                break
        y += 1
    c = y & 3
    return c, 2 * c + (r & E46_CHOICE_MASKS[c])
'''

[[claim]]
id = "tail3.e46.tables"
about = ["e46_turn_legs", "e46_ydir_rows", "e46_ydir_by_side", "e46_choice_masks", "e46_choice_weights", "e46_choice_skip"]
text = "The six tables hold the literals of the model; the weights of each phase add up to $FF and e46_choice_skip is e46_choice_weights with the entries of choice 0 at 0."
kind = "static"
use = ["tail3_e46"]
expect = "[u8(O('e46_turn_legs') + i) for i in range(10)] == E46_TURN_LEGS and [u8(O('e46_ydir_rows') + i) for i in range(2)] == E46_YDIR_ROWS and [u8(O('e46_ydir_by_side') + i) for i in range(4)] == E46_YDIR_BY_SIDE and [u8(O('e46_choice_masks') + i) for i in range(4)] == E46_CHOICE_MASKS and [u8(O('e46_choice_weights') + i) for i in range(12)] == E46_CHOICE_WEIGHTS and [u8(O('e46_choice_skip') + i) for i in range(12)] == E46_CHOICE_SKIP and all(sum(E46_CHOICE_WEIGHTS[4 * p:4 * p + 4]) == 0xFF for p in range(3)) and all(E46_CHOICE_SKIP[i] == (0 if i % 4 == 0 else E46_CHOICE_WEIGHTS[i]) for i in range(12))"

[[claim]]
id = "tail3.e46.choose"
about = ["e46_choose", "e46_choice_weights", "e46_choice_skip", "e46_choice_masks"]
text = "e46_choose asks random for a number below $FF - e46_choice_skip[4 x phase + last choice] (the number it stores in $02), sums e46_choice_weights of the phase (leaving out the last choice when it is not 0) until the sum reaches that number, puts the choice into the high nibble of $0787 and returns 2 x choice + (the number & e46_choice_masks[choice]); the choices 0 and 1 happen."
kind = "call"
fn = "e46_choose"
on = ["main@81345+20", "cov2-abilities-mole@81355+3000", "cov2-save-finished@147060+20"]
min_calls = 8
use = ["tail3_e46"]
expect = "O('e46_choice_skip') + 4 * (rd[0x787] & 0x0F) + (rd[0x787] >> 4) in romrd and wr[0x02] < 0xFF - E46_CHOICE_SKIP[4 * (rd[0x787] & 0x0F) + (rd[0x787] >> 4)] and wr[0x787] == (rd[0x787] & 0x0F) | e46_choose_model(rd[0x787], wr[0x02])[0] << 4 and ra == e46_choose_model(rd[0x787], wr[0x02])[1]"
cases = { "wr[0x787] >> 4 == 0" = 6, "wr[0x787] >> 4 == 1" = 1 }

[[claim]]
id = "tail3.e46.turn_legs"
about = ["e46_turn_legs", "e46_leg_turn"]
text = "e46_leg_turn reads one entry of e46_turn_legs, 2 x the new choice (high nibble of $0787) or one more, and $0786 = the entry; when the call goes on into e46_leg (the jmp at its end), $0786 ends one higher and the first byte of e46_legs read is the one at that place; the entries 0, 1 and 2 happen."
kind = "call"
fn = "e46_leg_turn"
on = ["main@81345+20", "cov2-abilities-mole@81355+3000", "cov2-save-finished@147060+20"]
min_calls = 8
use = ["tail3_e46"]
model = '''
def tl_idx(romrd):
    return [o - O('e46_turn_legs') for o in romrd if O('e46_turn_legs') <= o < O('e46_turn_legs') + 10]
def tl_legs_ok(romrd, v786, t):
    legs = [o - O('e46_legs') for o in romrd if O('e46_legs') <= o < O('e46_legs') + 64]
    return (legs == [] and v786 == t) or (legs[:1] == [t + 1] and v786 == t + 1)
'''
expect = "len(tl_idx(romrd)) == 1 and tl_idx(romrd)[0] >> 1 == mem(0x787) >> 4 and tl_legs_ok(romrd, wr[0x786], E46_TURN_LEGS[tl_idx(romrd)[0]])"
cases = { "tl_idx(romrd) == [0]" = 4, "tl_idx(romrd) == [1]" = 2, "tl_idx(romrd) == [2]" = 1, "O('e46_legs') + wr[0x786] in romrd" = 1, "O('e46_legs') + wr[0x786] not in romrd" = 1 }

[[claim]]
id = "tail3.e46.ydir"
about = ["e46_ydir_rows", "e46_ydir_by_side", "e46_leg_y_go"]
text = "e46_leg_y_go reads e46_ydir_by_side at the side answer s; the direction d is that entry, or a random number below 2 when it is 2; it reads e46_ydir_rows[d] and sets the X and Y velocity words of e46_leg_vx / e46_leg_vy at 2 x phase + e46_ydir_rows[d]; the answers 0 (random) and 1 (down) happen."
kind = "call"
fn = "e46_leg_y_go"
on = ["main@81345+20", "cov2-abilities-mole@81355+3000", "cov2-save-finished@147060+20"]
min_calls = 7
use = ["tail3_e46"]
model = '''
def yd(romrd, base, n):
    return [o - O(base) for o in romrd if O(base) <= o < O(base) + n]
def yd_vel(romrd, wr, x, i):
    vx = romrd[O('e46_leg_vx') + i] | romrd[O('e46_leg_vx') + i + 1] << 8
    vy = romrd[O('e46_leg_vy') + i] | romrd[O('e46_leg_vy') + i + 1] << 8
    return (wr[0x60E0 + x] | wr[0x60F2 + x] << 8, wr[0x6104 + x] | wr[0x6116 + x] << 8) == (vx, vy)
'''
expect = "len(yd(romrd, 'e46_ydir_by_side', 4)) == 1 and len(yd(romrd, 'e46_ydir_rows', 2)) == 1 and (E46_YDIR_BY_SIDE[yd(romrd, 'e46_ydir_by_side', 4)[0]] == 2 or yd(romrd, 'e46_ydir_rows', 2)[0] == E46_YDIR_BY_SIDE[yd(romrd, 'e46_ydir_by_side', 4)[0]]) and yd_vel(romrd, wr, x, 2 * (rd[0x787] & 0x0F) + E46_YDIR_ROWS[yd(romrd, 'e46_ydir_rows', 2)[0]])"
cases = { "yd(romrd, 'e46_ydir_by_side', 4) == [0]" = 5, "yd(romrd, 'e46_ydir_by_side', 4) == [1]" = 2 }
