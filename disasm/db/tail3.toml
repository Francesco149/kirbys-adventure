desc = """Exhibit $0C of e0a_start: the pose table 32:8526 (type $23, the light blue blob of unit en2b), then
(25:BD36) asm_pose_dir with 4 (obj_pose_dir: the pose 4 of its direction) for $20 frames, the pose + 2 for $20 frames,
for ever (cov2-abilities-hub5@68326: the blob on the left pedestal under the sign STONE; Kirby inhales it at 68413)."""

# ================================================================== the digging boss's tables (bank 2C)

[[data]]
at = "2C:B237"
len = 10
name = "e46_turn_legs"
format = "bytes"
desc = """For e46_leg_turn (unit en2c), by the answer of e46_choose (2 x choice + a random bit for the choices that
have one): the place in e46_legs where the next leg starts, into $0786: 2, 6, $0A, $0E, $12, $16, $1A, $1F, $24, $29.
Read were the entries 0, 1 and 2."""

[[data]]
at = "2C:B2A2"
len = 2
name = "e46_ydir_rows"
format = "bytes"
desc = """For e46_leg_y_go (unit en2c), by the direction 0 / 1: the offset added to 2 x phase to index the word pairs
of e46_leg_vx / e46_leg_vy: 6 (Y velocity $0040, $0060, $00A0 by phase: down) and $0C (-$0040 ...: up)."""

[[data]]
at = "2C:B2A4"
len = 4
name = "e46_ydir_by_side"
format = "bytes"
desc = """For e46_leg_y_go (unit en2c), by the answer of e46_side_test (0-2): the direction, 2 for a random one below 2
(answer 0: the body is inside the earth band), 0 (answer 1), 1 (answer 2, never). The fourth byte, $02, is past the
answers e46_side_test gives."""

[[data]]
at = "2C:B3AA"
len = 4
name = "e46_choice_masks"
format = "bytes"
desc = """For e46_choose (unit en2c), by the choice: the mask of the random number added to 2 x choice: 1, 1, 1, 3.
Read were the entries 0 and 1."""

[[data]]
at = "2C:B3AE"
len = 12
name = "e46_choice_weights"
format = "rows:4"
desc = """For e46_choose, by 4 x phase + choice: the weights of the four choices, each phase's adding up to $FF:
phase 0 $C0, $3F, 0, 0; phase 1 $60, $40, $40, $1F; phase 2 $40, $20, $20, $7F. The last choice is what is left
when the sum of the others stays below the random number; it is not read."""

[[data]]
at = "2C:B3BA"
len = 12
name = "e46_choice_skip"
format = "rows:4"
desc = """For e46_choose, by 4 x phase + the last choice: the weight left out of the draw, subtracted from $FF for the
bound of random: the choice's own weight from e46_choice_weights, 0 for choice 0 (which is never left out). Read
was entry 0 only."""

