unit = "tail3"
title = "The third tail: two exhibits of the museum (bank 25) and the digging boss's choice tables (bank 2C)"
summary = """
The last pieces that ran and were undocumented, each named in the style of the unit that documents its neighbours
and claimed here.

Type $0A (e0a_start, unit en25b and scr_obj): the enemy on show in a museum room, whose jump table sends exhibit n
to one of 16 short scripts. Two more of them ran in the second batch of movies, both in the museum room of
cov2-abilities-hub5 (from frame 68326; the signs STONE on the left and TORNADO on the right): exhibit $0C
(e0a_exhibit_c, slot 11, the pose table 32:8526 of type $23, the light blue blob of unit en2b: asm_pose_dir 4 and
the pose + 2, $20 frames each), which Kirby inhales at 68413 for the inhale number $10 of e0a_abilities, and exhibit 9
(e0a_exhibit_9, slot 14, the pose table 32:84CE of type $24, the saucer of unit en2b: the poses 0, 1, 2, 3, 8 frames
each, for ever; 41 rounds until the room changes at 69732).

The digging boss (type $46, unit en2c): the tables of e46_leg_turn, e46_choose and e46_leg_y_go. e46_choose draws
one of four choices by weights per phase (e46_choice_weights; the weights of a phase add up to $FF), leaving out the
last choice (high nibble of $0787) unless it was 0: the random bound is $FF less e46_choice_skip[4 x phase + last],
which is that choice's weight (0 for choice 0). A = 2 x choice + (random & e46_choice_masks[choice]) indexes
e46_turn_legs, the place in e46_legs where the next leg starts ($0786). e46_leg_y_go turns the answer of e46_side_test
into a direction (e46_ydir_by_side: 0 a random one of the two, 1 down, 2 up) and the direction into the offset of the
velocity pair in e46_leg_vx / e46_leg_vy (e46_ydir_rows: 6, the words $0040, $0060, $00A0 by phase; $0C, the words
-$0040 ...).

Open:
- e46_choose's exclusion (last choice not 0, 2C:B36A) never ran: every call had the high nibble of $0787 = 0, so
  e46_choice_skip was read only at entries 0 of phase 0. The choices 3 (mask 3) and the entries 3-9 of e46_turn_legs
  were not read; e46_ydir_by_side[2] (side answer 2) never.
- The fourth byte of e46_ydir_by_side (2C:B2A7, $02) lies past the answers 0-2 of e46_side_test and is not read.
- What the signs' words mean for the inhale numbers ($10 STONE) is from the picture; the inhale number of exhibit 9
  ($12) was not seen in Kirby's mouth.
"""

# ================================================================== type $0A: two exhibits (bank 25)

