desc = """Exhibit 9 of e0a_start: the pose table 32:84CE (type $24, the saucer of unit en2b), then the poses 0, 1, 2, 3,
8 frames each (25:BD14), for ever (cov2-abilities-hub5@68326: the thing on the right pedestal under the sign
TORNADO)."""

[[script]]
