def star_block(rd, romrd):
    col = rd[0x4B]
    if col >= 0x80 or col >= rd[0x67EE]:
        return None
    y16 = rd[0x4C] << 8 | rd[0x12]
    if y16 >= 0x6000:
        return None
    cell = col + (y16 // 192) * rd[0x67EE]
    if cell >= rd[0x67ED]:
        return None
    idx = ((y16 % 192) & 0xF0) | (rd[0x11] >> 4)
    sc = rd[0x67F6 + cell]
    a = (romrd[O('screen_lo') + sc] | romrd[O('screen_hi') + sc] << 8) + idx
    b = rd[a]
    if rd[0x7F00 + b] in (0x1C, 0x4C, 0x6F):
