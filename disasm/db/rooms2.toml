unit = "rooms2"
title = "The hub's map by progress, the tower rooms, the pause screen and other room code of banks 13, 38 and 14"
summary = """Room code of bank 13 that the loader and the scroll call besides the steps of unit rooms, the pause screen of
bank 38, and small helpers of banks 14 and 16.

The hub's map. A hub (rooms 0-6) is unpacked whole; hub_map_build (from room_place) turns it into two pictures of
progress. hub_map_blank moves the 8 screens of the hub to the screens 8-15 of room_map and fills the screens 0-7 with
a blank checkerboard (hub_blank_blocks); hub_open_all copies back the parts that a progress opens: part 0 always,
part 1-7 by bit 0-6 of stages_done[world], part 8-14 by bits of the byte $0529 + world. Each part is a list of
rectangles in bank 12 (hub_open_lo / hub_open_hi by world * 16 + part, hub_open_recs; hub_open_list, hub_open_rect). Done
for the progress as it is, then (blank again) for the progress as the hub last showed it (hub_shown_done,
hub_shown_29, hub_shown_clear, which then take the present values), the screens 8-15 hold the hub as it is now and
the screens 0-7 as it was; reveal_step = 0 when they differ, and room_tick (unit roomtick) reveals the difference.
hub_bits_init makes the doors' state from the shown rows; world_flag_bits and hub_progress_new are made for door_find,
room_tick and a script. Seen at main@2629: after 1-1 the part behind door 1 is the news.

The tower rooms ($00CD, $00D4, $00DF, $00E6, scroll_mode 2-5, main@30069): tower_scroll replaces the ordinary scroll:
scroll_x follows cam_x at 1/8 (plus tower_x_off), the tower's CHR banks change with cam_x, and at the end of the
tower the camera is locked, an object appears and three blocks open the way out (tower_end_tab); scroll_mode 6.

bg_cycle: in rooms with palette $0D the background palettes $80-$83 take turns every 8 frames while bg_cycle_on.
inhale_star_block: the inhale (3F:EBBE) pulls blocks of property $1C, $4C, $6F out of the map and makes them an object.
room_return_save keeps the destination of a door whose kind loads another room first. screen_redraw draws the
screen again after the pause.

The pause screen (cov-pause@17043): the scripts 38:AFC9 / 38:AFCD (fade out, bg_cycle_on = 0, others_hide, display
off, pause_open, display on, fade in, pause_wait) and 38:B01C (fade out, pause_close, screen_redraw through 3F:E625,
others_show, bg_cycle_on = 1, fade in). pause_open keeps scroll_mode, split_mode, room_tick_on, chr_bank and the
palette at $0120-$0148 and shows a picture (two packed streams of bank 38) and the text of Kirby's ability
(pause_desc_lo / hi); scroll_mode 7, split_mode 4. pause_wait ends it on A, B or Start.

Bank 14: the small tests of Kirby's start script kirby_s_start (room_is_hub, room_is_hub_if, room_is_goal,
hp_low_test), enemies_freeze, the fade loop step fade_zero_step, kirby_bit6_clear. Bank 16: kfx_sparkle_place (effect
$1E) and the rts kfx_laser_tick_end.

Open:
- Parts 8-14 of hub_open_all never opened anything ($0529 was 0 at every hub load); the byte $0529 + world (written by
  3D:BD96) and stages_clear bit 6 have no meaning here. hub_open_recs is taken as 300 bytes up to 12:9E8A; the 8 bytes
  before room_extras are not claimed. What a world flag (world_flag_done / world_flag_29) stands for in the game, and
  door kind $D, are not known; $014C is written only.
- tower_scroll: the carry into scroll_x + 1 never ran; what the object of 3F:F07D at the tower's end is, and the meaning
  of the blocks $50 / $58, are not established. scroll_mode 6 is read by nothing specific. screen_redraw in a tower
  room (cam_x = scroll_x) and its carry into $10 never ran.
- inhale_star_block with an ability held (spawn_vars 5) never ran; the meaning of bit 6 of $05E9 is not known.
- The pause: the path for a stage cleared before (pause_exit_test X = 1: split_mode 0 and the script at 38:AFF4, the
  CONTINUE / EXIT STAGE box ending in leave code 6) ran once, in cov4-d-pause@3010, and is described by unit scn_cov4
  (pause_exit_box, pause_exit_tick, pause_exit_stage); its Select toggle never ran. split_mode 4 is not described by
  unit video. The PPU records 38:B2E6 and 38:B303 lie inside or next to
  the streams of unit unpack and are named by address only; the streams 38:B1FF / 38:B30A / 38:B492 / 38:B7C3 /
  38:B89D are not renamed (unit unpack). Only entries 0, 8 and 10 of pause_desc_lo / hi were read. The bytes at
  $0120-$0148 are shared with the line buffer and puff_timer and have no name. The scripts 38:AFC9, 38:AFCD, 38:B01C
  are described here but not entered as scripts.
- 3E:C082 / 3E:C086 (display off / on, from the pause scripts) are not named here.
- Bank 14 not documented (Kirby's states, units kst14 / kst14b list them): 14:A4C3 (87 runs, the routine of hurt
  reaction 2), 14:B222 / 14:B238 / 14:B218 (the water spit, 34 / 34 / 8 runs), 14:A58A / 14:A595 (21 runs), 14:A2F2
  (10), 14:A331 (3), 14:A715 (1).
- Bank 15 not documented (the Sword and Parasol states that unit kst15 lists as run but not documented): 15:B46E,
  15:B5C3, 15:A5ED, 15:A622, 15:B4AD, 15:A0AD, 15:B500, 15:A413, 15:A47E, 15:ACB9, 15:AE1D, 15:B2EA, 15:AA25, 15:A587,
  15:A5C6, 15:A2A7, 15:AEB9, 15:AA6C (2-72 runs each).
- Bank 16 not documented (effects and shots that unit kfx lists): 16:B011, 16:B01E (effect $0F), 16:B59F, 16:B5C8,
  16:B5BD (shot $01), 16:B083 (effect $11), 16:B91F, 16:B8EE, 16:BA73 (shot $0B), 16:AF54 (effect $0D), 16:B25F
  (effect $17), 16:A9DC (the grab's caught object, unit kst18), 16:B304 (effect $1B), 16:ABA3, 16:ABD0 (effect $1F),
  16:B23C, 16:B21D (effect $1C)."""

# ------------------------------------------------------------------ the hub's map

[[sym]]
at = "13:ABD2"
name = "hub_map_build"
desc = """Builds a hub's map from the world's progress; called by room_place for rooms 0-6 after the room's stream is unpacked (bank 12 at $8000, the full hub in the screens 0-7 of room_map). world_flag_bits = the worlds whose flag (world_flag_done / world_flag_29) is set; hub_progress_new = 1 when stages_done[world] differs from hub_shown_done[world]; hub_bits_init; hub_anim_init (38:A776, far call). Then the map twice: hub_map_blank (the full hub moves to the screens 8-15, the screens 0-7 become blank) and hub_open_all with stages_done[world] and $0529[world] copies the parts the progress opens back; hub_map_blank again (that picture moves to the screens 8-15: the hub as it is now) and hub_open_all with hub_shown_done[world] and hub_shown_29[world] (the screens 0-7: the hub as it was shown last). Last, for all eight worlds the shown rows take the values of stages_done, $0529 and stages_clear; reveal_step = 0 (start a reveal) when any of them changed (for stages_clear only bit 6 counts), else $FF; door_open_step = 0, reveal_hold = 1, the 24 puff_timer bytes $FF, $014C = 1 (no reader in the corpus). room_tick (unit roomtick) then reveals the difference between the two copies around reveal_x / reveal_y once a script clears reveal_hold."""
comments = { "ABD6" = "world_flag_bits", "ABF1" = "hub_progress_new", "AC0B" = "the hub as it is now", "AC1E" = "the hub as it was shown", "AC31" = "copy the progress to the shown rows", "AC63" = "a reveal when something changed" }

[[sym]]
at = "13:AD9A"
name = "hub_bits_init"
desc = """hub_stage_bits = hub_shown_done[world], hub_flags = hub_shown_clear[world], hub_shut_bits = (hub_shown_29[world] | hub_shut_init[world]) & hub_shown_done[world]: the hub's door state as it was shown last."""

[[sym]]
at = "13:AD5A"
name = "hub_map_blank"
desc = """For the screens 7 down to 0 of room_map: every byte is copied to the same place 8 screens further on (1,536 bytes on), and the screen is filled with the pattern of hub_blank_blocks: block hub_blank_blocks[(index & 1) | ((index & $10) >> 3)], a checkerboard of 2 x 2 blocks."""

[[sym]]
at = "13:AC80"
name = "hub_open_all"
desc = """Opens the parts of the hub that a progress shows: hub_open_list for X = 0-14 with $00 = world * 16. Part 0 always; part 1-7 when bit X - 1 of $0A is set; part 8-14 when bit X - 8 of $0B is set."""
in = "$0A = a byte of stages_done (bits for parts 1-7), $0B = a byte of the row at $0529 (bits for parts 8-14)"

[[sym]]
at = "13:AC94"
name = "hub_open_list"
desc = """Part X of the hub of world $00 / 16: when its bit in $0A / $0B is set (always for X = 0, see hub_open_all), the list at hub_open_lo / hub_open_hi[$00 | X] (none when the high byte is 0) is run: hub_open_rect for each 4-byte record, up to and including the first whose byte 0 has bit 7 set. X is preserved."""
in = "X = part 0-14, $00 = world * 16, $0A / $0B"

[[sym]]
at = "13:ACD5"
name = "hub_open_rect"
desc = """Copies a rectangle of blocks from the hub's second copy (the screens 8-15 of room_map) into the first (screens 0-7). The record at ($1A): byte 0 & $7F = the screen, byte 1 = the block of its top left corner (row * 16 + column), byte 2 = the width and byte 3 = the height in blocks. A row that runs past column 15 continues in the next screen of room_map (192 bytes on); a rectangle that runs past row 11 continues in row 0 of screen + room_width."""
in = "($1A) = the record"
out = "$02, $10-$12, $16-$19 used"

[[data]]
at = "13:AD96"
len = 4
name = "hub_blank_blocks"
format = "bytes"
desc = "The blocks hub_map_blank fills a screen with: $F8, $F9 on even rows, $F9, $F8 on odd rows (by bit 0 of the column and bit 0 of the row)."

[[data]]
at = "13:ADB6"
len = 7
name = "hub_shut_init"
format = "bytes"
desc = "Per world: bits ORed into hub_shown_29[world] by hub_bits_init before the AND with hub_shown_done[world] that makes hub_shut_bits (the same bytes as hub_shut_mask of unit kst15: $7F, $7F, $5E, $5A, $46, $40, $5E)."

[[data]]
at = "13:ADBD"
len = 7
name = "world_flag_done"
format = "bytes"
desc = "Per world 0-6: the bit of stages_done[world] that sets the world's bit in world_flag_bits: $08, $10, $20 for worlds 0-2, none for 3-6."

[[data]]
at = "13:ADC4"
len = 7
name = "world_flag_29"
format = "bytes"
desc = "Per world 0-6: the bit of the byte $0529 + world that sets the world's bit in world_flag_bits: none for worlds 0-2, $20 for 3-6. hub_map_build also reads the byte after it (13:ADCB, code) for world 7."

[[data]]
at = "12:9C7E"
len = 112
name = "hub_open_lo"
format = "rows:16"
desc = "Per world (16 bytes each) and part 0-14 of hub_open_all: low byte of the address of the part's list of hub_open_recs."

[[data]]
at = "12:9CEE"
len = 112
name = "hub_open_hi"
format = "rows:16"
desc = "Per world and part: high byte of the address of the part's list; 0 = the part has none."

[[data]]
at = "12:9D5E"
len = 300
name = "hub_open_recs"
format = "rows:4"
desc = "The rectangles of hub_open_rect, 4 bytes each: screen (bit 7: the last of its list), top left block (row * 16 + column), width, height."

[[ram]]
at = "07DC"
name = "world_flag_bits"
desc = "One bit per world 0-7, made by hub_map_build at every hub load: bit w is set when bit world_flag_done[w] of stages_done[w] or bit world_flag_29[w] of $0529 + w is set. door_find and room_tick (a door of kind $D) compare it with bit_mask[world]."

[[ram]]
at = "78D5"
name = "hub_progress_new"
desc = "1 when hub_map_build found stages_done[world] different from hub_shown_done[world] (the hub has news to show), else 0. Read by a script (load_reg)."

[[ram]]
at = "0539"
len = 8
name = "hub_shown_done"
desc = "Per world: stages_done as the hub showed it last. hub_map_build builds the old picture from it and then copies stages_done over it; hub_bits_init makes hub_stage_bits and hub_shut_bits from it."

[[ram]]
at = "0541"
len = 8
name = "hub_shown_29"
desc = "Per world: the byte at $0529 + world as the hub showed it last (the bits of the parts 8-14 of hub_open_all)."

[[ram]]
at = "0549"
len = 8
name = "hub_shown_clear"
desc = "Per world: stages_clear as the hub showed it last; hub_bits_init copies it to hub_flags."

# ------------------------------------------------------------------ models

[[model]]
name = "hub_model"
code = '''
HUB_FILL = [0xF8, 0xF9, 0xF9, 0xF8]

def hub_scr(romrd, n):
    return romrd[O('screen_lo') + n] | romrd[O('screen_hi') + n] << 8

class HubMem:
    def __init__(self, rd):
        self.rd = rd
        self.m = {}
    def get(self, a):
        return self.m[a] if a in self.m else self.rd[a]
    def put(self, a, v):
        self.m[a] = v & 0xFF

def hub_blank(mm, romrd):
    for x in range(7, -1, -1):
        s, d = hub_scr(romrd, x), hub_scr(romrd, x + 8)
        for y in range(192):
            mm.put(d + y, mm.get(s + y))
            mm.put(s + y, HUB_FILL[(y & 1) | ((y & 0x10) >> 3)])

def hub_rect(mm, romrd, rec, width):
    s, pos, w, h = rec[0] & 0x7F, rec[1], rec[2], rec[3]
    while True:
        dst = hub_scr(romrd, s) + (pos & 0xF0)
        src = hub_scr(romrd, s + 8) + (pos & 0xF0)
        y = pos & 0x0F
        for _ in range(w or 256):
            mm.put(dst + y, mm.get(src + y))
            y += 1
            if y == 16:
                y = 0
                dst += 0xC0
                src += 0xC0
        h = (h - 1) & 0xFF
        if h == 0:
            return
        pos += 0x10
        if pos >= 0xC0:
            pos &= 0x0F
            s += width

def hub_list(mm, romrd, world, x, width):
    i = (world << 4) | x
    lo = romrd[O('hub_open_lo') + i]
    hi = romrd[O('hub_open_hi') + i]
    if hi == 0:
        return 0
    p = lo | hi << 8
    off = O('hub_open_lo') - A('hub_open_lo')
    n = 0
    while True:
        rec = [romrd[off + p + k] for k in range(4)]
        hub_rect(mm, romrd, rec, width)
        n += 1
        if rec[0] & 0x80:
            return n
        p += 4

def hub_part_on(x, a, b):
    if x == 0:
        return True
    if x < 8:
        return bool(a & (1 << (x - 1)))
    return bool(b & (1 << (x - 8)))

def hub_all(mm, romrd, world, a, b, width):
    n = 0
    for x in range(15):
        if hub_part_on(x, a, b):
            n += hub_list(mm, romrd, world, x, width)
    return n
'''

[[model]]
name = "hub_build_model"
code = '''
def hub_build_ok(rd, wr, romrd):
    w = rd[0x558]
    f = 0
    for x in range(7, -1, -1):
        if rd[0x521 + x] & romrd[O('world_flag_done') + x] or rd[0x529 + x] & romrd[O('world_flag_29') + x]:
            f |= 1 << x
    ok = wr[0x7DC] == f and wr[0x78D5] == int(rd[0x521 + w] != rd[0x539 + w])
    ok = ok and wr[0x78D2] == rd[0x539 + w] and wr[0x78D4] == rd[0x549 + w]
    ok = ok and wr[0x78D3] == (rd[0x541 + w] | romrd[O('hub_shut_init') + w]) & rd[0x539 + w]
    mm = HubMem(rd)
    width = rd.get(0x67EE, 0)
    hub_blank(mm, romrd)
    hub_all(mm, romrd, w, rd[0x521 + w], rd[0x529 + w], width)
    hub_blank(mm, romrd)
    hub_all(mm, romrd, w, rd[0x539 + w], rd[0x541 + w], width)
    ok = ok and {k for k in wr if 0x68C8 <= k < 0x74C8} == set(mm.m)
    ok = ok and all(wr[k] == v for k, v in mm.m.items())
    changed = any(rd[0x521 + y] != rd[0x539 + y] or rd[0x529 + y] != rd[0x541 + y]
                  or (rd[0x531 + y] ^ rd[0x549 + y]) & 0x40 for y in range(8))
    ok = ok and wr[0x551] == (0 if changed else 0xFF) and wr[0x6620] == 0 and wr[0x552] == 1 and wr[0x14C] == 1
    ok = ok and all(wr[0x134 + i] == 0xFF for i in range(24))
    ok = ok and all(wr[0x539 + y] == rd[0x521 + y] and wr[0x541 + y] == rd[0x529 + y] and wr[0x549 + y] == rd[0x531 + y] for y in range(8))
    return ok
'''

