[[claim]]
id = "rooms2.pause.open"
about = ["pause_open", "pause_palette", "pause_split", "pause_desc_lo", "pause_desc_hi", "pause_recs"]
text = "The three calls of pause_open (cov-pause) write scroll_mode, split_mode, room_tick_on, chr_bank 0-5 and palette_base 0-31 as they were read to $0120, $0121, $0122, $0123-$0128, $0129-$0148; scroll_mode = 7, room_tick_on = 0, chr_bank + 2..5 = $DA, $DB, $DC, $3F, palette_base = pause_palette; unpack runs three times and reads the stream named by pause_desc_lo / hi[kirby_ability + 1]; ppu_record_inline runs five times; split_mode = pause_split[X] and A = X = 0 at the return. The three calls are with different abilities."
kind = "call"
fn = "pause_open"
on = ["cov-pause@17040+20", "cov-pause@17355+20", "cov-pause@17770+20"]
model = '''
def popen_ok(rd, wr, romrd, ran, calls, ra, rx):
    ok = wr[0x120] == rd[0x51E] and wr[0x121] == rd[0x180] and wr[0x122] == rd[0x6600]
    ok = ok and all(wr[0x123 + i] == rd[0x42 + i] for i in range(6))
    ok = ok and all(wr[0x129 + i] == rd[0x182 + i] for i in range(32))
    ok = ok and wr[0x51E] == 7 and wr[0x6600] == 0 and [wr[0x44 + i] for i in range(4)] == [0xDA, 0xDB, 0xDC, 0x3F]
    ok = ok and all(wr[0x182 + i] == romrd[O('pause_palette') + i] for i in range(32))
    k = (rd[0x5E3] + 1) & 0xFF
    t = romrd[O('pause_desc_lo') + k] | romrd[O('pause_desc_hi') + k] << 8
    off = O('pause_palette') - A('pause_palette')
    ok = ok and ran('3E:C43A') == 3 and (off + t) in romrd and calls.count('ppu_record_inline') == 5
    return ok and rx == ra == 0 and wr[0x180] == romrd[O('pause_split') + rx]
'''
expect = "popen_ok(rd, wr, romrd, ran, calls, ra, rx)"
cases = { "rd[0x5E3] == 0xFF" = 1, "rd[0x5E3] == 7" = 1, "rd[0x5E3] == 9" = 1 }
min_calls = 3

