def list_count(rd, romrd, x):
    if not hub_part_on(x, rd.get(0x0A, 0), rd.get(0x0B, 0)):
        return 0
    i = rd[0x00] | x
    hi = romrd[O('hub_open_hi') + i]
    if hi == 0:
        return 0
    p = romrd[O('hub_open_lo') + i] | hi << 8
    off = O('hub_open_lo') - A('hub_open_lo')
    n = 1
    while not romrd[off + p] & 0x80:
        p += 4
        n += 1
    return n
'''
