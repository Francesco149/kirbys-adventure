unit = "dead_kirby"
title = "Code and data no movie reaches in banks 00-21: Kirby's states and helpers"
summary = """
The bytes of banks 12-21 that no movie runs or reads, described from the ROM (every entry is `never = true`, or a
script the static decoder reached only from code that never ran).

The goal game's debug row picker (19:A103, goal_debug_start, goal_debug_row): after the jump table on the row
(19:A0F3) the ROM has a loop no table entry leads to. Each frame it tests the pad: Start ends the game
(goal_k_end), A and B step the row (kirby_facing, 0-6, wrapping) up and down, Select lands Kirby again
(goal_k_land + 4) so that the dance and the score of the chosen row follow. Patched into the jump table it works:
the row picked by the pad is the row that pays.

A second slope table (slope2_vx_lo / slope2_vx_hi, 21:816F, 512 bytes): 16 * n * 2 / sqrt(5) for the signed index n,
the speed along a slope of 1 in 2, beside the 16 * n / sqrt(2) of slope_vx_lo / hi that kirby_vx_apply uses on the
45-degree floor. No instruction reads it; pointed at it, kirby_vx_apply takes Kirby faster up the 45-degree slope.

The Star Rod's states that no room lets it reach: scripts $86 (the bounce after a dive broke a block), $88 (down
through a thin floor), $8B (a ladder), $8F / $90 (full of air in water), $92-$96 (water: in, stand, walk, swim, out).
Each is the Hammer's state of the same place in its family, byte for byte except the poses, the script numbers and the
addresses; the dive bounce's routine is kirby_st_rod_fall with kirby_falling in place of bump_pending. The rod is
held only in the last fight (rooms 15 and 16), and neither room holds a thin floor, a ladder or water; pointed at by
the Hammer's ladder entry, the rod's ladder state climbs the ladder exactly as the Hammer's does. The same
drop-through states of the Sword ($6C), the Hammer ($A3) and the Parasol ($C1, with para_rect), and the Parasol's
dive bounce ($BF), ran in the ninth batch (cov9-b-sword, cov9-b-hammer, cov9-b-para) and are documented in unit
cov9.

Other unrun scripts of Kirby: the grab moves ending at the ceiling ($E7) or in water ($E1: the water_entered exits
of the throw states, 16:A739-16:A98C: ordinary tests in their chains that no movie took), two sprite-map
entries of the ability family ($3C, $3D), the end of the Invincible Candy
(the level's music back, 30 rounds of two palette rows, kirby_pal_set, kirby_flags bit 6 cleared), the candy inhaled (19:B821).

Effects (the Cutter's blade meeting a wall and the end of sleep ran in cov9-a-rocky: unit cov9): a PPU record that would copy the whole palette from $0182 (16:A4A3). fx_create_rec5
(21:98DE) is fx_create_rec for a five-byte record: the fifth byte goes to the effect's variable 4 and the creator's
slot to variable 5.

Bank 19 (the goal game and items): the end of the row-4 dance, the top row's six hops when goal_seq_step answers 1,
type 4's entry 8 (the sign's gift five times, from the position of the object in variable 2: pos_save_var2 /
pos_restore), goal_form_vars (variables 4-7 from a table by kirby_form), goal_probe_right.

Sound (bank 1D, 1F): snd_nibble5, the five-bit twin of snd_nibble; three short stream fragments no header names.
Bank 12: the end entries of room_doors_lo / hi ($9C4A, the end of room_doors) and seven door records after the
new-game record that no room's door list reaches. Bank 1C: a one-entry pose table and its pose at the start of the
bank.

Small leftovers: the last bytes of scripts the static decoder stops in (after an asm_w it cannot follow): 14:A330,
14:B1DC, 14:BEC7, 14:BEDD, 19:BAA7, 16:B713.

Open:
- What slope2's table was for is not known (no floor kind of the game is a 1-in-2 slope as far as kvel describes).
- Which ability the sprite map 1A:8676 of scripts $3B-$3D belongs to is not checked here.
- The door records of 12:9218 lead to rooms 8, 9, $0A, $0B, $0C, $6C and $0E; which places those are is not checked.
"""

# ================================================================= bank 21

[[data]]
at = "21:816F"
len = 256
name = "slope2_vx_lo"
format = "rows:16"
never = true
desc = """Never read. Low bytes of a table like slope_vx_lo (which follows it): with n the index as a signed byte, the
16-bit entry is 16 * n * 2 / sqrt(5) rounded, the speed along a slope that rises 1 in 2 for the speed n * 16 along the
ground (slope_vx holds 16 * n / sqrt(2), the 45-degree slope). kirby_vx_apply reads slope_vx_lo / hi only."""

[[data]]
at = "21:826F"
len = 256
name = "slope2_vx_hi"
format = "rows:16"
never = true
desc = "Never read. High bytes of slope2_vx_lo's entries."

[[sym]]
at = "21:98DE"
name = "fx_create_rec5"
never = true
desc = """Never runs. fx_create_rec for a five-byte record behind the script instruction (dx, dy, number, v4, facing
offset): spawn_vars + 5 = the current object's slot, then what spawn_rec does (the position mirrored by the facing,
spawn_vars + 3 = the number, spawn_vars + 1 = facing + offset) with spawn_vars + 4 = the fourth byte, script_ptr moved
on by 5, and a jump to fx_create. Its bytes from 21:98E3 are spawn_rec's (21:9A03-9A48) except the extra byte and
the step of 5; the new effect gets variable 4 = v4 and variable 5 = the creator's slot from obj_spawn's copy of
spawn_vars."""

