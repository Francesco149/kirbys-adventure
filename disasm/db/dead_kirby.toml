# ================================================================= claims

[[claim]]
id = "dead_kirby.slope2.table"
about = ["slope2_vx_lo", "slope2_vx_hi"]
text = "Entry n of slope2_vx_lo / slope2_vx_hi is round(16 * n * 2 / sqrt(5)) for n the index as a signed byte (as 16 bits); slope2_vx_hi follows slope2_vx_lo and slope_vx_lo follows slope2_vx_hi; no decoded instruction names either table and the only lo / hi byte pair in the PRG equal to either address is one in bank 3A (equal to slope2_vx_hi's $826F)."
kind = "static"
