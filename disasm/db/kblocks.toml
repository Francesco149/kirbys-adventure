unit = "kblocks"
title = "What Kirby's code asks of the blocks: water, currents, the Down test, breaking blocks"
summary = """The routines of bank 21 that sit between Kirby's code (banks 14-19) and the block tests of unit props, and
with them a meaning for some of the numbers that unit left open. obj_point and obj_point_off put the current object's
position (plus a signed offset) where block_prop_at wants a point. Bit 7 of prop_shape is water: kirby_in_water is
set from it when one of Kirby's states begins (21:9BF7), water_entered and water_left compare the flag with the block
at Kirby's point, water_test_splash does the same and creates object 4 eight pixels above him. The two numbers of
prop_extra are a current: bits 0-1 a direction (0 up, 1 right, 2 down, 3 left), bits 2-3 a strength (0-2);
current_push adds the entry of current_lo / current_hi for that pair to Kirby's velocity every frame, and room_current,
when it is not negative, replaces the pair for the whole room. Shape numbers 9, $A and $B are blocks that break:
break_test_0 breaks 9 and $B, break_test_1 also $A; a broken 9 or $A creates object 3, a broken $B object $12
(block_break_at of unit props does the replacing, so only a block whose prop_extra has bit 4 changes). The tests run
on one point (break_at_obj_0 / _1, the current object's position) or on every block that Kirby's rectangle kirby_rect
touches (break_rect_0 / _1). down_bit5_test is carry set when Down is held and the two points 7 below and 6 left and
right of the object are both in blocks with bit 5 of prop_shape.

In pictures: main@64640 Kirby is in water with the splash above him; main@67700 he is blown up a shaft of clouds;
main@3027 and main@14149 a block is being broken.

Open: break_test_2 (shapes 9, $A, $B and $F) never ran from its entry and the sweep that would use it (kind 2, entry
21:941C) was never touched; in break_test_0 the branch for shape $A (a sound, no break) never ran. The limits of
current_push (a velocity high byte of 7 or more, or below -7, is replaced) never ran. down_bit5_test returned carry set twice in main (frames 17449 and 57986) and in no other movie searched. What bit 5 of prop_shape is in
the game (main@17449 shows Kirby at the top of a ladder) is not claimed, nor what objects 3, 4, $12 and $1A of
21:9955 are, nor the value of kirby_rect's first byte beyond its bit 7. Not in the unit: 21:80C0 (shape $E at Kirby's
point, 15 calls reach the test), 21:97DD (98 calls, one path), Kirby's move routine 21:95DE with its limits and the
camera, 21:9BF7 and 21:9C72 (the writer of kirby_rect), 3F:E2C4, 3F:E3A7, 3F:E330, 3F:F826 (sound requests) and
21:9955 (creates the object numbered in spawn_vars+3 at $4B:X, $4C:Y)."""

[[sym]]
at = "21:9CED"
name = "obj_point"
desc = "The position of the current object as a point for block_prop_at and the tests built on it."
in = "cur_object"
out = "$4B, X = obj_wx_hi, obj_wx_lo; $4C, Y = obj_wy_hi, obj_wy_lo of the object"

[[sym]]
at = "21:9D01"
name = "obj_point_off"
desc = "The position of the current object plus a signed offset, as a point for block_prop_at. $00 and $01 are left as the sign extensions of the two offsets, $11 as the low byte of X."
in = "X, Y = signed offsets; cur_object"
out = "$4B:X = X position + offset; $4C:Y = Y position + offset"

[[sym]]
at = "21:89D9"
name = "water_entered"
desc = "Carry set when kirby_in_water is 0 and the block at the current object's point has bit 7 of prop_shape (water). With the flag nonzero it returns carry clear without looking."
out = "carry"

[[sym]]
at = "21:89E6"
name = "water_left"
desc = "Carry set when kirby_in_water is nonzero and the block at the current object's point has no bit 7 of prop_shape. With the flag 0 it returns carry clear without looking."
out = "carry"

[[sym]]
at = "21:899E"
name = "water_test_splash"
desc = "With kirby_in_water nonzero: carry clear. Otherwise the block at the current object's point is tested for bit 7 of prop_shape: clear gives carry clear; set, and 3F:E2C4 answers carry clear, gives carry set. When 3F:E2C4 answers carry set ($05E1 = 9 and one of $05E5, $05E6 nonzero) the routine sets kirby_in_water to 1 itself, creates object 4 (spawn_vars+3, 21:9955) at Kirby's position 8 pixels up, and returns carry clear."
out = "carry"

[[sym]]
at = "21:8980"
name = "down_bit5_test"
desc = "Carry set when Down is held (bit 2 of pad1_held_copy) and the blocks at two points have bit 5 of prop_shape: the object's position + (-6, 7), and, only when that one has it, + (6, 7). Without Down no block is looked at."
out = "carry"

[[sym]]
at = "21:9511"
name = "break_test_0"
desc = "Tests the block at a point and breaks it by its shape number (prop_shape_at): 9 goes to break_small, $B to break_big, anything else returns carry clear with $10 = the shape number. For $A the code plays sound $0B (3F:F826) and breaks nothing; that branch never ran."
in = "$4B, X = X position; $4C, Y = Y position"
out = "carry set = it was a block of a shape that breaks"

[[sym]]
at = "21:9533"
name = "break_test_1"
desc = "As break_test_0, but shape $A breaks too: 9 and $A go to break_small, $B to break_big."
in = "$4B, X = X position; $4C, Y = Y position"
out = "carry set = it was a block of a shape that breaks"

[[sym]]
at = "21:9550"
kind = "part"
name = "break_test_2"
desc = "A third test that never ran from its entry: by the code, shapes 9 and $A go to break_small, $B and $F to break_big. The two tails are shared with break_test_0 and break_test_1 and ran from them: break_small (21:9571) calls block_break_at for the point, then creates object 3 (spawn_vars+3, 21:9955) at the middle of the block (X and Y with the low four bits replaced by 8) and calls 3F:E3A7 with A = 1, X = 0; break_big (21:959F) is the same with object $12 and A = 2. Both return carry set whether or not block_break_at replaced the block."

[[sym]]
at = "21:9571"
kind = "label"
name = "break_small"

[[sym]]
at = "21:959F"
kind = "label"
name = "break_big"

[[sym]]
at = "21:93F5"
name = "break_at_obj_0"
desc = "break_test_0 on the current object's position (obj_point); when it answers carry set, sound $19 is requested (3F:F826). The carry is returned."
out = "carry set = a block was broken"

[[sym]]
at = "21:93FE"
name = "break_at_obj_1"
desc = "break_test_1 on the current object's position (obj_point); when it answers carry set, sound $19 is requested (3F:F826). The carry is returned."
out = "carry set = a block was broken"

[[sym]]
at = "21:940E"
name = "break_rect_0_mark"
desc = "break_rect_0, and when it broke something bit 3 of $05FB is set."
out = "carry as break_rect_0"

[[sym]]
at = "21:9420"
name = "break_rect_0"
desc = "break_rect with A = 0: break_test_0 on every block of Kirby's rectangle."
out = "carry set = a block was broken"

[[sym]]
at = "21:9424"
name = "break_rect_1"
desc = "break_rect with A = 1 (break_test_1). The body, break_rect (21:9426, A = which test), runs a test on every block that kirby_rect touches: with bit 7 of the rectangle's first byte set it returns carry clear at once; otherwise it goes from X = (centre - half width) & $FFF0 and Y = (centre - half height) & $FFF0 in steps of 16, row by row, over ((low byte of centre + half) & $F0 - low byte of the start) / 16 + 1 columns and rows, and counts the tests that answer carry set in break_scan+1. When the count is not 0 it calls 3F:E330, requests sound $19, creates object $1A (21:9955) and returns carry set. A = 2 would use break_test_2; no code that ran passes it."
out = "carry set = a block was broken"

[[sym]]
at = "21:9426"
kind = "label"
name = "break_rect"

[[sym]]
at = "21:97ED"
name = "current_push"
desc = "Adds a current to Kirby's velocity. The index is room_current when that is not negative; otherwise prop_pair_at is asked about the block at the current object's point, and without a pair nothing happens. With direction d (0 up, 1 right, 2 down, 3 left) and strength s the index is 3 * d + s: the 16-bit entry at index (current_lo, current_hi) is added to obj_vy of slot 1 and the entry three further on to obj_vx. A velocity whose high byte comes out as 7 or more, or below -7, would be replaced by 7.0 or -7.0; that never ran."
in = "room_current; cur_object"

[[data]]
at = "21:985F"
len = 15
name = "current_lo"
format = "rows:3"
desc = "Low bytes of the velocity a current adds per frame, three strengths per row. current_push reads entry 3 * direction + strength for the Y velocity and the entry three further on for the X velocity, so the rows are: up, nothing, down or right, nothing, left. Rows 0 and 2-4 hold -$C0 -$180 -$300, $40 $80 $100 and -$40 -$80 -$100."

[[data]]
at = "21:986E"
len = 15
name = "current_hi"
format = "rows:3"
desc = "High bytes of the entries of current_lo."

[[ram]]
at = "05F7"
name = "kirby_in_water"
desc = "Nonzero while Kirby is taken to be in water. 21:9BF7 (the start of a state of Kirby) sets it to 1 or 0 from bit 7 of prop_shape of the block at his position; water_test_splash sets it to 1; 14:A0D5, 21:988D and 21:9893 also write it."

[[ram]]
at = "78D0"
name = "room_current"
desc = "An index into current_lo / current_hi that applies everywhere in the room, or negative for none (then the block at Kirby's position decides). Written by 38:AD5E."

[[ram]]
at = "0501"
len = 7
name = "kirby_rect"
desc = "A rectangle around Kirby that break_rect sweeps and bank 39 reads: +0 bit 7 set = there is none (5 and 6 are seen otherwise), +1/+2 X of the centre, +3/+4 Y of the centre, +5 half the width, +6 half the height. 21:9C72 writes all of it; the first byte is also written by 16:AA31, 3F:E45D and demo_play_frame."

[[ram]]
at = "78F1"
len = 9
name = "break_scan"
desc = "The state of break_rect: +0 which test (0, 1), +1 how many tests answered carry set, +2/+3 X and +4/+5 Y of the block being tested, +6 columns left in the row, +7 rows left, +8 columns per row minus 1."

