def tst(rd, wr, romrd, calls, rp, small, big):
    s = {v & 0x1F for o, v in romrd.items() if O('prop_shape') <= o < O('prop_shape') + 127}
    if len(s) != 1:
        return False
    s = s.pop()
    if s not in small + big:
        return not rp & 1 and 'block_break_at' not in calls and '21:9955' not in calls and wr[0x10] == s
    return (rp & 1 == 1 and calls.count('block_break_at') == 1 and calls.count('21:9955') == 1
            and calls.count('3F:E3A7') == 1 and wr[0x6026] == (3 if s in small else 0x12)
            and wr[0x602B] == rd[0x4B] and wr[0x602C] == rd[0x4C])
'''

