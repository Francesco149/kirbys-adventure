[[claim]]
id = "kblocks.water.splash"
about = ["water_test_splash", "kirby_in_water"]
text = "Every call of water_test_splash for a point inside the room: carry clear and no call when kirby_in_water is nonzero; carry clear and no write to the flag when the prop_shape byte it read has bit 7 clear; with bit 7 set, carry set and no write to the flag unless $05E1 = 9 and one of $05E5, $05E6 is nonzero, in which case kirby_in_water = 1, spawn_vars+3 = 4, spawn_x_hi and spawn_y_hi are the high bytes of Kirby's X and of his Y - 8, 21:9955 is called and the carry is clear."
kind = "call"
fn = "water_test_splash"
on = ["main@640+20", "main@64605+15", "w12-opus@30195+15", "w3-sonnet@30195+15", "hal-fable@2410+12", "hal-sonnet@2410+12", "hal-sub-sonnet@2410+12"]
where = "rd[0x5F7] or 0x10 in wr"
min_calls = 20
expect = "spl(rd, wr, romrd, calls, rp)"
model = '''
def spl(rd, wr, romrd, calls, rp):
    if rd[0x5F7]:
        return not calls and not rp & 1
    b = [v >> 7 for o, v in romrd.items() if O('prop_shape') <= o < O('prop_shape') + 127]
    if len(b) != 1:
        return False
    if not b[0]:
        return not rp & 1 and 0x5F7 not in wr
    if not (rd[0x5E1] == 9 and (rd.get(0x5E6) or rd.get(0x5E5))):
        return rp & 1 == 1 and 0x5F7 not in wr
    wy = (rd[0x60AB] << 8 | rd[0x6099]) - 8 & 0xFFFF
    return (not rp & 1 and wr[0x5F7] == 1 and wr[0x6026] == 4 and wr[0x602B] == rd[0x6087]
            and wr[0x602C] == wy >> 8 and '21:9955' in calls)
'''

