about = ["down_bit5_test"]
text = "Every call of down_bit5_test: without Down in pad1_held_copy it calls nothing and returns carry clear; with Down it calls obj_point_off and asks prop_flags_at once or twice: once when the byte has bit 5 clear (carry clear), twice when the first byte has bit 5, and then the carry is set only if every prop_shape byte it read has bit 5."
kind = "call"
fn = "down_bit5_test"
on = ["main@17440+300", "w12-opus@2100+900", "w3-sonnet@2100+900", "w12-sonnet@14380+900", "hal-sub-sonnet@4350+300"]
where = "not rd[0xE6] & 4 or 0x10 in wr"
min_calls = 60
max_calls = 600
expect = "dn(rd, romrd, calls, rp)"
model = '''
def dn(rd, romrd, calls, rp):
    if not rd[0xE6] & 4:
        return not calls and not rp & 1
    b = {v >> 5 & 1 for o, v in romrd.items() if O('prop_shape') <= o < O('prop_shape') + 127}
    n = calls.count('prop_flags_at')
    if calls[0] != 'obj_point_off' or calls.count('obj_point_off') != n:
        return False
    if n == 1:
        return b == {0} and not rp & 1
    return n == 2 and 1 in b and rp & 1 == (b == {1})
'''

