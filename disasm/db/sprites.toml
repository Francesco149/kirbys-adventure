text = "Every sprites, poses and poseptr region of this unit parses as its format (groups of 1-64 sprites that fill the region exactly); every pointer of a table points to the start of a group or pose in such a region; every byte of them that the corpus read was read by an instruction that reads that kind of byte (CHR byte, count, X offset, Y offset, tile, attribute in the draw routines, a pointer in obj_run_all); and no byte read by those instructions lies outside these regions."
