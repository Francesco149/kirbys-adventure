unit = "sprites"
title = "Sprite groups, poses and the pose tables"
summary = """
What objects look like, as data. Unit draw has the format: a sprite group is a count followed by count entries
of X offset, Y offset, tile (bit 0 inverted) and attribute; a pose is a CHR bank byte followed by a group; a pose
table is a list of 16-bit pointers to groups or poses in the same bank as mapped at $8000, which an object gets
from the script opcode sprite_map (or from code) and indexes with its pose.

The regions here were found by `kd sprites`: every address a sprite_map instruction names is a table; the table
runs until something a table points to, or the first value that is not a pointer to a group; a run of groups is
one region. Whether a target is a group or a pose comes from the instruction that read its first byte in the
corpus, and for targets nothing drew from which of the two ends exactly where the next one begins. Groups that
code draws through pointers of its own (no table) are regions too. The names are addresses; the object each
table belongs to is not recorded yet.

One claim covers all regions: each parses as its format, every pointer of a table points to the start of a group
or pose, and every byte the corpus read was read by the instruction that the format says reads that kind of byte
(the CHR byte by pose_draw, the count and the four bytes of a sprite by their own loads in the draw routines, a
pointer by obj_run_all). The other direction holds too: no byte that these instructions read lies outside the
regions. Bytes nothing read are in the regions by their structure only, and `kd status` counts them as
described, not verified.

Open:
- Which object type uses which table, and so what each pose shows, is for the rounds per object type.
- Three tables are not named by any sprite_map instruction (code stores their address); they begin where the
  corpus first read a pointer, and pointers in front of that are not included.
- A table may be longer or shorter than listed where nothing read its end: the end is a structural guess.
- sprite_ptrs_31_9BC7 shows that code can index a pointer list itself. A table also ends where the corpus saw a
  reader other than obj_run_all, but a list that only such code would read, and that no movie reached, could
  still be counted as the tail of the pose table in front of it.
"""

