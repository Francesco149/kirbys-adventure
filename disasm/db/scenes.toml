def press_ok(rd, wr, calls):
    pad = rd[0x3C]
    if not pad & 0x90 or rd.get(0x61CD):
        return not wr
    x = rd[0x6E]
    t = [t for t in range(32) if wr.get(0x6380 + t) == 0xA7 and wr.get(0x63A0 + t) == 0xAA and wr.get(0x63C0 + t) == 0x3D]
    return wr.get(0x61CA + x) == 0 and wr.get(0x7F2) == 0 and len(t) == 1 and 'snd_play' in calls
'''
