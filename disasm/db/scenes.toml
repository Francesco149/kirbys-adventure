about = ["title_setup", "title_open"]
text = "Every call of title_setup writes chr_bank 0-5 = $D0 $BA $68 $69 $6A $6B, split_mode 0, fade_level $FC and 0 to both title idle counters, and calls scene_screen_init."
kind = "call"
