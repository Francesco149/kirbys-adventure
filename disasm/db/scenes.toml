# ================================================================= the title (type $69)

[[script]]
at = "3D:A9EB"
name = "title_start"
desc = """First script of object type $69, the title (scene_run creates it in slot 0). Variable 0 picks the part
through a jump table of five: 0 the title itself (title_main), 1 3D:AAAD (never ran), 2 a far jump to 36:AA8D, 3 and 4
the stars that fly in and out (3D:ADDC, 3D:ADFB)."""

[[script]]
at = "3D:A9F9"
name = "title_main"
desc = """Part 0 of the title. scene_no_split; title_open (every other object freed, music $35 when $07F3 is 0,
title_setup, fade_level 4, the palette from 3D:ADB8); the background stars (an object of type $69 with
variable 0 = 2 in slot 3); title_draw; scene_fade_in4; variable 4 = 0; when cold_start_flag is set 60 frames more
and the flag cleared; 20 frames; then the tick title_press for as long as the title shows. title_timeout (unit
attract) ends it from the outside, title_press by turning it into the file select."""

[[script]]
at = "3D:AA25"
name = "title_open"
desc = "Subroutine of title_main: frees every other object (3E:DF0D); with $07F3 = 0 starts music $35 (3E:DE45); title_setup; fade_level = 4; the object's move routine 3E:D8D5, its velocities cleared; the palette 3D:ADB8 (3E:DF61)."

[[sym]]
at = "3D:AA4E"
name = "title_setup"
desc = "The title's video setup: CHR banks $D0, $BA, $68, $69, $6A, $6B (chr_bank 0-5), scene_screen_init, fade_level = -4, display_on, title_idle_seconds and title_idle_frames = 0."

[[sym]]
at = "3D:A337"
name = "scene_screen_init"
desc = "Video state shared by the intro and the title: split_mode 0, ppumask | 6 (the left 8 pixels shown), mapper mirroring register = 1, $051E = 0, and variables 1, 2 and 3 of the current object = 0."

[[sym]]
at = "3D:A42B"
name = "title_draw"
desc = "Expands packed_3D_AB5C (the title screen) to room_map ($68C8), copies its last 64 bytes (the attributes) to nt_attr + 64, sends it with the PPU record 3D:A460 and turns the display on."

[[sym]]
at = "3D:AABA"
name = "title_press"
desc = """Tick routine of the title. When A or Start is newly pressed and the byte at $61CD is 0 (title_timeout sets it
when the time is up): variable 0 of the current object ($61CA + slot) = 0, title_long_wait = 0, sound $10, and the
object's script becomes fsel_enter (3D:AAA7). Otherwise nothing."""

[[script]]
at = "3D:AAE4"
name = "scene_fade_in4"
desc = "Script subroutine: four fade_down steps, four frames apart (the title: fade_level 4 to 0)."

[[script]]
at = "3D:AAEB"
name = "scene_fade_out4"
desc = "Script subroutine: four fade_up steps, four frames apart (the title: fade_level 0 to 4)."

[[script]]
at = "3D:BF50"
name = "scene_no_split"
desc = "Script subroutine: split_mode = 0, one frame."

[[ram]]
at = "07F4"
name = "cold_start_flag"
desc = "1 after ram_sig_check found no signature (a power-on), 0 after a reset. title_main waits 60 frames more when it is set and clears it."

