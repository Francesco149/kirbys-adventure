[[claim]]
id = "scenes.title.press"
about = ["title_press", "title_long_wait"]
text = "title_press does nothing unless A or Start is in joypad_new and the byte at $61CD is 0; then it writes 0 to $61CA + slot and title_long_wait, plays a sound and sets the object's script to 3D:AAA7. The windows hold presses in main, cov-reset (twice) and w12-sonnet and frames without one."
kind = "call"
fn = "title_press"
