unit = "scenes"
title = "The scenes: the title with the file select and the battery save, the game over with the continue"
summary = """
A scene is one object of a scene type run by scene_run (unit frame) until no object is left. This unit has the drawing
intro after a power-on (type $68, 3D:A000, with its sparkles, type $6B), the title (type $69, 3D:A9EB) with the file
select that follows it, the battery save of the three files, the game over (type $6D, 2E:A1B4) with the continue, and
the first scripts of the level card (type $6C, 34:A000) and the story pages (type $6A, 36:AC96).

The intro (intro_main): intro_setup and intro_draw (an empty page, packed_3D_AAF2), a fade, then a pen object draws
Kirby block by block (intro_pen: one 2x2 block of intro_circle_tiles every fourth frame, at most four sparkles of type
$6B around it) while intro_typer types the captions of intro_text one tile at a time ("First you draw a circle, Then
you dot the eyes, Add a great big smile, And presto, it's Kirby!"); the eyes, the smile and the paint bucket are parts
of the same type waited for in turn; intro_color draws the finished Kirby and intro_scroll scrolls the page away. A or
Start (intro_skip) cuts it short.

The title (title_start, part 0 = title_main): no split, CHR banks $D0 $BA $68-$6B, the screen packed_3D_AB5C drawn by
title_draw, music $35 unless $07F3 is set, fade_level 4 brought to 0 by four fade_down steps, 60 more frames after
a power-on (cold_start_flag, cleared here), then the tick title_press. title_timeout (unit attract) ends the title by
itself (the byte at $61CD set); A or Start before that (title_press) clears variable 0 of the scene object ($61CA)
and title_long_wait, plays sound $10 and turns the same object into the file select (fsel_enter). The file select is
a family of states numbered by variable 9 (fsel_state: a jump table of 19 entries); variable 7 is the cursor. State 1
(fsel_open) checks the three files (save_verify_all), draws the box (packed_35_9CAB through fsel_screen) and one row
per file (fsel_rows: "KIRBY n... START" for an empty file), raises the box from the bottom with split mode 6
(fsel_raise: split_next + 2 per frame for 26 frames) and goes to state $0B (fsel_menu): the cursor starts at the
file chosen last (save_last_file), variable 5 is the mask of rows the cursor may visit (fsel_scan: 7 = the three
files, $17 also the delete row when a file is in use) and the tick fsel_tick runs: a hand cursor (fsel_cursor_anim),
Down or Select / Up moving it to the next allowed row (fsel_input), A or Start choosing. Choosing file n in state 2
stores n in save_file and save_last_file and goes to the state of fsel_next_tab (3 for a file): fsel_go fades out,
and fsel_begin starts an empty file as a new game (new_game_room: the first room from the room table of bank 12,
new_game_stats: hp = hp_max, score 0, no form, no ability), sets variable 0 = 1 and ends the object. scene_run
returns, title_attract_loop (unit attract) sees $61CA = 1 and goes to game_begin.

The battery save: three files of 38 bytes at save_slots ($7903, $794F, $799B), each followed by a backup copy
($7929, $7975, $79C1). Byte 0 is the sum (modulo 256) and byte 1 the exclusive or of bytes 2-$25 (save_sum,
save_xor); byte 2 is the number of things done (save_count: the bits of stages_done and $0529 in worlds 0-6, the boss
bits of stages_clear, and 1 for bit 3 of $0528); bytes 3-$24 are the game's state in the order of save_layout (each
block stored last byte first): stages_done with $0528, $0529-$0530, stages_clear, save_world ($79E9), world,
room_return and $055A-$055D. save_game (far-called by game_begin and, through save_stage_end, on leave code 4)
writes the file in save_file, signs it and copies it to its backup, unless save_world is 7 or more (a new game: the
file select leaves $0B there) or $F4 is set. save_verify_all checks every file when the file select opens and
restores a bad one from its backup, or empties it (bytes 2 and 3 = 0) when the backup is bad too.

The game over (gameover_start, part 0 = gameover_main): after the last life (3F:E566, unit frame) scene $6D shows
"GAME OVER" (gameover_draw1) for 150 frames, then the menu CONTINUE / GAME END (gameover_draw2) with sleeping Kirby
(part 1) and his bubbles (parts 2 and 3); the manager itself is the hand cursor. On CONTINUE (gameover_tick_continue)
Down or Select moves the hand down and A or Start stores 0 in variable 1 ($61DC); on GAME END (gameover_tick_end) Up
or Select moves it up and A or Start stores 1. Kirby's animation for the choice ends with variable 5 = 1, which ends
the scene (gameover_tick_done, gameover_close). 3F:E566 reads $61DC: 1 goes to boot_flow (game_state_init and the
title), 0 calls continue_setup (score halved, 4 lives, hp $2F, the first world whose boss is not beaten, its hub as
room_return, the cleared-stage marks of the unbeaten worlds forgotten) and game_begin.

Open:
- The file select's other states never ran: no movie moves the cursor (moves are shown only by effect), uses a file
  that is not empty, deletes a file or presses B. The states 0, 2, 4-10, 12-18 of fsel_state (3D:AF5D-3D:B2C6,
  3D:B6E9, 3D:B719 and the code 3D:B032-3D:B169), loading a saved game (3D:BCDF, never ran), the percentage display
  (3D:B65C, 3D:B673, the digits path of fsel_file_info), the delete confirmation texts (3D:B7FC-3D:BBA8) and the
  rows of fsel_text other than 0, 1 and 17 are read from the code at most. The text blocks at 3D:B7FC on are not
  described entry by entry.
- save_game's paths for byte 2 >= $3F (63, everything done) and $F5 (3D:BD61, 3D:BD7C) never ran; what $F4, $F5 and
  $F7 mean is not known ($F4 nonzero would also give 2 lives and hp $17 on a continue, 3D:BC5B). save_game_complete
  (3D:BCFC) ran once at the end of main; it loads the file, marks bit 3 of $0528 and room 6 and saves again.
- The game over: the $F4 & 2 paths (gameover_skip_test, the A press during the 150 frames in gameover_tick_wait)
  never ran. continue_setup's branch for all eight bosses beaten (x = 8, $07F5 = 4) never ran.
- The intro's parts 1-3 (the smile 3D:A237, the eyes 3D:A1D1, the bucket 3D:A288), its ticks 3D:A499 and 3D:A4F1, the
  skip path 3D:A9D4 and the tables 3D:A628-3D:A6EA (never read) are read from the code; intro_pen_ends' second entry
  (5) is never met, so what ends the later strokes is the script removing the tick.
- Not in this round: the title's other parts (variable 0 = 1-4: 3D:AAAD never ran, 36:AA8D, the flying stars
  3D:ADDC / 3D:ADFB with 3D:AE21, 3D:AE5E, 3D:AEA0 and their tables), the story pages beyond their first script (type
  $6A, bank 36 from 36:ACA2, with 2E:A000 / 2E:A004; the type is also used in world 7, 36:B647, unit en23), the level
  card beyond its first script (bank 34 from 34:A023), the help screens of 2E:A98B / 2E:AA55 (doors of kind 8, 9, $D,
  counted in $F6) and the rest of banks 2E, 34 and 36.
"""

# ================================================================= shared model

[[model]]
name = "save_model"
code = '''
SAVE_FILES = [0x7903, 0x794F, 0x799B]
SAVE_BAKS = [0x7929, 0x7975, 0x79C1]
SAVE_LAYOUT = [(0x521, 8), (0x529, 8), (0x531, 8), (0x79E9, 1), (0x558, 1), (0x562, 2), (0x564, 1), (0x565, 1),
               (0x55A, 2), (0x55C, 1), (0x55D, 1)]

def save_image(ram):
    """File offsets 3..$24 from the RAM values: each block of the layout last byte first."""
    out = {}
    off = 3
    for a, c in SAVE_LAYOUT:
        for i in reversed(range(c)):
            out[off] = ram(a + i)
            off += 1
    return out

def save_count(ram):
    n = 0
    for w in range(7):
        n += bin(ram(0x521 + w)).count('1') + bin(ram(0x529 + w)).count('1') + (1 if ram(0x531 + w) & 0x80 else 0)
    return n + (1 if ram(0x528) & 8 else 0)

def save_sums(data):
    """(sum modulo 256, exclusive or) of the bytes."""
    s, x = 0, 0
    for b in data:
        s = (s + b) & 0xFF
        x ^= b
    return s, x

def not_scratch(wr):
    return {a for a in wr if not (a < 0x10 or 0x100 <= a < 0x200)}
'''

[[claim]]
id = "scenes.save.layout_static"
about = ["save_layout", "save_file_lo", "save_file_hi", "save_backup_lo", "save_backup_hi", "save_count_rows_lo", "save_count_rows_hi"]
text = "save_layout holds the (address, count) pairs of save_model's SAVE_LAYOUT and ends with $FFFF; the file and backup address tables give $7903/$794F/$799B and $7929/$7975/$79C1; save_count reads the rows $0521, $0529, $0531."
kind = "static"
use = ["save_model"]
model = '''
def layout():
    out, o = [], O('save_layout')
    while True:
        lo, hi = u8(o), u8(o + 1)
        if lo & hi == 0xFF:
            return out
        out.append((lo | hi << 8, u8(o + 2)))
        o += 3
'''
expect = "layout() == SAVE_LAYOUT and [u8(O('save_file_lo') + i) | u8(O('save_file_hi') + i) << 8 for i in range(3)] == SAVE_FILES and [u8(O('save_backup_lo') + i) | u8(O('save_backup_hi') + i) << 8 for i in range(3)] == SAVE_BAKS and [u8(O('save_count_rows_lo') + i) | u8(O('save_count_rows_hi') + i) << 8 for i in range(3)] == [0x521, 0x529, 0x531]"

