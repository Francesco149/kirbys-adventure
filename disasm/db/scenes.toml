[[claim]]
id = "scenes.continue.model"
about = ["continue_setup", "first_unbeaten", "stages_clear_keep_boss", "continue_room"]
text = "The one call of continue_setup (cov-gameover) halves the 24-bit score, sets lives 4, hp = hp_max = $2F, kirby_ability $FF, kirby_form, stage_door and leave_code 0; x = the first world whose boss bit is clear; room_return = row x of continue_room, $0557 = save_world = x; stages_clear keeps only bit 7 and is copied, with stages_done and $0529, to $0549, $0539 and $0541."
kind = "call"
fn = "continue_setup"
on = ["cov-gameover@7520+20", "cov-gameover-end@7900+80"]
min_calls = 1
model = '''
ROOMS = [[0, 1, 2, 3, 4, 5, 6, 0x0F, 0x10], [0] * 9, [2, 3, 3, 3, 0, 0, 0, 4, 0], [0x46, 0x21, 0x23, 0x28, 0x23, 0x2A, 0x2C, 0x47, 0]]
def cont_ok(rd, wr, mem):
    s = (rd[0x593] | rd[0x594] << 8 | rd[0x595] << 16) >> 1
    if (wr[0x593], wr[0x594], wr[0x595]) != (s & 0xFF, s >> 8 & 0xFF, s >> 16):
        return False
    if (wr[0x599], wr[0x597], wr[0x596], wr[0x5E3], wr[0x5E0], wr[0x559], wr[0x56A], wr[0x55F]) != (4, 0x2F, 0x2F, 0xFF, 0, 0, 0, 0xFF):
        return False
    x = next((i for i in range(8) if not rd[0x531 + i] & 0x80), 8)
    if [wr[0x562 + i] for i in range(4)] != [ROOMS[r][x] for r in range(4)] or wr[0x557] != x or wr[0x79E9] != x:
        return False
    return all(wr[0x531 + i] == rd[0x531 + i] & 0x80 == wr[0x549 + i] and wr[0x539 + i] == mem(0x521 + i) and wr[0x541 + i] == mem(0x529 + i) for i in range(8))
'''
