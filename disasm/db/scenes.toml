# ================================================================= the battery save

[[ram]]
at = "7903"
len = 228
name = "save_slots"
desc = """The three files in battery RAM, 76 bytes apart ($7903, $794F, $799B), each followed by its 38-byte backup
($7929, $7975, $79C1). A file: byte 0 the sum (modulo 256) and byte 1 the exclusive or of bytes 2-$25, byte 2
save_count's number (0 = empty file), bytes 3-$24 the state in save_layout's order, byte $25 unused."""

[[data]]
at = "3D:BDDC"
len = 35
name = "save_layout"
format = "bytes"
desc = "The state a file holds, as (address, count) records ended by $FFFF: $0521 x8 (stages_done and $0528), $0529 x8, $0531 x8 (stages_clear), $79E9, $0558 (world), $0562 x2, $0564, $0565 (room_return), $055A x2, $055C, $055D."

[[data]]
at = "3D:BE0D"
len = 3
name = "save_file_lo"
format = "bytes"
desc = "Low bytes of the three files' addresses ($7903, $794F, $799B)."

[[data]]
at = "3D:BE10"
len = 3
name = "save_file_hi"
format = "bytes"
desc = "High bytes of the three files' addresses."

[[data]]
at = "3D:BEDF"
len = 3
name = "save_backup_lo"
format = "bytes"
desc = "Low bytes of the three backups' addresses ($7929, $7975, $79C1)."

[[data]]
at = "3D:BEE2"
len = 3
name = "save_backup_hi"
format = "bytes"
desc = "High bytes of the three backups' addresses."

[[data]]
at = "3D:BE4A"
len = 3
name = "save_count_rows_lo"
format = "bytes"
desc = "Low bytes of the three rows save_count counts: $0521, $0529, $0531."

[[data]]
at = "3D:BE4D"
len = 3
name = "save_count_rows_hi"
format = "bytes"
desc = "High bytes of the rows of save_count."

[[sym]]
at = "3D:BDFF"
name = "save_file_ptr"
desc = "$06/$07 = the address of file save_file."

[[sym]]
at = "3D:BD96"
name = "save_transfer"
desc = """Copies the state of save_layout between RAM and file save_file: $02 = 0 RAM to file, otherwise file to RAM.
The file offsets run from 3 up, each block of the layout last byte first."""
in = "$02 = direction (0 save, else load)"

[[sym]]
at = "3D:BE13"
name = "save_count"
desc = "Byte 2 of the file = the set bits of stages_done[0-6] and $0529-$052F, the set bit 7 of stages_clear[0-6], plus 1 when bit 3 of $0528 is set."

[[sym]]
at = "3D:BEA0"
name = "save_sum"
desc = "A = the sum modulo 256 of bytes 2-$25 of the file at ($06) (the cpy of the loop clears the carry before every adc)."

[[sym]]
at = "3D:BEAD"
name = "save_xor"
desc = "A = the exclusive or of bytes 2-$25 of the file at ($06)."

[[sym]]
at = "3D:BE91"
name = "save_sign"
desc = "Byte 0 of the file = save_sum, byte 1 = save_xor."

[[sym]]
at = "3D:BE7B"
name = "save_check"
desc = "Carry clear when bytes 0 and 1 of the file at ($06) are its save_sum and save_xor, carry set otherwise."
out = "carry clear = the file is good"

[[sym]]
at = "3D:BEB9"
name = "save_backup_ptr"
desc = "$00/$01 = the address of the backup of file save_file."

[[sym]]
at = "3D:BEC7"
name = "save_backup_copy"
desc = "Copies the 38 bytes of file save_file to its backup ($02 = 0) or the backup to the file ($02 not 0)."

[[sym]]
at = "3D:BE50"
name = "save_verify_all"
desc = """For files 2, 1, 0: when save_check fails, the backup is copied over the file; when it still fails, bytes 2 and
3 of the file are cleared (an empty file). Leaves save_file at $FF."""

[[sym]]
at = "3D:BD38"
name = "save_stage_end"
desc = "Far-called on leave code 4 (unit frame): save_world = world, then save_game."

[[sym]]
at = "3D:BD3E"
name = "save_game"
desc = """Saves the game in file save_file: $F7 = 0; nothing more when save_world is 7 or more or $F4 is not 0.
Otherwise $F5 = 0 (1 or 2 for a file at byte 2 >= $3F and byte 3 >= 8, never ran), save_transfer RAM to file,
save_count, save_sign, and save_backup_copy to the backup. Far-called by game_begin and by save_stage_end."""

[[sym]]
at = "3D:BCFC"
name = "save_game_complete"
desc = """At the end of the game (once, main@137541): unless $F4 is 2, $F7 = 1, the file is loaded into RAM
(save_transfer with $02 = 1), $0528 = 8 (9 when $F4 is set), room + 1 = $FF, room_return = (6, 0, 0, $F9),
save_world = 6, and the rest of save_game (save_transfer, save_count, save_sign, backup)."""

[[claim]]
id = "scenes.save.model"
about = ["save_game", "save_transfer", "save_count", "save_sum", "save_xor", "save_sign", "save_backup_copy", "save_backup_ptr", "save_file_ptr", "save_slots", "save_world", "save_file"]
text = "Every call of save_game (and of save_stage_end, which falls into it) either writes only $F7 = 0 (save_world >= 7, a new game) or writes file save_file exactly as save_model computes it from the RAM it read: bytes 3-$24 the layout, byte 2 save_count, bytes 0 and 1 the sum modulo 256 and the exclusive or of bytes 2-$25, the 38 bytes copied to the backup, $F5 = $F7 = 0, nothing else outside $00-$0F and the stack. Both paths occur."
kind = "call"
fn = "save_game"
on = ["main@100+30", "w3-sonnet@200+40", "cov-reset@100+30", "main@2600+30000", "w12-opus@3600+6000", "w3-sonnet@20000+15000", "w12-sonnet@4400+6000", "cov-gameover@7520+30"]
min_calls = 12
use = ["save_model"]
model = '''
def save_ok(rd, wr, mem):
    if rd[0x79E9] >= 7:
        return not_scratch(wr) == {0xF7} and wr[0xF7] == 0
    f = rd[0x79E7]
    base, bak = SAVE_FILES[f], SAVE_BAKS[f]
    ram = lambda a: rd[a]
    img = save_image(ram)
    if any(wr.get(base + o) != v for o, v in img.items()):
        return False
    if wr.get(base + 2) != save_count(ram):
        return False
    s, x = save_sums([mem(base + o) for o in range(2, 0x26)])
    if (wr.get(base), wr.get(base + 1)) != (s, x):
        return False
    if any(wr.get(bak + o) != mem(base + o) for o in range(0x26)):
        return False
    allowed = set(range(base, base + 0x25)) | set(range(bak, bak + 0x26)) | {0xF5, 0xF7}
    return not_scratch(wr) <= allowed and wr[0xF5] == 0 and wr[0xF7] == 0
'''
expect = "save_ok(rd, wr, mem)"
cases = { "rd[0x79E9] >= 7" = 3, "rd[0x79E9] < 7" = 10, "rd[0x79E9] < 7 and save_count(lambda q: rd[q]) > 3" = 2 }

