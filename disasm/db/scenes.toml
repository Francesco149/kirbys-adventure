# ================================================================= the file select (type $69, from the title)

[[script]]
at = "3D:AAA7"
name = "fsel_enter"
desc = "Where title_press sends the title: variable 4 = 1, then fsel_start."

[[script]]
at = "3D:AF1B"
name = "fsel_start"
desc = "Variable 9 = 1 (fsel_open), then fsel_state."

[[script]]
at = "3D:AF1E"
name = "fsel_state"
desc = """The file select's dispatcher: sprite bank $35, variable 5 = $17, no pose, and a jump table of 19 entries on
variable 9. In the corpus: 1 fsel_open, $0B fsel_menu, 3 fsel_go. 3D:AF4F (inside fsel_menu's table code) restarts
it after variable 9 has changed."""

[[script]]
at = "3D:B728"
name = "fsel_open"
desc = """State 1: save_verify_all, the box (fsel_screen with packed_35_9CAB), fsel_rows, fsel_raise; then the hand
(sprite_map 37:967D) at (0, $100), variable 9 = $0B and fsel_state."""

[[sym]]
at = "3D:B747"
name = "fsel_screen"
desc = "Expands the packed stream whose address is in the two script bytes after the call to room_map ($68C8) and sends it with the PPU records 3D:B767 and 3D:B76E (ppu_record_inline)."

[[sym]]
at = "3D:B548"
name = "fsel_rows"
desc = """One row per file, file 2 to 0 (save_file counts down to $FF): an empty file (byte 2 = 0) gets fsel_text entry
1 (file 0) or 0 at column $11, row 0/2/4 (fsel_row_y); a file in use the percentage and its marks (3D:B572-3D:B63A,
never ran). Then fsel_file_info for save_last_file (0-2; 3 or more is reset to 0)."""

[[data]]
at = "3D:B659"
len = 3
name = "fsel_row_y"
format = "bytes"
desc = "Row offsets of the three files' text: 0, 2, 4."

[[script]]
at = "3D:B7C6"
name = "fsel_raise"
desc = "Script subroutine: split_next = 0, split_mode = 6 (the box below the low split, video unit), cam_integrate as tick and camera Y velocity $188; then 26 frames of split_step."

[[sym]]
at = "3D:B7DD"
name = "split_step"
desc = "split_next + 2: the low split, and the box under it, two lines higher."

[[script]]
at = "3D:B259"
name = "fsel_menu"
desc = "State $0B: the cursor (variable 7) = save_last_file, variable 9 = 2, the palette at 3D:B270, fsel_scan, the tick fsel_tick."

[[sym]]
at = "3D:B271"
name = "fsel_scan"
desc = "Variable 5 = 7 when all three files are empty (byte 2 = 0), $17 when one is in use (never ran): the rows the cursor may visit, bit n for row n (rows 0-2 the files, 4 \"Delete Saved Game\"). Leaves save_file at $FF."

[[sym]]
at = "3D:B1C3"
name = "fsel_tick"
desc = """Tick routine of the file select: fsel_cursor_anim, then fsel_input with variable 5 as the row mask. When that
answers carry set with A = 0 (a choice): in state 2 with the cursor on a file (not 4) save_last_file and save_file =
the cursor; in state 6 save_last_file only (never ran); then variable 9 = the entry of fsel_next_tab for the state,
at the cursor, and fsel_state again (3D:AF4F). A = 1 (B, never ran) goes to 3D:B20D."""

[[sym]]
at = "3D:B44A"
name = "fsel_cursor_anim"
desc = "Variable 8 + 1; the pose = $0B + (variable 8 >> 3) & 3: the hand's four frames, 8 frames each."

[[sym]]
at = "3D:B2F2"
name = "fsel_input"
desc = """The file select's pad test ($00 = the row mask). A or Start: sound $2D (not in state 8), A = 0, carry set.
B: sound $23, A = 1, carry set (never ran). Otherwise (states other than 7 and 8) Down or Select moves the cursor to the
next row above it in the mask, Up to the next below it (rows 0-4), with sound $2C; the hand is put at
fsel_cursor_x / fsel_cursor_y of the cursor; in states 2 and 6 fsel_file_info shows the file under the cursor
(not for row 4); carry clear."""
out = "carry set = a button chose (A = 0 A or Start, 1 B); carry clear = nothing chosen"

[[sym]]
at = "3D:B69E"
name = "fsel_file_info"
desc = """Y = a file: points $06/$07 at it; an empty file gives save_world = $0B (the entry 3D:B6E7 of 3D:B6DC: text $11)
and draws that text at column $0E, row 6 with size row 2 of fsel_text. A file in use: its percentage (3D:B65C,
never ran)."""

[[sym]]
at = "3D:BBA9"
name = "fsel_text"
desc = """Queues one text block: A = the text number, Y = the size number, $00 = column, $01 = row. Fills the PPU
record at $07DE-$07E4: mode 3, the name table address of (column, row) (nt_addr), width fsel_text_w[Y], rows
fsel_text_h[Y], source fsel_text_lo/hi[A]; then ppu_record."""

[[data]]
at = "3D:BBC9"
len = 11
name = "fsel_text_w"
format = "bytes"
desc = "Width in tiles of the text sizes of fsel_text."

[[data]]
at = "3D:BBD4"
len = 11
name = "fsel_text_h"
format = "bytes"
desc = "Rows of the text sizes of fsel_text."

[[data]]
at = "3D:BBDF"
len = 31
name = "fsel_text_lo"
format = "bytes"
desc = "Low bytes of the addresses of the file select's texts (31 entries; the texts are at 3D:B806-3D:BBA8)."

[[data]]
at = "3D:BBFE"
len = 31
name = "fsel_text_hi"
format = "bytes"
desc = "High bytes of the addresses of the file select's texts."

[[data]]
at = "3D:B43C"
len = 7
name = "fsel_cursor_x"
format = "bytes"
desc = "X of the hand by cursor row: $24 for rows 0-4, then $A0, $C8."

[[data]]
at = "3D:B443"
len = 7
name = "fsel_cursor_y"
format = "bytes"
desc = "Y of the hand by cursor row: $BC, $CC, $DC, $EC, $FC (the three files, the two rows under them), $FC, $FC."

[[data]]
at = "3D:B21E"
len = 7
name = "fsel_next_lo"
format = "bytes"
desc = "Low bytes of the rows of fsel_next_tab, by state - 2."

[[data]]
at = "3D:B225"
len = 7
name = "fsel_next_hi"
format = "bytes"
desc = "High bytes of the rows of fsel_next_tab, by state - 2."

[[data]]
at = "3D:B22C"
len = 37
name = "fsel_next_tab"
format = "bytes"
desc = "The state that follows a choice, by state (rows through fsel_next_lo/hi) and cursor. State 2, cursor 0-4: 3, 3, 3, $FF, 6 (a file starts it, the delete row asks which file)."

[[script]]
at = "3D:B147"
name = "fsel_go"
desc = "State 3, a file chosen: fsel_file_flags; with variable 5 = 0 scene_fade_out4, every other object freed, split_mode 0, and fsel_begin. Otherwise 3D:B15A (never ran)."

[[sym]]
at = "3D:B169"
name = "fsel_file_flags"
desc = "Variable 5 = 0, or for a file whose byte 3 is 8 or 9 a bit of 3D:B19B, | 5 when byte 2 is $3F or more (never ran: every chosen file was empty)."

[[script]]
at = "3D:AF7F"
name = "fsel_begin"
desc = """With the chosen file in use (byte 2 not 0) 3D:BCDF loads it (never ran); otherwise new_game_room. Then music
$FF and sound $FF (silence), variable 0 = 1 (title_attract_loop reads it in $61CA: start the game), new_game_stats,
and the object ends."""

[[sym]]
at = "3D:AFF5"
name = "fsel_file_used"
desc = "A = byte 2 of the file in save_file (0 = empty)."

[[sym]]
at = "3D:AF9D"
name = "new_game_room"
desc = """A new game's first room: room + 1 and room_return + 1 = $FF; from bank 12 (12:9215-9217) $055A = the room
byte, $055B = bit 6 of the next, $055C / $055D from the table and then fixed to 0 and $34; warp_arrival = $83."""

[[sym]]
at = "3D:AFDA"
name = "new_game_stats"
desc = "hp = hp_max; hud_picture, score (3 bytes), kirby_form and kirby_ability = 0."

[[ram]]
at = "79E7"
name = "save_file"
desc = "The file in use, 0-2: set by fsel_tick when a file is chosen; the file save_game writes. Loops over the files (save_verify_all, fsel_rows, fsel_scan) count it down and leave it at $FF."

[[ram]]
at = "79E8"
name = "save_last_file"
desc = "The file chosen last, where the cursor starts (fsel_menu); set with save_file. Battery RAM, so it is kept."

[[ram]]
at = "79E9"
name = "save_world"
desc = """The world to go on in, saved in the file: game_state_init clears it, save_stage_end and leave_tail (unit frame)
set it, continue_setup sets the world it continues in. save_game does not save while it is 7 or more. The file
select also uses it for the text number of fsel_file_info ($0B for an empty file)."""

