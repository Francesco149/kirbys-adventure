[[script]]
at = "3D:A000"
name = "intro_start"
desc = """First script of object type $68, the drawing intro after a power-on ("First you draw a circle, ... And presto,
it's Kirby!"). scene_no_split, then variable 0 picks the part (six entries): 0 the pen and manager (intro_main),
1 the smile (3D:A237), 2 the eyes (3D:A1D1), 3 the paint bucket (3D:A288), 4 the skip watcher (3D:A2D0, tick
intro_skip), 5 the caption typer (3D:A2C8: intro_typer_init, tick intro_typer)."""

[[script]]
at = "3D:A013"
name = "intro_main"
desc = """Part 0: display off, intro_setup, the palette 3D:AD94, intro_draw, display on, intro_fade_wait until the fade is
done; the caption typer in slot 1 and the skip watcher, music $31; then the pen (sprite thread intro_pen_anim, tick
intro_pen) moves along the circle by velocity steps; the eyes (part 2), the smile (part 1), more pen strokes, the
bucket (part 3) are created in turn, each waited for by a tick (intro_wait_eyes, intro_wait_smile, 3D:A499,
3D:A4F1); intro_color draws the coloured Kirby; at the end the tick 3D:A80B (intro_skip, then intro_scroll) with the
camera moving down at $100 rising to $400 per frame, and the scene ends when the picture has scrolled away."""

[[sym]]
at = "3D:A304"
name = "intro_setup"
desc = "CHR banks $6C, -, $6E, $6F, $70, $DB; scene_screen_init; title_long_wait, $07F3, title_idle_seconds and title_idle_frames = 0; the source pointer of intro_pen's PPU record ($07E3/$07E4) = $A747 (intro_circle_tiles - 4)."

[[sym]]
at = "3D:A3FC"
name = "intro_draw"
desc = "Expands packed_3D_AAF2 (the intro's empty page) to room_map, copies its attributes ($6C88-$6CC7) to nt_attr, sends the PPU records 3D:A453 and 3D:A45A and turns the display on."

[[sym]]
at = "3D:A2EB"
name = "intro_fade_wait"
desc = "Script call: fade_level 0: the thread's wait = 0 and A = 0 (the script's jne goes on); negative: fade_up, A = 1; positive: fade_down, A = 1."
out = "A = 0 when the fade is done"

[[sym]]
at = "3D:A2D5"
name = "intro_skip"
desc = "Tick of the skip watcher (and of the last part of intro_main): A or Start newly pressed sends the current object to 3D:A9D4 (four fade_up steps, every other object freed, the camera scrolled down at $E00 by intro_scroll: the intro ends early). Otherwise nothing."

[[sym]]
at = "3D:A80E"
name = "intro_scroll"
desc = "Tick at the end of the intro: cam_y (with cam_y_frac) += the camera's Y velocity (cam_vy); once cam_y reaches $E0 the display goes off, every other object is freed and the object frees itself: the scene ends."

[[sym]]
at = "3D:A52C"
name = "intro_pen"
desc = """Tick of the pen. Counts the objects of type $6B in slots 18 down to 0; with fewer than 4, a countdown in
variable 4 (a new random(6) each time it is 0) creates one at the pen's position + intro_pen_dx / intro_pen_dy
[random(9)] (obj_spawn_plain with type $6B). Then every fourth frame (variable 2): when variable 1 equals
intro_pen_ends[variable 3], variable 3 + 1 and nothing is drawn; otherwise one 2x2 block of the line: the record at
$07DE gets mode 3, the address intro_circle_lo / _hi [variable 1], 2 x 2 tiles, its source ($07E3/$07E4) 4 bytes
further in intro_circle_tiles; ppu_record; variable 1 + 1."""

