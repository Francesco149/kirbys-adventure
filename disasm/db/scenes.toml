[[model]]
name = "gameover_model"
code = '''
def go_script(wr, addr):
    return [t for t in range(32) if wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == 0x2E]

def go_tick(rd, wr, calls, choice, move_mask, own_ok, kirby_ok, back):
    x = rd[0x6E]
    v7 = rd[0x6248 + x]
    if v7:
        if v7 & 0x80:
            return len(go_script(wr, back)) == 1
        return not wr
    pad = rd[0x3C]
    if pad & 0x90:
        return (wr.get(0x61DC + x) == choice and len(go_script(wr, own_ok)) == 1 and len(go_script(wr, kirby_ok)) == 1
                and 'snd_play' in calls)
    if pad & move_mask:
        return wr.get(0x6248 + x) == 1 and 'snd_play' in calls
    return not wr
'''

