[[claim]]
id = "scenes.intro.typer"
about = ["intro_typer", "intro_type_delay", "intro_text", "intro_typer_init"]
text = "intro_typer (variable 1 below $5F in every call of the windows): variable 2 + 1, and when that equals intro_type_delay[variable 1] either (column $18) column 0 and variable 2 = delay - 1, or one character: the record at $07E5 = 3, $2345 + column, 1 x 1, source = old pointer + 1, variables 1 and 3 + 1."
kind = "call"
fn = "intro_typer"
on = ["attract@20+540", "w12-sonnet@20+540"]
min_calls = 500
model = '''
def typer_ok(rd, wr, romrd, odel):
    x = rd[0x6E]
    v1 = rd[0x61DC + x]
    if v1 == 0x5F:
        return not wr
    v2 = (rd[0x61EE + x] + 1) & 0xFF
    d = romrd.get(odel + v1)
    if v2 != d:
        return wr.get(0x61EE + x) == v2 and 0x61DC + x not in wr
    v3 = rd[0x6200 + x]
    if v3 == 0x18:
        return wr.get(0x6200 + x) == 0 and wr.get(0x61EE + x) == d - 1
    p = rd[0x7EA] | rd[0x7EB] << 8
    return (wr.get(0x7E5) == 3 and wr.get(0x7E6) == (v3 + 0x45) & 0xFF and wr.get(0x7E7) == 0x23 and wr.get(0x7E8) == 1
            and wr.get(0x7E9) == 1 and (wr[0x7EA] | wr.get(0x7EB, rd[0x7EB]) << 8) == p + 1
            and wr.get(0x61DC + x) == v1 + 1 and wr.get(0x6200 + x) == v3 + 1)
'''
expect = "typer_ok(rd, wr, romrd, O('intro_type_delay'))"
cases = { "rd.get(0x6200 + rd[0x6E]) == 0x18" = 2, "0x7E5 in wr" = 80 }

[[claim]]
