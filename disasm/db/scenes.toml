text = "The jump_table at 3D:AF27 sends the file select to the state of variable 9 (19 entries); the windows hold states 1 (fsel_open, 3D:B728), $0B (fsel_menu, 3D:B259) and 3 (fsel_go, 3D:B147)."
kind = "vmop"
op = "jump_table"
at = "3D:AF27"
on = ["main@60+60", "w12-opus@170+60", "cov-reset@960+130"]
