def scroll_ok(rd, wr, ran_end):
    old = rd[0xE1] << 16 | rd[0xE0] << 8 | rd[0xDF]
    vy = rd[0xE5] << 8 | rd[0xE4]
    new = (old + vy) & 0xFFFFFF
    if (wr[0xE1] << 16 | wr[0xE0] << 8 | wr[0xDF]) != new:
        return False
    return ran_end == (new >> 8 >= 0xE0)
'''
