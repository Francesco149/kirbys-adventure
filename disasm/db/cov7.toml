name = "kfx_shot_big_water_tick"
desc = """Tick routine of the large star in water. Its X velocity moves $20 toward 0 (a negative one + $20, 0 when
that carries; a positive one - $20, 0 when that borrows), $10 is added to the Y velocity, and it goes on at 16:B4AF
inside kfx_shot_big_tick: break_at_obj_1, kfx_shot_floor and, with carry set, the script kfx_shot_burst. In the corpus
(8 calls) the X velocity was negative and stayed so, and the Y velocity's low byte never carried."""

