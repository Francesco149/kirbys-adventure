# ================================================================== claims: the candy

[[claim]]
id = "cov7.candy.item"
about = ["kfx_candy", "hit_item"]
text = "The call of hit_kirby that touched the Invincible Candy (an object of type 5 with variable 2 = 2, cov7-l-candy) calls 3F:EB2F first, creates an object with spawn_vars+3 = $19 (kfx_candy) through obj_create_far, calls snd_play, sets bit 6 of kirby_flags and changes no other bit, and frees the item."
kind = "call"
fn = "hit_kirby"
on = ["cov7-l-candy@69550+10", "main@15650+12"]
min_calls = 1
where = "0x50C in rd and rd[0x50C] == 0 and rd[0x6128 + rd[0x6E]] == 5 and rd[0x61EE + rd[0x6E]] == 2"
expect = "calls[0] == '3F:EB2F' and 'obj_create_far' in calls and 'snd_play' in calls and wr[0x6026] == 0x19 and wr[0x5FB] == rd[0x5FB] | 0x40 and not rd[0x5FB] & 0x40 and mem(0x6128 + rd[0x6E]) == 0xFF"

[[claim]]
id = "cov7.candy.script"
about = ["kfx_candy", "kfx_candy_pal", "snd_music_now"]
text = "In kfx_candy (cov7-l-candy) the asm_w at 16:B295 calls snd_music_now (3F:F862) with the register 2 set by the set_reg before it; the four asm_w of asm_palette (3E:DF61) at 16:B2A1, B2A8, B2B6, B2BD name the rows kfx_candy_pal + 0, 4, 8, 12, palette entry $10 and 4 colours; the two asm_w at 16:B29A and B2AF call fx_create_rec (21:9952) with the record 00 00 00 00. Each ran (the palette ones 47 times or more)."
kind = "vmop"
op = "asm_w"
on = ["cov7-l-candy@69550+200", "cov7-l-candy@69750+300"]
where = "0xB293 <= addr <= 0xB2C4"
min = 40
expect = "args == ([0xF862] if addr == 0xB295 else [0x9952, 0, 0, 0, 0] if addr in (0xB29A, 0xB2AF) else [0xDF61, (0xB2E5 + {0xB2A1: 0, 0xB2A8: 4, 0xB2B6: 8, 0xB2BD: 12}[addr]) & 0xFF, 0xB2, 0x10, 4])"
cases = { "addr == 0xB295" = 1, "addr == 0xB2A1" = 20, "addr == 0xB2BD" = 20, "addr == 0xB29A" = 20 }

[[claim]]
id = "cov7.candy.pal"
about = ["kfx_candy_pal"]
text = "kfx_candy_pal holds FF 36 26 0F, FF 30 37 17, FF 17 07 0F, FF 38 37 30, and palette_load is the only routine that read it."
kind = "static"
expect = "[u8(O('kfx_candy_pal') + i) for i in range(16)] == [0xFF, 0x36, 0x26, 0x0F, 0xFF, 0x30, 0x37, 0x17, 0xFF, 0x17, 0x07, 0x0F, 0xFF, 0x38, 0x37, 0x30] and all(dataread(O('kfx_candy_pal') + i) for i in range(16))"

[[claim]]
id = "cov7.candy.pal_row"
about = ["kfx_candy_pal", "kfx_candy"]
text = "Over the whole corpus palette_load (3E:C90E, called by asm_palette from kfx_candy) is the only reader of kfx_candy_pal."
kind = "xref"
expect = "datareaders('kfx_candy_pal') == {'3E:C90E'}"

[[claim]]
id = "cov7.candy.double_tap"
about = ["pad_double_tap"]
text = "Every call of pad_double_tap with bit 6 of kirby_flags set (cov7-l-candy) answers carry set exactly when Left is held and Kirby faces left (bit 7 of kirby_facing) or Right is held, Left is not, and he faces right, and does not write tap_timer; both answers happen. With the bit clear (main) tap_timer is read or written as before."
kind = "call"
fn = "pad_double_tap"
on = ["cov7-l-candy@69580+500", "main@500+1500"]
max_calls = 2000
min_calls = 30
expect = "((rp & 1) == int(bool(rd[0xE6] & 2 and rd[0x61DD] & 0x80 or not rd[0xE6] & 2 and rd[0xE6] & 1 and not rd[0x61DD] & 0x80)) and 0x5BF not in wr and ran('21:8A9B') == 1) if rd[0x5FB] & 0x40 else (ran('21:8A9B') == 0)"
cases = { "rd[0x5FB] & 0x40 and rp & 1" = 3, "rd[0x5FB] & 0x40 and not rp & 1" = 10, "not rd[0x5FB] & 0x40" = 20 }

[[claim]]
id = "cov7.candy.pal_skip"
about = ["kirby_pal_row"]
text = "kirby_pal_row returns at 21:9CE1 without writing $18 / $19 and without palette_load exactly when bit 6 of kirby_flags is set; the windows hold both (cov7-l-candy while the candy works, and main)."
kind = "call"
fn = "kirby_pal_row"
on = ["cov7-l-candy@69800+150", "main@600+3000"]
max_calls = 3000
min_calls = 20
expect = "(ran('21:9CE1') == 1) == bool(rd[0x5FB] & 0x40) and (not ran('21:9CE1') or not ({0x18, 0x19} & writes))"
cases = { "ran('21:9CE1')" = 5, "not ran('21:9CE1')" = 10 }

[[claim]]
id = "cov7.candy.touch"
about = ["hit_kirby"]
text = "In hit_kirby, after hit_star_kirby (Kirby not hurting already), bit 6 of kirby_flags set leads to hit_interrupt and the end (39:8471), without reading record byte 4 or setting kirby_hurt_timer; clear, to record byte 4 (39:8477). The windows hold the one touch with the bit set (cov7-l-candy@69722) and ordinary hurts."
kind = "call"
fn = "hit_kirby"
on = ["cov7-l-candy@69715+15", "main@840+60", "main@1200+80"]
max_calls = 3000
min_calls = 2
where = "ran('39:846C') == 1"
expect = "ran('39:8471') == int(bool(mem(0x5FB) & 0x40)) and ran('39:8477') == 1 - ran('39:8471') and (not ran('39:8471') or ('hit_interrupt' in calls and 0x5F9 not in wr))"
cases = { "ran('39:8471')" = 1, "ran('39:8477')" = 1 }

[[claim]]
id = "cov7.candy.card"
about = ["hud_ability"]
text = "Over cov7-l-candy from the candy on, on every frame where bit 6 of kirby_flags was set on this frame and the one before and hud_card is 0, the card shown (hud_shown_ability) is $23; the bit is set on some frames and clear on others."
