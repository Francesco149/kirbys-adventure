model = '''
def c5_kind(rd, wr):
    s = rd[0x6E]
    old = rd[0x6212 + s]
    bits = wr[4] & 3
    if bits:
        k = [0, 3, 2, 0][bits]
        return 0 if k == old else k
    r = (8 * wr[0x3E]) >> 8
    k = 1 if r < 4 else (2 if r < 6 else 3)
    return {1: 2, 2: 3, 3: 1}[k] if k == old else k
'''
expect = "wr[0x6212 + rd[0x6E]] == c5_kind(rd, wr)"
cases = { "ran('29:AB54')" = 1, "ran('29:AB5C')" = 1 }

