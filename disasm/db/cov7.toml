unit = "cov7"
title = "What the seventh coverage batch ran first: the Invincible Candy, the large star and Hammer in water, the Star Rod's bump, the sound test's wraps, and new paths of the blob, Meta Knight, the squids and other bosses"
summary = """
What the 13 movies of the seventh batch of coverage movies (cov7-*) ran for the first time and no other unit
documents; the new paths inside routines and scripts of other units are claimed here, and those units' texts point
here.

The Invincible Candy (cov7-l-candy, World 3 room 222, from w3-sonnet). Touching the item of type 5 with variable 2 = 2
(hit_item's value 2, 39:84E6) creates Kirby's effect $19 (kfx_candy), plays sound $10 and sets bit 6 of kirby_flags.
kfx_candy is entry $19 of kfx_start's jump table: it starts song 2 through snd_music_now (unit sound: the part of
snd_music after its test of bit 6, so the song starts although the bit is set), then 90 rounds of eight frames: a
star effect at Kirby (fx_create_rec, effect 0) every four frames and Kirby's colours (palette entries $10-$13) from
the four rows of kfx_candy_pal in turn. The movie went through a door after 48 rounds, which ended the effect; what
comes after the loop (16:B2C5: snd_song restarted, 30 slower rounds, kirby_pal_set and the bytes after it) never ran.
While bit 6 is set: hud_ability shows card $23 (the HYPER card, unit hud); pad_double_tap answers carry set whenever the
direction held is the one Kirby faces, without the double tap and without touching tap_timer (21:8A9B-8AAB, unit
khelp), so a held direction is a run; kirby_pal_row returns at once (21:9CE1, unit khelp2: the hook's and the
swallow's flashes leave the candy's colours alone); and when an enemy touches him hit_kirby calls hit_interrupt (unit
hit: the hit stop of his own attacks) in place of hurting him (39:8471).

Kirby elsewhere. The large star spat under water (cov7-l-pool, 1-1's pool): kfx_shot_big_tick finds water at the
star and gives it kfx_shot_big_water (16:B492), whose tick routine kfx_shot_big_water_tick slows its X velocity by
$20 a frame toward 0, adds $10 to the Y velocity (it sinks) and goes on as kfx_shot_big_tick does above water. The
Star Rod's dive landing (cov7-k-wiz): kirby_st_rod_dive's floor exit (17:A4C7) is script $87, kirby_s_rod_bump: kirby_action 5,
bump_kind $FF, sound $55, a star effect, pose $22, kirby_vy = -$02C0, and kirby_st_rod_bump: gravity profile $10, no
steering; a floor -> $7C, Up held -> $8D (inflate), water -> $92 (never ran). New exits of state routines of other
units (claims cov7.<state>.exits, which copy the owning unit's chain claim and add the new exit): kirby_st_jump_rise's
ladder (cov7-l-wheel), kirby_st_wheel_air's water (cov7-l-wheel), kirby_st_water_walk's wall, kirby_st_ab_water_walk's
wall and Select, kirby_st_ab_water_stand's Select, kirby_st_full_wade's stop, kirby_st_inhale_stop's water
(cov7-l-pool), kirby_st_hammer_water_stand's swim stroke, kirby_st_hammer_water_walk's swim stroke and Select
(cov7-l-hwater).

Objects. The light blue blob of bank 2B (type $23, cov7-k-blob): with Kirby near, after $3C frames a chance of one in
three (one in four when the count was 0) starts e23_hop (e23_tick_walk 2B:AB59-AB6F); in the corpus every hop hit the
ceiling of its niche in its first frame, and e23_tick_hop then cut it short (2B:AAB3: the landing half). The end of
e23_stand (2B:AA8C) also ran. Meta Knight (type $42, cov7-k-mk): action 0, e42_wait_walk (e42_timer_48: $0785 = $30,
then e42_walk), chosen by e42_next_walk; action $0C, e42_leap_slash (face Kirby, the leap of e42_leap with variable 3 =
7), chosen by e42_to_kirby_next; action 7, e42_air_slash, which e42_tick_jump starts at the top of that leap: one
slash in the air, then e42_tick_spin_fall's landing (e42_land_pause, and from there e42_reset_walk for the first
time). Paths in its routines: e42_shrug_pose with Kirby straight above, e42_other_side's carry, e42_hop_center's
carry into the Y velocity, e42_cape_vx with Kirby in the right half. The squids of 4-2's room 245 (type $1D,
cov7-k-squid): e1d_tick_lunge's landing (entry 3) and its count running out (entry 10, the lunge again),
e1d_tick_jump's and e1d_tick_walk's wall, e1d_lunge_time's near test and its entry 0; type $12's wall turn on a slope
(24:A97D). The shell mid-boss's random throw kinds 1 and 2 repeated (e4b_throw_kind, cov7-k-turtle); the wizard's
swoop ending far from Kirby (e4e_tick_swoop's script 4, e4e_swoop_halt, cov7-k-wiz); Dedede's end with Kirby away
(e47_tick_end's paths for variable 6 positive and for a turn, cov7-k-ddd); Kracko's late draw below 8 (e3d_watch
2F:A1D9, cov7-k-eye).

Menus. Select in the pause box (pause_exit_tick, cov7-l-pause); in the sound test (cov7-l-snd) Left, both numbers'
wraps in both directions, and B on the SOUND EFFECT row (snd_test_stop 3D:B0E5) and on rows with nothing started or
on QUIT (A = 1, 3D:B0F0).

Open:
- Never ran: kfx_candy after its first loop (16:B2C5-16:B2E4); kfx_shot_big_water_tick with a positive X velocity or
  one that reaches 0 (16:B4D0-B4DE, 16:B4EB), the Y velocity's carry (16:B500); e23_tick_hop's free rise (no ceiling:
  obj_gravity_a with $1F, 2B:ABA7) and its hit test answering carry (2B:AB90); kirby_st_rod_bump's water exit ($92);
  kirby_st_rod_dive's ceiling, flag-3, ladder, Up and water exits.
- What hit_interrupt does to the enemy that touched the invincible Kirby (it died in the movie) is in unit hit's
  reactions, not checked here.
"""

[[model]]
name = "cov7_go"
code = '''
def c7went(rd, wr, slot):
    """The script address that the thread of object `slot` (obj_first_thread + slot) was given in the call, or None."""
    t = rd.get(0x614C + slot)
    if t is None or (0x6380 + t) not in wr:
        return None
    return wr[0x6380 + t] | wr[0x63A0 + t] << 8

def c7w(d, lo, hi, o):
    return d[lo + o] | d[hi + o] << 8
'''

# ================================================================== the Invincible Candy

[[script]]
at = "16:B293"
name = "kfx_candy"
desc = """Kirby's effect $19 (entry $19 of kfx_start's jump table), created by hit_item for the Invincible Candy (item
variable 2 = 2): set_reg 2 and asm_w snd_music_now (song 2, past snd_music's test of bit 6 of kirby_flags), then $5A
rounds of: fx_create_rec with the record 00 00 00 00 (effect 0 at the effect's own place), asm_palette with
kfx_candy_pal row 0 (2 frames), row 1 (1 frame), fx_create_rec again, row 2 (2 frames), row 3 (1 frame): eight frames
a round. In cov7-l-candy (from 69555) 48 rounds ran before the door to room 223 ended it. The bytes after the loop
(16:B2C5: load_reg snd_song, asm_w snd_music_now, $1E rounds of the same with longer waits, asm_w kirby_pal_set and
more) never ran."""

[[data]]
at = "16:B2E5"
len = 16
name = "kfx_candy_pal"
format = "rows:4"
desc = """kfx_candy's four rows of Kirby's colours, palette entries $10-$13 ($FF leaves entry $10 alone): FF 36 26 0F,
FF 30 37 17, FF 17 07 0F, FF 38 37 30. Read by palette_load through asm_palette (cov7-l-candy only)."""

