[[claim]]
id = "kst_cov5.kfx_light_tick.paths"
about = ["kfx_light_tick"]
text = "Every call of kfx_light_tick changes the light's script (16:AE28) exactly as this model of its tests says: with variable 1 not 0 or $80, below $80 the screen X (world X - cam_x, low bytes) at $80 or more, above $80 the screen X below $81, sets it; then (variable 1 not $40 or $C0) below $40 or above $C0 a screen Y (world Y - cam_y) below $29, between them one of $28 or more. Calls with variable 1 not 0 and a set from the X test happen (cov5-h-light)."
kind = "call"
fn = "kfx_light_tick"
on = ["cov5-h-light@41292+110", "cov2-abilities-light@40935+40"]
model = '''
def light_set(rd):
    s = rd[0x6E]
    d = rd[0x61DC + s]
    sx = (rd[0x6074 + s] - rd[0xDD]) & 255
    sy = (rd[0x6098 + s] - rd[0xE0]) & 255
    if d not in (0, 0x80):
        if d < 0x80 and sx >= 0x80:
            return True
        if d > 0x80 and sx < 0x81:
            return True
    if d in (0x40, 0xC0):
        return False
    if d < 0x40 or d > 0xC0:
        return sy < 0x29
    return sy >= 0x28
'''
min_calls = 2
cases = { "ran('16:ADF8')" = 20, "ran('16:ADF8') and ran('16:AE28')" = 1, "rd[0x61DC + rd[0x6E]] == 0" = 20 }
expect = "(ran('16:AE28') > 0) == light_set(rd)"

