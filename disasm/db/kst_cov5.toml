def lim(wr):
    return (wr[0x5C8] | wr[0x5C9] << 8, wr[0x5CA] | wr[0x5CB] << 8, wr[0x5CC] | wr[0x5CD] << 8)

def camlim(rd):
    cx = rd[0xDD] | rd[0xDE] << 8
    cy = rd[0xE0] | rd[0xE1] << 8
    return (cx + 0x10 & 0xFFFF, cx + 0xEF & 0xFFFF, cy + 0x1C & 0xFFFF)

def integ(rd, lo, hi, frac, vlo, vhi):
    v = rd[vlo] | rd[vhi] << 8
    v = v - 0x10000 if v & 0x8000 else v
    return ((rd[hi] << 16 | rd[lo] << 8 | rd[frac]) + v >> 8) & 0xFFFF

def s16(v):
    return v - 0x10000 if v & 0x8000 else v

def locked(rd, wr, mem, calls):
    mn, mx, my = lim(wr)
    x = integ(rd, 0x83, 0x95, 0x71, 0x60E1, 0x60F3)
    y = integ(rd, 0xB9, 0xCB, 0xA7, 0x6105, 0x6117)
    pushes = 0
    if s16(x - mn & 0xFFFF) < 0:
        x = mn; pushes += 1
    elif s16(x - mx & 0xFFFF) >= 0:
        x = mx; pushes += 1
    if s16(y - my & 0xFFFF) < 0:
        y = my; pushes += 1
    return (lim(wr) == camlim(rd) and (mem(0x83) | mem(0x95) << 8) == x and (mem(0xB9) | mem(0xCB) << 8) == y
            and calls.count('kirby_edge_test') == 2 * pushes)
