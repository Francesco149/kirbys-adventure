unit = "kst_cov5"
title = "Kirby's states first run in the fifth batch of coverage movies: Back Drop's forward, backward and air throws, Hammer in the water, and the state exits and paths to them"
summary = """
What the cov5 movies made Kirby do for the first time in banks 14-19 and 21 (cov5-h-bd, cov5-h-hammer, cov5-h-full,
cov5-h-sw, cov5-h-para, cov5-h-ball, cov5-h-abdive, cov5-h-throw, cov5-h-light, cov5-h-rod, cov5-h-lock).

  state / place                    entry                        what it does
  Back Drop, move 2 (forward)      kirby_s_drop_fwd             kirby_speed $0200, kirby_vy $FC00 .. $0400 by script;
                                   kirby_st_drop_fwd            floor (while kirby_vy is not 0) -> $E2
                                                                kirby_s_drop_fwd_land: $05FC = 1, pose $18, recover
  Back Drop, move 4 (backward)     kirby_s_drop_back            kirby_speed $FE00, the same arc; floor -> $E3
                                   kirby_st_drop_back           kirby_s_drop_back_land: $05FC = 1, pose $10, recover
  Back Drop, move 6 (in the air)   kirby_s_drop_air             kirby_air_step; $05FC = 3, sound $4E, then the end of
                                   kirby_st_drop_air            the grab (16:A9B3: hurt timer 0, kirby_s_ab_reset)
  grab_choose's timeout            grab_timeout_moves           1, 3, 6, 6 by obj_frame & 3 (entry 3 read once)
  the enemy let go                 kfx_held_toss ($05FC 1),     Y velocity 4 (toss) or X 1 forward and Y 6 (flung),
                                   kfx_held_flung ($05FC 3),    then kfx_held_fall: obj_pos_cull, obj_move, and
                                   kfx_held_fall_tick           solid ground (shape 2-$0D) -> 16:BA9B (the drop's
                                                                quake and obj_s_beaten)
  Hammer, float into water ($AB)   kirby_s_hammer_float_water   kirby_in_water set; B -> $AD (the puff)
  Hammer, into water ($AE)         kirby_s_hammer_water_in      water_enter_init, splash 4, kirby_s_hammer_resume
  Hammer, swim ($B1)               kirby_s_hammer_swim          poses by swim_dir; B -> $A8, direction -> $B1,
                                   kirby_st_hammer_swim         water_left -> $B2
  Hammer, out of the water ($B2)   kirby_s_hammer_water_out     kirby_in_water cleared, splash 5, kirby_s_hammer_jump
  the second set's surface ($31)   kirby_s_ab_float_surface     kirby_in_water cleared, kirby_s_ab_float

Every state routine is a fixed chain of tests (units kst14, kst_abl): the first that answers yes names the next script;
the claims on the new routines use kpath of model kabl (unit kst_abl). Script numbers are kirby_script_lo indexes.

The rest of what the batch ran first in these banks are exits of state routines other units document (the dive hit
with and without an ability; the second set's float in water; Sword's float in water, wade and swim; Parasol's float
and float in water; the Star Rod's fall; Hammer's jump, fall, dive, air swing and float; the gulp and the full skid;
the full water stand; Ball's stand, roll and jump): the claims kst_cov5.<state>.exits run each routine's own chain claim
(copied, with its models) on windows of the cov5 movie around the new exits, require each new exit to happen, and check
that it leaves Kirby's thread at the script its number names (kc4go of model kcov4). The claims kst_cov5.<routine>.paths
and .model do the same for new paths of helpers: throw_up_test without Up (cov5-h-throw), kfx_thrown_vel facing left
and with Down, kfx_light_tick's X test and kfx_light_room in a lit room (cov5-h-light), kfx_shot_spin_tick's wall
exit, e05_star_tick_water's hit, water_spit_rect for poses $70 and above, kirby_spit_dir_test and kirby_spit_dir
(unit tail) answering for Up and Down (cov5-h-full), full_swim_gravity with Down (cov5-h-sw), grab_choose's timeout and
answers 2, 4, 6, kfx_held_tick for $05FC = 1, 3, 4 (cov5-h-bd, cov5-h-throw), and kirby_move_locked's right and top
limits (cov5-h-lock).

Open:
- Never ran: the water exits ($E1) of the three new Back Drop routines and of kfx_held_fall_tick's water test (16:BAA6);
  the tails of kirby_s_drop_fwd (16:A77D-A784) and kirby_s_drop_back (16:A7E7-A7EC), which the landing always cut;
  kfx_held_tick for $05FC = 5. In kirby_st_hammer_float_water water_left ($AC, 17:B5A1) and the door; in
  kirby_st_hammer_swim the floor ($97), door and Select exits; kirby_s_hammer_swim's entries 2-4 (17:B77A-B788) and its
  pose cycle's loop (17:B777); scripts $AF and $B0, Hammer's water stand and water walk, first ran in cov5-f-del@236581 (kirby_s_hammer_water_stand, kirby_s_hammer_water_walk, unit cov5_tour).
- What $05FC is beyond "what the held enemy does next" (1 toss, 2 drop, 3 flung, 4 freed, 5 16:BAB1, set by 16:A9C7 for a grab in water) is not named.
"""

[[data]]
at = "16:A6DC"
len = 4
name = "grab_timeout_moves"
format = "bytes"
desc = """grab_choose's move when variable 2 of slot 1 runs out, by obj_frame & 3: 1, 3, 6, 6 (Up, Down, the air throw
twice). Only entry 3 was read (cov5-h-bd@62605)."""

