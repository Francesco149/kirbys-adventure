[[claim]]
id = "inroom.prop.below"
about = ["block_prop_at"]
text = "The windows of inroom.prop.model contain calls of block_prop_at for a cell past the room or a Y of $6000 or more: they answer 0 or $30 and leave $10 and $12 alone."
kind = "call"
fn = "block_prop_at"
on = ["main@73050+8", "w12-opus@16345+8", "main@98696+8", "main@126330+8", "w1-v2-opus@10908+8"]
