[[claim]]
id = "inroom.prop.callers"
about = ["block_prop_at"]
text = "block_prop_at is called by door_find, 38:AAF8, 38:AD5E, 3F:EEB3, 3F:EEF1 and 3F:EF85, and by nothing else."
kind = "xref"
expect = "callers('block_prop_at') == {'door_find', '38:AAF8', '38:AD5E', '3F:EEB3', '3F:EEF1', '3F:EF85'}"

[[claim]]
id = "inroom.door.model"
about = ["door_find", "door_index", "door_kind", "room_doors"]
text = "Every call of door_find for a point in a cell inside the room returns the carry the model computes and writes to door_index, door_kind and $051D exactly what the model writes: nothing when the block's property is not $28 or $58 or no record of the room has the point's cell and position byte; else the record's number, (byte 3 & $70) | (byte 0 >> 4), and $051D = 0 unless the kind's low nibble is $A-$D and its test refuses the door; and the bank at $8000 is at the end what it was at entry."
kind = "call"
fn = "door_find"
on = ["main@1150+700", "w3-sonnet@516+1500", "main@100000+3000", "w12-opus@516+1500"]
where = "0x10 in wr"
min_calls = 150
max_calls = 400
expect = "ok(rd, wr, mem, romrd, x, y, rp)"
model = '''
def prop(rd, x, y):
    # block_prop_at for a cell inside the room -> (property, cell, Y inside the cell)
    row, rest = divmod(rd[0x4C] << 8 | y, 192)
    cell = rd[0x4B] + rd[0x676D + row] & 0xFF
    if rd[0x51E] >= 2:
        cell = cell + rd[0x67EE] & 0xFF
    p = rd[0x7F00 + rd[0x68C8 + 192 * rd[0x67F6 + cell] + (rest & 0xF0 | x >> 4)]]
    return (0 if p >= 0x7F else p), cell, rest

def find(rd, romrd, x, y):
    # -> (carry, writes to door_index, door_kind, $051D)
    p, cell, rest = prop(rd, x, y)
    if p not in (0x28, 0x58):
        return 0, {}
    if rd[0x51E] == 6:
        return 1, {0x56B: 0, 0x56C: 0, 0x51D: 0}
    room = rd[0x55E] | rd[0x55F] << 8
    pos = x & 0xF0 | rest >> 4
    lo, hi = O('room_doors_lo'), O('room_doors_hi')
    a = romrd[lo + room] | romrd[hi + room] << 8
    end = romrd[lo + room + 1] | romrd[hi + room + 1] << 8
    i = 0
    while True:
        if a == end:
            return 0, {}
        o = 0x12 << 13 | a & 0x1FFF
        if romrd[o] & 15 == cell and romrd[o + 1] == pos:
            break
        a += 5
        i += 1
    kind = romrd[o + 3] & 0x70 | romrd[o] >> 4
    w = {0x56B: i, 0x56C: kind}
    k = kind & 15
    if k == 0x0D and 1 << rd[0x558] == rd[0x7DC]:
        return 0, w
    if 0x0A <= k <= 0x0C and rd[0x531 + rd[0x558]] & 1 << k - 10:
        return 0, w
    w[0x51D] = 0
    return 1, w

def ok(rd, wr, mem, romrd, x, y, rp):
    c, w = find(rd, romrd, x, y)
    return (rp & 1 == c and {k: v for k, v in wr.items() if k in (0x56B, 0x56C, 0x51D)} == w
            and mem(0x48) == rd[0x48])
'''

[[claim]]
id = "inroom.door.cases"
about = ["door_find"]
text = "The windows of inroom.door.model contain calls of door_find that find a door and return carry set, with door_index and door_kind written."
kind = "call"
fn = "door_find"
on = ["main@1150+1200", "w3-sonnet@516+3000"]
min_calls = 5
max_calls = 800
where = "rp & 1"
expect = "0x56B in wr and 0x56C in wr and wr[0x51D] == 0"

