kind = "xref"
expect = "callers('door_find') == {'15:BC5E', '21:8A15'} and 'door_find' in writers('door_index') and 'door_find' in writers('door_kind') and '15:BC5E' in writers('door_index')"

[[claim]]
id = "inroom.col.model"
about = ["objs_spawn_col", "objs_ends", "objs_xy", "objs_cells"]
text = "Every call of objs_spawn_col calls objs_spawn exactly as often as the model counts objects: over 11 blocks down from the block at pixel $11, $12 of cell $4B + room_row_cell[$4C] (after block row 15: row 0, one room row and room_width cells further), for each block with row < room_height and cell < objs_cells, the entries of objs_xy from objs_ends[cell - 1] (0 for cell 0) to objs_ends[cell] that equal the block's position byte. $4C ends higher by the room rows crossed, and the banks at $8000 and $A000 are at the end what they were at entry. With $4B not less than room_width it calls nothing and writes nothing."
kind = "call"
fn = "objs_spawn_col"
on = ["main@562+600", "w3-sonnet@700+600", "attract@1240+300", "main@100000+1500"]
min_calls = 60
max_calls = 120
expect = "col(rd, wr, mem, romrd, calls)"
model = '''
def col(rd, wr, mem, romrd, calls):
    if rd[0x4B] >= rd[0x67EE]:
        return not calls and not wr
    bank = rd[0x57D]
    ends = rd[0xED] | rd[0xEE] << 8
    R = lambda a: romrd[bank << 13 | a & 0x1FFF]
    row = rd[0x4C]
    cell = rd[0x4B] + rd[0x676D + row] & 0xFF
    pos = rd[0x11] & 0xF0 | rd[0x12] >> 4
    n = 0
    for _ in range(11):
        if row < rd[0x67EF] and cell < rd[0x57E]:
            first = R(ends + cell - 1) if cell else 0
            last = R(ends + cell)
            if first < last:
                xy = rd[0xEF] | rd[0xF0] << 8
                n += sum(R(xy + i) == pos for i in range(first, last))
        pos = pos + 1 & 0xFF
        if not pos & 15:
            pos = pos - 16 & 0xFF
            row += 1
            cell = cell + rd[0x67EE] & 0xFF
    return (calls.count('objs_spawn') == n and wr.get(0x4C, rd[0x4C]) == row & 0xFF
            and mem(0x48) == rd[0x48] and mem(0x49) == rd[0x49])
'''

