[[claim]]
id = "video.irq_hud.model"
about = ["irq_hud", "hud_chr", "hud_anim", "hud_anim_wait", "hud_anim_period", "bg_anim", "bg_anim_wait", "bg_anim_bank", "band_x", "band_x_hi", "band_y_lo", "band_y_hi", "split_lines", "split_x", "split_next", "split_count", "irq_stub"]
text = "Every run of irq_hud writes, besides the stack, exactly what the model writes: the last register values ($8001 = hud_chr + 1, PPUADDR $C0, PPUSCROLL 0, $8000 = mmc3_select); the status bar animation (hud_anim_wait, hud_anim, hud_chr + 0) unless $058A is not 0; the background animation (bg_anim_wait, bg_anim, chr_bank + 5) when $67F5 is not 0; and in modes 2 and 3 the band positions, split_x, split_next, split_count, split_lines and the stub's operands as the model computes them from cam_y and band_y. X and Y return unchanged."
kind = "call"
fn = "irq_hud"
on = ["main@3000+300", "w3-sonnet@3600+300", "main@130463+600", "main@137541+200", "main@133568+100"]
min_calls = 1000
max_calls = 600
use = ["video_ppu"]
cases = { "rd[0x181] == 2" = 300, "rd[0x181] == 3" = 100, "rd[0x181] == 1" = 300, "rd[0x67F5] != 0" = 100, "0x588 in wr" = 20, "rd[0x181] in (2, 3) and 0x66 in wr and wr[0x66] == 0" = 20, "rd[0x181] in (2, 3) and wr.get(0x66, 0) >= 2" = 20 }
expect = "nostack(wr) == hud(rd, romrd) and rx == x and ry == y"
model = '''
def bands(rd, tab):
    z = {}
    g = lambda k: z[k] if k in z else rd[k]
    m = rd[0x181]
    for i in range(7, 0, -1):
        z[0x52 + i] = g(0x52 + i) + (i if m == 2 else -i) & 0xFF
    if m == 2 and z[0x53] == 0:
        z[0x5A] = rd[0x5A] + 1 & 0xFF
    if m == 3 and z[0x53] == 0xFF:
        z[0x5A] = rd[0x5A] - 1 & 0xFF
    v = g(0x5A) << 8 | z[0x53]
    z[0x52] = v >> 1 & 0xFF
    z[0x51] = v >> 2 & 0xFF
    cam = rd[0xE0] | rd[0xE1] << 8
    top = 8
    while top >= 0 and (cam & 0xFFFE) < tab(top):
        top -= 1
    z[0x60] = g(0x51 + top) if top >= 0 else 0
    first = top + 1
    z[0x65] = first
    cnt = 0
    for i in range(first, 9):
        d = tab(i) - cam & 0xFFFF
        if d < 0x100 and (d | 1) < 0xAD:
            cnt += 1
    z[0x66] = cnt
    if cnt == 0:
        z.update({0x30: 0x01, 0x31: 0x20, 0x2B: rd[0x36] & 0xEF, 0x5B: 0xB1, 0x33: 0x40, 0x34: 0xF9})
        return z
    for i in range(cnt):
        z[0x5B + i] = (tab(first + i) - cam & 0xFF) | 1
        z[0x61 + i] = g(0x51 + first + i)
    z[0x5E] = g(0x5A + cnt)
    z[0x64] = g(0x60 + cnt)
    for i in range(cnt, 4):
        z[0x60 + i] = g(0x5F + i)
    i = 3
    while i >= cnt and i > 0:
        v = g(0x5B + i)
        borrow = 0 if v >= 2 else 1
        v = v - 2 & 0xFF
        z[0x5B + i] = v
        z[0x5A + i] = v - 6 - borrow & 0xFF
        i -= 1
    z[0x5C] = g(0x5C) & 0xFE
    z[0x5E] = g(0x5E) & 0xFE
    z[0x5F] = 0xAD
    for i in range(4, 0, -1):
        z[0x5B + i] = g(0x5B + i) - g(0x5A + i) & 0xFF
    z.update({0x30: 0x00, 0x31: 0xE0, 0x33: 0x86, 0x34: 0xFB})
    return z

def hud(rd, romrd):
    w = {0x8000: rd[0x38], 0x8001: rd[0x4E], 0x2006: 0xC0, 0x2005: 0}
    if not rd[0x58A]:
        v = rd[0x597]
        if v & 0x80:
            v = 0
        c = rd[0x589] + 1 & 0xFF
        k = rd[0x588]
        if c >= romrd[O('hud_anim_period') + min(v >> 3, 3)]:
            c = 0
            k = k + 1 & 0xFF
            w[0x588] = k
        w[0x589] = c
        w[0x4D] = 0x7A + (k & 3)
    if rd[0x67F5]:
        c = rd[0x58D] + 1 & 0xFF
        if c >= rd[0x67F5]:
            b = rd[0x58C] + 1 & 3
            w[0x58C] = b
            w[0x47] = b + rd[0x58E] & 0xFF
            c = 0
        w[0x58D] = c
    if rd[0x181] in (2, 3):
        w.update(bands(rd, lambda i: romrd[O('band_y_lo') + i] | romrd[O('band_y_hi') + i] << 8))
    return w
'''

