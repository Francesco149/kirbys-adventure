kind = "call"
fn = "split_setup"
on = ["main@60+300", "main@3000+100", "main@130455+150", "main@133560+100", "main@137535+100", "w12-opus@170+120"]
min_calls = 700
max_calls = 300
cases = { "rd[0x180] == 0" = 20, "rd[0x180] == 1" = 100, "rd[0x180] == 2 and rd[0x181] == 2" = 100, "rd[0x180] == 3 and rd[0x181] == 3" = 50, "rd[0x180] in (2, 3) and rd[0x181] != rd[0x180]" = 2, "rd[0x180] == 5" = 50, "rd[0x180] == 6" = 40 }
expect = "wr == split(rd, romrd, a)"
model = '''
def split(rd, romrd, acc):
    m = rd[0x180]
    if m >= 7:
        return {0x181: m, 0xE000: acc}
    w = {0x1C: romrd[O('split_setup_lo') + m], 0x1D: romrd[O('split_setup_hi') + m]}
    hud = {0x181: m, 0x30: 0x01, 0x31: 0x20, 0x2B: rd.get(0x36, 0) & 0xEF, 0x33: 0x40, 0x34: 0xF9,
           0xC000: 0xAF, 0xC001: 0xAF, 0xE001: 0xAF}
    if m == 0:
        w.update({0x181: 0, 0xE000: w[0x1D]})
    elif m == 1:
        w.update(hud)
    elif m in (2, 3):
        if rd[0x181] != m:
            w.update(hud)
        else:
            w.update({0x2005: rd[0xEA], 0x65: 1, 0xC000: rd[0x5B], 0xC001: rd[0x5B], 0xE001: rd[0x5B]})
    elif m == 5:
        w.update(hud)
        w.update({0x60: rd[0x60] + 7 & 0xFF, 0x2005: rd[0xEA]})
    elif m == 6:
        k = rd[0x65]
        v = 0xEF - k
        borrow = 1 if v < 0 else 0
        v = (v & 0xFF) - k - borrow & 0xFF
        w.update({0x181: 6, 0x30: 0x00, 0x31: 0xE0, 0x33: 0xBF, 0x34: 0xFB, 0xC000: v, 0xC001: v, 0xE001: v})
    return w
'''

