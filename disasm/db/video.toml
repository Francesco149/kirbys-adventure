unit = "video"
title = "Interrupts and low-level video: NMI, the IRQ screen splits, scroll registers, PPU records, palette fades"
summary = """The three vectors: NMI = nmi (3E:C341), reset = reset (3F:FFF0), IRQ = $0029, which is RAM. reset maps bank 0
and jumps to boot, which silences the hardware, waits for two vertical blanks, sets the stack and far-calls
video_init (bank 18); video_init clears the video state, copies the twelve bytes of irq_stub_init to irq_stub
($29-$34) and turns the NMI on. irq_stub is the IRQ handler: pha / lda #imm / sta $E000 (the mapper's IRQ off) /
sta abs / jmp abs, and the code patches three of its operands: the immediate ($2B), the address of the second
store ($30/$31: $2001, so that the immediate becomes PPUMASK, or $E000 again) and the jump target ($33/$34).
nmi runs once per frame: PPUMASK = ppumask & render_on; with the picture on it sends the finished sprite buffer,
has ppu_flush send queued writes, scroll_send write the scroll registers, split_setup arm the mapper's scanline
counter for this frame's split, and chr_banks_apply set the CHR banks; then frame_flag, the joypad and the sound.
split_setup dispatches on split_mode: 0 (and 7 or more) no split; 1 the status bar (IRQ after $AF lines, irq_hud);
2 and 3 bands that scroll at different speeds above the status bar (irq_band for up to four band edges, then
irq_hud); 5 a picture that scrolls 7 pixels per frame by itself above the status bar; 6 a split low on the screen
whose line depends on $65 (the file select screen; irq_low). irq_hud switches to the status bar: CHR registers 2-5
from hud_chr, PPU address $0AC0, scroll 0, the stub's immediate (ppumask without the sprite bit) having gone to
PPUMASK; it then steps two animations (hud_anim, bg_anim) and, in modes 2 and 3, moves the nine band positions
band_x and computes next frame's split lines and scroll values from cam_y and the table band_y.
Below the interrupts: scroll_send (the scroll registers from scroll_x / scroll_y, or from the camera when $051E
is 0, plus scroll_add_x / scroll_add_y), nmi_on / nmi_off, display_off, nt_addr (tile column, row -> name table
address), ppu_record (a seven-byte record: mode, PPU address, length, count, source -> a series of ppu_write
calls: rows, columns or fills) and ppu_record_inline (the record's address follows the jsr), mirror_horiz, the
palette with fading (palette_base is the palette as loaded, fade_level -4..4 darkens or brightens it through
color_fade on the way to ppu_write; palette_load, palette_show, palette_show_bg, fade_up, fade_down, fade_set,
fade_reset), div_recip (a 16-bit value times 256 / Y, by table) and bit_mask.

Open: split mode 4 (3E:CAF7, latch $9F, handler 3F:FB43) never ran. In irq_hud the path for $059E not 0
(3F:F9BA-F9E1, another animation of chr_bank+5) never ran. The soft reset in nmi (all of A, B, Select, Start held
for 16 frames -> reset) never ran, so reset and boot were only seen at power-on; boot's jump target 3F:E3E4 and
the far-call helper 3E:D805 are not in this unit. The PPU is not in the event log: the stack is not either, so ppu_record_inline's handling of the return address
is read from the code. The X scroll value, the order of the two PPUSCROLL / PPUADDR writes and what the splits look like are read from the code, not checked; claims
check the last value written to each register. What $051E, $0597 (it selects the speed of hud_anim), $058A (it
stops hud_anim), $65 outside modes 2/3 (the script opcode set_mem8 and 3D:B7DD write it; mode 6 takes its line
from it) and $13 in scroll_send mean is not known here. ppu_record's paths: fill records (mode 2 or 5) are in the
model but no case requires them; a count of 0 would mean 256. nt_addr's branches for columns or rows of 32 and
more ($2400, $2800) never ran. fade_up's and fade_down's clamps at 4 and -4 never ran. div_recip's table entries
are 256 / n rounded down, so the quotient is low for most divisors; whether callers correct it is not known.
mirror_horiz has a second entry at 3E:C431 (A = the value) that ran once. The bytes 3E:C9E7-CABD (code and tables
for attribute fields) and 3E:CAC6-CACD never ran. The writers of ppumask, split_mode, fade_level and palette_base outside this
unit (room code, bank 34/36/3B/3D routines, scripts) are not described."""

# ------------------------------------------------------------------ vectors, reset

[[data]]
at = "3F:FFFA"
len = 6
name = "vectors"
format = "ptr16"
desc = "The CPU's vectors: NMI = nmi, reset = reset, IRQ = $0029 (irq_stub, in RAM)."

[[sym]]
at = "3F:FFF0"
name = "reset"
desc = "The reset vector's target: interrupts off, mapper bank select = 0, jump to boot. nmi jumps here for a soft reset."

[[sym]]
at = "3E:C000"
kind = "part"
name = "boot"
desc = "Power-on setup: PPUCTRL = $08, PPUMASK = $18 then 0, the DMC and the frame counter's and the mapper's IRQs off, soft_reset_count = 16, sixteen pairs of PPUADDR writes ($10, $00 alternating), two waits for the start of a vertical blank, decimal off, stack pointer $FF, mmc3_select = $80, PRG RAM on ($A001 = $80), then a far call (3E:D805, target in boot_far_arg) of video_init and a jump to 3F:E3E4."

[[data]]
at = "3E:C051"
len = 3
name = "boot_far_arg"
format = "bytes"
desc = "The bytes behind boot's call of the far-call helper 3E:D805: address $A000, bank $18 (video_init)."

[[sym]]
at = "3E:C054"
kind = "part"
name = "boot_tail"
desc = "Where the far call of video_init returns: jmp 3F:E3E4."

[[sym]]
at = "18:A000"
name = "video_init"
desc = "Clears render_on, ppu_queue_start, ppu_queue_end, palette_dirty, split_mode, split_mode_set, $051E, scroll_add_x, scroll_add_y, sprites_taken, obj_frame, joypad_new, kirby_flags and $F5; copies the 12 bytes of irq_stub_init to irq_stub; rng_state = $7777; ppumask = $18, ppuctrl = $28; initialises the sound (3F:F804) and ends in nmi_on, so ppuctrl and PPUCTRL become $A8."

[[data]]
at = "18:A045"
len = 12
name = "irq_stub_init"
format = "bytes"
desc = "The IRQ handler that video_init copies to irq_stub: pha / lda #$00 / sta $E000 / sta $2001 / jmp $0000."

[[ram]]
at = "0029"
len = 12
name = "irq_stub"
desc = "The IRQ handler, in RAM: $29 pha; $2A lda #imm (imm at $2B); $2C sta $E000 (mapper IRQ off and acknowledged); $2F sta abs (address at $30/$31: $2001 = PPUMASK, or $E000); $32 jmp abs (target at $33/$34: irq_hud, irq_band or irq_low). split_hud, split_low, irq_hud and irq_band rewrite $2B, $30/$31 and $33/$34."

# ------------------------------------------------------------------ the NMI

[[sym]]
at = "3E:C341"
name = "nmi"
desc = """The NMI routine, once per frame. Saves A, X, Y. PPUMASK = ppumask & render_on, and the same value to $E000 (mapper IRQ off). When that is not 0: OAMADDR = 0 and a sprite DMA of the page sprite_buf_page[obj_frame & 1]; ppu_flush with A = $6A; scroll_send; split_setup; chr_banks_apply; sprites_taken = 1. When it is 0: ppu_queue_start = ppu_queue_end (the queue is dropped). Then frame_flag + 1, joypad_poll, the sound's frame (3F:F8A0), the soft reset check (soft_reset_count = 16 unless A, B, Select and Start are all held), the mapper's bank select restored from mmc3_select, registers restored, rti."""
comments = { "C346" = "PPUMASK", "C352" = "picture on: sprites, queue, scroll, split, CHR banks", "C378" = "picture off: drop the queue", "C397" = "the bank select register as the interrupted code left it" }

[[sym]]
at = "3E:C3A4"
name = "scroll_send"
desc = """Writes the scroll registers, for nmi. PPUADDR = 0 twice. With $051E not 0: PPUSCROLL = scroll_x (low byte) + scroll_add_x, then scroll_y + scroll_add_y; PPUCTRL = ppuctrl & $FC (name table 0). With $051E = 0: PPUSCROLL = cam_x + scroll_add_x, then cam_y + scroll_add_y (low bytes); ppuctrl = PPUCTRL = ppuctrl & $FC | bit 0 of cam_y's high byte * 2 | bit 0 of cam_x's high byte; $13 is used. The path for $051E = 7 (ppuctrl & $FC stored and sent, no scroll) never ran."""
comments = { "C3B1" = "$051E = 0: the camera, name table from its high bytes", "C3DD" = "scroll_x, scroll_y", "C3F7" = "$051E = 7: never ran" }

[[ram]]
at = "0035"
name = "ppuctrl"
desc = "Copy of PPUCTRL. video_init stores $28 (sprites 8x16, sprite patterns at $1000); bit 7 (NMI on) is set by nmi_on and cleared by nmi_off; scroll_send puts the name table in bits 0-1 when $051E is 0. ppu_write and ppu_flush send it with bit 2 changed."

[[ram]]
at = "0036"
name = "ppumask"
desc = "Copy of PPUMASK: nmi sends ppumask & render_on. The split handlers put ppumask & $EF (sprites off) in the IRQ stub for the status bar. video_init stores $18."

[[ram]]
at = "01A3"
name = "scroll_add_x"
desc = "Added to the X scroll by scroll_send. 3F:E298 clears it and 3F:E2A1 adds a script argument to it."

[[ram]]
at = "01A4"
name = "scroll_add_y"
desc = "Added to the Y scroll by scroll_send. 3F:E298 clears it and 3F:E2A1 adds a script argument to it."

# ------------------------------------------------------------------ small helpers

[[sym]]
at = "3E:C057"
name = "nmi_off"
desc = "ppuctrl = PPUCTRL = ppuctrl & $7F: no more NMIs."

[[sym]]
at = "3E:C061"
kind = "part"
name = "nmi_on"
desc = "ppuctrl = PPUCTRL = ppuctrl | $80: an NMI at every vertical blank. Shares its last three instructions with nmi_off."

[[sym]]
at = "3E:C082"
name = "display_off"
desc = "Sets render_on to 0 and continues as frame_wait (3E:C088, 3E:C067): from the next NMI the picture is off and ppu_write writes directly."

[[sym]]
at = "3E:C08D"
name = "nt_addr"
desc = "The name table address of a tile: low byte = (row * 32 + (column & 31)) & $FF in A, high byte = $20 + row / 8 in X. The branches for a column or a row of 32 and more (tables $2400, $2800) never ran. $00 and $01 are used."
in = "X = tile column, Y = tile row"
out = "A = low byte, X = high byte of the PPU address"

[[sym]]
at = "3E:C42F"
name = "mirror_horiz"
desc = "Stores 1 in mirroring and in the mapper's mirroring register $A000 (twice): horizontal mirroring, name tables $2000 and $2800 one above the other. 3E:C431 is an entry with the value in A."

[[ram]]
at = "004A"
name = "mirroring"
desc = "The value last written to the mapper's mirroring register by mirror_horiz. Nothing in the corpus reads it."

[[data]]
at = "3E:CABE"
len = 8
name = "bit_mask"
format = "bytes"
desc = "1 << n for n = 0..7. Read by 13:AC94."

[[sym]]
at = "3E:C56B"
name = "div_recip"
desc = "Multiplies the 16-bit value X:A (X high) by recip_tab[Y - 2] = 256 / Y and drops the low byte of the product: an approximate division by Y. With Y below 2 the value is returned unchanged. Two calls of mul8; $10 and $11 are used."
in = "X:A = value (X high), Y = divisor"
out = "X:A = (value * (256 / Y)) >> 8"

[[data]]
at = "3E:C59A"
len = 254
name = "recip_tab"
format = "rows:16"
desc = "256 / n rounded down, for n = 2..255. Read by div_recip."

# ------------------------------------------------------------------ PPU records

[[sym]]
at = "3E:C0BE"
name = "ppu_record_inline"
inline = 2
desc = "ppu_record for the record whose address is in the two bytes after the jsr: takes the return address off the stack, puts it back two higher, loads the address and falls into ppu_record."

[[sym]]
at = "3E:C0DA"
name = "ppu_record"
desc = """Turns a record into ppu_write calls. The record: mode, PPU address low, high, length, count, then either the data itself (mode 0-2) or the address of the data (mode 3-5, which then act as 0-2). Mode 0 (rows): count calls of ppu_write with length bytes each, the source moving on by length and the PPU address by 32. Mode 2 (fill): count calls that write the first source byte length times ($00 = 2), the address moving on by 32. Mode 1 (columns): bit 7 is set in the address high byte (ppu_write steps by 32), and length calls write count bytes each, the source moving on by count and the address by 1 (low byte only). Leaves $00-$04, $16, $17 changed."""
in = "A = low byte, X = high byte of the record's address"
comments = { "C0F9" = "mode 3 and up: the source is an address", "C0FF" = "mode 0-2: the data follows the header", "C127" = "rows or fills", "C14B" = "columns" }

# ------------------------------------------------------------------ palette and fading

[[sym]]
at = "3E:C90E"
name = "palette_load"
desc = "Loads Y colours from ($18) into palette_base + A; a source byte with bit 7 set leaves the entry as it was. Then the Y entries, each through color_fade with fade_level, go to $0100 and from there with ppu_write to PPU $3F00 + A (ppu_write keeps them in palette)."
in = "A = first palette index (0-31), Y = number of colours, $18/$19 = source"

[[sym]]
at = "3E:C94C"
name = "fade_up"
desc = "fade_level + 1 (a level of 5 or more would become 4; that never ran), then palette_show."

[[sym]]
at = "3E:C95B"
kind = "part"
name = "palette_show"
desc = "Sends the whole palette at the current fade: color_fade of each of the 32 bytes of palette_base with X = fade_level into $0100, then ppu_record with palette_show_rec (32 bytes from $0100 to $3F00). X must hold fade_level on entry."

[[data]]
at = "3E:C970"
len = 7
name = "palette_show_rec"
format = "rows:7"
desc = "palette_show's record: mode 3, PPU $3F00, 32 bytes, once, from $0100."

[[sym]]
at = "3E:C977"
name = "palette_show_bg"
desc = "Sends the background half of the palette at the current fade: color_fade of palette_base bytes 0-15 into $0100, then ppu_record with palette_bg_rec (16 bytes from $0100 to $3F00)."

[[data]]
at = "3E:C98F"
len = 7
name = "palette_bg_rec"
format = "rows:7"
desc = "palette_show_bg's record: mode 3, PPU $3F00, 16 bytes, once, from $0100."

[[sym]]
at = "3E:C996"
name = "fade_down"
desc = "fade_level - 1 (a level below -4 would become -4; that never ran), then palette_show."

[[sym]]
at = "3E:C9A8"
name = "fade_reset"
desc = "fade_set with A = 0: the palette as loaded."

[[sym]]
at = "3E:C9AA"
name = "fade_set"
desc = "fade_level = A, then palette_show."
in = "A = fade level"

[[sym]]
at = "3E:C9B1"
name = "color_fade"
desc = "One colour at a fade level. Level 0-4: colour $0F counts as $F0, fade_steps[level] (16 per level) is added, $F0 becomes $0F again and anything from $40 up becomes $30 (white). Level negative: 16 per level is subtracted and a result below 0 becomes $0F (black); $11 is used. X and Y are preserved."
in = "A = colour, X = fade level (-4..4)"
out = "A = the colour to show"

[[data]]
at = "3E:C9E2"
len = 5
name = "fade_steps"
format = "bytes"
desc = "color_fade's step by level 0-4 (or minus the level): 0, $10, $20, $30, $40."

[[ram]]
at = "0182"
len = 32
name = "palette_base"
desc = "The palette as loaded, before fading: 32 colours in the order of PPU $3F00-$3F1F. palette_load writes it, and so do room_draw, bg_palette, 19:ACA2 and four routines of bank 2F directly; palette_show and palette_show_bg send it through color_fade."

[[ram]]
at = "01A2"
name = "fade_level"
desc = "Fade level, signed: 0 shows palette_base as it is, 1..4 brighten by one row of the colour table per level, -1..-4 darken. fade_up, fade_down and fade_set change it and resend the palette; other code stores it directly."

# ------------------------------------------------------------------ the split: setup in the NMI

[[sym]]
at = "3E:CACE"
name = "split_setup"
desc = "Called by nmi: jumps to the routine for split_mode through split_setup_lo / split_setup_hi ($1C/$1D): 0 split_off, 1 split_hud, 2 and 3 split_bands, 4 3E:CAF7 (never ran), 5 split_stars, 6 split_low; 7 and more go to split_off."

[[data]]
at = "3E:CAE2"
len = 7
name = "split_setup_lo"
format = "bytes"
desc = "Low bytes of split_setup's routines, by split_mode 0-6."

[[data]]
at = "3E:CAE9"
len = 7
name = "split_setup_hi"
format = "bytes"
desc = "High bytes of split_setup's routines, by split_mode 0-6."

[[sym]]
at = "3E:CAF0"
name = "split_off"
desc = "No split this frame: split_mode_set = Y (the mode) and a write to $E000 (mapper IRQ off)."

[[sym]]
at = "3E:CB0B"
name = "split_stars"
desc = "Mode 5: split_x + 0 moves on by 7 and is written to PPUSCROLL as X with scroll_y as Y, then split_hud. The picture above the status bar scrolls 7 pixels per frame."

[[sym]]
at = "3E:CB1A"
name = "split_hud"
desc = "Mode 1, the status bar: split_mode_set = Y; the IRQ stub gets sta $2001 with the immediate ppumask & $EF and the target irq_hud; the mapper's IRQ latch = $AF, reload, enable; cli. Its end from 3E:CB62 (target from Y, X) and 3E:CB66 (latch from A) is shared by split_bands and split_low."

[[sym]]
at = "3E:CB34"
name = "split_bands"
desc = "Modes 2 and 3. When split_mode_set is not yet the mode: split_hud. Otherwise PPUSCROLL = split_x + 0 as X and scroll_y as Y (the top band), split_next = 1, and the IRQ latch = split_lines + 0, the first line computed by irq_hud in the frame before; the stub is left as irq_hud set it."

[[sym]]
at = "3E:CB4C"
name = "split_low"
desc = "Mode 6: split_mode_set = Y; the stub gets sta $E000 and the target irq_low; the IRQ latch = $EF - 2 * $65."

[[ram]]
at = "0180"
name = "split_mode"
desc = "Which screen split the NMI sets up: 0 none, 1 the status bar, 2 and 3 scrolling bands above the status bar (2 moves them one way, 3 the other), 5 a self-scrolling picture above the status bar, 6 a split low on the screen (file select). Written by room and screen setup code and by scripts."

[[ram]]
at = "0181"
name = "split_mode_set"
desc = "The split_mode that the NMI last set up (written by split_off, split_hud, split_low). irq_hud does the bands' work when it is 2 or 3; split_bands compares it with split_mode to see whether irq_hud has prepared the lines."

# ------------------------------------------------------------------ the split: IRQ handlers

[[sym]]
at = "3F:F940"
kind = "part"
name = "irq_hud"
desc = """The IRQ handler at the top of the status bar (entered from irq_stub with A pushed). After a delay loop: CHR registers 5, 4 from hud_chr + 3, + 2; PPUADDR = $0AC0, PPUSCROLL = 0, 0; CHR registers 2, 3 from hud_chr + 0, + 1. Then, unless $058A is not 0: hud_anim_wait + 1, and when it reaches hud_anim_period[min($0597 / 8, 3)] (a negative $0597 counts as 0) it restarts and hud_anim + 1; hud_chr + 0 = $7A + (hud_anim & 3). Then, when the room's byte $67F5 is not 0: bg_anim_wait + 1, and when it reaches $67F5 it restarts, bg_anim = (bg_anim + 1) & 3 and chr_bank + 5 = bg_anim + bg_anim_bank. Then, when split_mode_set is 2 or 3: band_x + n moves by n for n = 2..8 (mode 2 adds, mode 3 subtracts), band_x_hi extends band_x + 2 to 10 bits, band_x + 1 and band_x + 0 are half and a quarter of that; the last entry of band_y at or below cam_y gives the top band (split_x + 0, 0 above the first); the band edges that follow and lie less than $AD lines below cam_y become split_lines (as line counts between IRQs, padded to four with short steps before the last and closed with the line of the status bar) and their band_x values split_x + 1..4, and the stub is pointed at irq_band; with no edge on screen the stub stays on irq_hud with split_lines + 0 = $B1. Restores the bank select register from mmc3_select."""
comments = { "F948" = "CHR registers 5, 4, then the address of the bar, then registers 2, 3", "F982" = "the status bar's animation", "F9BA" = "$059E not 0: never ran", "F9E4" = "the room's background animation", "FA09" = "modes 2 and 3 only", "FA22" = "mode 2: positions move up", "FA34" = "mode 3: positions move down", "FA57" = "the band at the top of the screen", "FA75" = "count the edges on screen", "FA99" = "lines and positions of the edges", "FAE7" = "lines -> differences", "FB06" = "no edge on screen: status bar only" }

[[data]]
at = "3F:FB2B"
len = 4
name = "hud_anim_period"
format = "bytes"
desc = "Frames per step of hud_anim, by min($0597 / 8, 3): 5, 8, 11, 16."

[[data]]
at = "3F:FB2F"
len = 9
name = "band_y_lo"
format = "bytes"
desc = "Low bytes of band_y: the nine Y positions in the room where a band begins."

[[data]]
at = "3F:FB39"
len = 9
name = "band_y_hi"
format = "bytes"
desc = "High bytes of band_y: $00CE, $00FF, $012F, $015E, $01AD, $020E, $027D, $02FC, $0380."

[[sym]]
at = "3F:FB86"
kind = "part"
name = "irq_band"
desc = "The IRQ handler at a band edge: IRQ latch = split_lines[split_next] (reload, enable), PPUSCROLL = split_x[split_next] twice, split_next + 1; when that reaches 5 the stub is set back to sta $2001 with ppumask & $EF and the target irq_hud. Restores the bank select register."

[[sym]]
at = "3F:FBBF"
kind = "part"
name = "irq_low"
desc = "The IRQ handler of mode 6: after a delay loop PPUADDR = $0000, PPUSCROLL = 0, 0 and CHR registers 2-5 = $DA, $DB, $3F, $DA. Restores the bank select register."

[[ram]]
at = "004D"
len = 4
name = "hud_chr"
desc = "The CHR banks of the status bar: irq_hud writes them to the mapper's registers 2, 3, 4, 5. irq_hud sets the first to $7A + (hud_anim & 3); bank 13 code writes the others."

[[ram]]
at = "0051"
len = 9
name = "band_x"
desc = "Scroll positions of the bands in modes 2 and 3, by speed: entries 2-8 move 1-7 pixels per frame, entry 1 is half and entry 0 a quarter of entry 2's 10-bit position. Written by irq_hud."

[[ram]]
at = "005A"
name = "band_x_hi"
desc = "Bits 8 and 9 of band_x + 2: counts its wraps, so that the half and quarter speeds stay continuous."

[[ram]]
at = "005B"
len = 5
name = "split_lines"
desc = "Modes 2 and 3: the IRQ latch values of a frame, the first for split_bands, the next four for irq_band; the last step ends at the status bar. Computed by irq_hud for the next frame. $B1 in the first when no band edge is on screen."

[[ram]]
at = "0060"
len = 5
name = "split_x"
desc = "Modes 2 and 3: the X scroll of the top band (split_bands) and of the band after each of the four IRQs (irq_band). Mode 5: the first byte is the picture's X scroll, moved by split_stars."

[[ram]]
at = "0065"
name = "split_next"
desc = "Modes 2 and 3: index of the next entry of split_lines / split_x for irq_band; split_bands sets 1, irq_hud leaves the number of the top band + 1 in it. In mode 6 split_low takes the split's line from it; other code writes it then."

[[ram]]
at = "0066"
name = "split_count"
desc = "Modes 2 and 3: the number of band edges on screen that irq_hud found (0-4)."

[[ram]]
at = "0588"
name = "hud_anim"
desc = "Step counter of the status bar's animation: its low two bits pick the CHR bank $7A-$7D in hud_chr + 0."

[[ram]]
at = "0589"
name = "hud_anim_wait"
desc = "Frames since hud_anim last stepped; compared with hud_anim_period."

[[ram]]
at = "058C"
name = "bg_anim"
desc = "Phase 0-3 of the room's background animation: chr_bank + 5 = bg_anim + bg_anim_bank."

[[ram]]
at = "058D"
name = "bg_anim_wait"
desc = "Frames since bg_anim last stepped; compared with the room's byte $67F5."

[[ram]]
at = "058E"
name = "bg_anim_bank"
desc = "The first of the four CHR banks of the room's background animation. Written by room_draw."

# ------------------------------------------------------------------ models

[[model]]
name = "video_ppu"
code = '''
def nostack(wr):
    return {k: v for k, v in wr.items() if not 0x1B0 <= k <= 0x1FF}

def rom_byte(romrd, addr):
    d = O('ppu_record') - A('ppu_record')
    for k in romrd:
        if (k - addr - d) & 0x1FFF == 0:
            return romrd[k]
    return None

def src_byte(rd, romrd, addr):
    return rom_byte(romrd, addr) if addr >= 0x8000 else rd.get(addr)

def ppu_put(w, rd, get, fill, cnt, lo, hi, src):
    data = [get(src + (0 if fill else i)) for i in range(cnt)]
    cur = lambda k: w[k] if k in w else rd[k]
    if hi & 0x3F == 0x3F:
        for i, b in enumerate(data):
            if b != cur(0x6000 + lo + i):
                w[0x6000 + lo + i] = b
                w[0x500] = cur(0x500) | lo + i
        w[0x01] = cnt
        if not rd[0x37]:
            w.update({0x2006: 0, 0x2007: cur(0x601F), 0x500: 0})
    elif not rd[0x37]:
        w[0x2000] = rd[0x35] | 4 if hi & 0x80 else rd[0x35] & 0xFB
        w[0x2006] = lo
        w[0x2007] = data[-1]
    else:
        i = cur(0x40)
        for b in [cnt, hi, lo] + data:
            w[0x400 + i] = b
            i = i + 1 & 0xFF
        w[0x40] = i

def mode_of(rd, romrd, ptr):
    return src_byte(rd, romrd, ptr)

def record(get, rd, ptr):
    mode, lo, hi, length, count = [get(ptr + i) for i in range(5)]
    if mode < 3:
        src = ptr + 5
    else:
        mode -= 3
        src = get(ptr + 5) | get(ptr + 6) << 8
    w = {}
    if mode == 1:
        hi |= 0x80
        for i in range(length):
            ppu_put(w, rd, get, 0, count, lo, hi, src)
            if i < length - 1:
                src += count
                lo = lo + 1 & 0xFF
        w.update({0x00: 0, 0x01: count})
    else:
        fill = 2 if mode == 2 else 0
        for i in range(count):
            ppu_put(w, rd, get, fill, length, lo, hi, src)
            if i < count - 1:
                if not fill:
                    src += length
                lo += 0x20
                if lo > 0xFF:
                    lo &= 0xFF
                    hi = hi + 1 & 0xFF
        w.update({0x00: fill, 0x01: length})
    w.update({0x02: lo, 0x03: hi, 0x04: 0, 0x16: src & 0xFF, 0x17: src >> 8})
    return w

def fade(c, lv):
    if lv < 0x80:
        if c == 0x0F:
            c = 0xF0
        c = c + 16 * lv & 0xFF
        if c == 0xF0:
            c = 0x0F
        if c >= 0x40:
            c = 0x30
        return c
    c -= 16 * (256 - lv)
    return c if c >= 0 else 0x0F

def also(w, k, v):
    w = dict(w)
    w[k] = v
    return w

def show(rd, romrd, lv, count, rec):
    w = {0x100 + i: fade(rd[0x182 + i], lv) for i in range(count)}
    buf = dict(w)
    get = lambda k: buf[k] if k in buf else src_byte(rd, romrd, k)
    w.update(record(get, rd, A(rec)))
    if lv >= 0x80:
        w[0x11] = lv
    return w
'''

