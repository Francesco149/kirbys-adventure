[[sym]]
at = "26:B327"
name = "e3a_tick"
desc = """
Tick routine of the creature. obj_water_test, the hit test with the record 39:9014 (box 8 x 8, hurts Kirby, inhaled
= number $0C in $05E2, score index 7; inhaled = script 22:8003, hit points gone = 22:8100). Variable 4 is its state.
2 (falling): obj_gravity_a with $25, obj_collide0; landed = sound $0E, state 1.
Otherwise obj_walk0: a floor = Y velocity 0, none = obj_gravity_a with $25. Then:
0 (standing): obj_dx_kirby. Kirby less than 64 pixels away: with variable 3 = 0, random below 2 = 0 starts a
  breath; else variable 3 + 1, and at $21 it becomes 3 and random below 3 not 0 starts a breath. Kirby farther:
