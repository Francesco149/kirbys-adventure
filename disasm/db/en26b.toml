[[model]]
name = "en26b_e3c"
code = '''
E3C_STATES = (0xB7E8, 0xB8B8, 0xB86F, 0xB888, 0xB8A0)

def e3c_tick(rd, turn, land, stop):
    # turn: e3c_walk_turn ran; land: a hop's landing code ran; stop: e3c_roll_stop ran.
    # Returns (record low byte, changes, script started or None), or None when the path cannot be.
    o = rd[0x6E]
    v3 = rd[0x6200 + o]
    kw = {}
    if v3 == 0:
        if land or stop:
            return None
        kw['v4'] = rd[0x6212 + o] - 1 & 0xFF
        if kw['v4'] == 0:
            raise KeyError('the end of a walk never ran')
        if turn:
            kw['vx'] = b_neg(b_w(rd, 0x60E0, 0x60F2, o))
        if b_dy(rd)[0] < 9:
            kw['v5'] = rd[0x6224 + o] - 1 & 0xFF
            if kw['v5'] == 0:
                kw['v3'] = 2
                return 0x74, kw, 0xB70F
        else:
            kw['v5'] = (0x3C, 0x1E)[rd[0x784 + o]]
        return 0x74, kw, None
    if turn:
        return None
    if v3 in (2, 3, 4):
        if stop:
            return None
        if land:
            return 0x74, {'v3': (3, 4, 1)[v3 - 2]}, 0xB70F
        return 0x74, {}, None
    if land:
        return None
    v5 = rd[0x6224 + o]
    if v5:
        if stop:
            return None
        kw['v5'] = v5 - 1
        if v5 == 1:
            # it turns round and rolls on: the speed along the new facing
            v = (0x0300, 0x0400)[rd[0x784 + o]]
            kw['vx'] = v if rd[0x61DC + o] & 0x80 and rd[0x61DC + o] != 0x80 else b_neg(v)
    elif stop:
        kw.update(v5=0x10, vx=0, vy=0)
    else:
        kw['v4'] = rd[0x6212 + o] - 1 & 0xFF
        if kw['v4'] == 0:
            raise KeyError('the end of a roll never ran')
    return 0x8C, kw, None

def e3c_ok(rd, wr, t):
    if t is None:
        return False
    rec, kw, scr = t
    return ((wr[0x27], wr[0x28]) == (rec, 0x90) and b_script(wr) == scr
            and b_same(rd, wr, skip=() if 'vy' in kw else ('vyl', 'vyh'), **kw))
'''

