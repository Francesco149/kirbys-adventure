[[model]]
name = "en26b_e3a"
code = '''
E3A_VY = (0xFEF0, 0x0200, 0x0000, 0xFE00, 0x0110)
E3A_VX = (0x03DD, 0x0376, 0x0400, 0x0376, 0x03DD, 0xFC8A, 0xFC23, 0xFC00, 0xFC23, 0xFC8A)

def e3a_tick(rd, floor, landed, start, slide, off):
    # floor: obj_walk0 found one; landed: the fall ended; start: a breath begins; slide: a slide begins;
    # off: the second obj_walk0 found no floor.  Returns the changes, or None when the path cannot be.
    o = rd[0x6E]
    v3, v4, v5 = rd.get(0x6200 + o), rd[0x6212 + o], rd.get(0x6224 + o)
    if v4 == 2:
        if floor or start or slide or off:
            return None
        return {'v4': 1} if landed else {}
    if landed:
        return None
    kw = {'vy': 0 if floor else b_fall(rd[0x6104 + o] | rd[0x6116 + o] << 8, 0x25, 3)}
    if v4 == 0:
        if off:
            return None
        d, _ = b_dx(rd)
        may = False
        if d < 0x40:
            if v3 == 0:
                may = True
                if not start:
                    kw['v3'] = 1
            elif v3 + 1 == 0x21:
                may = True
                kw['v3'] = 3
            else:
                kw['v3'] = v3 + 1
        else:
            kw['v3'] = 0
        if start:
            if not may or slide:
                return None
            kw.update(v3=0, v4=3, v5=0, v6=0xF0)
            return kw
        v5 = v5 + 1 & 0xFF
        kw['v5'] = v5
        if slide:
            if v5 not in (0x4B, 0x5A, 0x69, 0x78):
                return None
            kw.update(v4=1, v5=0)
        elif v5 == 0x78:
            return None
        return kw
    if start or slide:
        return None
    if v4 == 1:
        if off:
            kw['v4'] = 2
        return kw
    if off:
        return None
    v5 = v5 + 1 & 0xFF
    if v5 & 8:
        v5 = 0
        v3 = v3 + 1
        kw['v3'] = 0 if v3 >= 5 else v3
    kw['v5'] = v5
    return kw

def e3a_ok(rd, wr, kw):
    # in the fall (no 'vy' in the model's answer) the Y velocity is left to obj_gravity_a and obj_collide0
    if kw is None:
        return False
    return b_same(rd, wr, skip=() if 'vy' in kw else ('vyl', 'vyh'), **kw)
'''

