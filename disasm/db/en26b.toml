text = "The hopping one in slot 11 leaves the ground at main@124931 with the Y velocity $FE00 and gravity 8: 12 frames after main@124930 it has had ten ticks and the Y velocity $FE50. With the operand at 26:A42D patched from 8 to $40 it has $0080."
kind = "effect"
on = "main@124930"
frames = 12
patch = { "26:A42D" = 0x40 }
expect = "ctl[0x6133] == 0x1E and (ctl[0x610F], ctl[0x6121]) == (0x50, 0xFE) and (ram[0x610F], ram[0x6121]) == (0x80, 0x00)"

# ------------------------------------------------------------------ type $1D

[[script]]
at = "26:A000"
name = "e1d_start"
desc = """
First script of object type $1D (kinds $4A-$4E): a pale creature with a round head and short arms hanging down,
like a squid (main@126300, in the air above Kirby; main@72980, the pink one that walks on the block at the right).
Variable 0 as created is the variant 0-2, variable 1 the class 0 / 1. Bank 22 at $8000, the position routine
obj_pos_cull, the pose table 32:888F, obj_param_set, faces Kirby, variable 2 = the variant, 2 hit points, then by the
variant: 0 e1d_walk, 1 e1d_leap, 2 e1d_lunge.
"""

[[script]]
at = "26:A02A"
name = "e1d_walk"
desc = "Variant 0, the walker: variable 3 = 100 (frames to the next jump at the latest), tick routine e1d_tick_walk, X velocity word obj_param of e1d_walk_speeds along the facing (asm_vx_tab), then e1d_strut."

[[script]]
at = "26:A036"
name = "e1d_strut"
desc = "The walker's two poses (0 / 1 by the facing, and + 2), each for entry obj_param of e1d_strut_waits frames (kept in variable 2), for good. The fall and the jump use it too."

[[script]]
at = "26:A04E"
name = "e1d_walk_fall"
desc = "The walker has no floor under it (entry 0 of e1d_scripts): tick routine e1d_tick_fall, then e1d_strut."

[[script]]
at = "26:A055"
name = "e1d_walk_jump"
desc = "The walker jumps (entry 1 of e1d_scripts): sound $0D, tick routine e1d_tick_jump, faces Kirby, X velocity 0.75 pixels per frame toward him (3F:E26A), Y velocity -3, then e1d_strut."

[[script]]
at = "26:A1E7"
name = "e1d_leap"
desc = """
Variant 1, the leaper: e1d_leap_place (a fixed place on the screen), tick routine e1d_tick_leap_wait, faces Kirby,
pose 4, X velocity 0.5 forward, Y velocity -4, and the script stops; e1d_tick_leap_wait starts e1d_leap_up (in all
three runs of the corpus in the first frame).
"""

[[script]]
at = "26:A1FC"
name = "e1d_leap_up"
desc = """
Entry 6 of e1d_scripts: the leap. Tick routine e1d_tick_hit, pose 4, faces Kirby, X velocity 0.5 forward, and the Y
velocities -4, -2, -1, -0.5, 0.5, 1, 2 for 8 frames each, then 4 and the tick routine e1d_tick_leap_fall, which
ends it on a floor with e1d_leap_again.
"""

[[script]]
at = "26:A227"
name = "e1d_leap_again"
desc = "Entry 7 of e1d_scripts: landed. Tick routine e1d_tick_hit, velocity 0, pose 5 for 8 frames, then Y velocity -4 for good: it shoots up and out of the screen (once in the corpus)."

[[script]]
at = "26:A29F"
name = "e1d_lunge"
desc = """
Variant 2 (once in the corpus, main@126318): tick routine e1d_tick_lunge_wait, velocity 0, pose 5 for 8 frames; then
tick routine e1d_tick_lunge, e1d_lunge_time (variable 2), pose 4, faces Kirby, X velocity word obj_param of
e1d_lunge_speeds along the facing, Y velocity -2.5, sound $0D, and the script stops. e1d_tick_lunge would start it
again when variable 2 has run out (entry 10 of e1d_scripts; never ran).
"""

[[sym]]
at = "26:A0BD"
name = "e1d_tick_walk"
desc = """
Tick routine of the walker. e1d_hit, obj_walk0. No floor: e1d_set_script with entry 0 (e1d_walk_fall). (A wall would
turn it round with obj_turn_pose: never ran.) Variable 3 - 1; at 0 entry 1 (e1d_walk_jump); at 80, 60, 40 and 20
random below 4, and 0 is entry 1 as well.
"""

[[sym]]
at = "26:A0F4"
name = "e1d_tick_fall"
desc = "Tick routine of e1d_walk_fall: e1d_hit, obj_gravity, obj_collide0. (Landing = entry 3 of e1d_scripts, a wall = obj_turn_pose: neither ran; the one fall of the corpus left the screen.)"

[[sym]]
at = "26:A10B"
name = "e1d_tick_jump"
desc = "Tick routine of e1d_walk_jump: e1d_hit, obj_gravity, obj_collide0. (Landing = sound $0E and entry 3 of e1d_scripts, a wall = obj_turn, a ceiling = Y velocity 0: none of them ran in the five jumps of the corpus.)"

[[sym]]
at = "26:A19D"
name = "e1d_hit"
desc = """
The beginning of the walker's tick routines. Water at its position (prop_bit7_at; never ran) = entry 2 of
e1d_scripts and the caller is abandoned. Then the hit test with the record 39:8F0C; when it answers carry set the
caller is abandoned as well (the return address is dropped).
"""

[[sym]]
at = "26:A1BC"
kind = "part"
name = "e1d_set_script"
desc = "obj_set_script for the current object with entry Y of e1d_scripts, in bank 26."
in = "Y = 0-11"

[[sym]]
at = "26:A232"
name = "e1d_tick_leap_wait"
desc = "Tick routine of e1d_leap: the hit test with the record 39:8F0C; then the shape of the block at its position (prop_shape_at), and when the table 22:9F8A has not 0 for it, entry 6 of e1d_scripts (e1d_leap_up)."

[[sym]]
at = "26:A251"
name = "e1d_tick_hit"
desc = "Tick routine of the leap's rise: the hit test with the record 39:8F0C and nothing else; the blocks do not stop it."

[[sym]]
at = "26:A259"
name = "e1d_tick_leap_fall"
desc = "Tick routine of the leap's end: the hit test with the record 39:8F0C, obj_gravity, obj_collide0; landed = entry 7 of e1d_scripts (e1d_leap_again). (A wall = obj_turn: never ran.)"

[[sym]]
at = "26:A276"
name = "e1d_leap_place"
desc = "The X position of the current object = cam_x + entry Y of e1d_leap_xs, Y = 0 when its X position is not left of Kirby's world X (it appears at $C0, in the right part of the screen) and 1 otherwise ($40; never ran). The world position is not written."

[[sym]]
at = "26:A2E0"
name = "e1d_tick_lunge"
desc = """
Tick routine of the lunge in the air: water at its position = entry 8 of e1d_scripts (never ran); the hit test with
the record 39:8F0C; obj_gravity_a with $20, obj_collide0 (landing = entry 3, a ceiling = entry 9, a wall = obj_turn:
none ran); variable 2 - 1, and at 0 entry 10 (e1d_lunge again; never ran: 9 calls in the corpus).
"""

[[sym]]
at = "26:A31C"
name = "e1d_tick_lunge_wait"
desc = "Tick routine of e1d_lunge before it leaves the ground: water at its position = entry 8 of e1d_scripts (never ran), then the hit test with the record 39:8F0C."

[[sym]]
at = "26:A398"
name = "e1d_lunge_time"
desc = """
Variable 2 of the current object, the frames of the lunge, from (Y position - Kirby's world Y): 40 when the two are
less than 16 pixels apart (never ran), otherwise entry 0 or 1 of e1d_lunge_times: 37 when the object is not above
Kirby (never ran), 43 when it is. A slip of the game: only the low byte of the difference is stored ($10) before
obj_abs16 takes the absolute value of $10 / $11, so the "less than 16 apart" test uses whatever $11 held.
"""

[[data]]
at = "26:A048"
len = 2
name = "e1d_strut_waits"
format = "bytes"
desc = "By obj_param: the frames of each walking pose, 16 and 10."

[[data]]
at = "26:A04A"
len = 4
name = "e1d_walk_speeds"
format = "bytes"
desc = "Two words by obj_param: the walker's X speed, $0080 and $00C0."

[[data]]
at = "26:A1CF"
len = 24
name = "e1d_scripts"
format = "rows:12"
desc = """
Low bytes, then high bytes of the twelve scripts of e1d_set_script: 0 e1d_walk_fall, 1 e1d_walk_jump, 2 26:A06B, 3
26:A020 (landed: the walker again), 4 26:A095, 5 26:A0B3, 6 e1d_leap_up, 7 e1d_leap_again, 8 26:A06B, 9 26:A2D4, 10
e1d_lunge, 11 26:A2C2. Only the entries 0, 1, 6 and 7 were read.
"""

[[data]]
at = "26:A29D"
len = 2
name = "e1d_leap_xs"
format = "bytes"
desc = "The two X on the screen where a leaper appears: $C0, $40."

[[data]]
at = "26:A2BE"
len = 4
name = "e1d_lunge_speeds"
format = "bytes"
desc = "Two words by obj_param: the X speed of the lunge, $0100 and $0140."

[[data]]
at = "26:A3C7"
len = 2
name = "e1d_lunge_times"
format = "bytes"
desc = "The frames of a lunge: 37 (not above Kirby), 43 (above him)."

