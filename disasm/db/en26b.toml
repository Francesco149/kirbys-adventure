$FC23, $FC8A). With e3a_breath_vy the right-hand ones all have the speed 4; the left-hand row is in the wrong order
(-$0376 where the right has $03DD and the other way round), so a breath to the left is 3.6 or 4.3 pixels per frame
at the four slanted angles: a slip in the game's data.
"""

