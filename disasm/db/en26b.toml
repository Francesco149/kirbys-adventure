code = '''
E40_ACC = (0x0040, 0xFFC0, 0x0060, 0xFFA0, 0x004D, 0xFFB3, 0x004D, 0xFFB3)
E40_LIM = (0x0140, 0xFEC0, 0x01C0, 0xFE40, 0x0181, 0xFE7F, 0x0181, 0xFE7F)
E40_STATES = (0xBCB2, 0xBCBA, 0xBCC2, 0xBCD4, 0xBD0B, 0xBD13)
E40_ANIM = bytes.fromhex('82ff5188c00882ff5188c2088100' '82ff5188c004c40482ff5188c204c6048107'
                         '82ff5188c001c401c001c401c001c401c001c40182ff5188c201c601c201c601c201c601c201c6018110')

def e40_to0(v, p):
    if v & 0x8000:
        return v + E40_ACC[p] & 0xFFFF
    if v == 0:
        return 0
    return v + E40_ACC[p + 1] & 0xFFFF

def e40_up(v, p):
    lim = E40_LIM[p]
    if not v & 0x8000 and v >> 8 >= lim >> 8 and v & 0xFF >= lim & 0xFF:
        return v
    return v + E40_ACC[p] & 0xFFFF

def e40_down(v, p):
    lim = E40_LIM[p + 1]
    if v & 0x8000 and (v >> 8 < lim >> 8 or (v >> 8 == lim >> 8 and v & 0xFF <= lim & 0xFF)):
        return v
    return v + E40_ACC[p + 1] & 0xFFFF

# per eighth of a turn (0 = up, clockwise): what happens to the X and to the Y velocity
E40_STEER = ((e40_to0, e40_down), (e40_up, e40_down), (e40_up, e40_to0), (e40_up, e40_up),
             (e40_to0, e40_up), (e40_down, e40_up), (e40_down, e40_to0), (e40_down, e40_down))

def e40_tick(rd, wr):
    # the record the state names and the changes to velocities and variables 2-6
    o = rd[0x6E]
    v3 = rd[0x6200 + o]
    if v3 in (0, 5):
        return (0xA4, 0x90), {}
    if v3 == 1:
        return (0xBC, 0x90), {}
    kw = {}
    if v3 == 2:
        kw['v3'] = 3
        v5 = 0xB5 if rd[0x784 + o] else 0x79
    else:
        v5 = rd[0x6224 + o]
    v5 = v5 - 1 & 0xFF
    kw['v5'] = v5
    if v5 and v5 & 7 == 0:
        d = wr.get(0x61DC + o)
        if d is None or d & 0x1F:
            return None, None
        p = 2 * rd[0x784 + o]
        fx, fy = E40_STEER[d >> 5]
        kw['vx'] = fx(b_w(rd, 0x60E0, 0x60F2, o), p)
        kw['vy'] = fy(b_w(rd, 0x6104, 0x6116, o), p)
    return (0xBC, 0x90), kw
'''

