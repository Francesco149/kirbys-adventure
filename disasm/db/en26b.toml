unit = "en26b"
title = "The other object types of bank 26: $1D, $1E, $1F, $3A, $3B, $3C, $40, the puff $59 and the empty type $0C"
summary = """
The object types of bank 26 around the two of unit en26a: before them (26:A000-A7E8) the types $1D, $1E and $1F,
after them (26:B243 to the end of the bank's code at 26:BD84) $3A, $3B, $0C, $3C, $59 and $40. Each is a first
script, the scripts it changes to, 6502 routines the scripts install as tick routines or call, and small tables. A
kind of the rooms' object lists gives variable 0 (a variant) and variable 1 (a class 0 / 1, which every first script
moves to obj_param); every tick routine begins with the hit test for a record of bank 39 (unit hit), and what the
record's common reactions start (22:8003 inhaled, 22:8100 hit points gone, 19:B2A0, 16:A9CE) is not in this unit.

$59 (462 starts) is a puff of dust and belongs to no one type: the asm routine 22:9591 creates it, from 24 script
instructions of the banks 25-2D (here e3c_roll: the dust behind the rolling Togezo). Its variables are the
operands: 0 loose / tied, 1 the maker's obj_dir plus an operand (bit 7 = the side it drifts to at 2 pixels per
frame), 2 the maker's slot, 3 the rounds of 4 frames it lives, 4 / 5 its place beside the maker in pixels, 6 the
maker's type. Every round e59_place puts it beside the maker again; a tied puff (e59_place_tied) ends when the
maker's slot no longer holds that type.

$3A (81) is Pengy (inhaled: number $0C, Ice): it stands and faces Kirby (e3a_idle), and e3a_tick decides: with Kirby
less than 64 pixels away it sooner or later blows (e3a_blow: 24 pieces of breath in 192 frames, each an object of the
same type with variable 0 = 1, flying 8 frames at speed 4 in one of five angles that changes every 8 frames:
e3a_breath_vel); now and then it slides forward (e3a_slide); it falls when the floor ends. Variables: 0 hit points
(2); 2 the class; 3 a count of frames with Kirby near, then the angle 0-4 of the breath; 4 the state (0 standing, 1
sliding, 2 falling, 3 blowing); 5 a frame counter; 6 = $F0 once it has blown (counted only in a state that never
came back). The left-hand half of e3a_breath_vx is in the wrong order: a slip of the game.

$40 (70) is Scarfy. Variant 0 hovers and bobs 16 pixels (e40_hover, e40_bob); the variants 1-4 wait unseen until
the camera has their place in the middle of the screen, come in from the top or the bottom edge at 3 pixels per
frame and stop at Kirby's height (e40_lurk; only 2 and 4 ran). Inhaling a calm one starts e40_anger: it shakes, shows
its angry face and chases Kirby for up to $78 frames (e40_st_chase, the homing routine 22:886F), after which it would
burst (26:BBA2; never ran). Variables: 0 hit points; 2 the variant; 3 the state of e40_tick (0 calm, 1 turning
angry, 2 / 3 the chase, 4 the end, 5 coming in); 4 the shake's direction or, coming in, the low byte of the Y
velocity; 5 its high byte, later the frames of chase left; 6 / 7 where on the screen it comes in; 8 / 9 obj_anim's
timer and entry (e40_anim).

$1E (49) is a pink creature with flippers in nine variants: 0-5 are the six flight patterns of the winged flier of
unit en26a with another pose table (e1e_variant sends them to e38_setup); 6 sits 48 frames and makes one slow hop
(e1e_sit), and sits again when it lands (e1e_set_script; cov4-e-sit); 8 hangs in the air, bobs and turns to Kirby every 9 frames (e1e_float); 7 never ran. Variables of 6-8:
0 hit points; 2 the variant - 6, in e1e_float the frames to the next turn.

$1F (49) is Glunk: it sits where it is, goes through four poses, and kind $5D shoots three (class 1: four) shots
straight up after every three (two) rounds; a shot is an object of the same type with variable 0 = 1 (e1f_shot: 8
frames at 6 pixels per frame). Its two tick routines hand over to each other: e1f_tick_rest looks whether a block
holds it, e1f_tick_fall lets it fall to the floor. Variables: 0 hit points; 2 = 1 it shoots; 3 = 1 water below
(never seen).

$3C (34) is Togezo (inhaled: number $0B, Needle). It walks (state 0 in variable 3); when Kirby has been within 9
pixels of its height for 60 frames (class 1: 30) it hops three times on the spot, each hop lower (states 2, 3, 4),
and rolls at 3 (4) pixels per frame with puffs of dust behind it (state 1); a wall or the end of the floor stops
the roll for 16 frames and sends it back. Every change of state starts the script e3c_go. Variables: 0 hit points;
3 the state; 4 frames of walk or roll left (never ran out); 5 the count at Kirby's height, in the roll the stop; 2
and 6 are for falls and delays that never ran.

$1D (12, all in main) is a squid-like creature: variant 0 walks and jumps toward Kirby at random moments
(e1d_tick_walk), variant 1 appears at a fixed place of the screen, leaps in an arc, lands and shoots up out of the
screen (e1d_leap), variant 2 lunges at Kirby (e1d_lunge; once). Variables: 0 hit points; 2 the variant, then the
frames of a walking pose or of a lunge; 3 the frames to the walker's next jump.

$3B (10) is Chilly (inhaled: number $0D, Freeze): by a random draw it looks about (e3b_look, then e3b_watch until
Kirby is behind it), hops toward Kirby in short slides (e3b_hops) or shivers and makes a cloud of frost around
itself (e3b_shiver; the frost is an object of the same type with variable 0 = 1 and a box of 33 x 19: once in the
corpus). e3b_tick only turns it at walls and edges. Variables: 0 hit points; 3 what it is doing (0 looking, 1
watching, 2 hopping, 3 shivering; nothing reads it here); 5 = 1 the frost is out.

$0C never started: 20 bytes of script (e0c_start, kept as data) that 29 kinds of the object lists point to.

Open:
- Never ran, and not described beyond a word in the entries: in $1D the scripts and tick routines of the entries 2-5,
  8, 9 and 11 of e1d_scripts (26:A020, A06B-A0BC, A130-A19C, A2C0-A2DF, A335-A397: water, landings, a third state of
  the walker), every landing of the walker's jump and fall, the left-hand place of e1d_leap_place; in $1E the whole
  variant 7 (26:A4A6-A624: scripts, five tick routines, tables) and 26:A41B, A455, A469; in $1F the water code
  (26:A6C1, A718, A74A, A762-A7A8) and the shot hitting a block (26:A7E4); in $3A the end of e3a_blow (26:B319), the
  wait of variable 6 (26:B3C0), a wall in the slide (26:B391), class 1's draw (26:B434); in $3B the fall (26:B5F0,
  B627), the end of e3b_hops and all but the beginning of the class 1 hops (26:B597-B5CF), the drifting frost
  (26:B6A5, B6BA) and the ends of e3b_shiver and e3b_frost; in $3C variable 2 = $FA (a fall: 26:B7FF, B8CE, B95E),
  variable 6 as a delay (26:B83A), the ends of a walk and of a roll (26:B846, B92C), a ceiling in a hop (26:B950);
  the bytes 26:BA51-BA72; in $40 the variants 1 and 3, the end of the chase
  (26:BCFD, the script 26:BBA2, the state routine 26:BD0B), class 1's longer chase (26:BCCF) and the third loop of
  e40_anim.
- Pieces of script that only continue a named script behind the operand bytes of an asm instruction (kd lists them
  as chunks of their own: 26:BC08, 26:BC1C, 26:B733, 26:B759 and the like) and the operand bytes themselves have no
  entries; the named script's description covers them.
- Bank 22 helpers that no unit names, by what these types use them for: 22:9591 (creates a puff), 22:962E (A = 1
  once in four, random), 22:9684 (obj_walk0, then A = 0 free, 1 a wall, 2 the floor ends ahead), 22:83A3 (water 7
  pixels below: the script 22:833B), 22:90BA (obj_dir negated), 22:943C / 22:9458 (velocities / Y velocity 0),
  22:8C05 (X position forward by the operand), 22:9066 / 22:9084 / 22:90C8 (variable 4 as a second direction: toward
  Kirby, an X velocity along it, negated), 22:80FC (dec $05E5), 22:886F and 22:9463 (the chase: only the eighth and
  the steps are checked, as in unit en26a), 22:927C (A = obj_param), the tables 22:9F79 and 22:9F8A (by a block's
  shape: holds an $1F / lets an $1D leap), 3E:DED0 (creates an object of the type in its operands at the object's
  place), 3E:DE4B (a sound), 3F:E26A (an X velocity along the facing).
- The names Pengy, Chilly, Togezo, Scarfy and Glunk are from the look and the behaviour (and, for the first three,
  the inhale numbers $0C, $0D, $0B that the lead in tas/knowledge/ram-map.md reads as Ice, Freeze, Needle); the
  creatures of $1D and $1E are described, not named.
- What a hit's carry means for the tick routines is taken from the code (they stop when 3F:E31D answers carry set);
  the claims leave out the calls in which a hit starts another script.
- $3B's reactions are scripts of bank 2D (2D:B878-B88D), not read here. The pose tables (32:85E6, 85FA, 868D, 8699,
  86BD, 86C5, 87AB, 87B3, 880B, 8813, 888F, 889F, 30:8B84, 8C96, 85E8) are still under their address names in unit
  sprites.
- The bytes 26:BD85-BFFF behind e40_anim are read by nothing.
"""

# ------------------------------------------------------------------ type $59: the puff

[[script]]
at = "26:B99B"
name = "e59_start"
desc = """
First script of object type $59, a small white puff of dust (main@3531, at the feet of the enemy left of Kirby). No
kind of the rooms' object lists creates it: the asm routine 22:9591 does, from 24 script instructions of the banks
25-2D (e3c_roll in this unit), with five operands that become the puff's variables. Bank 22 at $8000, the third
coordinate $FF, the pose table 30:8B84, then by variable 0: 0 e59_loose, 1 e59_tied, 2 the code at 26:B9C4 (ran first in
the coverage movie of the arena; its tick routine is e59_tick_held of unit tail).
"""

[[script]]
at = "26:B9AE"
name = "e59_loose"
desc = "Variable 0 = 0. Variable 3 times: e59_place, pose 0 for 2 frames, pose 1 for 2 frames. Then the object ends."

[[script]]
at = "26:B9B9"
name = "e59_tied"
desc = "Variable 0 = 1. The same with e59_place_tied, which ends the puff at once when its maker is gone."

[[sym]]
at = "26:B9EA"
name = "e59_place"
desc = """
Puts the puff (the current object) beside its maker: the high byte of its X velocity = entry (obj_dir bit 7) of
e59_vx_hi (2 pixels per frame, to the right or to the left; the low byte is not written), Y velocity $FF80, then
obj_pos_copy from the object in variable 2 and obj_pos_add with variable 4 (X) and variable 5 (Y) as signed pixels.
"""

[[sym]]
at = "26:BA17"
name = "e59_place_tied"
desc = """
e59_place with a test before the position: when the type of the object in variable 2 is not the type kept in
variable 6 (the maker has gone or its slot has been taken by something else), the puff is freed (obj_free) and
nothing is placed.
"""

[[data]]
at = "26:BA53"
len = 2
name = "e59_vx_hi"
format = "bytes"
desc = "High byte of the puff's X velocity by bit 7 of its obj_dir: 2, $FE."

[[model]]
name = "en26b_model"
code = '''
B_KEYS = {'vxl': 0x60E0, 'vxh': 0x60F2, 'vyl': 0x6104, 'vyh': 0x6116, 'v2': 0x61EE, 'v3': 0x6200, 'v4': 0x6212,
          'v5': 0x6224, 'v6': 0x6236}
B_PAIRS = {'vx': ('vxl', 'vxh'), 'vy': ('vyl', 'vyh')}

def b_w(d, lo, hi, o):
    return d[lo + o] | d[hi + o] << 8

def b_s8(v):
    return v - 256 if v & 0x80 else v

def b_neg(v):
    return -v & 0xFFFF

def b_fin(rd, wr):
    # velocities and variables 2-6 of the current object at the end of the call (None: neither read nor written)
    o = rd[0x6E]
    return {k: wr[a + o] if a + o in wr else rd.get(a + o) for k, a in B_KEYS.items()}

def b_exp(rd, **kw):
    # what the call read, with the changes the model names
    o = rd[0x6E]
    d = {k: rd.get(a + o) for k, a in B_KEYS.items()}
    for k, v in kw.items():
        if k in B_PAIRS:
            d[B_PAIRS[k][0]], d[B_PAIRS[k][1]] = v & 0xFF, v >> 8 & 0xFF
        else:
            d[k] = v
    return d

def b_same(rd, wr, skip=(), **kw):
    # every velocity byte and variable 2-6 of the current object (variable 7 is obj_var7, the landing flag of unit ocoll) is what the call read, but for the changes the
    # model names; the keys in skip are not looked at
    f, e = b_fin(rd, wr), b_exp(rd, **kw)
    return all(f[k] == e[k] for k in B_KEYS if k not in skip)

def b_script(wr):
    # the script address obj_set_script gave a thread in this call, or None
    for t in range(32):
        if 0x6380 + t in wr and 0x63A0 + t in wr:
            return wr[0x6380 + t] | wr[0x63A0 + t] << 8
    return None

def b_fall(v, add, cap):
    lo = (v & 0xFF) + add
    hi = (v >> 8) + (lo >> 8) & 0xFF
    if hi - cap & 0x80:
        return hi << 8 | lo & 0xFF
    return cap << 8

def b_dist(p, q):
    d = p - q & 0xFFFF
    return (-d & 0xFFFF, 1) if d & 0x8000 else (d, 0)

def b_dx(rd):
    o = rd[0x6E]
    return b_dist(b_w(rd, 0x6074, 0x6086, o), b_w(rd, 0x6074, 0x6086, 1))

def b_dy(rd):
    o = rd[0x6E]
    return b_dist(b_w(rd, 0x6098, 0x60AA, o), b_w(rd, 0x6098, 0x60AA, 1))

def b_fwd(rd, v):
    # a velocity counted along the facing
    return b_neg(v) if rd[0x61DC + rd[0x6E]] & 0x80 else v

def b_argw(rom, addr):
    # the word after the three bytes of an asm instruction of bank 26
    a = 0x26 * 0x2000 + (addr & 0x1FFF) + 3
    return rom[a] | rom[a + 1] << 8

def e59_placed(rd, wr):
    # the puff at its maker's position plus (variable 4, variable 5), with its velocities
    o = rd[0x6E]
    m = rd[0x61EE + o]
    x = b_w(rd, 0x82, 0x94, m) + b_s8(rd[0x6212 + o]) & 0xFFFF
    y = b_w(rd, 0xB8, 0xCA, m) + b_s8(rd[0x6224 + o]) & 0xFFFF
    return (b_w(wr, 0x82, 0x94, o) == x == b_w(wr, 0x6074, 0x6086, o)
            and b_w(wr, 0xB8, 0xCA, o) == y == b_w(wr, 0x6098, 0x60AA, o))

def e59_vel(rd, wr):
    o = rd[0x6E]
    return (wr[0x60F2 + o] == (2, 0xFE)[rd[0x61DC + o] >> 7] and 0x60E0 + o not in wr
            and b_w(wr, 0x6104, 0x6116, o) == 0xFF80)
'''

[[claim]]
id = "en26b.e59.maker"
about = ["e59_start"]
text = "No kind of the rooms' object lists (13:A9D2) gives type $59; the routine 22:9591 ends with lda #$59 / jmp obj_spawn, and the script of type $3C names it at 26:B776 with the operands 0, $80, 1, 4, 4."
kind = "static"
expect = "not [k for k in range(256) if u8(O('13:A9D2') + k) == 0x59] and [u8(O('22:95FB') + i) for i in range(5)] == [0xA9, 0x59, 0x4C, 0xA2, 0xCB] and [u8(O('26:B776') + i) for i in range(8)] == [0xD0, 0x91, 0x95, 0x00, 0x80, 0x01, 0x04, 0x04]"

[[claim]]
id = "en26b.e59.start"
about = ["e59_start", "e59_loose", "e59_tied"]
text = "The jump_table at 26:B9A6 continues at e59_loose for variable 0 = 0 and at e59_tied for 1."
kind = "vmop"
op = "jump_table"
at = "26:B9A6"
on = ["main@3500+800", "main@24090+30", "w12-opus@15690+60", "w1-v2-opus@6190+400"]
min = 10
expect = "next is None or next == (A('e59_loose'), A('e59_tied'))[rd[0x63E0 + thread]]"

[[claim]]
id = "en26b.e59.place"
about = ["e59_place", "e59_loose", "e59_vx_hi"]
text = "Every call of e59_place writes the high byte of the X velocity 2 or $FE by bit 7 of obj_dir and not the low byte, the Y velocity $FF80, and leaves the position and the world position of the puff = the position of the object in variable 2 plus variable 4 (X) and variable 5 (Y) as signed pixels."
kind = "call"
fn = "e59_place"
on = ["main@24090+30", "w12-opus@15690+60", "w12-sonnet@30110+20", "main@87935+60", "w3-sonnet@44795+40"]
min_calls = 30
use = ["en26b_model"]
cases = { "rd[0x61DC + rd[0x6E]] >= 0x80" = 5, "rd[0x61DC + rd[0x6E]] < 0x80" = 5 }
expect = "e59_vel(rd, wr) and e59_placed(rd, wr)"

[[claim]]
id = "en26b.e59.place_tied"
about = ["e59_place_tied", "e59_tied", "e59_vx_hi"]
text = "Every call of e59_place_tied writes the velocities as e59_place does. When the type of the object in variable 2 equals variable 6 the puff is placed as by e59_place; otherwise (once in the corpus, main@51269) obj_free is reached and no position is written."
kind = "call"
fn = "e59_place_tied"
on = ["main@3500+800", "main@51250+40", "w1-v2-opus@6190+400", "w12-sonnet@47360+300", "w3-sonnet@5030+400"]
min_calls = 20
use = ["en26b_model"]
cases = { "ran('26:BA4C') == 1" = 1, "rd[0x61DC + rd[0x6E]] >= 0x80" = 5, "rd[0x61DC + rd[0x6E]] < 0x80" = 5 }
expect = "e59_vel(rd, wr) and ((ran('26:BA4C') == 1) == (rd[0x6128 + rd[0x61EE + rd[0x6E]]] != rd[0x6236 + rd[0x6E]])) and (e59_placed(rd, wr) if ran('26:BA4C') == 0 else (0x82 + rd[0x6E]) not in wr and ran('3E:D655') == 1)"

[[claim]]
id = "en26b.e59.effect.tied"
about = ["e59_place_tied", "e59_tied"]
text = "The puff in slot 12 from main@4136 (variable 3 = 8: eight rounds of 4 frames) is still there 10 frames after main@4138. With its variable 6 held at 0, which is not its maker's type, it is gone: the slot's type is $FF."
kind = "effect"
on = "main@4138"
frames = 10
poke = { "6242" = 0 }
hold = true
expect = "ctl[0x6134] == 0x59 and ram[0x6134] == 0xFF"

[[claim]]
id = "en26b.e59.effect.speed"
about = ["e59_vx_hi", "e59_place_tied"]
text = "The puff created in slot 15 at main@3529 (facing right) has the X velocity high byte 2 three frames after main@3527; with the first byte of e59_vx_hi patched to 4 it has 4."
kind = "effect"
on = "main@3527"
frames = 3
patch = { "26:BA53" = 4 }
expect = "ctl[0x6137] == 0x59 and ctl[0x6101] == 2 and ram[0x6101] == 4"

