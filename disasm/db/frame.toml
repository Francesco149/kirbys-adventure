unit = "frame"
title = "The game's top level: boot flow, scenes, the room loop and its leave codes, the far-call helper"
summary = """After reset the game runs boot_flow: game_state_init (bank 18) sets every counter of a new game (4 lives,
hp and hp_max $2F, world 0, score 0, the per-world flag bytes cleared), ram_sig_check compares five bytes of RAM
with "KIRBY" (a mismatch means a cold start), and the title loop of unit attract takes over. A scene (title, story,
the screens between) is scene_run: reset the objects, create one object of the type in A and run frames until no
object is left. A game starts at game_begin and stage_begin and then lives in room_enter: load the room in `room`
(room_load), then once per frame wait for the interrupt, read the pad, run the objects and scroll, until some object
or script stores a nonzero leave_code. The code says why the room is left: 1 load the next room (a door was taken or
`room` was set), 3 a life is lost (lives - 1, hp = hp_max, back to the room in room_return), 4 the stage was left
through its end (stage_mark_done sets bit stage_door of stages_done[world], then back to the room in room_return),
5 a stage is cleared (bit stage_kind of stages_clear[world] is set, hp = hp_max, room_return_restore; when
stage_kind is 7 the next world's number goes to $0557, $0528 and $79E9 and the game continues at game_begin).
Every code ends by loading a room again, most with room + 1 = $FF (go back to room_return).
far_call is how code in one bank calls a routine in another: the three bytes after the jsr are the target's address
and bank; lives_add and score_add are the two counters' only adders, obj_create_far and hp_change_far wrap two
routines of bank 21 for callers in other banks.

Open: code 2 (3F:E4B3: room_return_restore, then back), a death with no life left (3F:E4C6 -> 3F:E566: scene $6D,
then the title or a far call into bank 3D), codes 6, 7 and 8 (3F:E53B on; code 8 plays demos 1-7) never ran. Code 5
in room $000C skips everything and loads the room again (once, main@81945); why is not known. What stage_door ($0559)
and stage_kind ($0520) are beyond their use here is in unit rooms (door kinds); stage_mark_done's branch for a nonzero
stage_kind (the flags at $0529) never ran. 3D:BD38, far-called on code 4, stores world in $79E9 and falls into
3D:BD3E (88 bytes, also far-called from game_begin), which is not described: it reads $7905 on and looks like the
battery save. $0516 is set to 1 by game_begin and cleared by room_enter after the first load, which skips the song
change of that load; game_begin_2 also calls 3F:EA87 (eight bytes to $66D5) and runs scene $6C. The song of a room
(header byte 6, $67F4) is started by room_enter when it differs from snd_song; the test of $05A2 before it never
took its other branch. far_call's first branch (a target below $8000 is jumped to without a bank change) never ran,
and that A and Y reach the target is read from the code, not checked. The script helpers next to this code
(3F:E298-3F:E375) are not in the unit."""

# ---------------------------------------------------------------- far calls

[[sym]]
at = "3E:D805"
name = "far_call"
inline = 3
desc = """Calls a routine in another bank. The three bytes after the `jsr far_call` are the target's address (low,
high) and its bank. The return address is taken off the stack ($16/$17) and pushed again 3 higher, so the target
returns to the code after the three bytes. A and Y are kept in $10 and $12 and handed to the target; X is not kept.
A target in $A000-$BFFF gets its bank mapped at $A000 (map_bank_a000) and the bank that was there is mapped back
afterwards; a target in $8000-$9FFF the same with map_bank_8000. The call goes through call_vector (call_target =
the address)."""
in = "the three bytes after the jsr: address, bank; A, Y = arguments for the target"
out = "whatever the target leaves in the registers; the window's old bank is mapped again"

[[model]]
name = "far_call_site"
code = '''
def far_site(romrd):
    """The three inline bytes are the first ROM bytes the helper reads: (offset of the first, address, bank)."""
    it = list(romrd.items())[:3]
    (o0, lo), (o1, hi), (o2, bank) = it
    if o1 != o0 + 1 or o2 != o0 + 2:
        return None
    return o0, lo | hi << 8, bank

def far_at(romrd):
    s = far_site(romrd)
    return "%02X:%04X" % (s[2], s[1])
'''

