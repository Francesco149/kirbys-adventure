about = ["far_call"]
text = "On every call of far_call in the windows the first three ROM bytes it reads are consecutive, the instruction at the address and bank they give runs during the call, call_target holds that address when call_vector is entered, and at return the bank of the target's window ($49 for $A000-$BFFF, $48 for $8000-$9FFF) is the one found at entry. The windows hold targets in both windows."
kind = "call"
