text = "ram_sig_check returns carry clear and $07F4 = 0 without writing ram_sig when the five bytes it read equal ram_sig_text, and otherwise carry set, $07F4 = 1 and ram_sig = ram_sig_text; the comparison reads from byte 4 down and stops at the first difference. One call in the windows finds the text (the reset in main at frame 9)."
kind = "call"
fn = "ram_sig_check"
on = ["main@0+12", "w12-opus@0+12", "w3-sonnet@0+12", "attract@0+12", "ufo-fable@0+12", "pilot@0+12"]
model = '''
def sig(rd, wr, rp):
    text = b"KIRBY"
    same = True
    for i in (4, 3, 2, 1, 0):
        if 0x517 + i not in rd:
            return False
        if rd[0x517 + i] != text[i]:
            same = False
            break
    if any(0x517 + j in rd for j in range(i)):
        return False
    if same:
        return wr == {0x7F4: 0} and not rp & 1
    want = {0x517 + j: text[j] for j in range(5)}
    want[0x7F4] = 1
    return wr == want and rp & 1 == 1
'''
expect = "sig(rd, wr, rp)"
cases = { "rp & 1 == 0" = 1, "rp & 1 == 1" = 5 }

