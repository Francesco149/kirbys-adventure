desc = "The world, 0-7: the row of stages_done and stages_clear in use. Rooms 0-6 (the worlds' hubs) set it to their number (room_flags)."

[[ram]]
at = "0559"
name = "stage_door"
desc = "The number of the stage door last entered in a hub, 0-6 (door kinds 1-7 store kind - 1, unit rooms): the bit of stages_done that leave code 4 sets."

[[ram]]
at = "0520"
name = "stage_kind"
desc = "0 in an ordinary stage, 7 in a world's boss stage (door kind $F), 0-2 for door kinds $A-$C (unit rooms): the bit of stages_clear that leave code 5 sets."

[[ram]]
at = "0521"
len = 7
name = "stages_done"
desc = "Per world (0-6), one bit per stage door (bit stage_door): the stage was left through its end (leave code 4). The byte after the seven, $0528, is not a row of it: leave_tail stores world + 1 there."

[[ram]]
at = "0531"
len = 8
name = "stages_clear"
desc = "Per world, one bit per stage_kind, set on leave code 5; bit 7 = the world's boss stage is cleared."

[[ram]]
at = "0566"
len = 4
name = "room_return_saved"
desc = "A copy of a room_return value (room, entry) made by 13:A928 when a door of kind $A-$C or $F is taken (unit rooms: 'the destination is saved'); room_return_restore puts it back on leave code 5."

[[claim]]
id = "frame.leave.life"
about = ["room_enter", "leave_code", "lives", "hp", "hp_max"]
text = "At the end of every frame in the windows on which leave_code is 3, lives is one less than a frame before, hp equals hp_max and room + 1 is $FF; on every other frame of the windows lives is not lower than a frame before. Leave code 3 occurs in the windows."
kind = "frames"
on = ["w12-sonnet@32900+200", "w3-sonnet@74300+300", "w1-v2-sonnet@9650+200"]
always = ["r('leave_code') != 3 or (r('lives') == pr('lives') - 1 and r('hp') == r('hp_max') and ram[0x55F] == 0xFF)", "r('leave_code') == 3 or r('lives') >= pr('lives')"]
sometimes = "r('leave_code') == 3"

[[claim]]
id = "frame.leave.done"
about = ["room_enter", "leave_4_save", "leave_code", "stages_done", "world", "stage_door"]
text = "At the end of every frame in the windows on which leave_code is 4, bit stage_door of stages_done[world] is set, room + 1 is $FF and $79E9 equals world; leave code 4 occurs in the windows, and so does a frame on which that bit was clear the frame before."
kind = "frames"
on = ["main@2500+3000", "w12-opus@3600+300", "w3-sonnet@3600+300", "hal-fable@3100+100"]
always = "r('leave_code') != 4 or (ram[0x521 + r('world')] & 1 << r('stage_door') and ram[0x55F] == 0xFF and ram[0x79E9] == r('world'))"
sometimes = ["r('leave_code') == 4", "r('leave_code') == 4 and not prev[0x521 + r('world')] & 1 << r('stage_door')"]

[[claim]]
id = "frame.leave.clear"
about = ["leave_tail", "leave_code", "stages_clear", "stage_kind", "world", "hp"]
text = "At the end of every frame in the windows on which leave_code is 5, was 0 a frame before, and the room a frame before was not $000C: bit stage_kind of stages_clear[the world a frame before] is set, hp equals hp_max and room + 1 is $FF; when stage_kind is 7, $0557, $0528 and $79E9 hold that world + 1, and world itself changes only if that is 7. The windows hold code 5 with stage_kind 7, with another stage_kind, and with world going to 7."
kind = "frames"
on = ["main@11380+60", "w12-opus@19700+60", "w12-opus@37250+60", "w3-sonnet@37250+60", "main@130230+60", "w1-v2-sonnet@30930+60"]
always = "r('leave_code') != 5 or pr('leave_code') != 0 or pr('room') == 0x0C or (ram[0x531 + pr('world')] & 1 << r('stage_kind') and r('hp') == r('hp_max') and ram[0x55F] == 0xFF and (r('stage_kind') != 7 or (ram[0x557] == ram[0x528] == ram[0x79E9] == pr('world') + 1 and r('world') == (7 if pr('world') >= 6 else pr('world')))))"
sometimes = ["r('leave_code') == 5 and pr('leave_code') == 0 and r('stage_kind') == 7", "r('leave_code') == 5 and pr('leave_code') == 0 and r('stage_kind') != 7", "r('leave_code') == 5 and r('world') == 7 and pr('world') == 6"]

[[claim]]
id = "frame.leave.room_load"
about = ["room_enter", "leave_code"]
text = "In the windows room_load starts only on a frame at whose end leave_code is nonzero or was nonzero a frame before, or at the start of a game ($0516 set a frame before); a nonzero leave_code lasts more than one frame only as code 5 with stage_kind 7 (the scene of game_begin_2 runs before the next room_load clears it), which the windows hold; both room_load and leave code 1 occur."
kind = "frames"
on = ["main@400+6000", "w12-opus@19600+3000", "w3-sonnet@50000+3000"]
always = ["n('room_load') == 0 or r('leave_code') != 0 or pr('leave_code') != 0 or prev[0x516] != 0", "r('leave_code') == 0 or pr('leave_code') == 0 or (r('leave_code') == 5 and r('stage_kind') == 7)"]
sometimes = ["n('room_load') > 0", "r('leave_code') == 1", "r('leave_code') == 5 and pr('leave_code') == 5"]

[[claim]]
id = "frame.leave.poke"
about = ["leave_code", "lives", "room_enter"]
text = "Storing 3 in leave_code at main@3000 costs a life: 40 frames later lives is one less than in the untouched run and room_load has run once more."
kind = "effect"
on = "main@3000"
frames = 40
poke = { "056A" = 3 }
expect = "r('lives') == cr('lives') - 1 and n('room_load') == cn('room_load') + 1"

[[claim]]
id = "frame.leave.writers"
about = ["leave_code", "lives", "score", "stages_done", "stages_clear", "hp_max"]
text = "In the corpus leave_code is read only by room_enter and demo_play_frame; lives is written only by game_state_init, lives_add and room_enter; score only by game_state_init, score_add, 27:AF4D, 39:8605 and 3D:AFDA; stages_done (seven bytes) only by game_state_init, stage_mark_done and 3D:BD96; stages_clear only by game_state_init, leave_tail, 3D:BD96 and the script opcode set_mem8; hp_max only by game_state_init."
kind = "xref"
expect = "readers('leave_code') == {'room_enter', 'demo_play_frame'} and writers('lives') == {'game_state_init', 'lives_add', 'room_enter'} and writers((0x593, 3)) == {'game_state_init', 'score_add', '27:AF4D', '39:8605', '3D:AFDA'} and writers((0x521, 7)) == {'game_state_init', 'stage_mark_done', '3D:BD96'} and writers((0x531, 8)) == {'game_state_init', 'leave_tail', '3D:BD96', 'vm_op_set_mem8'} and writers('hp_max') == {'game_state_init'}"

[[claim]]
id = "frame.flow.callers"
about = ["boot_flow", "boot_flow_2", "game_begin", "stage_begin", "stage_kind"]
text = "In the corpus game_state_init and ram_sig_check are reached only through call_vector (the far call), stage_mark_done likewise, and stage_kind is written only by room_pick_kind and room_pick_boss."
kind = "xref"
expect = "callers('game_state_init') == {'call_vector'} and callers('ram_sig_check') == {'call_vector'} and callers('stage_mark_done') == {'call_vector'} and writers('stage_kind') == {'room_pick_kind', 'room_pick_boss'}"
