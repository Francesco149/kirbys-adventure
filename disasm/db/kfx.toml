unit = "kfx"
title = "Object types 2 and 3: the effects around Kirby and what he shoots"
summary = """
Object type 2 is a family of short-lived effects, type 3 the family of Kirby's shots. Both start in a dispatcher
(kfx_start at 16:AA3A, kfx_shot_start at 16:B35B) that loads the object's variable 3 and continues through a
jump table: 32 effects, 14 shots. The number comes from whoever creates the object: 21:9955 (and 21:9952 in front
of it, which reads a four-byte record dx, dy, number, facing offset behind the calling script instruction) creates
a type 2 object in slots 3-5 with the number in spawn_vars+3, the creator's slot in variable 0 and a rank from the
table at 21:99B8 in variable 2 (an object of equal rank is replaced, and with three in use one of lower rank);
21:99EA creates a type 3 object in slots 6-8 from the same kind of record, with the creator's slot in variable 2.
Variable 1 of either is the creator's variable 1 (the facing, bit 7 = left) plus the record's last byte.

Effects (type 2), by variable 3:
  $00 kfx_star: a star thrown off Kirby in one of eight random directions (the bounce after a dive): 6 pixels
      out, 3 pixels a frame for 3 frames, 2 for 3 more, 8 frames at rest.
  $01 kfx_run_dust: the puff behind his feet when a run or a skid starts; repeats while kirby_action is 2 (three
      times at most), 7 or 3.
  $03 kfx_pop: the burst where a block broke or a shot ended: three poses, 10 frames.
  $04 / $05 kfx_splash_in / kfx_splash_out: the splash on the water line (Y snapped to the middle of the block).
  $0C kfx_quake: sound $40 and 32 frames of shaking through scroll_add ($01A3 / $01A4).
  $0E kfx_bubble: an air bubble that rises from Kirby under water, swaying, until it leaves the water.
  $12 kfx_chain: the chain reaction of the blocks of shapes $0B, $0C, $10: a list of up to eight burning cells, each
      burning 6 frames and then lighting its four neighbours.
  $13 kfx_jump_star: a star that drops 4 pixels a frame for 8 frames with Kirby's X velocity reversed (seen with the
      Hi-Jump ability).
  $15 kfx_quake_timed: the shake repeated for 16 frames by a timer thread (seen in fights with an ENEMY bar, on
      the frame kfx_handoff starts); $14 is the same without its timer.
  $18 kfx_handoff: turns itself into the bank 22 script 22:840C.
  $1A kfx_quake_short: four up-and-down shakes of 2 pixels.
  $1D kfx_flash: the white flash where a hit landed (unit hit creates it), four poses picked by the frame counter.
Shots (type 3), by variable 3 (variable 0 is the damage unit hit takes):
  $00 kfx_shot_star: the star Kirby spits (and the UFO's second charge level), 4 pixels a frame, damage 10; ends in kfx_shot_burst at a wall.
  $03 kfx_shot_laser: the laser (the UFO's first charge level): 8 pixels a frame along variable 1, damage 3, turns a
      quarter at a slope up to three times (variable 2 counts down from 4).
  $05 kfx_shot_puff: the air puff, damage 2, slows from 4 pixels a frame to a third in 15 frames.
  $06 kfx_shot_beam: one link of the UFO's beam sweep, 8 pixels a frame along variable 1, damage 3, 5 frames.
  $08 kfx_shot_big_star: the large star (the UFO's full charge; also seen without the UFO), damage $19,
      breaks blocks without stopping, ends at a wall or a floor.
A shot that hit something is given kfx_shot_hit by unit hit: it ends at once, in kfx_flash, or in a small pop of its
own (the puff).

Open:
- Never ran in any movie: effects $02 (16:ABE5), $07 (16:ACAB), $08 (16:AD15), $09 (16:AD3C: three rounds of
  the quake body), $0A (16:AD43), $0B (16:AD97, with the code and tables up to 16:AECD), $14 started directly
  (16:AEE5), $16 (16:B22A), $19 (16:B293, palette bytes behind it); shots $02 (16:B5DA, code to 16:B68D), $04
  (16:B7F8, code to 16:B865), $09 (16:B52D, code to 16:B581); the water exits of the shots' tick routines
  (scripts 16:B3DC, 16:B492, code 16:B4C6); the upward test of kfx_shot_floor; 16:BA2F-BA72, 16:BA8A, 16:BAB1.
- Ran, not taken to a claim (one line each, from the listing and a picture where there is one):
  effect $06 (16:ABDC): four dust puffs of pose $0A behind Kirby, 4 frames each (the Star Rod's swing, 19 starts);
  effect $0D (16:AF47, routine 16:AF54): a two-pose spark within 3 pixels of Kirby that rises 1 pixel a frame;
  effect $0F (16:AFFC, 16:B011, 16:B01E): the Fireball's trail: six sparks at Kirby's X, Y +-8, 2 pixels a frame
  backwards, gone when kirby_action is not $0C;
  effects $10 / $11 (16:B049, 16:B071, 16:B083 and its table 16:B09A): the stars that fly off Kirby when he loses
  a life; $11 uses kfx_star_place / kfx_star_vel with a direction picked by the sign of his Y velocity;
  effect $17 (16:B252, 16:B25F): the quake body repeated until variable 6 is set (3 starts);
  effect $1B (16:B2F5, 16:B304): a spark placed within 16 pixels of where it was created, flying at 2 pixels a
  frame in the direction 3F:E012 answers (attract mode only);
  effect $1C (16:B206, 16:B21D, 16:B23C): hp += 8 with sound $12 every 8 frames until hp_max (1 start);
  effect $1E (16:AC23, 16:AC30): eight sparkles within 12 pixels of the object in variable 0 (an ability is taken);
  effect $1F (16:AB93, 16:ABA3, 16:ABD0): a dust puff by Kirby's facing that repeats while kirby_action is 2 (1 start);
  shot $01 (16:B582, 16:B59F, 16:B5BD, 16:B5C8): damage 5, sound $1E, 4 pixels a frame along variable 1 for 8
  frames, the pose turning (attract mode only; what it is in the game is not established);
  shot $07 (16:B8DF): damage $1D for one frame, no picture of its own (hit's routine for it tests no box: Crash);
  shot $0A (16:B8AA): damage 10, pose $2F, 4 pixels a frame (attract mode, 2 starts);
  shot $0B (16:B8E5, 16:B8EE, 16:B914, 16:B91F, 16:BA73, 16:BA95 and the tables 16:B9E9-BA2E): takes the sprite of
  the object in variable 2, frees it and rides on Kirby by his pose while $05FC is 0 (attract mode, 6 starts);
  shots $0C / $0D (16:B45F, 16:B465): kfx_shot_fly with damage 1 / 10 (the Star Rod's shots in the last fights).
- Bank 16 below 16:AA3A (16:A000-AA39, about 20 routines that ran only in attract mode) is not part of these
  two types' scripts and is not in the unit.
- What kirby_action 7 is (kfx_dust_alive keeps the dust for it) is not established here.
- The meaning of the ranks at 21:99B8 and the creators in bank 21 are described from the listing only; they
  have no names and no claims here.
- kfx_shot_wall's reading of Y after a probe (the low byte of probe_dist) is checked only through probe_dist.
- The pose numbers are indexes into the pose tables 1C:94CE (effects, most shots' ends), 1C:9CD7 (shots) and
  1C:9F16 (the puff's pop); the tables themselves stay under their address names in unit sprites.
"""

# ------------------------------------------------------------------ scripts, type 2

[[script]]
at = "16:AA3A"
name = "kfx_start"
desc = "The first script of object type 2. Script bank $21 at $8000 for the routines called, sprite map 1C:94CE, then variable 3 is loaded and a jump table of 32 entries continues in the effect's script."

[[script]]
at = "16:AA84"
name = "kfx_star"
desc = "Effect $00, a star thrown off Kirby: kfx_star_dir picks one of eight directions, pose $0A, kfx_star_place puts it 6 pixels from Kirby in that direction, kfx_star_vel gives the fast velocity for 3 frames and the slow one for 3 more; then no velocity for 8 frames and the object ends."

[[script]]
at = "16:AB36"
name = "kfx_run_dust"
desc = "Effect $01, the dust of a run: third coordinate $FF, variable 0 = 3; then rounds of kfx_dust_place, poses 0 and 1 for 2 frames each, and kfx_dust_alive: another round while it answers nonzero, else the object ends."

[[script]]
at = "16:AC0C"
name = "kfx_flash"
desc = "Effect $1D, the flash of a hit: third coordinate $FE, kfx_flash_pose (pose $58-$5B) for 2 frames, pose $5C for 2 frames, end. kfx_shot_hit also ends here."

[[script]]
at = "16:AC72"
name = "kfx_pop"
desc = "Effect $03, the burst of a broken block: third coordinate $C1, no velocity, poses $0B, $0C, $0D for 3, 3 and 4 frames, end."

[[script]]
at = "16:AC7B"
name = "kfx_splash_in"
desc = "Effect $04, the splash when Kirby enters water: third coordinate $FF, kfx_snap_y, sound $1F, then poses $18 to $2C one frame each and the last ($2D) for 3 frames."

[[script]]
at = "16:AC9A"
name = "kfx_splash_out"
desc = "Effect $05, the splash when Kirby leaves water: third coordinate $FF, kfx_snap_y, sound $1F, poses $2D to $31 for 3, 5, 2, 1 and 1 frames."

[[script]]
at = "16:AECE"
name = "kfx_quake_short"
desc = "Effect $1A, a short shake: scroll_add cleared (3F:E298), four rounds of Y + 2 for 2 frames and Y - 2 for 2 frames (3F:E2A1 adds its two operand bytes to scroll_add_x / scroll_add_y), cleared again, end."

[[script]]
at = "16:AEE2"
name = "kfx_quake_timed"
desc = "Effect $15: starts kfx_quake_timer as a second thread, then (16:AEE5, where effect $14 enters) sound $40, scroll_add cleared, variable 6 = 0, and Y + 2 / Y - 2 for 2 frames each until variable 6 is not 0; scroll_add cleared, end."

[[script]]
at = "16:AF07"
name = "kfx_quake_timer"
desc = "The second thread of kfx_quake_timed: waits 16 frames, sets variable 6 to 1 and ends itself."

[[script]]
at = "16:AF0D"
name = "kfx_quake"
desc = "Effect $0C, the quake: calls kfx_quake_body and ends."

[[script]]
at = "16:AF11"
name = "kfx_quake_body"
desc = "The quake as a subroutine of scripts: sound $40, scroll_add cleared, (0, +2) for 2 frames, twice the seven steps (2, -4), (-4, 4), (4, -2), (-4, 0), (4, 2), (-4, -4), (2, 4) of 2 frames each, which add up to nothing, then scroll_add cleared for 2 frames and a return. 16:AF15 is the entry without the sound."

[[script]]
at = "16:AF69"
name = "kfx_bubble"
desc = "Effect $0E, an air bubble: third coordinate $FF, pose 4 by the facing (21:8FDC), Y velocity -1 pixel a frame, kfx_bubble_place, tick routine kfx_bubble_tick; then the poses 4, 5, 4, 5 for 10, 8, 8 and 10 frames for ever."

[[script]]
at = "16:B0A0"
name = "kfx_chain"
desc = "Effect $12, the chain reaction: script bank $1C (the sprite groups kfx_chain_draw shows), kfx_chain_start enters the object's place in the list, tick routine kfx_chain_tick, halt. The object has no picture of its own."

[[script]]
at = "16:B1E5"
name = "kfx_jump_star"
desc = "Effect $13: pose $0A, Y velocity +4 pixels a frame, kfx_jump_star_vel, 8 frames, end."

[[script]]
at = "16:B26F"
name = "kfx_handoff"
desc = "Effect $18: tick routine kfx_handoff_tick, halt. The tick routine replaces the script on the same frame."

# ------------------------------------------------------------------ scripts, type 3

[[script]]
at = "16:B35B"
name = "kfx_shot_start"
desc = "The first script of object type 3. Script bank $21, sprite map 1C:9CD7, then variable 3 is loaded and a jump table of 14 entries continues in the shot's script."

[[script]]
at = "16:B381"
name = "kfx_shot_hit"
desc = "The script unit hit gives a shot that hit something (39: hit_shot_end): no velocity, variable 3 is loaded and replaced by $FF (hit then tests the slot no more), and a jump table of 14 entries by the old number: shots 0-3, 6, 10, 12, 13 take sprite map 1C:94CE and end in kfx_flash; shot 5 shows poses $0D, $0E of 1C:9F16 for 2 frames each at third coordinate $80; shots 4, 7, 8, 9, 11 end at once."

[[script]]
at = "16:B3B7"
name = "kfx_shot_star"
desc = "Shot $00, the star Kirby spits: variable 0 = 10, then kfx_shot_fly."

[[script]]
at = "16:B3BA"
name = "kfx_shot_fly"
desc = "The flight shared by shots $00, $0C and $0D: position routine obj_pos_cull (off screen = deleted), tick routine kfx_shot_star_tick, X velocity 4 pixels a frame by the facing (3F:E26A), then for ever the poses $10-$13 upwards when 21:98D5 answers 0 (facing right) or $13-$10 downwards (facing left), 4 frames each."

[[script]]
at = "16:B3F6"
name = "kfx_shot_burst"
desc = "The end of a shot at a wall: sound $41 (the entry 16:B3FA is the same without the sound), variable 3 = $FF, third coordinate $C1, sprite map 1C:94CE, no velocity, poses $0B, $0C, $0D for 3, 3 and 4 frames, end."

[[script]]
at = "16:B46B"
name = "kfx_shot_big_star"
desc = "Shot $08, the large star: variable 0 = $19, X velocity 4 pixels a frame by the facing, tick routine kfx_shot_big_tick, position routine obj_pos_cull, then for ever the poses $14-$1B upwards (facing right) or $1B-$14 downwards, 4 frames each."

[[script]]
at = "16:B68E"
name = "kfx_shot_laser"
desc = "Shot $03, the laser: position routine obj_pos_cull, variable 0 = 3, variable 2 = 4, tick routine kfx_shot_laser_tick, velocity 8 pixels a frame along variable 1 (3F:E23C), one frame without a picture, then kfx_pose_dir with $20, $40 and 4 added twice, one frame each: the three poses of its direction, the last one kept (halt). 16:B6AC is the bounce kfx_shot_laser_tick starts: sound $0B, no velocity, twice a blink (no pose / pose $2C, 2 frames each), then the velocity along the new variable 1 and the poses again. 16:B6C9 is the end it starts: variable 3 = $FF, variable 1 turned by half a circle, 4 pixels a frame, poses 0 and 1 of 1C:94CE for 2 frames each."

[[script]]
at = "16:B866"
name = "kfx_shot_puff"
desc = "Shot $05, the air puff: variable 0 = 2, third coordinate $FF, tick routine kfx_shot_puff_tick, pose $0E by the facing, X velocity by the facing of 4 pixels a frame for 8 frames, 1 for 3, 1/2 for 2, 1/3 for 2, then none for 8 frames, end."

[[script]]
at = "16:B8BF"
name = "kfx_shot_beam"
desc = "Shot $06, a link of the beam: variable 0 = 3, tick routine kfx_shot_beam_tick, velocity 8 pixels a frame along variable 1, poses $2D, $2E, $2D, $2E, $2D one frame each, end."

# ------------------------------------------------------------------ routines, type 2

[[sym]]
at = "16:AABC"
name = "kfx_at_kirby"
desc = "Puts the current object at Kirby's world position (slot 1) plus the signed offsets in X and Y: the object's X and Y position, 16 bits each. $00 and $01 are used for the sign."
in = "X = X offset, Y = Y offset (signed bytes)"

[[sym]]
at = "16:AA96"
name = "kfx_star_dir"
desc = "Variable 1 of the current object = a random number 0-7 (the low three bits of random's byte): the direction of kfx_star."

[[sym]]
at = "16:AAA3"
name = "kfx_star_place"
desc = "kfx_at_kirby with the offsets of direction variable 1 from kfx_star_off: Y offset = entry d, X offset = entry d + 2."

[[sym]]
at = "16:AAE9"
name = "kfx_star_vel"
desc = "Velocity of the current object from kfx_star_vel_lo / kfx_star_vel_hi by variable 1: Y velocity = entry d, X velocity = entry d + 2; then variable 1 += 10, so that a second call takes the slower set."

[[sym]]
at = "16:AB49"
name = "kfx_dust_place"
desc = "Places the dust: by the sign of the object's variable 1 (the facing it was created with) kfx_at_kirby with X offset -4 (facing right) or +4 and Y offset 5, the high byte of the X velocity -2 or +2 (kfx_dust_tab), Y velocity $FF80 (half a pixel a frame upwards). The low byte of the X velocity is not written."

[[sym]]
at = "16:AB76"
name = "kfx_dust_alive"
desc = "Whether the dust goes on. kirby_action 2 (running): variable 0 of the object is decremented and the answer is 1 while it is not 0. kirby_action 7 or 3: 1. Anything else: 0."
out = "A = 1 another round, 0 end"

[[sym]]
at = "16:AC15"
name = "kfx_flash_pose"
desc = "Pose of the current object = $58 + (obj_frame & 3)."

[[sym]]
at = "16:AC8D"
name = "kfx_snap_y"
desc = "Low byte of the current object's Y position = (old & $F0) | 8: the middle of its block row."

[[sym]]
at = "16:AD77"
name = "kfx_pose_dir"
desc = "Called from a script with two operand bytes b, n: pose of the current object = b + ((n / 2 + variable 1) & $FF) / n through div_recip. With n = $40 that is b plus the quarter nearest to the direction (0 up, 1 right, 2 down, 3 left)."

[[sym]]
at = "16:AF82"
name = "kfx_bubble_tick"
desc = "The bubble, once per frame. When the block at its position has no bit 7 in prop_shape (prop_bit7_at answers carry clear: not water) the object is deleted. Otherwise variable 1 counts down; at 0 it is set to 8, the X velocity becomes entry variable 0 of kfx_bubble_vx and variable 0 steps to the next of the four entries."

[[sym]]
at = "16:AFBD"
name = "kfx_bubble_place"
desc = "Places a new bubble: Y = Kirby's world Y - 4, X = Kirby's world X + random(24) - 12, variable 0 = a random number 0-3 (where the sway starts), variable 1 = 1 (the sway starts on the first tick)."

[[sym]]
at = "16:B0AA"
name = "kfx_chain_start"
desc = "Enters the current object's world position in the chain list: the free entry (kfx_chain_timer = 0) with the highest index (by the code entry 0 when none is free, which never happened) gets timer 6 and the position; sound $11; then 3F:E3A7 with A = 1, X = 0."

[[sym]]
at = "16:B0E0"
name = "kfx_chain_tick"
desc = "The chain, once per frame: kfx_chain_draw for every entry whose timer is 1-$7F, from entry 7 down; then bit 7 of every timer is cleared (an entry lit this frame starts burning on the next), and when no entry is left the object is deleted."

[[sym]]
at = "16:B10A"
name = "kfx_chain_draw"
desc = "One burning cell (X = entry): the timer is decremented; draw_x / draw_y = the entry's position minus the camera; the sprite group number timer / 2 of kfx_chain_sprites is drawn through 3E:DCEC; when the timer reached 0 it continues in kfx_chain_spread."
in = "X = entry 0-7"

[[sym]]
at = "16:B149"
kind = "part"
name = "kfx_chain_spread"
desc = "A cell burnt out: for the four neighbours (16 pixels up, right, down, left: the running sums of kfx_chain_dx / kfx_chain_dy from entry 3 to 0) prop_shape_at is asked; for the shapes $0B, $0C and $10, when the list has a free entry, the entry gets timer $86 and the neighbour's position, the block is broken (block_break_at), sound $11, and 3F:E3A7 with A = 1, X = 0."

[[sym]]
at = "16:B1EE"
name = "kfx_jump_star_vel"
desc = "X velocity of the current object = minus Kirby's X velocity (slot 1), 16 bits."

[[sym]]
at = "16:B274"
name = "kfx_handoff_tick"
desc = "obj_bank of the current object = $22, then obj_set_script with the entry of kfx_handoff_script that variable 4 indexes (bank, address high, address low): 22:840C for the only value seen, 0."

# ------------------------------------------------------------------ routines, type 3

[[sym]]
at = "16:B43E"
name = "kfx_shot_wall"
desc = "Whether the current object ran into a wall: by the sign of its X velocity probe_left or probe_right at its position (obj_point); carry set when the probe found a surface in reach and the low byte of probe_dist is 0-$7F (moving left) or $80-$FF (moving right)."
out = "carry set = wall"

[[sym]]
at = "16:B40A"
name = "kfx_shot_star_tick"
desc = "The star shot, once per frame: in water (prop_bit7_at carry set) the script 16:B3DC; else break_at_obj_0, and when it broke a block the shot is deleted; else kfx_shot_wall, and at a wall the script kfx_shot_burst."

[[sym]]
at = "16:B499"
name = "kfx_shot_big_tick"
desc = "The large star, once per frame: in water the script 16:B492; else break_at_obj_1 (the star goes on whatever it answers), then kfx_shot_floor, and with carry set the script kfx_shot_burst."

[[sym]]
at = "16:B506"
name = "kfx_shot_floor"
desc = "kfx_shot_wall; when that is clear, by the sign of the Y velocity probe_up (negative) or probe_down at the object's position: carry set when the probe found a surface in reach and the low byte of probe_dist is $80-$FF (downwards)."
out = "carry set = wall, floor or ceiling"

[[sym]]
at = "16:B6E0"
name = "kfx_shot_laser_tick"
desc = "The laser, once per frame: low byte of the third coordinate = the byte at 16:B6E7 + pose (kfx_laser_z for the poses $20-$2B); break_at_obj_0, and when it broke a block the shot is deleted; else kfx_laser_bounce, and with carry set the script number A of the list behind the call of 3E:D7C6: 0 = 16:B6AC (the bounce), 1 = 16:B6C9 (the end)."

[[sym]]
at = "16:B714"
name = "kfx_laser_bounce"
desc = "The laser against the level. The quarter of variable 1 (0 up, 1 right, 2 down, 3 left) picks probe_up, probe_right, probe_down or probe_left. No surface in reach, or one not yet reached: carry clear. Otherwise the object is moved onto the surface (obj_y_add or kfx_shot_snap_x with probe_dist) and the kind of surface decides: a slope turns variable 1 by a quarter ($40 added or subtracted by the slope's side) and variable 2 counts down, carry set with A = 0 while it is not 0; a flat surface, or the count at 0, gives carry set with A = 1."
out = "carry clear = nothing; carry set, A = 0 turned, A = 1 the end"

[[sym]]
at = "16:B7D7"
name = "kfx_shot_snap_x"
desc = "Adds probe_dist to the current object's X position and writes the sum to its world X position as well; X fraction = $80."

[[sym]]
at = "16:B88C"
name = "kfx_shot_puff_tick"
desc = "The air puff, once per frame: break_at_obj_0, and when it broke a block the shot is deleted; else kfx_shot_wall, and at a wall the script 16:B3FA (kfx_shot_burst without the sound)."

[[sym]]
at = "16:B8D4"
name = "kfx_shot_beam_tick"
desc = "A beam link, once per frame: break_at_obj_0, and when it broke a block the shot is deleted."

# ------------------------------------------------------------------ tables

[[data]]
at = "16:AAB2"
len = 10
name = "kfx_star_off"
format = "bytes"
desc = "Offsets of kfx_star from Kirby by direction (0 up, then clockwise in eighths): -6, -5, 0, 5, 6, 5, 0, -5 and the first two again. Y offset = entry d, X offset = entry d + 2."

[[data]]
at = "16:AB0E"
len = 20
name = "kfx_star_vel_lo"
format = "rows:10"
desc = "Low bytes of kfx_star's velocities: ten entries for the fast set, ten for the slow set (a circle of eight plus the first two again). Y velocity = entry d, X velocity = entry d + 2."

[[data]]
at = "16:AB22"
len = 20
name = "kfx_star_vel_hi"
format = "rows:10"
desc = "High bytes of kfx_star's velocities, as kfx_star_vel_lo. Fast set: -3, -2, 0, 2, 3, 2, 0, -2 pixels a frame; slow set: -2, -1.5, 0, 1.5, 2, 1.5, 0, -1.5."

[[data]]
at = "16:AB72"
len = 4
name = "kfx_dust_tab"
format = "rows:2"
desc = "The dust by facing (right, left): X offsets -4, +4 from Kirby, then the high bytes of the X velocity -2, +2."

[[data]]
at = "16:AFB5"
len = 8
name = "kfx_bubble_vx"
format = "rows:4"
desc = "The bubble's four X velocities, low bytes then high bytes: 1, 1/4, -1, -1/4 pixel a frame."

[[data]]
at = "16:B143"
len = 6
name = "kfx_chain_sprites"
format = "rows:3"
desc = "Addresses of the three sprite groups of a burning cell in bank $1C, low bytes then high bytes: 1C:95AD (timer 0-1), 1C:95A4 (2-3), 1C:959B (4-5)."

[[data]]
at = "16:B1D5"
len = 8
name = "kfx_chain_dx"
format = "rows:2"
desc = "Four 16-bit X steps of kfx_chain_spread, taken from the last to the first and summed: 0, +16, -16, -16."

[[data]]
at = "16:B1DD"
len = 8
name = "kfx_chain_dy"
format = "rows:2"
desc = "Four 16-bit Y steps of kfx_chain_spread, taken from the last to the first and summed: -16, +16, +16, -16."

[[data]]
at = "16:B290"
len = 3
name = "kfx_handoff_script"
format = "bytes"
desc = "The script kfx_handoff_tick starts: bank $22, address high $84, low $0C."

[[data]]
at = "16:B707"
len = 12
name = "kfx_laser_z"
format = "rows:2"
