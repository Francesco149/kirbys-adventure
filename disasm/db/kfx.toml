cases = { "rd[0x61DC + rd[0x6E]] == 0x40" = 10, "rd[0x61DC + rd[0x6E]] != 0x40" = 1 }

[[claim]]
id = "kfx.shot.laser.script"
about = ["kfx_shot_laser"]
text = "The set_var at 16:B694 writes 4 to variable 2 of the object ($61EE + slot), the count kfx_laser_bounce takes down."
kind = "vmop"
op = "set_var"
at = "16:B694"
on = ["main@1015+1200", "main@4110+600", "ufo-fable@2990+400"]
min = 10
expect = "list(args) == [2, 4] and wr[0x61EE + rd[0x6E]] == 4"

[[claim]]
id = "kfx.shot.puff.tick"
about = ["kfx_shot_puff_tick"]
text = "Every call of kfx_shot_puff_tick: the object is deleted exactly when a block was broken; kfx_shot_wall is called exactly when none was; and the object's thread is set to 16:B3FA exactly when kfx_shot_wall went through its carry-set exit."
kind = "call"
fn = "kfx_shot_puff_tick"
on = ["w12-opus@780+1500", "main@17060+600", "w12-opus@8500+60", "w12-sonnet@9360+60", "w1-v2-opus@2020+60", "w12-opus@15400+40", "w12-sonnet@38890+40"]
min_calls = 200
max_calls = 3000
use = ["kfx_model"]
expect = "freed(wr, rd[0x6E]) == ('3F:EEF1' in calls) and ('kfx_shot_wall' in calls) == ('3F:EEF1' not in calls) and script_set(wr, 0xB3FA) == (ran('16:B45D') > 0)"
cases = { "ran('16:B45D') > 0" = 3, "'3F:EEF1' in calls" = 2 }

[[claim]]
