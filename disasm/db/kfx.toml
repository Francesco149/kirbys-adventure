[[model]]
name = "kfx_model"
code = '''
KFX = [0xAA84, 0xAB36, 0xABE5, 0xAC72, 0xAC7B, 0xAC9A, 0xABDC, 0xACAB, 0xAD15, 0xAD3C, 0xAD43, 0xAD97,
       0xAF0D, 0xAF47, 0xAF69, 0xAFFC, 0xB049, 0xB071, 0xB0A0, 0xB1E5, 0xAEE5, 0xAEE2, 0xB22A, 0xB252,
       0xB26F, 0xB293, 0xAECE, 0xB2F5, 0xB206, 0xAC0C, 0xAC23, 0xAB93]
KSHOT = [0xB3B7, 0xB582, 0xB5DA, 0xB68E, 0xB7F8, 0xB866, 0xB8BF, 0xB8DF, 0xB46B, 0xB52D, 0xB8AA, 0xB8E5,
         0xB45F, 0xB465]
KHIT = [0xB3B0, 0xB3B0, 0xB3B0, 0xB3B0, 0xB3AF, 0xB3A5, 0xB3B0, 0xB3AF, 0xB3AF, 0xB3AF, 0xB3B0, 0xB3AF,
        0xB3B0, 0xB3B0]

def s8(v):
    return v - 256 if v & 0x80 else v

def w16(d, lo, hi):
    return d[lo] | d[hi] << 8

def placed(rd, wr, dx, dy):
    k = rd[0x6E]
    return (w16(wr, 0x82 + k, 0x94 + k) == (w16(rd, 0x6075, 0x6087) + dx) & 0xFFFF
            and w16(wr, 0xB8 + k, 0xCA + k) == (w16(rd, 0x6099, 0x60AB) + dy) & 0xFFFF)

def near(rd, wr, lo, hi):
    k = rd[0x6E]
    return (w16(wr, 0x82 + k, 0x94 + k) - w16(rd, 0x6075, 0x6087) - lo) & 0xFFFF < hi - lo

def vel(wr, k):
    return w16(wr, 0x60E0 + k, 0x60F2 + k), w16(wr, 0x6104 + k, 0x6116 + k)

def freed(wr, k):
    return wr.get(0x6128 + k) == 0xFF

def freed_any(wr):
    return any(wr.get(0x6128 + j) == 0xFF for j in range(18))

def script_set(wr, addr, bank=0x16):
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8
               and wr.get(0x63C0 + t) == bank for t in range(32))

def star_vel(rd, wr, romrd):
    k = rd[0x6E]
    d = rd[0x61DC + k]
    lo, hi = O('kfx_star_vel_lo'), O('kfx_star_vel_hi')
    return (vel(wr, k) == (romrd[lo + d + 2] | romrd[hi + d + 2] << 8, romrd[lo + d] | romrd[hi + d] << 8)
            and wr[0x61DC + k] == d + 10)

def dust_alive(rd, wr, ra):
    act = rd[0x5E1]
    if act == 2:
        k = rd[0x6E]
        v = (rd[0x61CA + k] - 1) & 0xFF
        return wr == {0x61CA + k: v} and ra == (1 if v else 0)
    return not wr and ra == (1 if act in (3, 7) else 0)

def bubble_tick(rd, wr, water):
    k = rd[0x6E]
    if not water:
        return freed(wr, k) and (0x61DC + k) not in wr
    t = (rd[0x61DC + k] - 1) & 0xFF
    if t:
        return wr[0x61DC + k] == t and (0x60F2 + k) not in wr and not freed(wr, k)
    v = rd[0x61CA + k]
    return (wr[0x61DC + k] == 8 and w16(wr, 0x60E0 + k, 0x60F2 + k) == (0x100, 0x40, 0xFF00, 0xFFC0)[v]
            and wr[0x61CA + k] == (v + 1) & 3)

def chain_start(rd, wr):
    k = rd[0x6E]
    i = min(j for j in range(8) if 0x158 + j in rd)
    return (rd[0x158 + i] == 0 and wr[0x158 + i] == 6
            and (wr[0x160 + i], wr[0x168 + i], wr[0x170 + i], wr[0x178 + i])
            == (rd[0x6074 + k], rd[0x6086 + k], rd[0x6098 + k], rd[0x60AA + k]))

def chain_tick(rd, wr, mem):
    for i in range(8):
        v, m = rd[0x158 + i], mem(0x158 + i)
        if 0 < v < 0x80:
            if m != v - 1 and not (v == 1 and m == 6):
                return False
        elif v >= 0x80:
            if m != v & 0x7F:
                return False
        elif m not in (0, 6):
            return False
    return freed_any(wr) == all(mem(0x158 + i) == 0 for i in range(8))

def chain_draw(rd, wr, e):
    if rd[0x158 + e] == 1:
        return wr[0x158 + e] in (0, 0x86)
    return (wr[0x158 + e] == rd[0x158 + e] - 1
            and w16(wr, 0x6A, 0x6B) == (w16(rd, 0x160 + e, 0x168 + e) - w16(rd, 0xDD, 0xDE)) & 0xFFFF
            and w16(wr, 0x6C, 0x6D) == (w16(rd, 0x170 + e, 0x178 + e) - w16(rd, 0xE0, 0xE1)) & 0xFFFF)

def chain_spread(rd, wr, calls, e):
    ex, ey = w16(rd, 0x160 + e, 0x168 + e), w16(rd, 0x170 + e, 0x178 + e)
    new = [j for j in range(8) if wr.get(0x158 + j) == 0x86]
    nb = [(ex, (ey - 16) & 0xFFFF), ((ex + 16) & 0xFFFF, ey), (ex, (ey + 16) & 0xFFFF), ((ex - 16) & 0xFFFF, ey)]
    return (len([c for c in calls if c == '3F:ED9C']) == 4
            and len([c for c in calls if c == '3F:EEF1']) == len(new)
            and all((w16(wr, 0x160 + j, 0x168 + j), w16(wr, 0x170 + j, 0x178 + j)) in nb for j in new))

def shot_wall(rd, wr, calls, rp):
    k = rd[0x6E]
    left = rd[0x60F2 + k] >= 0x80
    mine, other = ('3F:F39E', '3F:F4E2') if left else ('3F:F4E2', '3F:F39E')
    if mine not in calls or other in calls:
        return False
    return not rp & 1 or (wr[0x579] < 0x80) == left

def laser_bounce(rd, wr, calls, ra, rp):
    k = rd[0x6E]
    d = rd[0x61DC + k]
    if ('3F:F14D', '3F:F4E2', '3F:F241', '3F:F39E')[d >> 6] not in calls:
        return False
    if not rp & 1:
        return (0x61DC + k) not in wr and (0x61EE + k) not in wr
    if ra == 0:
        return (wr[0x61DC + k] in ((d + 0x40) & 0xFF, (d - 0x40) & 0xFF)
                and wr[0x61EE + k] == rd[0x61EE + k] - 1 and wr[0x61EE + k] != 0)
    return ra == 1 and (0x61DC + k) not in wr and wr.get(0x61EE + k, 0) == 0

def pose_dir(rd, wr, romrd):
    k = rd[0x6E]
    v = list(romrd.values())
    return wr[0x62C6 + k] == (v[0] + (((v[1] >> 1) + rd[0x61DC + k]) & 0xFF) // v[1]) & 0xFF
'''

