[[ram]]
at = "6248"
len = 18
name = "obj_var7"
desc = "Object variable 7 of the scripts (var_base of unit vm: $61CA + 18 * 7), one byte per object. For an object that obj_collide moves it is the foot flag of obj_test_land: 0 when the foot was 0-8 pixels above a floor at the last test; 1 when there was no floor within that reach, when the foot was inside one without landing, or when the object moves up. A foot inside a floor lands only with 0 here. Scripts and other move code keep other things in it."

# ------------------------------------------------------------------ claims

[[model]]
name = "obj_feet"
code = '''
def o16(v):
    return v - 0x10000 if v & 0x8000 else v

def seen(ok):
    # a path that no movie of the corpus ran: the model has no answer for it
    if not ok:
        raise KeyError('a path that never ran')

def opos(rd):
    # the current object and its position, as the tests change it
    o = rd[0x6E]
    return {'o': o, 'x': rd[0x82 + o] | rd[0x94 + o] << 8, 'y': rd[0xB8 + o] | rd[0xCA + o] << 8,
            'xw': False, 'yw': False, 'd': 0, 'k': 0, 'far': None}

def opt(st, dx, dy):
    # obj_pos_off -> X low, Y low, ($4B, $4C)
    px = st['x'] + dx & 0xFFFF
    py = st['y'] + dy & 0xFFFF
    return px & 0xFF, py & 0xFF, (px >> 8, py >> 8)

def opair(romrd, ptr, i):
    b = O('obj_pts') + ptr - A('obj_pts') + i
    return s8(romrd[b]), s8(romrd[b + 1])

def oset(n):
    return A('obj_pts') + 26 * n

def ostep(romrd, i):
    return romrd[O('obj_pts_steps') + i]

def t_up(rd, romrd, st, ptr):
    c, d, k = up(rd, romrd, *opt(st, *opair(romrd, ptr, 0)))
    st['d'] = d
    return (not c and d > 0 and k >= 2), k

def t_floor(rd, romrd, st, ptr):
    c, d, k = down(rd, romrd, *opt(st, *opair(romrd, ptr, 0)))
    st['d'] = d
    return (k >= 2 and d < 8), k

def oapproach(rd, o, k):
    if k == 2:
        return rd[0x6116 + o] < 0x80
    vx = o16(rd[0x60E0 + o] | rd[0x60F2 + o] << 8)
    vy = o16(rd[0x6104 + o] | rd[0x6116 + o] << 8)
    s = {5: vx + vy, 6: vy - vx, 3: (vx >> 1) + vy}.get(k, (-vx >> 1) + vy)
    return s & 0xFFFF < 0x8000

def t_land(rd, romrd, st, ptr):
    c, d, k = down(rd, romrd, *opt(st, *opair(romrd, ptr, 0)))
    st['d'] = d
    if c or d >= 0:
        st['far'] = 1 if c or d >= 9 else 0
        return False, k
    if rd[0x6248 + st['o']]:
        st['far'] = 1
        return False, k
    seen(oapproach(rd, st['o'], k))
    if d < -8:
        st['far'] = 1
        return False, k
    return True, k

def t_right(rd, romrd, st, ptr, flat):
    c, d, k = right(rd, romrd, *opt(st, *opair(romrd, ptr, 0)))
    st['d'], st['k'] = d, k
    return not c and d < 0 and (k == 2 if flat else k >= 2)

def t_left(rd, romrd, st, ptr, flat):
    c, d, k = left(rd, romrd, *opt(st, *opair(romrd, ptr, 2)))
    st['d'], st['k'] = d, k
    return not c and (d >= 0 if flat else d > 0) and (k == 2 if flat else k >= 2)

def xpush(st):
    st['x'], st['xw'] = st['x'] + st['d'] & 0xFFFF, True

def ypush(st):
    st['y'], st['yw'] = st['y'] + st['d'] & 0xFFFF, True

def ovxs(rd, o):
    # obj_vx_sign
    if rd[0x60F2 + o] >= 0x80:
        return 2
    return 1 if rd[0x60F2 + o] or rd[0x60E0 + o] else 0

def hitr(k):
    return {2: 9, 3: 13, 5: 17, 7: 17}.get(k, 29)

def hitl(k):
    return {2: 5, 4: 11, 6: 15}[k]

def fin(romrd, st, c, ra, acc):
    # what a move helper leaves: carry, A, $00, the X and the Y position (None: not written), obj_var7
    return (c, ra, romrd[O('obj_hit_codes') + acc],
            st['x'] if st['xw'] else None, st['y'] if st['yw'] else None, st['far'])

def oafter(rd, wr, rp, ra):
    # the same of a real call; a position counts only when the world position was written with the same value
    o = rd[0x6E]
    px = wr[0x82 + o] | wr[0x94 + o] << 8 if 0x82 + o in wr else None
    py = wr[0xB8 + o] | wr[0xCA + o] << 8 if 0xB8 + o in wr else None
    if px is not None and px != wr[0x6074 + o] | wr[0x6086 + o] << 8:
        px = -1
    if py is not None and py != wr[0x6098 + o] | wr[0x60AA + o] << 8:
        py = -1
    return (rp & 1, ra, wr[0], px, py, wr.get(0x6248 + o))

def walk(rd, romrd, n, level):
    # obj_walk (level = False) and obj_walk_level (True) with set n
    st = opos(rd)
    ptr = oset(n)
    c, k = t_floor(rd, romrd, st, ptr)
    if not c:
        return fin(romrd, st, 0, 0, 0)
    if level and 3 <= k < 7:
        return fin(romrd, st, 1, 1, 0)
    ypush(st)
    s = ovxs(rd, st['o'])
    if s == 0:
        return fin(romrd, st, 1, 0, 0)
    ptr += ostep(romrd, k)
    hit = (t_right if s == 1 else t_left)(rd, romrd, st, ptr, not level)
    if not hit:
        return fin(romrd, st, 1, 0, 0)
    if level:
        seen(st['k'] == 2 if s == 1 else st['k'] < 7)
    xpush(st)
    return fin(romrd, st, 1, 1, 9 if s == 1 else 5)

def sides(rd, romrd, st, ptr, s, steps, flat):
    # the two wall tests of the side the object moves to; True on the first hit
    for i in steps:
        ptr += ostep(romrd, i)
        if (t_right if s == 1 else t_left)(rd, romrd, st, ptr, flat):
            return True
    return False

def collide(rd, romrd, n, anyk):
    # obj_collide (anyk = False) and obj_collide_any (True) with set n
    st = opos(rd)
    o = st['o']
    ptr = oset(n)
    acc = b = 0
    vyh = rd[0x6116 + o]
    if vyh >= 0x80:
        st['far'] = 1
        ptr += ostep(romrd, 7)
        c, k = t_up(rd, romrd, st, ptr)
        if c:
            seen(k == 2)
            ypush(st)
            b, acc = 1, 3
        s = ovxs(rd, o)
        if s and sides(rd, romrd, st, ptr, s, (9, 10), not anyk):
            acc += hitr(st['k']) if s == 1 else hitl(st['k'])
            xpush(st)
            return fin(romrd, st, 0, 2 * b + 1, acc)
        return fin(romrd, st, 0, 2 * b, acc)
    if anyk and not vyh and not rd[0x6104 + o]:
        s = ovxs(rd, o)
        if s and sides(rd, romrd, st, ptr, s, (13, 14), False):
            seen(st['k'] != (8 if s == 1 else 7))
            xpush(st)
            return fin(romrd, st, 0, 1, hitr(st['k']) if s == 1 else hitl(st['k']))
        return fin(romrd, st, 0, 0, 0)
    ptr += ostep(romrd, 8)
    c, k = t_land(rd, romrd, st, ptr)
    if c:
        ypush(st)
        b, acc = 1, {2: 31, 3: 13, 4: 11, 5: 17}.get(k, 15)
    s = ovxs(rd, o)
    if s and sides(rd, romrd, st, ptr, s, (11, 12), not anyk):
        acc += hitr(st['k']) if s == 1 else hitl(st['k'])
        seen(st['k'] not in (7, 8))
        xpush(st)
        return fin(romrd, st, b, 1, acc)
    return fin(romrd, st, b, 0, acc)

def one(rd, romrd, test, *more):
    # one test for the pair at ($0E) -> carry, kind, 16-bit distance, obj_var7
    st = opos(rd)
    r = test(rd, romrd, st, rd[0x0E] | rd[0x0F] << 8, *more)
    c, k = r if isinstance(r, tuple) else (r, st['k'])
    return (1 if c else 0, k, st['d'] & 0xFFFF, st['far'])

def oneafter(rd, wr, rp, kaddr):
    return (rp & 1, wr[kaddr], wr[0x579] | wr[0x57A] << 8, wr.get(0x6248 + rd[0x6E]))
'''

