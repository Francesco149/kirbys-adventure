unit = "ocoll"
title = "The objects against the room: their floor, ceiling and wall tests"
summary = """What the move code of the enemies and items (banks 19, 23-2D) calls to keep an object out of the blocks: the
counterpart in bank 22 of Kirby's tests of unit kcoll, built on the same four probes of unit probes.

Where an object is tested is not fixed as it is for Kirby: the caller passes a number 0-13 in Y, obj_pts_set turns it
into the address of one of 14 sets of 13 offset pairs (obj_pts; a set is the size of an object's box), and every test
probes at the current object's position plus one pair of the set (obj_pos_pair, obj_pos_off). The pairs of a set:
0 the foot of a walker; 1-6 its right and left side, a pair for a flat floor (1, 2), for the floor kinds 3 and 5 (3, 4)
and for the kinds 4 and 6 (5, 6); 7 the head; 8 the foot of an object in the air; 9-12 its right and left side, upper
(9, 10) and lower (11, 12). The tests walk through a set by adding steps to the address (obj_pts_step).

Seven thin tests turn a probe's answer into a carry: obj_test_up (inside a ceiling), obj_test_floor (a floor at or
less than 8 pixels below the foot, or the foot inside it), obj_test_land (the foot is in a floor that it was just above
at the test before; the flag for that is obj_var7, object variable 7 of the scripts), obj_test_right_flat / obj_test_left_flat (in a flat wall), obj_test_right /
obj_test_left (in a wall of any kind). obj_x_push and obj_y_push move the object by the probe's distance.

Three families of move helpers use them. obj_walk (obj_walk0 for set 0): an object that follows the floor; carry set
= it is on a floor (and it was put on its surface), A = 1 when a flat wall stopped it. obj_walk_level: the same for
set 2, but it does not step onto a slope (A = 1, carry set) and walls of every kind stop it. obj_collide (with
obj_collide0, obj_collide_any, obj_collide_any0): an object in the air; moving up it tests the head, moving down the
foot, then the two points of the side it moves to. Up: carry clear, A bit 1 = the ceiling stopped it, bit 0 = a wall.
Down: carry set = it landed, A = 1 = a wall. The _any entries stop at walls of every kind and, with a Y velocity of
exactly 0, test the walls only. Every helper ends in obj_hit_result, which turns the sum of the numbers the tests
added to $0A into a number in $00 through obj_hit_codes.

obj_shape_off and obj_shape_ahead ask for the shape of the block at an offset from the object.

In pictures: main@3760 two enemies stand on the ground and on a slope (slots 9 and 10; obj_walk0 runs for each of
them every frame).

Open: what the numbers of obj_hit_codes in $00 mean is in the callers, as is everything else they do with the
answers. Paths that never ran and are not described: obj_test_floor for a kind of 7 or more (it would not return);
obj_floor_approach answering carry clear (an object moving away from the floor); a ceiling of kind 7 or 8 in
obj_collide's way up (22:983B) and a wall of kind 7 or 8 on its way down (22:9A30); obj_hit_left for the kinds 8 and
the rest (22:9CB9); obj_walk_right_any for a kind above 2 and both _any walks for a kind of 7 or more; obj_level_right
answering A = 2 (kind 8) and obj_level_left answering A = 2 (kind 7). Of obj_ahead_left / obj_ahead_right only the
entries 1 and 5 were read, and of obj_pts not every pair of every set. Not in the unit: 22:9684 (obj_walk0, then
obj_shape_ahead for a floor ahead), the water tests 22:8345, 22:8371 / 22:8373, 22:83A3 (obj_pos_off at (0, 6) or
(0, 7), then prop_bit7_at; the path that finds water ran twice), 22:8A6C, 22:8AC6, and the other callers of
obj_pos_off in banks 19 and 23-2D. obj_var7 is written by some 30 other routines
(vm_op_set_var, 19:AFFC, 36:B0ED, 3D:AE21 among them) for objects that use it for something else; those uses are not
described. 2D:B130 is a ninth user of obj_y_push (probe_down at (0, 15), 3 runs)."""

# ------------------------------------------------------------------ the point

[[sym]]
at = "22:9E67"
name = "obj_pos_off"
desc = "Puts the position of the current object plus a signed offset where the probes and block_prop_at want a point: $4B and X = high and low byte of X position + X, $4C and Y = high and low byte of Y position + Y. The position is obj_x_lo / obj_x_hi and obj_y_lo / obj_y_hi (21:9D01 of unit kblocks does the same from the world position)."
in = "X, Y = signed offsets"
out = "$4B:X, $4C:Y = the point; $11 = the X offset"

[[sym]]
at = "22:9E5A"
name = "obj_shape_off"
desc = "obj_pos_off, then prop_shape_at: the shape number of the block at the current object's position plus (X, Y). Carry set when the number is 2 or more (2-$81 by the signed compare)."
in = "X, Y = signed offsets"
out = "A = the shape number; carry set: it is 2 or more"

[[sym]]
at = "22:9EB0"
name = "obj_shape_ahead"
desc = "obj_shape_off for a point ahead of the current object: the X offset is entry A of obj_ahead_left when the object's X velocity is negative and of obj_ahead_right otherwise, the Y offset is Y."
in = "A = entry 0-5, Y = signed Y offset"
out = "as obj_shape_off"

[[data]]
at = "22:9ECE"
len = 6
name = "obj_ahead_left"
format = "bytes"
desc = "obj_shape_ahead's X offsets for an object that moves left: -7, -3, 0, 4, -10, 8. Only the entries 1 and 5 were read."

[[data]]
at = "22:9ED4"
len = 6
name = "obj_ahead_right"
format = "bytes"
desc = "obj_shape_ahead's X offsets for an object that does not move left: 7, 4, 0, -3, 10, -8. Only the entries 1 and 5 were read."

[[sym]]
at = "22:9C79"
name = "obj_pos_pair"
desc = "obj_pos_off with the offsets taken from the table at ($0E): X = byte Y, Y = byte Y + 1. The table is a place inside obj_pts."
in = "Y = index, $0E/$0F = address"
out = "as obj_pos_off"

[[sym]]
at = "22:9CC7"
name = "obj_pts_set"
desc = "$0E/$0F = the address of set Y of obj_pts, from obj_pts_lo and obj_pts_hi."
in = "Y = set, 0-13"

[[data]]
at = "22:9CD2"
len = 14
name = "obj_pts_lo"
format = "bytes"
desc = "Low bytes of the addresses of the 14 sets of obj_pts."

[[data]]
at = "22:9CE0"
len = 14
name = "obj_pts_hi"
format = "bytes"
desc = "High bytes of the addresses of the 14 sets of obj_pts."

[[data]]
at = "22:9CEE"
len = 364
name = "obj_pts"
format = "rows:26"
desc = "14 sets of 13 pairs (X offset, Y offset, signed): the points around an object at which the tests probe. Pair 0: the foot for obj_walk. Pairs 1 / 2: right / left side on a flat floor; 3 / 4 on a floor of kind 3 or 5; 5 / 6 on a floor of kind 4 or 6. Pair 7: the head. Pair 8: the foot for obj_collide. Pairs 9 / 10: right / left side, upper; 11 / 12: lower. Set 0 is (0, 7), (6, 0), (-7, 0), (6, -8), (-7, -8), (6, 0), (-7, -8), (0, -8), (0, 7), (6, -7), (-7, -7), (6, 6), (-7, 6); the largest, set 4, reaches 15 pixels to each side."

[[sym]]
at = "22:9C59"
name = "obj_pts_step_kind"
desc = "obj_pts_step for Y = $0C, the kind of floor obj_test_floor found: from pair 0 to pair 1 for kind 2, pair 3 for the kinds 3 and 5, pair 5 for the kinds 4 and 6."

[[sym]]
at = "22:9C5B"
name = "obj_pts_step"
desc = "Adds entry Y of obj_pts_steps to the address in $0E/$0F (16 bits): moves on in a set of obj_pts."
in = "Y = entry, 2-14"

[[data]]
at = "22:9C6A"
len = 15
name = "obj_pts_steps"
format = "bytes"
desc = "The steps of obj_pts_step in bytes. Entries 2-6, by kind of floor: 2, 6, 10, 6, 10. Entry 7: 14 (from the start of a set to the head, pair 7); 8: 16 (to pair 8, the foot); 9 and 11: 4 and 2 (from the head and from the foot to pair 9); 10 and 12: 4 (on to pair 11); 13: 18 (from the start to pair 9); 14: 4. Entries 0 and 1 were never read."

# ------------------------------------------------------------------ the tests

[[sym]]
at = "22:9B16"
name = "obj_test_up"
desc = "probe_up at the pair at ($0E). $0C = the kind of surface. Carry set when a surface was found at a positive distance (the point is inside it) and the kind is 2 or more."
in = "$0E/$0F = address of the pair"
out = "carry; $0C = kind; probe_dist"

[[sym]]
at = "22:9B32"
name = "obj_test_floor"
desc = "probe_down at the pair at ($0E). $0C = the kind, $12 = the low byte of the distance; then through obj_test_floor_tab by the kind: obj_floor_none for 0 and 1, obj_floor_near for 2-6. The probe's carry is not looked at: a point deep inside (kind 2, distance -32) counts as near."
in = "$0E/$0F = address of the pair"
out = "carry set: a floor at less than 8 pixels below the point, or the point is in it; $0C = kind; probe_dist"

[[data]]
at = "22:9B53"
len = 14
name = "obj_test_floor_tab"
format = "ptr16"
desc = "obj_test_floor by kind of surface 0-6: obj_floor_none twice, obj_floor_near five times."

[[sym]]
at = "22:9B61"
kind = "part"
name = "obj_floor_near"
desc = "The end of obj_test_floor for a floor: carry set when the distance in $12 is negative or less than 8, else carry clear (through obj_floor_none)."

[[sym]]
at = "22:9B6B"
kind = "part"
name = "obj_floor_none"
desc = "The end of obj_test_floor without a floor: carry clear."

[[sym]]
at = "22:9B6D"
name = "obj_test_land"
desc = "probe_down at the pair at ($0E), $0C = the kind. No surface, or one 9 or more pixels below: obj_var7 of the current object = 1, carry clear. A surface 0-8 pixels below: obj_var7 = 0, carry clear. The point inside a floor (a negative distance): carry set when obj_var7 is 0, obj_floor_approach answers carry set and the point is no more than 8 pixels deep; otherwise obj_var7 = 1 and carry clear. So an object lands only on a floor that its foot was just above one test earlier."
in = "$0E/$0F = address of the pair"
out = "carry set: landed; $0C = kind; X = the current object; probe_dist"

[[sym]]
at = "22:9EDA"
name = "obj_floor_approach"
desc = "Looks at the velocity of object X against a floor of the kind in $0C: kind 2 the Y velocity, 5 X + Y, 6 Y - X, 3 X / 2 + Y, any other (4) Y - X / 2 (Kirby's 21:9324 with the object's velocity). The number was never negative when it ran, and the answer always carry set."
in = "X = object, $0C = kind"
out = "carry set; A = the byte at $10"

[[sym]]
at = "22:9BA2"
name = "obj_test_right_flat"
desc = "probe_right at the pair at ($0E). $0D = the kind. Carry set (and A = 2) when a surface of kind 2 was found at a negative distance: the point is inside a flat wall."
in = "$0E/$0F = address of the pair"
out = "carry; $0D = kind; probe_dist"

[[sym]]
at = "22:9BBB"
name = "obj_test_left_flat"
desc = "probe_left at the pair at ($0E) + 2. $0D = the kind. Carry set (and A = 2) when a surface of kind 2 was found at a distance that is not negative (0 counts, unlike obj_test_left)."
in = "$0E/$0F = address of the pair before"
out = "carry; $0D = kind; probe_dist"

[[sym]]
at = "22:9BD4"
name = "obj_test_right"
desc = "probe_right at the pair at ($0E). $0D = the kind. Carry set (and A = the kind) when a surface of kind 2 or more was found at a negative distance."
in = "$0E/$0F = address of the pair"
out = "carry; $0D = kind; probe_dist"

[[sym]]
at = "22:9BED"
name = "obj_test_left"
desc = "probe_left at the pair at ($0E) + 2. $0D = the kind. Carry set (and A = the kind) when a surface of kind 2 or more was found at a positive distance."
in = "$0E/$0F = address of the pair before"
out = "carry; $0D = kind; probe_dist"

[[sym]]
at = "22:9C08"
name = "obj_x_push"
desc = "Adds probe_dist (16 bits) to the X position of the current object and writes the result to its world X position as well."
out = "X = the current object"

[[sym]]
at = "22:9C25"
name = "obj_y_push"
desc = "Adds probe_dist (16 bits) to the Y position of the current object and writes the result to its world Y position as well."
out = "X = the current object"

[[sym]]
at = "22:9C42"
name = "obj_vx_sign"
desc = "The direction of the current object's X velocity: A = Y = 0 when it is 0, 1 when positive, 2 when negative."
out = "A = Y = 0, 1 or 2; X = the current object"

[[sym]]
at = "22:9C83"
name = "obj_hit_right"
desc = "Adds a number for a wall on the right to $0A, by the kind in $0D: 9 for kind 2, 13 for 3, 17 for 5 and 7, 29 for the rest."

[[sym]]
at = "22:9CA5"
name = "obj_hit_left"
desc = "Adds a number for a wall on the left to $0A, by the kind in $0D: 5 for kind 2, 11 for 4, 15 for 6."

[[sym]]
at = "22:98F0"
kind = "part"
name = "obj_hit_result"
desc = "Where every move helper of the unit returns to (they push its address - 1 first): $00 = entry $0A of obj_hit_codes. A and the flags are kept, so the helper's answer goes on to its caller."
out = "$00; A and carry as the helper left them"

[[data]]
at = "22:98FC"
len = 52
name = "obj_hit_codes"
format = "rows:16"
desc = "By the sum of the numbers the tests added to $0A (ceiling 3; floor 31, 13, 11, 17, 15 for the kinds 2-6; wall right 9, 13, 17, 29; wall left 5, 11, 15): a number 0-$19, or $FF for a sum that stands for nothing (0 = nothing was hit is $FF). 3 -> 1, 5 -> 2, 9 -> 3, 31 -> 0, 36 -> 10, 40 -> 11."

