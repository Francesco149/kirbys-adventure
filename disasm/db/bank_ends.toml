NOISE = ["endnoise_11_B126", "endnoise_12_9F8A", "endnoise_13_BFD8", "endnoise_14_BFC4", "endnoise_15_BF11",
         "endnoise_16_BABA", "endnoise_17_BC4A", "endnoise_18_B988", "endnoise_19_BB5D", "endnoise_1B_9FC2",
         "endnoise_1C_9FF7", "endnoise_1D_9EC4", "endnoise_1E_BF62", "endnoise_1F_BE13", "endnoise_20_BC69",
         "endnoise_21_9F02", "endnoise_22_9F9B", "endnoise_23_BEE8", "endnoise_24_BB32", "endnoise_25_BD95",
         "endnoise_26_BD85", "endnoise_27_BDAD", "endnoise_28_BF5A", "endnoise_29_BFD2", "endnoise_2A_BFEC",
         "endnoise_2B_BC51", "endnoise_2D_BDDC", "endnoise_2E_BCD0", "endnoise_2F_BE2E", "endnoise_30_9F96",
         "endnoise_31_9FCF", "endnoise_32_9FC3", "endnoise_33_9FA2", "endnoise_34_BE42", "endnoise_35_9DEC",
         "endnoise_36_BF94", "endnoise_37_9E76", "endnoise_38_BFE4", "endnoise_39_97F4", "endnoise_3A_9F64",
         "endnoise_3B_BF45", "endnoise_3C_BF53", "endnoise_3D_BFBD"]
POP = [bin(i).count("1") for i in range(256)]
def counts(o, n):
    d = rom[o:o + n]
    return [sum(POP[x & 0x55] for x in d), sum(POP[x & 0xAA] for x in d),
            sum(POP[d[i]] for i in range((o & 1), n, 2)), len(range((o & 1), n, 2)),
            sum(POP[d[i]] for i in range(1 - (o & 1), n, 2)), len(range(1 - (o & 1), n, 2))]
def regions():
    return [(O(r), 0x2000 - (O(r) & 0x1FFF)) for r in NOISE]
def total(cs):
    return [sum(c[k] for c in cs) for k in range(6)]
def rest():
    mask = bytearray(len(rom))
    for o, n in regions():
        mask[o:o + n] = bytes([1]) * n
    d = bytes(x for x, m in zip(rom, mask) if not m)
    ev = bytes(x for i, (x, m) in enumerate(zip(rom, mask)) if not m and i % 2 == 0)
    od = bytes(x for i, (x, m) in enumerate(zip(rom, mask)) if not m and i % 2 == 1)
    return [sum(POP[x & 0x55] for x in d), sum(POP[x & 0xAA] for x in d), sum(POP[x] for x in ev), len(ev),
            sum(POP[x] for x in od), len(od)]
'''
expect = "len(NOISE) == 43 and sum(n for o, n in regions()) == 22539 and (cs := [counts(o, n) for o, n in regions()]) and all(c[0] > c[1] and c[2] * c[5] > c[4] * c[3] for c, (o, n) in zip(cs, regions()) if n >= 40) and (t := total(cs))[0] > 1.6 * t[1] and t[2] * t[5] > 1.55 * t[4] * t[3] and 0.9 < (r := rest())[0] / r[1] < 1.05 and 0.9 < (r[2] * r[5]) / (r[4] * r[3]) < 1.05"

