len = 90
name = "old_13_credits_1"
format = "packed"
unpacked = 125
never = true
desc = """Never read. A copy of packed_13_BE72 (the staff page ATSUSHI KAKUTA / YASUHIRO SAKAI / HIDEKI FUJII of the
staff roll), $B1 bytes after it: the place the page had in an older build of bank 13."""

[[data]]
at = "13:BF7D"
len = 91
name = "old_13_credits_2"
format = "packed"
unpacked = 125
never = true
desc = """Never read. An older version of packed_13_BECC (the second page of staff names of demo 7, hud_picture
$2D), $B1 bytes after it: the same first 69 bytes, and it expands to the same 125 bytes but for its last row,
which is CLAUDE M. MOYSE (tiles 28 31 26 3A 29 2A, D5 the full stop) where the live page has DAN OWSEN. With
packed_13_lo_2d / packed_13_hi_2d set to $7D / $BF, hud_update expands it and the staff roll shows SPECIAL
THANKS TO / HALKEN DEBUGGERS / NINTENDO DEBUGGERS / CLAUDE M. MOYSE."""

# ================================================================== the pause screen (bank 38)

[[data]]
at = "38:BF21"
len = 66
name = "old_38_pause_attack"
format = "bytes"
never = true
desc = """Never read. The end of a German version of packed_38_BE52 (pause text entry 24, which ends "You can attack
four different ways."), from an older build in which it ended $C3 bytes later: its first nine bytes are cut
off mid-command, then literal "Nun kannst Du auf" and tile $E0 (38:BF2A), 21 spaces, literal "verschiedene
Arten", 22 spaces, literal "angreifen", a copy of 11 bytes and the terminator $FF at 38:BF62. The font is the
pause screen's (a = $40, A = $5A, space $BC)."""

[[data]]
at = "38:BF63"
len = 114
name = "old_38_pause_rod"
format = "packed"
unpacked = 222
never = true
desc = """Never read. A whole packed stream of the pause screen's format in German: the title ZEPTER in the big
letters ($FF $EA $F5 $F9 $EA $F7) and the text "Das magische Stern- / zepter bekämpft die / schlimmsten Alp- /
träume, die man sich / denken kann" ($C5 for the umlaut, which the pause screen's tiles draw as a red bar). The
live text for the Star Rod (pause_desc entry 25, 38:BEC1) has the title STAR ROD and "Make the final effort.
Shoot the star to defeat the final enemy." With pause_desc_lo / _hi entry 0 set to $63 / $BF, pause_open
expands it for Kirby without an ability."""

[[data]]
at = "38:BFD5"
len = 15
name = "old_38_pause_unpack"
format = "bytes"
never = true
desc = """Never runs. pause_unpack of an older build, $C3 bytes after the live one: the same 15 bytes, but its jmp
goes to $C47D, $43 above unpack ($C43A)."""

