[[claim]]
id = "bank_ends.credits.copy"
about = ["old_13_credits_1", "old_13_credits_2"]
text = """old_13_credits_1 is the 90 bytes of packed_13_BE72 and starts $B1 after it; old_13_credits_2 starts $B1 after
packed_13_BECC, shares its first 69 bytes, parses as a packed stream whose terminator is its 91st byte, and expands
to 125 bytes equal to packed_13_BECC's but for the last row (bytes 100-124): 81 81 81 81 28 31 26 3A 29 2A 81 32 D5
81 32 34 3E 38 2A and six 81 (CLAUDE M. MOYSE) where packed_13_BECC has DAN OWSEN. None of the 45 entries of
packed_13_lo / packed_13_hi names either."""
kind = "static"
model = '''
def unpk(o):
    out = []
    while rom[o] != 0xFF:
        b = rom[o]
        if b & 0xE0 == 0xE0:
            c, n, h = b >> 2 & 7, ((b & 3) << 8 | rom[o + 1]) + 1, 2
        else:
            c, n, h = b >> 5, (b & 0x1F) + 1, 1
        a = o + h
        if c == 0:
            out += list(rom[a:a + n]); k = n
        elif c == 1:
            out += [rom[a]] * n; k = 1
        elif c == 2:
            out += [rom[a], rom[a + 1]] * n; k = 2
        elif c == 3:
            out += [(rom[a] + i) & 0xFF for i in range(n)]; k = 1
        else:
            r = rom[a] << 8 | rom[a + 1]; k = 2
            for i in range(n):
                v = out[r - i] if c == 6 else out[r + i]
                out.append(int(bin(v | 256)[3:][::-1], 2) if c == 5 else v)
        o += h + k
    return out, o
'''
