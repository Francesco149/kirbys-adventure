len = 751
name = "old_18_kirby"
format = "bytes"
never = true
desc = """Never runs. An older copy of 18:B3AA-B698 (the end of scr_18_B3A7, kirby_s_swallow_done's neighbours,
kirby_st_swallow, swallow_blink_add, the mouth-full water scripts and states, full_swim_gravity,
kirby_s_full_bump, bump_take), placed $2EF bytes further on: where the bank had it in an older build. It
differs from the live bytes only in addresses and in one value: at 18:B940 (live 18:B651) full_swim_gravity's
stroke loads A = $1A, so kirby_vy_set gave $FF1A (-0.90 pixel a frame) where the live code gives $FF40 (-0.75).
The addresses: 38 pointers into bank 18 and one split pair (lda #$96 / ldy #$B6 for the script 18:B3A7) are $2EF
higher, four into the fixed bank $43 higher ($DE4B twice, $CCA7 obj_set_script, $E3CB were $DE8E, $CCEA,
$E40E), and call_far abl_show names 19:B0BA, 13 higher than the live 19:B0AD."""

