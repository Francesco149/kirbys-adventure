unit = "bank_ends"
title = "What the build left at the ends of the banks: an older build's credits and German pause texts, older copies of live code, and the build machine's memory"
summary = """
The bytes after the last live byte of 41 banks, 24,146 in all. Nothing reads them. Most of it is noise, but at the
start of several bank ends sit the remains of an older build of the same bank, at the place its contents had then.

The finds, most interesting first:
- 13:BF7D (old_13_credits_2): an older version of the second page of staff names that the staff roll of demo 7
  shows (packed_13_BECC, hud_picture $2D). It reads SPECIAL THANKS TO / HALKEN DEBUGGERS / NINTENDO DEBUGGERS /
  CLAUDE M. MOYSE, where the game shows DAN OWSEN. The page before it (old_13_credits_1) is packed_13_BE72 byte for
  byte. Pointing packed_13_lo_2d / _hi_2d at it shows the page in the staff roll (claim bank_ends.credits.patch,
  picture unused/bank_ends-credits.png).
- 38:BF21-BFE3: German pause texts. old_38_pause_attack is the end of a German version of the text of pause entry
  24 (packed_38_BE52, "...You can attack four different ways."): "Nun kannst Du auf [tile $E0] verschiedene Arten
  angreifen". old_38_pause_rod is a whole packed stream, a German text for the Star Rod (the live one is
  38:BEC1): the title ZEPTER and "Das magische Stern-zepter bekämpft die schlimmsten Alp-träume, die man sich
  denken kann" (the umlaut is tile $C5, which on the pause screen draws as a red bar). After it, old_38_pause_unpack
  is pause_unpack with its jmp to unpack + $43. Pointing pause_desc entry 0 at the stream shows it on the pause
  screen (claim bank_ends.pause_de.patch, picture unused/bank_ends-zepter.png).
- 18:B699 (old_18_kirby): an older copy of 18:B3AA-B698 (Kirby's swallow scripts, the mouth-full water states,
  full_swim_gravity, kirby_s_full_bump, bump_take), 751 bytes ($2EF) further on. Apart from addresses it differs in
  one byte: full_swim_gravity's stroke (Up or A under water with the mouth full) set kirby_vy = $FF1A (-0.90 pixel
  a frame) where the live code sets $FF40 (-0.75). Its pointers into bank 18 are all $2EF higher; its calls into
  the fixed bank $43 higher ($DE4B, $CCA7, $E3CB were $DE8E, $CCEA, $E40E); its call_far abl_show was 19:B0BA,
  13 higher, and bank 19's end holds a 13-byte repeat (old_19_tail).
- 2E:BC3D (old_2e_ending): an older copy of 2E:BBAA-BC3C (the end of ending_spr_pal_load, ending_spr_pal_ofs,
  ending_spr_pals, ending_fade_spr, ending_fade_rec, ending_free_others, the_end_tick, the_end_reset), $93
  further on, identical but for addresses: its own bank's $93 higher, the fixed bank's $43 higher (palette_load,
  color_fade, ppu_record, obj_free, obj_set_script, far_call), and the_end_reset's far call help_screen at 2E:AA0A
  ($7F higher).
- 3D:BF57 (old_3d_rematch): rematch_next, its four tables and scene_no_split, $66 further on; only the four table
  addresses differ.
- 35:9DDA (old_35_menu): the last 18 bytes of an older packed_35_9D74 (the minigames' level menu), 18 bytes longer:
  its last word ends in the tiles A S S E N where the live stream has QUIT.
- 16:BAB1 (kfx_held_drop_short): a 9-byte script that uses this build's addresses: kfx_held_drop without the sound
  $40 and the quake effect (asm_w kfx_held_pos_from_world, on_move 3F:D864, jmp 16:BAA6). Nothing points at it.
- Repeats of a live tail: the last N bytes of the bank repeated right after it, what an older build N bytes
  longer left: bank 19 (13 bytes, e05_floor), 23 (17, e06_cam_follow_kirby), 25 (8, e0a_abilities), 28 (4,
  switch_heal_step), 34 (58, pal_bank34), 36 (11, finale_rod_kirby), 3B (34, packed_3B_BBCE), 3C (22, egg_vx_neg
  and the code before it). 3A:9F5B is the sprite group spr_3A_9F07 again; 11:B115 continues the empty object
  lists (01 01 00) of room_objlists_11_A7E2 for 17 bytes.
- All the relocated copies that call the fixed bank (18, 2E, 38) agree on the same shift, +$43: they come from
  one older build, whose bank 38 had German texts.
- Noise: 43 regions, 22,539 bytes. Bits 0, 2, 4, 6 are set 1.63 times as often as bits 1, 3, 5, 7, and bytes at
  even addresses hold 1.59 times as many set bits as bytes at odd ones; in the rest of the PRG both ratios are
  about 1. That is the power-up state of a RAM, not code or a table. Its density changes by groups of banks
  (58-69% of the bits set in banks 20-23 and 30-33, 46-49% in 24-2B, 8-16% in 18-1F and 34-37, 95-98% in 3C-3D). No
  16-byte run of it occurs twice in the PRG: no bank's garbage is a copy of another's.
- Seven bank ends of 1 to 4 bytes: 00, and 04 40 00 00 at 1A:9FFC (bankend_*).

Open:
- Which build the leftovers come from is not in the ROM: what is visible is one build with German pause texts,
  a fixed bank $43 longer before $C0DA, bank 18 $2EF longer before 18:AF53, and the Claude M. Moyse credit.
- Tile $E0 of the German attack text and the punctuation tiles $74, $76, $77, $78 are named from their place in
  the English texts, not from the CHR.
- "...ASSEN" in bank 35 fits the German VERLASSEN, but only the five letters are left.
"""

# ================================================================== the staff roll (bank 13)

