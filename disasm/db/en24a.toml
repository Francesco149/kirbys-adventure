def e0e_speed(rd, wr, rom):
    s = rd[0x6E]
    v = rom[O("e0e_speeds") + 2 * rd[0x0784 + s]] | rom[O("e0e_speeds") + 2 * rd[0x0784 + s] + 1] << 8
