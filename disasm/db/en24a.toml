[[script]]
at = "24:A000"
name = "e0e_start"
desc = """
First script of object type $0E: a round creature with a pale face and two feet that walks along the ground (the
first enemy of stage 1-1; main@660, on the ground right of Kirby). Kinds $00-$03 and $38-$3F of the rooms' object
lists create it; the kind gives variable 0 (the variant: 0 in kinds $00-$03, 1 in $38-$3B, 2 in $3C-$3F) and
variable 1 (the speed class 0-3). The script maps bank 22, copies the variant to variable 6, installs the position
routine 3E:D9BB and the pose table 30:8000, keeps the speed class as obj_param (obj_param_set), gives the object 2 hit
points (variable 0), turns it toward Kirby (obj_face_kirby) and sets the timer of variant 2 (variable 2) to $50.
It runs on into e0e_walk.
"""

[[script]]
at = "24:A019"
name = "e0e_walk"
desc = """
Type $0E walks. Velocity 0, tick routine e0e_tick_walk, then the speed e0e_speeds[obj_param] along obj_dir (22:8B61:
a word of a table by obj_param becomes both velocities through 3F:E247; for the directions $40 and $C0 that is the
speed to the right or to the left), variable 5 = e0e_pace_frames[obj_param] (the frames variant 1 walks before it
turns), and the walk cycle: the pose 0 (1 facing left, obj_pose_dir0) and the pose two further, each for
e0e_step_waits[obj_param] frames, for ever. The tick routines come back here after a turn and after a landing.
"""

[[script]]
at = "24:A03B"
name = "e0e_fall"
desc = "Type $0E walked off a floor (e0e_tick_walk found none): the tick routine becomes e0e_tick_air and the walk cycle of e0e_walk goes on (the thread jumps into its loop at 24:A02A)."

[[script]]
at = "24:A042"
name = "e0e_jump"
desc = """
Type $0E, variant 2, jumps. Sound $0D; the tick routine e0e_tick_still (it can be hit, nothing else) and the move
routine obj_move_copy (3E:D867), which applies no velocity: 16 frames of the two walk poses, 4 frames each. Then the move
routine obj_move (3E:D864) again, the tick routine e0e_tick_air, Y velocity -$0280 (2.5 pixels per frame upward), the pose
of its direction, and the thread parks; e0e_tick_air starts e0e_walk when it lands.
"""

[[data]]
at = "24:A062"
len = 14
name = "e0e_speeds"
format = "rows:2"
desc = "Seven speeds (16 bits, 256 = one pixel per frame), by obj_param: $0080, $00C0, $0100, $0180, and again $0080, $00C0, $0100. e0e_walk reads the entries 0-3 through 22:8B61, the walk of type $0F (e0f_walk) the same table through asm_vx_tab."

[[data]]
at = "24:A070"
len = 4
name = "e0e_step_waits"
format = "bytes"
desc = "Frames per pose of the walk cycle, by obj_param: 13, 10, 8, 6. Read through asm_tab_wait by e0e_walk and by the walk of type $0F."

[[data]]
at = "24:A074"
len = 4
name = "e0e_pace_frames"
format = "bytes"
desc = "The frames variant 1 of type $0E walks before it turns round, by obj_param: $C0, $80, $60, $40. With the speeds of e0e_speeds every entry is 96 pixels. e0e_walk copies the entry to variable 5."

[[sym]]
at = "24:A078"
name = "e0e_tick_walk"
desc = """
Tick routine of type $0E on the ground. e0e_hit first; when that changed the object (carry set) nothing more. Then
obj_walk0. No floor: a variant of 2 or more becomes 3 (variable 6), and the script becomes e0e_fall. A flat wall
stopped it (A = 1): obj_turn_pose and the script e0e_walk again. Otherwise by variable 6: 0 nothing (it walks on
until a wall or an edge); 1 counts variable 5 down and at 0 turns as at a wall (it paces up and down; no movie lets the count run out,
the experiment en24a.e0e.pace_effect does); 2 and 3
count variable 2 down and at 0 ask random for a number below 4: 0 makes it jump (variable 6 = 2, script e0e_jump),
anything else sets variable 2 to $1E for the next try.
"""
comments = { "A082" = "carry set: on a floor; bit 0 of A: a wall", "A089" = "variable 6: the variant", "A091" = "variants 2 and 3: the timer of the jump", "A0B8" = "variant 1: the frames left before the turn" }

[[sym]]
at = "24:A0DD"
name = "e0e_tick_air"
desc = """
Tick routine of type $0E in the air (a fall from an edge or the jump of e0e_jump). e0e_hit first; carry set: nothing
more. Then obj_collide0. Landed (carry set): sound $0E, variable 2 = $50, script e0e_walk. Otherwise a wall (bit 0
of A) turns it (obj_turn_pose); a ceiling (bit 1) sets the Y velocity to 0 (and the X velocity when $0C is 7 or more,
which never ran); without a ceiling obj_gravity, and unless variable 6 is 2 (the jump keeps its speed) obj_vx_slow.
"""

[[sym]]
at = "24:A133"
name = "e0e_tick_still"
desc = "Tick routine of type $0E while it gathers itself for the jump: obj_water_test, then 3F:E31D with the record 39:8B7C."
out = "carry as 3F:E31D left it"

[[sym]]
at = "24:A13E"
name = "e0e_hit"
desc = """
What every other tick routine of type $0E begins with: obj_water_test2 (in water the object gets the script 22:833B
and the callers do not go on), then 3F:E31D with the record 39:8B7C: a box of 8 x 8 pixels around the position, no
flags, nothing to copy when inhaled ($FF), touching it hurts Kirby, score entry 5; inhaled it gets the script
22:8003, with its hit points gone 22:8100.
"""
out = "carry set: the hit test changed the object"

