[[script]]
at = "24:A325"
name = "e10_start"
desc = """
First script of object type $10: a black cannon on a small base that does not move, turns its barrel and shoots
round shots (main@22030: the cannon on the ledge at the lower left with its shot above it). The game's Shotzo: its record has no
reaction at all, so the hit test never changes it. Kinds $08-$0B create the kind that aims (variable 0
= 0, speed class 0-3 in variable 1), kinds $0C-$0E the kind that keeps its direction (variable 0 = 1, 2, 3).
obj_setup (variable 0 = the register, obj_param, bank 22, the position routine, obj_face_kirby) returns what
variable 0 held, which the script keeps in variable 5; when it is not 0, e10_fixed_dir sets the direction. Then the
pose table 30:806E, variable 6 = 0, e10_water_once, and from 24:A33B (where e10_tick_fall comes back after a
landing) by variable 5: 0: the pose of the direction (e10_asm_pose), velocity 0 and on into e10_aim; otherwise
e10_burst.
"""

[[script]]
at = "24:A345"
name = "e10_aim"
desc = """
The aiming cannon's cycle. Variable 3 = 0, the pose of the direction, tick routine e10_tick, a wait of
e10_aim_waits[obj_param] frames (24:A34C). Then e10_turn: when it turned the barrel one step toward Kirby, the cycle
starts again; when the barrel already points at him and variable 3 is 0, it fires: tick routine e10_hit, a new
object of type $51 (e10_shot) at its place, four steps of recoil two frames apart (e10_recoil, which counts in
variable 3), velocity 0, variable 3 = 1, and back to the wait at 24:A34C. With variable 3 = 1 (it has just fired
and not turned since) it starts the cycle again without firing, which clears variable 3: it fires every second wait
at a Kirby who stays in line.
"""

[[script]]
