unit = "en24a"
title = "Object types $0E-$11: the first four enemies of bank 24"
summary = """
The first four enemies of the game, all of bank 24 from 24:A000 to 24:A8C1: for each type its scripts, the 6502
routines the scripts install as the per-frame tick or call through the asm opcodes, and the small tables between
them. The pattern is the same for all four. The first script sets the object up (bank 22 for the helpers of units
ohelp and ocoll, obj_pos_cull as the position routine so that it is deleted off the screen, a pose table of bank 30,
obj_param = the speed class the room's kind byte gave in variable 1, 2 hit points in variable 0, obj_face_kirby).
After that a script is a behaviour (walk, jump, fall, fire) and its tick routine is what can end it: every tick
routine begins with a water test and the hit test (3F:E31D with the type's 24-byte record of bank 39, unit hit),
then asks obj_walk0 or obj_collide0 where the object stands and starts another script through obj_set_script when
something changed (no floor, landed, a timer ran out, a random number). obj_param indexes the tables for speeds and
waits; variable 1 is obj_dir.

Type $0E (e0e_*; kinds $00-$03, $38-$3F): the round walker of 1-1 (Waddle Dee by its place and look). Variable 6 =
the variant the kind gave in variable 0: 0 walks until a wall turns it and falls off edges; 1 turns after 96 pixels
(variable 5 counts the frames); 2 jumps at random (variable 2 is the timer: $50 frames, then every $1E frames one
chance in four), and becomes 3 once it has walked off an edge. In the air: gravity, and the X speed fades except
in the jump.
Type $0F (e0f_*; kinds $04-$07): walks, and whenever variable 2 runs out picks at random: hop, walk on, or (2 in 4)
stand, shake and blow 8 or 16 flames (object type $50, e0f_flame) that fan out from straight up to below level in
front of it. Variable 2 is the timer, then the random number, then the count of flames blown.
Type $10 (e10_*; kinds $08-$0E): the cannon. Variable 5 = the kind's variable 0: 0 aims (every 20-80 frames one
step of 45 degrees toward Kirby over five barrel directions, a shot when it points at him, never two shots without
a wait between), 1-3 keep the direction up, up-right, up-left and fire three fast shots every 145 frames. Variable
3 counts the four recoil steps and is 1 after a shot; variable 6 remembers the water test. It falls when the block
under it goes. The shot is object type $51 (e10_shot): variable 2 is its life, it bursts on a block.
Type $11 (e11_*; kinds $0F, $10): hops (on the spot, high and forward, low and forward: variable 6; variable 3 is
the gravity of the hop and 0 once it has landed; variables 7 and 9 carry obj_test_land's flag) and, one time in
four at its creation and one decision in four while Kirby is within $40 pixels, stands and throws 45 sparks
(object type $52, e11_spark_bit) while its box is 12 x 12.

Open:
- Never ran in any movie, described from the code only or left out: variant 1 of type $0E reaching the end of its
  count (shown by an experiment only); the X velocity cleared under a ceiling in e0e_tick_air (24:A112; the
  ceiling path itself ran once); e0f_tick_fall's turn at a wall (24:A29B; its return after a hit, 24:A292, ran once in
  cov5-h-full@13762: unit en_cov5); the
  cannon's water code (24:A558-24:A57C, a tick routine at 24:A582 with a Y velocity of $0040, and 22:856E) and
  variable 6 = 1; in e11_tick_air the path for a negative probe distance (24:A7E7-24:A7F8, with 22:9EDA).
- Not read by any movie: e0f_puffs entry 1, the rows of the cannon's tables for a barrel pointing down (octants
  3-5), parts of e10_turn_tab, e10_muzzle beyond the five directions.
- What $0C holds when the tick routines compare it after obj_collide0 (7 in e0e_tick_air, 9 in e0f_tick_jump).
- 3F:E012 (direction between two points), 3F:E0F3 / 3F:E247 / 3F:E23C (velocity from obj_dir and a speed) and
  22:86C5 (distance to an object) are used by address; the claims check lengths and sides, not the exact numbers.
- The scripts the records start (22:8003 inhaled, 22:8100 hit points gone) and the water script 22:833B are bank
  22's; how these enemies die is there. The opcode set_z and the sound numbers ($0D jump, $0E landing or burst,
  $1C shot, $1D flame, $39 spark, by where the scripts play them) are not explained here.
- The pose tables 30:8000 (type $0E), 30:802C ($0F), 30:806E ($10), 30:80AB (shot), 30:80D5 ($11), 30:812D
  (spark), 30:82EC (flame, muzzle flash), 30:8B7A (burst) keep their address names in unit sprites.
- The creatures' names (Waddle Dee, Hot Head, Shotzo, Sparky) are the usual ones for what the pictures and the
  behaviour show; nothing in the ROM states them. Which copy abilities the inhale numbers $0F and 1 are is in
  Kirby's code.
- e0e_tick_walk and the other tick models take the answers of the hit test, obj_walk0 and obj_collide0 from the
  branches the tick routine took, not from the room.
"""

# ================================================================= shared model

[[model]]
name = "en24a_model"
code = '''
def e24_script(wr, lo, hi):
    """obj_set_script gave a thread the address hi:lo in bank 24."""
    return any(wr.get(0x6380 + t) == lo and wr.get(0x63A0 + t) == hi and wr.get(0x63C0 + t) == 0x24 for t in range(32))

def e24_vars(wr, s, *nums):
    """Which of the object variables nums of slot s the call wrote."""
    return {v for v in nums if (0x61CA + 18 * v + s) in wr}

def e24_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def e24_s16(v):
    return v - 0x10000 if v & 0x8000 else v
'''

# ================================================================= type $0E

