name = "e10_burst"
desc = """
The cycle of the cannon that keeps its direction (variable 5 not 0): the pose of the direction, tick routine
e10_tick, 100 frames; then with the tick routine e10_hit three times: a new object of type $51 with variable 0 = 1
(the fast shot of e10_shot), four steps of recoil two frames apart, velocity 0, 7 frames. Three shots, 15 frames
apart, every 145 frames.
"""

