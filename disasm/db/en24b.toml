def e12_tick_ok(rd, wr, ran, calls, mem):
    s = rd[0x6E]
    d, v2, v3, v6, v7, v9 = 0x61DC + s, 0x61EE + s, 0x6200 + s, 0x6236 + s, 0x6248 + s, 0x626C + s
    if wr[0x27] != 0x24 or wr[0x28] != 0x8C:
        return False
    if ran("24:A96D"):
        return "obj_collide0" not in calls and "obj_walk0" not in calls
    if (rd[v6] != 0) != ("obj_walk0" in calls) or (rd[v6] == 0) != ("obj_collide0" in calls):
        return False
    if ran("24:AA15"):
        n2 = (rd[v2] + 1) & 0xFF
        if wr[v2] != n2 or not e2b_script(wr, 0xE5, 0xA8) or wr.get(v6) != 0:
            return False
        t = rd[v3]
        if t == 0:
            if n2 & 1:
                turn = False
                if "random" in calls:
                    return False
            else:
                if "random" not in calls:
                    return False
                turn = (3 * wr[0x3E]) >> 8 == 0
                t = 2
        else:
            turn = True
        if turn:
            return wr[v3] == t - 1 and wr[d] == (rd[d] + 0x80) & 0xFF
        return v3 not in wr and d not in wr
    if ran("3E:CCA7") or v2 in wr or v3 in wr:
        return False
    if ran("24:A98A"):
        return wr[v6] != 0
    if (ran("24:A9A2") > 0) != ("obj_turn_pose" in calls) or (ran("24:A9AA") > 0) != (ran("22:9458") > 0):
        return False
    if ran("24:A9B4"):
        if "probe_down" not in calls or wr[v7] != (0 if ran("24:A9DF") else 1):
            return False
    grav = rd[0x62C6 + s] >= 2
    return wr[v9] == mem(v7) and (ran("22:851C") > 0) == grav and (ran("22:8CE4") > 0) == grav
'''
