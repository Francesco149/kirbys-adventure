unit = "en24b"
title = "Object types $12-$16, $53, $54: the hopper, its apple and tomato, the laser ball"
summary = """
Bank 24 from 24:A8C2 to 24:AF43: five enemies and two things that enemies create, in the pattern of unit en24a (a
first script that sets the object up, scripts that are behaviours, tick routines that begin with the hit test
3F:E31D and a record of bank 39 and start another script through obj_set_script when something changed).

Type $12 (e12_*; kinds $11-$13, speed class 0-2 in variable 1): a small creature with a cap that moves in hops (by
its look, and by what types $13 and $14 are, the game's Poppy Bros. Jr.). A hop: 2 frames on the ground, then the X
speed of its class, 6 frames rising at 0.8 pixels per frame, then gravity. At every landing variable 2 counts the
hop; on every second hop, one time in three, it turns round for one hop and back for the next (variable 3 counts
that down). A landing on a slope that rises ahead of it sets variable 6 to 1, and it walks up the slope instead
(e12_slope) until e12_slope_test answers 0. Variables 7 and 9 carry obj_test_land's flag as in type $11. Created
with variable 0 not 0 it is the rider thrown off a dead type $13 / $14 (e12_thrown): up at 2 pixels per frame, 30
frames in which nothing can hit it (variable 8), then hops like the others.
Type $13 (e13_*; kinds $14-$16): the same creature riding an apple: it walks at the speed of its class with four
poses and falls off edges. Its record has scripts of its own as reactions. Inhaled (e13_inhaled): a new object of
type $15 (the apple) appears, and the object itself takes the pose table of type $12 and is inhaled as the rider.
Hit points gone (e13_killed): a new object of type $12 with variable 0 = 1 (the rider, e12_thrown) appears 14
pixels above, and the object itself takes the picture of the apple and dies as bank 22's 22:8100 has it.
Type $14 (e14_start; kinds $17-$19): type $13 with another pose table (it rides a ball with an M on it, the look of
the game's Maxim Tomato) and variable 3 = 1, which picks the ball's pose table when it dies.
Type $15 (e15_*): the apple without its rider: thrown away from Kirby (half a pixel per frame, 2 pixels per frame
upward), turning through four poses, it bounces once and then lies still, where it can be hit and inhaled.
Type $16 (e16_*; kinds $1A-$1C): a ball with a face that flies (the game's Laser Ball: its inhale number is 5, and
it shoots what Kirby's laser looks like). e16_tick_chase steers it to the point 64 pixels beside Kirby at his height,
on its own side: every 16 frames a new direction of eight, every 8 frames one step of acceleration by the tables of
e16_accel (22:886F). Within 4 pixels of the point it holds there (e16_tick_hold keeps it 64 pixels from Kirby,
facing him) for 4 ticks and then, with one chance in two per tick, fires (e16_fire): it flashes 6, 5 or 4 times by
its class, then creates up to three lasers (type $53) 30 frames apart, each further one with one chance in two, and
flies away from Kirby and upward, off the screen (e16_tick_leave). Variable 2 is the frame counter of the chase and
of the hold, variable 3 the count of ticks in the hold and then of lasers left.
Type $53 (e53_*): the laser of type $16, created by e16_fire (and with variable 0 = 1 by e28_laser of bank 28 at 28:A977, once: cov6-j-x@345519): a bar 8 pixels in front of its parent that stands 4 frames and then flies at 8 pixels
per frame; it is freed when the hit test changes it or it meets a block.
Type $54 (e54_*): a puff 2 frames long that two types leave behind themselves: object type $56 (first script
24:B8E7, in the range of unit en24c; its script at 24:B927 creates one every 5 frames, 371 of the 556) and object
type $17 (first script 2B:A389; its tick routine 2B:A57D creates one every second frame, 185). Direction = the
creator's turned by half a circle, 6 pixels along it, 4 pixels per frame, with a Y offset of -2, 2, -5, 5 by the
creator's count of puffs (its variable 2).

Open:
- Never ran in any movie: in e12_tick the path for a negative probe
  distance (24:A9EB-24:A9FC) and the exit of the first six frames of a hop into the slope walk (24:A91C); the turn
  of types $13 / $14 at a wall from e13_tick_fall (24:ABA3); in type $15 a wall (24:AC2D, 24:AC54) and the spin of
  one that faces left (24:AC8C); the hit test changing type $16
  while it holds (24:ADF3). The laser created with variable 0 not 0 (24:AEC9) ran once, in cov6-j-x@345519, from type
  $28's e28_laser (unit en28).
- Ran once each in the fifth batch and claimed in unit en_cov5: the rider's turn at a wall in e13_tick_roll (24:AB67,
  cov5-i-apple@5097); the reaction to kind 3 of kirby_rect (24:AB19, e13_grabbed), e13_shed for the ball rider of type
  $14 (24:AAFA), the ball's pose table (24:ABE0) and the item it leaves (24:AC16) (cov5-h-bd@63692-63728).
- Type $15 started twice (two movies, the same frames), type $53 six times, type $14 three times: their claims
  have what these calls carry. Of e16_bob_frames and the two tables with it only the entries 5 and 6 were read, of
  e12_slope_walks the entries 1, 3 and 6, and row 3 of e16_accel never.
- Which kinds of floor the numbers 3-6 in $0C are (e12_slope_test) is unit probes'; the one case seen with the
  answer 1 is kind 4 for a creature that faces left, a slope that rises to the left (w12-opus@27095).
- What the reactions 19:B2A0 (kind 2 of kirby_rect) and 16:A9CE (kind 3) do, the scripts 22:8003 (inhaled) and
  22:8100 (hit points gone), 22:8777 (the distance to a point), 22:886F (velocity steps by octant, modelled here
  only as far as e16_tick_chase uses it), 22:8C05 (X position forward by an operand), 22:9458, 3E:DED0 (a script's
  spawn with slot range, type, offsets, variable 0 and a direction offset), 3E:DE4B (a script's sound) and 3F:E23C
  (a speed along obj_dir) are used by address.
- The pose tables 30:8138 (type $12), 30:8164 ($13), 30:81FC ($14), 30:8294 (apple), 30:82C0 (the ball with the
  M), 30:8310 ($16), 30:83B5 (laser), 30:844E (puff) keep their address names in unit sprites. The sound numbers
  ($0D hop, $0E landing, $42 laser) are named by where the scripts play them.
- The creatures' names are the usual ones for what the pictures and the behaviour show; nothing in the ROM states
  them. What the types $56 and $17 are belongs to their units.
- The tick models take the answers of the hit test and of the bank 22 tests from the branches the tick routine
  took, not from the room.
"""

# ================================================================= shared model

[[model]]
name = "en24b_model"
code = '''
E12_SLOPE = [1, 0, 0, 1, 1, 0, 0, 1]
E16_ACC = [0x33, 0x4D, 0x67]
E16_LIM = [0x00FF, 0x0181, 0x0203]
E16_FR = [0x04, 0x14, 0x1C, 0x24, 0x2C, 0x34, 0x38]
E16_VY = [0xFF00, 0xFF80, 0x0080, 0x0100, 0x0080, 0xFF80, 0xFF00]
E54_DY = [-2, 2, -5, 5]

def e2b_script(wr, lo, hi):
    """obj_set_script gave a thread the address hi:lo in bank 24."""
    return any(wr.get(0x6380 + t) == lo and wr.get(0x63A0 + t) == hi and wr.get(0x63C0 + t) == 0x24 for t in range(32))

def e2b_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def e2b_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def e2b_len(wr, s):
    vx = e2b_s16(e2b_w(wr, 0x60E0 + s, 0x60F2 + s))
    vy = e2b_s16(e2b_w(wr, 0x6104 + s, 0x6116 + s))
    return (vx * vx + vy * vy) ** 0.5

def e2b_spawned(wr, typ):
    """The slots 9-17 in which the call created an object of this type."""
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]
'''

