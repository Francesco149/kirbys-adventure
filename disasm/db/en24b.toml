[[sym]]
at = "24:A968"
name = "e12_tick"
desc = """
Tick routine of type $12 from the start of a hop. e12_hit; carry set: nothing more. With variable 6 = 0 (in the
air): obj_var7 = obj_var9, obj_collide0. Landed: e12_slope_test; when that left variable 6 not 0 nothing more (the
script e12_hop sees it and goes to e12_slope), otherwise the next hop (24:AA15). Not landed: a wall (bit 0 of A)
turns it (obj_turn_pose), a ceiling (bit 1) stops its rise (22:9458); while it moves up, probe_down 7 pixels below
the position sets obj_var7: 0 when a surface is 0-8 pixels below that point, 1 otherwise; obj_var9 = obj_var7; and
when the pose is 2 or more (after the first six frames of the hop) obj_gravity and obj_vx_slow.
With variable 6 not 0 (it walks up a slope): obj_walk0; no floor: the next hop; otherwise e12_slope_test again, and
when variable 6 is now 0 the next hop.
The next hop (24:AA15): variable 2 + 1. With variable 3 = 0: on an even count a random number below 3; when it is
0, variable 3 = 2. With variable 3 not 0 (also just set): variable 3 - 1 and obj_dir turned by half a circle. So
it turns round for one hop and turns back at the next landing. Then the script e12_hop.
"""
comments = { "A970" = "variable 6: walking up a slope", "A99C" = "carry set: landed", "A9B2" = "moving up: is there a floor just below?", "AA0A" = "poses 0 and 1: the first six frames of a hop, no gravity", "AA15" = "the next hop: count it in variable 2", "AA1A" = "variable 3: a turn to take back", "AA33" = "turn round" }

