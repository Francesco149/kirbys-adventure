# ================================================================= type $12

[[script]]
at = "24:A8C2"
name = "e12_start"
desc = """
First script of object type $12: a small creature with a cap that hops along the ground (main@1860, on the slope
at the right; w12-opus@27095, two of them at a cactus). By its look and its apple (type $13) the game's Poppy Bros.
Jr. Kinds $11-$13 create it with variable 0 = 0 and the speed class 0-2 in variable 1. Bank 22, variable 6 = 0;
created with variable 0 not 0 it goes to e12_thrown. Otherwise obj_param = the speed class (obj_param_set),
obj_face_kirby, the position routine obj_pos_cull, the pose table 30:8138, variables 2, 3 and 6 = 0, 2 hit points
(variable 0), and on into e12_hop.
"""

[[script]]
at = "24:A8E5"
name = "e12_hop"
desc = """
One hop of type $12; the tick routines come back here at every landing. Velocity 0, tick routine e12_tick_still,
sound $0E, the pose of its direction (0, or 1 facing left) for 2 frames. Then tick routine e12_tick, sound $0D, the
X velocity e12 takes from the entries 4-6 of e0e_speeds (unit en24a; the table address 24:A06A with obj_param:
$0080, $00C0, $0100) toward the side it faces, the Y velocity -$00CD, variables 7 and 9 = 0. Six frames in which
the thread looks at variable 6 every frame (not 0: on to e12_slope at 24:A91C, which never happened), then the
pose two further (from which e12_tick applies gravity) and a loop that looks at variable 6 every frame: when
e12_tick has set it at a landing on a slope, the thread goes to e12_slope at 24:A91D.
"""

[[script]]
at = "24:A91C"
name = "e12_slope"
desc = """
Type $12 walks up a slope (variable 6 not 0). Entered at 24:A91D: Y velocity 0 and 6 frames, the X velocity of its
class again (asm_vx_tab with 24:A06A), then for ever the pose two back for 6 frames and two further for 10. e12_tick
ends it with e12_hop. The instruction at 24:A91C (two poses further first) never ran.
"""

[[script]]
at = "24:A92A"
name = "e12_thrown"
desc = """
Type $12 created with variable 0 not 0: the rider thrown off a type $13 or $14 whose hit points are gone
(e13_killed). obj_param from the parent (obj_param_copy; the parent's slot is in variable 2), obj_face_kirby, the
position routine obj_pos_cull, the pose table 30:8138, variables 2, 3 and 6 = 0, 2 hit points, variable 8 = $1E
(the frames in which it cannot be hit), tick routine e12_tick_thrown, Y velocity -$0200, the pose of its direction
for 8 frames, then the pose two further, and the thread parks until e12_tick_thrown starts e12_hop at the landing.
"""

