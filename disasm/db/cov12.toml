unit = "cov12"
title = "What the twelfth batch of coverage movies ran first: the hub extras, the stage doors no movie took, and the rooms nothing leads into"
summary = """
What the 13 movies of the twelfth batch ran and read for the first time (tas/tasks/cov12-*.md), and the static
findings of its part C (tas/tasks/triage/b12-noentry-rooms.md) on the rooms no door leads into.

Rooms. 56 of the 327 rooms had never been loaded; the batch loads 28 of them (claim cov12.rooms). cov12-a-hubs (from
cov5-f-del's end, the 100% file): the Warp Star Stations 32-36, the museums 27 and 29 and the arenas 38-41. The 12
cov12-b-* movies take every kind-0 stage door no movie had taken: rooms 68, 78, 79, 84, 100-102, 183, 190, 193, 195,
215, 251, 261, 262, 289 and 294. With them came their room streams, object lists and door lists (room_doors_lo / hi
entries 79, 101, 102 and 262 were read for the first time, and 235 bytes of room_doors), the palettes and CHR banks
of the hub rooms, bytes 2-5 of the records 33 and 37-40 of room_extras (cov12-b-r99), current_lo / current_hi entries 3, 6, 9, 10 and 14 (room
294, under water), the kinds $6E, $E5 and $E6 of objs_kind_type.

The Warp Star Stations with every world done (cov8 had one star alone in a station). Six stars stand in each
station; e06_world_star_phase answers 0 for every second one and those bob in the other phase (23:ADC5, the loop
cov8 never ran). A ride sends Kirby to the target world's own station (e06_demo_room: room_return = e06_hub_rooms
[obj_param] = $1E + obj_param, the entries 2, 3, 5 and 6 read for the first time; $0565 = 8, or $F8 with warp_arrival
$81 for a lower world). The ride from station 36 to station 32 starts below cam_y + $60: e06_demo_climb stores
variable 0 as magnitude with bit 7 (23:AF95) and e06_demo_tick moves the camera up by 1 as it counts it down
(23:AEAF). The arrivals: entry 1 of e06_arrive's jump table ($80) for the first time; after the $81 ride Kirby lands
facing left and e06_land_turn takes its left side (e06_land_turn_left, 23:BDDA), ending with his pose $25.

The museums: room 27 shows exhibits 5 and 6 of type $0A (e0a_exhibit_5, e0a_exhibit_6: the pose tables 30:8F2F and
30:8F62, inhale numbers $11 and $0A), the first time e0a_exhibit_6's loop (the bytes that were e0a_exhibit_6_tail)
ran. The arenas: the class-1 Fire Lion (type $4D) of room 41 is beaten by Wheel Kirby, who cannot inhale it, and its
beaten script runs on (2A:A37C-2A:A3A2): a puff of type 8 (asm_spawn), asm_fx $0C, asm_dust, X velocity -$0100,
variable 5 = 6, 30 frames, still, 170 frames. Wheel Kirby meets the arena's side limit (kirby_st_wheel_roll's exit
18:A8C6 to $49) and finishes a whole turn (kirby_s_wheel_turn_end: the facing reversed, then kirby_s_wheel_roll). The
class-1 Grand Wheelie of room 38 rolls faster than $0180 (e49_speed_class answers 2, 2A:AEC4) and reads entry 1 of
e49_wheel_vy; the Bugzzy of room 39 reads row 4 of e4a_pick_lims.

The stage doors (part B): in room 194 (cov12-b-r192) a class-1 type $1C makes hop 4 (e1c_hop_far, 2A:BAD9: entry 4
of e1c_hop_start's jump table, the last weight of e1c_hop_weights' second row); Wheel Kirby's speed below $0200 at
wheel_speed_cap (18:A9F7, cov12-b-r179); the bomb jugglers of room 100 read row 2 of e22_hop_counts.

The entries e06_arrive_pose_25, e0a_exhibit_6_tail and kirby_s_wheel_turn_end were never = true in units dead_en1 /
dead_kirby; the first two are now parts of the scripts e06_land_turn_left and e0a_exhibit_6, the third a script
label of its own here. Of e1c_hop_tail (dead_en1) the first 11 bytes are the end of e1c_hop_far; the 7 bytes after
them, entry 2 of e1c_scripts, stay never read as e1c_fall_wet.

Part C, by the ROM (claims cov12.noentry.*): no door record of a live room leads into the rooms 7, 20-23, 127-132,
168, 310, 311 and 313-326, and their own doors stay among themselves except the ways out (7 to the hubs 0-6, 20-23,
311 and 132 to hubs or to room 133, 316 / 324 / 326 back to 168, 168 to 19). Room 310's only door is the only door
record of kind $70 in the ROM: room_pick_kind's never-run path 13:A171 loads room_return_saved (all four bytes) into
room and room_return. cov12.noentry.door70 runs it by force: room 310 loaded by poke, Up on its door, and Kirby is in
the room that room_return_saved names (room 7, the world select of the developer hub 168). The demo 0 room: demo_setup
gives $055A = $38 and $055B = 1, room 312 (cov12.demo0_room), not room 56 as unit attract said.

Open:
- The rest of e4d_beaten after the 170 frames (2A:A3A3-2A:A3B0 and e4d_beaten_tail): the room was left first.
- block_class_at read screen_lo's 3F:ED9D, beyond the table, four times in cov12-b-r99 (an index past the room's
  screens); not examined.
- room_doors_lo / hi of room 312 equal those of room 313: its door list is empty although the triage reads a door to
  314 into it.
- The museum of room 29 (the Wheelie exhibit, type $0A in slot 11) shows an exhibit already read before.
"""

[[model]]
name = "cov12_model"
code = '''
def c12_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def c12_climb_v0(ylo, camy):
    d = (ylo - camy - 0x60) & 0xFF
    return d if d < 0x80 else ((-d) & 0xFF) | 0x80

def c12_tick_ok(rd, wr, ran, mem):
    s = rd[0x6E]
    y = rd[0xE1] << 16 | rd[0xE0] << 8 | rd[0xDF]
    vy = c12_s16(rd[0x6104 + s] | rd[0x6116 + s] << 8)
    n = (y + vy) & 0xFFFFFF
    if n & 0x800000:
        n = 0
    elif rd[0x61CA + s] and rd[0x6116 + s]:
        v0 = rd[0x61CA + s]
        n = (n + (0x100 if v0 < 0x80 else -0x100)) & 0xFFFFFF
        k = (v0 & 0x7F) - 1
        if wr[0x61CA + s] != (0 if k == 0 else k | (v0 & 0x80)):
            return False
    return (mem(0xE1) << 16 | mem(0xE0) << 8 | mem(0xDF)) == n

def c12_speed_class(rd):
    s = rd[0x6E]
    v = abs(c12_s16(rd[0x60E0 + s] | rd[0x60F2 + s] << 8))
    return 0 if v < 0x180 else 1 if v == 0x180 else 2

C12_STATIONS = [0x1E, 0x1F, 0x20, 0x21, 0x22, 0x23, 0x24]

def c12_doors(rom, O):
    """{room: [(kind, destination room)]} from room_doors_lo / hi (the next room's address ends a list)"""
    lo, hi = O('room_doors_lo'), O('room_doors_hi')
    base = O('room_doors') - (A('room_doors') & 0x1FFF)
    out = {}
    for r in range(327):
        a, e = rom[lo + r] | rom[hi + r] << 8, rom[lo + r + 1] | rom[hi + r + 1] << 8
        L = []
        while a < e:
            o = base + (a & 0x1FFF)
            L.append((rom[o + 3] & 0x70 | rom[o] >> 4, rom[o + 2] | (rom[o + 3] >> 7) << 8))
            a += 5
        out[r] = L
    return out

C12_CUT = {7, 20, 21, 22, 23, 127, 128, 129, 130, 131, 132, 168, 310, 311} | set(range(313, 327))
'''

