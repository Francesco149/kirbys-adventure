unit = "unpack"
title = "Packed data: the unpack routine, every packed stream, the tables that address them"
summary = """A quarter of the PRG is packed: room layouts, tile sets, screens. One routine, unpack (3E:C43A), expands a
stream of commands from the ROM into RAM: literal runs, one- and two-byte fills, a counting run, and three kinds of
copy from what the same call has already written (plain, with the bits of each byte reversed, backwards). A stream
ends with $FF. Twelve places call it. Two of them go through tables of the room loader in bank 12: room_data_* (one
stream per room number, expanded at $67EE) and tileset_* (indexed through 12:8618 by room, expanded at $67EE and
then split by 38:ACCA into four 256-byte tables at $7A00). Two more use short tables of their own bank
(packed_13_*, packed_34_*); the rest pass a fixed address or one from a script. Every stream is a data region of
its own (format `packed`, generated by `kd packed --toml`), named by its address; the rounds for rooms, tile sets
and screens rename them.

Open: the path at 3E:C55F (a copy whose source address reaches $8000 leaves the routine with two pulls and an rts)
never ran. What the streams expand to is documented only as bytes: the room header and the tile map, the tile set
tables and the screens belong to the rounds of the code that uses them. Bit 7 of a room_data_bank byte is a room flag
that 13:A115 tests when the room number changes (what $0562-$0565 are for belongs to the round of the room
loader). The lengths of the
tables are taken from their layout (four tables of 327 bytes one after the other, three of 49, two of 44) and the
entries the corpus did not read are checked only by pointing to a stream that parses; 15 tile set entries are 0
(empty). The last 8 bytes of packed_34_hi + 8 are not part of it: the table has 8 entries because 8 were read and
packed_34_lo is 8 bytes before it."""

[[sym]]
at = "3E:C43A"
name = "unpack"
desc = """Expands the packed stream at ($16) to ($18) until the command byte $FF. A command byte is `ccc nnnnn` with
count n + 1, or `111 ccc nn` followed by one byte with count ((nn << 8) | byte) + 1. c = 0: count literal bytes
follow. 1: one byte follows, written count times. 2: two bytes follow, written as a pair count times. 3: one byte
follows; it is written, then the value plus 1, and so on, count bytes. 4 to 7 are followed by a 16-bit offset, high
byte first, into what this call has written so far (the address is the value of $18/$19 at entry plus the offset),
and write count bytes read from there: 4 and 7 reading forwards, 5 forwards with the bits of each byte reversed,
6 backwards. A copy may read bytes that the same command wrote. The bank of the stream must be mapped by the
caller."""
in = "$16/$17 = address of the stream, $18/$19 = where to write"
out = "$18/$19 = the address after the last byte written; $17 has advanced with the stream when it crossed a page; $00-$05, $1A, $1B are used"
comments = { "C446" = "next command: $FF ends the stream", "C453" = "long form: the command is in bits 4-2, the count in bits 1-0 and the next byte", "C46A" = "short form: command in bits 7-5, count in bits 4-0", "C474" = "count + 1; $04/$05 keep the start of the output", "C488" = "0: literal bytes", "C499" = "1: one byte, repeated", "C4AA" = "2: two bytes, repeated", "C4C9" = "3: a byte, then +1 each time", "C4DD" = "4-7: copy from the output; offset high byte, then low byte", "C504" = "4, 7: forwards", "C517" = "5: forwards, bits reversed", "C534" = "6: backwards" }

[[sym]]
at = "3E:C54D"
name = "unpack_fetch"
desc = "Returns the stream byte at ($16),Y and advances Y, carrying into $17."
in = "$16/$17, Y = position in the stream"
out = "A = the byte; Y and $17 advanced"

[[sym]]
at = "3E:C555"
name = "unpack_ref"
desc = "Returns the byte at ($1A),Y, the source of a copy, and advances Y, carrying into $1B. If that carry takes $1B to $80 or above it drops its return address and returns with what is then on the stack (never ran)."
in = "$1A/$1B, Y = position of the copy"
out = "A = the byte; Y and $1B advanced"

[[sym]]
at = "3E:C562"
name = "unpack_put"
desc = "Stores A at ($18) and advances $18/$19. X must be 0."
in = "A = byte, $18/$19 = where to write, X = 0"
out = "$18/$19 advanced; A unchanged"

