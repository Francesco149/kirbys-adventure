[[claim]]
id = "unpack.model"
about = ["unpack", "unpack_fetch", "unpack_ref", "unpack_put"]
text = "Every call of unpack writes, from the address in $18/$19, exactly the bytes that the model expands the stream at $16/$17 to, and nothing else outside $00-$05, $17-$1B; it reads from the ROM exactly the bytes of the stream, up to and including its $FF; $18/$19 end one past the last byte written; and it calls nothing but unpack_fetch, unpack_ref and unpack_put."
kind = "call"
fn = "unpack"
on = ["main@225+40", "main@10380+60", "w3-sonnet@20000+3000", "attract@1100+600", "main@66+60", "main@133500+400"]
min_calls = 3
expect = "kept(wr) == expand(rd, romrd) and mem(0x18) | mem(0x19) << 8 == (rd[0x18] | rd[0x19] << 8) + len(expand(rd, romrd)) & 0xFFFF and set(calls) <= {'unpack_fetch', 'unpack_ref', 'unpack_put'}"
model = '''
SCRATCH = (0, 1, 2, 3, 4, 5, 0x17, 0x18, 0x19, 0x1A, 0x1B)

def kept(wr):
    return {k: v for k, v in wr.items() if k not in SCRATCH}

def expand(rd, romrd):
    # the stream is the ROM bytes the call read, in address order -> {address: byte written}, or None
    base = min(romrd)
    if base & 0x1FFF != (rd[0x16] | rd[0x17] << 8) & 0x1FFF:
        return None
    pos = [base]
    def get():
        v = romrd.get(pos[0])
        pos[0] += 1
        return v
    out = []
    while True:
        b = get()
        if b is None:
            return None
        if b == 0xFF:
            break
        if b & 0xE0 == 0xE0:
            c, n = b >> 2 & 7, ((b & 3) << 8 | get()) + 1
        else:
            c, n = b >> 5, (b & 0x1F) + 1
        if c == 0:
            out += [get() for _ in range(n)]
        elif c == 1:
            out += [get()] * n
        elif c == 2:
            out += [get(), get()] * n
        elif c == 3:
            v = get()
            out += [v + i & 0xFF for i in range(n)]
        else:
            ref = get() << 8 | get()
            for i in range(n):
                v = out[ref - i] if c == 6 else out[ref + i]
                out.append(int(format(v, '08b')[::-1], 2) if c == 5 else v)
    if set(romrd) != set(range(base, pos[0])) or None in out:
        return None
    dst = rd[0x18] | rd[0x19] << 8
    return {dst + i & 0xFFFF: v for i, v in enumerate(out)}
'''

