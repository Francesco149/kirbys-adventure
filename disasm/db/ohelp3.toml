name = "obj_dir_toward_kirby"
desc = """obj_aim_to with Y = 1; d = its direction AND $F8. obj_dir of the current object turns by 8 toward d: with
p = obj_dir + 8 and m = obj_dir - 8, the byte differences d - p and m - d are compared; the smaller first one gives p,
the smaller second m, a tie gives m for obj_dir below $80 and p otherwise."""
out = "Y = the current object"

[[sym]]
at = "22:92B1"
name = "obj_going_away"
desc = "obj_dx_kirby; A = 1 when the X velocity of the current object points away from Kirby (the object left of him and the velocity negative, or not left of him and the velocity 0 or more), else 0."
