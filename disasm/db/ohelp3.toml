unit = "ohelp3"
title = "The objects' helpers of bank 22, third part: distances, saved state, boxes, script operands, shape tables"
summary = """The rest of the code of bank 22 that ran, after units ohelp and ohelp2: helpers that enemy and boss code (banks 23-2F)
calls for the current object, most of them used by one or two object types each.

Distances along a direction. obj_dist_to (object X to object Y) and obj_dist_pt (object X to the point $0C-$0F) take
the direction of dir_to_point between the two points, fold it into 0-$80 and look up the X factor of polar_tab for it:
with a factor f (low byte not 0) the answer is div_recip(|dx| * 256, f), about |dx| / cos; straight across it is |dx|,
straight up or down |dy|. The first point's Y is the object's Y low byte with its world Y high byte (a slip of the
code that only matters where the two differ).

The saved state ($0798-$07A4, obj_saved). obj_save keeps the pose, obj_dir, both velocities and the position (with the
fractions) of object X; obj_save_wait (in front of it) also keeps the wait of the object's first thread and sets it to
$40; obj_save_shake (in front of that) also sets the shaking draw routine 3E:DDE7. obj_shake_saved is one frame of a
boss's shake (Y = the frames left: whole-pixel velocities from obj_shake_saved_vx / _vy, mirrored by the saved
obj_dir); obj_restore puts everything back, with the draw routine 3E:DA89. Whispy Woods (unit en2c), the bosses of
units en28, en2b and en2f use them.

Script operands (asm routines, read after the asm opcode): asm_speed_tab (a speed from a word table by obj_param along
obj_dir, through speed_dir_set), asm_vy_tab, asm_vel_dir (X velocity mirrored by obj_dir and Y velocity) and
asm_vel_dir_wait (the same after a wait), asm_var_of / asm_reg_to_var_of (a variable of the object whose slot is in
one of the current object's variables), asm_tick_bank_clr (bit 7 of obj_tick_bank cleared for a range of slots: they
run again), asm_score (score_far with the operand), asm_pal_by_cam_y.

Small helpers: obj_pose_var2, obj_face_away (obj_face_kirby reversed), obj_turn_dir_cur, obj_dir_quadrant,
obj_dir_toward_kirby (obj_dir 8 nearer the direction to Kirby), obj_going_away, obj_vx_brake, obj_vy_clear, obj_x_add,
obj_keep_wx / obj_back_wx (the world X kept in variables 8 and 9), obj_pos_from_parent, obj_var0_half_ge, div16_8 (a
16 / 8 bit division), obj_pick_skip (a weighted random index that leaves one out), obj_keep_in_box (inside a box
around the camera), obj_hurt_blink, objs_free_9_17, kirby_retype_rod (Kirby's object becomes type $6E, every other
object of the slots 0-8 freed), kfx_var6_inc, e64_spawn_far, save_complete_far, cam_lock_here (the camera stays where
it is, Kirby inside it), kirby_floor_test3 / kirby_floor_test1 and obj_floor_test9 (is there a floor under Kirby / the
object), pal_by_cam_y (the background palette by the camera's height, the last fight). Three tables by a block's shape
number (shape_no_floor, shape_blocks, shape_open) are read by enemy code.

In pictures: main@59700, the eye of the boss of unit en2f kept in its box at the top of the screen (obj_keep_in_box).

Open: paths that never ran: obj_dist_to / obj_dist_pt with |dx| of 256 or more (22:8772, 22:8824: by the code A = 0,
X = $FF) and the inx of their negations (22:873A, 22:87F0, 22:8815, 22:8763); kirby_floor_test1 with Kirby's Y velocity
0 (22:8A68); obj_floor_test9 with a Y velocity or a floor-less shape (22:8AD0, 22:8AE5); obj_vx_brake with a negative
velocity (22:929F); kfx_var6_inc for variable 3 = $14 (22:8E8E); obj_keep_in_box below the box's top and at its left
and right (22:94DB, 22:952E-22:9568); obj_hurt_blink's tail at 22:966F. Code that never ran at all: 22:8B08-22:8B23
(by its bytes objs_free_9_17 sparing the current object's type), 22:8C5F, 22:8E2C-22:8E55, 22:8E9E (asm: bit 7 of one
object's obj_tick_bank cleared), 22:9015-22:9065, 22:9303 (velocity + variables 8 / 9), 22:9385-22:939C, 22:93E8.
What the shape numbers of the three tables mean is the props units' question; the names say what the enemy code does
with them. The 4 calls of asm_pal_by_cam_y had operand 0 only (the second palette pair is never named)."""

# ================================================================== distances along a direction

[[sym]]
at = "22:86C5"
name = "obj_dist_to"
desc = """The distance from object X to object Y along the direction between them. Point 1 = the X position of object X and,
for Y, its Y position's low byte with its world Y's high byte; point 2 = the position of object Y; d = dir_to_point,
folded to 0-$80 (256 - d for d of $80 or more). f = polar_tab word (d / 4 + 16), the X factor of that direction.
Low byte of f not 0: |dx| (X of object X minus X of object Y) must be below 256 and the answer is div_recip(|dx| * 256,
f's low byte), about |dx| / cos. f = $0100 (straight across): |dx|, 16 bits. f = 0 (straight up or down): |dy| of the
two positions, 16 bits. |dx| of 256 or more with a factor: A = 0, X = $FF (never ran)."""
in = "X, Y = the objects"
out = "X:A = the distance (X high)"
comments = { "86F5" = "left half: fold", "8701" = "a factor: divide", "8708" = "straight across: |dx|", "8768" = "|dx| of 256 or more" }

[[sym]]
at = "22:8777"
name = "obj_dist_pt"
desc = """obj_dist_to with a point instead of object Y: point 2 = $0C/$0D (X) and $0E/$0F (Y), which are kept. The same
folding, factor and three cases (|dx| or |dy| against the point). The point is pushed and put back around dir_to_point;
in the divide case div_recip (mul8) then uses $0D-$0F as scratch."""
in = "X = the object; $0C-$0F = the point (X, Y, 16 bits each)"
out = "X:A = the distance (X high); $0C unchanged, $0D-$0F used by div_recip's multiply in the divide case"

# ================================================================== the saved state

[[sym]]
at = "22:8D21"
name = "obj_save_shake"
desc = "For the current object: the draw routine 3E:DDE7 (the shaking one), then on into obj_save_wait."
out = "X = the current object"

[[sym]]
at = "22:8D2D"
name = "obj_save_wait"
desc = "The wait of object X's first thread (obj_first_thread) goes to $079C and becomes $40; then on into obj_save."
in = "X = the object"

[[sym]]
at = "22:8D3B"
name = "obj_save"
desc = "Keeps the state of object X in obj_saved: pose to $07A4, obj_dir to $079D, X velocity to $0798/$0799, Y velocity to $079A/$079B, the X position (fraction, low, high) to $07A0 / $079E / $079F, the Y position to $07A3 / $07A1 / $07A2."
in = "X = the object"

[[sym]]
at = "22:8D84"
name = "obj_restore"
desc = "The current object gets back what obj_save_wait kept: pose, both velocities, the position with its fractions, the wait of its first thread from $079C; obj_dir is not put back. The draw routine becomes 3E:DA89 (the ordinary one)."
out = "X = the current object"

[[sym]]
at = "22:8DDC"
name = "obj_shake_saved"
desc = """One frame of a boss's shake. i = obj_shake_saved_idx[Y - 1] (5 down to 0, over and over); the low bytes of both
velocities of the current object = 0, the high byte of the Y velocity = obj_shake_saved_vy[i], that of the X
velocity = obj_shake_saved_vx[i], negated when the obj_dir kept in $079D has bit 7 set (faced left)."""
in = "Y = the frames left (1-24)"
out = "Y = i; X = the current object"

[[data]]
at = "22:8E08"
len = 6
name = "obj_shake_saved_vx"
format = "bytes"
desc = "X velocities of obj_shake_saved in whole pixels: 2, -2, -2, 2, 2, -2 (they add up to 0)."

[[data]]
at = "22:8E0E"
len = 6
name = "obj_shake_saved_vy"
format = "bytes"
desc = "Y velocities of obj_shake_saved in whole pixels: 1, -1, 0, 1, -1, 0."

[[data]]
at = "22:8E14"
len = 24
name = "obj_shake_saved_idx"
format = "rows:6"
desc = "For obj_shake_saved by the frames left - 1: 5, 4, 3, 2, 1, 0, four times."

[[ram]]
at = "0798"
len = 13
name = "obj_saved"
desc = "$0798-$07A4: one object's state kept by obj_save (X velocity, Y velocity, the first thread's wait at $079C, obj_dir at $079D, X position low / high / fraction at $079E-$07A0, Y position low / high / fraction at $07A1-$07A3, pose at $07A4) and put back by obj_restore; obj_shake_saved reads the kept obj_dir. e3d_charge_start (unit en2f) also writes the positions ($079E/$079F, $07A1/$07A2) and e46_hit (unit en2c) reads $079C."

# ================================================================== script operands

[[sym]]
at = "22:8B61"
name = "asm_speed_tab"
desc = "For a script: $00/$01 = word obj_param of the table whose address is the two bytes after the asm opcode, then a jump to speed_dir_set: both velocities from vel_from_dir with obj_dir and that speed, and the two bytes are stepped over."
out = "X = the current object"

[[sym]]
at = "22:8BC0"
name = "asm_vy_tab"
desc = "For a script: the Y velocity of the current object = word obj_param of the table named by the two bytes after the asm opcode, which are stepped over (asm_vx_tab for Y, without the mirror)."
out = "X = the current object"

[[sym]]
at = "22:9340"
name = "asm_vel_dir"
desc = "For a script: the X velocity of the current object = the first word after the asm opcode, negated when obj_dir has bit 7 set; the Y velocity = the second word; the four bytes are stepped over."
out = "X = the current object"

[[sym]]
at = "22:932F"
name = "asm_vel_dir_wait"
desc = "For a script: the wait of the current thread = the byte after the asm opcode, then asm_vel_dir with the four bytes after it; five bytes are stepped over."
out = "X = the current object"

[[sym]]
at = "22:8F32"
name = "asm_var_of"
desc = "For a script, three bytes after the asm opcode (stepped over): a variable number v, a variable number w and a value. s = variable v of the current object; when s is below 18 and the slot s holds an object (obj_type bit 7 clear), variable w of object s = the value (var_base_lo / var_base_hi give the variables' addresses)."

[[sym]]
at = "22:8F69"
name = "asm_reg_to_var_of"
desc = "asm_var_of with the current thread's thread_reg as the value and two bytes after the asm opcode (v, w; stepped over)."

[[sym]]
at = "22:8EB5"
name = "asm_tick_bank_clr"
desc = "For a script, two bytes after the asm opcode (stepped over): the slots from the first up to the second (not included) that hold an object get bit 7 of obj_tick_bank cleared, so that obj_run_all runs them again."

[[sym]]
at = "22:8FC6"
name = "asm_score"
desc = "For a script: score_far with A = the byte after the asm opcode (script_arg steps over it), X = 0: the score of the entry A."

[[sym]]
at = "22:8FCE"
name = "asm_pal_by_cam_y"
desc = "For a script: Y = the byte after the asm opcode (script_arg), then on into pal_by_cam_y."

[[sym]]
at = "22:8FD2"
name = "pal_by_cam_y"
desc = """The background palette by the camera's height: $16/$17 = word Y of pal_cam_ptr; the entry 0 of that pair when
cam_y - $170 is negative (the camera above Y $170), the entry 1 otherwise. When it differs from $078A: $078A = it,
bg_palette_fixed with it and palette_show_bg (a jump). Called once a frame in the last fight (main from 132,868)."""
in = "Y = 0 (the only pair)"

[[data]]
at = "22:9005"
len = 2
name = "pal_cam_ptr"
format = "ptr16"
desc = "The one address in the table of pal_by_cam_y: $9007 (pal_cam_pair)."

[[data]]
at = "22:9007"
len = 2
name = "pal_cam_pair"
format = "bytes"
desc = "The two palettes of pal_by_cam_y: $A6 with the camera above Y $170, $A5 below."

