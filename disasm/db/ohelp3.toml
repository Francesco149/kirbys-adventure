name = "obj_face_away"
desc = "obj_dx_kirby, then obj_dir of the current object = $C0 (left) when it is left of Kirby, $40 (right) otherwise: obj_face_kirby reversed, it turns its back to him."
out = "X = the current object"

[[sym]]
