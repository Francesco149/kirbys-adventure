out = "X = the current object"

[[sym]]
at = "22:917C"
name = "obj_dir_quadrant"
desc = "obj_dir of the current object = what obj_quadrant_kirby answers: $20, $60, $A0 or $E0, the diagonal toward Kirby's quarter."
out = "X = the current object"

