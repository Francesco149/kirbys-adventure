[[sym]]
at = "22:91A9"
name = "obj_keep_wx"
desc = "Keeps the world X of the current object: variable 8 = its low byte, variable 9 = its high byte."
out = "X = the current object"

[[sym]]
at = "22:91B8"
name = "obj_back_wx"
desc = "The world X and the X position of the current object = variables 8 / 9 (what obj_keep_wx kept), the X fraction and the X velocity = 0."
out = "X = the current object"

[[sym]]
at = "22:91D8"
name = "obj_pos_from_parent"
desc = "obj_pos_copy from the object whose slot is in variable 2 of the current object (its creator) to the current object: position and world position."
out = "X = the creator, Y = the current object"

[[sym]]
at = "22:9498"
name = "obj_keep_in_box"
desc = """Keeps the current object inside a box around the camera. X / Y = the address of four bytes: t0 above cam_y,
t1 below it, t2 left of cam_x, t3 right of cam_x + 256. The world Y is raised to cam_y - t0 when it is less and else
lowered to cam_y + t1 when it is that or more; the world X the same with cam_x - t2 and cam_x + 256 + t3. The position
and the world position are both written with the result (the compares are made on values with 256 added to the high
byte, as unsigned numbers)."""
in = "X = low, Y = high byte of the box"
out = "X = the current object"

[[sym]]
at = "22:963B"
name = "obj_hurt_blink"
desc = "With A not 0: the draw routine 3E:DDE7 and, when the low two bits of obj_frame are 0, bit 7 of obj_sprite_bank inverted, otherwise cleared (one frame in four undrawn). With A = 0: the draw routine 3E:DA89 and bit 7 cleared."
in = "A = the frames left of the blink"
out = "X = the current object"

# ================================================================== numbers

[[sym]]
at = "22:8B24"
name = "obj_var0_half_ge"
desc = "A = Y = 1 when half of variable 0 (the hit points) of the current object is A or more, else 0."
in = "A = the bound"
out = "A = Y = 0 or 1; X = the current object"

[[sym]]
at = "22:8B35"
name = "div16_8"
desc = "Divides the 16-bit number A (low) / X (high) by Y: sixteen rounds of shift and subtract. The quotient goes to $00/$01 and A / X, the remainder to $05 and Y."
in = "A = low, X = high byte of the dividend; Y = the divisor"
out = "A = low, X = high byte of the quotient; Y = $05 = the remainder"

[[sym]]
at = "22:8FA2"
name = "obj_pick_skip"
desc = """A random index by weights that leaves one out. ($16) = the weights, Y = the index to leave out, A = the sum of
all weights. r = random below A - weight[Y] (into $11); then the first index other than Y whose running sum of the
weights (not counting Y) is r or more."""
in = "A = the sum of the weights, Y = the index left out, $16/$17 = the weights"
out = "Y = the index; A = $11 = r"

