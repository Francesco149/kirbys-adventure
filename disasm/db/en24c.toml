unit = "en24c"
title = "Object types $18, $19, $29 with their children $55 and $56, the effect types $0D and $08, and the enemies' end in water"
summary = """
The last part of bank 24's code, 24:AF44 to 24:BB28: three enemies of the rooms' lists, the two object types they
create, two types that are effects and not creatures, and the script every enemy gets in water. The pattern is that
of unit en24a: a first script that sets the object up, a script per behaviour, and a tick routine per script that
begins with the hit test (3F:E31D with a 24-byte record of bank 39, unit hit) and starts another script through
obj_set_script when something changed. Variable 0 is the hit points, variable 1 obj_dir.

Type $18 (e18_*; kinds $1D-$21): the fish of the pools (w12-sonnet@8390: two in the blue water). It has no water
test of its own; it lives in water and turns back where the block 8 pixels above it is not water. Variable 6 = the
variant the kind gave in variable 0. Variant 0 (kinds $1D, $1E; obj_param 0, 1 = how hard it steers) chases Kirby:
every 8th frame obj_dir becomes the direction to him rounded to an eighth of a turn and 22:886F moves both
velocities one step toward that eighth (tables e18_home_step / e18_home_limit); variables 2 and 3 are a 16-bit count
of its frames. Variant 1 (kind $20) swims level at half a pixel per frame, bobbing, and turns at walls. Variant 3
(kind $21) lurks under the surface and leaps out of the water when Kirby is within $40 pixels of it in X: variable
2 counts to a turn, variable 3 the tries, variable 9 the distance. Variant 2 (kind $1F) never ran.
Type $19 (e19_*; kinds $22, $23): a small creature that climbs walls. Created next to a wall it clings to it (variable
2 = the side of the wall: 0 right, $FF left) and after 30 frames, and after every climb, picks by a weighted random number: climb up, climb
down, drop off, leap at Kirby, or wait; the weights depend on whether Kirby is above, level or below
(e19_odds). On the floor it walks toward Kirby (variable 2 = the frames until it throws an object of type $55; variable 5
= a 16-frame count between two looks at the distance; variable 6 = 0 toward him, 1 away from him: it backs off
when he is within $40 pixels), climbs a wall it meets and climbs down over an edge it walks off. On a wall variable 6
is 0 going up and 1 going down.
Type $55 (e55_*): what type $19 throws: an arc under gravity, deleted off the screen.
Type $29 (e29_*; kinds $24, $25): walks; when its timer (variable 2) runs out it stops, shakes and either blows a
stream of 30 short-lived shots (Kirby nearer than $48 pixels) or one aimed shot that leaves a trail (farther). Both
shots are type $56 (e56_*), told apart by variable 0. The aimed shot's trail is object type $54, whose script is in
unit en24b's range (24:AF08). By place, look and behaviour type $29 is the game's Hot Head; its inhale number is 0.
Type $0D (e0d_start): not a creature. Its first script only picks, by variable 0, one of 15 scripts of bank 22: the
end animations that the enemies' own records start (22:8100 and its relatives), here as objects of their own that
other objects create through obj_spawn_child and the scripts' spawn instructions: bursts, puffs, the eight pieces
that fly apart when a boss ends.
Type $08 (e08_*): a puff, four frames long. Variable 0 = 0: at a random place around its creator (the tick routine
22:8414 of bank 22 makes one every fourth frame around the object it follows); 1: where it was created (scripts of
banks 25, 28, 29 and 2A create these); 2: never ran.
The script 22:833B that the water test of bank 22 gives an enemy continues here (ewater_sink): the enemy sinks, and 30
frames after it has reached the bottom it gets the script 22:8100, the same end as with its hit points gone.
fx_at_object (24:BA8C) is a helper for bank 22: it creates one of Kirby's effects (21:9955) at the current object.

Open:
- Never ran in any movie and not described beyond this list: variant 2 of type $18 (script 24:B152, tick routines
  at 24:B18D and code to 24:B1B0, entries 0 and 1 of e18_scripts); the script 24:AF90 and its tick routine 24:B065 of
  type $18 (a pause of the fleeing fish) and the end of e18_pause from 24:AF82; e18_tick_pause going back to the
  chase (24:AFFD). (Variable 3 reaching 7 in e18_tick_chase, 24:AFB2, and the flight it starts, 24:AF89 with 24:B043
  and 24:B087, ran once in cov4-e-fish@6583: unit en_cov4, e18_flee.) In the
  lurking fish the turn after $C0 frames (24:B279), the random number 0 (24:B2CE), the hit (24:B237), the wall
  (24:B241), and the return to the water after a leap (24:B21B on: 24:B2DE quarters the Y velocity, sound $1F);
  the ceiling in e19_tick_fall (24:B58B); the end of e19_edge_down after its loop; the script 24:B732 of type $55
  (its hit points gone: a burst of 30:8B7A); in type $29 everything behind kirby_ability = 0 or $05E2 = 0 (24:B8B1,
  24:B8E4: it would walk on and not attack), the wall in e29_tick_air (24:B870); the third script of type $08
  (24:BB29, variable 0 = 2: it creates an effect through 21:9952; the cannon's water code of unit en24a asks for
  it); the bytes from 24:BB2D to the end of the bank were never touched.
- The lurking fish (variant 3) ran in one movie only (main, around frames 73,666-74,121 and 84,317-84,470), and in
  most cases it was created where the block above it is not water, so that it swam for one frame and leapt at once;
  the path through the water test ran 68 times, the countdown of variable 3 four times. Its leap never came back
  into water.
- ewater_tick_sink ran twice, both times for an enemy that was on the bottom at once; the sinking itself is from the
  script only. What the set of obj_pts in variable 2 is for each enemy is in bank 22's water tests.
- e18_tick_pause ran four times (two objects, two frames each).
- What 22:886F does exactly (the eight parts 22:88C9-22:89F3) is described here from its use, and the claims check
  the limits and the experiment, not every step. 3F:E012 (the direction between two points, behind obj_aim_at and
  obj_aim_kirby), 3F:E23C (a speed along obj_dir) and 22:86C5 (the distance to an object) are used by address; the
  claims check sides, lengths and limits.
- The models of the tick routines take the answers of the hit test, obj_walk0, obj_collide0 and the probes from the
  branches the routine took, not from the room.
- Which values of variable 0 type $0D is created with in the movies is checked for 7 (main@305) and $0C (the eight
  pieces) only; the creators found in the ROM pass 5, 7, $0A, $0B, $0C and $0E; the targets of 1, 3 and 8 are bytes
  that never ran. What each of the 15 scripts shows is bank 22's.
- The pose tables 30:845C (type $18), 30:84B4 ($19), 30:8B82 ($55), 30:850C ($29), 30:8590 ($56), 30:8B7A (puff)
  keep their address names in unit sprites. The sound numbers ($0D leap, $0E landing, $1E shot, $41 throw) are named
  by where the scripts play them.
- The creatures' names: Hot Head for type $29 rests on what it does and on its inhale number 0; the fish of type
  $18 is by its look and behaviour the game's Blipper; type $19 (a climber that throws) is left without a name. Nothing in
  the ROM states them. Unit en24a calls type $0F Hot Head; by what the two types do, type $0F (a beam that sweeps down,
  inhale number $0F) is more likely the game's Waddle Doo.
"""

