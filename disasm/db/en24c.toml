[[model]]
name = "en24c_model"
code = '''
E18_STEP = [0x000C, 0xFFF4, 0x0018, 0xFFE8]
E18_LIMIT = [0x00C0, 0xFF40, 0x0120, 0xFEE0]
E18_SCRIPTS = [0xB15B, 0xB177, 0xB114, 0xB1E5]
E19_ODDS = [0x3C, 0x50, 0x50, 0x5A, 0x64, 0x28, 0x50, 0x5A, 0x64, 0x64, 0x14, 0x3C, 0x50, 0x5A, 0x64]
E19_ROWS = [0, 0, 0, 5, 5, 10, 10, 10, 10, 10, 10, 5, 5, 0, 0, 0]
E19_SCRIPTS = [0xB423, 0xB304, 0xB35D, 0xB410, 0xB31E, 0xB337, 0xB36D, 0xB39B, 0xB3BA]
E56_FAN_DIRS = [0xF4, 0x08, 0xF8, 0x0C, 0x00]
E56_FAN_POSES = [6, 0, 2, 4, 6]
E0D_SCRIPTS = [0x8100, 0x8144, 0x818B, 0x81D4, 0x82DC, 0x8103, 0x8147, 0x8192, 0x81D7, 0x82DF, 0x8180, 0x8172, 0x8230, 0x8162, 0x81DB]

def c_var(v, s):
    """Address of object variable v of slot s."""
    return 0x61CA + 18 * v + s

def c_pos(m, s):
    """Position (X, Y) of slot s, 16 bits each, from a dict of bytes."""
    return m[0x82 + s] | m[0x94 + s] << 8, m[0xB8 + s] | m[0xCA + s] << 8

def c_x(m, s):
    """X position of slot s, 16 bits."""
    return m[0x82 + s] | m[0x94 + s] << 8

def c_vel(m, s):
    """Velocity (X, Y) of slot s as signed 16-bit numbers."""
    vx = m[0x60E0 + s] | m[0x60F2 + s] << 8
    vy = m[0x6104 + s] | m[0x6116 + s] << 8
    return (vx - 0x10000 if vx & 0x8000 else vx), (vy - 0x10000 if vy & 0x8000 else vy)

def c_fwd(rd, s, speed):
    """A speed along the facing: negated when obj_dir has bit 7 set."""
    return -speed & 0xFFFF if rd[0x61DC + s] & 0x80 else speed
'''

