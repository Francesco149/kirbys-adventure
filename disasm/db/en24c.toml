use = ["en24a_model", "en24c_model"]
model = '''
def e19_plan(rd, wr, mem):
    s = rd[0x6E]
    x, y = c_pos(rd, s)
    dx = (x - e24_w(rd, 0x6075, 0x6087)) & 0xFFFF
    if dx & 0x8000:
        dx = -dx & 0xFFFF
    t = (dx >> 1) & 0xFF
    dy = (y - e24_w(rd, 0x6099, 0x60AB) + 0x20) & 0xFFFF
    if dy & 0x8000:
        dy = -dy & 0xFFFF
    val = (dy & 0xFF) << 8
    q = ((val * (256 // t)) >> 8) & 0xFFFF if t >= 2 else val
    if not 0x40 <= rd[0x61DC + s] < 0xC0:
        q = -q & 0xFFFF
    vy = (q - 16 * t) & 0xFFFF
    if vy & 0x8000:
        if vy >> 8 < 0xFD:
            vy = 0xFD00
    else:
        vy = 0
    return wr[c_var(2, s)] == t and (mem(0x6104 + s) | mem(0x6116 + s) << 8) == vy
'''
