about = ["e19_leap_set", "e19_leap"]
text = "e19_leap_set: variable 2 = t = half the absolute X distance between the object's position and Kirby's world X; Y velocity = (256 times the low byte of the absolute Y distance to the point $20 above Kirby) times (256 // t) >> 8, negated when obj_dir is outside $40-$BF, minus 16 t; then $FD00 when that is below -$0300 and 0 when it is positive."
kind = "call"
