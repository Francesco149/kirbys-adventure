First script of object type $18: a round fish with a fin and a tail that lives in the pools (w12-sonnet@8390: two of
them in the blue water under the corridor; by look and behaviour the game's Blipper). Kinds $1D-$21 create it; the
kind gives variable 0 (the variant: 0 in kinds $1D and $1E, 2 in $1F, 1 in $20, 3 in $21) and variable 1 (0, or 1 in
kind $1E). The script maps bank 22, installs the position routine obj_pos_cull and the pose table 30:845C, keeps
variable 1 as obj_param (obj_param_set), turns the fish toward Kirby (obj_face_kirby), copies the variant to
variable 6 and jumps by it: 0 e18_chase, 1 e18_swim, 2 the script 24:B152 (never ran), 3 e18_lurk.
"""

