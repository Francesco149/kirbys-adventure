unit = "kst18"
title = "Kirby's states of banks 16, 18 and 19: the inhale, the mouthful, the swallow, and the attacks of the copy abilities"
summary = """
Banks 16, 18 and 19 hold 56 of Kirby's 239 state scripts and the 6502 routines they run once per frame. They are
what B does: the inhale and everything that follows it, and the attacks of the copy abilities that have no set of
states of their own.

The inhale (bank 18, script $4B, kirby_st_inhale). B without an ability: kirby_rect becomes a rectangle of kind 0 in
front of Kirby (inhale_rect), three specks of dust fly into his mouth (inhale_dust_step, inhale_dust), and 3F:EBBE
looks for blocks to pull in. Unit hit counts what the rectangle catches: inhale_coming (on its way), inhale_caught
(arrived), inhale_abilities (how many of them carry an ability), mouth_ability (which). inhale_done ends the inhale
with the gulp ($4D) once something arrived and nothing is still coming; inhale_over ends it empty ($4C) after 30
frames when B is released.

The mouthful (scripts $4E-$5F, $05E0 = kirby_form = 1). After the gulp Kirby has a complete but smaller set of
states: stand $4E, walk $4F / $50, run $51 / $52, skid $53, jump $54 / $55, fall $56, land $57, into water $5A,
wade $5C, swim $5D, out of water $5F. There is no ladder, crouch or flight. B spits ($58: the star, a bigger one
when more than one thing is held; kirby_form 0, then kirby_s_reset), Down swallows ($59). The swallow goes by
swallow_kind: nothing to copy; one ability (ability_take: kirby_ability = mouth_ability); or the mix, when two or
more abilities were inhaled: mix_step steps kirby_ability round every 4 frames until A or B stops it
(mix_stop_test). kirby_s_swallow_done then starts the set of states of the new ability through ability_entry_tab.

B with an ability (bank 16, script $3A, kirby_s_ability) is a far jump by kirby_ability: 0 Fire (kirby_s_fire), 1
Spark, 4 Fireball (bank 18), 7 Wheel (bank 18), $0C Ice, $12 Tornado (bank 18), $15 / $16 the grab of Back Drop;
the other entries never ran. Fire, Spark and Ice hold a pose while B is held (and at least 26 frames for Spark),
with a rectangle (spark_rect kind 4, ice_rect kind 2) and break_rect_0; Fire's flames are objects. Fireball is a
dash of 31 frames without gravity (kirby_form 9, rectangle kind 7). Wheel (kirby_form $0A, scripts $45-$49) rolls at
4 pixels per frame until B ($48), a wall ($49) or the room's side; the direction behind him turns it ($47), a
missing floor makes it fall ($46). Tornado spins for 101 frames at 4 pixels per frame (kirby_form $0C); B held
makes it rise (tornado_gravity). Back Drop inhales with a rectangle of kind 3 (kirby_st_grab), holds what arrives
($E0, kirby_s_grab_hold, Kirby cannot be hurt) and grab_choose picks the move from the pad: Up, Down or A ran
(kirby_s_drop_up / _down / _a: jumps whose landing, $E5 / $E4 / $E6, stores 2 in $05FC for the held object of unit
kfx); the moves 2, 4 and 6 (forward, backward, in the air) and the timeout first ran in cov5-h-bd and are unit
kst_cov5's. When one of these rectangles strikes something, hit_interrupt of unit hit gives Kirby kirby_s_hit_stop
(16:AA0B) for 4 frames.

Every state routine asks its tests in a fixed order and the first yes names the next script; the claims model
that per routine (model kst18_exits: path18), with the pad tests computed from pad1_held_copy / pad1_new_copy and
the others taken from the answer of the bank 21 helper.

$05E0 (kirby_form, named in unit kst14) as these banks store it: 0 the spit, 1 the mouthful, 2 an attack that
keeps Kirby's ordinary pictures (Fire, Spark, Ice, the grab; the tornado winding up and down; the fireball after
the dash), 9 the fireball dash, $0A the wheel, $0C the tornado at full speed; never run: 7 (18:AB7C), 8 (19:B669),
$0B (19:B31D).

Open. Bank 19 never ran at all: scripts $D0-$D9 and the entries $10 (19:B669, kirby_form 8, scripts $D0 / $D1)
and $11 (19:B2F1, kirby_form $0B, scripts $D2-$D9: a set with stand, walk, turn, jump, fall and a bounce off the
floor and the walls) of kirby_s_ability; which abilities they are is not known from the corpus. Bank 16, never
run: entries 2 (16:A1BD), 5 (16:A1DD), 6 (16:A202, script $43), $0B (16:A2F2, script $44), $0D (16:A3B9, script
$4A), $13 (16:A414), $14 (16:A516) of the table; entry $0F (16:A0CF: its subscript 16:A0E1 ran twice, called from
elsewhere); scripts $3B-$3D (16:A054-: far jumps to bank 14 after a sprite map), $DF (16:A5DF, the grab ended
empty), $E1 (16:A9C7), $E7 ($E2 / $E3, the landings of moves 2 and 4, the moves 2, 4 and 6 of grab_choose and its
timeout first ran in cov5-h-bd: unit kst_cov5); the branch of kirby_s_grab_hold for ability $16 (16:A660, run by the Throw movie: unit kst_abl). Bank 18, never run: scripts $3F / $40
(the fireball meeting a wall or the floor), $5B (standing in water with the mouth full), $5E; 18:AB7C (entry 6 of
kirby_s_swallow_done, ability $0A, kirby_form 7); the second copy of the swallow's code at 18:B699-B782. Run but not
documented: kirby_s_full_wade's routine 18:B54D (one call), 16:A9CE / 16:AA00 (the script of the object the grab
caught: 22:802E, then inhale_caught + 1 and inhale_coming - 1 at 16:A9DC).
In the documented routines every exit that the claims' cases do not list never ran (the texts name them): all
water exits except the mouthful's fall and swim, the door exits of the stand, the jump and the swim, the wall and
ceiling exits of the fireball. The wheel was used in one stretch of main (6 starts), the tornado once (w2-seq),
Fire, Spark, Ice and Back Drop only in the demo (attract, both cycles): the turn of the tornado at a wall, Kirby
facing left in ice_rect and grab_rect, the wrap of mix_step after $17 and mix_waits beyond 4 never ran.
What the kinds in the first byte of a rectangle mean to bank 39 (0 inhale, 2 ice, 3 grab, 4 spark, 5 wheel and
tornado, 7 fireball) and hit_rect_power (4, 6, 8) is unit hit's; what 3F:EBBE, 3F:E2D9, 3E:DFA3, 21:9BF7, 21:9B06 and
the effect records behind 21:9952 / 21:99EA do is described only as far as these scripts show. $05E8 / $0598 (the
count that comes with an ability), $05F5, $05F6, $05FC and $05FD are used by address, not named.
"""
[[model]]
name = "kst18_exits"
code = '''
KS18 = {0x00: 0xA5AE, 0x17: 0xAFD3, 0x33: 0xBCAE, 0x3B: 0xA054, 0x3F: 0xAC39, 0x40: 0xAC4A, 0x42: 0xA16F, 0x45: 0xA892, 0x46: 0xA977, 0x47: 0xA922, 0x48: 0xA9D2, 0x49: 0xAA05, 0x4C: 0xAEC1, 0x4D: 0xAEE1, 0x4E: 0xAF74, 0x4F: 0xAFE4, 0x50: 0xAFEE, 0x51: 0xB0E1, 0x52: 0xB0EC, 0x53: 0xB160, 0x54: 0xB1BD, 0x55: 0xB1D4, 0x56: 0xB23D, 0x57: 0xB24D, 0x58: 0xB29D, 0x59: 0xB32E, 0x5A: 0xB4A8, 0x5D: 0xB5C3, 0x5E: 0xB5E8, 0x5F: 0xB66D, 0xDF: 0xA5DF, 0xE0: 0xA5FF, 0xE1: 0xA9C7, 0xE4: 0xA845, 0xE5: 0xA89A, 0xE6: 0xA8FF, 0xE7: 0xA90B}

def held(rd, mask):
    """a button of the mask is held (pad1_held_copy: A $80, B $40, Select $20, Start $10, Up 8, Down 4, Left 2, Right 1)"""
    return bool(rd.get(0xE6, 0) & mask)

def new(rd, mask):
    """a button of the mask is newly pressed (pad1_new_copy)"""
    return bool(rd.get(0xE7, 0) & mask)

def maybe(possible):
    """a test that needs more than the call's own bytes: not modelled (None) when they allow a yes, no when they do not"""
    return None if possible else False

def went18(rd, wr):
    """the script address Kirby's thread was given during the call, or None"""
    t = rd.get(0x614D)
    if t is None or (0x6380 + t) not in wr:
        return None
    return wr[0x6380 + t] | wr[0x63A0 + t] << 8

def path18(ran, rd, wr, tests, stay, other=()):
    """tests: (address of an exit's ldx, script number, the answer of its test) in the routine's order; stay: the
    address reached when no test answered yes. 'ok' when exactly one of them ran, once, no test before it answered
    yes, its own test did not answer no, and Kirby's thread is at the script's address (not moved without an exit,
    or at one of `other`)."""
    seq = [t[0] for t in tests] + [stay]
    hit = [i for i, at in enumerate(seq) if ran(at)]
    if len(hit) != 1 or ran(seq[hit[0]]) != 1:
        return 'paths run: %r' % [seq[i] for i in hit]
    k = hit[0]
    for i, (at, num, ans) in enumerate(tests):
        if i < k and ans:
            return 'the test before %s answered yes' % at
        if i == k and ans is False:
            return 'exit %s with its test answering no' % at
    t = went18(rd, wr)
    if k < len(tests):
        return 'ok' if t == KS18[tests[k][1]] else 'thread at %r after the exit to %02X' % (t, tests[k][1])
    return 'ok' if t is None or t in other else 'thread at %04X without an exit' % t

def rect18(rd, wr, rec, power):
    """kirby_rect_set with the seven bytes `rec` and X = power: kirby_rect = the kind, Kirby's world X plus bytes
    1-2, his world Y plus bytes 3-4, half the width, half the height; hit_rect_power = power."""
    x = ((rd[0x6075] | rd[0x6087] << 8) + (rec[1] | rec[2] << 8)) & 0xFFFF
    y = ((rd[0x6099] | rd[0x60AB] << 8) + (rec[3] | rec[4] << 8)) & 0xFFFF
    return [wr.get(0x501 + i) for i in range(8)] == [rec[0], x & 255, x >> 8, y & 255, y >> 8, rec[5], rec[6], power]

def state18(ram, bank, table):
    """table: address of a tick routine -> (kirby_action or None, $05E0 or None, spans of script addresses).
    None unless slot 1's tick routine is in the table and both it and Kirby's thread are in `bank`; else the routine's
    address and whether the action, $05E0 and the thread's place are the ones the table gives."""
    t = ram[0x614D]
    ta = ram[0x627F] | ram[0x6291] << 8
    if ram[0x62A3] != bank or ram[0x63C0 + t] != bank or ta not in table:
        return None
    pc = ram[0x6380 + t] | ram[0x63A0 + t] << 8
    act, form, spans = table[ta]
    return (ta, (act is None or ram[0x5E1] == act) and (form is None or ram[0x5E0] == form)
            and any(lo <= pc < hi for lo, hi in spans))

def s8(v):
    return v - 256 if v & 0x80 else v
'''

