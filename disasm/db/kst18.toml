[[claim]]
id = "kst18.attacks.frames"
about = ["kirby_st_ability_air", "kirby_st_spark", "kirby_st_ice", "kirby_st_grab", "kirby_st_grab_hold", "kirby_st_drop_down", "kirby_st_drop_up", "kirby_st_drop_a", "kirby_st_drop_recover", "kirby_s_fire", "kirby_s_spark", "kirby_s_spark_end", "kirby_s_ice", "kirby_s_grab", "kirby_s_grab_hold", "kirby_s_drop_down", "kirby_s_drop_up", "kirby_s_drop_a", "kirby_s_drop_recover", "kirby_s_drop_down_land", "kirby_s_drop_up_land", "kirby_s_drop_a_land"]
text = "At the end of every frame on which the tick routine of slot 1 is one of these nine routines of bank $16 and Kirby's thread is in bank $16: kirby_action is $0C (9 in the grab), $05E0 (kirby_form) is 2, and the thread is inside the state's script."
kind = "frames"
on = ["attract@3440+1100", "attract@6250+420", "attract@14385+1100", "attract@17195+420"]
use = ["kst18_exits"]
model = '''
def st(ram):
    T = {A('kirby_st_ability_air'): (0x0C, 0x02, [(A('kirby_s_fire'), A('kirby_st_ability_air')), (A('kirby_s_spark'), A('kirby_st_spark'))]),
         A('kirby_st_spark'): (0x0C, 0x02, [(A('kirby_s_spark'), A('kirby_s_spark_end'))]),
         A('kirby_st_ice'): (0x0C, 0x02, [(A('kirby_s_ice'), A('kirby_st_ice'))]),
         A('kirby_st_grab'): (0x09, 0x02, [(A('kirby_s_grab'), A('kirby_st_grab'))]),
         A('kirby_st_grab_hold'): (0x0C, 0x02, [(A('kirby_s_grab_hold'), A('kirby_st_grab_hold'))]),
         A('kirby_st_drop_down'): (0x0C, 0x02, [(A('kirby_s_drop_down'), A('kirby_s_drop_down_land'))]),
         A('kirby_st_drop_up'): (0x0C, 0x02, [(A('kirby_s_drop_up'), A('kirby_s_drop_up_land'))]),
         A('kirby_st_drop_a'): (0x0C, 0x02, [(A('kirby_s_drop_a'), A('kirby_s_drop_a_land'))]),
         A('kirby_st_drop_recover'): (0x0C, 0x02, [(A('kirby_s_drop_recover'), A('kirby_st_drop_recover'))])}
    for k in T:
        T[k] = (T[k][0], T[k][1], T[k][2] + [])
    return state18(ram, 0x16, T)
'''
always = "st(ram) is None or st(ram)[1]"
sometimes = ["st(ram) is not None and st(ram)[0] == A('kirby_st_ability_air')", "st(ram) is not None and st(ram)[0] == A('kirby_st_spark')", "st(ram) is not None and st(ram)[0] == A('kirby_st_ice')", "st(ram) is not None and st(ram)[0] == A('kirby_st_grab')", "st(ram) is not None and st(ram)[0] == A('kirby_st_grab_hold')", "st(ram) is not None and st(ram)[0] == A('kirby_st_drop_down')", "st(ram) is not None and st(ram)[0] == A('kirby_st_drop_up')", "st(ram) is not None and st(ram)[0] == A('kirby_st_drop_a')", "st(ram) is not None and st(ram)[0] == A('kirby_st_drop_recover')"]

