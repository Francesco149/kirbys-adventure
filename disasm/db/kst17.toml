cases = { "ran('17:B84A')" = 20, "ran('17:B854')" = 2, "ran('17:B86D')" = 15, "ran('17:B868')" = 1 }

[[claim]]
id = "kst17.ufo_hover_dir.model"
about = ["ufo_hover_dir", "ufo_face"]
text = "Every call of ufo_hover_dir does what the model gives: the count in variable 2 goes up to 9; carry = a direction is held; then variable 0 = the direction, kirby_facing = $40 / $C0 for Right / Left, and variable 2 = 3 less 1 for a direction before other than 0 or 4, for a changed facing, and (with Right or Left held) for a count below 9."
kind = "call"
fn = "ufo_hover_dir"
on = ["main@1000+1500", "ufo-fable@2400+1100", "main@6000+1200", "main@33700+200", "main@10600+500"]
use = ["kst17_exits"]
min_calls = 80
model = '''
def hover_dir(rd, wr, rp):
    h = rd[0xE6]
    c = rd[0x61EF]
    if c < 9:
        c += 1
    d = UDIR[h & 15]
    if d == 0xFF:
        ok = not rp & 1 and 0x61CB not in wr and 0x61DD not in wr
        return ok and (wr.get(0x61EF, c) == c)
    y = 3
    if rd[0x61CB] not in (0, 4):
        y -= 1
    if h & 3:
        f = 0x40 if h & 1 else 0xC0
        if f != rd[0x61DD]:
            y -= 1
        if wr.get(0x61DD) != f:
            return False
        if c < 9:
            y -= 1
    elif 0x61DD in wr:
        return False
    return bool(rp & 1) and wr[0x61CB] == d and wr[0x61EF] == y
'''
expect = "hover_dir(rd, wr, rp)"
cases = { "rp & 1 and wr[0x61EF] == 0" = 3, "rp & 1 and wr[0x61EF] == 1" = 3, "rp & 1 and wr[0x61EF] == 2" = 3, "not rp & 1" = 20, "rp & 1 and not rd[0xE6] & 3" = 3 }

