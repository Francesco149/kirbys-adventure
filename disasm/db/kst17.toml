on = ["main@1000+1500", "ufo-fable@2400+900", "main@6000+1200", "main@25500+300"]
use = ["kst17_exits"]
min_calls = 300
max_calls = 2000
expect = "chain17(rd, wr, 0, 0, 0, [(ran('17:B8FC'), 0xDA, 'dir_changed' if UDIR[rd[0xE6] & 15] != rd[0x61CB] else 'dir_same'), (ran('17:B906'), 0xDC, 'ab_new'), (ran('17:B910'), 0x00, 'door'), (ran('17:B91A'), 0x01, 'select')]) == 'ok' and bool(ran('17:B8FC')) == (UDIR[rd[0xE6] & 15] != rd[0x61CB])"
