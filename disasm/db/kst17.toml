text = "Every call of rodfly_steer does what the model gives: a held direction goes to variable 0, variable 2 becomes 0 and the velocity is 2 pixels per frame in that direction; with none, variable 2 below 9 goes up and the velocity is the drift of the direction in variable 0; with none and variable 2 at 9 kirby_vx, kirby_vy and kirby_speed are 0."
