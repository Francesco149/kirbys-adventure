unit = "kst17"
title = "Kirby's states in bank 17: the UFO, the Star Rod in flight and on the ground"
summary = """
Bank 17 holds 61 of Kirby's 239 state scripts (numbers $7C-$B2, $DA-$DE, $EC) and the 6502 routines they run once
per frame. They are three families, told apart by the byte the entry scripts store in $05E0: $0D the UFO, $0E the
Star Rod in flight (the fight against the orb, main@130781), 6 the Star Rod on the ground (the last fight,
main@134772).

The UFO (scripts $DA-$DD; kirby_s_ufo_enter starts it). There is no gravity. ufo_pad_dir turns the four direction
bits of the pad into a direction number 0-7 (0 = up, clockwise, 2 = right, 4 = down, 6 = left; $FF for none or a
contradiction), kept in variable 0 of slot 1 ($61CB); ufo_vel has the velocity of each direction (2 pixels per
frame straight up or down, 2.5 sideways, 2 and 1 on a diagonal). $DA hovers (kirby_st_ufo_hover): a direction
changes to $DB, a new press of A or B to $DC. $DB moves (kirby_st_ufo_move): a direction other than the one being
flown changes back to $DA (which starts $DB again in the new direction on the next frame), a new press of A or B to
$DC. $DC charges while A or B is held (kirby_st_ufo_charge; Kirby still steers): its script counts variable 3 of
slot 1 ($6201) up to 16; the release changes to $DD, which fires one of four shots by that count (ufo_level: below
2, below 8, below 16, 16; a round of the count takes 4 frames) and goes back to $DA. All of them make sound 9 every 8 frames (ufo_hum). Up at a door
leaves to script 0, Select (pad_select_drop) to script 1.

The Star Rod in flight (kirby_s_rodfly_enter; the flying state has no number, $DE is the shot). rodfly_steer takes
the same direction number and sets a velocity of 2 pixels per frame in that direction from rodfly_vel; after the
release Kirby drifts at a quarter of that for 9 frames (variable 2 counts them) and stops. rodfly_move moves him
in screen coordinates and derives the world position from the camera, because the room scrolls by itself. A new
press of A or B changes to $DE, which creates the shot and returns to the flying script.

The Star Rod on the ground ($7C-$B2, begun by kirby_s_rod_enter) is a complete set of Kirby's ordinary states built
on the helpers of bank 21: $7C chooses a state from 21:9BF7, $7D stands, $7E / $7F walk, $80 / $81 run, $82 skids
on a turn, $83 jumps ($84: A released early), $85 falls, $8C swings the rod (B), $8D inflates (Up), $8E flaps,
kirby_s_rod_float floats, $91 puffs the air out. Each routine is a chain of tests in a fixed order; the first that
answers yes changes the script, and when none does the routine ends in kirby_upkeep.

None of these states reads or writes the inhale bytes $05E2 and $05E5-$05E9 of unit hit themselves (bank 17 has no
inhale); the only use is inside kirby_ladder_test of bank 21.

Open: script $EC (17:BC40) and the bytes after it were never touched, so the exit of the flight at camera Y >=
$035D (rodfly_cam_low never answered yes) is not known; the clamp of rodfly_move to the screen (X $10-$EF, Y
$18-$A7) ran only under replacement input (kst17.rodfly.clamp: the left and the lower limit; the right and the upper are from the listing), and the repeat of the shot while A or B stays held
(rodfly_fire_test, variable 3 counted to 10) never ran. In the UFO, the door exit of kirby_st_ufo_hover never ran
(Up is a direction, so $DB is entered first). What the bytes of the object records behind 21:99EA / 21:9952 mean
(the shots: 0A FB 06 xx, 0A FB 03 00, 0A FB 00 00, 0A FB 08 00 for the UFO, 08 FC 0C 00 for the rod in flight, 08
00 0D 00 for the rod on the ground) is not claimed; nor are the poses. ufo_hover_dir never saw variable 0 at 0 or 4
together with a turn; Up + Down or Left + Right held together never occurred. Which code starts the three entry
scripts (17:B800, 17:BAA9, 17:A000) is not in the unit: none is in kirby_script_lo. $05E0 is not named here (it is
written by scripts of other banks too: 0, 1, 2, $0A were seen).
On the ground, these exits never ran and are described from the listing only: every exit to $85 except none (the
floor never went away under the rod), the ladder ($8B), Down ($89), the water ($92, $8F, $96), the door (0), Select
(1), floor_kind_changed ($7D / $7F / $81), the wall bump of walking and running, a jump from the run or the skid, B
while floating. Scripts never run: $86-$8B, $8F, $90, $92-$B2 (the tables say: $86 / $87 17:A52B / 17:A5AB after
17:A49C, the fall with a bump; $88-$8A crouch and slide by their place after Down; $8B the ladder; $8F / $90 the
float in water; $92-$B2 are not water states but Hammer's set of states, kirby_form 4, documented in unit kst_abl), and the branches of $7E for floor kinds other than 2-4
(one run at 17:A135). 17:A49C is reached from $85 after 28 frames of falling and never ran. The gravity and speed
profile numbers are read from the listing (kst17.profiles.static), not measured.
"""

# ------------------------------------------------------------------ shared model

[[model]]
name = "kst17_exits"
code = '''
KS17 = {0x00: 0xA5AE, 0x01: 0xA74B, 0x7C: 0xA010, 0x7D: 0xA025, 0x7E: 0xA0BE, 0x7F: 0xA0C8, 0x80: 0xA1EC,
        0x81: 0xA1F7, 0x82: 0xA294, 0x83: 0xA2E7, 0x84: 0xA2FD, 0x85: 0xA405, 0x89: 0xA617, 0x8B: 0xA6F5,
        0x8C: 0xA7C3, 0x8D: 0xA892, 0x8E: 0xA8CA, 0x8F: 0xA976, 0x91: 0xA9C8, 0x92: 0xAA15, 0x96: 0xABC2,
        0xDA: 0xB81E, 0xDB: 0xB8C9, 0xDC: 0xB938, 0xDD: 0xB95F, 0xDE: 0xBC09, 0xEC: 0xBC40}
UDIR = [0xFF, 2, 6, 0xFF, 4, 3, 5, 0xFF, 0, 1, 7, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF]

def went17(rd, wr):
    """The script address Kirby's thread was given during the call, or None."""
    t = rd.get(0x614D)
    if t is None or (0x6380 + t) not in wr:
        return None
    return wr[0x6380 + t] | wr[0x63A0 + t] << 8

def known17(kind, h, nw, spd, face, camy):
    """What a test of the chain must answer, from the pad bytes and the state: True, False, or None (not modelled)."""
    if kind == 'speed0':
        return spd == 0
    if kind == 'cam_low':
        return camy >= 0x35D
    if h is None:
        return None
    if kind == 'a_released':
        return not h & 0x80
    if kind == 'a_up':
        return bool(h & 0x88)
    if kind == 'up':
        return bool(h & 0x08)
    if kind == 'down':
        return bool(h & 0x04)
    if kind == 'ab_released':
        return not h & 0xC0
    if kind == 'back':
        return bool(h & (0x01 if face & 0x80 else 0x02))
    if kind == 'ufo_dir':
        return UDIR[h & 15] != 0xFF
    if kind in ('side_free', 'dtap'):
        return None if h & 3 else False
    if kind == 'idle_slow':
        return False if h & 3 else None
    if kind == 'door':
        return None if h & 8 else False
    if nw is None:
        return None
    if kind == 'a_new':
        return bool(nw & 0x80)
    if kind == 'b_new':
        return bool(nw & 0x40)
    if kind == 'ab_new':
        return bool(nw & 0xC0)
    if kind == 'ab_fire':
        return True if nw & 0xC0 else (None if h & 0xC0 else False)
    if kind == 'select':
        return None if nw & 0x20 else False
    return None

def chain17(rd, wr, spd, face, camy, exits):
    """exits: (times the exit's instruction ran, script number, test) in the order of the code."""
    h = rd.get(0xE6)
    nw = rd.get(0xE7)
    taken = [e for e in exits if e[0]]
    if len(taken) > 1 or any(e[0] != 1 for e in taken):
        return 'more than one exit'
    for e in exits:
        k = known17(e[2], h, nw, spd, face, camy)
        if e[0]:
            if k is False:
                return 'exit %02X taken with its test false' % e[1]
            break
        if k is True:
            return 'test %s true and the exit to %02X not taken' % (e[2], e[1])
    t = went17(rd, wr)
    if taken:
        return 'ok' if t == KS17[taken[0][1]] else 'script address %r after the exit to %02X' % (t, taken[0][1])
    return 'ok' if t in (None, 0xA1C8, 0xA4F8) else 'script address %04X without an exit' % t
'''

# ================================================================== the UFO

[[script]]
at = "17:B800"
name = "kirby_s_ufo_enter"
desc = "Entry of the UFO: calls kirby_s_ufo_init and jumps to kirby_s_ufo_hover. Not in kirby_script_lo."

[[script]]
at = "17:B806"
name = "kirby_s_ufo_init"
desc = "A subscript: $05E0 = $0D, the sprite map 1C:800C, ufo_dir_from_facing, return."

[[sym]]
at = "17:B812"
name = "ufo_dir_from_facing"
desc = "Variable 0 of slot 1 ($61CB) = kirby_facing >> 5: the direction number of the side Kirby faces, 2 for right ($40) and 6 for left ($C0). Called from kirby_s_ufo_init and kirby_s_rodfly_enter."

[[script]]
at = "17:B81E"
name = "kirby_s_ufo_hover"
desc = "Script $DA, the UFO hovering in place: kirby_action = 0, variable 2 of slot 1 = 0, kirby_stop, tick routine kirby_st_ufo_hover; then a loop of four poses from 0 (plus the facing), 8 frames each."

[[sym]]
at = "17:B836"
name = "kirby_st_ufo_hover"
desc = """The UFO hovering, once per frame: ufo_hum, kirby_step_from_speed, the three collision tests with stop (walls, floor, ceiling), then in this order: ufo_hover_dir answers carry set (a direction is held) -> script $DB; ufo_ab_new (A or B newly pressed) -> script $DC; pad_up_door -> script 0 (never ran: Up is a direction); pad_select_drop -> script 1; otherwise kirby_upkeep."""
comments = { "B84A" = "a direction: move", "B854" = "A or B: charge", "B85E" = "a door: never ran", "B868" = "Select: the ability is dropped" }

[[sym]]
at = "17:B870"
name = "ufo_hum"
desc = "When the low three bits of obj_frame are 0 (every 8 frames): sound 9 through 3F:F826. Otherwise nothing."

[[sym]]
at = "17:B87D"
name = "ufo_hover_dir"
desc = """The hover's direction test. Variable 2 of slot 1 ($61EF), the count of frames hovered, goes up by 1 until it is 9. With no direction held (ufo_dir answers $FF): carry clear. Otherwise carry set, variable 0 ($61CB) = the direction, and variable 2 becomes a number 0-3 for the move's script: 3, less 1 when the direction before was neither 0 nor 4 (not straight up or down), and when Right or Left is held (Right wins): kirby_facing = ufo_face of it, less 1 when that changed the facing, less 1 when the count was below 9. Script $DB plays its turning pose only for 0: a reversal sideways within 9 frames of stopping."""
out = "carry set: a direction is held"

[[data]]
at = "17:B8C7"
len = 2
name = "ufo_face"
format = "bytes"
desc = "kirby_facing for Right ($40) and for Left ($C0). Read by ufo_hover_dir."

[[script]]
at = "17:B8C9"
name = "kirby_s_ufo_move"
desc = "Script $DB, the UFO flying: kirby_action = 1, tick routine kirby_st_ufo_move; with variable 2 of slot 1 at 0 pose 8 for 8 frames and pose 10 for 8 first (the turn); then a loop of four poses from 0, 2 frames each."

[[sym]]
at = "17:B8E5"
name = "kirby_st_ufo_move"
desc = """The UFO flying, once per frame: ufo_hum, ufo_velocity (the velocity of the direction in variable 0), kirby_step_from_speed, the three collision tests with stop, then in this order: ufo_dir_changed (the pad's direction is not the one flown, which includes no direction) -> script $DA; ufo_ab_new -> script $DC; pad_up_door -> script 0; pad_select_drop -> script 1; otherwise kirby_upkeep."""
comments = { "B8FC" = "another direction or none: hover", "B906" = "A or B: charge", "B910" = "Up at a door", "B91A" = "Select" }

[[sym]]
at = "17:B922"
name = "ufo_dir_changed"
desc = "Carry set when ufo_dir's answer differs from variable 0 of slot 1 ($61CB), clear when it is the same."
out = "carry"

[[sym]]
at = "17:B92E"
name = "ufo_ab_new"
desc = "Carry set when A or B is newly pressed (pad1_new_copy & $C0), else clear."
out = "carry"

[[script]]
at = "17:B938"
name = "kirby_s_ufo_charge"
desc = "Script $DC, the UFO charging: kirby_action = $0C, tick routine kirby_st_ufo_charge, variable 3 of slot 1 ($6201) = 0; then 16 rounds of 4 frames (pose 12 and two more), each adding 1 to variable 3; then a two-pose flicker for as long as the button is held."

[[script]]
at = "17:B95F"
name = "kirby_s_ufo_fire"
desc = """Script $DD, the UFO's shot: ufo_level, then one of four subscripts by its answer, then a jump to kirby_s_ufo_hover. Level 0 (17:B96F): tick routine kirby_st_ufo_steer, a second thread (17:B986) that calls 21:99EA sixteen times in 2-frame steps with the records 0A FB 06 and a last byte $C0, $D0 ... $30 (two each), and 8 rounds of sound $1D with four poses. Level 1 (17:B9D7): sound $42, 21:99EA with 0A FB 03 00. Level 2 (17:B9E3): sound $47, 0A FB 00 00. Level 3 (17:B9EF): sound $32, 0A FB 08 00. The third byte of a record becomes variable 3 of the shot (slots 6-8)."""

[[sym]]
at = "17:B9FB"
name = "kirby_st_ufo_charge"
desc = "The UFO charging, once per frame: with neither A nor B held (ufo_ab_released) -> script $DD. Otherwise it falls into kirby_st_ufo_steer."
comments = { "BA00" = "released: fire" }

[[sym]]
at = "17:BA05"
name = "kirby_st_ufo_steer"
desc = """Steering without a change of state (the rest of the charge, and the tick routine of the level 0 shot): ufo_hum; with a direction held, variable 0 of slot 1 = the direction and ufo_velocity, with none kirby_stop; kirby_step_from_speed, the three collision tests with stop; pad_up_door -> script 0; otherwise kirby_upkeep."""
comments = { "BA2A" = "Up at a door" }

[[sym]]
at = "17:BA32"
name = "ufo_ab_released"
desc = "Carry set when neither A nor B is held (pad1_held_copy & $C0 is 0), else clear."
out = "carry"

[[sym]]
at = "17:BA3C"
name = "ufo_level"
desc = "The level of the UFO's shot from the charge count in variable 3 of slot 1 ($6201): 0 below 2, 1 below 8, 2 below 16, 3 from 16."
out = "A = 0-3"

[[sym]]
at = "17:BA52"
name = "ufo_dir"
desc = "A = ufo_pad_dir[pad1_held_copy & $0F]: the direction number of the held direction buttons, or $FF. The flags are those of the load, so minus = none."
out = "A = 0-7 or $FF; Y = the index"

[[data]]
at = "17:BA5B"
len = 16
name = "ufo_pad_dir"
format = "bytes"
desc = "Direction number by the low four bits of the pad (Right 1, Left 2, Down 4, Up 8): 0 up, 1 up-right, 2 right, 3 down-right, 4 down, 5 down-left, 6 left, 7 up-left; $FF for no direction and for Left + Right or Up + Down."

[[sym]]
at = "17:BA6B"
name = "ufo_velocity"
desc = "kirby_vx and kirby_vy = the entries of ufo_vel for the direction in variable 0 of slot 1 ($61CB), then a jump to kirby_speed_from_vx."

[[data]]
at = "17:BA89"
len = 32
name = "ufo_vel"
format = "rows:8"
desc = "The UFO's velocity by direction 0-7, four rows of 8: low bytes of X, high bytes of X, low bytes of Y, high bytes of Y. X is 0, $0200, $0280, $0200, 0, -$0200, -$0280, -$0200; Y is -$0200, -$0100, 0, $0100, $0200, $0100, 0, -$0100 (256 = one pixel per frame)."

# ================================================================== the Star Rod in flight

[[script]]
at = "17:BAA9"
name = "kirby_s_rodfly_enter"
desc = "Entry of the flight with the Star Rod: $05E0 = $0E, kirby_ability = $18, bit 5 of kirby_flags set, the sprite map 1C:8134, ufo_dir_from_facing, variable 2 of slot 1 = 9 (no drift), rodfly_screen_pos, the object's move routine 3E:D8A6, then kirby_s_rodfly. Not in kirby_script_lo."

[[sym]]
at = "17:BACC"
name = "rodfly_screen_pos"
desc = "The position of slot 1 = its world position minus the camera (16 bits, X and Y)."

[[sym]]
at = "17:BAEF"
name = "rodfly_move"
desc = """Kirby's move step in the flight: kirby_vx_from_speed, kirby_vx_apply, kirby_vy_apply, current_push unless bit 7 of kirby_flags is set, obj_integrate (the velocity is added to the position on the screen), the low byte of the X position is kept in $10-$EF and of the Y position in $18-$A7, then a jump to obj_world_from_screen: the world position is the screen position plus the camera."""

[[script]]
at = "17:BB2E"
name = "kirby_s_rodfly"
desc = "The flight with the Star Rod (no script number): tick routine kirby_st_rodfly, then pose 0 for 48 frames and three short poses, repeated."

[[sym]]
at = "17:BB3C"
name = "kirby_st_rodfly"
desc = """The flight, once per frame: rodfly_steer, rodfly_move, the three collision tests with stop, then: rodfly_fire_test answers carry set -> script $DE; rodfly_cam_low -> script $EC (never ran); otherwise kirby_upkeep."""
comments = { "BB50" = "A or B: the shot", "BB5A" = "never ran" }

[[sym]]
at = "17:BB62"
name = "rodfly_fire_test"
desc = "A or B newly pressed: variable 3 of slot 1 ($6201) = 0, carry set. Otherwise, with A or B held, variable 3 goes up by 1 and at 10 the same answer is given (never ran); with neither, carry clear."
out = "carry set: fire"

[[sym]]
at = "17:BB81"
name = "rodfly_cam_low"
desc = "Carry set when the camera's Y (16 bits) is $035D or more, else clear."
out = "carry"

[[sym]]
at = "17:BB8B"
name = "rodfly_steer"
desc = """The flight's velocity. With a direction held (ufo_dir): variable 0 of slot 1 = the direction, variable 2 = 0, and kirby_vx / kirby_vy = entry direction of rodfly_vel. With none and variable 2 below 9: variable 2 + 1 and entry 8 + variable 0 (the drift: a quarter of the speed in the last direction). With none and variable 2 at 9: kirby_stop. The first two end in kirby_speed_from_vx."""

[[data]]
at = "17:BBC9"
len = 64
name = "rodfly_vel"
format = "rows:16"
desc = "The flight's velocity, four rows of 16: low bytes of X, high bytes of X, low bytes of Y, high bytes of Y. Entries 0-7 are 512 times (sin, -cos) of direction * 45 degrees, rounded towards 0: two pixels per frame in the eight directions; entries 8-15 the same with 128, for the drift."

[[script]]
at = "17:BC09"
name = "kirby_s_rodfly_shot"
desc = "Script $DE, the shot in the flight: tick routine kirby_st_rodfly_shot, pose 3 for 2 frames, 21:99EA with the record 08 FC 0C 00, sound $1B, seven poses (17 frames), then a jump to kirby_s_rodfly."

[[sym]]
at = "17:BC24"
name = "kirby_st_rodfly_shot"
desc = "The flight during the shot, once per frame: rodfly_steer, rodfly_move, the three collision tests with stop; rodfly_cam_low -> script $EC (never ran); otherwise kirby_upkeep. A and B are not read."

# ================================================================== the Star Rod on the ground

[[script]]
at = "17:A000"
name = "kirby_s_rod_enter"
desc = "Entry of the Star Rod on the ground: $05E0 = 6, bit 5 of kirby_flags set, the sprite map 1A:8EE6, 21:9CB3, then it runs into kirby_s_rod_resume. Not in kirby_script_lo."

[[script]]
at = "17:A010"
name = "kirby_s_rod_resume"
desc = "Script $7C, where the states come back to (a landing, the end of the swing or the puff): 21:9BF7 answers 0-7 and the script jumps to kirby_s_rod_stand (0), kirby_s_rod_walk (1), kirby_s_rod_run (2), kirby_s_rod_fall (3), 17:AA22, 17:AA7D, 17:AB33 (4-6, scripts $93-$95, never run) or kirby_s_rod_float (7)."

[[script]]
at = "17:A025"
name = "kirby_s_rod_stand"
desc = "Script $7D, standing: kirby_action = 0, tick routine kirby_st_rod_stand, a bump's pose first when one waits (21:8015, 21:801F), then rod_stand_pose and halt."

[[sym]]
at = "17:A03F"
name = "kirby_st_rod_stand"
desc = """Standing with the Star Rod, once per frame: kirby_face_pad, kirby_pose_face, kirby_step_from_speed, kirby_walls_stop, then in this order: kirby_floor_near finds no floor -> $85; pad_side_free -> $7E (walk); kirby_ladder_test -> $8B; pad_down_held -> $89; pad_a_new -> $83 (jump); pad_b_new -> $8C (swing); pad_up_door -> 0; pad_up_held -> $8D (inflate); floor_kind_changed -> $7D; pad_select_drop -> 1; otherwise kirby_upkeep."""

[[sym]]
at = "17:A0B2"
name = "rod_stand_pose"
desc = "Kirby's pose (obj_pose of slot 1) = 2 * floor_kind_index: one standing pose per kind of floor. Returns the index in A."
out = "A = floor_kind_index's answer"

[[script]]
at = "17:A0BE"
name = "kirby_s_rod_walk"
desc = "Script $7E, walking: with floor_flag not 0 a sound ($31, never ran), then kirby_s_rod_walk_quiet."

[[script]]
at = "17:A0C8"
name = "kirby_s_rod_walk_quiet"
desc = "Script $7F, walking: kirby_action = 1, tap_timer = 0, tick routine kirby_st_rod_walk, a bump's pose first when one waits, then 21:9B96 chooses the walk cycle by the floor (for a flat floor four poses of 10, 8, 10, 8 frames from pose $10). kirby_s_rod_run shares the table of cycles at 17:A0E5."

[[sym]]
at = "17:A161"
name = "kirby_st_rod_walk"
desc = """Walking with the Star Rod, once per frame: kirby_ground_speed_0, kirby_step_from_speed, then in this order: kirby_walls_bump -> $7D; kirby_floor_near finds no floor -> $85; kirby_speed_zero -> $7D (stand); pad_back_held -> $82 (skid); pad_double_tap -> $80 (run); kirby_ladder_test -> $8B; pad_down_held -> $89; pad_a_new -> $83; pad_b_new -> $8C; floor_kind_changed -> $7F; pad_up_door -> 0; pad_up_held -> $8D; pad_select_drop -> 1; otherwise kirby_upkeep."""

[[script]]
at = "17:A1EC"
name = "kirby_s_rod_run_start"
desc = "Script $80, the start of a run: sound $37 and an object through 21:9952 (record 00 00 01 00), then kirby_s_rod_run."

[[script]]
at = "17:A1F7"
name = "kirby_s_rod_run"
desc = "Script $81, running: kirby_action = 2, tick routine kirby_st_rod_run, a bump's pose first when one waits, then 21:9BAA chooses the cycle from the table of kirby_s_rod_walk_quiet."

[[sym]]
at = "17:A213"
name = "kirby_st_rod_run"
desc = """Running with the Star Rod, once per frame: kirby_ground_speed_5, kirby_step_from_speed, then in this order: kirby_walls_bump -> $7D; kirby_floor_near finds no floor -> $85; pad_back_held -> $82; pad_idle_slow -> $7E (walk); kirby_ladder_test -> $8B; pad_down_held -> $89; pad_a_new -> $83; pad_b_new -> $8C; floor_kind_changed -> $81; pad_up_door -> 0; pad_up_held -> $8D; pad_select_drop -> 1; otherwise kirby_upkeep. Only the exit to $7E ran."""

[[script]]
at = "17:A294"
name = "kirby_s_rod_skid"
desc = "Script $82, the skid of a turn: kirby_action = 3, sound $31, tick routine kirby_st_rod_skid, pose $1E (plus the facing), an object through 21:9952 (record 00 00 01 00), halt."

[[sym]]
