max_calls = 4000
model = '''
import math
def rvel(i):
    r = 512 if i < 8 else 128
    a = (i & 7) * math.pi / 4
    return int(round(r * math.sin(a), 6)) & 0xFFFF, int(round(-r * math.cos(a), 6)) & 0xFFFF

def steer(rd, wr):
    d = UDIR[rd[0xE6] & 15]
    if d != 0xFF:
        if wr.get(0x61CB) != d or wr.get(0x61EF) != 0:
            return False
        i = d
    elif rd[0x61EF] < 9:
        if wr.get(0x61EF) != rd[0x61EF] + 1 or 0x61CB in wr:
            return False
        i = 8 + rd[0x61CB]
    else:
        return all(wr.get(k) == 0 for k in (0x5B9, 0x5BA, 0x5BB, 0x5BC, 0x5BD, 0x5BE)) and 0x61EF not in wr
    return (wr[0x5B9] | wr[0x5BA] << 8, wr[0x5BD] | wr[0x5BE] << 8) == rvel(i)
'''
