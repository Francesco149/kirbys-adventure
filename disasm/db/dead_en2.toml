[[claim]]
id = "dead_en2.e3d_tables"
about = ["e3d_fs_slide", "e3d_choose_0", "e3d_slide_vx", "e3d_pick_alt", "e3d_pal_day_more", "e3d_pal_storm_more", "e3d_sweep_l_rest"]
text = "e3d_states_b's entries 3, 7, 9 and 10 are e3d_st_chase, e3d_st_to_point, e3d_st_after and e3d_st_wait; e3d_start's jump table (2F:A01F, its entries from 2F:A021) has e3d_blk_start, e3d_blk_left, e3d_blk_right and e3d_walker as entries 2, 3, 4 and 8; e3d_picks' entry 1 is e3d_pick1; e3d_fight_states' entries 1 and 4 are e3d_fs_slide and e3d_fs_hold; e3d_choose_sides holds e3d_choose_0 and e3d_choose_1; the two steer tables are equal (steps $0040, limits $0200); e3d_choices, e3d_slide_vx, e3d_pick_alt and the two four-colour tails hold the values given; e3d_sweep_l_rest differs from the 95 bytes at 2F:AC20 only in the X velocity words of its set_vx_w instructions, each the negation of the other's, and in the value stored to $0786 (1 for 0); bank 2F holds no lda #7 / sta $6200,x and no set_var var3, 7: the one store of state 7 is e3d_dash's lda #7 / ldy obj_var8,x / bne +2 / lda #8 / sta $6200,x at 2F:A2C6 (unit cov9)."
kind = "static"
expect = "[u16(O('e3d_states_b') + 2 * k) for k in (3, 7, 9, 10)] == [cpu(O(x)) for x in ('e3d_st_chase', 'e3d_st_to_point', 'e3d_st_after', 'e3d_st_wait')] and [u16(O('2F:A021') + 2 * k) for k in (2, 3, 4, 8)] == [cpu(O(x)) for x in ('e3d_blk_start', 'e3d_blk_left', 'e3d_blk_right', 'e3d_walker')] and u16(O('e3d_picks') + 2) == cpu(O('e3d_pick1')) and [u16(O('e3d_fight_states') + 2 * k) for k in (1, 4)] == [cpu(O('e3d_fs_slide')), cpu(O('e3d_fs_hold'))] and [u16(O('e3d_choose_sides')), u16(O('e3d_choose_sides') + 2)] == [cpu(O('e3d_choose_0')), cpu(O('e3d_choose_1'))] and rom[O('e3d_point_steer'):O('e3d_point_steer') + 32] == rom[O('e3d_chase_steer'):O('e3d_chase_steer') + 32] == bytes([0x40, 0xC0] * 4 + [0x00, 0xFF] * 4 + [0x00] * 8 + [0x02, 0xFE] * 4) and rom[O('e3d_choices'):O('e3d_choices') + 48] == bytes([1, 1, 1, 1, 2, 2, 2, 2, 1, 1, 1, 1, 1, 1, 2, 2, 1, 1, 1, 1, 2, 2, 3, 3, 1, 2, 2, 3, 3, 3, 3, 3, 1, 1, 1, 1, 3, 3, 3, 3, 1, 1, 1, 2, 3, 3, 3, 3]) and rom[O('e3d_slide_vx'):O('e3d_slide_vx') + 4] == bytes([0x01, 0xFE, 0x40, 0xC0]) and rom[O('e3d_pick_alt'):O('e3d_pick_alt') + 2] == bytes([1, 2]) and rom[O('e3d_pal_day_more'):O('e3d_pal_day_more') + 4] == rom[O('e3d_pal_storm_more'):O('e3d_pal_storm_more') + 4] == bytes([0x21, 0x37, 0x27, 0x07]) and [i for i in range(95) if rom[O('e3d_sweep_l_rest') + i] != rom[O('2F:AC20') + i]] == [8, 9, 17, 18, 26, 27, 35, 36, 45, 46, 54, 55, 61, 67, 73, 91] and all((u16(O('e3d_sweep_l_rest') + i) + u16(O('2F:AC20') + i)) & 0xFFFF == 0 for i in (8, 17, 26, 35, 45, 54, 60, 66, 72) if rom[O('e3d_sweep_l_rest') + i - 1] == 0xB0) and rom[O('e3d_sweep_l_rest') + 88:O('e3d_sweep_l_rest') + 93] == bytes([0x11, 0x86, 0x07, 0x01, 0x17]) and rom.find(bytes([0xA9, 0x07, 0x9D, 0x00, 0x62]), 0x2F * 0x2000, 0x30 * 0x2000) < 0 and rom.find(bytes([0x0D, 0x03, 0x07]), 0x2F * 0x2000, 0x30 * 0x2000) < 0 and rom[O('2F:A2C6'):O('2F:A2C6') + 12] == bytes([0xA9, 0x07, 0xBC, 0x5A, 0x62, 0xD0, 0x02, 0xA9, 0x08, 0x9D, 0x00, 0x62])"

[[claim]]
id = "dead_en2.2f_unnamed"
about = ["e3d_spare_rts", "e3d_cloud_anim_again", "e3d_fs_spare", "e3f_orb_again", "e3f_spare", "e3f_pal_more", "e3f_more_cols", "e3f_more_cols2"]
text = "Nothing names e3d_spare_rts, e3d_cloud_anim_again, e3d_fs_spare, e3f_orb_again, e3f_spare or e3f_pal_more: no decoded instruction has their address as operand and no two bytes of bank 2F outside code hold it; e3d_spare_rts is an rts; e3d_cloud_anim_again is jmp $AA57, e3f_orb_again zero_vel and jmp $B2DD (script bytes); e3f_spare's second byte $52 is no 6502 opcode; e3f_pal_more reads 2F:B87E, B882, B88A, B88E and B892 with X, and the tables hold four $0F, four $30, four $25, four $0F, four $30 and $21 $11 $01 $11 (the bytes of e3f_orb_a); e3d_point_script starts with on_tick e3d_tick_eye and ends with set_var var3, 9 and jmp $A05D (a halt); e3d_walker_rest starts with binop_mem $0789; e3d_attack4_rest starts with asm_w asm_spawn whose variable 0 is 8."
kind = "static"
expect = "all(refs(x) == [] and [p for p in ptrs(x) if p >> 13 == 0x2F and kind(p) != 'c'] == [] for x in ('e3d_spare_rts', 'e3d_cloud_anim_again', 'e3d_fs_spare', 'e3f_orb_again', 'e3f_spare', 'e3f_pal_more')) and u8('e3d_spare_rts') == 0x60 and rom[O('e3d_cloud_anim_again'):O('e3d_cloud_anim_again') + 3] == bytes([0x17, 0x57, 0xAA]) and rom[O('e3f_orb_again'):O('e3f_orb_again') + 4] == bytes([0x38, 0x17, 0xDD, 0xB2]) and u8(O('e3f_spare') + 1) == 0x52 and [u16(O('e3f_pal_more') + k) for k in (1, 7, 13, 19, 25)] == [0xB87E, 0xB882, 0xB88A, 0xB88E, 0xB892] and rom[O('e3f_more_cols'):O('e3f_more_cols') + 8] == bytes([0x0F] * 4 + [0x30] * 4) and rom[O('e3f_more_cols2'):O('e3f_more_cols2') + 16] == bytes([0x25] * 4 + [0x0F] * 4 + [0x30] * 4) + rom[O('e3f_orb_a'):O('e3f_orb_a') + 4] and rom[O('e3d_point_script'):O('e3d_point_script') + 4] == bytes([0x08, 0xDC, 0xA0, 0x2F]) and rom[O('e3d_point_script') + 116:O('e3d_point_script') + 122] == bytes([0x0D, 0x03, 0x09, 0x17, 0x5D, 0xA0]) and u8('2F:A05D') == 0x09 and rom[O('e3d_walker_rest'):O('e3d_walker_rest') + 2] == bytes([0x16, 0x89]) and rom[O('e3d_attack4_rest'):O('e3d_attack4_rest') + 3] == bytes([0xD0, 0xD0, 0xDE]) and u8(O('e3d_attack4_rest') + 9) == 8"

