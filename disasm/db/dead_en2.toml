0), B steps it down ($FF wraps to 6): a picker of the card's world (card_world selects the card's text, palette and
music: lvcard_draw, lvcard_palette, lvcard_music), though nothing here redraws the card. Claim dead_en2.lvcard_pick
runs it in place of lvcard_pad."""

