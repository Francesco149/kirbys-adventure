unit = "dead_en2"
title = "Code and data no movie reaches in banks 2B-36: the later enemy banks, the bosses and the scenes"
summary = """
Code and data of banks 2B-36 (the middle of each bank; the bank ends are unit bank_ends') that no movie of the corpus
reaches, described from the bytes and, where a patch, a poke or a longer run can show it, checked by running it.
Everything here is named with never = true (or is a [[script]] the static pass decoded and no movie ran).

Cut or unreachable:
- A picker of the level cards' world, lvcard_pick_pad (34:ACD1): A / B step card_world through 0-6, Start ends the
  card; nothing calls it (lvcard_pad, beside it, is the one in use). Right after World 7's part table, 34:AB6F is a
  routine card_world = 7 that nothing names either.
- The mirrored halves of Kracko's lightning sweep (e3d_sweep_l_rest: e3d_sweep_r's bytes with every X velocity
  negated); finale_mode5 (kirby_start_mode 5: a type $4E object, song $0E, a fade in, then Kirby with the Star Rod).

Reached in the ninth batch and moved to unit cov9: Kracko's state 7 and its block breaker (this unit said nothing
stores 7 in the eye's variable 3: e3d_dash does, when the charge began with Kirby standing on a floor; cov9-b-kracko),
his chase of a floating Kirby, the long fight's e3d_pick1 / e3d_choose and attack 4 (the walker), World 7's card
played out to the last fight, the rest of World 4's card, THE END's second twinkles, King Dedede's swing 2 with its
hammer and the flight's hurt reaction.

Never seen, but reached in normal play: the falls of types $20 and $41 (e20_fall, e41_st_fall), type $17's entry 4
(e17_fall, which no caller asks for), type $3B's reactions for kirby_rect kinds 2 and 3; e3d_choose_0 (Kracko on the
left side when e3d_choose runs; its last instruction, the jsr e3d_choose_row at 2F:A9D3, is shared with
e3d_choose_1 and ran).

Left over: drawn mirrors of sprite groups next to the groups a pose table names (banks 30, 33, 35: the draw
routines mirror by obj_dir themselves), byte-for-byte copies of groups (30:9E94, 32:897A, 35:8D1B, 35:8DA7 with
eleven groups of two later regions, 35:9B27), two pose tables of bank 33 nothing names, extra entries after
tables (e46_claw_timers_more, story_star_pose_more, story_star_waits_more, e3d_pal_*_more), unused rts / halt /
ret bytes after jumps, and w7card_spare, a PPU record like help_rec but from $68C8.

Open:
- The block breaker's pose table 30:9F66 was not looked at.
- Whether lvcard_pick_pad and 34:AB6F were a debugging aid is not known; only what they compute is stated.
"""

