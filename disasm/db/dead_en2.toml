unit = "dead_en2"
title = "Code and data no movie reaches in banks 2B-36: the later enemy banks, the bosses and the scenes"
summary = """
Code and data of banks 2B-36 (the middle of each bank; the bank ends are unit bank_ends') that no movie of the corpus
reaches, described from the bytes and, where a patch, a poke or a longer run can show it, checked by running it.
Everything here is named with never = true (or is a [[script]] the static pass decoded and no movie ran).

Cut or unreachable:
- Kracko's state 7 (type $3D, the climb): e3d_states_b names e3d_st_to_point, but no instruction or script of bank
  2F stores 7 in variable 3. With it poked (claim dead_en2.e3d_point) the eye flies back to the point where Kirby
  was when its last charge began ($079E-$07A2, kept by e3d_charge_start), shakes (e3d_point_script) and creates a
  block breaker (entries 2-4 of e3d_start: e3d_blk_start, e3d_blk_left, e3d_blk_right) that erases the blocks at
  that point and every block of the same row left and right as long as there is one: the cloud floor under Kirby
  disappears (unused/dead_en2-kracko-floor.png). States 9 (e3d_st_after) and $0A (e3d_st_wait) belong to it.
- A picker of the level cards' world, lvcard_pick_pad (34:ACD1): A / B step card_world through 0-6, Start ends the
  card; nothing calls it (lvcard_pad, beside it, is the one in use). Right after World 7's part table, 34:AB6F is a
  routine card_world = 7 that nothing names either.
- A second set of the stars' twinkles at THE END (the_end_twinkle*, 2E:BA00-BA63) that would start after 10,200
  frames of the_end_sparkle; the mirrored halves of Kracko's lightning sweep (e3d_sweep_l_rest: e3d_sweep_r's
  bytes with every X velocity negated); finale_mode5 (kirby_start_mode 5: a type $4E object, song $0E, a fade in,
  then Kirby with the Star Rod).

Never seen, but reached in normal play:
- Kracko's own attack choice for a long fight, e3d_pick1 with e3d_choose and its table e3d_choices (by Kirby's place
  and whether he floats), and attack 4: e3d_walker, a small walker dropped from the cloud (at most two at a time,
  counted in $0789; claim dead_en2.e3d_attack4, unused/dead_en2-kracko-walker.png). The movies beat Kracko within its
  first attacks.
- Kracko's chase of a floating Kirby (state 3, e3d_st_chase): after 120 frames of floating during the climb the eye
  steers at him, and when he stops floating it calms down or charges (claim dead_en2.e3d_chase).
- The help screen WARP STAR STATION (help_warp_pack) is now in the corpus (cov8-warp-star) and documented in unit
  cov8.
- The scene before the last fight (World 7's card): about 900 bytes of scripts of bank 36 after the point where
  every movie pressed a button or ended (w7card_kirby_rest, w7card_dedede_rest, w7card_orb, w7card_part4 and their
  threads, w7card_palette and its five palettes; claim dead_en2.w7_scene runs it on to the last fight,
  unused/dead_en2-w7-orb.png). Likewise the rest of World 4's card (lvcard_w4_kirby_rest, claim dead_en2.lvcard_w4).
- Smaller unrecorded paths of the enemies of banks 2B-2D: King Dedede's swing 2 with a high leap (e47_swing_2,
  e47_big_jump) and its hammer (e63_swing_2_rest, e63_tick_swing2), a flight reaction (e47_flight_hurt), the
  falls of types $20 and $41 (e20_fall, e41_st_fall), type $17's entry 4 (e17_fall, which no caller asks for),
  type $3B's reactions for kirby_rect kinds 2 and 3.

Left over: drawn mirrors of sprite groups next to the groups a pose table names (banks 30, 33, 35: the draw
routines mirror by obj_dir themselves), byte-for-byte copies of groups (30:9E94, 32:897A, 35:8D1B, 35:8DA7 with
eleven groups of two later regions, 35:9B27), two pose tables of bank 33 nothing names, extra entries after
tables (e46_claw_timers_more, story_star_pose_more, story_star_waits_more, e3d_pal_*_more), unused rts / halt /
ret bytes after jumps, and w7card_spare, a PPU record like help_rec but from $68C8.

Open:
- What was to set Kracko's state 7 is not known (e3d_charge_start's variable 8, set when Kirby stood on a floor, is
  a candidate nothing confirms). The block breaker's pose table 30:9F66 was not looked at.
- What e3d_walker is (its pose table 30:8FB2 draws a small pink figure with the fight's CHR) is taken from the
  picture only. Whether lvcard_pick_pad and 34:AB6F were a debugging aid is not known; only what they compute is
  stated.
- e3d_choose takes Kirby's X and Y low bytes only (the arena is one screen).
"""

# ================================================================= bank 2F: the eye's climb (type $3D)

[[data]]
at = "2F:A05E"
len = 122
name = "e3d_point_script"
never = true
format = "bytes"
desc = """
Never read. Script bytes (the static pass cannot reach them: only the code e3d_st_to_point names them, through
obj_set_script) that the eye of type $3D runs when it has reached the point of state 7: on_tick e3d_tick_eye
(again), then a shake of the velocities -$0100 / +$0100 along Y and X for 2 and 4 frames each, a drift of -$00C0 /
+$0040 for 4 frames, asm_spawn of type $3D with variable 0 = 2 at its own place (e3d_blk_start: the block
breaker), six rounds of 1-frame jolts of $0200 and two of 2-frame jolts of $0100, a last jolt, 16 frames still,
variable 7 = $81 (the ring spins fast and faces Kirby, e3d_ring_tick), 8 frames, variable 7 = $80, state 9 and a jmp
to 2F:A05D (the halt of e3d_eye): from then on e3d_tick_eye alone, in e3d_st_after.
"""

[[data]]
at = "2F:A109"
len = 1
name = "e3d_spare_rts"
never = true
format = "bytes"
desc = "Never read. An rts ($60) between the jmp that ends e3d_tick_eye and e3d_eye_hit; nothing jumps to it."

[[sym]]
at = "2F:A234"
name = "e3d_st_wait"
never = true
desc = """
Never runs. State $0A of e3d_tick_eye (entry 10 of e3d_states_b; e3d_states_a gives the states 3 and up its
2F:A204): an rts. The eye does nothing of its own while e3d_point_script moves it (e3d_st_to_point sets this state
when it arrives), and e3d_eye_hit leaves it out of obj_keep_in_box."""

[[sym]]
at = "2F:A2F5"
name = "e3d_st_to_point"
never = true
desc = """
Never runs. State 7 of e3d_tick_eye (entry 7 of e3d_states_b; no instruction or script of the ROM stores 7 in
variable 3): the eye flies back to the point kept in $079E / $079F (X) and $07A1 / $07A2 (Y), where e3d_charge_start
put Kirby's world position when the last charge began. dir_to_point from the eye's world position to the point
(both with the high bytes + 1), rounded to one of eight directions ((d + $10) & $E0) into obj_dir, and obj_steer
with e3d_point_steer. When both distances are below 3 pixels: the position is set to the point, obj_vel_zero, state
$0A (e3d_st_wait) and the script becomes e3d_point_script (bank 2F). e3d_eye_hit skips obj_keep_in_box in this
state, so the eye may leave the screen to get there."""

[[data]]
at = "2F:A3C4"
len = 32
name = "e3d_point_steer"
never = true
format = "bytes"
desc = "Never read. obj_steer's four tables for e3d_st_to_point: steps $40 / $C0 (low) and $00 / $FF (high), limits $00 (low) and $02 / $FE (high) in turn: an acceleration of $0040 a frame up to $0200. The same 32 bytes as e3d_chase_steer."

[[sym]]
at = "2F:A3E4"
name = "e3d_st_after"
never = true
desc = """
Never runs. State 9 of e3d_tick_eye (entry 9 of e3d_states_b; e3d_point_script sets it at its end): e3d_kirby_test
(Kirby floating for long: state 3, e3d_st_chase); when variable 6 is not negative, variables 4 and 5 = 0 and state 0
(e3d_hover): the climb goes on."""

[[sym]]
at = "2F:A471"
name = "e3d_st_chase"
never = true
desc = """
Never runs. State 3 of e3d_tick_eye: the eye chases a floating Kirby. e3d_kirby_test sets it (variable 3 = 3, $0787
= 4, variable 7 = 1) when variable 6 is negative, which e3d_eye_hit makes it after kirby_action has been $0D
(floating, Kirby full of air) for $78 frames in a row, and Kirby still floats. While kirby_action is $0D: every 4
frames ($0787 counts down) the direction to Kirby (obj_aim_to, slot 1) rounded to eight directions into obj_dir, and
obj_steer with e3d_chase_steer ($0040 a frame up to $0200). When Kirby stops floating: with a random number of 8
below 5, velocity 0, variables 4, 5 and 6 = 0, variable 7 = $80 and state 0 (the climb goes on); otherwise (3 in 8)
at once a charge at him (2F:A201, e3d_charge_start). No movie floats that long during the climb (2F:A141 of
e3d_eye_hit, the counting, never ran)."""

[[data]]
at = "2F:A4BD"
len = 32
name = "e3d_chase_steer"
never = true
format = "bytes"
desc = "Never read. obj_steer's four tables for e3d_st_chase: the same 32 bytes as e3d_point_steer ($0040 a frame up to $0200)."

