Never runs. e3d_choose with $0786 = 0: the row of e3d_choices by where Kirby is: floating with Y below $61, row 0
(X below $50) or 8; otherwise $28 (X below $50), $18 (below $B0) or $20; then e3d_choose_row. (The floating case was
taken by e3d_choose before; this test repeats it.) Its last instruction, jsr e3d_choose_row at 2F:A9D3, is also the
end of e3d_choose_1's paths and ran there (cov9-b-kracko@62529); the entry 2F:A9AD never ran."""

