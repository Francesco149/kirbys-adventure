def e45_near(rd, s, d):
    t = rd[0x61EE + s]
    dx = e28_s16((e28_w(rd, 0x82 + s, 0x94 + s) - e28_w(rd, 0x6074 + t, 0x6086 + t)) & 0xFFFF)
