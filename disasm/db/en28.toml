name = "e45_next"
kind = "part"
desc = "Reached by jumps from the tick routines with Y = an action number 0-18: the script of the current object = entry Y of e45_actions_sun, or of e45_actions_moon when variable 6 has bit 7 set."
in = "Y = action number"

