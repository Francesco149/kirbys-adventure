at = "28:B843"
name = "e45_wait_set"
desc = "For the scripts of action 4: variable 2 = e45_waits[22:8B24 with $0F]: $78 frames with 30 hit points or more, $3C with fewer."

[[data]]
at = "28:B852"
len = 2
name = "e45_waits"
format = "bytes"
desc = "Frames on the ground before the next attack: $3C for a body below 30 hit points, $78 for an unhurt one."

[[sym]]
at = "28:B854"
name = "e45_choose"
desc = """
Draws a body's next ground attack 0-3, never the last one (bits 0-5 of variable 6), by the weights of one of the two
rows of e45_weights: a random number below (8 - the last attack's weight), then the attacks from 3 down, the last
one left out, until their weights add up to the number or more (so attack 3 is taken for the number 0 whatever its weight). The row is 1 when half the hit points are not
below the A the routine is entered with, else 0 (22:8B24): e45_tick_sun_ready enters with $2F, e45_tick_ground_moon
with the $22 the hit test left in A, and both get row 0. While $07A5 is not 0 (the other body's sky attack runs) an
even attack is drawn again, with A = 0 or 1 and so with row 1. Bits 0-5 of variable 6 = the attack.
"""
out = "A = the attack, 0-3"

[[data]]
