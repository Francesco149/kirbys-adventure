more after variable 2 = $2D and variable 3 = 1. Otherwise, when Kirby's Y on the screen is $10-$5F, e45_next with
action $0E (never happened).
"""

[[sym]]
at = "28:B30D"
name = "e45_tick_ground_sun"
desc = """
Tick routine of the sun on the ground (action 4). e45_hit; carry set: nothing more. e45_bob. Variable 2 - 1; at 0
e45_next with action 6 (it gets ready to attack). Otherwise obj_dir = $40 when obj_aim_at with Kirby is below $80,
else $C0, and when that changed it e45_next with action 5 (e45_sun_turn, unit en_more: only in the credits' demo fight).
"""

[[sym]]
at = "28:B355"
name = "e45_tick_sun_ready"
desc = "Tick routine of action 6. e45_hit; carry set: nothing more. e45_bob; when variable 3 is $2F (the bobbing is at its start) e45_choose and e45_next with the attack it returns."

[[sym]]
at = "28:B36E"
name = "e45_bob"
desc = "The sun's bobbing on the ground: variable 3 - 1, from 0 to $2F; the Y velocity by variable 3: $24-$2F -$C0, $18-$23 -$80, $0C-$17 +$C0, 0-$0B +$80 (e45_bob_from, e45_bob_vy)."
out = "X = the current object"

[[data]]
