"""

[[sym]]
at = "28:BB67"
name = "e45_midpoint"
desc = "The position and world position of the current object = the mean of the world positions of the objects in its variables 2 and 3 (16 bits, X and Y)."

[[sym]]
at = "28:BD34"
name = "e45_draw_plain"
desc = "Entered with X = the current object: its draw routine = sprites_draw (3E:DA89), undoing obj_flicker and the hurt shake's draw routine."
in = "X = object"

[[sym]]
at = "28:B048"
name = "e45_tick_none"
desc = "A single rts: the tick routine of a body that waits (e45_landed gives it after the first fall, until e45_begin)."

[[sym]]
at = "28:B146"
name = "e45_tick_settle"
