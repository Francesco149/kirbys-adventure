unit = "en28"
title = "Object types $25-$28, $45, $4C, $5C, $5F: the walking bomb, the candy thrower, the saucer, the hammer ape, the sun and the moon"
summary = """
The object types whose scripts are in bank 28. $25 (kind $40): a walking bomb that turns at walls, sways at an edge,
drops, and on landing stops every other object, bursts into a star burst ($0D), an effect and a shot of Kirby's kind
that hits other enemies, and flashes the screen for 24 frames. $26 (kind $49): a masked figure that leaps up at the
lower right of the screen, throws a sweet ($27) and drops away; $27 turns itself into an object of type 5 (a thing
Kirby picks up), flies off the top, falls back, bounces three times and lies there. $28 (kind $92): a saucer that
flies small circles and dashes between points of an oval around Kirby. $4C (kinds $B2, $B3; a mid-boss with the
enemy's bar): an ape-like fighter with a hammer whose hit box is the object $5F; a cycle of states picked by
e4c_pick (walk, jump or hop, run and swing or leap, throw), shock stars of type $64 from its blows. $45 (kind $D3; a
boss): an object without a picture that runs the fight and keeps the bar, with two bodies, a sun and a moon, one on
the ground with four attacks drawn by weights, the other in the sky with its own attack (the sun's beam of pieces
of type $5C, the moon's falling balls of type $5C), and the sky's colours turning with them; when one is defeated
the other comes down, when both are, they fly together and burst. $5C: the shots, beam pieces, sparks, balls and
flashes of the sun and the moon. The shared model en28_model holds every table as literals and the script test.

Open:
- $25: the wall turn and the first-edge path are rare; how 3E:DFE5 / 3E:DFFB stop the others is unit objects'.
- $28: the end of e28_laser (28:A984, back to e28_tick_pick) never ran: the one laser (cov6-j-x@345498) was the
  saucer's last act. The fourth dash (variable 5 = 4) ran in cov4-b-ufo (its point by obj_aim_at, 28:A9F9, 43837, and
  its end, 28:AA3F, 43849, one frame before that movie ends) and in cov6-j-x; the $6200 + X read of e28_tick_pick uses the
  X that 22:8A6C left (looks like a slip; not tested by poking).
- $26 / $27: the sweet's hit test never answered carry set while in the air.
- $4C: the state 8 (28:A58D), the hop's second jump, the end of e4c_defeat after the $AA frames, e5f_tick's freeing
  of a box without its fighter, the thrown object facing left (28:A287: 36 pixels left; read once in cov5-i-bonk,
  not checked). The throw's near answer (the bytes from 28:A504, cov4-b-bonk@72332) and e4c_thrown flying on until a
  wall (cov4-b-bonk@71766-71804) ran once each and are described in e4c_throw and e4c_thrown from that run only. The
  wall path of the run (28:A424: variable 9 = $0A) with the state 10 it starts (28:A4D2, e4c_wall_reel), e4c_thrown's
  landing (28:A2D1) and second flight (28:A2A4), and e4c_run_count's 0 made 1 (28:A6AC) ran in cov5-i-bonk: unit
  en_cov5. Which kind is in which room was not checked beyond the kinds' table; the obj_param 1
  fighter is main@90225 and main@111468.
- $5C: e5c_shot ran two frames only; the variant 2 (the moon's ground attack 0, 28:BDAD) ran once, in cov4-b-sun
  (unit en_cov4, e5c_moon_shot);
  the fifth entry of e5c_star_vx; the X high byte of e5c_star_place comes from the object, not from cam_x (right
  while they agree, as in every call seen).
- $45: the actions 10, 14 and 15 (sun), the $0787 path of e45_tick_settle, the wall paths of the attack routines,
  e45_tick_lunge's edge, the step down of e45_sky_settle, e45_tick_turn reaching 0. In cov5-g-sun (unit en_cov5) the
  bodies' attacks faced left and met the left edge: e45_hit's kind-1 path (28:B0F0), the edge paths of e45_tick_hop
  (28:B175), e45_tick_push (28:B2E0), e45_tick_rush (28:B434), e45_tick_moon_rush (28:B602, and its left-facing
  velocity 28:B635) and e45_tick_moon_arc (28:B660), the sun's action 16 (28:ADB1, 42517) and e45_beam_follow with the
  sun level with and right of Kirby.
  e45_begin's other order (the moon on the ground first, 28:BAE2-BB1C), the moon's action 0 (28:ADFC, with its tick
  routine 28:B5A2-B5F4, which this unit took for a code run that nothing reaches) and the sun's action 18 (28:AD12)
  ran once each, in cov4-b-sun (41747, 42732, 42817): unit en_cov4 (e45_moon_shoot, e45_tick_lunge,
  e45_sun_descend). The sun's action 5 (e45_sun_turn) and the moon's actions 14-16
  (e45_moon_chase, e45_moon_lurk, with 28:BA1B-BA69 as e45_chase_bounds) ran only in the second batch of movies (the
  credits' demo fight, cov2-save-finished@145441; the Cutter's fight, cov2-abilities-cutter@42685) and are documented
  in unit en_more. The names Mr. Shine and Mr. Bright, Bonkers, UFO and Bomber are by
  look and behaviour only.
- The bank-22 helpers used by address (22:859F / 22:85B0 effects, 22:8FC6 score, 22:9340 velocity pair, 22:9591
  dust puff, 22:944D X velocity 0, 22:8F1E far call into bank 2D, 3E:DED0 spawn, 3E:DE4B sound, 3E:DFDF random,
  3F:E26A / 3F:E23C velocity, 3F:E6E8 room_extra_done, 3F:E2B6 a script for Kirby) are other units'.
"""

