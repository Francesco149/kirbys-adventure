For e45_ctl when both bodies are defeated: each body gets the fight object's slot in its variable 2, its position
fractions cleared and a script (the sun e45_end_fly_sun, the moon e45_end_fly_moon: tick routine e45_tick_approach and a thread,
e45_end_steer, that aims it at the fight's object with speed $0100); e45_midpoint; $0788 = 0. The fight's object
then sits between them (e45_tick_gather calls e45_midpoint every frame) and the bodies fly to it; each one that is within
