def e45_rows(lo, hi):
    """Words from a table of low bytes and a table of high bytes."""
    return [l | h << 8 for l, h in zip(lo, hi)]

def e45_vel_ok(wr, s, vx, vyh, left):
    """The X velocity vx (negated when left) and the Y velocity with the high byte vyh and the low byte 0."""
    if left:
        vx = -vx & 0xFFFF
    return e28_w(wr, 0x60E0 + s, 0x60F2 + s) == vx and wr[0x6104 + s] == 0 and wr[0x6116 + s] == vyh

def e45_toward(rd, s):
    """0, 1 or 2: the body's X on the screen is below, equal to or above Kirby's, clamped to $11-$EF."""
    k = (rd[0x6075] - rd[0xDD]) & 0xFF
    k = 0x11 if k < 0x11 else (0xEF if k >= 0xEF else k)
    o = (rd[0x82 + s] - rd[0xDD]) & 0xFF
    return 0 if o < k else (1 if o == k else 2)

E45_NEXT_B = [0xADFC,0xAE2B, 0xAE54, 0xAEBD, 0xADD1, 0xADE7, 0x0000, 0xAE77, 0xAEA1, 0xAF1A, 0xAF20, 0xAF47, 0x0000, 0x0000, 0xAF5D, 0xAF67, 0xAF71, 0xAEDF, 0xAEFB]

def e28_script(wr, addr):
    """obj_set_script gave a thread the address addr in bank 28."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == 0x28 for t in range(32))

def e28_no_script(wr):
    """No thread got a script of bank 28 (the hit test may give Kirby one of his own)."""
    return not any(wr.get(0x63C0 + t) == 0x28 for t in range(32))

def e28_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def e28_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def e28_spawned(wr, typ):
    """The slots 9-17 in which the call created an object of this type."""
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]
'''

# ================================================================= type $25

[[script]]
at = "28:A7A2"
name = "e25_start"
desc = """
First script of object type $25: a black ball with a face and a fuse that walks (w12-opus@21930, on the hill at the
upper right), stops at an edge, drops and blows up; by what it does the game's Bomber. Kind $40 creates it with
variables 0 and 1 = 0. Bank 22, the position routine obj_pos_cull, the pose table 37:9342, obj_param_set, 1 hit
point (variable 0), variable 6 = 0 (it has not stood on a floor yet), tick routine e25_tick_walk, obj_face_kirby,
Y velocity 0, the X velocity $004D toward the side it faces (asm_vx), and from 28:A7C3 the walk: the pose of its
direction (0, or 1 facing left), then the poses 2 further, back, and 4 further, 20 frames each, for ever.
"""

[[script]]
at = "28:A7D5"
name = "e25_edge"
desc = """
Type $25 found no floor ahead (e25_tick_walk). Velocity 0. With variable 6 not 0 (it walked before): tick routine
e25_tick_wait and eleven times the pose 2 back and 2 further, 2 frames each: it sways at the edge. Then, and at
once with variable 6 = 0, from 28:A7E4: tick routine e25_tick_fall, and the poses 2 further and back for 4 frames
each, for ever, while it falls.
"""

[[script]]
at = "28:A7EE"
name = "e25_explode"
desc = """
Type $25 landed (e25_tick_fall): no tick routine, velocity 0, 3E:DFE5 (every other object stops: bit 7 of their
obj_tick_bank and of kirby_flags), the position routine obj_pos_camera, four times the pose 4 back and 4 further
for 2 frames each. Then the explosion: fx_create_rec with the record 0, 0, $0C, 0 (one of Kirby's effects, number
$0C, at its place), a new object of type $0D with variable 0 = $0B in a slot of 9-17 (unit en24c: the star burst
with a hit test of its own), shot_create_rec with 0, 0, 7, 0 (a shot of type 3, number 7, in a slot of 6-8: what
hits the other enemies), 3E:DFFB (the others go on), variable 2 = $18, the pose one back, tick routine
e25_tick_flash, and the thread waits until variable 2 is 0 and ends the object.
"""

