name = "e45_tick_descend"
desc = "Tick routine of the way down (action 18). e45_hit_sky, the Y on the screen kept at $11 or more (never needed), obj_gravity_ax with A = $15 and X = 6, obj_collide with the set in $078C; landed: sound $22 and e45_next with action 4."

[[sym]]
at = "28:B26E"
name = "e45_tick_sky"
desc = """
Tick routine of a body waiting in the sky (action 9). e45_alive (which may end the call), e45_hit_sky. Variable 2 -
