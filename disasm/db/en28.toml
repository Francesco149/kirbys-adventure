# ================================================================= type $45

[[script]]
at = "28:AAEE"
name = "e45_start"
desc = """
First script of object type $45: the boss of two round bodies, a sun and a crescent moon, of which one fights on
the ground while the other attacks from the sky (main@41740: the moon in the sky, the sun at the right on the
ground; w3-sonnet@84300: the sun in the sky sending a beam down; by what they are, the game's Mr. Shine and Mr.
Bright). chr_bank+1 = $A6, bank 22, the pose table 31:9218, the position routine obj_pos_camera, then by variable
0: 0 e45_ctl (what kind $D3 creates: an object without a picture that runs the fight), 1 e45_sun_start, 2
e45_moon_start, 3 e45_burst.
The fight's own bytes are obj_param of slots 0-8, which no enemy uses ($0784-$078C; e45_vars_clear zeroes them):
$0784 the side an arc flies to, $0785 the height on the screen at which a body stops in the sky, $0786 the X on the
screen the sun's beam goes to, $0788 the number of bodies defeated, $0789 the count of pieces of a sky attack,
$078B the frames a body on the ground still blinks after a hit, $078C the set of obj_pts for a body's landing.
$0796 is the step 0-6 of the sky's colours and $07A5 is not 0 while a sky attack runs; other bosses use these two
bytes as well. In a body: variable 0 = hit points ($1E), variable 5 = the frames of its hurt shake (set to $18 by
its record when it is damaged; $FF once it is defeated), variable 6 = bit 7 the moon, bit 6 in the sky, bits 0-1
its last ground attack; variables 2 and 3 are counters of the tick routine at work.
"""

[[script]]
at = "28:AB07"
name = "e45_ctl"
desc = """
The script of the fight (variable 0 = 0). e45_vars_clear; a new object of type $45 with variable 0 = 1 (the sun),
its slot kept in variable 2; one with variable 0 = 2 (the moon), its slot in variable 3; e45_pal_init. Unless
demo_number is not 0: twice variable 0 from 0 in ten steps of 3 with sound $12, 6 frames apart, and 30 frames (the
enemy's bar of the status bar, which hud_boss_slot points at this object, fills). Variable 0 = $1E, 50 frames,
e45_begin (the bodies get their first scripts), tick routine e45_ctl_tick, and the thread parks.
When both bodies are defeated e45_ctl_tick starts e45_ctl_end.
"""

[[script]]
at = "28:AB84"
name = "e45_burst"
desc = "Type $45 created with variable 0 = 3 by e45_dead, at a defeated body: fx_create_rec with 0, 0, $0C, 0, the script 22:83CC as a subroutine, a child of type $0D with variable 0 = 7 (22:8C71: the star burst of unit en24c), and the object ends."

[[script]]
at = "28:AB96"
name = "e45_sun_start"
desc = """
The sun (variable 0 = 1): 30 hit points (variable 0 = $1E), e45_place with $40 (a quarter into the screen, 64 pixels
below its top), tick routine e45_tick_drop_sun, and two poses of its direction 9 frames each for ever while it
falls to the floor.
From 28:ABAA the sun's scripts that e45_next starts, in address order: action 4 at 28:ABAA (on the ground:
velocity 0, obj_face_kirby, e45_wait_set, variable 3 = $30, one frame of e45_tick_settle, then tick routine
e45_tick_ground_sun and two poses 8 frames each for ever); action 5 at 28:ABCA (the turn, e45_sun_turn: only in the credits' demo fight, documented in unit en_more); action 6 at 28:ABDA
(tick routine e45_tick_sun_ready, the same poses); action 0 at 28:ABEA (it flashes 32 times, creates an object of
type $5C with variable 0 = 0, e5c_shot, with sound $3E, and is pushed back by e45_tick_push; ran once and was cut off);
action 1 at 28:AC21 (e45_arc_side, then an arc through the air by e45_tick_arc); action 2 at 28:AC5A with actions 7 at 28:AC89 and 8 at
28:ACA2 (a hop backward by e45_tick_hop, a roll across the screen at 4.5 pixels per frame by e45_tick_roll, a bounce back
by e45_tick_bounce); action 3 at 28:ACBE (a short rush by e45_tick_rush); action 17 at 28:ACE1 (it leaps into the sky: set_z $007F,
sound $17, e45_sky_setup, X velocity $0080, Y velocity -$600, tick routine e45_tick_rise); action 18 at 28:AD12
(e45_sun_descend: once, cov4-b-sun@42817, unit en_cov4); action 9 at 28:AD3B (in the sky: variable 2 = $2D, variable 3 = 1, $078A = $0B, tick routine
e45_tick_sky); action 11 at 28:AD63, 12 at 28:AD78 and 13 at 28:AD83 (the sun's sky attack: e45_seek_kirby and e45_tick_seek
bring it above Kirby, e45_tick_aim_wait waits 60 frames, then e45_tick_beam with variable 2 = 6 and variable 3 = $14); the
actions 14-16 from 28:AD94 never ran.
"""

[[script]]
at = "28:ADC0"
name = "e45_moon_start"
desc = """
The moon (variable 0 = 2): 30 hit points, e45_place with $C0 (three quarters into the screen), tick routine
e45_tick_drop_moon, the pose $2E of its direction, and the thread parks while it falls.
From 28:ADD1 the moon's scripts that e45_next starts: action 4 at 28:ADD1 (on the ground: as the sun's, then from
28:ADDE tick routine e45_tick_ground_moon and the pose $2E); action 5 at 28:ADE7 (it turns round: tick routine
e45_tick_turn, the pose $34 flipped twice 4 frames apart, back to 28:ADDE); action 0 at 28:ADFC (e45_moon_shoot: once,
cov4-b-sun@42732, unit en_cov4; an object of type $5C with variable 0 = 2); action 1 at 28:AE2B (e45_arc_side, then an arc by e45_tick_moon_arc); action 2 at 28:AE54 with 7
at 28:AE77 and 8 at 28:AEA1 (the hop, the roll and the bounce, with the sun's tick routines); action 3 at 28:AEBD
(a rush forward and back by e45_tick_moon_rush); action 17 at 28:AEDF (the leap into the sky, as the sun's); action 18 at
28:AEFB (it comes down: set_z $0081, $078C = 7, tick routine e45_tick_descend, $078B = 0, variable 5 = 0,
e45_sky_leave); action 9 at 28:AF1A (in the sky, tick routine e45_tick_sky); action 11 at 28:AF47 (the moon's sky
attack: $07A5 = 1, $0789 = 0, variable 2 = $3C, tick routine e45_tick_moon_blink, which blinks for 60 frames and then makes
e45_tick_stars the tick routine); the actions 14 at 28:AF5D (e45_moon_chase: it drifts at Kirby; the credits' demo
fight), 15 at 28:AF67 and 16 at 28:AF71 (e45_moon_lurk: it waits in the sky; the Cutter's fight,
cov2-abilities-cutter@42685), documented in unit en_more.
"""

[[script]]
at = "28:AF77"
name = "e45_dead"
desc = "The reaction of a body's record to its hit points being gone (and to kind 2 of kirby_rect): sound $2F, tick routine e45_tick_dead, a child of type $45 with variable 0 = 3 (22:8C71: e45_burst), and the thread parks. From 28:AF85 the single halt that e45_tick_dead and e45_alive give a body when the fight is over."

[[sym]]
at = "28:AF86"
name = "e45_ctl_tick"
desc = """
Tick routine of the fight's object. With $0788 = 2 (both bodies defeated): the script e45_ctl_end. Otherwise
its variable 0 = variable 0 of the body on the ground: the sun (the slot in variable 2), or the moon (variable 3)
when the sun's variable 6 has bit 6 set; the status bar shows that. Every eighth frame (obj_frame) $0796 takes a
step: down to 0 while the sun is in the sky, up to 6 while it is not, and e45_pal_show loads the colours of the
step: the sky turns to day under the sun and to night under the moon.
"""

[[sym]]
at = "28:AFFA"
name = "e45_pal_init"
desc = "For e45_ctl: $0796 = 3, then e45_pal_show."

[[sym]]
at = "28:AFFF"
name = "e45_pal_show"
kind = "part"
desc = "3F:E6D5 with Y = e45_pal[$0796] (bank 13's bg_palette with that number), then palette_show_bg."

[[data]]
at = "28:B00B"
len = 7
name = "e45_pal"
format = "bytes"
desc = "The numbers of the seven sets of background colours, by $0796: $92-$98, day to night."

[[sym]]
at = "28:B020"
name = "e45_tick_drop_sun"
desc = "Tick routine of the sun's first fall: obj_gravity, obj_collide0; landed: e45_landed."

[[sym]]
at = "28:B029"
name = "e45_tick_drop_moon"
desc = "Tick routine of the moon's first fall: obj_gravity, obj_collide with set 7 of obj_pts; landed: e45_landed."

[[sym]]
at = "28:B034"
name = "e45_landed"
kind = "part"
desc = "The end of the two first falls: Y velocity 0 and the tick routine becomes e45_tick_none (a single rts): the body waits for e45_begin."

[[sym]]
at = "28:B049"
name = "e45_hit"
desc = """
The hit test of a body on the ground; the moon's variable 6 has bit 7 set and picks the second record of each
pair. While $078B is not 0 (it was hit a moment ago): bit 7 of obj_sprite_bank flips every fourth frame (it
blinks), $078B - 1, and 3F:E31D with a record that nothing can damage (39:8924 / 39:893C: 12 x 12, flags $81 /
$80, no reactions), variables 0 and 1 kept; carry clear. Otherwise, with variable 5 = 0: 3F:E31D with the body's
real record (39:88F4 the sun, 39:890C the moon: 12 x 12, hurt byte 8, score entry $0B; hit points gone and kind 2:
the script e45_dead; damaged: variable 5 = $18; kind 1: variable 5 = $FF, after which (28:B0F0; once, cov5-g-sun@42885,
unit en_cov5) variable 5 = 0, kirby_knock_back and carry clear). Not hit: carry clear. Hit: sound $34;
variable 5 still 0: carry set. Variable 5 not 0, now or from an earlier frame, is the hurt shake: 22:8D21 at its
start, each frame 22:8DDC, a pose from e45_hurt_poses, variable 5 - 1 and carry set; when it reaches 0, 22:8D84,
$078B = $1E and carry clear.
"""
out = "carry set: the tick routine does nothing more this frame"
comments = { "B054" = "$078B: blinking after a hit", "B09C" = "the real record", "B0BA" = "the hurt shake, variable 5 frames", "B0E7" = "30 frames of blinking follow" }

[[data]]
at = "28:B0FA"
len = 8
name = "e45_hurt_poses"
format = "bytes"
desc = "For the hurt shake of e45_hit: six pose offsets by the Y that 22:8DDC leaves (0, 0, 2, 2, 0, 0), then the base pose of the sun ($18) and of the moon ($3E)."

[[sym]]
at = "28:B102"
name = "e45_hit_sky"
desc = "The hit test of a body in the sky: the draw routine sprites_draw, bit 7 of obj_sprite_bank clear, and 3F:E31D with the record nothing can damage (39:8924 the sun, 39:893C the moon), variables 0 and 1 kept. It can hurt Kirby and cannot be hurt."
out = "carry clear"

[[data]]
