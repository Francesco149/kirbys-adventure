name = "e45_bob_vy"
format = "rows:4"
desc = "For e45_bob: four lower bounds of variable 3 ($30, $24, $18, $0C; an entry is used while variable 3 is below it and not below the next), then the low and the high bytes of the Y velocity of each: $FF40, $FF80, $00C0, $0080."

[[sym]]
at = "28:B49B"
name = "e45_tick_beam"
desc = """
Tick routine of the sun's sky attack (action 13). e45_alive, e45_hit_sky, sound $35 every fourth frame. While
variable 3 is below $10, e45_beam_follow gives it an X velocity of $4C toward Kirby's X. Variable 2 - 1; at 0 variable 3 -
1; while that is not 0, variable 2 = 6 and a child of type $5C with variable 0 = 1 (obj_spawn_child_dir: e5c_beam,
a piece of the beam that falls from the sun). When variable 3 reaches 0: $07A5 = 0 and e45_next with action $0F,
or with 9 when variable 5 is negative (the sun is defeated and stays in the sky).
"""

[[sym]]
at = "28:B55B"
name = "e45_tick_ground_moon"
desc = "Tick routine of the moon on the ground (action 4). e45_hit; carry set: nothing more. Variable 2 - 1; at 0 e45_choose and e45_next with the attack. Otherwise obj_dir = $40 or $C0 toward Kirby, and when that changed it e45_next with action 5 (the turn)."

[[sym]]
at = "28:B6FE"
name = "e45_tick_stars"
desc = """
Tick routine of the moon's sky attack once e45_tick_moon_blink has blinked 60 frames (it sets variable 2 = $2D and variable 3 =
8 and falls in here). e45_alive, e45_hit_sky. Variable 2 - 1; at 0 variable 3 - 1; while that is not 0, variable 2
= $2D, $0789 + 1 and a child of type $5C with variable 0 = 3 (e5c_star, a star that falls). At 0 (never
happened): $07A5 = 0 and e45_next with action $0F or 9.
"""

[[sym]]
at = "28:B778"
name = "e45_tick_dead"
desc = """
Tick routine of e45_dead; it runs once. With $0788 = 0 (the first body defeated): $0788 = 1, variable 0 = 0,
variable 5 = $FF, and e45_next with action 17: the body leaps into the sky, where it stays and goes on with its sky
attacks. Otherwise $0788 + 1 and the script 28:AF85 (it stops; e45_ctl_tick ends the fight).
"""

[[sym]]
at = "28:B7A3"
name = "e45_alive"
desc = """
What the tick routines of a body in the sky begin with. $0788 = 0: returns. $0788 = 1: a body whose variable 5 is
negative (the defeated one) returns; the other one drops its caller's return address and goes to e45_next with
action 18: it comes down to fight alone. $0788 = 2 or more: the caller is dropped and the script is 28:AF85.
"""

[[sym]]
