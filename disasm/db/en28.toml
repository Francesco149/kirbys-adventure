text = "e45_hit, by the state at entry. $078B not 0: $078B - 1, the undamageable record of the body (39:8924, or 39:893C with bit 7 of variable 6), variables 0 and 1 as before, bit 7 of obj_sprite_bank flipped exactly when the low two bits of obj_frame are 0, carry clear. $078B = 0 and variable 5 = 0: the real record (39:88F4 / 39:890C); carry clear when the test did not change the body; otherwise snd_play, and either variable 5 is still 0 at the end... (the body got a script: carry set) or the hurt shake began. In a frame of the hurt shake (variable 5 not 0 at entry, or just set): 22:8DDC, variable 5 one less than it was (at entry, or than the $18 the record set), and carry set, except when it reaches 0: then $078B = $1E and carry clear."
kind = "call"
fn = "e45_hit"
on = ["main@41700+240", "w3-sonnet@81850+300", "w3-sonnet@83100+1800"]
min_calls = 1500
max_calls = 2400
use = ["en28_model"]
model = '''
def e45_hit_ok(rd, wr, ran, calls, rp, mem):
    s = rd[0x6E]
    moon = rd[0x6236 + s] >> 7
    cs = rp & 1
    if rd[0x78B]:
        if wr[0x78B] != rd[0x78B] - 1 or wr[0x27] != (0x24, 0x3C)[moon] or wr[0x28] != 0x89 or cs:
            return False
        if mem(0x61CA + s) != rd[0x61CA + s] or mem(0x61DC + s) != rd[0x61DC + s]:
            return False
        flip = rd[0x603D] & 3 == 0
        return ((0x62FC + s) in wr) == flip and (not flip or wr[0x62FC + s] == rd[0x62FC + s] ^ 0x80)
    v5 = rd[0x6224 + s]
    if v5 == 0:
        if wr[0x27] != (0xF4, 0x0C)[moon] or wr[0x28] != (0x88, 0x89)[moon]:
            return False
        if not ran("28:B0A9"):
            return not cs and (0x6224 + s) not in wr
        if "snd_play" not in calls:
            return False
        if not ran("28:B0B7"):
            return cs == 1
        v5 = 0x18
    elif 0x27 in wr:
        return False
    if not ran("22:8DDC") or wr[0x6224 + s] != v5 - 1:
        return False
    if v5 == 1:
        return wr[0x78B] == 0x1E and not cs
    return cs == 1 and 0x78B not in wr
'''
