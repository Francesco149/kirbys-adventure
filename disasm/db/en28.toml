len = 12
name = "e45_weights"
format = "bytes"
desc = "The low and high bytes of the addresses of two rows (28:B8AB, 28:B8AF), then the rows: the weights of the attacks 0-3, 3, 2, 3, 0 and 2, 1, 1, 4."

[[sym]]
at = "28:B8C7"
name = "e45_edge"
desc = "For the attacks that cross the screen: moving right with an X on the screen of $F0 or more the body's X becomes cam_x + $EF, moving left with one below $10 cam_x + $11, and carry is set; otherwise carry clear."
