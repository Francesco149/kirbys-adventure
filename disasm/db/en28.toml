[[sym]]
at = "28:B948"
name = "e45_sky_setup"
desc = "For the leap into the sky: $0785 = $10 + a random number below $30, obj_dir = $40 in the left half of the screen and $C0 in the right half, bit 6 of variable 6 set, $07A5 = 0."

[[sym]]
at = "28:B976"
name = "e45_sky_leave"
desc = "For the way down: bit 6 of variable 6 cleared; the high byte of the Y velocity = 1 when its Y on the screen is below $30 (the other entry of the pair at 28:B996, -3, was never used)."
out = "A = 0 or 1"

[[sym]]
at = "28:BA74"
name = "e45_place"
desc = "For the bodies' first scripts, A = an X on the screen: X position and world X = cam_x + A (added with the carry as the caller left it), Y = cam_y + $40, then obj_face_kirby."
in = "A = X on the screen (the thread's register)"

[[sym]]
at = "28:BAA0"
name = "e45_begin"
desc = """
For e45_ctl, the first move: a random number below 2. Not 0: $078C = 0; the sun (the slot in variable 2): variable 5
= 0, variable 6 = 3, script 28:ABAA (on the ground); the moon (variable 3): variable 5 = 0, variable 6 = $C3,
script 28:AEDF (the leap into the sky). 0 (once, cov4-b-sun@41747, where the moon stayed on the ground and the sun went up): the other way round, with
