[[claim]]
id = "hud.update.frames"
about = ["hud_update", "hud_reset"]
text = "hud_update starts at most twice in a frame of the windows and at least once in some frames; hud_reset starts in some frames, and only in frames in which room_load runs or ran in the 40 frames before, or hud_picture changed."
kind = "frames"
on = ["main@400+3000", "w12-opus@19650+2000"]
model = '''
last = [-100]
def near_load(frame, n):
    if n:
        last[0] = frame
    return frame - last[0] <= 40
'''
always = ["n('hud_update') <= 2", "(near_load(frame, n('room_load')) or r('hud_picture') != pr('hud_picture')) or n('hud_reset') == 0"]
sometimes = ["n('hud_update') == 1", "n('hud_reset') > 0"]
