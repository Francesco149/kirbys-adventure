[[claim]]
id = "hud.tables.static"
about = ["hud_world_names", "hud_boss_text", "hud_score_text", "hud_reset_recs", "hud_picture_rec", "hud_hub_hp_rec", "hud_bar_rec", "hud_score_rec", "hud_hp_rec", "hud_lives_recs", "hud_count_rec", "hud_layout_rec", "hud_card_rec", "hud_frame_0", "hud_frame_1", "hud_card_tiles"]
text = "With letters as tile $E6 + n and blanks as $81, hud_world_names reads VEGETABLE VALLEY, ICE CREAM ISLAND, BUTTER BUILDING, GRAPE GARDEN, YOGURT YARD, ORANGE OCEAN, RAINBOW RESORT (16 tiles each, the last five padded on both sides), hud_boss_text ENEMY and hud_score_text SCORE, each followed by tile $C4. The eleven seven-byte records are (mode, PPU address, length, count, source): hud_reset_recs (3, $2BE8, 24, 1, nt_attr + 104) and (3, $2B0C, 18, 1, $0100); hud_picture_rec (3, $2AE4, 25, 5, $74C8); hud_hub_hp_rec (3, $2B70, 6, 1, $0100); hud_bar_rec and hud_score_rec (3, $2B43, 14, 1, $0100); hud_hp_rec (3, $2AEA, 6, 3, $0100); hud_lives_recs (3, $2B3B / $2B5B / $2B7A, 2, 1, $0100); hud_count_rec (3, $2B1B, 2, 1, $0100); hud_layout_rec (3, $2AC0, 32, 8, $74C8). hud_card_rec is (1, $2AF3, 4, 5); hud_frame_0 and hud_frame_1 begin (0, $2AD7, 8, 7). Every low nibble of hud_card_tiles is 0, 5 or 10 and every high nibble 0, 1 or 2."
kind = "static"
model = '''
def txt(off, n):
    return "".join(" " if rom[off + i] == 0x81 else chr(65 + rom[off + i] - 0xE6) for i in range(n))

def rec(off):
    return (rom[off], rom[off + 1] | rom[off + 2] << 8, rom[off + 3], rom[off + 4], rom[off + 5] | rom[off + 6] << 8)

NAMES = ["VEGETABLE VALLEY", "ICE CREAM ISLAND", " BUTTER BUILDING", "  GRAPE GARDEN  ", "  YOGURT YARD   ", "  ORANGE OCEAN  ", " RAINBOW RESORT "]
'''
expect = "[txt(O('hud_world_names') + 16 * i, 16) for i in range(7)] == NAMES and txt(O('hud_boss_text'), 5) == 'ENEMY' and txt(O('hud_score_text'), 5) == 'SCORE' and rom[O('hud_boss_text') + 5] == rom[O('hud_score_text') + 5] == 0xC4 and [rec(O('hud_reset_recs')), rec(O('hud_reset_recs') + 7), rec(O('hud_picture_rec')), rec(O('hud_hub_hp_rec')), rec(O('hud_bar_rec')), rec(O('hud_score_rec')), rec(O('hud_hp_rec')), rec(O('hud_lives_recs')), rec(O('hud_lives_recs') + 7), rec(O('hud_lives_recs') + 14), rec(O('hud_count_rec')), rec(O('hud_layout_rec'))] == [(3, 0x2BE8, 24, 1, A('nt_attr') + 104), (3, 0x2B0C, 18, 1, 0x100), (3, 0x2AE4, 25, 5, 0x74C8), (3, 0x2B70, 6, 1, 0x100), (3, 0x2B43, 14, 1, 0x100), (3, 0x2B43, 14, 1, 0x100), (3, 0x2AEA, 6, 3, 0x100), (3, 0x2B3B, 2, 1, 0x100), (3, 0x2B5B, 2, 1, 0x100), (3, 0x2B7A, 2, 1, 0x100), (3, 0x2B1B, 2, 1, 0x100), (3, 0x2AC0, 32, 8, 0x74C8)] and rec(O('hud_card_rec') - 0)[:4] == (1, 0x2AF3, 4, 5) and rec(O('hud_frame_0'))[:4] == rec(O('hud_frame_1'))[:4] == (0, 0x2AD7, 8, 7) and all(rom[O('hud_card_tiles') + i] & 15 in (0, 5, 10) and rom[O('hud_card_tiles') + i] >> 4 in (0, 1, 2) for i in range(37))"

