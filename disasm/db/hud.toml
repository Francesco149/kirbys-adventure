def frame_ok(rd, wr, romrd, drew_lives, f0, f1):
    if rd[0x66EC]:
        return not drew_lives and f0 not in romrd and f1 not in romrd
    if rd.get(0x55F) == 0 and rd.get(0x55E, 255) < 7:
        return wr.get(0x59D) == 2 and f0 not in romrd and f1 not in romrd
    mode = wr.get(0x59D, rd.get(0x59D))
    if 0x66EA in wr:
        return wr[0x66EA] == mode != rd[0x66EA] and (0x66E7 in wr) and drew_lives and (f0 in romrd) == (mode == 0) and (f1 in romrd) == (mode != 0)
    return mode == rd[0x66EA] and f0 not in romrd and f1 not in romrd
'''
