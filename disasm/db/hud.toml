# ---------------------------------------------------------------- claims

[[model]]
name = "hud_tiles"
code = '''
def hud_bars(hp):
    return 0 if hp & 0x80 else 6 if hp >= 0x28 else (hp >> 3) + 1

def hud_expect(rd, romrd, f):
    """The buffer at $0100 and the hud_shown_* bytes after one hud_update, from the sections that ran (f)."""
    buf, w = {}, {}
    hub = rd.get(0x55F) == 0 and rd.get(0x55E, 0xFF) < 7
    hp = rd.get(0x597)
    if f["hubhp"]:
        n = hud_bars(hp)
        for i in range(6):
            buf[i] = 0x9C if i < n else 0x9D
        w[0x66E6] = hp
    if f["boss"]:
        v = rd[0x61CA + (rd[0x59A] & 0x7F)]
        if v & 0x80:
            v = 0
        if f["scale"]:
            v = ((v >> 2) + v) >> 1
        w[0x66E9] = v
        w[0x59B] = 0xF0
        h = (v + 1) >> 1
        for i in range(7):
            buf[7 + i] = 0x93 + min(max(h - 4 * i, 0), 4)
        buf[6] = 0x92 if h else 0x81
        for i in range(6):
            buf[i] = romrd[O("hud_boss_text") + i]
    if f["score"]:
        v = rd[0x593] | rd[0x594] << 8 | rd[0x595] << 16
        buf[6] = 0xDC + v // 1000000 if v >= 1000000 else 0x81
        for i in range(6):
            buf[7 + i] = 0xDC + v // 10 ** (5 - i) % 10
        buf[13] = 0xDC
        for i in range(6):
            buf[i] = romrd[O("hud_score_text") + i]
        w.update({0x66E3: rd[0x593], 0x66E4: rd[0x594], 0x66E5: rd[0x595]})
    if f["hp"]:
        n = hud_bars(hp)
        for i in range(6):
            buf[i], buf[6 + i], buf[12 + i] = (0x1A, 0x1B, 0x1C) if i < n else (0x81, 0x98, 0x81)
        w[0x66E6] = hp
    if f["card"]:
        card = 0 if rd[0x5A1] == 1 else rd[0x5A0]
        if card:
            num = card + 0x19 & 0xFF
        elif rd[0x5FB] & 0x40:
            num = 0x23
        else:
            num = rd[0x5E3] if rd[0x5E3] < 0x1A else 0xFF
        t = romrd[O("hud_card_tiles") + (num + 1 & 0xFF)]
        for i in range(5):
            buf[i] = romrd[O("hud_card_rec") + i]
        for c in range(5):
            for r in range(4):
                buf[5 + 5 * r + c] = 0x40 + 0x10 * r + (t + c & 15)
        if hub:
            buf[1] = buf[1] - 0x10 & 0xFF
        w[0x66EB] = num
        w[0x4E] = romrd[O("hud_card_bank") + (num + 1 & 0xFF)]
    if f["lives"]:
        buf[0], buf[1] = 0xDC + rd[0x599] // 10, 0xDC + rd[0x599] % 10
        w[0x66E8] = rd[0x599]
    if f["count"]:
        buf[0], buf[1] = 0xDC + rd[0x598] // 10, 0xDC + rd[0x598] % 10
        w[0x66E7] = rd[0x598]
    return buf, w

def hud_ok(rd, wr, romrd, f):
    buf, w = hud_expect(rd, romrd, f)
    return all(wr.get(0x100 + i) == buf.get(i) for i in range(25)) and all(wr.get(a) == v for a, v in w.items())
'''

