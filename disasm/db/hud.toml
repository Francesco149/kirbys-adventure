unit = "hud"
title = "The status bar: health, the enemy's bar, score, the ability card, lives"
summary = """The eight rows of tiles below the split (unit video: irq_hud) are the status bar. hud_reset draws its
frame when a room is loaded: it forgets everything that is shown (the hud_shown_* bytes become $FF), expands one of
two layouts (hud_layout for stages, hud_layout_hub with the world's name for rooms 0-6, or the first picture of
packed_13_lo when hud_picture is set) to $74C8 and sends the 32 x 8 tiles with a ppu_record. hud_update runs once per
frame from scroll_update. Each of its sections compares a value of the game with the copy of what is shown and, when
they differ, builds tiles in the buffer at $0100 and sends them with a ppu_record of its own: in a hub hp as six tiles
(hud_main); otherwise the enemy's bar when hud_boss_slot names an object (hud_boss: variable 0 of that object, seven
cells of four steps, two points a step) or else the score as seven decimal digits and a fixed 0 (hud_score), then hp
as six bars of three tiles (hud_hp); then the ability card, 5 x 4 tiles whose CHR bank and tile column come from two
tables by kirby_ability, or by hud_card while hud_card_time runs (hud_ability); then lives as two digits (hud_lives)
and, in mode 1, the count at $0598 (hud_count). A bar is hp / 8 + 1 tiles, 6 from hp = $28 on, none for a negative hp.

Open: the paths with $F4 = 1 (game_mode, the Extra Game: three of the six bars blanked) first ran in cov5-f-extra
(claims cov5_tour.extra.hud_hp / hud_main); the paths with $059E set (a sound and $059F in hud_boss), a score
below the value at $0590-$0592 (which is then lowered to it), lives of 99 and more
never ran; kirby_flags bit 6 (card $23, HYPER) first ran in cov7-l-candy (claim cov7.candy.card). hud_update with hud_picture set (the pictures of packed_13_lo, CHR $DA/$DB or $FE/$FF) ran in the attract
movie only, with pictures below $20. hud_boss's order of tests is described from the code; the claim covers the tiles
it draws, the scaling for type $47 and hud_shown_boss, not when it decides to draw. What hud_mode 1 is for ($0598 is
written by 14:A0D5, 14:A715, 18:B45B and others) and what the cards $1A and up show is not known. hud_off ($66EC) is
set by 18:B3ED and scripts. The buffer at $0100 is shared with the palette code (unit video) and others, so it has no
name here."""

[[sym]]
at = "13:ADCB"
name = "hud_reset"
desc = """Draws the status bar from nothing. hud_boss_off; every hud_shown_* byte = $FF (hud_shown_ability = $80); hud_mode,
hud_card and hud_card_time = 1, so that the card is drawn again; the 24 bytes of nt_attr from +104 = $FF, sent with
the first record of hud_reset_recs. Then the layout: with hud_picture set, the first stream of packed_13_lo / _hi and
hud_picture_shown = 1; in a stage hud_layout; in rooms 0-6 hud_layout_hub, plus a second record with the world's
number ($DD + room, $D8) and its 16-tile name from hud_world_names. hud_unpack expands the stream and sends it.
hud_chr + 2 / + 3 = $3E / $3F, or $3A / $3F in a hub. Ends by jumping to hud_update, which then draws every section."""

[[sym]]
at = "13:AF9B"
name = "hud_update"
desc = """The status bar's frame step, called by scroll_update. hud_picture = 0: on to hud_main (or hud_reset, when a
picture was shown: never ran). hud_picture set and equal to hud_picture_shown: nothing. Otherwise, when it is 1 or
nothing was shown, hud_reset; else hud_picture_shown = hud_picture, hud_chr = $DA / $DB (pictures below $20) and the
picture's stream, entry hud_picture - 1 of packed_13_lo / _hi, is expanded to $74C8 and sent by hud_picture_rec."""

[[sym]]
at = "13:AFE8"
kind = "part"
name = "hud_main"
desc = "hud_update for hud_picture = 0. Maps bank 12 with bank8_push; nothing more when split_mode is 0 or 4 (never ran). In rooms 0-6: when hp is not hud_shown_hp, six tiles ($9C for each of the hp bars, then $9D) go to $2B70 and hud_shown_hp = hp; on to hud_ability. Other rooms: hud_boss."

[[sym]]
at = "13:B05C"
kind = "part"
name = "hud_boss"
desc = """The enemy's bar, or the score. hud_boss_slot = $FF: hud_score. When the object in that slot (bits 0-6) is not of type
hud_boss_type any more: hud_boss_off, then hud_score. Otherwise the value is the object's variable 0 ($61CA + slot; negative
counts as 0). With bit 7 of hud_boss_slot clear the bar is drawn when the value is below hud_shown_boss or when hp changed,
and while hud_boss_time runs it is left alone; when the time runs out the score comes back (or, with extra_state 1 or
3, the bar stays). With bit 7 set (or from there) the value is scaled to 5/8 for type $47 and drawn when it differs from
hud_shown_boss. Drawing: hud_boss_time = $F0, hud_shown_boss = the value, then with h = (value + 1) / 2: seven cells
$93 + min(h - 4 * i, 4) at $0107, $92 before them ($81 when h is 0), the six tiles of hud_boss_text in front, 14 tiles
to $2B43. Continues at hud_hp."""

[[sym]]
at = "13:B139"
kind = "part"
name = "hud_score"
desc = "When score differs from hud_shown_score: seven decimal digits of the 24-bit score (tiles $DC-$E5; the millions digit blank when 0) at $0106-$010C, a fixed $DC (the score is kept in tens) after them and the six tiles of hud_score_text in front, 14 tiles to $2B43. Continues at hud_hp."

[[sym]]
at = "13:B203"
kind = "part"
name = "hud_hp"
desc = "When hp differs from hud_shown_hp: six columns of three tiles at $0100, $0106, $010C, ($1A, $1B, $1C) for each bar that hp has and ($81, $98, $81) for the others, 6 x 3 tiles to $2AEA. Continues at hud_ability."

[[sym]]
at = "13:B27F"
kind = "part"
name = "hud_ability"
desc = """The card. hud_card_time counts down and clears hud_card at 0. The card number is hud_card + $19 when hud_card is
set, else $23 with bit 6 of kirby_flags, else kirby_ability ($FF when it is $1A or more). When it differs from
hud_shown_ability: hud_chr + 1 = hud_card_bank[number + 1], and with t = hud_card_tiles[number + 1], 5 x 4 tiles go to
$2AF3 ($2AE3 in a hub): row r, column c is $40 + $10 * r + ((t + c) & 15). A nonzero high nibble of t also sets
hud_mode to it - 1. Continues at hud_frame."""

[[sym]]
at = "13:B362"
kind = "part"
name = "hud_frame"
desc = "Returns when hud_off is set. In rooms 0-6 hud_mode = 2. Otherwise, when hud_mode differs from hud_shown_mode: hud_shown_lives and hud_shown_count = $FF and the 8 x 7 tiles of hud_frame_0 (mode 0) or hud_frame_1 go to $2AD7. Continues at hud_lives."

[[sym]]
at = "13:B41E"
kind = "part"
name = "hud_lives"
desc = "When lives (at most 99) differs from hud_shown_lives: its two decimal digits go to $2B3B, $2B5B or $2B7A for hud_mode 0, 1, 2. In mode 0 and 2 that is the end; mode 1 continues at hud_count."

[[sym]]
at = "13:B475"
kind = "part"
name = "hud_count"
desc = "In hud_mode 1, when the count at $0598 differs from hud_shown_count: its two decimal digits go to $2B1B."

[[sym]]
at = "13:B4A6"
name = "hud_digit8"
desc = "Divides $00 by X by repeated subtraction: A = tile $DC + quotient, $00 = remainder."
in = "$00 = value, X = divisor"
out = "A = $DC + value / X; $00 = value mod X; $01 = X"

[[sym]]
at = "13:B4BD"
name = "hud_digit16"
desc = "The same for the 16 bits at $00/$01 and the divisor X:Y (high:low)."
in = "$00/$01 = value, X:Y = divisor"
out = "A = $DC + value / divisor; $00/$01 = value mod divisor"

[[sym]]
at = "13:B4DB"
name = "hud_digit24"
desc = "The same for the 24 bits at $00-$02 and the divisor A:X:Y (high:middle:low)."
in = "$00-$02 = value, A:X:Y = divisor"
out = "A = $DC + value / divisor; $00-$02 = value mod divisor"

[[sym]]
at = "13:B505"
name = "hud_boss_off"
desc = "hud_boss_slot = $FF: no enemy's bar; then hud_score_redraw."

[[sym]]
at = "13:B50A"
name = "hud_score_redraw"
desc = "hud_shown_score = $FFFFFF, so that hud_score draws the score again."

[[sym]]
at = "13:B516"
name = "hud_unpack"
desc = "Expands the stream at X:A to $74C8 (unpack) and sends 32 x 8 tiles from there to $2AC0 (hud_layout_rec)."
in = "A = low byte, X = high byte of the stream's address"

