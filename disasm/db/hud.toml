about = ["hud_reset", "hud_unpack", "hud_boss_off", "hud_score_redraw", "hud_reset_recs", "hud_layout_rec", "hud_hub_hp_rec", "hud_bar_rec", "hud_score_rec", "hud_hp_rec", "hud_lives_recs"]
text = "Every call of hud_reset in the windows calls hud_boss_off first, expands hud_layout_hub in rooms 0-6 (with hud_chr + 2 / + 3 = $3A / $3F), hud_layout elsewhere and the first stream of packed_13_lo when hud_picture is set (both $3E / $3F), sets the 24 bytes of nt_attr + 104 to $FF and hud_picture_shown to 0 or 1, and, unless a picture is shown, redraws in the same call the card, hp (bars or the hub's tiles) and, with hud_off clear, lives. The windows hold stages, hubs and a picture."
kind = "call"
fn = "hud_reset"
on = ["main@240+3000", "w12-opus@19650+3000", "attract@1000+6400", "w3-sonnet@350+3000"]
min_calls = 15
max_calls = 100
expect = "calls[0] == 'hud_boss_off' and 'unpack' in calls and all(wr[0x6755 + i] == 0xFF for i in range(24)) and ((O('packed_13_lo') in romrd and (wr[0x4F], wr[0x50], wr[0x58B]) == (0x3E, 0x3F, 1)) if rd[0x58A] else ((wr[0x58B] == 0 and ran('13:B2B0') == 1 and (ran('13:B42F') == 1 or rd[0x66EC] != 0)) and ((O('hud_layout_hub') in romrd and (wr[0x4F], wr[0x50]) == (0x3A, 0x3F) and ran('13:B013') == 1) if rd[0x55F] == 0 and rd[0x55E] < 7 else (O('hud_layout') in romrd and (wr[0x4F], wr[0x50]) == (0x3E, 0x3F) and ran('13:B20B') == 1))))"
cases = { "rd[0x58A] != 0" = 1, "rd[0x58A] == 0 and rd[0x55F] == 0 and rd[0x55E] < 7" = 3, "O('hud_layout') in romrd" = 10 }

