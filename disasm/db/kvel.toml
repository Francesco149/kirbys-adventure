[[claim]]
id = "kvel.pad.up_door.cases"
about = ["pad_up_door"]
text = "The windows hold 100 calls of pad_up_door with Up held; each calls obj_point first."
kind = "call"
fn = "pad_up_door"
on = ["main@400+1000", "main@64600+1000", "w12-sonnet@3000+1000", "w12-opus@4000+1000", "attract@1100+2500", "w1-v2-opus@700+1500"]
where = "rd[0xE6] & 8"
min_calls = 100
max_calls = 6000
expect = "calls[:1] == ['obj_point']"

[[claim]]
id = "kvel.pad.up_door"
about = ["pad_up_door"]
text = "Every call of pad_up_door with Up not held (bit 3 of pad1_held_copy clear) returns carry clear without a call; with Up held its first call is obj_point (door_find is reached by a jump and is not counted as a call)."
kind = "call"
fn = "pad_up_door"
on = ["main@400+1000", "main@64600+1000", "w12-sonnet@3000+1000", "w12-opus@4000+1000", "attract@1100+2500", "w1-v2-opus@700+1500"]
min_calls = 3000
max_calls = 6000
expect = "(calls[:1] == ['obj_point']) if rd[0xE6] & 8 else (rp & 1 == 0 and calls == [])"
