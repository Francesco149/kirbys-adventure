# ------------------------------------------------------------------ the model

[[model]]
name = "kirby_velocity"
code = '''
def s16(v):
    return v - 0x10000 if v & 0x8000 else v

def w16(d, lo):
    return d[lo] | d[lo + 1] << 8

def faced(v, facing):
    return -v & 0xFFFF if facing & 0x80 else v

def speed_step(acc, y, sp, romrd):
    add = romrd[O('speed_acc') + y]
    dec = romrd[O('speed_dec') + y]
    top = romrd[O('speed_top_lo') + y] | romrd[O('speed_top_hi') + y] << 8
    if acc:
        if sp & 0x8000 or sp <= top:
            s = sp + add & 0xFFFF
            return top if not s & 0x8000 and s > top else s
        if romrd[O('speed_keep') + y]:
            return sp
    if not sp & 0x8000:
        return max(sp - dec, 0)
    s = sp + dec
    return 0 if s > 0xFFFF else s

def speed_path(acc, y, sp, romrd):
    add = romrd[O('speed_acc') + y]
    dec = romrd[O('speed_dec') + y]
    top = romrd[O('speed_top_lo') + y] | romrd[O('speed_top_hi') + y] << 8
    if acc:
        if sp & 0x8000:
            return 'acc_negative'
        if sp <= top:
            return 'acc_top' if sp + add > top else 'acc'
        if romrd[O('speed_keep') + y]:
            return 'keep'
        return 'over_brake'
    if not sp & 0x8000:
        return 'brake' if sp - dec >= 0 else 'brake_zero'
    return 'back_brake' if sp + dec <= 0xFFFF else 'back_zero'

def slope_of(kind, facing):
    left = bool(facing & 0x80)
    if kind in (3, 5):
        return (kind - 2) + (1 if left else 0)
    if kind in (4, 6):
        return (kind - 3) + (0 if left else 1)
    return 0

def gravity(vy, y, romrd):
    acc = romrd[O('grav_acc_lo') + y] | romrd[O('grav_acc_hi') + y] << 8
    v = vy + acc & 0xFFFF
    if (v ^ acc) & 0x8000:
        return v
    lim = romrd[O('grav_limit_lo') + y] | romrd[O('grav_limit_hi') + y] << 8
    if acc & 0x8000:
        return lim if v < lim else v
    return lim if v >= lim else v

def operand(rd, romrd):
    o = min(romrd)
    if sorted(romrd) != [o, o + 1] or (o ^ (w16(rd, 0x1E) + 1)) & 0x1FFF:
        return None
    return romrd[o] | romrd[o + 1] << 8
'''

