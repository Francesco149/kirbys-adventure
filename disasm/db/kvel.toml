about = ["kirby_vx_from_speed", "kirby_vx", "kirby_speed", "kirby_facing"]
text = "Every call of kirby_vx_from_speed writes kirby_vx = kirby_speed when bit 7 of kirby_facing is clear and -kirby_speed when it is set, and nothing else outside the stack page."
