unit = "kvel"
title = "How Kirby's velocities are made: speed along his facing, gravity, the slope table"
summary = """The routines of bank 21 that Kirby's state code (banks 14-19) calls to make his velocities, before kirby_step
(unit kmove) moves him. Kirby keeps a 16-bit speed along the direction he faces (kirby_speed, 1/256 pixel per
frame; negative = he moves backwards) and a signed X velocity (kirby_vx); kirby_facing (variable 1 of object slot 1)
has bit 7 set when he faces left, and kirby_face_pad sets it from Left / Right. kirby_vx_from_speed makes kirby_vx
from kirby_speed (negated when he faces left), kirby_speed_from_vx does the reverse, and kirby_vx_apply copies
kirby_vx to his object's X velocity: unchanged, except on a floor of kind 5 (the 45-degree floor that rises to the
right), where the velocity is looked up in slope_vx_lo / slope_vx_hi by bits 4-11 of kirby_vx; the tables hold
16 * n / sqrt(2), rounded, for the signed index n. Floors of kind 3, 4 and 6 get the velocity unchanged.
kirby_step_from_speed is the two in a row and then falls into kirby_step (unit kmove): it is the entry through
which nearly all runs of kirby_step in the corpus come, called from 115 routines of the state code.

kirby_speed_step (A = accelerate or brake, Y = a profile number 0-36) changes kirby_speed by one frame's worth with
five per-profile tables: accelerating adds speed_acc and stops at the top speed (speed_top_lo / hi); a speed already
above the top is left alone when speed_keep is nonzero and braked otherwise; braking moves the speed toward 0 by
speed_dec and stops at 0. Its callers in this bank pick the profile: kirby_ground_speed_0 and kirby_ground_speed_5
(profiles 0-4 and 5-9: slope_profile adds 0 on flat ground, 1 / 3 when he faces up a gentle / steep floor, 2 / 4
when he faces down one; A = the direction button of his facing is held), kirby_ground_brake (profile 11),
kirby_speed_pad_10 / _12 / _19 (A = Left or Right held), kirby_brake (profile 10, or 19 when kirby_in_water is
nonzero). The three ground routines add a second base when floor_flag is 1 (profiles 26-30, 31-35, 36: the same top
speeds, three quarters of the acceleration, a deceleration of 4 instead of 14).

kirby_gravity (Y = a profile number 0-16) adds a per-profile signed acceleration to kirby_vy and stops it at a
per-profile limit on the side the acceleration points to; the limit applies only while the velocity has the
acceleration's sign. kirby_vy_set, kirby_vy_script and kirby_speed_script store given values (the two script
routines take a 16-bit operand from the script). Small tests the same state code uses: kirby_speed_above,
facing_index, floor_kind_index, and the pad tests pad_a_new, pad_b_new, pad_up_held, pad_down_held, pad_up_door.

Profiles of kirby_speed_step as the tables and callers show them (acceleration / deceleration / top speed in
1/256 pixel per frame): 0-4 ground, by slope: 32/14/332 flat, 16/14/208 up gentle, 32/14/400 down gentle, 8/14/160
up steep, 32/14/480 down steep; 5-9 the second ground set: 32/14/460, 16/14/352, 32/14/608, 8/14/320, 32/14/704;
10: 22/14/332 with speed_keep (a higher speed is kept); 11: 0/48/0 (only braking); 12: 22/9/192; 13: 64/14/512 with
speed_keep; 14: 11/5/153; 19: 8/9/268 (also the brake in water); 20: 0/14/1024. Which of Kirby's states use which
profile is in banks 14-18 and not in this unit.

Open: floor_flag was 0 on every call of the three ground routines, so profiles 26-36 were never read (their bytes
are described from the tables only, and that floor_flag 1 means a slippery floor is not claimed). Profiles 15-18 and
21-25 of kirby_speed_step and profile 16 of kirby_gravity were never read. What the profile numbers of kirby_gravity
mean (which state uses which) is not claimed. The second entry at 21:8AFC (carry set when B is not held; 54 runs,
attract only) and 21:8C39 (carry set when Kirby stands at a side limit and moves toward it: carry clear on all 1,086
calls, the left-moving half never ran) are not described. Why only kind 5 of the four sloped floors scales the
velocity is not known. The other writers of kirby_vx, kirby_speed and kirby_vy (listed in the xref claims) and
21:9BF7, 21:8A23, 21:8A6C, 21:8C16 (readers of kirby_speed) are not in the unit; nor are 21:8FCC (bit 0 of
Kirby's pose from kirby_facing) and the other writers of kirby_facing."""

# ------------------------------------------------------------------ routines

[[sym]]
at = "21:856F"
name = "kirby_vx_from_speed"
desc = "kirby_vx = kirby_speed when bit 7 of kirby_facing is clear, and -kirby_speed (16-bit two's complement) when it is set."

[[sym]]
at = "21:8112"
name = "kirby_speed_from_vx"
desc = "kirby_speed = kirby_vx when bit 7 of kirby_facing is clear, and -kirby_vx when it is set."

[[sym]]
at = "21:813A"
name = "kirby_vx_apply"
desc = "Sets the X velocity of slot 1 from kirby_vx. With floor_kind other than 5 it is a copy. With floor_kind 5 the velocity is entry (kirby_vx >> 4) & $FF of slope_vx_lo / slope_vx_hi; $10 is scratch."

[[sym]]
at = "21:95CD"
name = "kirby_step_from_speed"
desc = "The end of a state's frame: kirby_vx_from_speed, kirby_vx_apply, then it falls into kirby_step (unit kmove). kirby_speed and kirby_facing become kirby_vx and the X velocity of slot 1, and Kirby is moved."

[[sym]]
at = "21:8597"
name = "kirby_speed_step"
desc = """One frame of acceleration or braking of kirby_speed with profile Y. $02 = speed_acc[Y], $03 = speed_dec[Y], $00/$01 = the top speed (speed_top_lo / hi [Y]). With A nonzero: a speed that is negative or not above the top gets the acceleration added (16-bit) and, when the sum is not negative and above the top, becomes the top; a speed above the top is left unchanged when speed_keep[Y] is nonzero and braked when it is 0. Braking (A = 0, or the case just named): a speed that is not negative loses the deceleration and becomes 0 when that passes below 0; a negative speed gains the deceleration and becomes 0 when that carries out of bit 15."""
in = "A = 0 brake, nonzero accelerate; Y = profile"

[[sym]]
at = "21:8710"
name = "kirby_speed_script"
desc = "Called from a script with a 16-bit operand: kirby_speed = the two bytes after the script's current byte (script_ptr + 1, + 2), script_ptr advances by 2, then it jumps to kirby_vx_from_speed."

[[sym]]
at = "21:872A"
name = "kirby_brake"
desc = "kirby_speed_from_vx, then kirby_speed_step with A = 0 (brake) and profile brake_profile[0] (10), or brake_profile[1] (19) when kirby_in_water is nonzero."

[[sym]]
at = "21:873E"
name = "kirby_speed_pad_10"
desc = "kirby_speed_step with profile 10; A = 1 when Left or Right is held (pad1_held_copy & 3), else 0."

[[sym]]
at = "21:874B"
name = "kirby_speed_pad_19"
desc = "kirby_speed_step with profile 19; A = 1 when Left or Right is held, else 0."

[[sym]]
at = "21:8758"
name = "kirby_speed_pad_12"
desc = "kirby_speed_step with profile 12; A = 1 when Left or Right is held, else 0."

[[sym]]
at = "21:8765"
name = "kirby_ground_speed_0"
desc = "kirby_speed_from_vx, then kirby_speed_step with profile slope_profile + ground_base_0[floor_flag] and A = pad1_held_copy & facing_pad[facing_index]: nonzero when the direction button of the side he faces is held."

[[sym]]
at = "21:8781"
name = "kirby_ground_speed_5"
desc = "The same as kirby_ground_speed_0 with ground_base_5: profile slope_profile + ground_base_5[floor_flag]."

[[sym]]
at = "21:879D"
name = "kirby_ground_brake"
desc = "kirby_speed_from_vx, then kirby_speed_step with A = 0 (brake) and profile ground_brake_profile[floor_flag]."

[[sym]]
at = "21:86E2"
name = "kirby_speed_above"
desc = "Carry set when kirby_speed is not negative and greater than Y:A; carry clear when it is negative, equal or smaller. $10 and $12 are scratch."
in = "A = low byte, Y = high byte of the speed to compare with"
out = "carry"

[[sym]]
at = "21:87BA"
name = "kirby_gravity"
desc = "Adds the 16-bit acceleration of profile Y (grav_acc_lo / hi) to kirby_vy. With an acceleration that is not negative (downward): when the sum is not negative and at or above the limit (grav_limit_lo / hi), kirby_vy becomes the limit. With a negative acceleration: when the sum is negative and below the limit (as unsigned numbers), kirby_vy becomes the limit."
in = "Y = profile"

[[sym]]
at = "21:8846"
name = "kirby_vy_set"
desc = "kirby_vy = X:A."
in = "A = low byte, X = high byte"

[[sym]]
at = "21:885C"
name = "kirby_vy_script"
desc = "Called from a script with a 16-bit operand: kirby_vy = the two bytes after the script's current byte, script_ptr advances by 2."

[[sym]]
at = "21:9899"
name = "slope_profile"
desc = "Y = the slope part of a ground profile, from floor_kind and kirby_facing: 0 when floor_kind is not 3-6; on kinds 3 and 5 (floors that rise to the right) 1 and 3 facing right, 2 and 4 facing left; on kinds 4 and 6 (floors that rise to the left) 1 and 3 facing left, 2 and 4 facing right. So 1 / 3 = he faces up the gentle / steep floor, 2 / 4 = down it."
out = "Y = 0-4"

[[sym]]
at = "21:98C3"
name = "facing_index"
desc = "X = 1 when bit 7 of kirby_facing is set (left), else 0."
out = "X = 0 right, 1 left"

[[sym]]
at = "21:8FFB"
name = "floor_kind_index"
desc = "A = X = floor_kind - 2 for floor_kind 2-5, and 4 for any other value."
out = "A = X = 0-4"

[[sym]]
at = "21:9C5A"
name = "kirby_face_pad"
desc = "Turns Kirby to the held direction: kirby_facing = $C0 when Left is held (pad1_held_copy bit 1), else $40 when Right is held (bit 0), else unchanged. The two values are face_values."

[[sym]]
at = "21:8AE8"
name = "pad_a_new"
desc = "Carry set when A is newly pressed (bit 7 of pad1_new_copy), else clear."
out = "carry"

[[sym]]
at = "21:8AF2"
name = "pad_b_new"
desc = "Carry set when B is newly pressed (bit 6 of pad1_new_copy), else clear."
out = "carry"

[[sym]]
at = "21:8B06"
name = "pad_up_held"
desc = "Carry set when Up is held (bit 3 of pad1_held_copy), else clear."
out = "carry"

[[sym]]
at = "21:8B10"
name = "pad_down_held"
desc = "Carry set when Down is held (bit 2 of pad1_held_copy), else clear."
out = "carry"

[[sym]]
at = "21:8A15"
name = "pad_up_door"
desc = "With Up not held: carry clear. With Up held: obj_point, then a jump to door_find (the door at the current object's position), whose answer it returns."

