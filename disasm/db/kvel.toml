id = "kvel.pad.down_held"
about = ["pad_down_held"]
text = "Every call of pad_down_held returns carry = bit 2 of pad1_held_copy and writes nothing outside the stack page."
kind = "call"
fn = "pad_down_held"
on = ["main@400+1000", "main@64600+1000", "w12-sonnet@3000+1000", "w12-opus@4000+1000", "attract@1100+2500", "w1-v2-opus@700+1500"]
min_calls = 1000
max_calls = 6000
expect = "rp & 1 == rd[0xE6] >> 2 & 1 and not {w for w in writes if w >= 0x200 or w < 0x100}"

[[claim]]
id = "kvel.pad.a_new.cases"
about = ["pad_a_new"]
text = "The windows hold 20 calls of pad_a_new with A newly pressed (bit 7 of pad1_new_copy); each returns carry set."
kind = "call"
fn = "pad_a_new"
on = ["main@400+1000", "main@64600+1000", "w12-sonnet@3000+1000", "w12-opus@4000+1000", "attract@1100+2500", "w1-v2-opus@700+1500"]
where = "rd[0xE7] & 0x80"
min_calls = 20
max_calls = 6000
expect = "rp & 1 == 1"

