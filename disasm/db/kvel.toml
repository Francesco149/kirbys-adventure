[[claim]]
id = "kvel.vx_apply.model"
about = ["kirby_vx_apply", "kirby_vx", "slope_vx_lo", "slope_vx_hi"]
text = "Every call of kirby_vx_apply writes the X velocity of slot 1 (obj_vx_lo+1, obj_vx_hi+1): kirby_vx when floor_kind is not 5, and entry (kirby_vx >> 4) & $FF of slope_vx_lo / slope_vx_hi when it is 5. Outside the stack page it writes nothing else but $10."
kind = "call"
fn = "kirby_vx_apply"
on = ["main@400+1000", "main@64600+1000", "w12-sonnet@3000+1000", "w12-opus@4000+1000", "attract@1100+2500", "w1-v2-opus@700+1500", "w12-opus@1400+1000", "ufo-opus@600+1500"]
min_calls = 4000
max_calls = 6000
use = ["kirby_velocity"]
expect = "(wr[0x60E1] | wr[0x60F3] << 8) == applied(rd, romrd) and {w for w in writes if w >= 0x200 or w < 0x100} <= {0x10, 0x60E1, 0x60F3}"
model = '''
def applied(rd, romrd):
    vx = w16(rd, 0x5B9)
    if rd[0x5F4] != 5:
        return vx
    i = vx >> 4 & 0xFF
    return romrd[O('slope_vx_lo') + i] | romrd[O('slope_vx_hi') + i] << 8
'''

