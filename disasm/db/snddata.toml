# ------------------------------------------------------------------ claims

[[claim]]
id = "snddata.format"
about_formats = ["sndhdr", "sndtrack", "sndenv"]
text = "Every region parses as its format; every address in a header, a jump or a call is the first byte of an element in a region of the right kind; every byte of the regions that the corpus read was read only by the instructions that read that kind of byte (an element's first byte by the dispatch read of its stream kind, the re-reads and the fetch of snd_next_byte; an operand by that fetch; a jump's operands by 1D:8448 / 1D:844C or the fetch; a header by the header reads); and no byte that a dispatch read or a header read touched lies outside the regions."
kind = "format"
complete = true

[[claim]]
id = "snddata.tables"
about_formats = ["sndhdr"]
text = "Every entry of snd_sfx_lo / snd_sfx_hi is the address of a header in a sndhdr region of bank 1D, and every entry of snd_song_lo / snd_song_hi / snd_song_bank the address of one in the entry's bank; the 146 entries name 146 different headers and every header of the regions is named by one."
kind = "static"
expect = "len(set(hdrs())) == 146 and all(kind_at(o) for o in hdrs()) and count() == 146"
model = '''
import sndfmt
SIZE = {'sndhdr_1D_8B9F': 541, 'sndhdr_1E_A000': 140, 'sndhdr_1E_AF08': 96, 'sndhdr_1F_A000': 172, 'sndhdr_1F_ADC2': 130, 'sndhdr_20_A000': 106, 'sndhdr_20_AB81': 161}

def hdrs():
    out = []
    for i in range(88):
        out.append(O('snd_sfx_lo') - (A('snd_sfx_lo') - 0x8000) + (rom[O('snd_sfx_hi') + i] << 8 | rom[O('snd_sfx_lo') + i]) - 0x8000)
    for i in range(58):
        out.append(rom[O('snd_song_bank') + i] * 0x2000 + (rom[O('snd_song_hi') + i] << 8 | rom[O('snd_song_lo') + i]) - 0xA000)
    return out

def spans():
    # (offset, length) of every sndhdr region, from the names of this claim
    return [(O(n), SIZE[n]) for n in SIZE]

def starts():
    out = set()
    for o, n in spans():
        out |= {h for h, k in sndfmt.headers(rom, o, o + n)}
    return out

def kind_at(o):
    return o in starts()

def count():
    return len(starts())
'''
