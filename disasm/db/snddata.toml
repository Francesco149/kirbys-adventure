unit = "snddata"
title = "What the sound engine plays: every header, track stream and envelope stream"
summary = """The data of the engine of unit sound, found from its tables: the 88 sound headers that snd_sfx_lo / snd_sfx_hi
name (bank 1D), the 58 song headers of snd_song_lo / snd_song_hi / snd_song_bank (banks 1E, 1F, 20), the track
streams the headers name with everything their jumps and calls reach, and the envelope streams of the 41
instruments in snd_inst_envs. The three formats are in sndfmt.py: a header is a count and that many (address,
channel) records; a track stream is a row of notes and commands whose first byte gives the length; an envelope
stream is a row of one-byte steps with the same flow commands. The regions are runs of elements that touch: where
one stream ends the next one begins, so a region holds many streams.

The claim compares, for every byte the corpus read, the instructions that read it with what the parse says the
byte is, and requires that nothing the two dispatch reads and the header reads touched lies outside the regions.

Open: every song and every sound has been started (the sound test: sounds in cov6-j-x, songs in cov6-songs; 13
songs only there, listed in unit sound); their streams parse and are regions. Which song is which tune: unit cov6_extra names where
some are started (claim cov6_extra.snd.places: $35 the title, 0 World 1's level card, $08 the goal game, $22
Vegetable Valley's hub, $0C Whispy Woods, $07 after Whispy Woods is beaten, $0B GAME OVER, $37 the ending); the sound test shows
only the numbers. The rest, and which sound is which, is not here. The bytes after
the last region of each bank (393 in 1D, 270 in 1E, 581 in 1F, 989 in 20) and a few between regions are named by
no table; some look like stream fragments. The only reads recorded there are by the fetch of snd_next_byte, which
reads ahead of a stream's last element and throws the value away (unit sound); that is not claimed here."""

