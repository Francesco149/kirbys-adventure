[[claim]]
id = "vm.thread.unlink"
about = ["thread_unlink", "obj_first_thread", "thread_next", "next_thread"]
text = "thread_unlink writes Y's successor into the previous thread's thread_next, or into obj_first_thread[X] when Y was first; it replaces next_thread by the successor exactly when next_thread was Y; X and Y are unchanged."
kind = "call"
fn = "thread_unlink"
on = ["main@0+4000", "main@60000+1500", "w12-opus@30000+1500", "w3-sonnet@0+4000"]
model = """
def prev(rd, x, y):
    p, t = 0xFF, rd[0x614C + x]
    while t != y:
        p, t = t, rd[0x6320 + t]
    return p
def links(wr):
    return {k: v for k, v in wr.items() if 0x6000 <= k < 0x6400}
"""
expect = "(lambda p, nx: links(wr) == dict([(0x614C + x, nx) if p == 0xFF else (0x6320 + p, nx)] + ([(0x6037, nx)] if rd[0x6037] == y else [])) and rx == x and ry == y)(prev(rd, x, y), rd[0x6320 + y])"

