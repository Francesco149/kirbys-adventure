[[claim]]
id = "vm.thread.find_prev"
about = ["thread_find_prev", "obj_first_thread", "thread_next"]
text = "thread_find_prev returns in X the thread whose thread_next is Y, found by walking from obj_first_thread[X]; $FF when Y is the object's first thread. Y is unchanged."
kind = "call"
