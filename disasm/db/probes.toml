id = "probes.dist.writers"
about = ["probe_dist"]
text = "The writers of probe_dist in the corpus are probe_done and three routines of Kirby's code (21:905C, 21:92BA, 21:92EF), which write the low byte only."
kind = "xref"
expect = "writers('probe_dist') == {'probe_done', '21:905C', '21:92BA', '21:92EF'} and writers(0x57A) == {'probe_done'}"

[[claim]]
id = "probes.side.xref"
about = ["room_side_class"]
text = "room_side_class is written by 38:AD5E only and read by block_class_at, block_right (whose last bytes also end block_left) and block_prop_at."
kind = "xref"
expect = "writers('room_side_class') == {'38:AD5E'} and readers('room_side_class') == {'block_class_at', 'block_right', 'block_prop_at'}"

[[claim]]
id = "probes.callers"
about = ["block_below", "block_above", "block_left", "block_right", "block_class_at"]
text = "block_class_at is called by the four probes only; block_below by probe_up_below and probe_down_below, block_above by probe_up_above and probe_down_above, block_left by probe_left_left and probe_right_left, block_right by probe_left_right and probe_right_right."
kind = "xref"
expect = "callers('block_class_at') == {'probe_up', 'probe_down', 'probe_left', 'probe_right'} and callers('block_below') == {'probe_up_below', 'probe_down_below'} and callers('block_above') == {'probe_up_above', 'probe_down_above'} and callers('block_left') == {'probe_left_left', 'probe_right_left'} and callers('block_right') == {'probe_left_right', 'probe_right_right'}"
