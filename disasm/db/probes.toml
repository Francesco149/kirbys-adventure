# ------------------------------------------------------------------ claims

[[model]]
name = "probe_geometry"
code = '''
def s8(v):
    v &= 0xFF
    return v - 256 if v & 0x80 else v

def screen(romrd, n):
    return romrd[O('screen_lo') + n] | romrd[O('screen_hi') + n] << 8

def look(rd, romrd, base, i):
    # the class of block i of the screen at base
    if not 0x68 <= base >> 8 < 0x74:
        return 0
    pr = rd[0x7F00 + rd[base + i]]
    return 0 if pr >= 0x7F else romrd[O('prop_class') + pr] >> 1

def start(rd, romrd, xlo, ylo, pt=None):
    # block_class_at: the block that holds the point, and its class. pt = (B, C) when the caller of the
    # probe set them (they are then not in rd)
    st = {}
    col = pt[0] if pt else rd[0x4B]
    py = (pt[1] if pt else rd[0x4C]) << 8 | ylo
    if py >= 0x6000:
        cell, rest = 0xFF, 0
    else:
        row, rest = divmod(py, 192)
        cell = col + rd[0x676D + row] & 0xFF
    st['col'], st['cell'] = col, cell
    cx = cell + rd[0x67EE] & 0xFF if rd[0x51E] >= 2 else cell
    st['base'] = screen(romrd, rd[0x67F6 + cx])
    st['i'] = rest & 0xF0 | xlo >> 4
    st['x'], st['y'] = xlo & 15, rest & 15
    if col >= 0x80 or col >= rd[0x67EE]:
        st['c'], st['flag'] = rd[0x78D1], col & 1
    elif cell >= 0x80 or cell >= rd[0x67ED]:
        st['c'], st['flag'] = 0, cell & 1
    else:
        st['c'] = look(rd, romrd, st['base'], st['i'])
        st['flag'] = flag(rd, romrd, st['base'], st['i'])
    return st

def flag(rd, romrd, base, i):
    # bit 0 of the prop_class byte of block i
    if not 0x68 <= base >> 8 < 0x74:
        return 0
    pr = rd[0x7F00 + rd[base + i]]
    return 0 if pr >= 0x7F else romrd[O('prop_class') + pr] & 1

def downx(rd, romrd, xlo, ylo, pt=None):
    # probe_down's answer and the X it returns
    r = down(rd, romrd, xlo, ylo, pt)
    return r + (0 if r[0] else start(rd, romrd, xlo, ylo, pt)['flag'],)

def below(rd, romrd, st):
    i = st['i'] + 0x10
    if i < 0xC0:
        return look(rd, romrd, st['base'], i)
    cell = st['cell'] + rd[0x67EE] & 0xFF
    if cell >= rd[0x67ED]:
        return 0
    return look(rd, romrd, screen(romrd, rd[0x67F6 + cell]), i - 0xC0)

def above(rd, romrd, st):
    i = st['i'] - 0x10
    if i >= 0:
        return look(rd, romrd, st['base'], i)
    cell = st['cell'] - rd[0x67EE] & 0xFF
    if cell >= rd[0x67ED]:
        return 0
    return look(rd, romrd, screen(romrd, rd[0x67F6 + cell]), i + 0xC0)

def leftof(rd, romrd, st):
    i = st['i'] - 1 & 0xFF
    if i & 15 != 15:
        return look(rd, romrd, st['base'], i)
    if st['col'] - 1 & 0x80:
        return rd[0x78D1]
    return look(rd, romrd, screen(romrd, rd[0x67F6 + (st['cell'] - 1 & 0xFF)]), i + 0x10 & 0xFF)

def rightof(rd, romrd, st):
    i = st['i'] + 1 & 0xFF
    if i & 15:
        return look(rd, romrd, st['base'], i)
    if (st['col'] + 1 & 0xFF) >= rd[0x67EE]:
        return rd[0x78D1]
    return look(rd, romrd, screen(romrd, rd[0x67F6 + (st['cell'] + 1 & 0xFF)]), i - 0x10 & 0xFF)

FLOOR = {1: 2, 2: 2, 3: 2, 4: 5, 5: 6, 6: 3, 7: 3, 8: 4, 9: 4}

def top(c, x):
    # the row of the floor surface in a block of class c at column x
    return {1: 0, 2: 0, 3: 0, 4: 15 - x, 5: x, 6: 15 - (x >> 1), 7: 7 - (x >> 1), 8: x >> 1, 9: 8 + (x >> 1)}[c]

def down(rd, romrd, xlo, ylo, pt=None):
    st = start(rd, romrd, xlo, ylo, pt)
    c, x, y = st['c'], st['x'], st['y']
    if c == 0:
        c2 = below(rd, romrd, st)
        if c2 == 0:
            return (1, 0x20, 0)
        return (0, 16 + top(c2, x) - y, FLOOR[c2])
    if 4 <= c <= 9:
        return (0, top(c, x) - y, FLOOR[c])
    c2 = above(rd, romrd, st)
    if c2 == 0:
        return (0, -y, 2)
    if c2 in (1, 2):
        return (1, -0x20, 2)
    return (0, top(c2, x) - 16 - y, {4: 5, 5: 6, 6: 3, 7: 3, 8: 4, 9: 4}[c2])

def up(rd, romrd, xlo, ylo, pt=None):
    st = start(rd, romrd, xlo, ylo, pt)
    c, x, y = st['c'], st['x'], st['y']
    if c == 10:
        return (0, x - y, 8)
    if c == 11:
        return (0, 15 - x - y, 7)
    if c == 1:
        c2 = below(rd, romrd, st)
        if c2 == 1:
            return (1, 0x20, 2)
        if c2 == 10:
            return (0, 16 + x - y, 8)
        if c2 == 11:
            return (0, 31 - x - y, 7)
        return (0, 15 - y, {0: 2, 3: 2}[c2])
    c2 = above(rd, romrd, st)
    if c2 == 1:
        return (0, -1 - y, 2)
    if c2 == 10:
        return (0, x - 16 - y, 8)
    if c2 == 11:
        return (0, -1 - x - y, 7)
    return (1, -0x20, {0: 0, 2: 0, 3: 0, 4: 0, 5: 0, 7: 0, 8: 0, 9: 0}[c2])

def left_l(rd, romrd, st, k):
    c2, x, y = leftof(rd, romrd, st), st['x'], st['y']
    k = k or {0: 0, 1: 2, 2: 0, 3: 0, 5: 6, 6: 0, 8: 4, 9: 4, 11: 7}[c2]
    if c2 == 1 or c2 == 8 and y >= 8:
        return (0, -1 - x, k)
    if c2 == 5:
        return (0, y - 16 - x, k)
    if c2 == 8 or c2 == 9 and y >= 8:
        return (0, 2 * (y & 7) - 15 - x, k)
    if c2 == 11:
        return (0, -1 - y - x, k)
    return (1, -0x20, {0: k, 2: k, 3: k, 6: k, 9: k}[c2])

def left_r(rd, romrd, st, k):
    c2, x, y = rightof(rd, romrd, st), st['x'], st['y']
    k = k or {0: 2, 1: 2, 2: 2, 3: 2, 5: 6, 8: 4, 11: 7}[c2]
    if c2 == 1 or c2 == 8 and y >= 8:
        return (1, 0x20, k)
    if c2 == 5:
        return (0, 16 - x + y, k)
    if c2 == 8 or c2 == 9 and y >= 8:
        return (0, 2 * (y & 7) + 16 - x, k)
    if c2 == 11:
        return (0, 31 - x - y, k)
    return (0, 15 - x, {0: k, 2: k, 3: k, 7: k, 9: k}[c2])

def left(rd, romrd, xlo, ylo, pt=None):
    st = start(rd, romrd, xlo, ylo, pt)
    c, x, y = st['c'], st['x'], st['y']
    if c == 5:
        return (0, y - x, 6)
    if c == 11:
        return (0, 16 - x - y, 7)
    if c == 8:
        return (0, 2 * y - x, 4) if y < 8 else left_r(rd, romrd, st, 4)
    if c == 9:
        return left_l(rd, romrd, st, 4) if y < 8 else (0, 2 * (y & 7) - x, 4)
    if c == 1:
        return left_r(rd, romrd, st, 0)
    return left_l(rd, romrd, st, {0: 0, 2: 0, 3: 0, 4: 0, 6: 0, 7: 0}[c])

def right_r(rd, romrd, st, k):
    c2, x, y = rightof(rd, romrd, st), st['x'], st['y']
    k = k or {0: 0, 1: 2, 2: 0, 3: 0, 4: 5, 6: 3, 7: 3, 8: 0, 9: 0, 10: 8}[c2]
    if c2 == 1 or c2 == 7 and y >= 8:
        return (0, 16 - x, k)
    if c2 == 4:
        return (0, 31 - x - y, k)
    if c2 == 7 or c2 == 6 and y >= 8:
        return (0, 30 - 2 * (y & 7) - x, k)
    if c2 == 10:
        return (0, 16 - x + y, k)
    return (1, 0x20, {0: k, 2: k, 3: k, 6: k, 8: k, 9: k}[c2])

def right_l(rd, romrd, st, k):
    c2, x, y = leftof(rd, romrd, st), st['x'], st['y']
    k = k or {0: 2, 1: 2, 2: 2, 3: 2, 4: 5, 7: 3, 9: 2, 10: 8}[c2]
    if c2 == 1 or c2 == 7 and y >= 8:
        return (1, -0x20, k)
    if c2 == 4:
        return (0, -1 - 2 * y, k)
    if c2 == 7 or c2 == 6 and y >= 8:
        return (0, -1 - 2 * (y & 7) - x, k)
    if c2 == 10:
        return (0, y - 16 - x, k)
    return (0, -x, {0: k, 2: k, 3: k, 6: k, 8: k, 9: k}[c2])

def right(rd, romrd, xlo, ylo, pt=None):
    st = start(rd, romrd, xlo, ylo, pt)
    c, x, y = st['c'], st['x'], st['y']
    if c == 4:
        return (0, 15 - y - x, 5)
    if c == 10:
        return (0, y - x, 8)
    if c == 6:
        return right_r(rd, romrd, st, 3) if y < 8 else (0, 2 * (7 - (y & 7)) - x, 3)
    if c == 7:
        return (0, 2 * (7 - y) - x, 3) if y < 8 else right_l(rd, romrd, st, 3)
    if c in (1, 11):
        return right_l(rd, romrd, st, 0)
    return right_r(rd, romrd, st, {0: 0, 2: 0, 3: 0, 5: 0, 8: 0, 9: 0}[c])

def got(rp, wr, ra):
    v = wr[0x579] | wr[0x57A] << 8
    return (rp & 1, v - 0x10000 if v & 0x8000 else v, ra)
'''

