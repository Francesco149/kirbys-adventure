unit = "probes"
title = "The four probes: how far it is from a point to the floor, the ceiling and the walls"
summary = """The collision core of the game (3F:F14D-3F:F7F5), shared by Kirby's code (bank 21) and the objects' (banks 16,
22, 24, 28, 2B). A probe takes a point (X = $4B:X, Y = $4C:Y, as block_prop_at does) and answers three things: carry
clear when a surface is within reach, the signed distance to it in probe_dist (16 bits, pixels), and in A the kind of
surface. probe_down measures to the floor (positive = the floor is below the point), probe_up to the ceiling,
probe_left and probe_right to a wall. Carry set means nothing within a block: probe_dist is then +32 or -32, and -32
also stands for "deep inside something solid".

A block has a class, 0-11: prop_class[block_prop] / 2 (block_class_at; prop_class is a third table indexed by the
block's property, next to prop_shape and prop_extra of unit props). What the probes do with each class:
  0      empty
  1      solid from every side
  2, 3   a floor only: probe_down treats them as solid, the other three as empty (platforms one can jump up through)
  4      a 45 degree floor rising to the right (surface row 15 - x at column x of the block); a wall for probe_right
  5      a 45 degree floor rising to the left (row x); a wall for probe_left
  6, 7   the lower and the upper half of a floor rising to the right over two blocks (rows 15 - x/2 and 7 - x/2)
  8, 9   the upper and the lower half of a floor falling to the right over two blocks (rows x/2 and 8 + x/2)
  10     a ceiling whose underside falls to the right (solid above row x); a wall for probe_right
  11     a ceiling whose underside rises to the right (solid above row 15 - x); a wall for probe_left
The kind returned in A: 0 nothing, 2 a flat face, 3 the slopes of classes 6 and 7, 4 those of 8 and 9, 5 class 4,
6 class 5, 7 class 11, 8 class 10.

Each probe looks at the block that holds the point and, depending on its class, at one neighbour: an empty block sends
probe_down to the block below (the floor may be up to 31 pixels down), a solid one to the block above (the surface
is this block's top unless that one is solid too or carries a slope down into this block). The same in the other
three directions. Every such step is a dispatcher: it takes the class of a block, loads the kind and jumps through a
table of 12 handlers (kind, address low, address high: the tables named *_tab), and every handler is one formula over
the point's column and row inside its block ($11, $12) that ends in probe_done. The neighbour blocks come from
block_below, block_above, block_left and block_right, which cross into the next screen of the room when the block is
at the edge of its screen; left and right of the room the class is room_side_class, above and below it 0.

In pictures: main@1500 is the first slope of 1-1 (classes 4-9), main@39100 a room with sloped ceilings (10, 11).

Open: 21 of the 144 table entries were never used (a class that never met that dispatcher, for instance a sloped
ceiling as the block below an empty one for probe_down); the claims say what the handlers that ran do. The handler at
3F:F600 (probe_right with a solid block at the point and class 4 to its left) computes -(2 * row + 1), without the
column, where its three sister cases use both; it ran 536 times and is modelled as it is. With $051E >= 2
block_class_at takes the screen one room row down but the neighbour lookups do not; the claims do not single that
case out. What bit 0 of prop_class means (probe_down returns it in X) is not claimed. room_side_class is written by 38:AD5E only, which is not in the unit, and so are all callers: what Kirby's
and the objects' code do with the distances (21:905C-21:9324, 22:9B16-22:9C35, 16:B43E, 16:B714, 24:B4BC, 2B:A98B)."""

