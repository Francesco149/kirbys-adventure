unit = "kmove"
title = "Kirby's move step: his limits in the room and the camera that follows him"
summary = """What moves Kirby (slot 1) once per frame, after his state's code has set his velocities. kirby_step copies
kirby_vy to his object's Y velocity (kirby_vy_apply), adds the current of the block he is in (current_push of unit
kblocks, unless bit 7 of $05FB is set) and falls into kirby_move. kirby_move adds the velocities to his position
(obj_integrate), keeps the position inside kirby_min_x <= X <= kirby_max_x and Y >= kirby_min_y, moves the camera so
that he stays between 112 and 128 pixels from its left edge and between 96 and 112 from its top, keeps the camera
inside cam_min <= camera <= cam_end - 256, and copies the position to the world position. The room loader sets the
limits 16 pixels inside the camera's range (kirby_min_x_set, kirby_max_x_set; kirby_min_y is cam_min_y + 28).

With cam_locked nonzero (kirby_move_locked) the camera is left alone and the limits are recomputed from it every
frame: X from camera + 16 to camera + 239, Y from camera + 28. That is the rooms that scroll by themselves
(main@81300): something else moves the camera and Kirby is carried along by its left edge. When the left limit
pushes him, kirby_edge_test looks at the blocks 7 right of him, 6 above and 6 below.

kirby_at_top is carry set when kirby_vy is upward and his world Y equals kirby_min_y; it then clears the velocity
(kirby_vy_zero).

Open: in kirby_move_locked the right limit and the top limit never pushed Kirby (21:9797, 21:97C0 never ran), and
kirby_edge_test found shape 0 on all 98 calls, so its store of $FF to $0597 never ran (it reads as: a block that is
not empty where the screen edge pushes him ends him). The locked path ran in one stretch of main (647 calls from
frame 81,158). What bit 7 of $05FB is, is not claimed. 21:8C39 (carry set when Kirby stands at a side limit and moves
toward it) returned carry clear on all 1,086 calls. Not in the unit: the other writers of the limits (22:89F3,
38:AED0, 38:AFA6, 23:A20F, 23:A2E1), the writers of cam_locked (14:A0D5, 2F:B8B2 and a script instruction), the
writers of kirby_vy other than the two here, and 19:AD76, the second caller of kirby_move."""

[[sym]]
at = "21:95D3"
name = "kirby_step"
desc = "Kirby's move step: kirby_vy_apply, then current_push unless bit 7 of $05FB is set, then it falls into kirby_move. Entered once per frame, nearly always by falling in from 21:95CD (kirby_step_from_speed of unit kvel), which first makes his X velocity from his speed; 15:B068 calls it directly."

[[sym]]
at = "21:95DE"
name = "kirby_move"
desc = "Moves the current object (Kirby) and the camera. With cam_locked nonzero it jumps to kirby_move_locked. Otherwise: obj_integrate; the X position is raised to kirby_min_x or lowered to kirby_max_x, the Y position raised to kirby_min_y (16-bit, slot 1's bytes); if he is less than 112 pixels right of the camera, the camera becomes X - 112, and cam_min_x when that is negative or below cam_min_x; if he is 128 or more right of it, the camera becomes X - 128, and cam_end_x - 256 when that is above it; the same for Y with 96 and 112, cam_min_y and cam_end_y; last the position (low and high bytes of X and Y) is copied to slot 1's world position. Entered by falling in from kirby_step and by a call from 19:AD76."

[[sym]]
at = "21:972C"
kind = "part"
name = "kirby_move_locked"
desc = "kirby_move with cam_locked nonzero: obj_integrate; kirby_min_x = camera X + 16, kirby_max_x = camera X + 239, kirby_min_y = camera Y + 28; the position is raised to the left limit (then kirby_edge_test is called for the offsets (7, -6) and (7, 6)), lowered to the right limit (offsets (-7, -6) and (-7, 6)) and raised to the top limit (offsets (-6, 7) and (6, 7)); it ends in obj_copy_world. The camera is not written."

[[sym]]
at = "21:97DD"
name = "kirby_edge_test"
desc = "Asks for the shape number (prop_shape_at) of the block at the current object's position plus the offsets in X and Y (obj_point_off) and stores $FF in $0597 when it is not 0."
in = "X, Y = signed offsets"

[[sym]]
at = "21:87AD"
name = "kirby_vy_apply"
desc = "Copies kirby_vy to the Y velocity of slot 1."

[[sym]]
at = "21:884D"
name = "kirby_vy_zero"
desc = "Clears kirby_vy and the Y velocity of slot 1."
out = "A = 0"

[[sym]]
at = "21:8C61"
name = "kirby_at_top"
desc = "Carry set when kirby_vy is negative (upward) and the world Y of slot 1 equals kirby_min_y; in that case kirby_vy_zero has been called. Carry clear otherwise."
out = "carry"

[[sym]]
at = "13:A904"
name = "kirby_min_x_set"
desc = "kirby_min_x = cam_min_x + 16."

[[sym]]
at = "13:A916"
name = "kirby_max_x_set"
desc = "kirby_max_x = cam_end_x - 17."

[[ram]]
at = "05C8"
len = 2
name = "kirby_min_x"
desc = "The smallest X position kirby_move leaves Kirby at."

[[ram]]
at = "05CA"
len = 2
name = "kirby_max_x"
desc = "The largest X position kirby_move leaves Kirby at."

[[ram]]
at = "05CC"
len = 2
name = "kirby_min_y"
desc = "The smallest Y position kirby_move leaves Kirby at."

[[ram]]
at = "05FA"
name = "cam_locked"
desc = "Nonzero: kirby_move does not move the camera and takes Kirby's limits from it (kirby_move_locked)."

[[ram]]
at = "05BD"
len = 2
name = "kirby_vy"
desc = "Kirby's Y velocity (signed, 1/256 pixel per frame) as his own code keeps it; kirby_vy_apply copies it to his object every frame."

