[[claim]]
id = "kmove.move.model"
about = ["kirby_move", "kirby_min_x", "kirby_max_x", "kirby_min_y"]
text = "Every call of kirby_move with cam_locked 0 is for slot 1 and leaves the position, the camera and the world position as the model gives them from the position, the velocities, the three limits, the camera and its four limits: integrate, clamp X to kirby_min_x / kirby_max_x and Y to kirby_min_y, camera to X - 112 / X - 128 and Y - 96 / Y - 112 when Kirby is outside those bands, the camera clamped to cam_min and cam_end - 256, world position = position. Outside the stack page it writes only those bytes and the two fractions."
kind = "call"
fn = "kirby_move"
on = ["main@500+300", "main@3600+200", "main@41600+200", "w12-sonnet@3000+300", "w12-opus@5100+200", "attract@2200+200"]
where = "rd[0x5FA] == 0"
min_calls = 800
max_calls = 3000
expect = "rd[0x6E] == 1 and after(rd, mem) == want(rd, mem) and {w for w in writes if w >= 0x200 or w < 0x100} <= {0x71, 0x83, 0x95, 0xA7, 0xB9, 0xCB, 0xDD, 0xDE, 0xE0, 0xE1, 0x6075, 0x6087, 0x6099, 0x60AB}"
model = '''
def s16(v):
    return v - 0x10000 if v & 0x8000 else v

def u16(rd, mem, lo):
    return (rd[lo] if lo in rd else mem(lo)) | (rd[lo + 1] if lo + 1 in rd else mem(lo + 1)) << 8

def integ(rd, frac, lo, hi, vlo, vhi):
    v = s16(rd[vlo] | rd[vhi] << 8)
    return ((rd[hi] << 16 | rd[lo] << 8 | rd[frac]) + v >> 8) & 0xFFFF

def follow(rd, mem, pos, cam, near, far, cmin, cend):
    d = (pos - rd[cam]) & 0xFF
    if d < near:
        c = (pos - near) & 0xFFFF
        if c & 0x8000 or c < u16(rd, mem, cmin):
            c = u16(rd, mem, cmin)
        return c
    if d >= far:
        c = (pos - far) & 0xFFFF
        e = (u16(rd, mem, cend) - 0x100) & 0xFFFF
        return e if e < c else c
    return None if cam + 1 not in rd else u16(rd, mem, cam)

def want(rd, mem):
    px = integ(rd, 0x71, 0x83, 0x95, 0x60E1, 0x60F3)
    py = integ(rd, 0xA7, 0xB9, 0xCB, 0x6105, 0x6117)
    if s16((px - u16(rd, mem, 0x5C8)) & 0xFFFF) < 0:
        px = u16(rd, mem, 0x5C8)
    elif s16((px - u16(rd, mem, 0x5CA)) & 0xFFFF) >= 0:
        px = u16(rd, mem, 0x5CA)
    if s16((py - u16(rd, mem, 0x5CC)) & 0xFFFF) < 0:
        py = u16(rd, mem, 0x5CC)
    cx = follow(rd, mem, px, 0xDD, 0x70, 0x80, 0x5C0, 0x5C2)
    cy = follow(rd, mem, py, 0xE0, 0x60, 0x70, 0x5C4, 0x5C6)
    return (px, py, cx, cy, px, py)

def after(rd, mem):
    return (mem(0x83) | mem(0x95) << 8, mem(0xB9) | mem(0xCB) << 8, cam(mem, 0xDD),
            cam(mem, 0xE0), mem(0x6075) | mem(0x6087) << 8, mem(0x6099) | mem(0x60AB) << 8)

def cam(mem, lo):
    try:
        return mem(lo) | mem(lo + 1) << 8
    except KeyError:
        return None
'''

