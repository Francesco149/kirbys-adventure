[[claim]]
id = "kmove.locked.model"
about = ["kirby_move_locked", "cam_locked", "kirby_min_x", "kirby_max_x", "kirby_min_y"]
text = "Every call of kirby_move with cam_locked nonzero (one scene: the room of main that scrolls by itself, in two windows) calls obj_integrate first, writes the world position (X, Y and the third coordinate) as obj_copy_world does, kirby_min_x = camera X + 16, kirby_max_x = camera X + 239 and kirby_min_y = camera Y + 28, does not write the camera, and leaves X = the larger of the integrated X and kirby_min_x; it calls kirby_edge_test twice when it raised X and not at all otherwise."
kind = "call"
fn = "kirby_move"
on = ["main@81158+300", "main@81500+300"]
where = "rd[0x5FA] != 0"
min_calls = 500
max_calls = 3000
expect = "calls[0] == 'obj_integrate' and (wr[0x6075], wr[0x6087], wr[0x6099], wr[0x60AB], wr[0x60BD], wr[0x60CF]) == (mem(0x83), mem(0x95), mem(0xB9), mem(0xCB), rd[0x6051], rd[0x6063]) and lim(wr) == camlim(rd) and not writes & {0xDD, 0xDE, 0xE0, 0xE1} and mem(0x83) | mem(0x95) << 8 == max(xint(rd), lim(wr)[0]) and calls.count('kirby_edge_test') == (2 if xint(rd) < lim(wr)[0] else 0)"
model = '''
def lim(wr):
    return (wr[0x5C8] | wr[0x5C9] << 8, wr[0x5CA] | wr[0x5CB] << 8, wr[0x5CC] | wr[0x5CD] << 8)

def camlim(rd):
    cx = rd[0xDD] | rd[0xDE] << 8
    cy = rd[0xE0] | rd[0xE1] << 8
    return (cx + 0x10 & 0xFFFF, cx + 0xEF & 0xFFFF, cy + 0x1C & 0xFFFF)

def xint(rd):
    v = rd[0x60E1] | rd[0x60F3] << 8
    v = v - 0x10000 if v & 0x8000 else v
    return ((rd[0x95] << 16 | rd[0x83] << 8 | rd[0x71]) + v >> 8) & 0xFFFF
'''

