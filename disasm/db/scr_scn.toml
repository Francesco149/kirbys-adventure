desc = """At the chute: velocity 0, crane_count_prize, crane_credits - 1, crane_side = 0, variable 0 = 0, 53 frames, crane_holding = 0, the claw's picture 3A:89C0, pose 3 for 15 frames, pose 2, 55 frames; with credits left the next credit (3B:B00C in crane_claw), otherwise $07C1 = 1 (what the manager waits for), music $17, halt."""

[[script]]
at = "3B:B14E"
name = "crane_sign"
desc = """Part $0C of crane_start, the credit counter on the panel: picture 3A:96EE at ($68, $C7), crane_credit_pose (pose = crane_credits), then crane_sign_idle."""

[[script]]
at = "3B:B15B"
name = "crane_sign_idle"
desc = """Each frame crane_pad_right until it answers 1 (the claw starts to move), then crane_sign_move."""

[[script]]
at = "3B:B163"
name = "crane_sign_move"
desc = """Each frame crane_pad_right while it answers 1, then crane_sign_home."""

[[script]]
at = "3B:B16B"
name = "crane_sign_home"
desc = """Each frame crane_home_test until the claw is back over the chute; then 53 frames, crane_credit_pose (one credit less on the counter), and crane_sign_idle again while crane_credits is not 0; otherwise halt."""

[[script]]
at = "3B:B17F"
name = "crane_arrow"
desc = """Part 4, the arrow beside the A button on the panel: picture 3A:963B at ($88, $C8); again for each credit (crane_arrow_home comes back here)."""

[[script]]
at = "3B:B189"
name = "crane_arrow_wait"
desc = """No pose; each frame a jump table on crane_dolls_down whose two entries both come back here, so it waits until two dolls have landed (2 falls through); then a blink thread (crane_arrow_blink) and crane_arrow_ready."""

[[script]]
at = "3B:B197"
name = "crane_arrow_ready"
desc = """Each frame crane_pad_right until the claw starts to move (answer 1), then crane_arrow_lit."""

[[script]]
at = "3B:B1A0"
name = "crane_arrow_lit"
desc = """The blink thread ends (end_last_task) and the arrow is lit (pose 1)."""

[[script]]
at = "3B:B1A3"
name = "crane_arrow_hold"
desc = """Each frame crane_pad_right while the claw moves (answer 1), then crane_arrow_off."""

[[script]]
at = "3B:B1AC"
name = "crane_arrow_off"
desc = """No pose (the arrow off), then crane_arrow_home."""

[[script]]
at = "3B:B1AE"
name = "crane_arrow_home"
desc = """Each frame crane_home_test until the claw is back over the chute; 53 frames; with crane_credits not 0 crane_arrow again, otherwise the object ends."""

[[script]]
at = "3B:B1BD"
name = "crane_arrow_blink"
desc = """Thread of the arrow while it waits for the button: pose 0 for 10 frames, pose 1 for 10, in a loop."""

[[script]]
at = "3B:B1C3"
name = "crane_bubble"
desc = """Part 5, one of the six bubbles of the pile: crane_bubble_place (its X and picture), Y = $3C, Z = $80, then crane_bubble_anim."""

[[script]]
at = "3B:B1CC"
name = "crane_bubble_anim"
desc = """Six times the poses 0, 1, 2, one frame each, then no pose for 5 frames, in a loop."""

[[script]]
at = "3B:B213"
name = "crane_puff_l_spawn"
desc = """Script subroutine of the dolls (calls at 3B:AD49, 3B:AD7A, 3B:AE24, 3B:AE56): variable 1 = 0 and an object of type $67 8 pixels to the left (asm_spawn_any) with variable 1 = $0A (crane_puff_l), ret."""

[[script]]
at = "3B:B220"
name = "crane_puff_r_spawn"
desc = """The same to the right (calls at 3B:AD05, 3B:ADE4): an object of type $67 8 pixels to the right with variable 1 = $0B (crane_puff_r), ret."""

[[script]]
at = "3B:B22D"
name = "crane_puff_l"
desc = """Part $0A, a puff where a doll lands: Z $80, picture 3A:855E, X velocity -$80, Y velocity -$400, pose 0; Y velocity -$200 and -$100 two frames apart, then the object ends."""

[[script]]
at = "3B:B243"
name = "crane_puff_r"
desc = """Part $0B, the same puff moving right (X velocity $80)."""

[[script]]
at = "3B:B259"
name = "crane_result"
desc = """Part 6, the result banner (created by the manager after the last credit): with crane_won 0 at ($80, $71), Z $81, music $2E and a far jump to minigame_banner_none ("NO BONUS"); otherwise crane_result_won."""

[[script]]
at = "3B:B270"
name = "crane_result_won"
desc = """At ($7E, $100), music $30, a far jump to minigame_banner_bonus ("BONUS")."""

[[script]]
at = "3B:B27E"
name = "crane_prizes"
desc = """Part 7, the prize picture below the machine: picture 3A:9589, crane_prize_pose, at ($38, $150), then crane_prizes_wait."""

[[script]]
at = "3B:B28B"
name = "crane_prizes_wait"
desc = """Each frame until $07BE is set (crane_tick_scroll has brought the prizes into view); 100 frames, pose 0, and a jump table on crane_prize_2: 0 crane_prizes_off, 1 crane_prizes_wait2; 2 falls through (pose 1, 3B:B2A0: never ran)."""

[[script]]
at = "3B:B2A2"
name = "crane_prizes_wait2"
desc = """30 frames, then crane_prizes_off."""

[[script]]
at = "3B:B2A4"
name = "crane_prizes_off"
desc = """No pose, halt."""

[[script]]
at = "3B:B2A7"
name = "crane_prize1_pic"
desc = """Part 8, the prize of the first credit: picture 3A:9651 at ($A8, $134), then crane_prize1_wait."""

[[script]]
at = "3B:B2B1"
name = "crane_prize1_wait"
desc = """No pose each frame until $07BE is set; 100 frames, pose 0, and a jump table on crane_prize_1: 0 the object ends (crane_prize_none), 1 3B:B2CC (crane_prize1_pay; never chosen), 2 3B:B2C8 (crane_prize1_big, which goes on into crane_prize1_pay; once, cov4-d-crane@6146; both in unit scn_cov4)."""

[[script]]
at = "3B:B2DB"
name = "crane_prize2_pic"
desc = """Part 9, the prize of the second credit: picture 3A:9651 at ($A8, $154), then crane_prize2_wait."""

[[script]]
at = "3B:B2E5"
name = "crane_prize2_wait"
desc = """No pose each frame until $07BE is set; 130 frames, pose 0, and a jump table on crane_prize_2: 0 crane_prize_none, 1 crane_prize_pay, 2 crane_prize_big."""

[[script]]
at = "3B:B2FC"
name = "crane_prize_big"
desc = """The big doll: the next pose ("2UP") and one crane_life, then crane_prize_pay."""

[[script]]
at = "3B:B300"
name = "crane_prize_pay"
desc = """crane_life; when crane_prize_1 is 0 the picture moves up to Y $13E (the first row is empty); then crane_prize_sound."""

[[script]]
at = "3B:B30C"
name = "crane_prize_sound"
desc = """Sound $16, then crane_prize_blink."""

[[script]]
at = "3B:B310"
name = "crane_prize_blink"
desc = """The pictures 3A:9651 and 3A:9655 two frames each, in a loop."""

[[script]]
at = "3B:B31F"
name = "crane_prize_none"
desc = """The object ends (no prize for this credit)."""

[[script]]
at = "3C:AA2C"
name = "qd_duel_open"
desc = """Part 1 of qd_start, where the manager goes when the desert has scrolled in: variable 6 = 0, move routine 3E:D8D5, the sign in slot 2 (part 3, asm_spawn_slot: qd_sign), one frame, variable 2 of slot 2 = $FF, and it falls into qd_round."""

[[script]]
at = "3C:AA74"
name = "qd_won_round"
desc = """Where qd_tick_draw sends the manager when A or B came before the opponent (rounds 1-4): qd_round_music, the clock sign in slot 9 (part $15: qd_clock), the three shot effects (qd_shots), and a jump table on variable 7 (the round): 0 and 1 qd_won_pose; 2 and 3 fall through (pose $0E, X velocity -$100, -$80, -$20 five frames each, velocity 0) to qd_won_wait."""

[[script]]
at = "3C:AA9C"
name = "qd_won_pose"
desc = """Pose $0D, three times the poses 1 and 2 one frame each, 4 frames, then qd_won_wait."""

[[script]]
at = "3C:AAA6"
name = "qd_won_wait"
desc = """64 frames, the tick qd_tick_next, halt. The same run holds the fifth round's win (3C:AAAD, from qd_tick_draw: qd_round_music, Kirby at ($65, $90), velocity 0, the clock sign in slot 9, the shot effects, his hat in slot 5 (part $14: qd_hat_kirby), three small steps back and forth, 40 frames, the tick qd_tick_next) and the walk back (3C:AAE2, from qd_tick_next: X $60, three rounds of the poses $0A, $0D, $0C, $0B two frames each, pose 1, then qd_hat_wait)."""

[[script]]
at = "3C:AAF2"
name = "qd_hat_wait"
desc = """Pose 0 each frame until variable 6 is set (qd_hat_landed: the beaten opponent's hat is down); then variable 6 = 0, the clock sign freed (slot 9, asm_free), the tick qd_round_won, halt. The same run holds the next round (3C:AB05, from qd_round_won): 16 frames, the next opponent in slot 6 (part 8: qd_foe_drop) and qd_round."""

[[script]]
at = "3C:AB15"
name = "qd_shot"
desc = """Where qd_tick_draw sends the manager when the opponent fired first: Kirby at ($58, $8C), move and position routines, velocity 0, the clock sign (slot 9, part $15), his hat flies off (slot 5, part $11: qd_hat_off), qd_lost = 1, the camera's X velocity -$200 (set_e2) with the tick qd_tick_pan, the shake thread qd_shake; he is thrown back (Y velocity -$200 and -$100 with the poses 7 and 8, then slower, six or eight frames each), a puff (slot 4, part $12: qd_puff), X velocity -$80 down to 0, no tick, cam_vx 0, 53 frames; with variable 7 = 0 qd_lost_result (3C:B856 otherwise, never ran)."""

[[script]]
at = "3C:ADCB"
name = "qd_clock"
desc = """Part $15, the clock sign that shows the reaction time: at ($20, $60), picture 3A:9E04; qd_lost 0: qd_clock_won, otherwise qd_clock_lost."""

[[script]]
at = "3C:ADDB"
name = "qd_clock_lost"
desc = """Pose 1 for 6 frames, the next for 10, in a loop."""

[[script]]
at = "3C:ADE1"
name = "qd_clock_won"
desc = """Pose 0 for 4 frames, the next for 2, in a loop."""

[[script]]
at = "3C:AE24"
name = "qd_puff"
desc = """Part $12 (from qd_shot): picture 3A:9DEF at ($65, $8C), move and position routines, a few poses (qd_rts called once), X velocity $10 then -$40, Y velocity -4 then -$10, the object ends."""

[[script]]
at = "3C:AE66"
name = "qd_fx_a"
desc = """Part $16, the first shot effect (slot 10): qd_fx_round, picture 3A:9C62, qd_fx_foe; for the opponent's shot (answer 1) picture 3A:9C58; then qd_fx_a_go."""

[[script]]
at = "3C:AE77"
name = "qd_fx_a_go"
desc = """The pose of variable 7, variable 5 = 0, qd_fx_place, Z 1, variables 3 and 4 = 0, the tick qd_fx_tick (which frees it), 2 frames, qd_fx_pose, 8 frames, qd_fx_pose, halt."""

[[script]]
at = "3C:AE97"
name = "qd_fx_b"
desc = """Part $17, the second shot effect (slot 11): qd_fx_round, picture 3A:9CAC, variable 5 = 1, 2 frames, a pose thread (qd_fx_b_anim), then qd_fx_go."""

[[script]]
at = "3C:AEA6"
name = "qd_fx_go"
desc = """qd_fx_round, qd_fx_place, Z 0, variables 3 and 4 = 0, the tick qd_fx_tick, halt."""

[[script]]
at = "3C:AEBA"
name = "qd_fx_b_anim"
desc = """Thread: the poses 0, 1, 2, 1, 0 (2, 2, 8, 2, 2 frames), no pose, the thread ends."""

[[script]]
at = "3C:AEC3"
name = "qd_fx_c"
desc = """Part $18, the third shot effect (slot 12): picture 3A:9CAC, variable 5 = 1, 4 frames, a pose thread (qd_fx_c_anim), then qd_fx_go."""

[[script]]
at = "3C:AED2"
name = "qd_fx_c_anim"
desc = """Thread: the poses 1, 2, 1, 0 (2, 6, 4, 4 frames), no pose, the thread ends."""

[[script]]
at = "3C:B109"
name = "qd_hat_off"
desc = """Part $11 (slot 5, from qd_shot): Kirby's hat flies off: variable 3 = 0, move and position routines, at ($60, $90), picture 3A:9CC1, a long list of velocities and poses (up, then tumbling down, four to six frames each), velocity 0, the poses 4 and 6, 60 frames, variable 3 = 1, halt."""

[[script]]
at = "3C:B1ED"
name = "qd_hat_kirby"
desc = """Part $14 (slot 5, at the fifth win): Kirby's hat at ($65, $84), picture 3A:9CC1, three small shakes (X velocity $10 and -$10, the poses 4 and 3), pose 4, velocity 0, halt."""

[[script]]
at = "3C:B209"
name = "qd_sign"
desc = """Part 3, the sign at the top (slot 2): at ($80, $40), variable 7 = 0 (the picture of the round), picture 3A:9D19, the pose of variable 7, 32 frames, then qd_sign_blink."""

[[script]]
at = "3C:B21A"
name = "qd_sign_blink"
desc = """No pose and the pose of variable 7, seven frames each, in a loop."""

[[script]]
at = "3C:B227"
name = "qd_sign_next"
desc = """From qd_round_won: the pose of variable 7 (the next round's picture), music $1A, 20 frames, then qd_sign_blink2."""

[[script]]
at = "3C:B22F"
name = "qd_sign_blink2"
desc = """The same blink loop. The same run holds "FIRE!" (3C:B238, which qd_round gives slot 2 through asm_obj_script): pose 5, halt."""

[[script]]
at = "3C:B260"
name = "qd_banner"
desc = """Part 9, a banner, also the first letter of PERFECT!: a jump table on variable 0: 0 qd_letter_p, 1 qd_banner_lost, 2 3C:B285 (at ($80, $50), Z $81, on into minigame_banner_bonus; read once each in cov2-minigame-bonus, cov2-minigame-qd2 and cov4-d-qd)."""

[[script]]
at = "3C:B26B"
name = "qd_banner_lost"
desc = """Move and position routines, at ($80, $40), Z $81, then minigame_banner_none."""

[[script]]
at = "3C:B27A"
name = "minigame_banner_none"
desc = """The "NO BONUS" banner of all three games: picture 3A:9E25, pose 0, 15 frames, $07CC = 1, halt. Crane Fever's result (3B:B26C) jumps here with crane_won 0, Quick Draw through qd_banner_lost, Egg Catcher from 3B:A4BC (never ran)."""

[[script]]
at = "3C:B28E"
name = "minigame_banner_bonus"
desc = """The "BONUS" banner: picture 3A:9E25, pose 1, 15 frames, $07CC = 1, halt (crane_result_won and egg_banner_bonus jump here)."""

[[script]]
at = "3C:B299"
name = "qd_letter_p"
desc = """A letter of the PERFECT! banner (pose 2 of picture 3A:9E25; parts 9-$10, created in turn by qd_won_result): it waits 5 frames with no pose, flies in up and to the side with the pose, stops and holds 16 frames, halt."""

[[script]]
at = "3C:B2AE"
name = "qd_letter_e"
desc = """A letter of the PERFECT! banner (pose 3 of picture 3A:9E25; parts 9-$10, created in turn by qd_won_result): it waits 8 frames, flies in up and to the side with the pose, stops and holds 16 frames, halt."""

[[script]]
at = "3C:B2C3"
name = "qd_letter_r"
desc = """A letter of the PERFECT! banner (pose 4 of picture 3A:9E25; parts 9-$10, created in turn by qd_won_result): it waits 13 frames, flies in up and to the side with the pose, stops and holds 16 frames, halt."""

[[script]]
at = "3C:B2DA"
name = "qd_letter_f"
desc = """A letter of the PERFECT! banner (pose 5 of picture 3A:9E25; parts 9-$10, created in turn by qd_won_result): it waits 19 frames, flies in up and to the side with the pose, stops and holds 16 frames, halt."""

[[script]]
at = "3C:B2EE"
name = "qd_letter_e2"
desc = """A letter of the PERFECT! banner (pose 3 of picture 3A:9E25; parts 9-$10, created in turn by qd_won_result): it waits 24 frames, flies in up and to the side with the pose, stops and holds 16 frames, halt."""

[[script]]
at = "3C:B302"
name = "qd_letter_c"
desc = """A letter of the PERFECT! banner (pose 6 of picture 3A:9E25; parts 9-$10, created in turn by qd_won_result): it waits 29 frames, flies in up and to the side with the pose, stops and holds 16 frames, halt."""

[[script]]
at = "3C:B319"
name = "qd_letter_t"
desc = """A letter of the PERFECT! banner (pose 7 of picture 3A:9E25; parts 9-$10, created in turn by qd_won_result): it waits 35 frames, flies in up and to the side with the pose, stops and holds 16 frames, halt."""

[[script]]
at = "3C:B330"
name = "qd_letter_bang"
desc = """A letter of the PERFECT! banner (pose 8 of picture 3A:9E25; parts 9-$10, created in turn by qd_won_result): it waits 45 frames, flies in up and to the side with the pose, stops and holds 16 frames and $07CC = 1, halt."""

[[script]]
at = "3C:B3FD"
name = "qd_foe"
desc = """Part 2, the first opponent (slot 6): variable 7 = 0, qd_foe_enter (the round, its Y and palette), at ($A0, $90), picture 3A:971A, the pose of variable 7 (one opponent per round), velocity 0, halt."""

[[script]]
at = "3C:B411"
name = "qd_foe_drop"
desc = """Part 8, the next round's opponent (slot 6, from qd_hat_wait's next round): at ($A0, $20), qd_foe_enter, Y velocity $700 for 16 frames (it drops in), velocity 0, halt. The same run holds 3C:B427 (from qd_round at FIRE): position routine 3E:D9BB, variables 2 and 3 = 0, pose variable 7 + 5, qd_foe_wait (the opponent's reaction time becomes its wait); when the wait is over: qd_shots, variable 2 = 1 (it has fired), halt."""

[[script]]
at = "3C:B43F"
name = "qd_shots"
desc = """Script subroutine: variable 1 = 0 and the three shot effects in slots 10, 11, 12 (parts $16, $17, $18 by asm_spawn_slot), ret. The same run holds 3C:B461 (from qd_tick_draw when the opponent fired first: qd_round_music and a flicker of the poses variable 7 + 5 and + 10, halt) and 3C:B476 (from qd_tick_draw when Kirby won the round: 4 frames, at ($B8, $78), the tick qd_foe_fly_tick with variable 0 = $10, pose variable 7 + 10, the shake thread qd_shake, variable 1 = 0, and a jump table on variable 7: rounds 0-3 qd_hat_spawn; round 4 falls through to an object of type $65 with variable 1 = 6 in any slot and qd_foe_beaten)."""

[[script]]
at = "3C:B4A8"
name = "qd_hat_spawn"
desc = """The opponent's hat: an object of type $65 8 pixels to the right with variable 1 = 6 (qd_hat), in slots $0D-$10 (asm_spawn), then qd_foe_beaten."""

[[script]]
at = "3C:B4B3"
name = "qd_foe_beaten"
desc = """The pose 10 higher, 40 frames, no tick (clear_tick), halt."""

[[script]]
at = "3C:B4B9"
name = "qd_shake"
desc = """Thread (qd_shot, and the beaten opponent): the view shakes as in egg_shake (add_e0 / add_dd by 2 or 4 every 2 frames, back to the start), and the thread ends."""

[[script]]
at = "3C:B587"
name = "qd_hat"
desc = """Part 6, the beaten opponent's hat: at ($BF, $75), qd_hat_round (variable 7 = the round), a jump table on it: rounds 0-2 qd_hat_fly, 3 qd_hat_bounce; round 4 falls through: 80 frames, then qd_hat_last."""

[[script]]
at = "3C:B5A1"
name = "qd_hat_bounce"
desc = """Round 3's hat: a pose thread (qd_hat_bounce_anim), at ($BF, $70), picture 3A:974C, three arcs up and right, then twice seven bounces (qd_hat_hop), velocity 0, 128 frames, qd_hat_land."""

[[script]]
at = "3C:B5D8"
name = "qd_hat_bounce_anim"
desc = """Thread of qd_hat_bounce: poses of variable 7 plus 20, 0, 5, 25 (two frames each) three times, then poses around it three frames each twice, and the thread ends."""

[[script]]
at = "3C:B5F9"
name = "qd_hat_hop"
desc = """Script subroutine: X velocity $80 and Y velocity $200 for a frame, X $20 and Y $100 for two, ret."""

[[script]]
at = "3C:B606"
name = "qd_hat_hop_l"
desc = """Script subroutine: X velocity -$80 and Y velocity $200 for a frame, X -$20 and Y $200 for two, ret."""

[[script]]
at = "3C:B613"
name = "qd_hat_hop_l2"
desc = """Script subroutine: X velocity -$80 and Y velocity $200 for a frame, X -$20 and Y $100 for two, ret."""

[[script]]
at = "3C:B620"
name = "qd_hat_fly"
desc = """Rounds 0-2: at ($BF, $75), picture 3A:974C, three arcs (X velocity $200 down to 8, Y -$200 up to -$20, a frame each, the poses of variable 7 + 15, + 5, + 10 ...), twice a slow tumble down (four-frame steps), velocity 0, 100 frames, then qd_hat_land."""

[[script]]
at = "3C:B6B8"
name = "qd_hat_land"
desc = """The hat on the ground: picture 3A:978C, the pose of variable 7, Y $A4, qd_hat_landed (variable 6 of slot 1 = 1, qd_hat_place), the tick qd_hat_tick, halt."""

[[script]]
at = "3C:B6D6"
name = "qd_hat_last"
desc = """The fifth opponent's hat: qd_hat_landed and halt."""

[[script]]
at = "3C:B6DA"
name = "qd_hat_fall"
desc = """Part $19 (created by qd_won_result): qd_hat_round, at ($C0, 1), picture 3A:974C, a pose thread (qd_hat_fall_anim), three times three qd_hat_hop_l and four qd_hat_hop_l2, velocity 0, 16 frames, halt."""

[[script]]
at = "3C:B70D"
name = "qd_hat_fall_anim"
desc = """Thread of qd_hat_fall: three rounds of poses around variable 7 (three frames each), and the thread ends."""

[[script]]
at = "3C:B861"
name = "qd_lost_result"
desc = """The end of a lost game (from qd_shot): variable 3 = 0, qd_chr5_60, variable 1 = 9 and an object of type $65 with variable 0 = 1 (qd_banner: "NO BONUS"), music $2E, 128 frames, then qd_end_wait."""

[[script]]
at = "3C:B909"
name = "qd_result_screen"
desc = """Script subroutine of qd_won_result: minigame_clear_3c, no pose, 32 colours from 3C:AA0C, qd_chr5_60, qd_result_draw, set_dd and set_e0 0 (the camera at 0), ret."""

[[script]]
at = "3C:B972"
name = "qd_won_result"
desc = """After the fifth won round (qd_round_won): 30 frames, four fade_down steps, qd_result_pick (1 would go to 3C:B89B, never ran), qd_result_screen, four fade_up steps, at ($80, $80), variable 3 = 2, picture 3A:9E9C, qd_result_attr, variable 2 = 0, 15 frames; four times sound $16, qd_result_hat (one hat more on the board), the pose of variable 2, 15 frames; a hat that falls (part $19: qd_hat_fall), 20 frames, music $2F, 60 frames, variable 2 = 5 and its pose ("3UP"), $07CC = 0, variable 1 = 9 and eight objects of type $65 (parts 9-$10: the letters of PERFECT!), qd_pay, a thread at 3C:BA00, and on into qd_end_wait."""

[[script]]
at = "3C:B9E4"
name = "qd_end_wait"
desc = """64 frames, then minigame_end, which follows it."""

[[script]]
at = "3C:BB16"
name = "egg_obj_gone"
desc = """Where egg_tick_bounce sends an egg or bomb that fell out of the ring: sound $0E, velocity 0, 20 frames, the object ends."""

[[script]]
