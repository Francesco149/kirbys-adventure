unit = "scr_scn"
title = "Scripts of the minigames, the scenes and the pause that started at labels of their own"
summary = """
The scripts of the minigames, the last scenes, the level cards, the intro, the file select and the pause that start at
labels of their own: entries of a part table that land after another unit's documented script, the targets of jumps
and jump tables, and the scripts that 6502 tick routines install with obj_set_script. The routines, tables and RAM
they use are named by units minigame, leftovers, scenes, scenes2, rooms2 and fixed; this unit names the scripts only,
in the owners' prefixes.

Crane Fever (bank 3B, type $67): the claw after the button is let go (crane_claw_lower, slip / grab / miss, rise,
carry home, crane_claw_home: one credit less and the next credit or the end), the doll the claw holds (grabbed, lifted,
risen, dropped into the chute), the credit counter, the arrow, the bubbles, the puffs where a doll lands, the result
banner and the prize pictures that pay crane_life. Egg Catcher (banks 3B, 3A, 3C, type $66): Kirby (his entrance and
the scripts egg_tick_mouth switches between are one run, egg_kirby), the bomb's blast and the shake of the view,
Dedede (entrance, walk, throw, stop, jump), the ball, the lights over the ring, the bonus box and the banners. Quick
Draw (bank 3C, type $65): the manager's won and lost rounds, the clock sign, the three shot effects, Kirby's hat, the
round sign and "FIRE!", the opponents (they drop in, wait their reaction time and fire, or fly off), their hats (fly,
bounce, land: qd_hat_landed ends the round), the win board with the letters of PERFECT!, and the lost result. The
"NO BONUS" and "BONUS" banners (3C:B27A, 3C:B28E) are shared by all three games.

The last scenes (bank 36): the shooting stars of the flight to the last fight (parts 1, 3-$0C of finale_start, with
the star bursts of part $0F), the palette thread of finale_fountain and finale_rod_kirby, where that object becomes
Kirby with the Star Rod; world 7's card: the planet and the four twinkling stars. The level cards (bank 34): a
subroutine of world 0's figures and the second figures of worlds 4 and 6. Also: the intro's skip (intro_skipped),
fsel_new_game, the pause screen's opening and closing scripts (type 9), the star burst of star_burst_spawn (13:A8CC)
and the ending's idle part 7.

Every claim is a vmop claim over a group of instructions found by address and operands in windows of the group's
movies: jumps and branches go where the register says, waits, poses, velocities, positions, pictures and RAM bytes are
set to the operands, the spawns create the named part, and each listed instruction runs at least once.

Open:
- Many scripts ran once (one game of each minigame, one pass through the last scenes); their never-run branches are
  named in the descriptions: crane 3B:AEEA / 3B:AEF4 (the claw's other side), egg 3B:A4B6, 3B:A4CA, 3B:A4D4 (the
  results with 0 or 30 eggs), finale_star_2 (36:BC59). The branches that the fourth coverage batch ran (crane 3B:AEA7,
  3B:AF04, 3B:B2C8 / 3B:B2CC; egg 3B:A23D, 3B:A377, 3B:A38C, 3B:A41A, 3B:A430; Quick Draw 3C:B371; the pause's 38:AFF4)
  are described by unit scn_cov4; Quick Draw's 3C:B856 / 3C:B89B by unit scenes3.
- What the pictures of the finale's shooting stars and of the ball after the bomb (3A:85DE) show is taken from the
  screen, not from the sprite data; the purpose of $07CC (set by the banners, cleared by the PERFECT! board) and of
  $07BE / $07C1 is described by who sets and waits for them only.
- The scripts that start at undocumented labels in the 1x minigame listings but never ran (3C:ADE8, 3C:AE06,
  3C:AE4C, 3C:B6FD, 36:BC59, 36:BF60) are not named; 3B:A430 (egg_chick) and 3C:B371 (qd_cross) ran in the fourth
  batch and are named by unit scn_cov4.
"""

