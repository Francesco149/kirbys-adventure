unit = "kst_cov3"
title = "Kirby's states first run in the third batch of coverage movies: Ball, Hammer's walk, run and air, the Star Rod's crouch and slide, Sword and Parasol on a ladder, standing in water with the mouth full"
summary = """
What the cov3 movies made Kirby do for the first time in banks 14-19, and the helpers of banks 16, 21 and 22 that
they reached by a new way.

  state / place                    entry                      what it does
  Ball ($11), kirby_form $0B       kirby_s_ball               B with Ball (entry $11 of kirby_s_ability, unit kst18):
                                                              kirby_s_ball_init, sound $4C, a puff (fx 3), 16 frames,
                                                              then kirby_s_ball_resume picks $D2 stand, $D3 roll or
                                                              $D7 air by kirby_resume_pick
  Ball, stand ($D2)                kirby_st_ball_stand        the side held -> roll; A -> jump; B -> leave ($D9)
  Ball, roll ($D3)                 kirby_st_ball_roll         eight poses (ball_roll_pose every 2 frames); at a wall
                                                              ball_walls turns him round (kirby_vx negated) and the
                                                              roll starts again; speed 0 -> stand; back -> turn ($D4)
  Ball, turn ($D4)                 kirby_st_ball_turn         braking; speed 0 -> stand
  Ball, jump ($D5 / $D6)           kirby_st_ball_jump_held    kirby_vy $FC70 for 23 frames while A is held, then $FF50
                                                              for 5 frames (kirby_st_ball_jump_rise), then the air
  Ball, air ($D7)                  kirby_st_ball_air          gravity profile 5; on a floor ball_land bounces him:
                                                              kirby_vy * $0166 (A held), * $004C (Down), * $00B3
                                                              (neither) / 256, below $0180 none, upwards; then $D8
  Ball, bounce ($D8)               kirby_s_ball_bounce        ball_bounce_pick: still -> $D2, rolling -> $D3, a bounce
                                                              upwards -> $D7
  Ball, fast                       ball_rect, hook_blink_rect at a Y speed of 3 pixels a frame or more: kirby_rect kind 5
                                                              (7 x 7 around him, power $10) and Kirby flashes
  Ball, leave ($D9)                kirby_s_ball_leave         sound $4C, the puff, 16 frames, kirby_s_ab_reset
  Hammer, walk ($99 / $9A)         kirby_st_hammer_walk       the chain of kirby_st_walk with Hammer's scripts; the walk
                                                              cycles of hammer_walk_cycles
  Hammer, run ($9B / $9C)          kirby_st_hammer_run        the chain of kirby_st_run
  Hammer, skid ($9D)               kirby_st_hammer_skid       the chain of kirby_st_turn
  Hammer, swing in the air ($A8)   kirby_st_hammer_air_swing  eight poses from $54, 2 frames each: the hammer once round
                                                              him (hammer_air_swing_rect, break_rect_2)
  Hammer, inflate / flap / float / puff ($A9, $AA, 17:B539, $AD)    the counterparts of kirby_s_inflate, kirby_s_flap,
                                                              kirby_s_float, kirby_s_puff with Hammer's poses $74-$7E
  Star Rod, crouch ($89)           kirby_st_rod_duck          A or B -> slide; Down released -> $7C
  Star Rod, slide ($8A)            kirby_st_rod_slide         rod_slide_rect (power 2), break_rect_0; slow -> $7D
  Star Rod in flight, low ($EC)    kirby_s_rodfly_fall        the flight's exit at rodfly_cam_low: sprite map 1C:8DA6,
                                                              pose $48, kirby_s_die
  Sword / Parasol on a ladder      kirby_st_sword_ladder,     kirby_st_ab_ladder's shape (unit kst_abl) with their own
  ($6F / $C4)                      kirby_st_para_ladder       poses; leaving gives kirby_s_sword_enter / kirby_s_para_enter
  second set on a ladder, Up       ab_ladder_waits / _poses   the climbing cycle of kirby_st_ab_ladder (bank 14)
  mouthful in water, stand ($5B)   kirby_st_full_water_stand  the side held -> $5C (wade); otherwise kirby_upkeep
  the star shot in water           kfx_shot_star_water        the tick becomes kfx_star_hit (16:B420) and it sinks
  the Big Switch                   kirby_s_switch_pan         kirby_s_start's jump for $05A2 not 0 in the hub:
                                                              switch_save (save_stage_end), hub_pan_setup_8 (the door
                                                              of stage_door | 8), the pan and the reveal

Every state routine is a fixed chain of tests as in units kst14 and kst_abl: the first that answers yes names the next
script (ldx #n / jmp kirby_script_upkeep), with none the routine ends in kirby_upkeep. The claims use kpath of model
kabl (unit kst_abl): exactly one exit ran, no test before it answered yes as far as the pad shows it, and Kirby's
thread is at that script's address afterwards. Script numbers are kirby_script_lo indexes; Ball's set is $D2-$D9 of
bank 19, Hammer's $97-$B2 of bank 17.

Bank 22: obj_vel_dir (22:93A1, obj_vel_polar's body: both velocities from obj_dir and the speed in $00 / $01, called
by 29:BAB2 and jumped to by e17_tick_home / e17_set_dir), obj_vx_faced (22:93C0: the X velocity A / Y mirrored by
obj_dir), obj_pose_dir1 (22:8838: obj_pose_dir with pose 1, once in cov3-b-frosty).

Open:
- Never ran: Ball's exits to $D7 from stand, turn and the jump's ceiling and top tests, every door, water_entered ($33) in the air, the rising branch of
  ball_land (19:B5C7), the bump branch of kirby_s_ball_turn (19:B45F), 19:B307 (a second entry into Ball through
  kirby_s_ball_init); A ($D5) and B ($D9) from the stand and B from the roll and the jump first ran in cov5-h-ball (claims
  kst_cov5.ball_stand.exits, kst_cov5.ball_roll.exits, kst_cov5.ball_jump_rise.exits). In Hammer's walk and run: floor_kind_changed, and the run's door (the ladder, Down, A from the run, B,
  the walk's door, Up, Select, the wall and the floor first ran in cov4-c-hammer: claims kst_cov4.hammer_walk.exits
  and kst_cov4.hammer_run.exits); in the skid the wall and the floor (A and B ran in cov4-c-hammer); the walk cycles of slopes past the first pose (17:ACEF-AD2B); in the flap water_entered ($AB) and the float's door (the doors of the inflate and the flap ran in cov4-c-hammer;
  the air swing's water_entered / water_left and the float's water_entered, with script $AB, 17:B593, first ran in
  cov5-h-hammer: claims kst_cov5.hammer_air_swing.exits, kst_cov5.hammer_float.exits, unit kst_cov5); the bump of the run (17:ADD2) first ran in cov5-h-hammer@93157 (claim
  kst_cov5.hammer_bump.shown); the puff's way
  back to the inflate (17:B602 taken); script $AC (17:B5A1) and 17:B63F-B65F. In the rod's
  crouch: no floor, down_bit5_test ($88); in its slide the wall and floor exits. The Sword's ladder never wrapped its
  step counter (15:A699); the Parasol's ladder left (15:B3F0, Left / Right held) only in cov4-c-para (claim
  kst_cov4.para_ladder.exit), and its shape test never answered. The mouthful's
  water stand: the first no-floor exit (18:B4D8) and the door (A or Up, Down and B first ran in cov5-h-full: claim
  kst_cov5.full_water_stand.exits).
- 22:8838 ran once (cov3-b-frosty@14355); which script calls it is in another unit.
- The Big Switch's pan ended after one frame (hub_pan_step was done at once) and the movie ends at 15:BC3F; what
  follows (15:BC3F-BC4B) never ran. $05A2 is not named here.
- What kind 5 of kirby_rect (Ball) and kind 1 (the rod's slide, second pose) mean to the hit test is not claimed.
"""

