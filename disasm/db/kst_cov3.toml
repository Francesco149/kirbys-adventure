name = "kcov3"
code = '''
ROD_SLIDE = [0xD9, 0xE0, 0xE7, 0xEE, 0xA6, 0xA6, 0xA6, 0xA6, 0x04, 0xFB, 0xFF, 0x08, 0x00, 0x0D, 0x0D, 0x04, 0x05, 0x00, 0x08, 0x00, 0x0D, 0x0D, 0x01, 0x06, 0x00, 0x05, 0x00, 0x04, 0x02, 0x01, 0xFA, 0xFF, 0x05, 0x00, 0x04, 0x02]
HAMMER_AIR = [0x59, 0x60, 0x67, 0x6E, 0x75, 0x7C, 0x83, 0x8A, 0x8A, 0x83, 0x91, 0x98, 0x7C, 0x75, 0x9F, 0xA6, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0xB4, 0x04, 0x06, 0x00, 0xF0, 0xFF, 0x04, 0x04, 0x04, 0xFA, 0xFF, 0xF0, 0xFF, 0x04, 0x04, 0x04, 0x0F, 0x00, 0xF9, 0xFF, 0x04, 0x04, 0x04, 0xF1, 0xFF, 0xF9, 0xFF, 0x04, 0x04, 0x04, 0x0F, 0x00, 0x07, 0x00, 0x04, 0x04, 0x04, 0xF1, 0xFF, 0x07, 0x00, 0x04, 0x04, 0x04, 0x06, 0x00, 0x0F, 0x00, 0x04, 0x04, 0x04, 0xFA, 0xFF, 0x0F, 0x00, 0x04, 0x04, 0x04, 0xF1, 0xFF, 0x06, 0x00, 0x04, 0x04, 0x04, 0x0F, 0x00, 0x06, 0x00, 0x04, 0x04, 0x04, 0xF9, 0xFF, 0xF1, 0xFF, 0x04, 0x04, 0x04, 0x07, 0x00, 0xF1, 0xFF, 0x04, 0x04]
BALL_FACTOR = [0x0166, 0x004C, 0x00B3]
BALL_REC = [0x05, 0x00, 0x00, 0x00, 0x00, 0x07, 0x07]
LADDER_VY = [0xFECD, 0x0133, 0]
SW_LADDER = [0x04, 0x0A, 0x04, 0x0A, 0x80, 0x7F, 0x80, 0x7E, 0xCD, 0x33, 0x00, 0xFE, 0x01, 0x00, 0x06, 0x07, 0x00, 0x00]
PARA_LADDER = [0x04, 0x0A, 0x04, 0x0A, 0x70, 0x6F, 0x70, 0x6E, 0xCD, 0x33, 0x00, 0xFE, 0x01, 0x00, 0x06, 0x07, 0x00, 0x00]
AB_LADDER = [0x04, 0x0A, 0x04, 0x0A, 0x6E, 0x6D, 0x6E, 0x6C]

def fki(k):
    """floor_kind_index: floor_kind 2-5 -> 0-3, else 4"""
    return k - 2 if 2 <= k <= 5 else 4

def climb_ok(ran, rd, wr, mem, at_step, waits, poses):
    """the climbing path of a ladder routine: variable 2 of slot 1 counts down; when it goes below 0 variable 3 counts
    down (3 after 0) and variable 2 = waits[variable 3]; the pose is poses[variable 3]"""
    if ran(at_step):
        n = rd[0x6201] - 1 if rd[0x6201] else 3
        if wr.get(0x6201) != n or wr.get(0x61EF) != waits[n]:
            return False
    elif wr.get(0x61EF) != (rd[0x61EF] - 1) & 0xFF:
        return False
    return wr.get(0x62C7) == poses[mem(0x6201)]

def ladder(ran, rd, wr, mem, went, ats, to, waits, poses, dpose):
    """ats: the climb, step, descend, still and exit instructions. 'ok' when exactly one of climb / descend / still ran,
    kirby_vy is LADDER_VY of it, the descent ran exactly with Up not held and Down held and set dpose, the climb only
    with Up held (climb_ok), and Kirby's thread went to `to` exactly when the exit ran, which it did with Left or Right."""
    a_climb, a_step, a_down, a_still, a_exit = ats
    up, dn, side = rd[0xE6] & 8, rd[0xE6] & 4, rd[0xE6] & 3
    if (ran(a_climb) > 0) + (ran(a_down) > 0) + (ran(a_still) > 0) != 1:
        return 'paths'
    k = 0 if ran(a_climb) else 1 if ran(a_down) else 2
    if (wr[0x5BD] | wr[0x5BE] << 8) != LADDER_VY[k]:
        return 'vy'
    if ran(a_down) != int(not up and dn != 0):
        return 'descend'
    if ran(a_down) and wr.get(0x62C7) != dpose:
        return 'descend pose'
    if ran(a_climb) and not (up and climb_ok(ran, rd, wr, mem, a_step, waits, poses)):
        return 'climb'
    if (went == to) != bool(ran(a_exit)):
        return 'exit %r' % went
    if side and not ran(a_exit):
        return 'side held, no exit'
    return 'ok'

def ball_land(ran, rd, wr, rp):
    """ball_land: on a floor (19:B5AF ran) kirby_vy = -((kirby_vy * factor) >> 8), 0 below $0180, the factor by the pad
    (A held, Down held, neither); carry set. No floor: kirby_vy not written, carry clear."""
    if not ran('19:B5AF'):
        return 0x5BD not in wr and rp & 1 == 0
    pad = rd[0xE6]
    f = BALL_FACTOR[0 if pad & 0x80 else 1 if pad & 4 else 2]
    p = ((rd[0x5BD] | rd[0x5BE] << 8) * f >> 8) & 0xFFFF
    if p < 0x180:
        p = 0
    return (wr[0x5BD] | wr[0x5BE] << 8) == (-p) & 0xFFFF and rp & 1 == 1
'''

