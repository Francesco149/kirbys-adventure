# ================================================================= type $30: the ambush

[[data]]
at = "27:A60F"
len = 24
name = "e30_lists"
format = "ptr16"
desc = """
The wave list of an ambush by the variable 1 of its kind (0-11): 27:A8C0, A851, A7EE, A7C3, A77C, A711, A6D6, A643,
and for 8-11 the four stubs at 27:A63C, A635, A62E, A627. The lists 0, 2, 3, 4 and 5 ran.
"""

[[data]]
at = "27:A627"
len = 728
name = "e30_waves"
format = "bytes"
desc = """
The twelve wave lists of e30_lists. A list begins with seven bytes: the number of knights, the length of the
ENEMY bar (number x step), the step of the bar per knight, and the offsets of four lanes. A lane is a row of
4-byte entries ended by $FF: object type, variable 0, X, Y (a place on the screen; the rooms of an ambush are one
screen). The type is $32-$35 (a knight, variable 0 = its variant) or $31 with variable 0 = 8-$0C (nothing for
30, 60, 120, 180 or 240 frames) or $0D (a puff at the place where the next knight appears). X = $00 or $FF
is a knight that walks in from the side. The lanes run side by side; a lane takes its next entry when its
object has reported back (e30_tick). The four stubs have the header 12, 60, 5 and four lanes at offset 7, where no
lane is.
"""

[[script]]
at = "27:A8FF"
name = "e30_bar_fill"
desc = """
A second thread of the ambush object, started by e30_start: e30_bar_begin, then as many times as the list has
knights: sound $12, e30_bar_step, 6 frames, sound $12, 6 frames. The ENEMY bar grows to its full length while
the leader shows himself; then the thread ends.
"""

[[sym]]
at = "27:A5BE"
name = "e30_begin"
desc = """
For e30_start, when the leader has gone: the four lane bytes $0788-$078B = $42 (ready), $0797 = this object's
slot, $0784 / $0785 = the address of the wave list (e30_lists by obj_dir), $0786 = its number of knights, $0787 =
its step of the bar, and the object's variables 4-7 = the offsets of the four lanes. These bytes of page 7 belong
to the ambush only while it runs; other bosses use them for other things.
"""

[[sym]]
at = "27:A914"
name = "e30_bar_step"
desc = "For e30_bar_fill: variable 0 of the ambush object (the ENEMY bar) grows by the step in $0787."

[[sym]]
at = "27:A921"
name = "e30_bar_begin"
desc = "For e30_bar_fill: variable 0 = 0, hud_boss_slot = this object's slot with bit 7, hud_boss_type = $30, $0787 = the step of the wave list of obj_dir."
out = "A = the list's number of knights"

[[script]]
at = "27:A952"
name = "e30_start"
desc = """
First script of object type $30: the ambush. Kirby is stopped, the leader of the knights shows himself with his
sword (main@18110, on the upper platform; by his look the game's Meta Knight), leaps away, and knights appear in
waves until all of the list are beaten; the ENEMY bar counts them (main@18340: two with axes; main@18400). The
kinds $80-$87 and $8B-$8E create it with the number of its wave list in variable 1. Bank 22, $0796 = $FF, bit 7 of
Kirby's obj_tick_bank set (Kirby's object does not run), the thread e30_bar_fill, and e30_leader as a
subroutine. When that returns: bit 7 of Kirby's obj_tick_bank cleared, CHR bank $EE in register 1, tick routine
e30_tick, $0796 = 0, e30_begin, and the thread parks.
"""

[[sym]]
at = "27:A979"
name = "e30_tick"
desc = """
Tick routine of the ambush while the knights come. $0796 not 0 is the end: it counts down from $1E, and at 0
3F:E6E8 ends the room's extra (unit roomtick) and the object is freed ($FF would free it at once). Otherwise for
each of the four lanes (state in $0788 + lane, place in the list in variable 4 + lane): a state of 0 (its object
is still there) or $FF (the lane is finished) is left alone; any other is counted down, and when it is below
$42 the lane's next entry is read: $FF finishes the lane; otherwise the place moves on by 4 and e30_spawn creates
the entry's object. An object that is done sets its lane to $43 (a wait or a puff: the next entry two frames
later) or to $6A (a knight beaten or inhaled: 41 frames later). When all four lanes are $FF, $0796 = $1E.
"""
comments = { "A979" = "$0796: 0 while the waves run", "A99A" = "lane 0", "A9C9" = "lane 1", "A9F8" = "lane 2", "AA27" = "lane 3", "AA56" = "all four finished?" }

[[sym]]
at = "27:AA72"
name = "e30_spawn"
desc = "For e30_tick: creates the object of a lane entry in a slot of 9-17: type = $00, variable 0 = the entry's second byte, variable 1 = X (the lane's number 4-7), at the entry's X and Y with high bytes 0; and the lane's state ($0784 + X) = 0. Ends in obj_spawn."
in = "$00 = the type, X = 4 + lane, Y = the entry's offset in the list at ($16)"
out = "as obj_spawn"

[[script]]
at = "27:AAA3"
name = "e30_leader"
desc = """
Called by e30_start: the ambush object itself is the leader for 224 frames. CHR bank $A4 in register 1, the pose
table 31:8000, tick routine e30_tick_leader, variable 7 = 0. He stands 48 frames, turns his cape (poses 1-4),
points (pose 9, 32 frames), raises the sword ($1D, $1B, $19, 32 frames) and lowers it, waves ($76-$78, 48 frames),
crouches ($2B, $33, $35) and leaps: X velocity $0200, Y velocity -$0600. Then the script looks at variable 7
