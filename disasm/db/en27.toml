[[claim]]
id = "en27.e30.lists"
about = ["e30_lists", "e30_waves"]
text = "e30_lists holds twelve addresses inside e30_waves. In each of the lists 0-7 the second header byte is the first times the third, the four lane offsets point at rows of 4-byte entries that end with $FF inside the list, every entry's type is $31-$35, a type $31 has variable 0 in 8-$0D, a knight's variable 0 is a variant that exists (below 4 for $33 and $35, 3 for $32, 2 for $34), and the number of knights in the four lanes is the first header byte. The lists 8-11 have the header 12, 60, 5, 7, 7, 7, 7."
kind = "static"
model = '''
def e30_lists_ok(u8, O, A):
    b = O("27:A000") - 0xA000
    ptrs = [u8(O("e30_lists") + 2 * i) | u8(O("e30_lists") + 2 * i + 1) << 8 for i in range(12)]
    if ptrs != [0xA8C0, 0xA851, 0xA7EE, 0xA7C3, 0xA77C, 0xA711, 0xA6D6, 0xA643, 0xA63C, 0xA635, 0xA62E, 0xA627]:
        return False
    ends = sorted(ptrs) + [A("e30_bar_fill")]
    for k, p in enumerate(ptrs):
        h = [u8(b + p + i) for i in range(7)]
        if h[0] * h[2] != h[1]:
            return False
        if k >= 8:
            if h != [12, 60, 5, 7, 7, 7, 7]:
                return False
            continue
        end = ends[ends.index(p) + 1]
        knights = 0
        for lane in range(4):
            y = h[3 + lane]
            while u8(b + p + y) != 0xFF:
                t, v = u8(b + p + y), u8(b + p + y + 1)
                if t == 0x31:
                    if not 8 <= v <= 0x0D:
                        return False
                elif t in (0x32, 0x33, 0x34, 0x35):
                    if v >= {0x32: 3, 0x33: 4, 0x34: 2, 0x35: 4}[t]:
                        return False
                    knights += 1
                else:
                    return False
                y += 4
            if p + y >= end:
                return False
        if knights != h[0]:
            return False
    return True
'''
expect = "e30_lists_ok(u8, O, A) and A('e30_waves') == 0xA627 and A('e30_waves') + 728 == A('e30_bar_fill')"

