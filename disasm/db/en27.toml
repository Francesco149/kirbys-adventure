hit): variable 5 - 1, 22:963B with it (the draw routine 3E:DDE7 and a flicker of obj_sprite_bank's bit 7 while it
is not 0), and 3F:E31D with the second record of e3x_recs, which has no reaction; variable 0 is put back: nothing
damages it. With variable 5 = 0: variable 0 is kept in $078C and 3F:E31D runs with the first record of e3x_recs.
When the hit test changed the object and variable 5 is still 0 (it was inhaled or beaten and has another script),
the routine drops its return address: the tick routine that called it is over. A hit that it survived (variable
5 = $18) returns. Any other variable 5 (kind 1 of kirby_rect sets $80) is cleared, variable 0 put back and
kirby_knock_back (3F:E2B6) called (once, cov5-g-axe@18509: Kirby's slide into a knight; unit en_cov5).
"""
out = "returns to the tick routine unless the object was inhaled or beaten"

[[data]]
at = "27:BB1A"
len = 48
name = "e3x_recs"
format = "rows:24"
desc = """
The two hit records of e3x_hit (the layout of unit hit). First: a box of 8 x 8, flags 8 (touching Kirby does not
damage it), inhale number $FF, touching it hurts Kirby, score entry 8; inhaled e3x_inhaled, hit points gone
e3x_beaten, damaged variable 5 = $18, kind 1 of kirby_rect variable 5 = $80, kind 2 the script at 27:BB5E, kind 3
the one at 27:BB68. Second: the same box and flags, score entry 0, no reaction.
"""

[[script]]
at = "27:BB4A"
name = "e3x_inhaled"
desc = "The reaction of e3x_recs to being inhaled: variable 6 = $42 (what the knight's children look at), e3x_report, and on in 22:8003 as every inhaled enemy."

[[script]]
at = "27:BB54"
name = "e3x_beaten"
desc = """
The reaction of e3x_recs to the hit points being gone: variable 6 = $42, e3x_report, and on in 22:8100 as every
beaten enemy. Two more scripts of the same shape follow it for kind 2 and kind 3 of kirby_rect (27:BB5E on to
19:B2A0, 27:BB68 on to 16:A9CE); they never ran.
"""

