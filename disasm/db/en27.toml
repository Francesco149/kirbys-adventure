about = ["e34_st_fly", "e34_wall"]
text = "e34_st_fly: e34_wall runs exactly when bit 0 of obj_collide0's answer was set (27:B4DB), and then the X velocity is negated and variable 8 goes down by 1 (not to 0). At a landing (27:B4E1) the Y velocity is 0 and with variable 9 not 0 nothing more; otherwise with variable 9 not 0 the Y velocity grows by 5."
kind = "call"
fn = "e34_st_fly"
on = ["main@55710+40", "cov-abilities-fireball@55710+40", "cov-abilities-sword@55710+40"]
min_calls = 45
use = ["en27_model"]
model = '''
def e34_fly_ok(rd, wr, ran, calls, mem):
    s = rd[0x6E]
    if "obj_collide0" not in calls or rd[0x626C + s] == 0:
        return False
    if (ran("27:B4DB") > 0) != (ran("27:B52A") > 0):
        return False
    if ran("27:B52A") and not (wr[0x625A + s] == rd[0x625A + s] - 1 != 0):
        return False
    if ran("27:B4E1"):
        return e27_vy(wr, s) == 0 and not ran("27:BD48")
    return e27_vy(wr, s) == (e27_vy(rd, s) + 5) & 0xFFFF
'''
expect = "e34_fly_ok(rd, wr, ran, calls, mem)"
cases = { "ran('27:B4DB')" = 3, "ran('27:B4E1')" = 3, "not ran('27:B4E1')" = 36 }

