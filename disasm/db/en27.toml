desc = """
What type $22 does next; the tick routines come back here when a move is over. e22_cycle_step counts variable 6
down (4 after 0) and the script jumps by it: 4 e22_hops_any (hops, a random number of them), 3 e22_throw (the leap
with a bomb), 2 e22_hops_two (two hops), 1 e22_leap (a leap toward Kirby and back), 0 e22_leap_far (a longer one).
The first move after its creation is 4.
"""

