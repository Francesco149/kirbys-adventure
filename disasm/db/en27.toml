unit = "en27"
title = "Object types $22 and $30-$35: the bomb thrower with the enemy's bar, and the ambush of the four kinds of knights"
summary = """
Bank 27 holds two families of objects.

Type $22 (kinds $BC and $BD) is a large capped creature that hops, leaps and throws bombs, a mid-boss
(by its look the game's Poppy Bros. Sr.): objs_spawn puts its slot into hud_boss_slot, so its 30 hit points are the
ENEMY bar. e22_choose cycles through five moves by variable 6 (hops, a throw, two hops, a leap to Kirby and back, a
long leap); every tick routine begins with e22_hit (32 frames of blinking after a hit, in which it cannot be damaged)
and starts the next script through e22_scripts at a landing. Created with variable 0 not 0 it is its own bomb
(e22_bomb). Beaten it is thrown back (e22_beaten), bounces and lies still to be inhaled.

Type $30 (kinds $80-$87, $8B-$8E) is the ambush of the knights: the room's leader (by his look Meta Knight) shows
himself while Kirby's object is held (bit 7 of its obj_tick_bank) and the ENEMY bar fills (e30_bar_fill); then
e30_tick runs the wave list of e30_lists by the kind's variable 1: four lanes side by side, each a row of entries
(type, variable 0, X, Y) that e30_spawn creates one at a time. A lane waits while its object lives (state 0); the
object reports back through page 7: $43 (e31_report: a wait or a puff ended) or $6A (e3x_report: a knight beaten or
inhaled; the bar shrinks by the list's step). When all lanes are finished the room's extra ends (3F:E6E8) and the
ambush object frees itself. The knights are types $32-$35 (a mace, an axe, a lance, a trident), built on the shared
routines e3x_* (e3x_setup, the hit test e3x_hit with the records e3x_recs, the distances, e3x_goto by which tick
routines change the script, e3x_clamp to the screen) with variable 3 as the state of their tick routine and variable
4 as their direction; obj_dir holds the lane and obj_param keeps it. Type $31 is everything else the ambush needs,
by variable 0: the blade of a swinging axe, the thrown axe, the flying ball and the swung ball of the mace knight,
the trident, the lance's point (children made by e3x_child) and the waits and the puff of the wave lists.

Helpers of bank 22 used here: 22:9084 (X velocity from the two operand bytes along variable 4), 22:9075 (the pose of
variable 4 plus an offset), 22:90C8 (variable 4 negated), 22:9458 / 22:943C (Y velocity / both velocities 0),
22:9066 (variable 4 toward Kirby), 22:963B (the blink of e3x_hit), 22:8C71 / 22:8C05 (a child, a step forward),
22:8665 (X distance to Kirby), 22:859F / 22:85B0 (effects), 22:9591 (the dust puff $59); 3E:DE4B is a script's sound.

Open: the knights' paths that no movie reached: the choices of e33_st_walk at
27:AC75 and 27:AC98, state 3 of e33_states (27:AD28), e33_appear's other branch (27:ABF0); e35_st_walk's leap at
27:B186 (Kirby nearer than 32 pixels at an edge), the arc 4 of the trident (27:B124, 27:B980), the wrap of
e35_throw_count; most of type $34: its landing in e34_st_leap and the scripts after it (27:B3A1-B49A), the state
routines 1-5 (27:B545-B5D0), the rise of e34_st_fly (variable 9 = 0) and the end of its wall count; the scripts of
type $31 with variable 0 = 5 and 7 (27:B9AA, 27:BA7C); the wave lists 1, 6, 7 and the stubs 8-11; the kinds of
e3x_recs for kirby_rect 2 and 3 (27:BB5E, 27:BB68); the bounce of the bomb (e22_bomb_bounce) and the end of
e22_tick_fade; the meaning of the store of e32_turn into $0593 (it looks like a slip: the knight's pose lands in the
low byte of the score). The kind-1 paths of e3x_hit (27:BB08, cov5-g-axe@18509) and e22_hit (27:A193,
cov5-g-poppy@5862), the edge path of e33_st_swing (27:AD4E, cov5-g-axe@18411) and the rest of e33_swing (27:AC35,
cov5-g-axe@18410) ran once each in the fifth batch: unit en_cov5.
"""

# ================================================================= shared model

[[model]]
name = "en27_model"
code = '''
E22_SCRIPTS = [0xA01C, 0xA037, 0xA0B8, 0xA0DC, 0xA0EE, 0xA14A, 0xA168]
E22_HOPS = [4, 4, 2, 6, 2, 2, 2, 0]
E22_WINDS = [0x10, 0x01, 0x09]
E22_DRAW = [0xDDE7, 0xDA89]

def e27_script(wr, addr):
    """obj_set_script gave a thread this address in bank 27."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == 0x27 for t in range(32))

def e27_any(wr):
    """obj_set_script gave some thread a script of bank 27."""
    return any(wr.get(0x63C0 + t) == 0x27 for t in range(32))

def e27_goto(rd, wr, addr):
    """e27_goto moved the object's first thread to this address (no wait, an empty stack)."""
    t = rd[0x614C + rd[0x6E]]
    return wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x6360 + t) == 0 and wr.get(0x6340 + t) == 0

def e27_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def e27_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def e27_vx(m, s):
    return e27_w(m, 0x60E0 + s, 0x60F2 + s)

def e27_vy(m, s):
    return e27_w(m, 0x6104 + s, 0x6116 + s)

def e27_mirror(v, d):
    """A speed toward the side a direction byte faces: negated when bit 7 is set."""
    return (-v if d & 0x80 else v) & 0xFFFF

def e27_spawned(wr, typ):
    """The slots 9-17 in which the call created an object of this type."""
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]
'''

[[claim]]
id = "en27.kinds"
about = ["e22_start"]
text = "In the tables of unit rooms (13:A9D2 type, 13:AAD2 variables 0 and 1 as low and high nibble) the kinds $BC and $BD are type $22 with variable 0 = 0 and variable 1 = 0 and 1; the kinds $80-$87 and $8B-$8E are type $30 with variable 0 = 0 and variable 1 = 0-7 and 8-11."
kind = "static"
expect = "[u8(O('13:A9D2') + k) for k in (0xBC, 0xBD)] == [0x22] * 2 and [u8(O('13:AAD2') + k) for k in (0xBC, 0xBD)] == [0x00, 0x10] and [u8(O('13:A9D2') + k) for k in list(range(0x80, 0x88)) + list(range(0x8B, 0x8F))] == [0x30] * 12 and [u8(O('13:AAD2') + k) for k in list(range(0x80, 0x88)) + list(range(0x8B, 0x8F))] == [i << 4 for i in range(12)]"

# ================================================================= type $22

[[script]]
at = "27:A000"
name = "e22_start"
desc = """
First script of object type $22: a creature with a cap, larger than Kirby, that hops about and throws bombs
(main@4005, in the air at the right; w12-opus@5760, on the ground). By its look and its bombs the game's Poppy
Bros. Sr. The kinds $BC and $BD of the rooms' lists create it (variable 1 = 0 and 1); for kinds from $B0 to $DF
objs_spawn (unit rooms, 3F:EA6A / 3F:EA71) puts the new object's slot into hud_boss_slot, so its variable 0 is the
ENEMY bar of the status line. CHR bank $EE in register 1, the pose table 37:86CA. Created with variable 0 not 0 it
is a bomb (e22_bomb). Otherwise obj_setup with $1E: 30 hit points, obj_param = the kind's variable 1, faces Kirby;
the position routine obj_pos_camera (it is not culled), variable 5 = 0 (the blink timer of e22_hit), variable 6 = 5
(the place in the cycle of e22_choose), and on into e22_choose.
"""

[[script]]
