[[claim]]
id = "en27.e34.leap_aim"
about = ["e34_leap_aim", "e34_leap_vx", "e34_leap_vy", "e34_leap"]
text = "e34_leap_aim leaves the Y velocity e34_leap_vy[r] * 256 and the X velocity e34_leap_vx[r & 6 + (8 if variable 4 has bit 7 set)] for the random number r below 8 (the table as the model's literals)."
kind = "call"
fn = "e34_leap_aim"
on = ["main@55630+20", "cov-abilities-fireball@55630+20", "cov-abilities-sword@55630+20"]
min_calls = 3
use = ["en27_model"]
model = '''
E34_VX = [0x0080, 0x0080, 0x0100, 0xFF80, 0xFF80, 0xFF80, 0xFF00, 0x0080]
E34_VY = [0xFE, 0xFE, 0xFD, 0xFE, 0xFE, 0xFD, 0xFE, 0xFD]
def e34_aim_ok(rd, wr):
    s = rd[0x6E]
    r = (8 * wr[0x3E]) >> 8
    return e27_vy(wr, s) == E34_VY[r] << 8 and e27_vx(wr, s) == E34_VX[(r >> 1) + (4 if rd[0x6212 + s] & 0x80 else 0)]
'''
expect = "e34_aim_ok(rd, wr)"

