[[claim]]
id = "kst15.hub.pan_setup"
about = ["hub_pan_setup", "hub_pan_tab", "hub_pan_back", "hub_pan_to", "hub_pan_y_first"]
text = "Every call of hub_pan_setup saves cam_x and cam_y in hub_pan_back, stores the camera plus 16 times the two signed table bytes of (world * 16 + stage_door) in hub_pan_to, and 0 in hub_pan_y_first."
kind = "call"
fn = "hub_pan_setup"
on = ["main@2600+3200", "main@128850+200", "w12-opus@3700+5600", "w12-sonnet@4430+6300"]
model = '''
def step16(b):
    return ((b << 4) & 0xFF) | (0xFF00 if b & 0x80 else 0)

def pan(rd, wr, romrd):
    i = ((rd[0x558] << 4 | rd[0x559]) << 1) & 0xFF
    dx, dy = romrd[0x2BD87 + i], romrd[0x2BD88 + i]
    cx, cy = rd[0xDD] | rd[0xDE] << 8, rd[0xE0] | rd[0xE1] << 8
    return ([wr[0x78FE + k] for k in range(4)] == [rd[0xDD], rd[0xDE], rd[0xE0], rd[0xE1]]
            and wr[0x78FA] | wr[0x78FB] << 8 == (cx + step16(dx)) & 0xFFFF
            and wr[0x78FC] | wr[0x78FD] << 8 == (cy + step16(dy)) & 0xFFFF and wr[0x7902] == 0)
'''
cases = { "romrd[0x2BD87 + (((rd[0x558] << 4 | rd[0x559]) << 1) & 0xFF)] >= 0x80" = 1, "romrd[0x2BD88 + (((rd[0x558] << 4 | rd[0x559]) << 1) & 0xFF)] >= 0x80" = 2, "rd[0x558] > 0" = 1 }
expect = "pan(rd, wr, romrd)"

