[[model]]
name = "kst15_pan1"
code = '''
def pan1(rd, wr, mem, rp, to, cam, out):
    d = ((rd[to] | rd[to + 1] << 8) - (rd[cam] | rd[cam + 1] << 8)) & 0xFFFF
    if (wr[out] | wr[out + 1] << 8) != d:
        return False
    if d == 0:
        return cam not in wr and cam + 1 not in wr and not rp & 1
    new = ((rd[cam] | rd[cam + 1] << 8) + (-4 if d & 0x8000 else 4)) & 0xFFFF
    return (mem(cam) | mem(cam + 1) << 8) == new and rp & 1 == 1
'''

