unit = "kst15"
title = "Kirby's states in bank 15: Sword Kirby and Parasol Kirby"
summary = """Bank 15 holds Kirby's states for two copy abilities, each as a complete set of scripts and frame routines: scripts
$60-$7B are Sword Kirby (kirby_ability 3) and $B3-$CF Parasol Kirby (kirby_ability 9). A set repeats the states of
plain Kirby with the ability's poses (stand, walk, run, turn, jump, fall, crouch, slide, ladder, puff up, flap,
float, spit the air, the water states) and adds the ability's own: B gives the sword slash on the ground ($70) and
the sword spin in the air or under water ($71); with the parasol B gives the swing ($C5), and a fall of 2.5 pixels
per frame or more opens it ($BD: he floats down at half a pixel per frame and sways; Down ends the float with a
dive, $BE, which breaks blocks and bounces off the floor, $C0).

Every state is a script that names its frame routine with on_tick and sets kirby_action; the routine moves Kirby
with the helpers of bank 21 and then asks its tests in a fixed order: the first that answers yes names the next
script (ldx #n / jmp kirby_script_upkeep), and with none it ends in kirby_upkeep. The claims model that order per
routine (model kst15_exits: pad tests from pad1_held_copy / pad1_new_copy, the collision and water tests by the
answer of the bank 21 routine). A state that ends by itself jumps to its set's dispatcher ($60 / $B3), which asks
21:9BF7 for a number 0-7 and continues with stand, walk, run, fall, the three water states or the float.

The attacks give Kirby a rectangle (kirby_rect of unit kblocks, through kirby_rect_set) from 7-byte records chosen
by his pose: the sword's blade with $0508 = 5 (sword_slash_rect, sword_spin_rect), the swung parasol with 6
(para_swing_rect), and for Parasol Kirby a rectangle with $0508 = 2 in every other state (para_rect: the parasol
over his head; the dive's and the slide's own records). break_rect_0 runs on it in the attack, slide and dive states.

The rest of the bank's code is not a state of the table: kirby_s_door_arrive (15:BA9D) is the script Kirby runs
when a room starts. kirby_door_here looks for a door at his position; with none the script goes on to bank 14
(14:A077). At a door: the door opens (door_open_step 1-3), he steps out (kirby_st_door_walk), score_pending_add
pays the score that waits in score_pending, and with $78D5 not 0 (back in the hub from a stage) he hops and turns,
hub_pan_setup takes the camera's target from hub_pan_tab[world][stage_door] (in blocks from the present camera),
hub_pan_step moves the camera there 4 pixels per frame (X first, then Y; Kirby does nothing meanwhile:
kirby_st_none), reveal_at_centre and a cleared reveal_hold let room_tick (unit roomtick) reveal the new doors
there, hub_pan_return and hub_pan_step bring the camera back, he hops again, and hub_bits_update copies the world's
progress into hub_stage_bits, hub_shut_bits and hub_flags; when one of them changed an object of type 3 and sound
$1C follow.

Open: what $0508 means (5 and 6 for the attacks, 2 for the carried parasol and the slide / dive / crush
rectangles; hit_rect_power in another unit) and the kinds 4, 6, 1 in a record's first byte are not claimed.
$05E0 is set to 3 by the script at 15:A000 and to 5 by 15:AC09 (with a sprite_map and kirby_pal_set: the ability's
set-up scripts, reached from elsewhere); not named. Never run in the corpus, so not documented: scripts $6A, $6B,
$6C, $6F (ladder), $74, $75, $BF, $C1, $C4 (ladder), $C8, $C9, $CB-$CF (Parasol Kirby never touched water) and the
routines behind them; in the documented routines every exit that the claims' cases do not list (the ladder, door
and most water exits, the wall and ceiling exits of walk, run, jump and fall). Run but not documented (few calls):
Sword: $66 turn (15:A2A7, 8 calls), the head-first dive after a long fall (15:A405 / 15:A413, 21), $6D crouch
(15:A587, 14), $6E slide (15:A5ED, 29, rectangle from 15:A634), $76 spit the air (15:AA25, 24), $77 enter water
(splash object, then the dispatcher), $78 stand in water (15:AA6C, 1), $7B leave water (object, then the jump);
Parasol: $B7 / $B8 run (15:AE1D, 26), $B9 turn (15:AEB9, 4), $C6 puff (15:B46E, 48), $C7 flap (15:B4AD, 48), the
float while puffed (15:B4EE / 15:B500, 6), $CA spit the air (15:B5C3, 48). In para_fall_fast the path for another
ability never ran (it was 9 on all 93 calls). hub_pan_setup compares |dx| with itself, so hub_pan_y_first is
always 0 and the Y-first order of hub_pan_step never ran; score_pending and lives_pending were 0 on every call of score_pending_add in the
windows (3B:B369, which stores them, ran once in the corpus; the extra-life branch never ran); ability_17_end never met ability $17. The second half of the arrival script
(15:BC07 on, with 15:BCEB) never ran. Who starts kirby_s_door_arrive and what $78D5 is are in other units' code.
"""

[[model]]
name = "kst15_exits"
code = '''
def held(rd, mask):
    """a button of the mask is held (pad1_held_copy: A $80, B $40, Select $20, Start $10, Up 8, Down 4, Left 2, Right 1)"""
    return bool(rd.get(0xE6, 0) & mask)

def new(rd, mask):
    """a button of the mask is newly pressed (pad1_new_copy)"""
    return bool(rd.get(0xE7, 0) & mask)

def maybe(possible):
    """a test that needs more than the pad: not modelled (None) when the pad allows it, no when it does not"""
    return None if possible else False

def fast(ability, lo, hi):
    return ability == 9 and hi < 0x80 and (hi << 8 | lo) >= 0x280

def took(ran, tests, stay):
    """tests: (address of an exit's ldx, the answer of its test) in the routine's order; stay: the address the routine
    reaches when no test answered yes. True when exactly one of them ran, once, no modelled test before it answered
    yes, and its own test did not answer no."""
    seq = [t[0] for t in tests] + ([stay] if stay else [])
    hit = [i for i, at in enumerate(seq) if ran(at)]
    if len(hit) != 1 or ran(seq[hit[0]]) != 1:
        return False
    for i, (at, ans) in enumerate(tests):
        if i < hit[0] and ans:
            return False
        if i == hit[0] and ans is False:
            return False
    return True

def rect_ok(rd, wr, romrd, lo, hi, i, power):
    """lo, hi: CPU addresses of two pointer tables of bank 15, i: the index. The record they name was read, and
    kirby_rect_set stored `power` in $0508, the record's byte 0 in kirby_rect+0 and bytes 5 / 6 in +5 / +6."""
    o = 0x20000
    if lo + o + i not in romrd or hi + o + i not in romrd:
        return False
    rec = (romrd[lo + o + i] | romrd[hi + o + i] << 8) + o
    return (all(rec + k in romrd for k in range(7)) and wr.get(0x508) == power and wr.get(0x501) == romrd[rec]
            and wr.get(0x506) == romrd[rec + 5] and wr.get(0x507) == romrd[rec + 6])
'''

