[[sym]]
at = "15:BCB1"
name = "hub_bits_update"
desc = """Copies the world's progress to the hub's door state: hub_stage_bits = stages_done[world]; hub_shut_bits =
($0541[world] | hub_shut_mask[world]) & $0539[world]; hub_flags = stages_clear[world] ($0531 + world). A = the
number of changes: 1 for a hub_shut_bits that differs from the old one, plus 1 when bits 0-2 of hub_flags differ."""
out = "A = 0, 1 or 2 (the script's jeq: nothing new)"

[[sym]]
at = "15:BCF3"
name = "hub_pan_setup"
desc = """Before the camera leaves Kirby: hub_pan_back = cam_x, cam_y; hub_pan_to = cam_x + 16 * dx, cam_y + 16 * dy with
the signed bytes dx, dy = hub_pan_tab[(world * 16 + stage_door) * 2] and the byte after it: where the door that the
cleared stage opened is, in blocks from here. hub_pan_y_first = 0 (it compares |dx| with |dx|, so it is never 1)."""

[[sym]]
at = "15:BD68"
name = "reveal_at_centre"
desc = "reveal_x = cam_x + $80, reveal_y = cam_y + $60: the reveal of unit roomtick spreads from the centre of the screen."

[[sym]]
at = "15:BE67"
name = "hub_pan_step"
desc = """One frame of the camera's pan. With hub_pan_y_first 0: hub_pan_x, and only when the X is already there,
hub_pan_y (with the flag set, never run, the other order). A = $00 | $01 | $02 | $03, the differences the two left:
0 once the camera is at hub_pan_to."""
out = "A = 0: arrived (the script's jne loops while not)"

[[sym]]
at = "15:BE88"
name = "hub_pan_x"
desc = "$00/$01 = hub_pan_to X - cam_x. 0: carry clear. Otherwise cam_x moves 4 pixels towards it (down when the difference is negative) and carry is set."
out = "carry set: the camera moved"

[[sym]]
at = "15:BEBB"
name = "hub_pan_y"
desc = "$02/$03 = hub_pan_to Y - cam_y. 0: carry clear. Otherwise cam_y moves 4 pixels towards it and carry is set."
out = "carry set: the camera moved"

[[sym]]
at = "15:BEEE"
name = "hub_pan_return"
desc = "hub_pan_to = hub_pan_back: the next pan brings the camera back to where hub_pan_setup found it."

[[sym]]
at = "15:BF06"
name = "kirby_st_none"
desc = "A single rts: the frame routine of Kirby while the camera pans (no movement, no kirby_upkeep). It is the last instruction of hub_pan_return."

[[sym]]
at = "15:BF0E"
name = "kirby_st_door_walk"
desc = "jmp kirby_step_from_speed: Kirby's frame routine while he steps out of a door: he moves with the speed and Y velocity the script gives him; no collision, no pad, no kirby_upkeep."

[[data]]
at = "15:BD87"
len = 224
name = "hub_pan_tab"
format = "rows:32"
desc = "Per world (7 rows of 32) and stage_door (0-15), two signed bytes dx, dy in blocks of 16 pixels: where the camera goes from the door Kirby came out of to show the newly opened door."

[[data]]
at = "15:BCE4"
len = 7
name = "hub_shut_mask"
format = "bytes"
desc = "Per world: bits ORed into $0541[world] by hub_bits_update before the AND with $0539[world] that makes hub_shut_bits."

[[ram]]
at = "78FA"
len = 4
name = "hub_pan_to"
desc = "The camera position a pan moves to: X (16 bits), then Y (16 bits). hub_pan_setup and hub_pan_return set it; hub_pan_x and hub_pan_y read it."

[[ram]]
at = "78FE"
len = 4
name = "hub_pan_back"
desc = "cam_x and cam_y as they were before the pan (hub_pan_setup); hub_pan_return copies them to hub_pan_to."

[[ram]]
at = "7902"
name = "hub_pan_y_first"
desc = "Not 0: hub_pan_step moves Y before X. hub_pan_setup always stores 0."

[[ram]]
at = "07D2"
len = 2
name = "score_pending"
desc = "A score (16 bits, in tens) that waits until Kirby is out of the next door: score_pending_add adds it to the score and clears it. 3B:B369 stores it; game_state_init clears it."

[[ram]]
at = "07D4"
name = "lives_pending"
desc = "Extra lives that wait in the same way: score_pending_add would give one per call. 3B:B369 and game_state_init write it; it was 0 whenever it was read."

[[script]]
at = "15:BA9D"
name = "kirby_s_door_arrive"
desc = "Kirby's script at the start of a room (not in the script table). kirby_door_here: no door: on to 14:A077. At a door: ability_17_end, kirby_st_door_walk as the frame routine, sound $43, door_open_step 1, 2, 3, the poses of stepping out, score_pending_add; then with $78D5 = 0 he walks on, the door closes and hub_bits_update decides about an object of type 3; with $78D5 not 0 the return to the hub: a hop, the victory turn, hub_pan_setup, the pan (hub_pan_step every frame), reveal_at_centre, reveal_hold = 0, hub_pan_return and the pan back, hub_stage_bits_set, another hop, hub_bits_update."

