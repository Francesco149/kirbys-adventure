unit = "unread_en"
title = "Poses and pose-table entries no movie drew in banks 30-33, drawn by force"
summary = """
After batch 12 the sprite groups, poses and pose-table entries of banks 30-33 that no movie read stayed at
"described" (only the `format` claim of unit sprites covers them, and it compares readers). This unit has the draw
routine read every one of them by force. Each claim is an `effect`: from a corpus frame where an object that uses the
pose table is on the screen, obj_pose of its slot ($62C6 + slot) is held at the pose number before each of 20 frames;
`nr` says obj_run_all read the table entry (2 bytes) and the draw routine every byte of the group or pose it points
to, `cnr` that the untouched run read none of them (where the control draws the same group through another entry,
only the entry is checked in the control). For the three tables no sprite_map names (pose_tab_33_9930,
pose_tab_33_9BE2: King Dedede's bank, never read; pose_tab_32_86D9: museum exhibit $0F, whose script never ran)
obj_sprite_lo / hi of a slot of the same bank are held at the table as well. 199 claims, all regions of banks 30-33
with unread bytes except the NO POINTER copies and mirrors of unit dead_en2 (another unit's slice).

Verdicts, by table (object types and names from units en24a-en2f, boss_cov3, en_cov3):
- Played but clipped (the pose was drawn, but some sprites were off the screen, so their tile and attribute were
  never read): Blipper 30:845C poses 6, 7; type $2E 30:8F62 pose 4; the leaper $2F 30:8FBE poses 5 and 13 (above
  the top of the screen, cov3-b-e2f@40667); the lance knight 30:96C9 / 30:9705 groups 30:9782, 97A0, 97F4; the last
  boss 32:8A84 pose 18 (sprites 6 and 8 have Y offset -67: drawn only when it is low enough); King Dedede 33:9886
  pose 5, 33:9A40 poses 1 and 3, 33:9B28 pose 0.
- Reachable, never played (leads for movies):
  - The rider of the apple ($13, 30:8164 poses 4, 6) and of the M ball ($14, 30:81FC poses 0, 2, 4, 6): the roll
    while facing right (e13_roll: obj_pose_dir0 then inc2; only the left-facing half was drawn past pose 2).
  - The aiming cannon ($10, 30:806E entries 3-5): e10_asm_pose sets the octant of obj_dir; the barrel never pointed in
    octants 3-5 (their groups are drawn through other entries).
  - The leaper $2F, 30:8FBE pose 4: the upside-down pose that was drawn as 5 above the screen, facing the other way.
  - The lance knights ($34, 30:96C9 odd entries, 30:9705 entry 26, 30:973B entry 1) and the axe knight ($33, 30:9505
    entries 12, 17, 19): their moves facing the other way in the Meta Knight ambush (main@55642, cov3-a-lance2).
  - Mr. Frosty ($48, 31:8BCD poses 14, 16): the same moves facing right (15 and 17 were drawn).
  - Paint Roller's paintings (31:8E17 poses 42-45): entry 1 of the jump_table at 2C:A71E (scr_2C_A73E, never ran:
    asm_pose_dir $2A, add_pose_w 2), the painting with variable 5 = 1. Poses 48, 57-60, 62, 64: other paintings'
    poses, which side not checked.
  - The UFO ($28, 32:85A4 pose 5): e28_laser's blink (pose of the direction + 4) while facing left; the one laser in
    the corpus (cov6-j-x@345498) faced right.
  - Chilly ($3B, 32:86BD poses 0, 2): e3b_shiver while facing right.
  - Type $1E variant 6 (32:888F pose 6): sitting facing right (7 was drawn).
  - The falling small shell of the shell mid-boss ($4B, e4b_shell, 32:9E4E poses 0, 2, 4, 6, 8): asm_pose_dir 0 and
    inc2: the shell dropped while the boss faces right.
  - King Dedede: e47_swallow's tail (2D:A387) facing right (33:9796 pose 7); e47_caught_poses with kirby_form 1
    (2D:A3C4, set_pose_w 4, never ran; 33:9E0E pose 4).
  - Pairs where the other facing was drawn: Meta Knight 31:8000 poses 5, 22, 60 and 31:80F8 poses 22, 24, 26, 28;
    the last boss 32:8A84 poses 49, 51; the beetle 33:838A poses 40-50 (even); the shell boss 33:8B50 poses 76, 78,
    98.
- Not reachable:
  - Type $1C (30:9058 poses 0-3, 9-15): its scripts set only 4, 7 and 8 and step 4-8 (e1c_steps_right / _left);
    type $1C's code in bank 2A (2A:B9E6 on) neither writes obj_pose nor calls a pose helper of bank 22. Its groups
    0-8 have the bytes of Broom Hatter's (32:89F4).
  - Broom Hatter ($20, 32:89D4 poses 4-8): its scripts use only asm_pose_dir 0-3 (poses 0-3) and its code writes no
    pose; the same nine layouts as type $1C's.
  - Whispy Woods (30:8BC6 pose 11): e43 sets 0-2 and 6-9, its puff (2C:AB9C) 10 and halts; nothing sets 11.
  - Pengy's breath ($3A, 32:85FA entry 8, pose 9 = 32:866D): e3a_breath steps 0-7; entry 8 points at group 0 again,
    9 at a lone sprite.
  - pose_tab_33_9930 and pose_tab_33_9BE2: no sprite_map and no byte pair names them (unit dead_en2). Drawn on King
    Dedede's slot they are Dedede: 9930's poses 0/1 standing without the hammer, 2 in the air with the hammer held
    down (picture unused/unread-dedede-9930.png), 3-5 the same mirrored; 9BE2 a crouch and its mirror.
- Unsure: Meta Knight 31:8000 poses 70-77, 82, 83, 90-105, 121-123 and 31:80F8 poses 0-11, 49-52 (no script
  instruction found that selects them; code and the tables at 2B:BBE7 / 2B:BC33 select others); Mr. Shine & Mr.
  Bright 31:9218 entries 30, 31 and poses 66-68, 70, 92; the beetle 33:838A poses 10, 11, 22-27, 64-75; the shell
  boss 33:8B50 entries 10, 11, 104-107; the type $4F table 33:9E5A entries 10, 11 (e4f_face_flip flips whatever pose
  it has); the switch (29:BF1A, 32:9F37 poses 1, 3: the switch drawn upside down, set_pose_var with variable 1 = 1;
  that path's add_y 5 at 29:BF32 never ran); museum exhibit $0F (32:86D9: e0a_exhibit_f, never ran). Whether any room
  creates the switch with variable 1 = 1 or exhibit $0F was not checked.

Open:
- The "unsure" list above: which moves of the bosses (or none) select those poses, and whether a room places
  exhibit $0F or the upside-down switch.
- The "reachable" leads are not played; the claims force them.
"""

[[claim]]
id = "unread_en.30_806e.p3"
about = ["pose_tab_30_806E"]
text = "Pose 3 of pose_tab_30_806E held on object slot 10 (obj_pose = 3 before each frame) from main@3208, 20 frames: obj_run_all reads entry 3 (30:8074) and the draw routine reads all 9 bytes of the sprite group at 30:8087 (sprites_30_807E); the control run reads none of the entry or the sprite group."
kind = "effect"
on = "main@3208"
frames = 20
poke = { "62D0" = 3 }
hold = true
expect = "nr('30:8074', 2) == 2 and nr('30:8087', 9) == 9 and cnr('30:8074', 2) == 0 and cnr('30:8087', 9) == 0"

