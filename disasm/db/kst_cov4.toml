unit = "kst_cov4"
title = "Kirby's states first run in the fourth batch of coverage movies: Hammer's dive and ladder, floating in water with an ability, Sword or Parasol, and the state exits to ladders, ledges, doors, water and Select"
summary = """
What the cov4 movies made Kirby do for the first time in banks 14-19 (cov4-c-hammer, cov4-c-sword, cov4-c-para,
cov4-c-ab, cov4-c-rod).

  state / place                    entry                        what it does
  Hammer, dive (no number)         kirby_s_hammer_dive          kirby_s_hammer_fall's end after its wait (17:AF60):
                                                                kirby_action 5, kirby_flag3_clear, pose $34; the hammer
                                                                below him (hammer_dive_rect, kind 6) breaks blocks
  Hammer, dive landing ($A2)       kirby_s_hammer_dive_land     sound $55, the star (fx_create_rec 0, 0, 0, 0), pose $34,
                                                                kirby_vy $FD40; gravity profile $0B; Up held -> $A9
  Hammer, ladder ($A6)             kirby_s_hammer_ladder        kirby_st_sword_ladder's shape (unit kst_cov3) with
                                                                Hammer's tables; leaving gives kirby_s_hammer_resume
  floating into water, second set  kirby_s_ab_float_water ($30) kirby_s_float_water's counterparts (unit kst14b):
  ... Sword                        kirby_s_sword_float_water    kirby_action $0D, kirby_in_water set (21:988D), gravity
  ... Parasol                      ($74), kirby_s_para_float_   profile $0C; B -> the puff / exhale, water_left -> the
                                   water ($C8)                  surface script, Up at a door -> 0
  out of the water again           kirby_s_sword_float_surface  21:9893 (kirby_in_water cleared), then the form's float
                                   ($75), kirby_s_para_float_   (kirby_s_sword_float, kirby_s_para_hover)
                                   surface ($C9)

Every state routine is a fixed chain of tests as in units kst14 and kst_abl: the first that answers yes names the next
script (ldx #n / jmp kirby_script_upkeep); with none the routine ends in kirby_upkeep. The claims on the new routines use
kpath of model kabl (unit kst_abl). Script numbers are kirby_script_lo indexes.

The rest of what the batch ran first in these banks are exits of state routines that other units document (Hammer's
stand, walk, run, skid, jump, fall, inflate and flap; Sword's and Parasol's ground, air, dive, water and float states;
the second set's walk, jump, dive, float, water walk and swim; the Star Rod's run and skid; the Wheel in the air): the
claims kst_cov4.<state>.exits run each such routine's own chain claim (copied, with its models) on windows of the cov4
movie around the new exits, require each new exit to happen, and check that it leaves Kirby's thread at the script its
number names (kc4go); kst_cov4.para_ladder.exit does the same for Parasol's ladder, whose exit to
kirby_s_para_enter ran 25 times. Also kirby_door_look's answers 2 and 3 (a door while floating as Sword or Hammer) and
e05_star_bounds' path that frees the ability star left of kirby_min_x when extra_state is 2 (cov4-b-star).

Open:
- Never ran: in kirby_st_hammer_dive the ceiling, water and door exits (flag 3, script $A1, the dive hit, first ran in
  cov5-f-del@211663: kirby_s_hammer_dive_hit, unit cov5_tour) (B, the ladder and Up first ran in cov5-h-hammer: claim kst_cov5.hammer_dive.exits); in
  kirby_st_hammer_dive_land the floor ($97) and water exits; script $A3 (17:B12D-B14B); the ladder's step counter never
  wrapped (17:B26B). In the three float-in-water routines the door; their B exits (Sword's in cov5-h-sw, Parasol's in
  cov5-h-para) and the second set's water_left with its surface script $31 (14:BC1D, cov5-h-full) first ran in the
  fifth batch (unit kst_cov5: claims kst_cov5.<state>.exits, kirby_s_ab_float_surface).
- What kind 6 of kirby_rect (the dive) means to the hit test is not claimed here.
"""

[[model]]
name = "kcov4"
code = '''
HAMMER_LADDER = [0x04, 0x0A, 0x04, 0x0A, 0x82, 0x81, 0x82, 0x80, 0xCD, 0x33, 0x00, 0xFE, 0x01, 0x00, 0x06, 0x07, 0x00, 0x00]
HAMMER_DIVE_REC = [0x06, 0x00, 0x00, 0x00, 0x00, 0x04, 0x08]

def kc4go(ran, rd, wr, pairs):
    """pairs: (exit instruction, script address). True when every exit of the list that ran left Kirby's thread
    (obj_first_thread + 1) at that script address."""
    for at, want in pairs:
        if ran(at):
            t = rd.get(0x614D)
            if t is None or (0x6380 + t) not in wr:
                return False
            if (wr[0x6380 + t] | wr[0x63A0 + t] << 8) != want:
                return False
    return True
'''

# ================================================================== bank 17: Hammer's dive

[[script]]
at = "17:AFD7"
name = "kirby_s_hammer_dive"
desc = """Hammer's dive (no script number): where kirby_s_hammer_fall goes after its wait of variable 0 frames (17:AF60).
kirby_action = 5, kirby_flag3_clear (21:9EE1), routine kirby_st_hammer_dive, pose $34, halt. The counterpart of
kirby_s_ab_dive (unit kst14b)."""

[[sym]]
at = "17:AFE5"
name = "kirby_st_hammer_dive"
desc = """The dive with the hammer, once per frame: kirby_face_pad, kirby_pose_face, kirby_speed_from_vx, kirby_speed_pad_10,
kirby_step_from_speed (no gravity: kirby_vy stays as the fall left it), hammer_dive_rect, break_rect_0_mark,
kirby_walls_stop. Then the chain: kirby_floor_bump -> $A2 (dive landing); kirby_ceiling_bump -> $A0; kirby_flag3_test
(a block broke) -> $A1 (17:B060); B new -> $A8 (the swing in the air); kirby_ladder_test -> $A6; Up held -> $A9;
water_entered -> $AE; pad_up_door -> 0; otherwise kirby_upkeep. Only the floor exit and the stay ran here; B, the ladder
and Up first ran in cov5-h-hammer (claim kst_cov5.hammer_dive.exits)."""

[[sym]]
at = "17:B050"
name = "hammer_dive_rect"
desc = """kirby_rect_set with hammer_dive_rect_rec and X = 2: the hammer below him while he dives."""

[[data]]
at = "17:B059"
len = 7
name = "hammer_dive_rect_rec"
format = "bytes"
desc = """The dive's record for kirby_rect_set: kind 6, offsets 0 and 0, half width 4, half height 8 (the bytes of
kirby_ab_dive_rect_rec)."""

[[script]]
at = "17:B0E0"
name = "kirby_s_hammer_dive_land"
desc = """Script $A2, the dive reached the floor: kirby_action = 5, bump_kind = $FF, routine kirby_st_hammer_dive_land,
sound $55 (asm_snd), the star (fx_create_rec 0, 0, 0, 0), pose $34, kirby_vy = $FD40 (kirby_vy_script), halt: he
bounces up. The counterpart of kirby_s_ab_dive_land."""

[[sym]]
at = "17:B101"
name = "kirby_st_hammer_dive_land"
desc = """The bounce after the dive, once per frame: kirby_gravity with profile $0B, kirby_step_from_speed,
kirby_walls_stop; then kirby_floor_bump -> $97 (kirby_s_hammer_resume); Up held -> $A9 (inflate); water_entered -> $AE;
otherwise kirby_upkeep. The floor and water exits never ran."""

# ================================================================== bank 17: Hammer on a ladder

[[script]]
at = "17:B22A"
name = "kirby_s_hammer_ladder"
desc = """Script $A6, Hammer Kirby on a ladder: kirby_action = 8, routine kirby_st_hammer_ladder, kirby_vx_zero, variables 2
and 3 of Kirby = $0A and 3 (the climbing cycle), pose $83, halt."""

[[sym]]
at = "17:B23E"
name = "kirby_st_hammer_ladder"
desc = """kirby_st_sword_ladder (unit kst_cov3) with Hammer's tables. Up held: unless the block 7 above him is shape 2 (then
index 2, still), variable 2 counts down and below 0 variable 3 counts down (3 after 0: never ran) and variable 2 =
hammer_ladder_waits[variable 3]; the pose is hammer_ladder_poses[variable 3]; index 0. Up not held and Down held: pose
$83, index 1. Neither: index 2. kirby_vy = hammer_ladder_vy[index], kirby_step_from_speed; for indexes 0 and 1
prop_shape_at at his world position + hammer_ladder_dy[index]: a shape other than 1 gives the script 17:ABDA
(kirby_s_hammer_resume, through obj_set_script); so does Left or Right held. Otherwise kirby_upkeep."""

