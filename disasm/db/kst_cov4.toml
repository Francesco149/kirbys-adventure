# ================================================================== claims: Hammer's dive

[[claim]]
id = "kst_cov4.hammer_dive.model"
about = ["kirby_st_hammer_dive", "kirby_s_hammer_dive", "kirby_s_hammer_dive_land"]
text = "Every call of kirby_st_hammer_dive starts with kirby_face_pad, runs hammer_dive_rect once and takes exactly one path: floor -> $A2 (17:B0E0); ceiling -> $A0; flag 3 -> $A1 (17:B060); B new -> $A8; ladder -> $A6; Up held -> $A9; water -> $AE; door -> 0; or 17:B04D with no move. Both dives (92323, 92512) end at the floor exit."
kind = "call"
fn = "kirby_st_hammer_dive"
on = ["cov4-c-hammer@92320+20", "cov4-c-hammer@92505+25"]
use = ["kabl"]
min_calls = 26
cases = { "ran('17:B002')" = 2, "ran('17:B04D')" = 20 }
expect = "kpath(ran, rd, wr, [('17:B002', 0xB0E0, None), ('17:B00C', 0xA0, None), ('17:B016', 0xB060, None), ('17:B020', 0xA8, kn(rd, 0x40)), ('17:B02A', 0xA6, None), ('17:B034', 0xA9, kh(rd, 8)), ('17:B03E', 0xAE, None), ('17:B048', 0x00, kmaybe(kh(rd, 8)))], '17:B04D') == 'ok' and calls[0] == 'kirby_face_pad' and ran('17:B050') == 1"

[[claim]]
id = "kst_cov4.hammer_dive_rect.model"
about = ["hammer_dive_rect", "hammer_dive_rect_rec"]
text = "Every call of hammer_dive_rect fills kirby_rect from the record 6, 0, 0, 0, 0, 4, 8 at Kirby's world position, with $0508 = 2."
kind = "call"
fn = "hammer_dive_rect"
on = ["cov4-c-hammer@92320+20", "cov4-c-hammer@92505+25"]
use = ["kabl", "kcov4"]
min_calls = 26
expect = "krect(rd, wr, HAMMER_DIVE_REC, 2)"

[[claim]]
id = "kst_cov4.hammer_dive.script"
about = ["kirby_s_hammer_dive"]
text = "Every execution of the jmp at 17:AF60 (the end of kirby_s_hammer_fall's wait) goes on at 17:AFD7, kirby_s_hammer_dive; it happens twice."
kind = "vmop"
op = "jmp"
at = "17:AF60"
on = ["cov4-c-hammer@92315+15", "cov4-c-hammer@92500+20"]
min = 2
expect = "next == 0xAFD7"

[[claim]]
id = "kst_cov4.hammer_dive_land.model"
about = ["kirby_st_hammer_dive_land", "kirby_s_hammer_dive_land"]
text = "Every call of kirby_st_hammer_dive_land starts with kirby_gravity and takes exactly one path: floor -> $97; Up held -> $A9 (inflate); water -> $AE; or 17:B12A with no move. Both bounces end at the Up exit."
kind = "call"
fn = "kirby_st_hammer_dive_land"
on = ["cov4-c-hammer@92330+15", "cov4-c-hammer@92520+15"]
use = ["kabl"]
min_calls = 7
cases = { "ran('17:B11B')" = 2, "ran('17:B12A')" = 4 }
expect = "kpath(ran, rd, wr, [('17:B111', 0x97, None), ('17:B11B', 0xA9, kh(rd, 8)), ('17:B125', 0xAE, None)], '17:B12A') == 'ok' and calls[0] == 'kirby_gravity'"

[[claim]]
id = "kst_cov4.hammer_dive_land.vy"
about = ["kirby_s_hammer_dive_land"]
text = "Every execution of the asm_w at 17:B0FB (kirby_vy_script in kirby_s_hammer_dive_land) sets kirby_vy to $FD40."
kind = "vmop"
op = "asm_w"
at = "17:B0FB"
on = ["cov4-c-hammer@92330+15", "cov4-c-hammer@92520+15"]
min = 2
expect = "wr.get(0x5BD) == 0x40 and wr.get(0x5BE) == 0xFD"

# ================================================================== claims: Hammer on a ladder

[[claim]]
id = "kst_cov4.hammer_ladder.model"
about = ["kirby_st_hammer_ladder", "kirby_s_hammer_ladder", "hammer_ladder_waits", "hammer_ladder_poses", "hammer_ladder_vy", "hammer_ladder_dy"]
text = "Every call of kirby_st_hammer_ladder takes one of the three moves: the climb (only with Up held; variable 2 counts down, at its end variable 3 counts down and variable 2 = hammer_ladder_waits[variable 3]; the pose is hammer_ladder_poses[variable 3]), the descent (exactly with Up not held and Down held; pose $83) or still; kirby_vy is $FECD, $0133 or 0; Kirby's thread goes to 17:ABDA (kirby_s_hammer_resume) exactly when 17:B2CC ran, which it does whenever Left or Right is held. All three moves, a step of the cycle and the exit happen."
kind = "call"
fn = "kirby_st_hammer_ladder"
on = ["cov4-c-hammer@91690-91850", "cov4-c-hammer@91850-92150"]
use = ["kabl", "kcov3", "kcov4"]
min_calls = 100
cases = { "ran('17:B261')" = 20, "ran('17:B266')" = 2, "ran('17:B289')" = 20, "ran('17:B28F')" = 10, "ran('17:B2CC')" = 5 }
expect = "ladder(ran, rd, wr, mem, kwent(rd, wr), ('17:B261', '17:B266', '17:B289', '17:B28F', '17:B2CC'), 0xABDA, HAMMER_LADDER[0:4], HAMMER_LADDER[4:8], 0x83) == 'ok'"

[[claim]]
id = "kst_cov4.hammer_ladder.effect"
about = ["hammer_ladder_vy"]
text = "Patching the climbing entry of hammer_ladder_vy to 0 ($B2EE and $B2F1) keeps Hammer Kirby from climbing: 40 frames into the climb from cov4-c-hammer@91745 his world Y is greater (lower on the screen) than in the movie."
kind = "effect"
on = "cov4-c-hammer@91745"
frames = 40
patch = { "17:B2EE" = 0, "17:B2F1" = 0 }
expect = "(ram[0x6099] | ram[0x60AB] << 8) > (ctl[0x6099] | ctl[0x60AB] << 8)"

[[claim]]
id = "kst_cov4.tables.static"
about = ["hammer_ladder_waits", "hammer_ladder_poses", "hammer_ladder_vy", "hammer_ladder_dy", "hammer_dive_rect_rec"]
text = "The tables of model kcov4 are the ROM's bytes: Hammer's four ladder tables (18 bytes in a row) and hammer_dive_rect_rec; and hammer_dive_rect loads A = $59, Y = $B0 (the record's address) and X = 2 before its jmp to kirby_rect_set."
kind = "static"
use = ["kcov4"]
expect = "[rom[O('hammer_ladder_waits') + i] for i in range(18)] == HAMMER_LADDER and O('hammer_ladder_dy') == O('hammer_ladder_waits') + 14 and [rom[O('hammer_dive_rect_rec') + i] for i in range(7)] == HAMMER_DIVE_REC and [rom[O('hammer_dive_rect') + i] for i in range(9)] == [0xA9, 0x59, 0xA0, 0xB0, 0xA2, 0x02, 0x4C, 0x72, 0x9C]"

