at = "17:B2E6"
len = 4
name = "hammer_ladder_waits"
format = "bytes"
desc = """By the climbing step (variable 3): the frames to the next step, 4, $0A, 4, $0A."""

[[data]]
at = "17:B2EA"
len = 4
name = "hammer_ladder_poses"
format = "bytes"
desc = """By the climbing step: the pose, $82, $81, $82, $80."""

[[data]]
at = "17:B2EE"
len = 6
name = "hammer_ladder_vy"
format = "bytes"
desc = """kirby_vy by index (0 climbing, 1 descending, 2 still): three low bytes $CD, $33, 0, three high bytes $FE, 1, 0."""

[[data]]
at = "17:B2F4"
len = 4
name = "hammer_ladder_dy"
format = "bytes"
desc = """The Y offset of the block looked at after the move (climbing +6, descending +7): two low bytes, two high bytes."""

