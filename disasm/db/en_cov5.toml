unit = "en_cov5"
title = "What the fifth coverage batch ran in the enemy banks 23-2F"
summary = """
Code, scripts and small tables of the enemy banks 23-2F that ran for the first time in the fifth batch of coverage
movies (cov5-*), named in the style of the units that own their neighbours (en24b, en26a, en28, en29, en2a, en2f,
boss_cov3) and claimed here, together with claims on the new paths inside routines and scripts of those units, whose
texts point here.

New entries. The blue turtle (type $4F, cov5-i-turtle@41130): its dash into the pillar gives entry $17 of
e49_scripts, e4f_wall_bounce: the pose $0D, a bounce back off the wall (e4f_tick_wall_hop: gravity $25 until the
landing), a dust puff, a bob while variable 6 counts $20 (e4f_tick_wall_bob), then e4f_wall_daze: a shake of 30 frames
(e4f_tick_daze), the plain draw routine and e4f_rest. Grand Wheelie (type $49, cov5-i-wheel): after the two hops back
from a wall at the end of e49_hop_back, e49_tick_daze keeps its hit points through e49_hit for 30 frames and then
stands; entry 4, e49_brake_short with e49_tick_brake_short, brakes at once (one time in three when Kirby is far as it
rolls away). The apple rider (types $13 / $14, cov5-h-bd): e13_grabbed, the reaction to Back Drop's grab. The flapping
type $38: the shapes 7 and 9 of e38_shape_tab (e38_shape_7 / e38_shape_9, cov5-h-bd). Bonkers (type $4C, cov5-i-bonk):
the state 10, e4c_wall_reel, which a wall during the run steps starts: a bounce back, a landing and a shake of ten
rounds. The shell mid-boss (type $4B, cov5-i-shell): e4b_throw_3, the answer 3 of e4b_throw_kind: a backward leap with
Kirby in the grip and his throw. Kracko (type $3D, cov5-g-kracko): e3d_charge_turns, the turns of a charge started
with Kirby on the floor.

Claims on paths of other units' routines, each run once or a few times: the rider's wall turn (cov5-i-apple), the
ball rider's shed ball, its pose table and the item it leaves (cov5-h-bd); type $0F's return after a hit while falling
(cov5-h-full); Kirby's slide into Poppy Bros. Sr. (e22_hit) and a knight (e3x_hit), the axe knight's edge and the end
of its swing (cov5-g-poppy, cov5-g-axe); Bonkers' wall in the run, its count of 0 made 1, its thrown object's landing
and second flight (cov5-i-bonk); the sun and moon against the left edge: e45_hit's slide path, the edge paths of
e45_tick_hop, e45_tick_push, e45_tick_rush, e45_tick_moon_rush and e45_tick_moon_arc, the moon facing left in its rush
and its lunge, e45_sky_leave's answer 1 in e45_sun_descend, e45_beam_follow level with and right of Kirby, the sun's
action 16 (cov5-g-sun); the shell mid-boss's grab from its roll, the full model of e4b_throw_kind with the repeat
answered 0 and the random 6 or 7, Kirby held against a wall (cov5-i-shell); Bugzzy's fly_pick answer 0 and the throw
direction answered 0 (cov5-g-bug); the maned mid-boss's slide path, its catch in the air, its pounce loop going on
(cov5-i-mane); the crawler's turn finding a surface (cov5-i-flamer); Dedede's downward pull and the puff with him
facing right (cov5-g-ddd); Kracko's charge from the floor (cov5-g-kracko); the Heavy Mole's leg test answering 2
(cov5-h-lock); the 4-3 fuse measuring a laser to its right (cov5-g-fuse).

Open:
- Never ran: in e4f_tick_wall_hop the wall in the air (2A:B8CB), in e4f_tick_wall_bob the wall (bit 0); e49_hit
  answering carry in e49_tick_daze and e49_tick_brake_short, e49_hit in the turtle's three tick routines; the break
  to 2A:A706 in e4d_pounce's loop.
- Ran but not described here: the thrown object of type $4C facing left (28:A287: 36 pixels left; read once in
  cov5-i-bonk); e46_choose's path at 2C:B36A (cov5-h-lock); tables of which further entries were read for the first
  time (e4a_pick_lims, e4a_hold_dx, e4a_throw_bits, e45_actions_moon entry 16, e3x_recs' kind-1 reaction, the
  e38_bounce_dirs entries, rows of e4f_choices and others in banks 24-2D).
- The claims on the bodies of type $45 rest on one fight (cov5-g-sun); the paths that ran once are claimed from that
  one run.
"""

# ================================================================= shared model

[[model]]
name = "en_cov5_model"
code = '''
def c5_script(wr, addr, bank):
    """obj_set_script gave some thread the address addr in this bank."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == bank for t in range(32))

def c5_any_script(wr):
    return any((0x63C0 + t) in wr for t in range(32))

def c5_w(m, lo, hi, s):
    return m[lo + s] | m[hi + s] << 8

def c5_spawned(wr, typ):
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]
'''

# ================================================================= the blue turtle's wall bounce (type $4F, bank 2A)

[[script]]
at = "2A:B32E"
name = "e4f_wall_bounce"
desc = """Entry $17 of e49_scripts, which e4f_tick_dash gives the turtle when obj_walk meets a wall during its dash (2A:B6A2;
once, cov5-i-turtle@41130, the pillar at the right of room 185): the pose $0D of its direction (asm_pose_dir), the
tick routine e4f_tick_wall_hop, Y velocity -$0300, X velocity -$0100 (asm_vx: away from the side it faces), and
e49_wait_var5 until it lands: it bounces back off the wall. Then asm_dust (a type $59 with variable 0 = 1,
variable 1 = obj_dir, variable 3 = 8, variable 4 = 6, variable 5 = $0A), velocity 0, the tick routine
e4f_tick_wall_bob, 2A:AB2B of e49_knock (X velocity -$0080, the effect $15, variable 6 = $20), and the Y velocity $0080
and -$0080 for 2 frames each in a loop (2A:B351) until e4f_tick_wall_bob moves the thread on to e4f_wall_daze."""

[[script]]
at = "2A:B35A"
name = "e4f_wall_daze"
desc = """The second part of the wall bounce, given by e4f_tick_wall_bob (obj_set_script, cov5-i-turtle@41216): the tick
routine e4f_tick_daze, variable 6 = $1E, and the Y velocity $0100 and -$0100 for 2 frames each in a loop (2A:B361)
until e4f_tick_daze ends it 30 frames later: it shakes in its place, dazed."""

[[sym]]
at = "2A:B8B5"
name = "e4f_tick_wall_hop"
desc = """Tick routine of e4f_wall_bounce in the air (43 calls, cov5-i-turtle@41131-41173): e49_hit with entry 4 (carry set:
nothing more; never), obj_gravity_a with $25, obj_collide with set $0A; landed (carry): velocity 0 (obj_vel_zero) and
variable 5 + 1 (what e49_wait_var5 waits for). A wall in the air (bit 0 of the answer) would stop the X velocity
(22:944D; never)."""

[[sym]]
at = "2A:B8D6"
name = "e4f_tick_wall_bob"
desc = """Tick routine of e4f_wall_bounce after the landing (32 calls, cov5-i-turtle@41178-41216): e49_hit with entry 4
(carry set: nothing more; never), obj_collide with set $0A, variable 6 - 1. At a wall (bit 0 of the answer; never) or
when variable 6 reaches 0: velocity 0, obj_walk with set $0A and the script e4f_wall_daze (2A:B35A, bank 2A)."""

[[sym]]
at = "2A:B903"
name = "e4f_tick_daze"
desc = """Tick routine of e4f_wall_daze (30 calls, cov5-i-turtle@41216-41245): e49_hit with entry 4; carry set: nothing more
(never). With variable 6 not negative, variable 6 - 1; at 0 obj_walk with set $0A, the draw routine 3E:DA89 (the plain
sprites_draw: obj_draw_lo / _hi), velocity 0 and entry $0A of e49_scripts (e4f_rest)."""

