text = "e5e_tick_wait (unit en25b) starts e5e_toss_up exactly in the call that finds the block's variable 5 = 1 (after e48_swing_up) and the script 22:8144 exactly in the call that finds 2 (after e48_swing_drop); each happens once."
kind = "call"
fn = "e5e_tick_wait"
on = ["cov3-b-frosty@13990+30", "cov3-b-frosty@14340+30"]
min_calls = 2
use = ["en_cov3_model"]
expect = "c3_script(wr, A('e5e_toss_up'), 0x25) == (rd.get(0x6224 + rd[0x6E]) == 1) and c3_script(wr, 0x8144, 0x22) == (rd.get(0x6224 + rd[0x6E]) == 2)"
cases = { "rd.get(0x6224 + rd[0x6E]) == 1" = 1, "rd.get(0x6224 + rd[0x6E]) == 2" = 1 }
