[[sym]]
at = "3F:F0A2"
name = "obj_land_old"
never = true
desc = """Never runs. An older form of obj_test_land and obj_floor_approach (unit ocoll, bank 22) as one routine:
probe_down at the point the caller has set ($0E pair), the kind in $10, X = cur_object. A distance of 0 or more
(Y, from probe_done): obj_var7 = 0, carry clear. A negative one with carry set (nothing in reach): carry clear and
no write. A negative one with obj_var7 not 0: carry clear. Otherwise the approach test of obj_floor_approach on the
kind in $10 (kind 2: Y velocity; 5: X + Y; 6: Y - X; 3: X / 2 + Y; else Y - X / 2). Not negative: carry set, the
object has landed. Negative: obj_var7 + 1 and carry clear. A = the kind on every return. 3F:F0BE-3F:F145 are the
same 136 bytes as 22:9EDC-9F63. The live pair differs: obj_pos_pair picks the point, the kind is in $0C, a
distance of 9 or more or no surface sets obj_var7 = 1 (in the air), the depth limit is 8 pixels, and obj_var7 = 1
(not + 1) on the way out."""
in = "$0E/$0F = the point's pair (as for probe_down)"
out = "carry set: landed; A = $10 = the kind; X = cur_object"

