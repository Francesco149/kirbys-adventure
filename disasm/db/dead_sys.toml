desc = """Never runs. Y = obj_first_thread[X], then A - 1: with A of 1 or more the carry stays set and it returns with Y
= the first thread. With A = 0 it walks the chain, but each step loads A from thread_next (lda thread_next,y; tay;
sbc #1), so the count is lost after the first step: the loop stops only at thread 0 or 1, never at a chain's $FF end.
Compare obj_thread_pos, which keeps its count in $00."""
in = "X = object, A = a number"
out = "Y = a thread number"

