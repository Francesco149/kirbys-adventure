desc = """Never runs. The place of thread Y in the chain of object X: counts the steps from obj_first_thread[X] along
thread_next until the thread number equals Y. A = $00 = the count (0 when Y is the first thread). Loops on without
end when Y is not in the chain (a chain ends in $FF, which the loop does not test)."""
in = "X = object, Y = thread"
out = "A = $00 = the thread's place in the chain; $12 = Y"

[[sym]]
