unit = "dead_sys"
title = "Code and data no movie reaches in banks 37-3F: the minigames, the room code, the pause and the fixed banks"
summary = """
The bytes of the middle of banks 37-3F that no movie runs or reads, described from the ROM. The warp stars' number sprites (spr_37_8699) are now in the corpus (cov8-warp-star) and
documented in unit cov8. Most interesting first:

- File select, B on the file list (fsel_back_title, fsel_lower, split_step_back, title_reenter): state 2 is the
  ordinary file list, and cov9-a-fselb pressed B there; documented in unit cov9. Its neighbours title_scr_3D_AA80 /
  title_scr_3D_AA9F stay here.
- An older version of the object landing test in the fixed bank: obj_land_old (3F:F0A2, 171 bytes) is
  obj_test_land and obj_floor_approach (bank 22) in one routine. 136 of its bytes are the same as 22:9EDC-9F63. What
  changed: the kind was kept in $10 (now $0C), the caller set the point (now obj_pos_pair), any distance of 0 or more
  landed the object (now 0-8, and 9 or more or no surface counts as in the air), there was no 8-pixel depth limit,
  and obj_var7 went up by one (now = 1). Patched in, objects still land
  (dead_sys.land_old.effect).
- A second copy of snd_frame_far (and the tax / rts in front of it) at 3F:F8E7. Called from the NMI handler in its
  place, the game runs the same, byte for byte (dead_sys.snd_copy.effect).
- Quick Draw's hat row: qd_round_mark (3C:ABE5) would draw, when a round is decided, a 2x2 tile picture per round
  on the ground (row 20, columns 12, 14, 16, 18, 20) with palette 3. The game shows the hats as sprites instead, at
  qd_hat_x (four places: the fifth X, $F8, is never used either). Patched in place of qd_round_music, the row of
  background hats appears. The fifth picture's tiles are not in the CHR banks that are loaded then and show as
  boxes (picture unused/dead_sys-qd-marks.png).
- Crane Fever's sixth layout: crane_layouts holds the six orders of three places, but crane_pick_layout takes
  random(5), so the sixth row (2, 1, 0) never comes (dead_sys.crane_layout6.effect, picture).
- Quick Draw's desert, as two streams: packed_3C_A697 and packed_3C_A3FE expand to exactly the first and the second
  1,024 bytes of the desert stream the game uses (packed_3C_A7C9, 2,048 bytes). The game draws both name tables from
  one stream, and these two are left over.
- The sixteen pause texts this unit listed (Spark ... Throw, the Star Rod) were shown by cov9-a-rocky and
  cov9-a-w7card and are documented in unit cov9 (the Needle text's "lt's" with the lowercase l among them). Entry
  $1A of pause_desc_lo / _hi (ability $19), Sword's text again, is the only entry never read.
- Crane Fever's claw holding a doll as one picture: two pose tables in bank 3A (pose_tab_3A_87CE, pose_tab_3A_88AF)
  with three sprite groups each, the closed claw around a small or a big doll, the doll moving a pixel from group to
  group. The game draws the claw and the doll it carries as two objects. Drawn in place of the claw's pose
  (pictures unused/dead_sys-crane-groups.png, unused/dead_sys-crane-bigdoll.png).
- Older or extra minigame pieces: qd_scr_3C_B07E is another flight of Kirby's hat (the start and picture of
  qd_hat_off, other velocities); crane_cam_up is a simpler crane_tick_scroll (cam_y + 2 per frame up to $E0, and the
  same doubled ldx cur_object); egg_fall_old is egg_fall with a 3 x 4 gravity table by variable 7 and variable 2;
  crane_loop_step steps an object through 16 velocity pairs of a loop; Quick Draw's parts 4, 7 and $1A
  (qd_puff_right, qd_puff_left, qd_part_1a) are in qd_start's table, but nothing creates them.
- Small fixed-bank helpers nothing calls: prop_bit6_at (prop_bit7_at for bit 6), sprites_draw_mirror_y (the Y-only
  mirror between the X and XY entries), obj_thread_pos / obj_thread_nth (thread chain walks; the second loses its
  count after one step), asm_ppumask_set / asm_ppumask_clear (beside asm_ppumask_or), asm_spawn_slot_free,
  asm_cmp_obj_byte, asm_test_bit; bit_mask_not / bit_mask_rev beside bit_mask.
- Noise from the build: 3F:FD00-FFEF (752 bytes, after wind_noise, which reads the 256 bytes before it), 3F:F930
  and 3F:FFF9. Runs of $AA, $55, $FF and $00, a bias of the odd bits, a 45-byte block repeated $C0 bytes later. No
  instruction, pointer or table names them.

Not here: never-run branches inside routines that other units name (listed in the round's report), and the bank
ends. 3F:E000 is the operand of cpx cur_object at 3E:DFFF (objs_thaw_step), which crosses into bank 3F: it runs,
but the evidence does not count it.
"""

[[model]]
name = "dead_sys_m"
code = '''
def named(at):
    """lo / hi byte pairs equal to the CPU address of `at`, as 'BB:AAAA': those in its own bank; for a place in the
    fixed banks 3E / 3F (which any bank's script can name with asm_w) also those inside script bytes (kind 's' / 't')
    of every bank."""
    o = O(at) if isinstance(at, str) else at
    b = o >> 13
    return sorted(f"{p >> 13:02X}:{cpu(p):04X}" for p in ptrs(at) if (p >> 13) == b or (b >= 0x3E and kind(p) in "st"))

def dead(at, *expect):
    """No decoded instruction names it, and the byte pairs equal to its address are exactly `expect`."""
    return refs(at) == [] and named(at) == sorted(expect)

def hx(at, s):
    b = bytes.fromhex(s.replace(" ", ""))
    o = O(at) if isinstance(at, str) else at
    return rom[o:o + len(b)] == b

def unpack(at):
    """The bytes the packed stream at `at` expands to (the format of unit unpack)."""
    o = O(at) if isinstance(at, str) else at
    out = []
    while rom[o] != 0xFF:
        b = rom[o]
        if b & 0xE0 == 0xE0:
            c, n, o = b >> 2 & 7, ((b & 3) << 8 | rom[o + 1]) + 1, o + 2
        else:
            c, n, o = b >> 5, (b & 0x1F) + 1, o + 1
        if c == 0:
            out += list(rom[o:o + n]); o += n
        elif c == 1:
            out += [rom[o]] * n; o += 1
        elif c == 2:
            out += [rom[o], rom[o + 1]] * n; o += 2
        elif c == 3:
            out += [(rom[o] + i) & 0xFF for i in range(n)]; o += 1
        else:
            ref = rom[o] << 8 | rom[o + 1]; o += 2
            for i in range(n):
                v = out[ref - i] if c == 6 else out[ref + i]
                out.append(int(f"{v:08b}"[::-1], 2) if c == 5 else v)
    return out

FONT = {**{chr(65 + i): 0xE6 + i for i in range(26)}, " ": 0xBC}
def title(at, s):
    """The pause text's title row: after the 11 bytes $B1 come blanks ($BC), then the name in the title font."""
    u = unpack(at)
    k = 11
    while u[k] == 0xBC:
        k += 1
    return u[:11] == [0xB1] * 11 and u[k:k + len(s)] == [FONT[ch] for ch in s]
'''

