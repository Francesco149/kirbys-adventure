Read twice at cov9-b-sword@68094 (and the same frames of cov9-b-hammer, its branch): the hammer ape (type $4C) of 5-2 finishing a leap. The end of e4c_leap after its loop: endloop, 15 frames, variable 5 = 2, jmp 28:A438.
