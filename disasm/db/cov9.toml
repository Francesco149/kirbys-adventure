[[claim]]
id = "cov9.cannon_kind1_patch"
about = ["e06_shot_1", "e06_shot_spin", "e06_shot_tick_diag", "e06_shot_test_1", "e06_cam_x_on_obj", "e06_cam_x_end_clamp"]
text = "From cov3-a-cannon@60470 (world 3's cannon, nine frames before it fires) with the entry of e06_shot_kind for world 3 / variable 1 = 0 (23:A6E7) patched to 1: in 40 frames Kirby's flight runs e06_shot_test_1 once and e06_shot_tick_diag, the camera follows in X (e06_cam_x_on_obj, e06_cam_x_end_clamp), and e06_shot_tick_rise (the kind 0 flight of the plain movie) does not run."
kind = "effect"
on = "cov3-a-cannon@60470"
frames = 40
patch = { "23:A6E7" = 1 }
expect = "n('e06_shot_test_1') == 1 and n('e06_shot_tick_diag') > 0 and n('e06_cam_x_on_obj') > 0 and n('e06_cam_x_end_clamp') > 0 and n('e06_shot_tick_rise') == 0 and cn('e06_shot_tick_rise') > 0"


