name = "e3d_st_wait"
desc = """
102 calls in cov9-b-kracko from 59790 (while e3d_point_script runs). State $0A of e3d_tick_eye (entry 10 of e3d_states_b; e3d_states_a gives the states 3 and up its
2F:A204): an rts. The eye does nothing of its own while e3d_point_script moves it (e3d_st_to_point sets this state
when it arrives), and e3d_eye_hit leaves it out of obj_keep_in_box."""

[[sym]]
at = "2F:A2F5"
name = "e3d_st_to_point"
desc = """
38 calls in cov9-b-kracko (59744-59789). State 7 of e3d_tick_eye (entry 7 of e3d_states_b). e3d_dash (state 6) stores it when its dash ends
with variable 8 not 0 (lda #7 / ldy obj_var8,x / bne / lda #8 / sta: 7, else 8), and e3d_charge_start sets variable 8 = 1
when kirby_floor_test1 answers 0: Kirby standing on a floor (Y velocity 0, a floor block under him) when the charge
began. In main Kirby climbs as the UFO and never stands; cov5-g-kracko took the floor path at 59606 but ended at
59611, before the dash; cov9-b-kracko (Kirby on the floor at 59622) reached state 7 at 59743: the eye flies back to the point kept in $079E / $079F (X) and $07A1 / $07A2 (Y), where e3d_charge_start
put Kirby's world position when the last charge began. dir_to_point from the eye's world position to the point
(both with the high bytes + 1), rounded to one of eight directions ((d + $10) & $E0) into obj_dir, and obj_steer
with e3d_point_steer. When both distances are below 3 pixels: the position is set to the point, obj_vel_zero, state
$0A (e3d_st_wait) and the script becomes e3d_point_script (bank 2F). e3d_eye_hit skips obj_keep_in_box in this
state, so the eye may leave the screen to get there."""

