unit = "cov9"
title = "What the ninth batch of coverage movies ran first"
summary = """
What the ten movies of the ninth batch ran for the first time (tas/tasks/cov9-*.md). These entries were never = true
in the units dead_en1, dead_en2, dead_kirby and dead_sys before; the claims those units had made by patching or
poking moved here with them, beside claims on the movies.

Kracko's state 7 is reachable, and its floor breaker ran (cov9-b-kracko). The static round said nothing stores 7 in
the eye's variable 3; e3d_dash (state 6, en2f) does, at the end of every dash: lda #7 / ldy obj_var8,x / bne / lda #8
/ sta $6200,x, so state 7 when variable 8 is not 0, else 8. e3d_charge_start sets variable 8 = 1 when
kirby_floor_test1 answers 0, that is when Kirby stands on a floor (Y velocity 0 and a floor block under him) as the
charge begins. In main Kirby climbs as the glitched UFO and never stands; cov5-g-kracko took that path (59606) but
ended five frames later. In cov9-b-kracko Kirby (the UFO dropped) stood on the cloud floor at 59622: the dash ended in
state 7 at 59743, the eye flew back to the point (e3d_st_to_point), shook (e3d_point_script) and created the block
breaker, which emptied two blocks of the floor's column ($719E / $71AE, at 59829); its left and right halves freed
themselves at once (e3d_offscreen: the point was more than $100 pixels below the camera), then state 9
(e3d_st_after). Later in the same movie: the chase of a floating Kirby (state 3, e3d_st_chase, 59896) and its calm
end, and in the long fight e3d_pick1 choosing attack 4 (the walker, e3d_walker, landed and beaten) and then a
choice by e3d_choose (row $20, attack 3).

Also first run: 7-5's fuse cannon in room $A6 fired with shot kind 1, the diagonal flight with the camera
following in both axes into room $A7 (cov9-b-cannon); King Dedede's swing 2 with the high leap (e47_hammer_pick
answering 2 with Kirby floating high) and the flight's hurt reaction e47_flight_hurt (cov9-b-ddd); World 7's card
played out to the last fight (cov9-a-w7card, lvcard_done at 132527, e3f_tick from 132879) and the Star Rod's pause
text (133113); World 4's card played out after a CONTINUE (cov9-a-rocky, twice); the pause texts of fifteen
abilities (cov9-a-rocky); the second twinkles of THE END after 10,205 frames (cov9-a-theend); B on the file list
lowering the box back to the title (cov9-a-fselb); the thin-floor drops of the Parasol, the Sword and the Hammer, the
Parasol's dive bounce, the Cutter's blade at a wall, the end of sleep; the hammer ape's leap tail; two bytes of
endnoise_20_BC69 read by snd_next_byte with Y > 0 (bank_ends).

Open:
- The Star Rod's drop-through state stays unreachable: the rod is held only in rooms 15 and 16 (the last fight),
  which hold no thin floor, ladder or water (unit dead_kirby).
- The movie's maker found that a fuse spark left far behind the camera vanishes and $07DB is then never set, so
  the cannon does not fire; that is not claimed here.
- The block breaker's left and right halves never broke a block in a movie (only cov9.e3d_point_poke shows it);
  e3d_choose_0 and the floating rows of e3d_choices never ran.
"""


