obj_set_script) that the eye of type $3D runs when it has reached the point of state 7: on_tick e3d_tick_eye
(again), then a shake of the velocities -$0100 / +$0100 along Y and X for 2 and 4 frames each, a drift of -$00C0 /
+$0040 for 4 frames, asm_spawn of type $3D with variable 0 = 2 at its own place (e3d_blk_start: the block
breaker), six rounds of 1-frame jolts of $0200 and two of 2-frame jolts of $0100, a last jolt, 16 frames still,
variable 7 = $81 (the ring spins fast and faces Kirby, e3d_ring_tick), 8 frames, variable 7 = $80, state 9 and a jmp
to 2F:A05D (the halt of e3d_eye): from then on e3d_tick_eye alone, in e3d_st_after.
"""

[[sym]]
