unit = "en2c"
title = "Object types $43, $44, $46, $5A, $5B, $5D: the tree, the painter, the mole and their things"
summary = """
The object types whose scripts are in bank 2C: three bosses, each an object that runs its fight and keeps the
enemy's bar (objs_spawn puts its slot into hud_boss_slot; 22:8452 fills the bar, 60 hit points), and three types
that only they create. The bosses share a pattern with $45 of unit en28: a real record and a record nothing can damage,
a hurt shake of $18 frames (22:8D21 saves the state, 22:8DDC shakes, 22:8D84 brings it back), then $1E frames of
blinking in $078B; when the hit points are gone the record's script makes effects $0C, runs 22:83C8 and 22:81DF and
leaves an object of type 6 with variable 0 = 2. $0784-$078B serve the bosses as globals (obj_param of slot 0).

$43 (kind $D0, e43_*): the tree at the end of the first world (Whispy Woods by look). It waits for the camera, fills
the bar and then repeats rounds: a blink, then three apples ($5A, variable 0 = 1) or two puffs ($5A, variable 0 = 0),
by $0784 (e43_pick_first, e43_pick_next). A hit makes a spark ($5A, variable 0 = 2) and 30 frames of the hurt face,
during which the script stands still unless it is dropping apples.
$5A (e5a_*): the tree's things. The puff drifts left in legs of 9 or 11 frames (e5a_tick_puff); nothing can hit it.
The apple hangs at the top of the screen in one of five columns (one time in six above Kirby), shakes, falls, bounces
twice and rolls away along the ground (e5a_tick_roll1-3); it can be inhaled. The spark only makes the effect $0C.
$44 (kind $D2, e44_*): the painter of the second world (Paint Roller by look). From one of the four corners of the
room it skates a route to another corner (e44_pick_route: across, or one of three by chance; e44_route_step plays a
route from tables of waits, poses, velocities and sounds), then to the easel beside it, paints (the stroke, $44 with
variable 0 = 1) and leaves a painting ($5B). A hit spoils the stroke.
$5B (e5b_*): the painting. It flashes on the easel, picks a picture by weights that change at 30 hit points of the
painter and never repeat the last two (e5b_pick), shows it for 60 frames and comes alive: a car, a walker, a flyer,
a jumper that drops things ($5B, variable 0 = 1), or a parasol that goes on in e2a_chase of bank 25.
$46 (kind $D4, e46_*): the digging machine of the fifth world (Heavy Mole by look). The body sets cam_locked, keeps
the camera on its own Y and scrolls it with cam_vx; its X is relative to the camera. It runs legs of a list
(e46_leg: velocities by its phase, which follows its hit points, and routines for some legs), digs the blocks under
its pose's rectangles every 8 frames (e46_dig, block_break_at, a puff of earth drawn with sprites_draw_back) and,
from time to time, makes an object ($46, variable 0 = 3) that twenty times appears beside it and flies off to the left (e46_debris). Two claws ($46, variable 0 = 1) follow it,
above and below, with hit boxes of their own (variable 0 kept at $10, so they cannot be beaten) and by timers snap,
reach out and back, or grab.
$5D: first script 2C:BE7F, never started; its bytes look like another digger of the mole's room (e5d_data).

Open:
- $43: e43_puffs4 (2C:AA47, $0784 = 1), e43_pick_next with bit 0 of $0784 set (2C:AA9D); the puff's hit test never
  answered carry set; the draws 3 and 4 of e5a_puff_delay (code bytes as delays) were not seen to happen.
- $44: the routes 1 and 3 never ran and route 2 only for two steps; e44_pick_route's branches 2C:A201 and 2C:A23A;
  e44_tick's 2C:A1C0 (a new script by $0789 after the shake) and 2C:A1D7 (kind 1 of kirby_rect: 3F:E2B6); the
  answers of 22:8B24 that lengthen the cycle ran once each (2C:A06E, 2C:A090). What 22:8B24 compares exactly is unit
  ohelp's.
- $5B: the pictures 1, 2 and 4 never came alive (their scripts 2C:A73E, A750, A775 are unread bytes); the wall branch
  of e5b_tick_walk, the end of e5b_jumper (2C:A80E); what the creatures are called; what 22:8158 and 22:8180 do.
- $46: the type's variable 0 = 2 (2C:AE1B) and the claw script 2C:AE97; the legs 2, 4 and 6 and up, e46_side_test's
  answers 1 and 2, e46_choose beyond its one call, the clamps of e46_move, the reach branches 2C:BA2F / 2C:BA47, the
  debris's early end with bit 7 of $078A, e46_hit's 2C:AFA7 and 2C:AFFA, e46_speed_level from 0 with an X velocity of
  0; which object slot 0 is in that room (e46_level_follow reads its velocities). The fight is in main only, so its
  claims have what those 700 frames carry; e46_leg_vx / _vy, e46_dig_rects and e46_box_offsets were read in part.
- The names Whispy Woods, Paint Roller and Heavy Mole are by look and behaviour only.
- Bank 22 and others used by address: 22:8452 (bar fill), 22:89F3, 22:8B24, 22:8B35, 22:8D21 / 8D2D / 8D3B / 8D84 /
  8DDC (state save, shake, restore), 22:85B0 (effect), 22:83C8, 22:81DF, 22:8E7E, 22:8158, 22:8180, 3E:DED0 (spawn
  from operands), 3E:DE4B (sound), 3F:E26A (speed along obj_dir), 3F:E2B6, the position and move routines 3E:D97D,
  3E:D9BB, 3E:D86A. The pose tables 30:8BC6 (tree), 30:8294 (apple), 31:8E17 (painter), 31:9B35 (mole) and the
  sprite pointers 31:9BC7 keep their names in unit sprites.
"""

# ================================================================= shared model

[[model]]
name = "en2c_model"
code = '''
E43_TICKS = [0xAB2F, 0xAB1E]
E5A_PUFF_WAIT = [8, 8, 8, 8, 10]
E5A_PUFF_VXH = [0xFF, 0xFE, 0xFD, 0xFD, 0xFC]
E5A_PUFF_VY = [0xFF80, 0x0000, 0xFF80, 0xFFC0, 0xFF00, 0xFFC0, 0xFF00, 0x00C0, 0x0100, 0x0000, 0x0080, 0x0000, 0x0080, 0x00C0, 0x0100]
E5A_PUFF_DELAY = [0, 5, 10, 0xA9, 6]
E5A_COLS = [0x00, 0x20, 0x40, 0x60, 0x80, 0xFF]
E5A_COL_X = [0x00, 0x10, 0x30, 0x50, 0x70, 0x90, 0x11]

def e2c_script(wr, lo, hi, bank=0x2C):
    """obj_set_script gave a thread the address hi:lo in this bank."""
    return any(wr.get(0x6380 + t) == lo and wr.get(0x63A0 + t) == hi and wr.get(0x63C0 + t) == bank for t in range(32))

def e2c_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def e2c_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def e2c_spawned(wr, typ):
    """The slots 9-17 in which the call created an object of this type."""
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]

def e2c_tick(wr, s):
    """The tick routine the call gave slot s, or None."""
    if (0x627E + s) not in wr:
        return None
    return wr[0x627E + s] | wr[0x6290 + s] << 8
'''

