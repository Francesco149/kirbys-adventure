            return False
        if not ran("2C:A17E"):
            return "snd_play" not in calls and (0x6224 + s) not in wr
        if "snd_play" not in calls:
            return False
        if not ran("2C:A18C"):
            return not ran("22:8DDC")
        if (ran("2C:A191") > 0) != (rd[0x6236 + s] != 0) or not ran("22:85B0") or not ran("22:8D21"):
