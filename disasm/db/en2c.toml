        if acc >= r:
            k = y
            break
    return wr[0x6224 + s] == k and wr[0x62C6 + s] == E5B_POSES[2 * k + (rd[0x61DC + s] >> 7)] and wr[0x787] == ((rd[0x787] << 4) | k) & 0xFF
'''
expect = "e5b_pick_ok(rd, wr)"

