    sp = e2c_spawned(wr, 0x5A)
    if "snd_play" not in calls or len(sp) != 1 or wr[0x61CA + sp[0]] != 2:
        return False
    if not ran("2C:AAEB"):
        return e2c_script(wr, 0x6A, 0xAA)
    hi = rd[0x6200 + s] >= 2
    return (e2c_tick(wr, s) in (E43_TICKS[hi], 0xAACB) and wr[0x6224 + s] == 0x1D
        and (ran("22:8D2D") > 0) == hi and ran("22:8D3B") == 1 and ran("2C:AB4A") == 1)
