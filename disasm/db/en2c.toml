# ================================================================= type $43: the tree

[[script]]
at = "2C:A9B3"
name = "e43_start"
desc = """
First script of object type $43 (kind $D0): the first boss, a tree with a face at the right edge of its room, the
game's Whispy Woods (w12-opus@18200: the tree with eyes, a nose and a mouth). Third coordinate $FF, bank 22, the
position routine 3E:D97D, the pose table 30:8BC6, pose 0. Then a loop that asks e43_cam_ready every frame until the
camera has come down to the arena (the low byte of cam_y $C8 or more), 22:89F3, $0784 = 4 (the attack of the next
round, see e43_pick_first), the script 22:8452 as a subroutine (the enemy's bar fills: variable 0 from 0 in twenty
steps of 3 with sound $12, 6 frames apart, then 60 hit points), tick routine e43_tick, and on into e43_round.
"""

[[script]]
at = "2C:A9D5"
name = "e43_round"
desc = """
A round of the tree: variable 2 = $FF, variable 3 = 4, pose 0 for $14 frames, the poses 1, 2, 1, 0 (3, 6, 3 frames,
a blink), $14 frames, the poses 1, 2, 1, 0 again (3, 8, 3, 10 frames), e43_pick_first, and the jump table at
2C:A9EC on the register ($0784): 0 e43_puffs (two puffs), 1 e43_puffs4 (2C:AA47, four puffs, never ran), 2 and 3
e43_apples.
"""

[[script]]
at = "2C:A9F6"
name = "e43_apples"
desc = """
The tree drops three apples: variable 2 = 3 (apples left; each new apple counts it down with e5a_parent_count),
variable 3 = 0. From 2C:A9FC: a new object of type $5A with variable 0 = 1 (an apple, e5a_apple) in a slot of 9-17
at its own place (3E:DED0), pose 0 for $1E frames, the poses 1, 2, 1 (4, 6, 4 frames) and pose 0 for $30 frames;
again from 2C:A9FC while variable 2 is not 0. Then e43_pick_next and e43_round.
"""

[[script]]
at = "2C:AA20"
name = "e43_puffs"
desc = """
The tree blows: the poses 7, 8, 9 (1, 5 and 12 frames: the mouth opens), variable 2 = 2 (puffs left), variable 3 =
1 and then 2. From 2C:AA2D: a new object of type $5A with variable 0 = 0 (a puff, e5a_puff) 16 pixels left of and 24
below its place, the poses 9, 8, 7 (12, 1, 1 frames); again while variable 2 is not 0; then e43_pick_next and
e43_round. At 2C:AA47 the same with variable 2 = 4 (four puffs; never ran: $0784 never became 1).
"""

[[script]]
at = "2C:AA6A"
name = "e43_beaten"
desc = """
The reaction of the tree's record to hit points gone and to kind 2 of kirby_rect: no tick routine; fx_create_rec
with 0, 0, $0C, 0 (an effect $0C at its place), the script 22:83C8 as a subroutine, the effect again, the script
22:81DF, a new object of type 6 with variable 0 = 2 at its place, third coordinate $FF, the pose table 30:8BC6, pose
6 for 8 frames, pose 5 for 15, and the thread halts: the tree stays with its last face.
"""

[[sym]]
at = "2C:AA97"
name = "e43_pick_next"
desc = """
After an attack: the next value of $0784. With bit 0 of $0784 clear (always so in the corpus): a random number below
4; when it is 0 bit 0 of $0784 is flipped, otherwise bit 1. With bit 0 set (2C:AA9D, never ran): $0784 = (($0784 >>
1) xor 1) << 1. So 0 and 2 (puffs, apples) alternate three times in four.
"""

[[sym]]
at = "2C:AABA"
name = "e43_pick_first"
desc = "For e43_round: when $0784 is 4 (the first round), $0784 = 2 x a random number below 2 (0 puffs or 2 apples). Returns A = $0784, which the asm opcode leaves in the register for the jump table."
out = "A = $0784"

[[sym]]
at = "2C:AACB"
name = "e43_tick"
desc = """
Tick routine of the tree. 3F:E31D with the record 39:9554: a box of 8 x 48 pixels, flags $80, inhale number $FF,
hurt byte 8, score entry $0B; hit points gone and kind 2 of kirby_rect: the script e43_beaten; damaged: variable 5 =
1. Not hit: nothing more. Hit: sound $34 and a new object of type $5A with variable 0 = 2 at its place
(obj_spawn_child_dir: e5a_spark). Variable 5 still 0 (the hit was its last): nothing more. Otherwise the hurt face:
variable 5 = $1E, the tick routine e43_tick_hurt (variable 3 = 2 or more: idle or blowing) after 22:8D2D (which
goes on into 22:8D3B), or e43_tick_hurt_free (variable 3 below 2: dropping apples) after 22:8D3B alone (they save
the object's state in $0798-$07A4), and that routine runs at once (an indirect jump).
"""
comments = { "AAD5" = "hit", "AAEB" = "damaged: 30 frames of the hurt face", "AB0E" = "the script waits", "AB14" = "the apples go on" }

[[data]]
