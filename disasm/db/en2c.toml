[[script]]
at = "2C:A000"
name = "e44_start"
desc = """
First script of object type $44 (kind $D2): the boss of the second world, a painter on skates in a room of four
easels (main@27000, w12-opus@49300; by its look and its paintings the game's Paint Roller). chr_bank + 1 = $B0, bank
22, the position routine 3E:D9BB, the pose table 31:8E17. Created with variable 0 not 0 it is the brush stroke
(e44_stroke). Otherwise variables 5 and 6 = 0, $0784 = 1 (the corner it is at: 0 lower left, 1 upper left, 2 lower
right, 3 upper right), $0786 = 1, $0787 = $11, $0788 = $FE, $078B = 0, third coordinate $7F, $0789 = 0,
e44_to_corner, a second thread e44_idle_loop, the script 22:8452 as a subroutine (the bar fills; 60 hit points),
and the end of the second thread; on into e44_fight.
"""

[[script]]
at = "2C:A03D"
name = "e44_fight"
desc = """
The painter's cycle. Tick routine e44_tick, $0789 = 0, e44_to_corner, route 0 ($0785 = 0, variable 2 = 4): four
steps of e44_route_step, one per wait (a little dance in place). e44_pick_route and the route it picked, step by
step until variable 2 is 0; velocity 0, e44_to_corner (exactly at the corner). With fewer than 30 hit points
(22:8B24 with $1E answers not 0; once, w12-sonnet@65484) $0789 = 1 and e44_idle once. Then $0789 = 0, route 7
(variable 2 = 5: it skates to the easel), with fewer than 30 hit points $20 frames more (2C:A090, once); a new
object of type $44 with variable 0 = 1, 16 pixels above (e44_stroke), its slot in variable 6; a new object of type
$5B at its place (the painting, e5b_start); route 8 (variable 2 = 5: back to the corner), variable 6 = 0, and
e44_idle as often as e44_extra_idles answers (2C:A0C2, a loop by the register). Then again from the start.
"""

[[script]]
at = "2C:A0D5"
name = "e44_idle_loop"
desc = "The second thread of e44_start while the bar fills: e44_idle for ever (it is ended by the main thread's end_last_task)."

[[script]]
at = "2C:A0DB"
name = "e44_idle"
desc = "A subroutine: velocity 0, the pose 6 of its direction (asm_pose_dir) for 6 frames, the pose 6 before it for $18 frames, back to 6 for 6, 4 further for $18 frames, and return."

[[script]]
at = "2C:A0EB"
name = "e44_stroke"
desc = """
Type $44 created with variable 0 = 1 by e44_fight, 16 pixels above the painter at the easel (w12-opus@49300: the
black strokes on the upper right canvas): third coordinate $7E; five times: obj_pose_dir0, then ten poses, 14 and
then 2 further each time, one frame each (the brush goes over the canvas); the object ends. e44_tick frees it when
the painter is hit in the meantime.
"""

[[script]]
at = "2C:A109"
name = "e44_beaten"
desc = """
The reaction of the painter's record to hit points gone and to kind 2 of kirby_rect: velocity 0, fx_create_rec with
0, 0, $0C, 0, the script 22:83C8 as a subroutine, the effect again, the script 22:81DF, a new object of type 6 with
variable 0 = 2 at its place, and the object ends.
"""

[[sym]]
at = "2C:A12C"
name = "e44_tick"
desc = """
Tick routine of the painter, in the pattern of e45_hit of unit en28. While $078B is not 0 (blinking after a hit):
bit 7 of obj_sprite_bank flips when the low two bits of obj_frame are 0, $078B - 1, 3F:E31D with the record
39:9464 (12 x 14, flags $80, nothing but kind 1: variable 5 = $FF), variables 0 and 1 kept as they were. Otherwise
bit 7 of obj_sprite_bank is cleared, obj_dir is kept for the end, and with variable 5 = 0 3F:E31D with the record
39:944C (12 x 14, flags $80, hurt byte 8, score entry $13; hit points gone and kind 2: e44_beaten; damaged:
variable 5 = $18; kind 1: variable 5 = $FF). Not hit: nothing more. Hit: sound $34; variable 5 still 0 (beaten):
nothing more; otherwise the stroke in variable 6 is freed (obj_free; the painting is spoilt), 22:85B0 with $18 and 0
(an effect at its place), 22:8D21 (its state saved). In every frame of the hurt shake (variable 5 not 0): 22:8DDC with
Y = variable 5, variable 5 - 1; at 0 22:8D84 (the state comes back) and $078B = $1E (30 frames of blinking). The
branches for a negative variable 5 (2C:A1D7: 3F:E2B6) and for $0789 not 0 at the end of the shake (2C:A1C0: the
script e44_fight or 2C:A0CE by $0789) never ran.
"""
comments = { "A133" = "blinking", "A164" = "not blinking", "A17E" = "hit", "A18C" = "damaged: spoil the painting", "A19F" = "the hurt shake", "A1AC" = "the shake is over" }

