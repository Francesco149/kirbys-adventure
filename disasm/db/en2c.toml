name = "e43_tick_hurt_free"
desc = "Tick routine of the tree hurt while it drops apples: with variable 3 below 2 just e43_hurt_step (the script goes on); when variable 3 has become 2 or more (the round ended), 22:8D2D, tick routine e43_tick_hurt and on into it (2 runs)."

[[sym]]
