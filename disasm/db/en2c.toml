# ================================================================= type $46: the mole

[[script]]
at = "2C:AD63"
name = "e46_start"
desc = """
First script of object type $46 (kind $D4): the boss of the fifth world, a digging machine with two claws in a
room of earth (main@81300: the round body with a claw above and one below, digging to the right; by its look the
game's Heavy Mole). chr_bank + 1 = $B2, bank 22, the pose table 31:9B35, the position routine 3E:D97D, and the jump
table at 2C:AD72 on variable 0: 0 e46_body, 1 e46_claw, 2 2C:AE1B (never ran), 3 e46_debris. The table declares
five entries and has four: a fifth would be the first two bytes of e46_body ($11, $FA).
"""

[[script]]
at = "2C:AD7C"
name = "e46_body"
desc = """
The body (variable 0 = 0, from the room's list). cam_locked = 1, variable 1 = 0; two objects of type $46 with
variable 0 = 1 at its place, the direction offsets 0 and 1 (the claws above and below); e46_body_place; zero_e2,
velocity 0, the move routine 3E:D86A, third coordinate $80, variable 1 = $40, variable 2 = $60, variable 3 = $78,
variable 5 = 0, variable 6 = $F0; $0784 = $78 (the frames of the first leg), $0785-$0787 = 0, $078A = $30, $078B = 0,
$07A9 = 4, $0797 = 0; e46_phase; third velocity $FF01; a second thread e46_bar_thread; tick routine e46_tick; pose
$30, and for ever the poses $30, $31, $32 with the waits of e46_wait.
"""

[[script]]
at = "2C:ADF2"
name = "e46_bar_thread"
desc = "The second thread of e46_body: the script 22:8452 as a subroutine (the bar fills; 60 hit points), and the thread ends (end_task). While it lives e46_tick makes no hit test."

[[script]]
at = "2C:ADF6"
name = "e46_beaten"
desc = """
The reaction of the body's record to hit points gone: fx_create_rec with 0, 0, $0C, 0, the script 22:83C8 as a
subroutine, 22:8E7E, the effect again, the script 22:81DF, a new object of type 6 with variable 0 = 2 at its place,
and the object ends (main@81787).
"""

[[script]]
at = "2C:AE3E"
name = "e46_claw"
desc = """
A claw (variable 0 = 1; e46_body creates two): the move routine 3E:D86A, third velocity $7801, variable 3 = variable
1 (0 the upper claw, third coordinate $7F; 1 the lower, $81). From 2C:AE54 (also entry 4 of e46_claw_scripts): X
and Y offset 0, e46_claw_timer, variable 5 = 0, pose 0, tick routine e46_tick_claw, and the thread parks.
"""

[[script]]
at = "2C:AE67"
name = "e46_claw_snap"
desc = "Entry 5 of e46_claw_scripts: tick routine e46_tick_snap, offsets 0, and for ever the poses 4 and 5, 2 frames each: the claw snaps while it stays at the body."

[[script]]
at = "2C:AE77"
name = "e46_claw_reach"
desc = """
Entries 0 and 1 of e46_claw_scripts: offsets 0, tick routine e46_tick_reach, e46_reach_begin, the pose 10 further,
e46_reach_wait; from 2C:AE89 e46_reach_step each wait until it answers not 0; e46_reach_end, variable 6 | $20 (an
or), and the thread parks. The rest (2C:AE97, entry 3 of e46_claw_scripts) never ran.
"""

[[script]]
at = "2C:AEA4"
name = "e46_claw_grab"
desc = "Entry 2 of e46_claw_scripts: offsets 0, variable 6 = $18, tick routine e46_tick_grab, and e46_grab_step each wait while it answers not 0; then pose 4 for 2 frames and the thread parks (once, main@81384)."

[[script]]
at = "2C:AEBA"
name = "e46_debris"
desc = """
Type $46 with variable 0 = 3, created by e46_tick when variable 6 of the body runs out (once, main@81418): variable 3
= $14; twenty times: variable 0 = 6, velocity 0, e46_debris_place (16 pixels left of the body, beside its upper or
lower half), tick routine e46_tick_debris, 5 frames, pose $3E for 2, variable 3 - 1 (binop with $FF). Then tick
routine e46_debris_end, which frees it, and the thread parks.
"""

[[sym]]
at = "2C:AEDA"
name = "e46_tick"
desc = """
Tick routine of the body. Only when its first thread has no next one (the bar has filled): e46_hit; carry set: on
at 2C:AF10. Variable 2 - 1; negative: e46_pose_turn. $0784 - 1 (the frames of the leg); at 0, with the low nibble of
$0785 (repeats) 0, e46_leg (the next leg), else that nibble - 1. Variable 3 - 1; at 0 variable 3 = $78 and
e46_speed_level. With bit 7 of $078A clear and variable 6 not $FF: variable 6 - 1; at 0 the low nibble of $078A - 1
(from 0 to 2) and a new object of type $46 with variable 0 = 3 (obj_spawn_child_dir: e46_debris). Then e46_move and
on in e46_dig.
"""
comments = { "AEE4" = "the bar has filled: hit test", "AEF3" = "the leg's frames", "AF10" = "variable 3: every $78 frames", "AF1D" = "variable 6: the debris" }

[[sym]]
at = "2C:AF56"
name = "e46_hit"
desc = """
The body's hit test, in the pattern of e44_tick. $078B not 0: bit 7 of obj_sprite_bank flips when the low two bits
of obj_frame are 0, $078B - 1, 3F:E31D with the record 39:95B4 (10 x 16, flags $80, score entry $15, only kind 1:
variable 5 = $FF), variable 0 kept; carry clear. Otherwise bit 7 cleared and, with variable 5 = 0, 3F:E31D with
39:959C (the same box, hurt byte 8; hit points gone e46_beaten; damaged variable 5 = $18; kind 1 variable 5 = $FF).
Not hit: carry clear. Hit: sound $34; variable 5 still 0: carry clear; otherwise 22:8D21, the first thread's wait =
$079C, e46_hurt_pose. Each frame of the shake: 22:8DDC, variable 5 - 1, carry set; at 0 the pose and the first
thread's wait are kept across 22:8D84, e46_hurt_unpose, $078B = $1E, carry clear. The branches for $0786 = 0
(2C:AFA7) and a negative variable 5 (2C:AFFA: 3F:E2B6) never ran.
"""
out = "carry set: the hurt shake goes on"

[[sym]]
at = "2C:B004"
name = "e46_leg"
desc = """
The next leg of the body's way: $0786 + 1 indexes the list at 2C:B0EA (e46_legs); for leg k: the velocities = the
words e46_leg_vx / e46_leg_vy at 2 x (the low nibble of $0787: the phase) + e46_leg_row[k], $0784 = e46_leg_time[k],
$0785 = e46_leg_rep[k] (0 in every entry); legs 0-5 then run a routine of e46_leg_special (through call_target).
Returns Y = $0785.
"""

[[data]]
at = "2C:B066"
len = 66
name = "e46_leg_vx"
format = "rows:6"
desc = "For e46_leg and e46_leg_turn: X velocities, 33 words by row + 2 x phase (rows of three phases). Read were only the first words (0)."

[[data]]
at = "2C:B0A8"
len = 66
name = "e46_leg_vy"
format = "rows:6"
desc = "For e46_leg and e46_leg_turn: Y velocities as e46_leg_vx. Read were the words 0-2 and 3 ($0040)."

[[data]]
at = "2C:B0EA"
len = 47
name = "e46_legs"
format = "bytes"
desc = "The body's way for e46_leg, by $0786 (entry 0 is never read; the first leg is entry 1): 0, 1, 2, 4, 0, 1, 3, 5, then legs 6 and up. Read were the entries 1, 2, 7 and 8 (the legs 0, 1, 3, 5)."

[[data]]
at = "2C:B119"
len = 60
name = "e46_leg_tabs"
format = "rows:20"
desc = "For e46_leg by leg 0-19: the row of the velocity words (0, 0, 0, 0, 0, 0, $12, $12, $1E, ...), the frames of the leg (0, 0, $F0, $B4, $F0, $78, ...), the repeats (all 0)."

[[sym]]
at = "2C:B155"
name = "e46_leg_special"
desc = "For e46_leg: jumps to the routine of leg A (0-5) by the tables after it: 0 e46_leg_aim (2C:B171), 1 e46_leg_turn (2C:B1F0), 2 2C:B26C (never ran), 3 e46_leg_y (2C:B267), 4 and 5 e46_leg_count (2C:B241)."

[[sym]]
at = "2C:B171"
name = "e46_leg_aim"
desc = """
Leg 0 (once, main@81283): e46_phase; cam_vx = the word of 2C:B1E7 / B1EA by phase ($0040: the camera scrolls right
with it); the body's X distance from the X of 2C:B1ED by phase ($C0) through obj_abs16 and the division 22:8B35 by
2C:B1E4 ($40) gives $0784 (+1) and $0785; X velocity $40 toward that X (negated on the other side, never ran), Y
velocity 0.
"""

[[sym]]
at = "2C:B1F0"
name = "e46_leg_turn"
desc = """
Leg 1 (once, main@81351): X position = the X of 2C:B1ED by phase, X high byte 0, fraction $80; e46_choose; $0786 =
2C:B237[that] (the next leg of the list), the return address is dropped; the high nibble of $078A - 1 (at 0 a new
object of type $46 with variable 0 = 2: never ran); and on at e46_leg (a leg at once).
"""

[[sym]]
at = "2C:B241"
name = "e46_leg_count"
desc = "Legs 4 and 5 (once, main@81669): the high nibble of $078A - 1; when it reaches 0 a new object of type $46 with variable 0 = 2 (never ran)."

[[sym]]
at = "2C:B267"
name = "e46_leg_y"
desc = "Leg 3 (once, main@81351): e46_side_test with A = 1; e46_leg_y_tab by its answer (2: a random number below 2), plus 2 x phase, picks a velocity word pair of e46_leg_vx / e46_leg_vy."

[[sym]]
at = "2C:B2A8"
name = "e46_side_test"
desc = "For e46_leg_y: compares the body's Y plus two offsets of 2C:B317 / B327 (by 8 x A + 2 x phase) with $07A5 + $60 and $07A5 - $60 (the earth band); returns 0, 1 or 2 by which bound is passed (0 in the one call)."

[[sym]]
at = "2C:B337"
name = "e46_choose"
desc = "For e46_leg_turn: a choice by the weights of 2C:B3AE (4 per phase) minus the last choice (high nibble of $0787), with a random number below $FF less the excluded weight (2C:B3BA); the choice goes to the high nibble of $0787 and A = 2 x choice + (random & 2C:B3AA[choice])."

[[sym]]
at = "2C:B3C6"
name = "e46_phase"
desc = "The low nibble of $0787 = the phase by the hit points: 0 from $32 up, 1 from $1E, 2 below (2C:B3E3: $32, $1E)."

[[sym]]
at = "2C:B3E5"
name = "e46_speed_level"
desc = "Every $78 frames: variable 8 (-1, 0, 1: the speed of the pose cycle) follows the X velocity: negative, variable 8 - 1 (at least -1); positive, + 1 (at most 1); 0, variable 8 = 0 (from 0 it would go to -1 or 1 by variable 9: never ran). Variable 9 keeps the old variable 8, except at a bound."

[[sym]]
at = "2C:B422"
name = "e46_pose_turn"
desc = "For e46_tick when variable 2 runs out: variable 2 = $F0 becomes $60 (Y = 1), otherwise Y = (variable 2 xor $FF) >> 2; the pose's place in its group of three ($30-$32 or $33-$35) is kept and the group is 2C:B44D[Y] ($33, $30, $30, $33)."

[[sym]]
at = "2C:B451"
name = "e46_hurt_pose"
desc = "For e46_hit: the pose $30-$32 becomes $36-$38 (the hurt face)."

[[sym]]
at = "2C:B466"
name = "e46_hurt_unpose"
desc = "For e46_hit at the end of the shake: pose - 3, and - 6 when variable 2 is not negative."

[[sym]]
at = "2C:B479"
name = "e46_wait"
desc = "For the pose loop of e46_body: the wait of the current thread = e46_waits[variable 8 + 1]: 8, 4 or 2 frames for variable 8 = -1, 0, 1 (slower when it moves left, faster when it moves right)."

[[sym]]
at = "2C:B48B"
name = "e46_body_place"
desc = "X position = $B0 (on the screen: the body's X is relative to the camera), Y position = cam_y + $60, kept in $07A5 / $07A6 (the middle of the earth band)."

[[sym]]
at = "2C:B4AB"
name = "e46_move"
desc = """
The body's move: obj_integrate; the Y position is kept within $07A5 +/- $60 (never had to); the camera follows
it: cam_y_frac = the Y fraction, cam_y = Y - $60; cam_integrate (the camera moves by cam_vx); world X = cam_x + X
(+ the carry of cam_vx + X fraction), world Y = Y.
"""

[[sym]]
at = "2C:B595"
name = "e46_tick_claw"
desc = """
Tick routine of a claw at rest. Variable 9 - 1; at 0 variable 9 = $78 and e46_level_down. When variable 9 equals an
entry of 2C:B60A ($0F, $1E, ... $78), e46_level_follow with the entry's parity. Variable 4 - 1; negative: variable 4
= 2C:B612[variable 8] (8, 2, 1 frames by level) and the pose steps by 2C:B616[variable 3] (-1 upper, +1 lower)
within 0-3 (3 below 0, 0 from 4). Variable 6 - 1; at 0 variable 6 = 2C:B618[the body has $1E hit points or more]
($2D or $5A) and e46_claw_script with Y = 5 (e46_claw_snap). Then e46_claw_follow, e46_claw_boxes,
e46_claw_draw and on in e46_dig.
"""

[[sym]]
at = "2C:B61A"
name = "e46_tick_snap"
desc = "Tick routine of e46_claw_snap: variable 6 - 1; at 0 variable 6 = a random number below 4 and e46_claw_script with it (0-3: reach, reach, grab, 2C:AE97). Then e46_claw_follow, e46_claw_boxes, e46_claw_draw, e46_dig."

[[sym]]
at = "2C:B63B"
name = "e46_tick_reach"
desc = "Tick routine of e46_claw_reach: pose xor 1 every frame when bit 0 of variable 6 is set, else on even frames; when bit 5 of variable 6 is set (the reach is over) e46_claw_script with Y = 4 (back to e46_claw). Then e46_claw_follow, e46_claw_boxes, e46_claw_draw, e46_dig."

[[sym]]
at = "2C:B739"
name = "e46_tick_grab"
desc = "Tick routine of e46_claw_grab: pose xor 1 on even frames. Variable 6 = 0 (once): variable 5 = $28 ($5A with $1E hit points or more, never ran), variable 6 = $FF; negative: variable 5 - 1, and when that goes negative variable 8 = 3 and e46_claw_script with Y = 4. Then e46_claw_follow, e46_claw_boxes, e46_claw_draw, e46_dig."

[[sym]]
at = "2C:B782"
name = "e46_claw_follow"
desc = "A claw's world position: world X = the body's (slot in variable 2) world X + its own X offset; world Y = the body's Y position + 2C:B7BD[variable 3] (-$12 upper, +$12 lower) + its own Y offset."

[[sym]]
at = "2C:B7C1"
name = "e46_claw_boxes"
desc = "A claw's hit boxes by its pose: e46_claw_box with Y = e46_box_first[pose], and when e46_box_two[pose] is not 0 once more with Y - $14."

[[sym]]
at = "2C:B7E0"
name = "e46_claw_box"
desc = """
One box: the world position is moved by the word pair at 2C:B8A4 + Y (X, then Y offset), variable 0 = $10 (it
cannot run out), 3F:E31D with the record 39:95CC (8 x 8, flags $20: shots pass, inhale number $FF, hurt byte 8; kind
1: variable 7 = $FF), the world position back. With variable 7 not 0 (never ran) variable 7 = 0 and 3F:E2B6.
"""

[[data]]
at = "2C:B844"
len = 96
name = "e46_box_tabs"
format = "rows:16"
desc = "For e46_claw_boxes by pose 0-47: the offset Y into 2C:B8A4 of the first box, then (from 2C:B874) whether there is a second box 20 bytes before it."

[[data]]
at = "2C:B8A4"
len = 84
name = "e46_box_offsets"
format = "rows:4"
desc = "For e46_claw_box: 21 pairs of signed words (X, Y) from a claw's place to the middle of a box."

[[sym]]
at = "2C:B8F8"
name = "e46_claw_draw"
desc = "A claw takes the body's bit 7 of obj_sprite_bank (it blinks with it) and the body's draw routine (obj_draw_lo / _hi)."

[[sym]]
at = "2C:B919"
name = "e46_level_follow"
desc = "For e46_tick_claw: A = 0 looks at the X velocity of slot 0 ($60F2 / $60E0), A = 1 at its Y velocity ($6116 / $6104): negative, e46_level_down; positive, variable 8 + 1 (at most 3); 0, nothing."

[[sym]]
at = "2C:B943"
name = "e46_level_down"
desc = "Variable 8 - 1, at least 0 (the 0 floor never needed)."

[[sym]]
at = "2C:B95E"
kind = "part"
name = "e46_timer_set"
desc = "Variable 6 = 2C:B97A[2 x variable 3 + (1 when the body has fewer than $1E hit points)]: $3C, $78 (upper), $78, $F0 (lower)."

[[sym]]
at = "2C:B980"
name = "e46_claw_timer"
desc = "For e46_claw: e46_timer_set (the Y of 4 for a lower claw is lost there)."

[[sym]]
at = "2C:B98C"
name = "e46_reach_begin"
desc = "For e46_claw_reach: the pose = 2C:BA05[variable 3] ($06 upper, $1C lower); a random number below $10: half of it (index into 2C:B9F2) is added to the pose (and 1 for the upper claw); bit 7 of variable 6 = its low bit; the current thread waits 2C:BA02[...] frames by the body's hit points and bit 0 of variable 6."

[[sym]]
at = "2C:BA07"
name = "e46_reach_step"
desc = "For e46_claw_reach: jumps by bits 7-6 of variable 6 to 2C:BA29 (out) or 2C:BA41 (back) (2C:BA2F and 2C:BA47 never ran)."
out = "A = 0 (go on) or 1 (done), the zero flag with it"

[[sym]]
at = "2C:BA29"
name = "e46_reach_out"
desc = "e46_pose_out; when it answers carry set bit 6 of variable 6 is set (from now on back); A = 0 and the wait of e46_reach_wait."

[[sym]]
at = "2C:BA41"
name = "e46_reach_back"
desc = "e46_pose_back; A = 1 when it answers carry set (the claw is home), else 0; the wait of e46_reach_wait with Y = 2."

[[sym]]
