def e44_tick_ok(rd, wr, ran, calls, mem):
    s = rd[0x6E]
    sb = 0x62FC + s
    if rd[0x78B]:
        if wr[0x78B] != rd[0x78B] - 1 or wr[0x27] != 0x64 or wr[0x28] != 0x94:
            return False
        if mem(0x61CA + s) != rd[0x61CA + s] or mem(0x61DC + s) != rd[0x61DC + s]:
            return False
        flip = rd[0x603D] & 3 == 0
        return (sb in wr) == flip and (not flip or wr[sb] == rd[sb] ^ 0x80)
    if mem(sb) != rd[sb] & 0x7F or mem(0x61DC + s) != rd[0x61DC + s]:
