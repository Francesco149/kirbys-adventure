cases = { "ra != 0" = 5, "ra == 0" = 50 }
expect = "rd[0x5F8] == 0 and ra == slope_of(rd[0x5F4], rd.get(0x61DD, 0)) + romrd[O('slope_index_0_add')] and romrd[O('slope_index_0_add')] == 0 and wr[0x5ED] == fki(rd[0x5F4])"

[[claim]]
id = "khelp2.slope_index_5"
about = ["slope_index_5", "slope_index_5_add"]
text = "Every call of slope_index_5 (all with floor_flag 0) returns A = slope_profile's number for floor_kind and kirby_facing + slope_index_5_add[0], which is 5, and writes floor_index_prev = floor_kind - 2 for kinds 2-5, else 4."
kind = "call"
fn = "slope_index_5"
