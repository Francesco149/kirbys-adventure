[[claim]]
id = "khelp2.bump_pose"
about = ["bump_pose_script", "bump_pose_off"]
text = "Every call of bump_pose_script reads bump_pose_off[bump_kind]; when that is not negative the pose of the current object is written as it + the ROM byte at script_ptr + 1, and when it is $FF as 2 * (floor_kind - 2 for kinds 2-5, else 4) + the byte at script_ptr + 2; in both cases + 1 when the object's variable 1 is negative. script_ptr's low byte ends 2 higher."
kind = "call"
fn = "bump_pose_script"
on = ["main@400+3000", "w3-sonnet@500+3000", "w12-sonnet@1200+3000", "w1-v2-sonnet@800+3000", "attract@1100+3500", "w3-sonnet@10500+100", "main@17000+60"]
min_calls = 45
max_calls = 3000
use = ["khelp2_model"]
cases = { 'ran("21:8027")' = 3, 'ran("21:802E")' = 40, "rd[0x61DC + rd[0x6E]] & 0x80" = 3, 'ran("21:8027") and rd[0x5E4] != 0' = 1 }
expect = "(lambda t, f: wr[0x62C6 + rd[0x6E]] == ((t + sbyte(rd, romrd, 1) if t < 0x80 else 2 * fki(rd[0x5F4]) + sbyte(rd, romrd, 2)) + f) & 0xFF)(romrd[O('bump_pose_off') + rd[0x5E4]], rd[0x61DC + rd[0x6E]] >> 7) and wr[0x1E] == rd[0x1E] + 2 & 0xFF and rd[0x5E4] < 4"

[[claim]]
id = "khelp2.bump_pose.readers"
about = ["bump_pose_off", "bump_pose_script"]
text = "bump_pose_script is the only reader of bump_pose_off, and it is reached from call_vector only."
kind = "xref"
expect = "datareaders('bump_pose_off') == {'bump_pose_script'} and callers('bump_pose_script') == {'call_vector'}"

[[claim]]
id = "khelp2.bump_pose.static"
about = ["bump_pose_off"]
text = "bump_pose_off is 0, 2, $FF, 4."
kind = "static"
expect = "[u8(O('bump_pose_off') + i) for i in range(4)] == [0, 2, 0xFF, 4]"

# ------------------------------------------------------------------ claims: hooks and the palette

[[claim]]
id = "khelp2.pal_row"
about = ["kirby_pal_row"]
text = "Every call of kirby_pal_row (all with bit 6 of kirby_flags clear) writes $18 = X and $19 = A, and at return entries 17-19 of palette_base hold bytes 1-3 of the row at that address in bank 21."
kind = "call"
