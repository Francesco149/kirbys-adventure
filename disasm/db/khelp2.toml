# ------------------------------------------------------------------ RAM

[[ram]]
at = "05F5"
name = "swim_dir"
desc = "The direction number (0 none, 1 Up, 2 Right, 3 Down, 4 Left) that swim_dir_changed saw last; water_enter_init stores 0. The scripts read it (load_reg) for the swimming pose."

[[ram]]
at = "05F6"
name = "swim_timer"
desc = "Frames until the next swimming stroke: swim_gravity counts it down and, at 0 with A or Up held, makes a stroke and stores 15. swim_stroke_test stores 0, water_enter_init $0C; 18:B640 uses it the same way."

[[ram]]
at = "05FD"
name = "ability_drops"
desc = "Counts how often kirby_hp_sub took the ability away, up to 2; ability_star_create passes it to the star as variable 3. 18:B469 (an ability is taken) writes it."

[[ram]]
at = "05F0"
name = "hook_step"
desc = "The third byte kirby_hook_set stores: hook_flash_seq's step number 0-25. A script's set_mem8 also writes it."

[[ram]]
at = "05F1"
name = "hook_timer"
desc = "The fourth byte kirby_hook_set stores: hook_flash_seq's countdown of frames to the next step."

# ------------------------------------------------------------------ the model

[[model]]
name = "khelp2_model"
code = '''
def w16(d, lo):
    return d[lo] | d[lo + 1] << 8

def sx8(v):
    return v - 256 if v & 0x80 else v

def beyond(writes, own=()):
    # what a call wrote outside the stack page, the zero-page scratch $00 / $01 and the addresses in own
    return {w for w in writes if not 0x100 <= w < 0x200 and w not in (0, 1) and w not in own}

def rec4(rd, romrd):
    # the first four ROM bytes a call read: the record behind the script instruction, or None
    ks = list(romrd)[:4]
    if len(ks) < 4 or ks != list(range(ks[0], ks[0] + 4)) or (ks[0] ^ (w16(rd, 0x1E) + 1)) & 0x1FFF:
        return None
    return [romrd[k] for k in ks]

def placed(rd, b):
    # spawn_rec: record -> X, Y (16 bits), number, variable 1
    s = rd[0x6E]
    f = rd[0x61DC + s]
    left = f & 0x80
    px = (rd[0x6074 + s] | rd[0x6086 + s] << 8) + sx8(-b[0] & 0xFF if left else b[0]) & 0xFFFF
    py = (rd[0x6098 + s] | rd[0x60AA + s] << 8) + sx8(b[1]) & 0xFFFF
    return px, py, b[2], (f - b[3] if left else f + b[3]) & 0xFF

def born(wr, s, typ, px, py, v):
    # obj_spawn left an object of type typ in slot s at px, py with the variables of v (index -> value)
    return (s < 18 and wr.get(0x6128 + s) == typ
        and [wr.get(k + s) for k in (0x6074, 0x6086, 0x6098, 0x60AA)] == [px & 0xFF, px >> 8, py & 0xFF, py >> 8]
        and all(wr.get(0x61CA + 18 * k + s) == val for k, val in v.items()))

def fx_plan(rd, rank):
    # fx_create's search of slots 3-5 -> (the slot it frees or None, whether it creates)
    cnt = 0
    for s in (3, 4, 5):
        if rd[0x6128 + s] < 0x80:
            if rd[0x61EE + s] == rank:
                return s, True
            cnt += 1
    if cnt < 3:
        return None, True
    for s in (3, 4, 5):
        if rd[0x61EE + s] < rank & 0x7F:
            return s, True
    return None, False

def fx_made(rd, wr, calls, ra, rx, ry, x, y, writes, rank, px, py, v1, num):
    f, go = fx_plan(rd, rank)
    if not go:
        return (ra, rx, ry) == (x, 6, 3) and not beyond(writes) and 'obj_spawn' not in calls
    return (3 <= ra < 6 and rx == ra and (f is None or f == ra) and calls.count('obj_free') == (0 if f is None else 1)
        and born(wr, ra, 2, px, py, {0: rd[0x6E], 1: v1, 2: rank & 0x7F, 3: num}))

def order(calls, names):
    return [c for c in calls if c in names] == names

def bank21(adr):
    # PRG offset of a CPU address in bank 21
    return O('spawn_rec') + adr - A('spawn_rec')

def row_shown(romrd, adr, pal):
    # entries 17-19 of palette_base hold bytes 1-3 of the row at adr (bank 21)
    return pal == [romrd.get(bank21(adr) + 1 + j) for j in range(3)]

def sbyte(rd, romrd, i):
    # the ROM byte at script_ptr + i that the call read
    for k, v in romrd.items():
        if not (k ^ (w16(rd, 0x1E) + i)) & 0x1FFF and not bank21(0x8045) <= k < bank21(0x8049):
            return v
    return None

def fki(kind):
    return kind - 2 if 2 <= kind <= 5 else 4

def swimdir(held):
    # indexes 11-15 (Up with Down) fall on the first bytes of the routine behind the table
    i = held & 0x0F | (8 if held & 0x80 else 0)
    return [0, 2, 4, 0, 3, 3, 3, 0, 1, 2, 4, 0xA2, 0x00, 0xAD, 0xBB, 0x05][i]

def speed_class(rd):
    sp = rd[0x5BB] | rd[0x5BC] << 8
    return 0 if sp == 0 else 2 if 0x14C < sp < 0x8000 else 1

def side_limit(rd):
    if rd[0x5BA] & 0x80:
        return rd[0x6075] == rd[0x5C8] and rd[0x6087] == rd[0x5C9]
    if not (rd[0x5B9] | rd[0x5BA]):
        return True
    return rd[0x6075] == rd[0x5CA] and rd[0x6087] == rd[0x5CB]

def seq_step(rd, wr, romrd, pal):
    # hook_flash_seq
    t = rd[0x5F1] - 1 & 0xFF
    if t:
        return wr == {0x5F1: t}
    i = rd[0x5F0]
    x = romrd[O('flash_seq_step') + i]
    return (wr[0x5F1] == romrd[O('flash_seq_frames') + x] and wr[0x5F0] == i + 1
        and w16(wr, 0x18) == A('flash_seq_pal') + 4 * x and row_shown(romrd, A('flash_seq_pal') + 4 * x, pal)
        and (wr.get(0x5EF) == 0) == (i + 1 >= 26) and (0x5EF in wr) == (i + 1 >= 26))
'''

