expect = "(lambda r: w16(wr, 0x18) == r and row_shown(romrd, r, [wr.get(0x193), wr.get(0x194), wr.get(0x195)]))(A('full_flash_pal') + (0 if rd[0x603D] & 7 else 4)) if rd[0x5E0] == 1 else wr == {0x5EF: 0}"

[[claim]]
id = "khelp2.hook.full_flash2"
about = ["hook_full_flash2", "full_flash2_pal"]
text = "Every call of hook_full_flash2 (all 21 of the corpus, with kirby_form 1) leaves $18/$19 at full_flash2_pal + 4 when obj_frame & 7 is below 2 and at full_flash2_pal otherwise, and entries 17-19 of palette_base hold that row."
