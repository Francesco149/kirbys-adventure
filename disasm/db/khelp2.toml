# ------------------------------------------------------------------ claims: inhale and swim

[[claim]]
id = "khelp2.inhale.e6"
about = ["inhale_e6_test"]
text = "Every call of inhale_e6_test returns carry set exactly when $05E6 is not 0 and $05E5 is 0, and writes nothing."
kind = "call"
fn = "inhale_e6_test"
on = ["main@400+3000", "w3-sonnet@500+3000", "w12-sonnet@1200+3000", "w1-v2-sonnet@800+3000", "attract@1100+3500"]
min_calls = 150
max_calls = 3000
cases = { "rp & 1" = 8, "rd[0x5E6] != 0 and not rp & 1" = 5, "rd[0x5E6] == 0" = 120 }
expect = "(rp & 1) == (rd[0x5E6] != 0 and rd[0x5E5] == 0) and not writes"

[[claim]]
id = "khelp2.inhale.end"
about = ["inhale_end_test"]
text = "Every call of inhale_end_test: with variable 2 of slot 1 not 0 (1-$80) it is written one lower, nothing else is written and the carry is clear; with it 0 nothing is written and the carry is set exactly when bit 6 of pad1_held_copy (B) is clear and $05E6 and $05E5 are both 0."
kind = "call"
fn = "inhale_end_test"
on = ["main@400+3000", "w3-sonnet@500+6000", "w12-sonnet@1200+7000", "w1-v2-sonnet@800+3000", "attract@1100+3500", "w1-v2-opus@7400+40"]
min_calls = 300
max_calls = 3000
cases = { "rd[0x61EF] != 0" = 200, "rp & 1" = 4, "rd[0x61EF] == 0 and not rp & 1" = 20, "rd[0x61EF] == 0 and not rd[0xE6] & 0x40 and not rp & 1" = 2 }
expect = "(wr == {0x61EF: rd[0x61EF] - 1} and rd[0x61EF] <= 0x80 and not rp & 1) if rd[0x61EF] else (not writes and (rp & 1) == (not rd[0xE6] & 0x40 and rd[0x5E6] == 0 and rd[0x5E5] == 0))"

[[claim]]
id = "khelp2.swim.gravity"
about = ["swim_gravity", "swim_timer", "swim_profile"]
text = "Every call of swim_gravity leaves swim_timer one lower when it was not 0, and 15 when that is 0 (or it was 0) and A or Up is held; in that case kirby_vy starts from $FF00. kirby_vy then is what kirby_gravity's model (unit kvel) gives for the profile swim_profile[1 when Down is held, else 0], which is 4 or 2."
kind = "call"
fn = "swim_gravity"
on = ["main@64700+1000", "w3-sonnet@30200+600", "w12-sonnet@39600+400"]
min_calls = 400
max_calls = 3000
use = ["kirby_velocity", "khelp2_model"]
cases = { "wr.get(0x5F6) == 15" = 10, "rd[0xE6] & 4" = 20, "rd[0x5F6] == 0 and 0x5F6 not in wr" = 20, "rd[0x5F6] > 1" = 200 }
expect = "(lambda t, pr: (lambda stroke: mem(0x5F6) == (15 if stroke else t) and pr == (4 if rd[0xE6] & 4 else 2) and (mem(0x5BD) | mem(0x5BE) << 8) == gravity(0xFF00 if stroke else w16(rd, 0x5BD), pr, romrd))(t == 0 and rd[0xE6] & 0x88 != 0))(rd[0x5F6] - 1 if rd[0x5F6] else 0, romrd[O('swim_profile') + (1 if rd[0xE6] & 4 else 0)])"

[[claim]]
id = "khelp2.swim.stroke_test"
about = ["swim_stroke_test", "swim_timer"]
text = "Every call of swim_stroke_test returns carry set exactly when pad1_held_copy & $88 is not 0; then it writes swim_timer = 0 and nothing else, and otherwise nothing."
kind = "call"
fn = "swim_stroke_test"
on = ["main@64700+1000", "w3-sonnet@30200+600", "w12-sonnet@39600+400"]
min_calls = 60
max_calls = 3000
cases = { "rp & 1" = 8, "not rp & 1" = 40 }
expect = "(rp & 1) == (rd[0xE6] & 0x88 != 0) and wr == ({0x5F6: 0} if rp & 1 else {})"

[[claim]]
id = "khelp2.swim.dir"
about = ["pad_swim_dir", "swim_dir_tab", "swim_dir_a"]
text = "Every call of pad_swim_dir returns the model's number for pad1_held_copy (0 none, 1 Up or A, 2 Right, 3 Down, 4 Left; a side wins over Up, Down over a side), read from swim_dir_tab at the index (held & $0F) | swim_dir_a[1 when A is held], and writes nothing."
kind = "call"
fn = "pad_swim_dir"
on = ["main@64700+1000", "w3-sonnet@30200+600", "w12-sonnet@39600+400"]
min_calls = 400
max_calls = 3000
use = ["khelp2_model"]
cases = { "ra == 0" = 30, "ra == 1" = 20, "ra == 2" = 20, "ra == 3" = 5, "ra == 4" = 5, "rd[0xE6] & 0x80 and rd[0xE6] & 3" = 3 }
expect = "ra == swimdir(rd[0xE6]) == romrd[O('swim_dir_tab') + (rd[0xE6] & 0x0F | romrd[O('swim_dir_a') + (rd[0xE6] >> 7)])] and not writes"

[[claim]]
id = "khelp2.swim.dir_table"
about = ["swim_dir_tab", "swim_dir_a", "swim_profile"]
text = "swim_dir_tab is 0 2 4 0 3 3 3 0 1 2 4, swim_dir_a is 0, 8 and swim_profile is 2, 4."
kind = "static"
expect = "[u8(O('swim_dir_tab') + i) for i in range(11)] == [0, 2, 4, 0, 3, 3, 3, 0, 1, 2, 4] and [u8(O('swim_dir_a') + i) for i in (0, 1)] == [0, 8] and [u8(O('swim_profile') + i) for i in (0, 1)] == [2, 4]"

[[claim]]
id = "khelp2.swim.dir_changed"
about = ["swim_dir_changed", "swim_dir"]
text = "Every call of swim_dir_changed calls pad_swim_dir and returns carry set exactly when the model's direction for pad1_held_copy differs from swim_dir; then it writes swim_dir = that direction and nothing else, and otherwise nothing."
kind = "call"
fn = "swim_dir_changed"
on = ["main@64700+1000", "w3-sonnet@30200+600", "w12-sonnet@39600+400"]
min_calls = 400
max_calls = 3000
use = ["khelp2_model"]
cases = { "rp & 1" = 30, "not rp & 1" = 200 }
expect = "calls == ['pad_swim_dir'] and (rp & 1) == (swimdir(rd[0xE6]) != rd[0x5F5]) and wr == ({0x5F5: swimdir(rd[0xE6])} if rp & 1 else {}) and ra == swimdir(rd[0xE6])"

[[claim]]
id = "khelp2.swim.xref"
about = ["swim_dir", "swim_timer"]
text = "swim_dir is written by swim_dir_changed and water_enter_init only and read by swim_dir_changed and the scripts' load_reg only. In bank 21 swim_timer is written by swim_gravity, swim_stroke_test and water_enter_init and read by swim_gravity; one routine outside bank 21 (in bank 18) reads and writes it too."
kind = "xref"
expect = "writers('swim_dir') == {'swim_dir_changed', 'water_enter_init'} and readers('swim_dir') == {'swim_dir_changed', 'vm_op_load_reg'} and {w for w in writers('swim_timer') if w[:2] == '21'} == {'21:8883', '21:89F7', '21:9883'} and {w for w in readers('swim_timer') if w[:2] == '21'} == {'21:8883'} and {w[:2] for w in writers('swim_timer') | readers('swim_timer')} == {'21', '18'} and len(writers('swim_timer')) == 4"

[[claim]]
id = "khelp2.swim.timer.effect"
about = ["swim_timer", "swim_gravity"]
text = "With swim_timer held at 5 from main@64725, in 200 frames of the movie's swimming no stroke is made: kirby_vy_set, which swim_gravity calls for a stroke and which runs at least 5 times in the untouched run, does not run, although swim_gravity runs more than 20 times."
kind = "effect"
on = "main@64725"
frames = 200
poke = { "05F6" = 5 }
hold = true
expect = "n('swim_gravity') > 20 and n('kirby_vy_set') == 0 and cn('kirby_vy_set') >= 5"

