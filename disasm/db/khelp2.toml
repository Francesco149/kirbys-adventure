expect = "not rd[0x5FB] & 0x40 and (wr[0x18], wr[0x19]) == (x, a) and row_shown(romrd, x | a << 8, [wr.get(0x193), wr.get(0x194), wr.get(0x195)])"

[[claim]]
id = "khelp2.hook.full_flash"
about = ["hook_full_flash", "full_flash_pal"]
