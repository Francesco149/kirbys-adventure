text = "At main@703 kirby_resume_pick answers 3 and Kirby's script goes on to the fall (kirby_st_fall runs in the next frames). With the 3 patched to 0, in the 4 frames from main@702 kirby_st_stand runs and kirby_st_fall does not; the untouched run has it the other way round."
kind = "effect"
on = "main@702"
frames = 4
patch = { "21:9C36" = 0 }
expect = "n('kirby_st_stand') > 0 and n('kirby_st_fall') == 0 and cn('kirby_st_stand') == 0 and cn('kirby_st_fall') > 0"

# ------------------------------------------------------------------ claims: small values

[[claim]]
id = "khelp2.speed_class"
about = ["kirby_speed_class"]
text = "Every call of kirby_speed_class returns A = X = 0 when kirby_speed is 0, 2 when it is positive and above $014C, 1 otherwise, and writes nothing outside the stack and the scratch of kirby_speed_above ($10, $12)."
kind = "call"
fn = "kirby_speed_class"
on = ["w3-sonnet@1900+12000", "w1-v2-opus@1000+8000", "w12-opus@1900+6000", "main@18800+200", "w2-seq@26990+60"]
min_calls = 15
max_calls = 3000
use = ["khelp2_model"]
cases = { "ra == 0" = 2, "ra == 1" = 8, "ra == 2" = 8 }
expect = "ra == rx == speed_class(rd) and not beyond(writes, (0x10, 0x12))"

[[claim]]
id = "khelp2.slope_index"
