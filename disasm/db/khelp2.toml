unit = "khelp2"
title = "Kirby's helpers in bank 21, second half: the creators of effects and shots, the resume answer, hooks and small tests"
summary = """The second half of Kirby's helpers in bank 21 (the first is unit khelp): what the scripts of banks 14-19 call to
create things, to ask what state fits, to animate Kirby's colours and to test and set small pieces of his state.

The creators. A script instruction `asm_w` with one of three entries is followed by a four-byte record: dx, dy, number,
facing offset. spawn_rec turns it into obj_spawn's parameters for the object that runs the script: the position is the
creator's world position + (dx, dy), dx negated when the creator's variable 1 (the facing) is negative; the new object's
variable 3 is the number and its variable 1 the creator's facing plus (minus, facing left) the offset.
fx_create_rec falls into fx_create, which makes an effect: an object of type 2 (unit kfx) in slots 3-5 with the
creator's slot in variable 0 and a rank from fx_rank in variable 2. The rank decides who goes when there is no room: an
effect of the same rank is always replaced (unless the rank has bit 7), and with all three slots in use one of lower
rank; if there is none the new effect is not made. fx_create is also what the 6502 code calls (kirby_bubble, the block
breaks, the splash, and obj_create_far 3F:E376 from other banks) with the number in spawn_vars + 3.
shot_create_rec makes a shot: type 3 in slots 6-8, the creator's slot in variable 2. fx_create_any makes a type 2 object
in any slot without a rank (the stars of a lost life).

kirby_hp_sub (unit khelp, reached from other banks through hp_change_far 3F:E3BA) is completed here by what it calls:
fx_free_ranked frees the effects of rank $14 and less, type7_scan looks for objects of type 7, and
ability_star_create makes the object of type 5 that carries the lost ability away behind Kirby; ability_drops counts
the losses up to 2 and goes into the star.

kirby_resume_pick is the question every family of states asks in its "resume" script: 0 stand, 1 walk, 2 run (speed
above $014C), 3 fall, 4 / 5 / 6 the water states (on a floor at rest, on a floor moving, no floor), 7 float. It also
sets kirby_in_water from the block at Kirby's position. The other small values are indexes for the scripts' tables:
kirby_speed_class, slope_index_0 / slope_index_5 (the slope profile, + 5), pad_up_dry, vy_index, full_or_float_index,
frame_and_3, obj_facing_bit.

Swimming: swim_gravity gives a stroke (kirby_vy = -1 pixel a frame) when swim_timer is 0 and A or Up is held, then
waits 15 frames; pad_swim_dir turns the pad into a direction 0-4 and swim_dir_changed keeps the last one in swim_dir.
The inhale: inhale_e6_test and inhale_end_test read the counters that unit hit writes ($05E5, $05E6); inhale_clear
zeroes them.

Hooks (kirby_hook of unit khelp) animate Kirby's colours through kirby_pal_row: hook_full_flash and hook_full_flash2
(while kirby_form is 1), hook_flash_alt (two rows, eight frames each, never ends), hook_flash_seq (26 timed steps with
hook_step and hook_timer); hook_blink_jump makes him blink while kirby_action is 4.

Open:
- Never ran: the exit of kirby_pal_row for bit 6 of kirby_flags; the exit of hook_full_flash2 for a form other than 1;
  type7_scan's branch for an object of type 7 (it would get the script 19:B2C8); the answers "at the limit" of
  side_limit_test and the stop of side_limit_stop (Kirby was moving and away from the limit on all calls);
  pad_up_dry with Up held in water; slope_index_0 / slope_index_5 with floor_flag 1 (still no meaning for bit 0 of
  prop_class).
- Not taken, one line each, from the listing: 21:9DCD (ran once: 4 with Up held, 5 with Down, else 0 or 2 by
  floor_kind 0 or not, + 1 facing left); 21:9DF2 (ran once: 0 when B is held, else 1); 21:88DE (8 runs: a
  number from the pad, 4 Up, 5 Down, 0 / 1 Right / Left + 2 when floor_kind is not 0, with kirby_facing set; carry
  set and variable 0 of slot 1 written when the number changed, which never ran).
- What kirby_form 1 is (the hooks hook_full_flash and hook_full_flash2 and full_or_float_index test it) is not
  established here; nor what the ranks of fx_rank mean beyond their order, nor which effect numbers the bit 7 ranks
  serve (kfx has the numbers). In fx_create the refusal returns A = the X it was given, which no caller is shown to use.
- inhale_e6_test and inhale_end_test are described by what they read; the meaning of $05E5 / $05E6 is unit hit's.
- 3E:DFE5 / 3E:DFFB (bit 7 of obj_tick_bank of the other objects) are described from others_freeze / others_unfreeze
  only; that bit 7 stops an object's tick is not shown here.
- pad_swim_dir with Up and Down held together (one movie does it) reads the code bytes behind swim_dir_tab; the model
  has those bytes.
"""

# ------------------------------------------------------------------ the creators

[[sym]]
at = "21:9A01"
name = "spawn_rec"
desc = """Reads the four-byte record behind the script instruction that is running (script_ptr + 1 to + 4: dx, dy, number, facing offset) for the current object and prepares obj_spawn's parameters from it. With f = the object's variable 1 ($61DC + slot; bit 7 = it faces left): the new X = the object's world X + dx (signed), or - dx when f is negative; the new Y = its world Y + dy (signed); spawn_x_hi / spawn_y_hi get the high bytes and X / Y return the low bytes. spawn_vars + 3 = the number; spawn_vars + 1 = f + the facing offset (f - the offset when f is negative); spawn_vars = 0. script_ptr advances by 4. $00 and $01 are scratch (the sign extensions)."""
in = "cur_object; script_ptr = the calling script instruction's last byte"
out = "X, Y = low bytes of the new object's position; spawn_x_hi, spawn_y_hi, spawn_vars + 0, + 1, + 3"

[[sym]]
at = "21:9952"
name = "fx_create_rec"
desc = "Called from a script (asm_w $9952) with a four-byte record behind the instruction: spawn_rec, then it falls into fx_create. The effect with the record's number appears at the creator's position plus the record's offset, mirrored when the creator faces left."

[[sym]]
at = "21:9955"
name = "fx_create"
desc = """Creates an effect: an object of type 2 in slots 3-5, at spawn_x_hi : X, spawn_y_hi : Y, whose variable 3 is the number in spawn_vars + 3 (what kfx_start of unit kfx dispatches on), whose variable 0 is the current object's slot and whose variable 2 is the low seven bits of fx_rank[number]; variable 1 is whatever spawn_vars + 1 holds. Before that it makes room by rank: going through slots 3, 4, 5, the first object in use whose variable 2 equals fx_rank[number] (all eight bits, so never for a rank with bit 7 set) is freed and replaced. When there is none and all three slots are in use, the first whose variable 2 is below the rank's low seven bits is freed; when there is none either, nothing is created and the routine returns with A = the X it was given, X = 6, Y = 3. Otherwise it ends in obj_spawn (A = X = the new slot). $00 is scratch."""
in = "X, Y = low bytes of the position; spawn_x_hi, spawn_y_hi; spawn_vars + 3 = the effect's number; spawn_vars + 1; cur_object"
out = "A = X = the new object's slot (obj_spawn), or nothing created"
comments = { "9965" = "slots 3-5: one of the same rank is replaced", "9977" = "a slot is free", "997B" = "all three in use: one of lower rank is replaced", "998F" = "none: nothing is created" }

[[sym]]
at = "21:99D8"
name = "fx_create_any"
desc = "Called from a script with a four-byte record like fx_create_rec, but without the ranks: spawn_rec, then obj_spawn of type 2 in any of the 18 slots. Variable 0 of the new object is 0 and variable 2 is what spawn_vars + 2 held."

[[sym]]
at = "21:99EA"
name = "shot_create_rec"
desc = "Called from a script with a four-byte record (dx, dy, number, facing offset): spawn_rec, then obj_spawn of type 3 in slots 6-8 with spawn_vars + 2 = the current object's slot. The new object is a shot of unit kfx: variable 3 = the record's number, variable 1 = the creator's variable 1 plus the facing offset, variable 2 = the creator's slot, variable 0 = 0. With slots 6-8 all in use nothing is created (A = $FF)."

[[data]]
at = "21:99B8"
len = 32
name = "fx_rank"
format = "rows:16"
desc = "By effect number $00-$1F: the rank fx_create stores (low seven bits) in variable 2 of the effect. An effect replaces one of the same rank, and with slots 3-5 all in use one of lower rank; bit 7 set = it does not replace one of its own rank. Ranks in use: 0, $0A, $32, $3C, $5A, and with bit 7 $00, $0A, $28."

# ------------------------------------------------------------------ HP, frees, the ability star

[[sym]]
at = "21:9E59"
name = "fx_free_ranked"
desc = "Frees (obj_free) every object in slots 3-5 whose variable 2 is $14 or less: the effects of the low ranks of fx_rank (0 and $0A). kirby_hp_sub calls it when Kirby is hurt; 14:A715 jumps to it."

[[sym]]
at = "21:9E72"
name = "type7_scan"
desc = "Goes through slots 9-17 and compares each object's type with 7. No object of type 7 was there in any call, and then nothing is written. (By the code an object of type 7 gets the script 19:B2C8; that never ran.)"

[[sym]]
at = "21:9E8D"
name = "ability_star_create"
desc = "Creates the object of type 5 that carries a lost ability, in slots 9-17, at Kirby's world position 4 pixels up: variable 0 = 4, variable 1 = kirby_facing with bit 7 flipped (it leaves behind him), variable 3 = ability_drops, variable 4 = kirby_ability, variable 5 = $0598. Ends in obj_spawn (A = $FF when no slot is free). Called by kirby_hp_sub and pad_select_drop before they clear kirby_ability."
out = "A = X = the new slot, or A = $FF"

# ------------------------------------------------------------------ the resume answer

[[sym]]
at = "21:9BF7"
name = "kirby_resume_pick"
desc = """Answers which state fits Kirby as he is, for the "resume" scripts of every family of his states, which jump through a table on the answer. It tests the block at Kirby's position for water (obj_point, prop_bit7_at) and stores the answer in kirby_in_water (1 / 0). In water: kirby_floor_any finds no floor: 6; a floor: kirby_vy_zero, then 4 when kirby_vx is 0 and 5 when not. Not in water: kirby_action = $0D (floating): 7; kirby_vy negative, or no floor under a foot: 3 (fall); otherwise kirby_vy_zero, then 0 (stand) when kirby_vx is 0, 2 (run) when kirby_speed is positive and above $014C, else 1 (walk)."""
out = "A = 0 stand, 1 walk, 2 run, 3 fall, 4 / 5 / 6 in water (on a floor at rest, on a floor moving, no floor), 7 float"
comments = { "9BFD" = "not water", "9C09" = "water, no floor", "9C0F" = "water, on a floor: 4, or 5 when he moves", "9C28" = "floating", "9C35" = "rising or no floor: fall", "9C43" = "1 walk, 2 above $014C" }

[[sym]]
at = "21:9BE0"
name = "kirby_speed_class"
desc = "A = 0 when kirby_speed is 0, 2 when it is positive and above $014C (kirby_speed_above), 1 otherwise."
out = "A = X = 0, 1 or 2"

[[sym]]
at = "21:9B96"
name = "slope_index_0"
desc = "A = slope_profile (0-4, by floor_kind and kirby_facing) + slope_index_0_add[floor_flag], and floor_index_prev = floor_kind_index. floor_flag was 0 on every call, so the answer was the slope profile itself; scripts use it to pick a walk cycle by the floor."
out = "A = 0-4 (5-9 with floor_flag 1, never seen)"

[[sym]]
at = "21:9BAA"
name = "slope_index_5"
desc = "The same as slope_index_0 with slope_index_5_add: A = slope_profile + 5 (+ 10 with floor_flag 1, never seen), and floor_index_prev = floor_kind_index."
out = "A = 5-9"

[[sym]]
at = "21:9D72"
name = "pad_up_dry"
desc = "A = 1 when Up is held and kirby_in_water is 0, else 0. (Up held in water never came up.)"
out = "A = X = 0 or 1"

[[sym]]
at = "21:9D82"
name = "vy_index"
desc = "A = 1 when kirby_vy is negative (he rises), else 0."
out = "A = X = 0 or 1"

[[sym]]
at = "21:9DA3"
name = "full_or_float_index"
desc = "A = 1 when kirby_form is 1 or kirby_action is $0D, else 0."
out = "A = X = 0 or 1"

[[sym]]
at = "21:8FF5"
name = "frame_and_3"
desc = "A = the low two bits of obj_frame: a number 0-3 that changes every frame."
out = "A = 0-3"

[[sym]]
at = "21:98D5"
name = "obj_facing_bit"
desc = "A = bit 7 of variable 1 of the current object ($80 = it faces left, 0 = right)."
out = "A = 0 or $80; X = cur_object"

# ------------------------------------------------------------------ inhale and swim tests

[[sym]]
at = "21:8921"
name = "inhale_e6_test"
desc = "Carry set when $05E6 is not 0 and $05E5 is 0 (two of the inhale's counters that unit hit writes), else clear."
out = "carry"

[[sym]]
at = "21:892F"
name = "inhale_end_test"
desc = "Variable 2 of slot 1 ($61EF) as a countdown: while it is not 0 it is decremented and the answer is carry clear. At 0: carry set when B is not held and $05E6 and $05E5 are both 0, else clear."
out = "carry set: the countdown is over, B is up and both counters are 0"

[[sym]]
at = "21:8883"
name = "swim_gravity"
desc = "The swimming states' gravity with the stroke: swim_timer, when not 0, is decremented. When it is 0 (before or after that) and A or Up is held, kirby_vy = $FF00 (one pixel a frame upward) and swim_timer = 15. Then kirby_gravity with profile swim_profile[0] (2), or swim_profile[1] (4) while Down is held."

[[sym]]
at = "21:89F7"
name = "swim_stroke_test"
desc = "Carry set when A or Up is held; swim_timer is then set to 0, so that the next swim_gravity makes a stroke at once. Carry clear and nothing written otherwise."
out = "carry"

[[sym]]
at = "21:9BBE"
name = "pad_swim_dir"
desc = "A direction number from the held buttons, A counting as Up: 0 none, 1 Up, 2 Right, 3 Down, 4 Left. Up with a side gives the side, Down with a side gives Down. The index into swim_dir_tab is the low four bits of pad1_held_copy with bit 3 also set by swim_dir_a[1] when A is held."
out = "A = 0-4"

[[sym]]
at = "21:8A06"
name = "swim_dir_changed"
desc = "pad_swim_dir; when the number differs from swim_dir it is stored there and the carry is set, else the carry is clear."
out = "carry set: the direction changed; A = the direction"

[[sym]]
at = "21:9883"
name = "water_enter_init"
desc = "swim_timer = $0C, swim_dir = 0, then it falls into kirby_in_water_set. Called from the script of entering water."

[[sym]]
at = "21:988D"
name = "kirby_in_water_set"
desc = "kirby_in_water = 1."

[[sym]]
at = "21:9893"
name = "kirby_in_water_clear"
desc = "kirby_in_water = 0."

[[sym]]
at = "21:801F"
name = "bump_pose_script"
desc = "Called from a script with two operand bytes: the pose for a bump. With bump_pose_off[bump_kind] not negative (kinds 0, 1, 3: ceiling and walls; offsets 0, 2, 4) the pose is that offset + the first operand; with $FF (kind 2, the floor) it is 2 * floor_kind_index + the second operand. The pose goes through obj_pose_faced (+ 1 when the object faces left) and script_ptr advances by 2."

# ------------------------------------------------------------------ hooks and the palette

[[sym]]
at = "21:9CDC"
name = "kirby_pal_row"
desc = "Writes Kirby's colours from a row of four bytes at A:X: $18/$19 = the address, then a jump to palette_load with A = $10, Y = 4 (palette entries 16-19; $FF leaves an entry alone). With bit 6 of kirby_flags set it returns at once (never ran)."
in = "X = low byte, A = high byte of the row's address"

[[sym]]
at = "21:9A94"
name = "hook_full_flash"
desc = "A hook (kirby_hook): while kirby_form is 1 it shows row 1 of full_flash_pal on every eighth frame (low three bits of obj_frame 0) and row 0 on the others, through kirby_pal_row. With any other form it clears the high byte of kirby_hook (the hook ends) and writes no colours."

[[sym]]
at = "21:9AC0"
name = "hook_full_flash2"
desc = "A hook like hook_full_flash with full_flash2_pal: row 1 on the frames whose low three bits of obj_frame are 0 or 1, row 0 on the others. kirby_form was 1 on all 21 calls; the exit for another form never ran."

[[sym]]
at = "21:9AEE"
name = "hook_flash_alt"
desc = "A hook that never ends by itself: row 0 of flash_alt_pal while bit 3 of obj_frame is clear, row 1 while it is set (eight frames each), through kirby_pal_row."

[[sym]]
at = "21:9B06"
name = "hook_flash_seq"
desc = """A hook that plays a fixed sequence of 26 colour steps. hook_timer is decremented; while it is not 0 nothing else happens. At 0: x = flash_seq_step[hook_step], hook_timer = flash_seq_frames[x], row x of flash_seq_pal goes to kirby_pal_row, and hook_step is incremented; when it reaches 26 the high byte of kirby_hook is cleared. kirby_hook_set gives both counters their start from the script."""

[[sym]]
at = "21:9B6C"
name = "hook_blink_jump"
desc = "A hook: while kirby_action is 4, kirby_blink = bit 1 of obj_frame (Kirby is drawn in palette 1 two frames of four); with any other action it clears the high byte of kirby_hook."

# ------------------------------------------------------------------ setters and clears

[[sym]]
at = "21:9D8C"
name = "inhale_clear"
desc = "Stores 0 in $05D1-$05D3, $05E5, $05E6, $05E7 and $05E9 (the inhale's counters of unit hit)."

[[sym]]
at = "21:88CA"
name = "kirby_flag3_test"
desc = "Carry set when bit 3 of kirby_flags is set, else clear. The dives call it (unit kst15 reads it as: a block broke)."
out = "carry"

[[sym]]
at = "21:9EE1"
name = "kirby_flag3_clear"
desc = "Clears bit 3 of kirby_flags."

[[sym]]
at = "21:9EEA"
name = "others_freeze"
desc = "Calls 3E:DFE5, which sets bit 7 of obj_tick_bank of every active object but the current one, then sets bit 7 of kirby_flags."

[[sym]]
at = "21:9EF6"
name = "others_unfreeze"
desc = "Calls 3E:DFFB, which clears bit 7 of obj_tick_bank of every active object but the current one, then clears bit 7 of kirby_flags."

[[sym]]
at = "21:9ED3"
name = "fade_bg_darker"
desc = "Decrements fade_level and jumps to palette_show_bg: the background is shown one level darker."

[[sym]]
at = "21:9ED9"
name = "fade_bg_zero"
desc = "fade_level = 0 and a jump to palette_show_bg: the background at its own colours."

[[sym]]
at = "21:9DB6"
name = "recoil_set"
desc = "A fixed recoil: kirby_vy = $FD00 (3 pixels a frame upward), kirby_speed = $FF00, then a jump to kirby_vx_from_speed, so that kirby_vx is one pixel a frame against the way he faces."

[[sym]]
at = "21:8AFC"
kind = "part"
name = "pad_b_released"
desc = "Carry set when B is not held (bit 6 of pad1_held_copy clear), else clear. Reached by a jump from 16:A1A8 only (attract mode)."
out = "carry"

[[sym]]
at = "21:8C39"
name = "side_limit_test"
desc = "Carry set when Kirby stands at the limit he moves towards: kirby_vx 0, or positive with his world X equal to kirby_max_x, or negative with it equal to kirby_min_x. Carry clear otherwise. Every call that ran answered carry clear: kirby_vx was not 0 and he was not at that limit."
out = "carry"

[[sym]]
at = "21:8C2F"
name = "side_limit_stop"
desc = "side_limit_test; with carry set (never ran) kirby_vx_zero and carry set."
out = "carry"

