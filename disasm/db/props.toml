text = "Every call of block_redraw calls block_draw exactly when, with X = $4B:($02 & $F0) and Y = $4C:($01 & $F0), X - drawn_x is 0-255 and Y - drawn_y is 0-183 or -16 to -1, and calls nothing else itself."
