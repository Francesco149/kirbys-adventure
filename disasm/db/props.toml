[[claim]]
id = "props.pair.model"
about = ["prop_pair_at", "prop_extra", "prop_shape"]
text = "Every call of prop_pair_at for a point inside the room: with s and e the bytes it read from prop_shape and prop_extra (one each, or no prop_extra byte when s & $1F is not 0), it returns carry set, A = e & 3 and X = e >> 2 when s & $1F = 0 and e < $80, and carry clear with A = X = $FF otherwise; the bank at $8000 is at the end what it was at entry."
kind = "call"
fn = "prop_pair_at"
on = ["main@600+30", "w3-sonnet@3325+30", "main@67652+60", "attract@1300+30"]
where = "0x10 in wr"
min_calls = 100
max_calls = 200
expect = "pair(romrd) == (rp & 1, ra, rx) and mem(0x48) == rd[0x48]"
model = '''
def pair(romrd):
    s = [v for o, v in romrd.items() if O('prop_shape') <= o < O('prop_shape') + 127]
    e = [v for o, v in romrd.items() if O('prop_extra') <= o < O('prop_extra') + 127]
    if len(s) != 1 or len(e) > 1:
        return None
    if s[0] & 0x1F:
        return (0, 0xFF, 0xFF) if not e else None
    if e[0] & 0x80:
        return (0, 0xFF, 0xFF)
    return (1, e[0] & 3, e[0] >> 2)
'''

