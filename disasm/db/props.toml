[[claim]]
id = "props.break.model"
about = ["block_break_at", "break_step", "prop_extra"]
text = "Every call of block_break_at for a point inside the room: when the prop_extra byte it read has bit 4 set, the block at the point's index in the cell's screen ($10 as block_prop_at left it) is lowered by break_step in room_map and is the only byte of room_map written, $10 = the new number, block_redraw is called and carry is set; otherwise nothing is written to room_map, block_redraw is not called and carry is clear. The bank at $8000 is at the end what it was at entry."
kind = "call"
fn = "block_break_at"
on = ["main@3020+40", "main@17800+200", "main@81200+60", "main@98600+200", "w12-opus@15410+600"]
where = "0x4B in rd and rd[0x4B] < rd[0x67EE]"
min_calls = 100
max_calls = 120
expect = "brk(rd, wr, romrd, calls, x, y, rp) and mem(0x48) == rd[0x48]"
model = '''
def brk(rd, wr, romrd, calls, x, y, rp):
    e = [v for o, v in romrd.items() if O('prop_extra') <= o < O('prop_extra') + 127]
    maps = {k: v for k, v in wr.items() if 0x68C8 <= k < 0x7A00}
    if len(e) != 1:
        return False
    if not e[0] & 0x10:
        return not maps and 'block_redraw' not in calls and not rp & 1
    row, rest = divmod(rd[0x4C] << 8 | y, 192)
    cell = rd[0x4B] + rd[0x676D + row] & 0xFF
    if rd[0x51E] >= 2:
        cell = cell + rd[0x67EE] & 0xFF
    idx = rest & 0xF0 | x >> 4
    k = 0x68C8 + 192 * rd[0x67F6 + cell] + idx
    new = rd[k] - rd[0x56D] & 0xFF
    return maps == {k: new} and wr[0x10] == new and 'block_redraw' in calls and rp & 1 == 1
'''

