unit = "props"
title = "Block properties: two tables by property, the tests on the block at a point, replacing a block"
summary = """What the game asks about the block at a point, on top of block_prop_at (unit inroom). A block's property
(block_prop, 0-$7E; block_prop_at answers 0 for anything higher) indexes two tables of 127 bytes in bank 12.
prop_shape: bits 0-4 a number, bits 5, 6 and 7 flags; entries $30-$5F are entries $00-$2F with bit 7 set.
prop_extra: $80 for most properties; without bit 7 and bit 4 the byte is two small numbers (bits 0-1 and bits 2-3);
with bit 4 the block can be replaced. prop_flags_at returns the prop_shape byte of the block at a point, and three
wrappers return one part of it: prop_shape_at the number, prop_bit5_at and prop_bit7_at a flag in the carry.
prop_pair_at returns the two numbers of prop_extra for a block whose shape number is 0. block_break_at lowers the
block's number in room_map by break_step when its property has bit 4 in prop_extra (break_step is the tile set's
tileset_byte, 8 for every tile set: the replacement of a block is the block 8 before it) and redraws it;
block_put_at stores a given block number at a point; both redraw through block_redraw, which calls block_draw (unit
tiles) only when the block is inside the part of the room that is drawn.

Open: what the shape numbers (0-$F in the corpus's table), the flags and the two numbers of prop_extra mean is not
claimed: that needs the callers (21:97ED for prop_pair_at; 16:B149, 21:9550 and 2C:BD51 for block_break_at;
the callers of the three wrappers), which are Kirby's and the objects' movement code. The test of bit 6 at
3F:EEE6 never ran. prop_pair_at returned a pair only in main from frame 67652 (361 calls, one stretch).
The tables are taken as 127 entries because block_prop_at never answers more than $7E; the bytes after prop_extra
(12:84D1) are another table. 13:A93D also reads break_step."""

[[sym]]
at = "3F:EF85"
name = "prop_flags_at"
desc = "Returns the prop_shape byte of the block at a point: block_prop_at, then prop_shape[its answer], then bank8_pop."
in = "the arguments of block_prop_at: $4B, X = X position; $4C, Y = Y position"
out = "A = X = prop_shape[property]; Y = the property"

[[sym]]
at = "3F:ED91"
name = "prop_bit5_at"
desc = "prop_flags_at, then carry = bit 5 of the byte."
out = "carry; A = the byte & $20"

[[sym]]
at = "3F:ED9C"
name = "prop_shape_at"
desc = "prop_flags_at, then A = the low five bits of the byte: the shape number of the block at the point."
out = "A = prop_shape[property] & $1F"

[[sym]]
at = "3F:EEDB"
name = "prop_bit7_at"
desc = "prop_flags_at, then carry = bit 7 of the byte."
out = "carry; A = the byte & $80"

[[sym]]
at = "3F:EEB3"
name = "prop_pair_at"
desc = "For the block at a point (block_prop_at): when the low five bits of its prop_shape byte are 0 and its prop_extra byte has bit 7 clear, returns carry set with A = prop_extra & 3 and X = prop_extra >> 2; otherwise carry clear and A = X = $FF. Restores the bank at $8000 (bank8_pop)."
in = "the arguments of block_prop_at"
out = "carry set: A = bits 0-1, X = bits 2 and up of prop_extra[property]; carry clear: A = X = $FF"

[[sym]]
at = "3F:EEF1"
name = "block_break_at"
desc = "Replaces the block at a point if it can be replaced. block_prop_at finds the block; when prop_extra of its property has bit 4 clear: carry clear. Otherwise the block's number in room_map is lowered by break_step, block_redraw draws the new block ($00 = its index in the screen, $10 = the new number), and carry is set. Restores the bank at $8000."
in = "the arguments of block_prop_at; X and Y are kept in $02 and $01 for block_redraw"
out = "carry set = a block was replaced"

[[sym]]
at = "3F:EF18"
name = "block_put_at"
desc = "Stores block number A at a point of the room: maps bank 12, finds the cell (room_cell) and the block's index in the cell's screen as block_prop_at does, writes A to room_map there and has block_redraw draw it. Restores the bank at $8000."
in = "A = block number; $4B, X = X position; $4C, Y = Y position"

[[sym]]
at = "3F:EF50"
name = "block_redraw"
desc = "Calls block_draw ($00 = position, $10 = block, as its callers left them) when the block at X = $4B:$02, Y = $4C:$01 is in the drawn part of the room: with both low bytes rounded down to 16, X - drawn_x must be 0-255, and Y - drawn_y must be 0-183 or -16 to -1. Bank 12 must be mapped at $8000."
in = "$4B, $02 = X position; $4C, $01 = Y position; $00, $10 for block_draw"
out = "$01 is overwritten"

[[data]]
at = "12:83D3"
len = 127
name = "prop_shape"
format = "rows:16"
desc = "By block property: bits 0-4 a shape number, bit 5, bit 6 and bit 7 flags. Read by prop_flags_at, prop_pair_at, block_prop_at (for a point below the room) and prop_extra_0d_at (unit tail2)."

[[data]]
at = "12:8452"
len = 127
name = "prop_extra"
format = "rows:16"
desc = "By block property: $80 = nothing; bit 4 = the block can be replaced (block_break_at); otherwise two numbers, bits 0-1 and bits 2-3, that prop_pair_at returns."

[[ram]]
at = "056D"
name = "break_step"
desc = "What block_break_at subtracts from a block's number to get its replacement. tileset_load copies it from tileset_byte when a room's tile set is loaded; every tile set has 8."

# ------------------------------------------------------------------ claims

[[claim]]
id = "props.flags.model"
about = ["prop_flags_at", "prop_shape"]
text = "Every call of prop_flags_at returns in A and X the prop_shape byte of the property that the model of block_prop_at computes for the point, the property itself in Y, and the bank at $8000 is at the end what it was at entry."
kind = "call"
fn = "prop_flags_at"
on = ["main@600+12", "w3-sonnet@3325+12", "attract@1300+12", "main@19030+12", "main@73050+8", "w12-opus@16345+8", "main@98696+8"]
min_calls = 150
max_calls = 150
expect = "(ra, rx, ry) == (romrd[O('prop_shape') + at(rd, romrd, x, y)],) * 2 + (at(rd, romrd, x, y),) and mem(0x48) == rd[0x48]"
model = '''
def at(rd, romrd, x, y):
    # the answer of block_prop_at (unit inroom)
    col = rd[0x4B]
    if col >= 0x80 or col >= rd[0x67EE]:
        return rd[0x78D1]
    py = rd[0x4C] << 8 | y
    if py >= 0x6000:
        return 0
    row, rest = divmod(py, 192)
    cell = col + rd[0x676D + row] & 0xFF
    if cell >= 0x80:
        return 0
    if cell >= rd[0x67ED]:
        cell = rd[0x676C + rd[0x67EF]] + col & 0xFF
        p = rd[0x7F00 + rd[0x68C8 + 192 * rd[0x67F6 + cell] + (0xB0 | x >> 4)]]
        return 0x30 if p < 0x7F and romrd[O('prop_shape') + p] & 0x80 else 0
    if rd[0x51E] >= 2:
        cell = cell + rd[0x67EE] & 0xFF
    p = rd[0x7F00 + rd[0x68C8 + 192 * rd[0x67F6 + cell] + (rest & 0xF0 | x >> 4)]]
    return 0 if p >= 0x7F else p
'''

