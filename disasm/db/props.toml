model = '''
def vis(rd):
    dx = (rd[0x4B] << 8 | rd[0x02] & 0xF0) - (rd[0x56F] | rd[0x570] << 8) & 0xFFFF
    if dx >> 8:
        return False
    dy = (rd[0x4C] << 8 | rd[0x01] & 0xF0) - (rd[0x571] | rd[0x572] << 8) & 0xFFFF
    return dy < 0xB8 or dy >= 0xFFF0
'''

