name = "hit_saved"
desc = "What hit_interrupt saves of Kirby: +0/+1 the address and +2 the bank of his thread, +3/+4 his tick routine and +5 its bank, +6 the thread's wait, +7 its register, +8 the kind of kirby_rect."

