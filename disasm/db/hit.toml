unit = "hit"
title = "An object against Kirby's rectangle, the objects in slots 6-8 and Kirby himself"
summary = """
Bank 39 is one service: an object that can be hit calls 3F:E31D with the address of its 24-byte record (A low,
X high; 176 records in `hit_recs`, a few more inside bank 27's code). 3F:E31D keeps the address in `hit_rec`, maps
bank 39 at $8000 and calls `hit_test`, which makes three tests for the current object, in this order, and stops at
the first that answers carry set:

1. `hit_rect_test`: the object's box (centre = its world position, half sizes = record bytes 0 and 1) against
   kirby_rect, the rectangle Kirby's states put around what he does. The first byte of kirby_rect is its kind and
   picks the handler: 0 `hit_rect_inhale` (seen while he inhales), 1 `hit_rect_k1` (seen with $05E1 = 7), 2
   `hit_rect_k2`, 3 `hit_rect_k3`, 4, 5 and 7 `hit_rect_strike`, 6 `hit_rect_k6`.
2. The objects in slots 6, 7 and 8 that exist (by the leads, what Kirby shoots; not shown here): each
   picks one of five routines by its variable 3 (`hit_shot_lo` / `hit_shot_hi`): no test, a box widened by 7
   pixels, by 2, by 7 without ending the shot, or no box at all (everything on screen is hit). The damage is the
   shot's variable 0.
3. `hit_kirby`: the object's box against Kirby's body (4 pixels around his X, `hit_body` in Y). The object loses
   2 hit points unless its flags forbid it, and when record byte 4 is not zero and $05F9 (kirby_blink_timer
   of unit khelp) is zero Kirby is hurt: $05F9 = 1, 3F:E3BA with that byte, his variable 0 = the low three flag
   bits, his script becomes 14:A1C8. An object of type 5 is picked up instead (`hit_item`).

All boxes are tested the same way, per axis: |centre - centre| < 256 and < half size + the other side's reach
(model `hit_model`, hit_axis). The object's hit points are its variable 0 (`hit_damage` subtracts and stops at 0).
What the object then does is a three-byte reaction in its record (`hit_react`): nothing, a value for one of its
variables, or a new script; `hit_react_kill` (hit points gone) also adds the score of record byte 5 (`hit_score_add`;
the amounts are in units of the 24-bit score at $0593, which other sources give as tens of points). Record
layout: 0 half width, 1 half height, 2 flags (bits 0-2 damage to Kirby,
$08 / $40 / $80 not damaged by touching Kirby, $10 does not end a shot, $20 not hit by shots, $40 / $80 also
shielded from kind 1 and from shots whose variable 3 is 5), 3 number stored in $05E2 when inhaled ($FF none),
4 nonzero = hurts Kirby, 5 score index and variable 0 once inhaled, then six reactions: 6 inhaled, 9 hit points
gone, $0C damaged, $0F kind 1, $12 kind 2, $15 kind 3.

Open:
- Never ran in any movie: 39:81EE-81FE (entry 5 of the shot tables: code that compares the object's variable 2
  with the shot); the exit of hit_rect_inhale for bit 6 of $05E9; its branch for object type $0A; the refusal
  of hit_rect_k3 ($05E5 / $05E6 not zero); the surviving branch of hit_rect_k2 and of hit_shot_all; the shield
  exit of hit_rect_k6; in hit_kirby the exit for hit_kirby_off (reached only by the experiment
  hit.kirby.no_touch), the branch for bit 6 of kirby_flags, and in hit_item the variable 2 values 0 and 2.
  The models leave these out (`where`) or would fail on them.
- What the kinds of kirby_rect are in the game beyond the two situations named above, what hit_rect_power's
  values mean per ability, and what 3F:E3BA (21:9DFD) does with record byte 4 are in Kirby's code, not here.
- $05E2, $05E5-$05E9 (the inhale's counters and the number of what is in Kirby's mouth) are written here but
  belong to the inhale; they are described by address only.
- The records at 27:B72E, B7FC, B888, B992, B9FF, BA64, BB1A, BB32 (passed by bank 27's own code) are not listed;
  the model takes every address from $A000 up to be in bank 27, which held in every window. 13 of the 211
  `jsr $E31D` in the ROM do not load A and X with constants just before; their records were not traced.
- The end of the record table (39:97F3) is the end of the last record a caller names; the bytes after it were
  never read.
- hit.test.flow sees the shot routines only as calls of call_ay (the target of an indirect call is not in a
  call's list); which routine a value of variable 3 runs rests on the table (hit.shot.tables), on the frames
  claim hit.shot.which and on the experiment hit.shot.slot_effect.
- A reaction at $0C that is a script, and a hit of a shot whose reaction is "none", are in no window.
- 3F:E31D itself, 3F:E376 (creates the object numbered spawn_vars+3 through 21:9955), 3F:E3A7 (hit_score_add for
  callers outside bank 39), 3F:E33F (puts back what hit_interrupt saved) and 3F:EB2F are not in this unit.
"""

# ---------------------------------------------------------------- the model
[[model]]
name = "hit_model"
code = '''
def hit_rec(rd):
    q = rd[0x27] | rd[0x28] << 8
    return 0x39 * 0x2000 + q - 0x8000 if q < 0xA000 else 0x27 * 0x2000 + q - 0xA000

def hit_axis(a, b, k, half):
    d = (a - b) if a >= b else (b - a)
    return d < 0x100 and d < k + half

def hit_w(rd, lo, hi):
    return rd.get(lo, 0) | rd.get(hi, 0) << 8

def hit_quiet(writes):
    return all(0x100 <= w < 0x200 for w in writes)

def hit_side_of(a, b):
    return 0x40 | (((a - b) >> 8) & 0x80)

def hit_thr(wr, lo, hi, bank):
    return any(wr.get(0x6380 + t) == lo and wr.get(0x63A0 + t) == hi and wr.get(0x63C0 + t) == bank for t in range(32))

def hit_score(rd, romrd, idx, sh):
    if idx & 0x80:
        idx = romrd[O('score_pick') + (rd[0x603D] & 3)]
    v = romrd[O('score_tab_lo') + idx] | romrd[O('score_tab_mid') + idx] << 8 | romrd[O('score_tab_hi') + idx] << 16
    return ((rd[0x593] | rd[0x594] << 8 | rd[0x595] << 16) + ((v << sh) & 0xFFFFFF)) & 0xFFFFFF

def hit_score_now(mem):
    return mem(0x593) | mem(0x594) << 8 | mem(0x595) << 16

def hit_reaction(off, rd, wr, romrd, mem):
    b = hit_rec(rd)
    v, k = romrd[b + off], romrd[b + off + 1]
    if k & 0x80:
        ok = hit_thr(wr, v, k, romrd[b + off + 2]) and mem(0x61DC + rd[0x6E]) == mem(0x50D)
        return 1 if ok else None
    if k == 0:
        return 0
    return 1 if wr.get(0x61CA + 18 * romrd[b + off + 2] + rd[0x6E]) == v else None

def hit_kill(rd, wr, romrd, mem):
    b = hit_rec(rd)
    if romrd[b + 10] & 0x80:
        if hit_score_now(mem) != hit_score(rd, romrd, romrd[b + 5], 1):
            return None
    elif 0x593 in wr:
        return None
    return hit_reaction(9, rd, wr, romrd, mem)

def hit_strike(dmg, live_off, dead_off, rd, wr, romrd, mem):
    c = rd[0x6E]
    hp = rd[0x61CA + c]
    left = hp - dmg if hp > dmg else 0
    off = live_off if left else dead_off
    if off == 9:
        r = hit_kill(rd, wr, romrd, mem)
    else:
        r = hit_reaction(off, rd, wr, romrd, mem)
        if 0x593 in wr:
            return None
    b = hit_rec(rd)
    var0 = 0 < romrd[b + off + 1] < 0x80 and romrd[b + off + 2] == 0
    if not var0 and mem(0x61CA + c) != left:
        return None
    return r

def hit_shot(rd, wr, romrd, mem, writes, k, mode):
    s = rd[0x514]
    sx = hit_w(rd, 0x6074 + s, 0x6086 + s)
    if not (hit_axis(hit_w(rd, 0x510, 0x511), sx, k, rd.get(0x50E, 0))
            and hit_axis(hit_w(rd, 0x512, 0x513), hit_w(rd, 0x6098 + s, 0x60AA + s), k, rd.get(0x50F, 0))):
        return 0 if hit_quiet(writes) and 0x27 not in rd else None
    f = romrd[hit_rec(rd) + 2]
    dmg = 0 if f & 0x20 else rd[0x61CA + s]
    if not dmg:
        return 0 if hit_quiet(writes) else None
    if hit_thr(wr, 0x81, 0xB3, 0x16) != (mode == 1 or (mode == 0 and not f & 0x10)):
        return None
    if mode == 0 and rd[0x6200 + s] == 5 and f & 0xC0:
        return 0 if 0x61CA + rd.get(0x6E, 0) not in wr else None
    c = rd[0x6E]
    if mem(0x50D) != hit_side_of(hit_w(rd, 0x6074 + c, 0x6086 + c), sx):
        return None
    return hit_strike(dmg, 0x0C, 9, rd, wr, romrd, mem)

def hit_all(rd, wr, romrd, mem, writes):
    dmg = rd[0x61CA + rd[0x514]]
    if not dmg or rd[0x6128 + rd[0x6E]] == 0x6F:
        return 0 if hit_quiet(writes) else None
    return hit_strike(dmg, 0x0C, 9, rd, wr, romrd, mem)

def hit_rect_hit(rd, ox, oy, w, h, typ):
    kind = rd[0x501]
    if kind & 0x80:
        return False
    if not hit_axis(ox, hit_w(rd, 0x502, 0x503), rd.get(0x506, 0), w):
        return False
    if not hit_axis(oy, hit_w(rd, 0x504, 0x505), rd.get(0x507, 0), h):
        return False
    return typ not in (0x10, 0x39) and (typ != 5 or kind == 0)

def hit_mid(o, q):
    d = (q - o) & 0xFFFF
    return (o + ((d >> 1) & 0xFF) + (d & 0xFF00)) & 0xFFFF

def hit_star(rd, wr, qx, qy):
    c = rd[0x6E]
    mx = hit_mid(hit_w(rd, 0x6074 + c, 0x6086 + c), qx)
    my = hit_mid(hit_w(rd, 0x6098 + c, 0x60AA + c), qy)
    if (wr.get(0x6026), wr.get(0x602B), wr.get(0x602C)) != (0x1D, mx >> 8, my >> 8):
        return False
    made = [s for s in range(18) if 0x6074 + s in wr and 0x6128 + s in wr]
    return all((wr[0x6074 + s], wr.get(0x6086 + s), wr.get(0x6098 + s), wr.get(0x60AA + s), wr[0x6128 + s], wr.get(0x6200 + s))
               == (mx & 0xFF, mx >> 8, my & 0xFF, my >> 8, 2, 0x1D) for s in made)

def hit_intr(rd, wr):
    t = rd[0x614D]
    if rd[0x6320 + t] < 0x80 or rd[0x5FB] & 1:
        return {}
    return {0x5FB: rd[0x5FB] | 1, 0x78E8: rd[0x6380 + t], 0x78E9: rd[0x63A0 + t], 0x78EA: rd[0x63C0 + t],
            0x78EB: rd[0x627F], 0x78EC: rd[0x6291], 0x78ED: rd[0x62A3], 0x78EE: rd[0x6360 + t],
            0x78EF: rd[0x63E0 + t], 0x78F0: rd[0x501], 0x6380 + t: 0x0B, 0x63A0 + t: 0xAA, 0x63C0 + t: 0x16,
            0x6360 + t: 0}

def hit_blow(rd, wr, romrd, mem, calls, live_off, dead_off, intr, shield):
    c = rd[0x6E]
    if calls[:1] != ['hit_star_rect'] or not hit_star(rd, wr, hit_w(rd, 0x502, 0x503), hit_w(rd, 0x504, 0x505)):
        return None
    if ('hit_interrupt' in calls) != intr:
        return None
    if mem(0x50D) != hit_side_of(hit_w(rd, 0x6074 + c, 0x6086 + c), hit_w(rd, 0x6075, 0x6087)):
        return None
    if shield and romrd[hit_rec(rd) + 2] & 0xC0:
        if 0x61CA + c in wr and not (romrd[hit_rec(rd) + 0x10] == 1 and romrd[hit_rec(rd) + 0x11] == 0):
            return None
        return hit_reaction(0x0F, rd, wr, romrd, mem)
    return hit_strike(rd[0x508], live_off, dead_off, rd, wr, romrd, mem)

def hit_inhale(rd, wr, romrd, mem):
    e9 = rd[0x5E9]
    b = hit_rec(rd)
    if romrd[b + 7] & 0x80:
        c = rd[0x6E]
        exp = {0x5E5: (rd[0x5E5] + 1) & 0xFF, 0x60E0 + c: 0, 0x60F2 + c: 0, 0x6104 + c: 0, 0x6116 + c: 0}
        e9 |= 0x80
        if rd[0x6128 + c] == 5 and rd[0x61EE + c] == 4:
            e9 |= 1
            exp[0x5E7] = 1
            exp[0x5E2] = rd[0x6212 + c]
            exp[0x5E8] = rd[0x6224 + c]
        else:
            n = romrd[b + 3]
            if not e9 & 1 and n < 0x80:
                exp[0x5E7] = (rd[0x5E7] + 1) & 0xFF
                exp[0x5E2] = n
                exp[0x5E8] = romrd[0x3F * 0x2000 + 0x3CB + n]
        exp[0x5E9] = e9
        exp[0x61CA + c] = romrd[b + 5]
        if any(wr.get(q) != v for q, v in exp.items()) or any(q in wr and q not in exp for q in (0x5E2, 0x5E7, 0x5E8)):
            return None
    elif any(q in wr for q in (0x5E2, 0x5E5, 0x5E7, 0x5E8, 0x5E9)):
        return None
    return hit_reaction(6, rd, wr, romrd, mem)

def hit_kirby_touch(rd):
    return (hit_axis(hit_w(rd, 0x510, 0x511), hit_w(rd, 0x6075, 0x6087), 4, rd.get(0x50E, 0))
            and hit_axis(hit_w(rd, 0x512, 0x513), hit_w(rd, 0x509, 0x50A), rd.get(0x50B, 0), rd.get(0x50F, 0)))

def hit_kirby_flow(rd, wr, romrd, mem, calls):
    c = rd[0x6E]
    if (rd[0x6128 + c] == 7) != (calls[:1] == ['hit_interrupt']):
        return None
    if (rd[0x5E1] == 9 and (rd[0x5E6] or rd[0x5E5])) or rd[0x5E0] in (8, 9) or rd[0x501] == 5:
        return 0 if 0x5F9 not in rd and 0x27 not in rd and mem(0x515) == 0 else None
    b = hit_rec(rd)
    f = romrd[b + 2]
    kx = hit_w(rd, 0x6075, 0x6087)
    ox = hit_w(rd, 0x6074 + c, 0x6086 + c)
    got = 0
    if not f & 0xC8:
        if mem(0x50D) != hit_side_of(ox, kx) or hit_strike(2, 0x0C, 9, rd, wr, romrd, mem) is None:
            return None
        got = 1
    elif 0x61CA + c in wr:
        return None
    hurt = 0
    if rd[0x5F9] == 0:
        if 'hit_star_kirby' not in calls or rd[0x5FB] & 0x40:
            return None
        hurt = romrd[b + 4]
    elif 'hit_star_kirby' in calls:
        return None
    if hurt:
        if not (wr.get(0x5F9) == 1 and wr.get(0x61EF) == hit_side_of(kx, ox) and wr.get(0x61CB) == f & 7
                and hit_thr(wr, 0xC8, 0xA1, 0x14) and '3F:E3BA' in calls):
            return None
    elif 0x5F9 in wr or 0x61CB in wr:
        return None
    return got if mem(0x515) == 0 else None

def hit_item_ok(rd, wr, mem, calls, rp):
    c = rd[0x6E]
    v = rd[0x61EE + c]
    freed = mem(0x6128 + c) == 0xFF
    if calls[:1] != ['3F:EB2F']:
        return False
    if v == 1:
        return freed and mem(0x599) == min(rd[0x599] + 1, 0x63)
    if v == 3:
        return hit_thr(wr, 0x06, 0xB2, 0x16) and bool(rp & 1) and not freed
    if v == 4:
        side = hit_side_of(hit_w(rd, 0x6074 + c, 0x6086 + c), hit_w(rd, 0x6075, 0x6087))
        if wr.get(0x61DC + c) != side or rp & 1 or freed:
            return False
        if (side ^ rd[0x60F2 + c]) & 0x80:
            return wr[0x60E0 + c] | wr[0x60F2 + c] << 8 == -(rd[0x60E0 + c] | rd[0x60F2 + c] << 8) & 0xFFFF
        return 0x60E0 + c not in wr and 0x60F2 + c not in wr
    if v == 5:
        return (freed and (wr.get(0x5EA), wr.get(0x5EB), wr.get(0x5EC)) == (rd[0x5E3], rd[0x5E0], rd[0x598])
                and hit_thr(wr, 0x03, 0xA7, 0x14))
    return freed

def hit_test_flow(rd, wr, romrd, calls, rp):
    c = rd[0x6E]
    b = hit_rec(rd)
    w, h = romrd[b], romrd[b + 1]
    pos = [rd[0x6074 + c], rd[0x6086 + c], rd[0x6098 + c], rd[0x60AA + c]]
    if [wr[0x50E], wr[0x50F]] != [w, h] or [wr[0x510 + i] for i in range(4)] != pos:
        return False
    if calls[:1] != ['hit_rect_test']:
        return False
    shots = len([q for q in calls if q == 'call_ay'])
    last = wr.get(0x514)
    if last is None:
        return (bool(rp & 1) and not shots and 'hit_kirby' not in calls
                and hit_rect_hit(rd, pos[0] | pos[1] << 8, pos[2] | pos[3] << 8, w, h, rd.get(0x6128 + c, 0xFF)))
    live = [y for y in range(6, last + 1) if rd[0x6128 + y] < 0x80]
    if shots != len(live) or any(O('hit_shot_lo') + ((rd[0x6200 + y] + 1) & 0xFF) not in romrd for y in live):
        return False
    if 'hit_kirby' in calls:
        return last == 8
    return bool(rp & 1) and rd[0x6128 + last] < 0x80
'''

# ---------------------------------------------------------------- routines
[[sym]]
at = "39:8000"
name = "hit_test"
desc = """
The whole test for the current object, called through 3F:E31D with hit_rec = the object's record. Copies record
bytes 0 and 1 to hit_half and the object's world position to hit_pos, then: hit_rect_test; if that answers carry
clear, for slots 6, 7, 8 that are in use (obj_type bit 7 clear) the routine at entry (variable 3 of the slot) + 1
of hit_shot_lo / hit_shot_hi, with the slot in hit_slot; if none answers carry set, hit_kirby. The first carry
set ends the test and is returned.
"""
in = "hit_rec = the record; cur_object"
out = "carry set = a test changed the object (a variable or its script)"
comments = { "8027" = "against kirby_rect", "802C" = "slots 6-8", "8036" = "variable 3 of the slot picks the routine", "804D" = "against Kirby's body" }

[[sym]]
at = "39:806F"
name = "hit_shot_none"
desc = "Shot routine 0 (variable 3 of the slot = $FF): no test; carry clear."

[[sym]]
at = "39:8071"
name = "hit_shot_box7"
desc = """
Shot routines 1-4, 6, 11, 13, 14. The object's box, widened by 7 pixels on each side, against the world position
of slot hit_slot. On overlap, unless record flag $20 is set or the slot's variable 0 is 0: the slot gets the
script 16:B381 (hit_shot_end) unless flag $10 is set; if the slot's variable 3 is 5 and the object has flag $40 or
$80, that is all (carry clear); otherwise hit_side_shot, hit_damage with the slot's variable 0, and hit_react_live
(the object has hit points left) or hit_react_kill.
"""
out = "carry as the reaction leaves it; clear when nothing happened"

[[sym]]
at = "39:8103"
name = "hit_shot_box2"
desc = "Shot routine 7: as hit_shot_box7 with the box widened by 2 pixels; the slot always gets the script 16:B381 and there is no rule for variable 3."

[[sym]]
at = "39:817A"
name = "hit_shot_keep"
desc = "Shot routines 9, 10, 12: as hit_shot_box7 (7 pixels), but the slot's script is never changed and there is no rule for variable 3. The bytes 39:81EE-81FE after it are routine 5, which never ran."

[[sym]]
at = "39:81FF"
name = "hit_shot_all_body"
kind = "part"
desc = "The body of hit_shot_all (X = the slot): nothing when the slot's variable 0 is 0 or the object's type is $6F; otherwise hit_damage with that variable and hit_react_live or hit_react_kill. hit_side is not set."

[[sym]]
at = "39:821C"
name = "hit_shot_all"
desc = "Shot routine 8: no box test at all, every object that calls hit_test is hit by slot hit_slot. Loads the slot and branches back to hit_shot_all_body."

[[sym]]
at = "39:8221"
name = "hit_shot_end"
desc = "Gives object X the script 16:B381 (obj_set_script with new_script_bank = $16)."
in = "X = object (the slot of the shot)"

[[sym]]
at = "39:822D"
name = "hit_rect_test"
desc = """
The object against kirby_rect. Carry clear and nothing done when kirby_rect has bit 7 set in its first byte, when
the boxes do not overlap (hit_pos and hit_half against the rectangle's centre and half sizes), when the object's
type is $10 or $39, or when it is 5 and the rectangle's kind is not 0. Otherwise jumps to entry (kind) of
hit_rect_lo / hit_rect_hi.
"""
out = "carry from the handler, or clear"

[[sym]]
at = "39:82C0"
name = "hit_rect_inhale"
desc = """
Kind 0. Nothing when bit 6 of $05E9 is set. When bit 7 of record byte 7 is set (the reaction at 6 is a script):
$05E5 is incremented, the object's four velocity bytes are cleared, bit 7 of $05E9 is set, then for an object of
type 5 whose variable 2 is 4: bit 0 of $05E9 is set, $05E7 = 1, $05E2 = its variable 4, $05E8 = its variable 5;
for any other object, if bit 0 of $05E9 is clear and record byte 3 has bit 7 clear: $05E7 is incremented, $05E2 =
that byte, $05E8 = entry (that byte) of the table at 3F:E3CB; then the object's variable 0 = record byte 5. In
every case it ends with the reaction at 6 (hit_react_06).
"""

[[sym]]
at = "39:833C"
name = "hit_rect_k3"
desc = "Kind 3. Nothing (carry clear) when $05E6 or $05E5 is not zero. When bit 7 of record byte $16 is set: the object's variable 0 = record byte 5 and $05E5 is incremented. Then the reaction at $15."

[[sym]]
at = "39:835D"
name = "hit_rect_k1"
desc = "Kind 1. hit_star_rect, hit_interrupt, hit_side_kirby; when the object has flag $40 or $80 the reaction at $0F without damage; otherwise hit_damage with hit_rect_power, then the reaction at $0F when it has hit points left and hit_react_kill when not."

[[sym]]
at = "39:837C"
name = "hit_rect_k2"
desc = "Kind 2. hit_star_rect, hit_side_kirby, hit_damage with hit_rect_power, then the reaction at $12 when the hit points are gone (hit_react_live otherwise)."

[[sym]]
at = "39:8390"
name = "hit_rect_strike"
desc = "Kinds 4, 5, 7, and the end of kind 6. hit_star_rect, hit_interrupt, hit_side_kirby, hit_damage with hit_rect_power, then hit_react_live or hit_react_kill."

[[sym]]
at = "39:83A7"
name = "hit_rect_k6"
desc = "Kind 6. Carry clear when the object has flag $40 or $80; otherwise sets bit 3 of kirby_flags and goes on in hit_rect_strike."

[[sym]]
at = "39:83BB"
name = "hit_kirby"
desc = """
The object against Kirby's body: |X - Kirby's world X| < 4 + half width and |Y - hit_body Y| < hit_body's
half height + half height. Carry clear and nothing done when they do not overlap or hit_kirby_off is not zero.
hit_done = 0. An object of type 5 goes to hit_item. For type 7, hit_interrupt first. Then nothing more when
3F:E2C4 answers carry set ($05E1 = 9 with $05E6 or $05E5 not zero), when $05E0 is 8 or 9, or when kirby_rect's
kind is 5. Otherwise: unless the object has flag $08, $40 or $80, hit_side_kirby, hit_damage with 2,
hit_react_live or hit_react_kill, and hit_done = 1. Then, when $05F9 is 0: hit_star_kirby and, when record
byte 4 is not zero, $05F9 = 1, 3F:E3BA with that byte, Kirby's variable 2 = $40 or $C0 (bit 7 = he is left
of the object), his variable 0 = flag bits 0-2, and his script becomes 14:A1C8. hit_done is shifted into the
carry.
"""
out = "carry set = the object lost hit points by touching Kirby"
comments = { "83DB" = "4 pixels around Kirby's X", "8410" = "touching", "842D" = "carry: Kirby is busy inhaling", "8446" = "flags $08, $40, $80: the object takes no damage", "8451" = "2 hit points", "8464" = "Kirby is hurt only when $05F9 is 0", "8479" = "record byte 4: 0 = harmless", "84A4" = "Kirby's script 14:A1C8" }

[[sym]]
at = "39:84B6"
name = "hit_item"
kind = "part"
desc = """
hit_kirby for an object of type 5: calls 3F:EB2F with the object in A, then by the object's variable 2: 1 = sound
$21, one more in $0599 (at most 99), obj_free; 3 = the object's script becomes 16:B206, carry set; 4 = its
variable 1 = hit_side (hit_side_kirby) and its X velocity is negated when its sign differs from bit 7 of that,
carry clear; 5 = $05E3, $05E0, $0598 are copied to $05EA-$05EC, Kirby's script becomes 14:A703 (3F:E302),
obj_free; anything else seen = obj_free. Values 0 and 2 never ran.
"""

[[sym]]
at = "39:855D"
name = "hit_react_15"
kind = "part"
desc = "hit_react with the reaction at record byte $15."

[[sym]]
at = "39:8561"
name = "hit_react_live"
desc = "hit_react with the reaction at record byte $0C: the object was damaged and has hit points left."

[[sym]]
at = "39:8565"
name = "hit_react_kill"
desc = "The object's hit points are gone: when the reaction at record byte 9 is a script (bit 7 of byte $0A), hit_score_add with A = record byte 5 and X = 1 (twice the table's value); then hit_react with the reaction at 9."

[[sym]]
at = "39:8578"
name = "hit_react_0f"
kind = "part"
desc = "hit_react with the reaction at record byte $0F."

[[sym]]
at = "39:857C"
name = "hit_react_12"
kind = "part"
desc = "hit_react with the reaction at record byte $12."

[[sym]]
at = "39:8580"
name = "hit_react_06"
kind = "part"
desc = "hit_react with the reaction at record byte 6."

[[sym]]
at = "39:8582"
name = "hit_react"
kind = "part"
desc = """
Carries out the three-byte reaction at offset Y of the record. Second byte 0: nothing, carry clear. Second byte
with bit 7 set: the current object's script becomes the address (first byte low, second high) in the bank of
the third byte, its variable 1 = hit_side, carry set. Otherwise: the object's variable (third byte) = first byte,
carry set.
"""
in = "Y = offset of the reaction in the record"
out = "carry set = the object was changed"

[[sym]]
at = "39:85BA"
name = "hit_damage"
desc = "Subtracts A from the current object's variable 0 (its hit points), stopping at 0. Nothing is written when it is already 0."
in = "A = damage"
out = "carry set = hit points left; X = cur_object"

[[sym]]
at = "39:85D4"
name = "hit_side_kirby"
desc = "hit_side = $C0 when the current object's world X is less than Kirby's (bit 7 of the high byte of the difference), $40 otherwise."
out = "A = hit_side; X = cur_object"

[[sym]]
at = "39:85EB"
name = "hit_side_shot"
desc = "hit_side = $C0 when the current object's world X is less than that of slot hit_slot, $40 otherwise."
out = "A = hit_side; X = cur_object, Y = hit_slot"

[[sym]]
at = "39:8605"
name = "hit_score_add"
desc = """
Adds entry A of score_tab_lo / score_tab_mid / score_tab_hi, shifted left X times (24 bits), to score. With bit 7 of A set
the entry is picked by score_pick[obj_frame & 3]. Called here by hit_react_kill and from other banks through
3F:E3A7.
"""
in = "A = entry 0-25, or bit 7 set; X = number of doublings"

[[sym]]
at = "39:8699"
name = "hit_star_kirby"
desc = "hit_star_mid with Kirby's world position in $00-$03."

[[sym]]
at = "39:86B0"
name = "hit_star_rect"
desc = "hit_star_mid with the centre of kirby_rect in $00-$03."

[[sym]]
at = "39:86C7"
name = "hit_star_mid"
kind = "part"
desc = """
Creates an object through 3F:E376 with spawn_vars+3 = $1D (it comes out as type 2 with variable 3 = $1D) halfway between the current object and the point
in $00/$01 (X) and $02/$03 (Y): per axis the object's coordinate plus the low byte of half the difference, with
the difference's high byte added to the high byte.
"""
in = "$00-$03 = the other point"

[[sym]]
at = "39:870F"
name = "hit_interrupt"
desc = """
Interrupts Kirby's script. Nothing when his first thread is not his only one (thread_next has bit 7 clear) or
bit 0 of kirby_flags is already set. Otherwise sets that bit, saves the thread's address and bank, Kirby's tick
routine and its bank, the thread's wait and register and the kind of kirby_rect in hit_saved, and points the
thread at 16:AA0B with wait 0. 3F:E33F reads hit_saved back.
"""

# ---------------------------------------------------------------- data
[[data]]
at = "39:8051"
len = 15
name = "hit_shot_lo"
format = "bytes"
desc = "Low bytes of the routine for a shot (slots 6-8), by its variable 3 plus 1: 0 hit_shot_none; 1-4, 6, 11, 13, 14 hit_shot_box7; 5 39:81EE (never ran); 7 hit_shot_box2; 8 hit_shot_all; 9, 10, 12 hit_shot_keep."

[[data]]
