len = 8
name = "hit_rect_lo"
format = "bytes"
desc = "Low bytes of the handler for each kind of kirby_rect: 0 hit_rect_inhale, 1 hit_rect_k1, 2 hit_rect_k2, 3 hit_rect_k3, 4, 5, 7 hit_rect_strike, 6 hit_rect_k6."

[[data]]
at = "39:82B8"
len = 8
name = "hit_rect_hi"
format = "bytes"
desc = "High bytes of the same."

[[data]]
at = "39:8647"
len = 4
name = "score_pick"
format = "bytes"
desc = "The entries (2, 3, 4, 6) hit_score_add picks from by obj_frame & 3 when A has bit 7 set."

[[data]]
at = "39:864B"
len = 26
name = "score_tab_lo"
format = "bytes"
desc = "Low bytes of the 26 amounts of hit_score_add, in units of score: 0, 1, 5, 10, 15, 20, 30, 40, 50, 70, 80, 100, 120, 150, 200, 300, 500, 1000, 2000, 3000, 4000, 5000, 6000, 8000, 10000, 20000."

[[data]]
at = "39:8665"
len = 26
name = "score_tab_mid"
format = "bytes"
desc = "Middle bytes of the same."

[[data]]
at = "39:867F"
len = 26
name = "score_tab_hi"
format = "bytes"
desc = "High bytes of the same (all zero)."

[[data]]
at = "39:8774"
len = 4224
name = "hit_recs"
format = "rows:24"
desc = """
176 records of 24 bytes, one per kind of object that can be hit; an object passes the address of its record to
3F:E31D. +0 half width, +1 half height of the box around the object's world position. +2 flags: bits 0-2 the
value put in Kirby's variable 0 when he is hurt, $08 / $40 / $80 no damage from touching Kirby, $10 a shot is
not ended by hitting it, $20 shots do not hit it, $40 / $80 also not damaged by kind 1 of kirby_rect, by shots
with variable 3 = 5 and not touched by kind 6. +3 the number stored in $05E2 when it is inhaled (0-$18, $FF =
none). +4 nonzero (8) = touching it hurts Kirby. +5 the entry of hit_score_add when its hit points are gone, and
its variable 0 once inhaled. Then six reactions of three bytes (hit_react): +6 inhaled, +9 hit points gone,
+$0C damaged, +$0F kind 1, +$12 kind 2, +$15 kind 3. A reaction is 0, 0, 0 (none); value, 1, variable; or a
script address (low, high) and its bank.
"""

# ---------------------------------------------------------------- RAM
[[ram]]
at = "0027"
len = 2
name = "hit_rec"
desc = "The address of the current object's record while hit_test runs: 3F:E31D stores A (low) and X (high) here. Addresses below $A000 are in bank 39 (hit_recs); the others are in the bank at $A000."

[[ram]]
at = "0508"
name = "hit_rect_power"
desc = "The damage that goes with kirby_rect: 21:9C72 stores its X here when it sets the rectangle; hit_rect_k1, hit_rect_k2 and hit_rect_strike pass it to hit_damage."

[[ram]]
at = "0509"
len = 3
name = "hit_body"
desc = "Kirby's body for hit_kirby: +0/+1 the Y of its centre, +2 half its height. 21:805B writes it."

[[ram]]
