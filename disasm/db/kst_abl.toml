unit = "kst_abl"
title = "Kirby with the thirteen rarer copy abilities, and in water and on ladders with an ability held"
summary = """
What the cov2 movies made Kirby do that no movie had done: the attacks of Cutter (2), Laser (5), Mike (6), Needle
($0B), Freeze ($0D), Beam ($0F), Crash ($13) and Light ($14), all reached from kirby_s_ability's table (unit kst18);
the three abilities with a set of states of their own, Hammer (8: kirby_form 4, bank 17), Sleep ($0A: kirby_form 7,
bank 18) and Stone ($10: kirby_form 8, bank 19), reached from kirby_s_start's table on kirby_form and from the far
table of kirby_s_swallow_done; the throw of Throw ($16), the branch of kirby_s_grab_hold for that ability; the
ladder ($2D) and the water states ($33-$39) of the second set of bank 14 (any ability without a set of its own);
Parasol's water states ($CB-$CF) and Sword's landing from the dive ($6B) in bank 15. With them, the effects (type 2)
and shots (type 3, slots 6-8) these abilities create, and what the hit test and the helpers newly ran for them.

  ability / state              entry             what it does
  Cutter (2)                   kirby_s_cutter    sound $3F, pose $0E for 8 frames, shot $02 (kfx_shot_cutter): a
                                                 blade that flies out at 4, 3, 1.5, 0.5 pixels a frame (8 frames
                                                 each), turns and comes back; it is freed within 8 pixels of Kirby
  Laser (5)                    kirby_s_laser     sound $42, three poses, shot $03 (unit kfx's laser) from 2 pixels
                                                 behind his front, three more poses
  Mike (6)                     kirby_s_mike      the others frozen, Kirby hurt-proof ($80), one of three songs by
                                                 the uses left ($0598, decremented first), shot $04 (kfx_shot_mike),
                                                 15 rounds of shaking; the shot hits every object in turn
                                                 (hit_shot_mike); with no use left the ability is gone
  Needle ($0B)                 kirby_s_needle    sound $4D, needle_rect (kind 4) while B is held (at least 60
                                                 frames), script $44 to end
  Freeze ($0D)                 kirby_s_freeze    sound $44, freeze_rect (kind 2, 24 pixels round him) for 26
                                                 frames at least and while B is held, script $4A to end
  Beam ($0F)                   kirby_s_beam      kirby_s_beam_sweep (unit scr_obj) with variable 0 = 8 rounds
  Crash ($13)                  kirby_s_crash     the others frozen, a charge of 8 rounds, flashes of the palette,
                                                 effects $07-$0A, then shot $07 (damage $1D to everything),
                                                 crash_sweep, and the ability is used up (kirby_s_reset)
  Light ($14)                  kirby_s_light     effect $0B, a light that rises to the top of the screen and lights
                                                 a dark room's palette step by step; then the ability is used up
  Throw ($16)                  kirby_s_throw_hold   holds what was grabbed up to 120 frames or until B; Up throws
                                                 it upwards as shot $09 (kfx_shot_thrown, damage $12)
  Hammer (8), kirby_form 4     kirby_s_hammer_enter  stand $98, jump $9E / $9F, fall $A0, duck $A4, slide $A5,
                                                 swing $A7 (hammer_swing_rect, break_rect_2)
  Sleep ($0A), kirby_form 7    kirby_s_sleep     poses and snore bubbles (effect $02) with no test at all
  Stone ($10), kirby_form 8    kirby_s_stone     a stone that falls (gravity profile $0D, stone_rect, break_rect_2)
                                                 and lands ($D0, a quake), rests until B ($D1) and becomes Kirby
  second set, ladder ($2D)     kirby_s_ab_ladder   Down climbs down at $0133; leaves to $1E
  second set, water ($33-$39)  kirby_s_ab_water_enter ... the counterparts of the first set's water states,
                                                 with B = the spit of water ($37 / $38) and Select = drop
  Parasol, water ($CB-$CF)     kirby_s_para_water_enter ... the same with para_rect every frame, B = swing $C5
  Sword, dive landing ($6B)    kirby_s_sword_dive_land  a bounce at $FD40 with gravity profile $0B until a floor

Every state routine is a fixed chain of tests: the first that answers yes names the next script (ldx #n / jmp
kirby_script_upkeep), with none the routine ends in kirby_upkeep. The claims model that per routine (model kabl,
kpath: exactly one exit ran, no test before it answered yes as far as the pad shows it, and Kirby's thread is at
the address of that script in kirby_script_lo / hi; KA_SA has those addresses). Script numbers in the table
below are kirby_script_lo indexes.

Hammer's set is scripts $97-$B2 of bank 17 (the summary of unit kst17 counts them with the Star Rod's): $97
kirby_s_hammer_resume, $98 stand, $99 walk, $9C run, $9E jump, $9F the jump cut short, $A0 fall, $A3 drop, $A4
duck, $A5 slide, $A6 ladder, $A7 swing, $A8 the swing in the air, $A9 inflate, $AE water, $B2 out of the water.

Open:
- Never ran: Ball ($11, 19:B2F1, scripts $D2-$D9) and the Hammer scripts other than $97, $98, $9E, $9F, $A0,
  $A4, $A5, $A7 (walk, run, ladder, the air swing, inflate, water); the forward throw (16:A6EA) and the second
  path of throw_up_test; the ladder going up (14:BA77-BAB4) and $30 / $31 of the second set; Parasol's walk
  cycles 16:B684-B696; script $D1 from the falling stone; every water and door exit the cases do not list
  (each claim's text names the exits that ran).
- Sleep ran once, until the movie went on (the loop of three snores was cut after two); what ends it is not seen.
- What the records behind 21:9952 / 21:99EA mean beyond the number (byte 2) is not claimed; nor are the poses.
- 3E:DDF4 (Y = $40, then sprites_draw_mirror), 3E:D945, 18:A2EE and 18:A40C ran in the credits and the demo of the
  finished file (unit scenes3's side), not for Kirby; they are not in this unit.
- What bit 7 of obj_tick_bank means to an object that kfx_shot_mike clears it for (others_freeze sets it) is
  read from the listing; that the object stops is not claimed.
- type $2A, the only type crash_sweep looks for, was never present when it ran.
"""

