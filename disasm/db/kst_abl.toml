def kh(rd, m):
    """a button of the mask is held (pad1_held_copy: A $80, B $40, Select $20, Start $10, Up 8, Down 4, Left 2, Right 1)"""
    return bool(rd.get(0xE6, 0) & m)

def kn(rd, m):
    """a button of the mask is newly pressed (pad1_new_copy)"""
    return bool(rd.get(0xE7, 0) & m)

def kmaybe(possible):
    """a test the call's bytes do not decide: None (not modelled) when they allow a yes, False when they do not"""
    return None if possible else False

def kwent(rd, wr):
    """the script address Kirby's thread was given during the call, or None"""
    t = rd.get(0x614D)
    if t is None or (0x6380 + t) not in wr:
        return None
    return wr[0x6380 + t] | wr[0x63A0 + t] << 8

def kpath(ran, rd, wr, tests, stay):
    """tests: (address of an exit's first instruction, script number or (above $FF) script address, the answer of its
    test: True, False or None) in the routine's order; stay: the instruction reached when no test answered yes.
    'ok' when exactly one of them ran, once, no test before it answered yes, its own did not answer no, and Kirby's
    thread is at the exit's script afterwards (not moved on the stay path, unless 39:8761 gave it a script)."""
    seq = [t[0] for t in tests] + [stay]
    hit = [i for i, at in enumerate(seq) if ran(at)]
    if len(hit) != 1 or ran(seq[hit[0]]) != 1:
        return 'paths run: %r' % [seq[i] for i in hit]
    k = hit[0]
    for i, (at, num, ans) in enumerate(tests):
        if i < k and ans:
            return 'the test before %s answered yes' % at
        if i == k and ans is False:
            return 'exit %s with its test answering no' % at
    t = kwent(rd, wr)
    if k < len(tests):
        num = tests[k][1]
        want = KA_SA[num] if num < 0x100 else num
        return 'ok' if t == want else 'thread at %r after the exit %s' % (t, tests[k][0])
    return 'ok' if t is None or ran('39:8761') > 0 else 'thread at %04X without an exit' % t

def krect(rd, wr, rec, power):
    """kirby_rect_set with the seven bytes rec and X = power; Kirby's world position as it was after the call (a
    state routine moves him before it sets the rectangle)"""
    def at(a):
        return wr.get(a, rd.get(a))
    x = ((at(0x6075) | at(0x6087) << 8) + (rec[1] | rec[2] << 8)) & 0xFFFF
    y = ((at(0x6099) | at(0x60AB) << 8) + (rec[3] | rec[4] << 8)) & 0xFFFF
    return [wr.get(0x501 + i) for i in range(8)] == [rec[0], x & 255, x >> 8, y & 255, y >> 8, rec[5], rec[6], power]

def krect_tab(rd, wr, base, data, n, idx, power):
    """a rectangle by an index: low byte data[idx], high byte data[idx + n] of the record's address (0: no rectangle,
    kirby_rect not written); the record is read from data at address - base"""
    hi = data[idx + n]
    if hi == 0:
        return not any(0x501 + i in wr for i in range(8))
    a = (data[idx] | hi << 8) - base
    return krect(rd, wr, data[a:a + 7], power)

def ks16(v):
    return v - 0x10000 if v & 0x8000 else v
