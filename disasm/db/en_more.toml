[[claim]]
id = "en_more.e47.wind"
about = ["e47_wind_draw", "e47_wind_dist"]
text = "e47_wind_draw moves each of the three streaks as em_wind says: a streak at distance 0 starts from an entry of e47_wind_dist (distance, Y offset) with speed 0, a streak nearer than $0C ends (distance 0), and every other one gets speed + $FFC4, distance + speed and its Y offset pulled toward 0; sprites_draw runs once per streak that moved. Starts, ends and moves all happen."
kind = "call"
fn = "e47_wind_draw"
on = ["cov2-save-finished@148735+34", "cov2-save-finished@148769+34"]
min_calls = 60
use = ["en_more_model"]
model = '''
def got(mem, i):
    return (mem(0x79ED + i), mem(0x79EA + i), mem(0x79F6 + i) | mem(0x79F9 + i) << 8, mem(0x79F3 + i), mem(0x79F0 + i))

def wind_ok(rd, wr, mem, calls):
    drawn = 0
    for i in range(3):
        ed = rd[0x79ED + i]
        if ed == 0:
            outs = [em_wind(E47_WIND_DIST[r], rd[0x79EA + i], 0, E47_WIND_DY[r], rd[0x79F0 + i]) for r in range(16)]
            if got(mem, i) not in outs:
                return False
            drawn += 1
        elif ed < 0x0C:
            if mem(0x79ED + i) != 0:
                return False
        else:
            if got(mem, i) != em_wind(ed, rd[0x79EA + i], rd[0x79F6 + i] | rd[0x79F9 + i] << 8, rd[0x79F3 + i], rd[0x79F0 + i]):
                return False
            drawn += 1
    return calls.count('sprites_draw') == drawn
'''
expect = "wind_ok(rd, wr, mem, calls)"
cases = { "any(rd[0x79ED + i] == 0 for i in range(3))" = 5, "any(0 < rd[0x79ED + i] < 0x0C for i in range(3))" = 5, "all(rd[0x79ED + i] >= 0x0C for i in range(3))" = 20 }

