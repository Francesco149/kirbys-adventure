E47_WIND_DY = [0xEC, 0xEC, 0xEC, 0xEC, 0xEC, 0xEC, 0xF4, 0xFB, 0x05, 0x0C, 0x14, 0x14, 0x14, 0x14, 0x14, 0x14]
E63_HELD_DX = [0x000E, 0xFFF2, 0x000E, 0xFFF2]
E63_HELD_DY = [0xFFF4, 0xFFF3]
E63_SWING_DX = [0x0013, 0xFFED, 0x0007, 0xFFF9, 0xFFFA, 0x0006, 0xFFEE, 0x0012, 0xFFE8, 0x0019, 0xFFE9, 0x0019, 0xFFEB, 0x0015]
E63_SWING_DY = [0xFFEE, 0xFFE5, 0xFFE5, 0xFFED, 0xFFFA, 0x0007, 0x000E]
E46_SWING_WAIT = [3, 3, 3, 3, 1, 1, 1, 1, 5, 5, 5]
E46_SWING_DX = [0xFFFD00, 0xFFFE00, 0xFFFF80, 0xFFFF40, 0x000080, 0x000100, 0x000400, 0x000600, 0x000200, 0x000000, 0xFFFE00]
E46_SWING_DY = [0xFFFFC0, 0xFFFF80, 0xFFFE00, 0xFFFD00, 0x000600, 0x000400, 0x000100, 0x000080, 0x000000, 0x000000,
                0x000000, 0x000040, 0x000080, 0x000200, 0x000300, 0xFFFA00, 0xFFFC00, 0xFFFF00, 0xFFFF80, 0x000000, 0x000000]
E42_LUNGE_VX = [0x0200, 0x0100, 0xFE00, 0xFF00]

def em_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def em_script(wr, bank, addr):
    """obj_set_script gave a thread this address in this bank."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == bank for t in range(32))

def em_spawned(wr, typ):
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]

def em_neg(v, d):
    return (-v) & 0xFFFF if d & 0x80 else v

def em_wind(ed, ea, sp, f3, f0):
    """One frame of a streak of e47_wind_draw: (distance, its fraction, speed, Y offset, its fraction) after it,
    or None when it ends (distance below $0C)."""
    if ed >= 0x0C:
        sp = (sp + 0xFFC4) & 0xFFFF
        pos = ((ed << 8 | ea) + sp) & 0xFFFF
        ed, ea = pos >> 8, pos & 0xFF
        n = (ed >> 4) + 2
        m = f3 if f3 < 0x80 else (-f3) & 0xFF
        t = (m << 8) >> n
        if f3 < 0x80:
            t = -t
        y = ((f3 << 8 | f0) + t) & 0xFFFF
        return ed, ea, sp, y >> 8, y & 0xFF
    return None
'''

