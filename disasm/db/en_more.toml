[[claim]]
id = "en_more.e46.tick_swing"
about = ["e46_tick_swing", "e46_swing_tabs", "e46_claw_swing"]
text = "e46_tick_swing: when variable 6 - 1 goes negative, variable 5 - 1 is the step and variable 6 = its frames (or, below step 0, the claw gets the script 2C:AE54); in every other call the claw's 24-bit X offset grows by the step's X step and its 24-bit Y offset by the Y step (index + 10 when variable 3 is not 0). Step changes, both claws and the end happen."
kind = "call"
fn = "e46_tick_swing"
on = ["cov2-abilities-mole@82060+3500", "cov2-save-finished@147000+700"]
min_calls = 300
use = ["en_more_model"]
model = '''
def x24(m, x):
    return m[0x70 + x] | m[0x82 + x] << 8 | m[0x94 + x] << 16

def y24(m, x):
    return m[0xA6 + x] | m[0xB8 + x] << 8 | m[0xCA + x] << 16

def swing_ok(rd, wr, mem, ran):
    x = rd[0x6E]
    s = rd[0x6224 + x]
    if rd[0x6236 + x] == 0:
        s = (s - 1) & 0xFF
        if s >= 0x80:
            return ran('2C:B67B') and any(wr.get(0x6380 + t) == 0x54 and wr.get(0x63A0 + t) == 0xAE for t in range(32))
        if wr[0x6236 + x] != E46_SWING_WAIT[s]:
            return False
    k = s + (10 if mem(0x6200 + x) else 0)
    return (x24(wr, x) == (x24(rd, x) + E46_SWING_DX[s]) & 0xFFFFFF and y24(wr, x) == (y24(rd, x) + E46_SWING_DY[k]) & 0xFFFFFF)
'''
expect = "swing_ok(rd, wr, mem, ran)"
cases = { "ran('2C:B67B')" = 3, "ran('2C:B683')" = 50, "ran('2C:B6A4')" = 50, "ran('2C:B69F') and not ran('2C:B6A4')" = 50 }

