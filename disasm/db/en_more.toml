unit = "en_more"
title = "The bosses' moves the second batch of movies ran: the ending's demo fights and the mole fought with an ability"
summary = """The code and scripts of the enemy banks 2B, 2C, 2D, 28 and 2F that only the second batch of coverage movies
ran. Most of it comes from the staff credits after the ending (cov2-save-finished from frame 145,400; cov2-minigame-bonus
is a copy of it up to after them), where each boss is shown in a short demo fight above the credits: the sun and the
moon, the cloud with the eye, the digging machine, the masked knight and the boss in the red robe use moves there that
no played fight had shown. The rest is the digging machine fought again with the Hammer (cov2-abilities-mole) and the
moon of the sun-and-moon fight with the Cutter (cov2-abilities-cutter). Each name follows the unit of its object type.

Type $47 (unit en2d, the boss in the red robe): action 0 (e47_rethink), action 1, the big jump (e47_jump: e47_tick_jump,
a thread e47_jump_thread that steps the rise and the fall through e47_jump_tabs with e47_jump_rise / e47_jump_fall /
e47_fall_step, and on landing e47_jump_land: the effect $15 and two shock stars of type $64), action 5 with his hammer
(e47_carry: e47_hammer_make creates an object of type $63, e47_tick_carry walks at Kirby until e47_kirby_far says he is
within $34 pixels, e47_hammer_pick picks the swing), action 9, the swing (e47_swing, e47_swing_hop, e47_tick_swing,
e47_swing_end), action 10, the inhale (e47_inhale, e47_inhale_pose, e47_tick_inhale, the three streaks of wind of
e47_wind_draw), the hop that ends a walk near Kirby (e47_walk_hop, e47_hop_start), the reactions to damage in the air
(e47_hurt_air with e47_tick_hurt_fall) and during the jump (e47_jump_hurt with e47_keep_motion / e47_restore_motion and
e47_jump_resume), and the entry of e47_set_script with the slot already in X (e47_set_script_x).
Type $63 (e63_*): the boss's hammer as an object of its own, created by e47_hammer_make: e63_start holds it at his side
(e63_tick_held: placed by his pose, e63_held_offs), e63_swing / e63_raise / e63_slam / e63_lift swing it down by its own
poses (e63_tick_swing, e63_swing_offs) and e47_star_make sends a shock star of type $64 from where it lands. Both tick
routines make the hit test with the record 39:8A74 (a box of 4 x 4 with no reactions: it hurts Kirby, nothing hurts it).
Type $45 (unit en28, the sun and the moon): the sun's action 5 (e45_sun_turn, e45_tick_sun_turn: a turn on the ground),
the moon's actions 14 (e45_moon_chase, e45_tick_moon_chase with e45_chase_bounds: it drifts at Kirby while he stays in
the band of the screen it guards) and 15 / 16 (e45_moon_lurk, e45_tick_moon_lurk: it waits in the sky for Kirby to come
into that band).
Type $46 (unit en2c, the digging machine): the object with variable 0 = 2 (e46_hatch, e46_tick_hatch, e46_hatch_open,
e46_hatch_close: a hatch on the body that opens and lets out an object of type $5D), the claws' fourth way (e46_claw_swing,
e46_tick_swing with e46_swing_tabs: a swing down and back along a fixed path), the leg 2 entry (e46_leg_y0) and the two
mixed entries of the reach (e46_reach_out_back, e46_reach_back_out). Type $5D (e5d_*): the small digger the hatch lets out:
it flies left at 2 pixels per frame and digs (e46_dig) through the earth; every fourth one (e5d_count) has its own record
and poses.
Type $42 (unit en2b, the masked knight): the walk steps 1 and 2 (e42_step_follow, e42_step_follow_stop, e42_step_face: he
keeps 64 pixels from Kirby while Kirby moves and turns to him when Kirby stands), and the tick routine of action 14
(e42_tick_lunge, e42_lunge_vx: a step forward at $0200 then $0100 and a stop; its script is 2B:ADF1, inside the region
e42_unused_d of unit en2b).
Type $3D (unit en2f, the cloud with the eye): the attack 2 (e3d_sweep2: two passes across the screen), the bob of attack
1 (e3d_bob), the states 0, 2 and 5 of e3d_tick_fight (e3d_state_set, e3d_state_count, e3d_state_idle) and the fourth
entry of e3d_pick (e3d_pick3 with e3d_pick3_x).

Open:
- Type $47: the swing's other two kinds (variable 4 = 1 or 2: 2D:A0C8, 2D:A0EF, 2D:A137 and the hammer's 2D:A1AB,
  2D:A1D6), the inhale catching Kirby (2D:A996: his script 2D:A38E) and running out (2D:A98B), e47_jump_rise with variable 5 not 0 or with fewer than $21 hit points, e47_jump_fall with
  variable 5 not 2, the stream of e47_wind_draw facing left, e47_copy_dir facing left, e47_star_make facing left; the
  boss and every routine here ran in one demo fight (cov2-save-finished@148578-149200), so most claims hold one call or
  one stretch of frames; the copy movie gives the second window.
- The script 2B:ADF1 that e42_tick_lunge belongs to is e42_lunge in unit en2b (split out of e42_unused_d after this
  round); the older units' descriptions of what never ran were brought in line with this unit after it.
- Type $45: e45_tick_moon_chase's path for a moon whose $6200 count runs out (28:B540 with $078A negative), the clamping
  of e45_chase_bounds; which body runs e45_tick_moon_lurk with $0787 = 1 and what raises it to 2 or 3.
- Type $46: e46_tick_hatch with the parent's bit 7 of obj_sprite_bank set; what the object of type $5D is called.
- Type $3D: the states 1 and 4 (2F:AF08, 2F:AF9D), the other entries of e3d_pick3_x.
"""

