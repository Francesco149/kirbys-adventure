[[claim]]
id = "en_cov4.moon.spawn"
about = ["e45_moon_shoot", "e5c_moon_shot"]
text = "The asm_spawn at 28:AE15 of e45_moon_shoot creates one object of type $5C whose variable 0 is 2."
kind = "vmop"
op = "asm_w"
at = "28:AE15"
on = ["cov4-b-sun@42770+15"]
min = 1
use = ["en_cov3_model"]
expect = "[wr[0x61CA + i] for i in c3_spawned(wr, 0x5C)] == [2]"

[[claim]]
id = "en_cov4.moon.lunge"
about = ["e45_tick_lunge", "e45_lunge_from", "e45_lunge_vx"]
text = "Every call of e45_tick_lunge calls e45_draw_plain and e45_hit, leaves variable 2 one lower and the high byte of the X velocity = c4_lunge(new variable 2, obj_dir): e45_lunge_vx of the last entry of e45_lunge_from not above it, negated when obj_dir has bit 7 set."
kind = "call"
fn = "e45_tick_lunge"
on = ["cov4-b-sun@42732+40", "cov4-b-sun@42772+45"]
min_calls = 83
use = ["en_cov4_model"]
expect = "calls[:2] == ['e45_draw_plain', 'e45_hit'] and wr[0x61EE + rd[0x6E]] == (rd[0x61EE + rd[0x6E]] - 1) & 0xFF and wr[0x60F2 + rd[0x6E]] == c4_lunge(wr[0x61EE + rd[0x6E]], rd[0x61DC + rd[0x6E]])"
cases = { "wr[0x60F2 + rd[0x6E]] == 4" = 2, "wr[0x60F2 + rd[0x6E]] == 0xFC" = 2, "wr[0x60F2 + rd[0x6E]] == 0" = 60 }

[[claim]]
id = "en_cov4.moon.tables"
about = ["e45_lunge_from", "e45_lunge_vx", "e5c_moon_shot_hit"]
text = "e45_lunge_from and e45_lunge_vx hold the model's LUNGE_FROM and LUNGE_VX, and the record 39:8954 the 24 bytes of MOON_SHOT_REC; e5c_moon_shot_hit loads A = $54, X = $89 and calls 3F:E31D."
kind = "static"
use = ["en_cov4_model"]
expect = "[u8(O('e45_lunge_from') + i) for i in range(9)] == LUNGE_FROM and [u8(O('e45_lunge_vx') + i) for i in range(9)] == LUNGE_VX and [u8(O('39:8954') + i) for i in range(24)] == MOON_SHOT_REC and rom[O('e5c_moon_shot_hit'):O('e5c_moon_shot_hit') + 8].hex() == 'a954a289201de360'"

[[claim]]
id = "en_cov4.moon.lunge_effect"
about = ["e45_lunge_vx", "e45_tick_lunge"]
text = "With entry 6 of e45_lunge_vx patched from 4 to 8, the moon (slot 15) is 8 pixels further right at cov4-b-sun@42775 than in the unchanged run."
kind = "effect"
on = "cov4-b-sun@42760"
frames = 15
patch = { "28:B5F2" = 8 }
expect = "(ram[0x82 + 15] - ctl[0x82 + 15]) & 0xFF == 8"

