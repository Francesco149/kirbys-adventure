model = '''
def c4_loaded(rd, wr, ran, calls):
    s = rd[0x6E]
    if calls[:1] != ['e06_fire_test']:
        return False
    if ran('23:A6A7'):
        return c3_script(wr, A('e06_jump_out') & 0xFFFF, 0x23)
    v3 = rd.get(0x6200 + s)
    if v3 & 0x80:
        if rd[0x3A] & 4:
            return ran('23:A66B') == 1 and wr[0x62C6 + s] == 0x0A and wr[0x6200 + s] == 4
        return 0x6200 + s not in wr and not c3_any_script(wr)
    if v3 == 0:
        return (wr[0x62C6 + s] == 0 and (wr[0x627E + s], wr[0x6290 + s]) == (0x88, 0xA6)
                and calls.count('e06_fire_test') == 2)
    return wr[0x6200 + s] == v3 - 1 and not c3_any_script(wr)
'''
