desc = "For e45_tick_lunge, by the entry of e45_lunge_from: the high byte of the X velocity, 0, -4, -2, -1, 1, 2, 4, 0, 0."

[[script]]
at = "28:BDAD"
name = "e5c_moon_shot"
desc = """Variant 2 of type $5C, the moon's shot (e45_moon_shoot; once, cov4-b-sun@42777, slot 16): the tick routine
e5c_moon_shot_hit, variable 0 = 2, 16 pixels forward (asm_step_fwd), the X velocity $0400 along its facing (3F:E26A),
obj_dir_left, and for either answer (the jne at 28:BDC0 goes to the next instruction) the poses $55, $54, $53, $52
for 2 frames each, in a loop. The bytes at 28:BDCB (the same loop from $52 upward) are not reached."""

[[sym]]
at = "28:BE2E"
name = "e5c_moon_shot_hit"
desc = """Tick routine of e5c_moon_shot: hit_test_far (3F:E31D) with the record 39:8954, as e5c_shot_hit's but with the
flags 0: a box of 8 x 8, inhale number $FF, touching it hurts Kirby (8), its hit points gone and kind 2 of
kirby_rect: 22:8100."""

[[claim]]
id = "en_cov4.sun.descend"
about = ["e45_sun_descend"]
text = "The on_tick at 28:AD1A of e45_sun_descend installs e45_tick_descend, and the set_mem8 before it clears $078C."
kind = "vmop"
op = "on_tick"
at = "28:AD1A"
on = ["cov4-b-sun@42810+15"]
min = 1
expect = "args[0] == A('e45_tick_descend') and rom[O('28:AD15'):O('28:AD15') + 4].hex() == '118c0700'"

[[claim]]
id = "en_cov4.sun.descend_pose"
about = ["e45_sun_descend", "e45_sun_descend_loop"]
text = "The jeq at 28:AD28 after e45_sky_leave goes to e45_sun_descend_loop (28:AD35; the answer 0), whose set_pose_w shows the pose $25 and whose jmp returns to itself."
kind = "vmop"
op = "jeq"
at = "28:AD28"
on = ["cov4-b-sun@42810+15"]
min = 1
expect = "next == A('e45_sun_descend_loop') & 0xFFFF and rom[O('28:AD35'):O('28:AD35') + 6].hex() == '52257217' + '35ad'"

[[claim]]
