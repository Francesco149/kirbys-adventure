[[claim]]
id = "en_cov4.callers"
about = ["e06_tick_ducked", "e18_tick_flee", "e18_flee_step", "e2f_tick_leave", "e45_tick_lunge", "e5c_moon_shot_hit"]
text = "Over the whole corpus e18_flee_step is called only by e18_tick_flee and e18_tick_flee_test (cov11-a-flee), and the tick routines e06_tick_ducked, e18_tick_flee, e2f_tick_leave, e45_tick_lunge and e5c_moon_shot_hit only through call_vector (3E:D7AB)."
kind = "xref"
expect = "callers('e18_flee_step') == {'e18_tick_flee', 'e18_tick_flee_test'} and all(callers(n) == {'3E:D7AB'} for n in ('e06_tick_ducked', 'e18_tick_flee', 'e2f_tick_leave', 'e45_tick_lunge', 'e5c_moon_shot_hit'))"
