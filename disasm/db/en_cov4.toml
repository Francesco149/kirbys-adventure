unit = "en_cov4"
title = "What the fourth coverage batch ran in banks 23-28: the cannon left and fired empty, the fleeing fish, the hover's end, the sun coming down and the moon's ground shot"
summary = """
Code, scripts and small tables of the banks 23-28 that ran for the first time in the fourth batch of coverage movies
(cov4-*) and that no unit described, named in the style of the units that own their neighbours (en23 / en_cov3,
en24c, en25b, en28) and claimed here. The other cov4 movies that play in these banks (cov4-b-laser, cov4-b-rod,
cov4-b-bonk, cov4-b-ufo, cov4-b-poppy and the cov4-e-* movies other than the fish and the hover) ran new paths
inside routines and scripts that other units already describe: they are listed under Open.

The cannon of 4-3 (type $06 variable 0 = 6, e06_*), all in cov4-b-fuse. Kirby in the loaded cannon holds Down
(60123): e06_tick_loaded shows the pose $0A and counts variable 3 from 5 down to 0, then (60128) shows the pose 0
(Kirby ducked inside, nothing of him shows) and makes e06_tick_ducked the tick routine: while Down is held nothing
happens; let go (60135) the cannon goes back to 23:A559 of e06_cannon_load (variable 3 = $FF, the pose $0A: his
head shows again). A newly pressed A (60195) starts e06_jump_out: Kirby's object gets his start script 14:A000
(asm_obj_script), hit_kirby_off = 0, variable 3 = $1E (the frames before the cannon can take him again) and the
cannon's idle script (23:A530). With the fuse burnt and nobody in it (60804) e06_cannon_tick starts e06_fire_empty:
the blast (a type $06 with variable 0 = 8 and variable 1 = 4, e06_blast), the effect $0C at the cannon, the recoil
hop, and the idle script again (which sets fuse_burnt to 0).

The fish of the pools (type $18 variant 0, e18_*), cov4-e-fish: after $700 frames of chasing (variable 3 of its frame
count reaches 7, 6583) e18_tick_chase starts e18_flee: the same animation with the tick routine e18_tick_flee,
whose step (e18_flee_step) counts variable 2 only and every 8th frame turns obj_dir to the direction away from Kirby
(the direction to him plus $90, rounded down to an eighth of a turn) and steers with e18_home_step: it swims away.

The hovering type $2F (variable 0 = 2, e2f_*), cov4-e-hover: when its six rounds of bobbing run out (25074)
e2f_tick_hover starts entry $0A of e2f_scripts, e2f_hover_leave: the tick routine e2f_tick_leave, which takes $19
from the Y velocity every frame: it rises ever faster and leaves the screen.

Mr. Shine and Mr. Bright (type $45, e45_*), cov4-b-sun, where e45_begin's random number was 0: the moon stayed on
the ground and the sun went up. The moon's ground attack 0 (e45_moon_shoot, 42732): it faces Kirby, variable 2 =
$52, the tick routine e45_tick_lunge (a step forward and back by e45_lunge_from / e45_lunge_vx as variable 2 counts
down), and after 45 frames a shot of type $5C with variable 0 = 2 (e5c_moon_shot: 16 pixels forward, 4 pixels per
frame, the poses $55-$52 two frames each; e5c_moon_shot_hit runs the hit test with the record 39:8954) and sound
$3F. The sun's way down (action 18, e45_sun_descend, 42817): e45_tick_descend with $078C = 0; e45_sky_leave answered
0, and it shows the poses $25 / $26 until it lands (42859).

Open:
- Never ran (not described beyond the listing): in e06_tick_ducked A pressed or the fuse burnt while Kirby is ducked
  (e06_fire_test's two exits from there); e18_hit answering carry set in e18_tick_flee (the exit to 24:AF90,
  24:B057-B064, and its tick routine 24:B065 ran in cov11-a-flee: unit cov11); e2f_hit answering carry set in
  e2f_tick_leave, and the end of the rising object (the movie ends 36 frames after it began to rise); in
  e45_tick_lunge the hit, the negative variable 2 at entry and the edge (28:B5B6-B5C0); the left-facing poses of e5c_moon_shot
  (28:BDCB: the jne at 28:BDC0 goes to the next instruction either way, so nothing reaches them).
- The moon facing left in e45_tick_lunge (28:B5D7) and e45_sky_leave answering 1 in e45_sun_descend (28:AD2B-AD34)
  ran in cov5-g-sun (42033, 42814): unit en_cov5.
- Paths inside routines and scripts of other units that first ran in the cov4 movies and that their units still
  describe as never run (not described here): e06_cannon_clear_fx freeing Kirby's trail effects (cov4-b-fuse);
  e45_begin's other order (28:BAE2-BB1C); the saucer's fourth-dash point by obj_aim_at (28:A9F9, cov4-b-ufo; its
  laser script e28_laser first ran in cov6-j-x, unit en28); Bonkers' near answer (28:A504, cov4-b-bonk); and the paths of the
  laser-lit fuse, the Star Rod piece, Poppy Bros. Sr.'s burst and the cov4-e-* movies of the types $1D, $1E, $29, $38,
  $3A in their units' code.
"""

# ================================================================= shared model

[[model]]
name = "en_cov4_model"
code = '''
import math
LUNGE_FROM = [0x00, 0x20, 0x22, 0x24, 0x26, 0x28, 0x2A, 0x2C, 0x4C]
LUNGE_VX = [0x00, 0xFC, 0xFE, 0xFF, 0x01, 0x02, 0x04, 0x00, 0x00]
MOON_SHOT_REC = [0x08, 0x08, 0x00, 0xFF, 0x08, 0x00, 0x00, 0x00, 0x00, 0x00, 0x81, 0x22,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x81, 0x22, 0x00, 0x00, 0x00]

def c4_lunge(v2, d):
    y = 9
    while True:
        y -= 1
        if v2 >= LUNGE_FROM[y]:
            break
    vx = LUNGE_VX[y]
    return (-vx) & 0xFF if d & 0x80 else vx

def c4_dir_to(sx, sy, tx, ty):
    """The direction from (sx, sy) to (tx, ty) in 256ths of a turn: 0 up, $40 right, $80 down, $C0 left."""
    return math.atan2(tx - sx, -(ty - sy)) * 128 / math.pi % 256

def c4_wpos(m, s):
    return m[0x6074 + s] | m[0x6086 + s] << 8, m[0x6098 + s] | m[0x60AA + s] << 8

def c4_flee_ok(rd, wr, ran, calls, rp, romrd, s):
    v2 = 0x61EE + s
    if not ran('24:B08C'):
        return rp & 1 == 1 and v2 not in wr
    n2 = (rd[v2] + 1) & 0xFF
    if wr[v2] != n2 or 0x6200 + s in wr:
        return False
    if n2 & 7:
        return rp & 1 == 1 and 'obj_aim_at' not in calls and not ran('22:886F')
    d = wr[0x61DC + s]
    sx, sy = c4_wpos(rd, s)
    kx, ky = c4_wpos(rd, 1)
    t = c4_dir_to(sx, sy, kx, ky)
    off = ((d - 0x80) - t + 128) % 256 - 128
    step = any(O('e18_home_step') <= k < O('e18_home_step') + 16 for k in romrd)
    return rp & 1 == 0 and d & 0x1F == 0 and -0x18 <= off <= 0x18 and ran('22:886F') == 1 and step
'''

