unit = "kst14b"
title = "Kirby's states in bank 14, second half: the states with a copy ability, the ladder, water, being hurt"
summary = """
The rest of bank 14 after unit kst14: the second set of Kirby's ordinary states (scripts $1E-$32, Kirby who holds a
copy ability and is not using it, kirby_form 2, sprite map 1A:8676), the Hi-Jump's rise (14:B68C, script $41), the
ladder and the water states of Kirby without an ability (scripts $11, $14, $15, $17-$1A, $1D), the scripts of being
hurt ($ED, $E8, $E9) and of losing a life ($EE), and the two routines the door script asks for how Kirby looks.

The second set mirrors the first routine by routine. The script numbers are the first set's plus $1C ($03 stand ->
$1F ... $16 puff -> $32), the pose numbers are the same (the other sprite map makes them look different), the
speed and gravity profiles, the jump velocities ($FC70, $FF50), the rectangles of the dive and the slide and the
waits are the same. kst14b.mirror.static compares the chains of tests of each pair in the ROM. The differences:

- No inhale. Where the first set asks pad_b_new and starts script $4B, the second asks kirby_ab_use_test and starts
  script $3A (16:A000, the use of the ability). The test wants a new press of B and a free slot among 6-8 (the
  shots), and refuses ability $0E while kirby_action is 4 or 5 (in the air) and ability $11 in water. It sits
  earlier in the chain than the B test did: straight after the floor (and wall) tests.
- Five routines end with one more test, pad_select_drop (a new press of Select: the ability is thrown away), which
  starts script $01 (kirby_s_reset, the first set): stand, walk, run, fall, dive hit.
- The order of the other tests differs in walk and run (floor_kind_changed before the door, not last), fall and dive
  hit (water and door before Up), dive (water before Up) and duck (the slide and the drop before the floor test).
  Stand, turn, jump, dive landing, slide, inflate, flap, float and puff keep the first set's order.
- kirby_s_ab_stand does not blink; kirby_s_ab_jump_cut stores kirby_action 5 before the five frames of the rise's end
  (the first set leaves 4 until the fall script), so kirby_st_ab_fall always runs with 5.
- Script $41 has no counterpart: it is the Hi-Jump (ability $0E), started from bank 16.

One thing the chains do not show: a routine that ends in kirby_upkeep without an exit can still find Kirby's
thread moved. When his rectangle (slide, dive, Hi-Jump) hits an object inside break_rect_0, 39:8761 gives his
thread another script. The claims on those routines allow that case and nothing else.

  state (script)           action  routine                 leaves to
  resume ($1E)                     (script only)           21:9BF7 picks stand, walk, run, fall, $34-$36, float
  stand ($1F)              0       kirby_st_ab_stand       fall, use, walk, ladder $2D, duck, jump, door, inflate,
                                                           stand again, drop the ability ($01)
  walk ($20, $21)          1       kirby_st_ab_walk        stand (wall), fall, use, stand (speed 0), turn, run, ladder,
                                                           duck, jump, walk again, door, inflate, drop the ability
  run ($22, $23)           2       kirby_st_ab_run         stand, fall, use, turn, walk, ladder, duck, jump, run again,
                                                           door, inflate, drop the ability
  turn ($24)               3       kirby_st_ab_turn        stand (wall), fall, use, stand (speed 0), jump
  jump ($25, $26)          4, 5    kirby_st_ab_jump_held   (A released = $26), kirby_st_ab_jump_rise: resume, fall
                                                           (ceiling, top of the room), use, ladder, door
  Hi-Jump (14:B68C, $41)   4, 5    kirby_st_hijump_start   (20 frames at $FC00 without gravity), kirby_st_hijump_held
                                                           (23 frames from $FC70), kirby_st_hijump_rise: B again = $41
                                                           (the end of the rise), resume, fall, ladder $3D
  fall ($27)               5       kirby_st_ab_fall        resume (floor), fall again (ceiling, a bump waits), use,
                                                           ladder, water $33, door, inflate, drop the ability
  dive (no number)         5       kirby_st_ab_dive        dive landing $29, fall, dive hit $28, use, ladder, water,
                                                           inflate, door
  dive hit ($28)           5       kirby_st_ab_dive_hit    resume, fall (ceiling; he falls again), use, ladder, water,
                                                           door, inflate, drop the ability
  dive landing ($29)       5       kirby_st_ab_dive_land   resume (floor), inflate, water
  drop ($2A)               5       kirby_st_ab_drop        (none: 16 frames of falling, then resume)
  duck ($2B)               6       kirby_st_ab_duck        slide (A or B), drop $2A (down_bit5_test), fall, resume
  slide ($2C)              7       kirby_st_ab_slide       stand (wall, speed below $C0), fall
  inflate ($2E)            (kept)  kirby_st_ab_inflate     door; after 24 frames: float
  flap ($2F)               $0D     kirby_st_ab_flap        puff (B), float in water $30, door
  float (no number)        $0D     kirby_st_ab_float       flap (A or Up), puff (B), float in water $30, door
  puff ($32)               $0A     kirby_st_ab_puff        water $33; after 24 frames: inflate again or resume

Script $2A is what ducking starts when down_bit5_test answers (Down on a block with bit 5 of prop_shape: a floor he
can drop through): 16 frames with gravity profile 0 and no test at all, then resume.

Without an ability. The ladder (script $11, kirby_st_ladder): Up climbs at $FECD, Down descends at $0133, neither
stands still; he leaves to kirby_s_resume when the block 6 below (Up) or 7 below (Down) his position is not shape 1,
or when Left or Right is held. Water: kirby_s_water_enter ($17) is what falling into water starts (kirby_in_water set, a
splash object, resume); resume then picks kirby_s_water_stand ($18), kirby_s_water_walk ($19) or kirby_s_swim ($1A)
with 21:9BF7. Swimming restarts its own script whenever 21:8A06 says the direction number in $05F5 changed (the
script picks the pose by it), goes to resume on a floor and to kirby_s_water_leave ($1D: kirby_in_water cleared, a
splash, then the jump script) when water_left answers. Floating into water starts kirby_s_float_water ($14, gravity
profile $0C), which leaves through $15 back to kirby_s_float.

Hurt. Script $ED (kirby_s_hurt) is what a hit starts: 3F:E2D9, an object, sprite map 1C:8DA6, then a jump table of
six reactions on kirby_hurt_kind (variable 0 of slot 1, or 5 while kirby_form is $0E). Reaction 0, the common one,
is the knock-back: kirby_hurt_timer = $88, the velocity zeroed, kirby_st_hurt as the routine, a second task that
gives kirby_speed $0400, $0300, $0200, $0100, 0 over 10 frames away from the side in variable 2 (kirby_hurt_speed),
then kirby_s_hurt_end ($E8): kirby_hurt_timer = $60 (96 frames of blinking, counted by kirby_upkeep) and back into
kirby_s_start at 14:A099, the jump table on kirby_form. Reactions 1 and 3 throw him up at $FE00 with kirby_speed
$0080 for up to 120 frames (kirby_st_hurt_air, variable 0 counts) until a floor: script $E9 (kirby_s_hurt_bounce),
which bounces him once more at $FD40 (kirby_st_hurt_bounce) and ends in $E8. Script $EE (kirby_s_die) is what
kirby_upkeep starts at negative hp: form 0, bit 6 of kirby_flags cleared, hp = $FF, the objects stopped, a wait of
60 frames, eight objects, 210 frames of flying up, a fade and leave_code = 3.

Open:
- Never ran: script $0E of the first set (14:AC98, the
  counterpart of kirby_s_ab_drop) and the first set's script $EB (14:A240: hurt in water). The second set's ladder
  ($2D, 14:BA5D) and water states ($33-$39, 14:BCAE onward) ran in the coverage movies and are documented in unit
  kst_abl; $30 (14:BC0F, floating into water, routine 14:BC23) ran in cov4-c-ab and is documented in unit kst_cov4, $31
  (14:BC1D, the surface after floating in water) in cov5-h-full and is documented in unit kst_cov5.
- Exits that never ran, so in the model without a case: stand to fall; turn to stand at a wall; the floor exit and
  the door of kirby_st_ab_jump_rise; the ceiling exits of fall, dive and dive hit; the door from the dive and from
  the float; dive landing to water; duck to fall; the floor and the ladder ($3D) of the Hi-Jump; in dive hit
  everything but the second fall exit (bump_pending), the use and (first in cov5-h-abdive: claim
  kst_cov5.ab_dive_hit.exits) Up ($2E) and Select ($01); the water exits of flap and puff; the door of
  kirby_st_float_water. The ladder exits of walk, jump rise and dive, the water exits of dive and float and the puff
  from kirby_st_float_water first ran in cov4-c-ab (claims kst_cov4.<state>.exits); the other exits this list used to
  name ran in the earlier coverage movies (the descriptions say where). In kirby_ab_use_test a full set of shots
  (slots 6-8 all taken) and ability $11 never came up.
- kirby_ab_use_test ran with ability $0E in the air 24 times; that $0E is the Hi-Jump is taken from 14:B68C running
  only with it. Who starts 14:B68C (bank 16) is not in this unit.
- kirby_st_ladder: Up ran 4 times (w3-sonnet@62310), always with the step timer in variable 2 not expiring; the
  climbing poses (14:AE3E the waits 4, 10, 4, 10; 14:AE42 the poses $6E, $6D, $6E, $6C by variable 3) and the stop
  under a block of shape 2 are read from the code only.
- The water spit of the first set (scripts $1B / $1C at 14:B173 / 14:B18E, routines 14:B222 and 14:B218, the
  rectangle tables at 14:B262) ran once (w12-sonnet@39760) and is not documented. In kirby_st_water_stand and
  kirby_st_water_walk only the exits to swimming (21:89F7: A or Up) and to walking ran; in kirby_st_swim the door
  never ran; in kirby_st_float_water the exit to $15 and (once, cov4-c-ab) the puff $16.
- The other reactions of kirby_s_hurt: 2 (14:A459, routine 14:A4C3, script $EA; ran twice in main and in
  w3-sonnet), 4 (14:A304: what kirby_spike_test starts, ran once), 5 (14:A2C5, routine 14:A2F2 calling 17:BAEF, ran
  once). kirby_hurt_tick's answer of carry set (variable 0 reaching 0) never ran. What the reaction numbers mean
  for the thing that hit is not known here.
- kirby_s_die is described from its listing; only its effect on the lives is claimed. 14:A703 (ability 3 taken,
  ran once), 14:A72A (130 runs: clears bit 6 of kirby_flags and frees objects of type 2 with variable 3 = $19 in
  slots 3-5) and the rest of kirby_s_door are not documented; kirby_door_look's entries 4 and 5 (form 5, other
  while floating) never ran; 2 and 3 (forms 3 and 4) ran in cov4-c-sword and cov4-c-hammer (claim
  kst_cov4.door_look.model).
- $05F5 (the swim direction number) and $05F6 (the swim stroke timer) are named in neither unit.
"""

[[model]]
name = "kst14b_use"
code = '''
def kst14b_use(rd):
    """What kirby_ab_use_test answers, from the first values a call read: 1 = carry set."""
    if not rd[0xE7] & 0x40:
        return 0
    for k in range(3):
        if rd[0x612E + k] & 0x80:
            break
    else:
        return 0
    ab = rd[0x5E3]
    if ab == 0x0E and rd[0x5E1] in (4, 5):
        return 0
    if ab == 0x11 and rd[0x5F7]:
        return 0
    return 1

def kst14b_exits(ran, rd, wr, exits, stay):
    """kst14_exits for routines whose call can create objects (a bubble, a broken block), which also writes
    thread program counters: only the thread of slot 1 (obj_first_thread, $614D, read when a script is set) counts.
    A call that stays may still find his thread moved when his rectangle hit an object: 39:8761 does that."""
    took = [e for e in exits if ran(e[0])]
    t = rd.get(0x614D)
    pc = None if t is None or 0x6380 + t not in wr else wr[0x63A0 + t] << 8 | wr[0x6380 + t]
    if ran(stay):
        return not took and (pc is None or ran("39:8761") > 0)
    return len(took) == 1 and pc == took[0][1]
'''

