id = "cov5_tour.extra.hud_hp"
about = ["game_mode"]
text = "Every call of hud_hp that reaches its game_mode test (13:B24C) takes the blanking stores at 13:B253 (tile $81 to $0103-$0105, $0109-$010B and $010F-$0111: the bars 4-6 in the three tile rows, before ppu_record_inline sends the buffer) exactly when game_mode is 1; the Extra Game's 1-1 and an ordinary stage are in the windows."
