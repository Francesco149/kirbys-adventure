text = "Every call of save_game writes $F7 = 0; with save_world below 7 and game_mode not 0 it returns after reading game_mode and writes nothing else (cov5-f-extra@242728 after 1-1, @249084 at the continue); with game_mode 0 it goes on to save_transfer. extra_notice: 1 when the file's byte 2 was 63 or more and byte 3 8 or more before the save, otherwise 2 when byte 2 is 63 or more and byte 3 8 or more after it (cov5-f-del@236913), otherwise 0."
kind = "call"
fn = "save_game"
on = ["cov5-f-extra@242700+60", "cov5-f-extra@249070+30", "cov5-f-del@236890+60", "cov5-f-del@238040+60", "main@2600+600"]
