model = '''
def notice(rd, wr):
    base = 0x7903 + 0x4C * rd[0x79E7]
    if rd[base + 2] >= 63 and rd[base + 3] >= 8:
        return 1
    if wr.get(base + 2, rd[base + 2]) >= 63 and wr.get(base + 3, rd.get(base + 3, 0)) >= 8:
        return 2
    return 0
'''
expect = "wr[0xF7] == 0 and (('save_transfer' not in calls and not (set(wr) - {0xF7} - set(range(0x100, 0x200)))) if rd.get(0xF4) else rd[0x79E9] >= 7 or ('save_transfer' in calls and wr[0xF5] == notice(rd, wr)))"

