unit = "cov5_tour"
title = "The 100% file and the Extra Game: what the Big Switch tour (cov5-f-del) and PLAY EXTRA GAME (cov5-f-extra) ran first"
summary = """
What the last two movies of the fifth batch ran for the first time. cov5-f-del presses all 17 Big Switches on the
finished file of cov2-save-finished (byte 2 of the file goes from 46 to 63, 100%), shows the 100% file at the file
select (the file row, the delete screen) and continues it; cov5-f-extra shares that movie up to its file select
(237,675) and chooses PLAY EXTRA GAME: the Extra Game hub, 1-1 with the goal game's row 5, Crane Fever at level 3,
the game over and the continue.

game_mode ($F4) is 0 in the ordinary game, 1 in the Extra Game (set by fsel_continue's row 2, PLAY EXTRA GAME, with
lives 2 and hp = hp_max = $17, three bars) and 2 in the boss rematch (fsel_rematch). Its readers and what 1 changes:

  reader                 with game_mode 1
  hud_main, hud_hp       the bars 4-6 of the status bar are drawn blank (tile $81): Kirby has three bars
  room_pick_kind         a door of a bonus game gives minigame_level 2 (LEVEL 3) whatever the door says
  save_game              returns at once: the Extra Game is never saved
  continue_setup         the continue gives lives 2 and hp = hp_max = $17 (4 and $2F otherwise)
  kfx_heal_count         1 round of kfx_heal instead of 2 (with 1 once, cov6-j-x@253409)
  save_game_complete     $0528 = 9 instead of 8 (byte 3 of the file: 9 = the Extra Game finished; with 1 once,
                         cov6-j-x@389500, unit cov6_extra)
  gameover_skip_test, gameover_tick_wait, and the scripts that load it (dance_end 19:A12A, en2d's 2D:A56F, lvcard_start
                         34:A000) test bit 1 or the value 2 only: 1 acts as 0

The 100% file: save_game sets extra_notice ($F5) to 1 when the file was already at 100% (byte 2 >= 63 and byte 3 >= 8)
before the save, to 2 when this save brought save_count to 63 (cov5-f-del@236913, the save after 5-6's switch), else 0.
On the next room load help_screen sees extra_notice = 2 (with $F7 = 0) and shows help screen 3, the EXTRA GAME notice
(help_draw with n = 3: packed_2E_AEAE, CHR banks 5, $DB, $80, $81), and clears it. At the file select a 100% file shows
"100% : EXTRA" (fsel_rows: fsel_text $13 for file 0, $12 for files 1-2, fsel_extra_texts) and the title text $0F of
fsel_world_text entry $0A (fsel_file_info); the delete screen's row says 100 (fsel_del_rows, tiles $9D $9C $9C); the
finished file's menu gets row 2, PLAY EXTRA GAME (fsel_file_flags | 5: rows 0 and 2 added to fsel_finished_masks).

The Big Switch's second half: after kirby_s_switch_pan's pan in the hub, Kirby's script fades the screen (four
fade_down steps 4 frames apart) and sets leave_code 2: the switch's room is loaded again with $05A2 still 1, e6f_start
takes its jne to e6f_pressed (the switch pressed, $05A2 = 0, effect $0C, switch_heal: hp + 8 every 8 frames up to
hp_max, then obj_s_star_shake); Kirby leaves by the pause screen's EXIT STAGE (leave_code 6; as the UFO in 7-1,
ability_17_end takes the UFO away in the hub). World 7's hub opens two more rectangles for 7-1's and 7-6's switches
(hub_open_recs' last two records, unit rooms2).

Kirby: script $0E, kirby_s_drop_through (Down on a floor-only block with bit 5 of prop_shape, from kirby_st_duck):
16 frames of falling with walls but no floor test, through the platform; the water spit with an ability straight up
and down (14:BE83's entries 4 and 5); Hammer's dive that broke a block ($A1, kirby_s_hammer_dive_hit), Hammer standing
($AF) and walking ($B0) on the floor under water.

Others: the goal game's row 5 (goal_k_row5, in the Extra Game's 1-1); type $2C's long stroke (e2c_stroke_long,
e2c_stroke_more); the museum's exhibit 7 (the World 3 museum, type $2F's poses); world 7's level card played to its end
(lvcard_w6_kirby's hop, lvcard_w6_notes and the five notes, parts 3-7 of lvcard_w6); Crane Fever at LEVEL 3
(crane_speed_2: speed $0200; crane_coast_2: up to 8 frames more coasting before crane_coast_1); the pause screen's
texts for six abilities (packed_38_*, unit unpack) and world 7's card picture (pose_tab_35_990A, unit sprites).

Open:
- Never ran: help_screen with extra_notice 2 and $F7 not 0 (2E:A997); fsel_text $12's blank-row variant at 3D:B9D1
  (file 1 or 2 at 100%); continue_setup for all eight bosses beaten. fsel_rows / fsel_file_info for byte 3 = 9 (text
  $15, fsel_perfect_texts, and fsel_world_text entry $0C) and kfx_heal_count and save_game_complete with game_mode 1
  first ran in cov6-j-x (the Extra Game finished; unit cov6_extra).
- In the new Kirby routines only the exits listed in the claims ran: kirby_st_hammer_dive_hit only the fall ($A0; B, Up and Select later in cov10-b-hdive, unit cov10);
  kirby_st_hammer_water_stand the B swing ($A7) and the walk ($B0); kirby_st_hammer_water_walk the swim ($B1), the stop
  ($AF) and B; kirby_s_hammer_water_walk's jump table only entries 0-2 (the cycle 17:B6C3 never came round; 17:B6CA,
  17:B6D6 never ran). The Up spit's end (14:BEF9) never ran: the second call table was not reached for direction 4.
- lvcard_w6's parts 3-7 were cut off by the end of the card in cov5-f-del / cov5-f-extra; in cov6-j-x (from 356260)
  the card ran to its end: the later calls of lvcard_w6_note_sway (34:AAD0) and 34:A9A9-34:A9C7 after lvcard_w6_kirby's
  sway (the picture 35:8954, lvcard_chr0_96, pose_tab_35_9898; unit cov6_extra).
- What $F7 is beyond "0 after save_game, 1 after save_game_complete" (the_end_reset writes it too) is not named.
"""

