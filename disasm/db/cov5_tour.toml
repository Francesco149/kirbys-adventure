# ------------------------------------------------------------------ claims: game_mode

[[claim]]
id = "cov5_tour.game_mode.xref"
about = ["game_mode"]
text = "In the corpus game_mode is written only by game_state_init and the script opcode set_mem8, and read by continue_setup, gameover_skip_test, gameover_tick_wait, hud_hp, hud_main, kfx_heal_count, room_pick_kind, save_game, save_game_complete and the opcode load_reg."
kind = "xref"
expect = "writers(0xF4) == {'game_state_init', 'vm_op_set_mem8'} and readers(0xF4) == {'continue_setup', 'gameover_skip_test', 'gameover_tick_wait', 'hud_hp', 'hud_main', 'kfx_heal_count', 'room_pick_kind', 'save_game', 'save_game_complete', 'vm_op_load_reg'}"

[[claim]]
id = "cov5_tour.extra.choose"
about = ["game_mode"]
text = "The jeq at 3D:AF69 of fsel_continue goes to fsel_begin with variable 7 = 0 (CONTINUE) and on to 3D:AF6C otherwise; there the set_mem8 instructions store game_mode = 1, lives = 2, hp = $17 and hp_max = $17 (cov5-f-extra@237881, PLAY EXTRA GAME)."
kind = "vmop"
op = "set_mem8"
on = ["cov5-f-extra@237870+30", "cov2-minigame-bonus@154500+40", "cov5-f-del@237980+100"]
where = "0xAF6C <= addr <= 0xAF78"
min = 4
cases = { "addr == 0xAF6C" = 1, "addr == 0xAF78" = 1 }
expect = "args == {0xAF6C: [0xF4, 1], 0xAF70: [0x599, 2], 0xAF74: [0x597, 0x17], 0xAF78: [0x596, 0x17]}[addr] and wr[args[0]] == args[1]"

[[claim]]
id = "cov5_tour.extra.choose_jump"
about = ["game_mode"]
text = "The jeq at 3D:AF69 of fsel_continue goes on to fsel_begin when the register (variable 7, the menu row) is 0 and to the PLAY EXTRA GAME stores at 3D:AF6C otherwise; both happen."
kind = "vmop"
op = "jeq"
at = "3D:AF69"
on = ["cov5-f-extra@237870+30", "cov2-minigame-bonus@154500+40", "cov5-f-del@237980+100"]
min = 2
cases = { "next == 0xAF6C" = 1, "next == 0xAF7F" = 1 }
expect = "next == (0xAF7F if rd[0x63E0 + thread] == 0 else 0xAF6C)"

