name = "game_mode"
desc = """0 the ordinary game (game_state_init), 1 the Extra Game (fsel_continue's row 2, PLAY EXTRA GAME), 2 the boss
rematch (fsel_rematch). With 1: three bars (hud_main, hud_hp), bonus games at level 3 (room_pick_kind), no saving
(save_game), lives 2 and hp $17 on a continue (continue_setup), one round of kfx_heal (kfx_heal_count) and byte 3 = 9
when the game is finished (save_game_complete)."""

[[ram]]
at = "00F5"
name = "extra_notice"
desc = """Written by save_game: 0, or 1 when the file was already at 100% (byte 2 >= 63, byte 3 >= 8) before this save,
or 2 when this save made it 100%. help_screen shows help screen 3 (the EXTRA GAME notice) for 2 when $F7 is 0, and
clears it. video_init clears it at power-on."""

