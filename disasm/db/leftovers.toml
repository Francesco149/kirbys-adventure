unit = "leftovers"
title = "Leftovers of the minigames and the scenes: the small routines of banks 3C, 3B, 3A, 3D, 36, 2E and 34"
summary = """
The 6502 routines that units minigame, scenes and scenes2 left unnamed in their banks: most are one-job helpers that
the minigames' scripts call (asm_w) or install as tick routines, a few are tails of named routines.

Quick Draw (bank 3C): qd_title_draw, qd_desert_draw and qd_result_draw put the three packed screens of the game on the
name tables (the title card, the desert, the result board); qd_tick_pan pans the camera left over the desert before
the first round and hands the manager to the rounds. Each round: qd_foe_enter gives the opponent of the round his
height and his palette (qd_foe_palette); qd_round_music starts the round's song when it is decided; a shot is three
effect objects (parts $16-$18) that copy the round (qd_fx_round), take their place by shooter and round (qd_fx_place,
qd_fx_foe), move by steps (qd_fx_tick, qd_fx_speed) and free themselves. A beaten opponent flies off along a table of
velocities (qd_foe_fly_tick) and his hat falls to the ground: qd_hat_round, qd_hat_landed (which ends the round for
the manager) and qd_hat_place put it in a row of hats, qd_hat_tick watches qd_lost. The reaction time is drawn by
qd_time_tens_put / qd_time_units_put. On the result board the hats of the won rounds appear one by one
(qd_result_hat, qd_result_attr). minigame_end_tick is the tick of the shared end (Start would skip its wait).

Egg Catcher (banks 3C, 3B, 3A): egg_tick_title waits for A or B on the title card; egg_light_x places the three lights
over the ring, egg_flash steps the ring's palettes when the ball has landed. A thrown thing gets its first velocity
from egg_aim (by arc and speed); every frame egg_fall adds the gravity; an eaten egg adds an icon to the column at the
left (egg_icon_add, egg_icon_src); a thing that meets the closed mouth bounces (egg_bounce, egg_vx_neg) and falls with
egg_tick_bounce until egg_out_test sees it below the ring. At the end egg_air_clear waits for the air to be empty,
egg_result_kind / egg_result_music choose the song, egg_result_box draws the box of the bonus.

Crane Fever (bank 3B): crane_palette loads the 32 colours, crane_bubble_place sets the six bubbles of the pile,
crane_credit_pose shows the credits left, crane_doll_look / crane_doll_kind give each doll one of two looks and its
kind number; crane_claw_at_end stops the claw at the right end, crane_claw_drift gives it a random sideways speed; the
ticks crane_tick_rise (the claw back at the top), crane_tick_doll_rise, crane_tick_carry and crane_tick_doll_home
(the claw and its doll back over the chute), crane_hold_size / crane_claw_look (the claw's picture holding a doll),
crane_doll_pose_back (a slipped doll), crane_tick_scroll and crane_prize_pose (the prize screen).

The scenes: three CHR bank setters of the level cards (bank 34); in bank 36 finale_rod_rise, finale_fade_dark /
finale_screen_on, finale_sparks and finale_snap_y of world 7's last scenes; in bank 2E story_fade_sprite of the story
pages' cross-fade and the part story_fade_pics; in bank 3D five labels inside unit scenes' routines (fsel_text_queue,
fsel_file_empty, fsel_restate, continue_hub_sync, intro_tick_end), named as labels so that they do not split them.

Open:
- Code that never ran: 3D:B65C / 3D:B673 (the percentage of a used file, unit scenes' Open), 3B:B8CB (the claw's
  picture after a dropped doll, called only from the never-run drop of crane_tick_doll_home 3B:B8EF-3B:B9A5), the
  branch 3C:B73A of qd_hat_tick (qd_lost was never set while it ran), 3C:BABC of minigame_end_tick (Start never
  pressed), 3C:BD39 of egg_out_test, 3B:B4B5 of crane_tick_carry ($07C5), 3A:8120-3A:8125 of egg_result_kind (no game
  ended without a bomb), the never-run rows of every table above (later rounds of a lost Quick Draw, the levels 1-2).
- Only one call in the corpus, so the claim has one situation: qd_result_draw, qd_result_pick, qd_result_attr,
  egg_result_box, egg_result_music, crane_prize_pose, crane_doll_pose_back, crane_hold_size, crane_claw_look,
  finale_snap_y, finale_sparks, lvcard_chr0_82, lvcard_chr1_b4, continue_hub_sync.
- crane_claw_at_end never answered carry set: no movie holds the claw to the right end.
- What the pictures are is read from the screen at a few frames (hats, lights, bubbles), not from the CHR data. What
  crane_claw_drift's speeds look like at levels 1-2 (where zero_vel does not clear them) is not known.
"""

# ================================================================= Quick Draw (bank 3C)

[[sym]]
at = "3C:A195"
name = "qd_tick_pan"
desc = """Tick routine of Quick Draw's manager (and of Kirby after a lost round, 3C:AB3D): adds the camera's X velocity
(cam_vx, signed 16 bits, low byte into cam_x_frac) to the 24-bit camera X (cam_x_frac, cam_x). When the sum borrows
below zero (no carry out of the top byte) the object's script becomes 3C:AA2C (bank 3C), which starts the rounds. The
manager sets cam_vx = $FF80 with the camera at $40 after qd_setup, so the view pans left over the desert for 128
frames."""

[[sym]]
at = "3C:A1C9"
name = "qd_title_draw"
desc = "For qd_title_setup: expands packed_3C_A2C2 (the title card with the rules) to $68C8, sends it to the name table $2000 with the record 3C:A240 (ppu_record_inline) and turns the display on."

[[sym]]
at = "3C:A1E4"
name = "qd_desert_draw"
desc = "For qd_setup: expands packed_3C_A7C9 (the desert) to $68C8, copies its 64 attribute bytes ($6C88-$6CC7) to nt_attr, sends the screen to both name tables (records 3C:A240 and 3C:A247: $2000 from $68C8, $2400 from $6CC8) and turns the display on."

[[sym]]
at = "3C:A213"
name = "qd_chr5_60"
desc = "Script call at the end of a Quick Draw game (won: 3C:B915, lost: 3C:B864): chr_bank 5 = $60."

[[sym]]
at = "3C:A21B"
name = "qd_result_draw"
desc = "Script call for the result of a won game (3C:B918): expands packed_3C_A50B (the result board over the desert) to $68C8, copies its attribute bytes to nt_attr and sends it with the record 3C:A24E (name table $2000)."

[[sym]]
at = "3C:A297"
name = "qd_time_tens_put"
desc = "For qd_timer_step: ppu_record of 3C:A290, which writes the two tiles at $07CA/$07CB (the tens digit of the reaction time, from qd_digit_tiles) one above the other at $2163/$2183."

[[sym]]
at = "3C:A2A6"
name = "qd_time_units_put"
desc = "For qd_timer_step: ppu_record of 3C:A29F, the two tiles at $07CA/$07CB (the units digit) at $2164/$2184."

[[sym]]
at = "3C:AB14"
name = "qd_rts"
desc = "A lone rts that the script of Kirby's lost duel (3C:AE36) calls with asm_w: it does nothing."

[[sym]]
at = "3C:ABD4"
name = "qd_round_music"
desc = "Script call when a round is decided (3C:AA74 a won round, 3C:AAAD, 3C:B461 Kirby shot): snd_music with the byte of 3C:ABE0 for the current object's variable 7, the round (songs $16, $16, $18, $18, $18 for rounds 0-4)."

[[sym]]
at = "3C:AEDA"
name = "qd_fx_round"
desc = "For the shot effects (parts $16-$18 of qd_start): variable 7 of the current object = variable 7 of slot 1, the round."

[[sym]]
at = "3C:AEE3"
name = "qd_fx_foe"
desc = "For the shot effects: A = 0 when the current object's variable 2 is 1 (a shot of Kirby's, from the left), 1 otherwise (a shot of the opponent's). The scripts take the opponent's picture (3A:9C58) on 1."
out = "A = 0 Kirby's shot, 1 the opponent's"

[[sym]]
at = "3C:AEF1"
name = "qd_fx_pose"
desc = "For the shot effects: when the shot is Kirby's (qd_fx_foe = 0) and the round (variable 7) is 4, the pose number goes up by one; otherwise nothing."

[[sym]]
at = "3C:AF05"
name = "qd_fx_place"
desc = """Places a shot effect: index 0, 2 or 4 for Kirby's shot by round (rounds 0-1, 2-3, 4), 2 * round + 6 for the
opponent's; X and Y position (16 bits each) from the tables 3C:AF66 / 3C:AF76 for the object in slot 10 and 3C:AF86 /
3C:AF96 for the others."""

[[sym]]
at = "3C:AFA6"
name = "qd_fx_tick"
desc = """Tick routine of the shot effects. Variable 3 is the step, variable 4 counts frames: the step's length is the
byte of 3C:AFCD (slot 10: 0, 4, 4, 4, 4, 4, $FF) or 3C:AFD4 (others: 0, 4, 4, 4, 4, $FF) at the step. When variable 4
equals it, variable 4 = 0 and qd_fx_speed starts the next step; a length of $FF frees the object (obj_free);
otherwise variable 4 + 1."""

[[sym]]
at = "3C:AFDA"
kind = "part"
name = "qd_fx_speed"
desc = "The step change of qd_fx_tick: X velocity from 3C:B021 (slot 10) or 3C:B02D (others) at the step ($0800, $0400, then 0 or slower and backwards), negated when variable 2 is not 1 (the opponent's shot goes the other way), and variable 3 + 1."

[[sym]]
at = "3C:B4FF"
name = "qd_foe_enter"
desc = "Script call of the opponent (part 2 at the start, part 8 for each later round): stores the round (variable 7 of slot 1) in variable 7 of slot 6, sets the object's Y position (low byte) from 3C:B511 by round ($20, $20, $20, $18, $1A) and loads his palette (qd_foe_palette)."

[[sym]]
at = "3C:B516"
name = "qd_foe_palette"
desc = "Y = the round: palette_load of 8 colours into palette entries $18-$1F (sprite palettes 2 and 3) from 3C:B531 + 8 * round (the pointers at 3C:B527 / 3C:B52C): each opponent has his own colours."
in = "Y = the round 0-4"

[[sym]]
at = "3C:B724"
name = "qd_hat_landed"
desc = "Script call of the hat (part 6) when it lands: variable 6 of slot 1 = 1, which the manager waits for (3C:AAF4) to end the round; then, unless the round is 4, qd_hat_place."

[[sym]]
at = "3C:B734"
name = "qd_hat_tick"
desc = "Tick routine of a hat on the ground: when qd_lost is not 0 the hat's script becomes 3C:B6C9 (never ran); otherwise nothing."

[[sym]]
at = "3C:B74A"
name = "qd_hat_round"
desc = "Script call of the hat (parts 6, $19, $1A): variable 7 of the current object = variable 7 of slot 6, the opponent's round."

[[sym]]
at = "3C:B753"
name = "qd_foe_fly_tick"
desc = """Tick routine of a beaten opponent: variable 0 counts up (from $10); its high nibble n picks the entry
3C:B832[round] + n of four tables (3C:B792 X velocity high, 3C:B7BA low, 3C:B7E2 Y velocity high, 3C:B80A low), so
the velocity changes every 16 frames: up and back, then falling. When the high nibble is 0 nothing is set."""

[[sym]]
at = "3C:B837"
name = "qd_hat_place"
desc = "The X position of the hat that has landed: 3C:B84C[round] = $B8, $C8, $D8, $E8 (high byte 0): the hats lie in a row on the ground, one per won round."

[[sym]]
at = "3C:BA22"
name = "qd_result_pick"
desc = "For the result script (3C:B97A): A = 0 when bit 7 of variable 2 of slot 2 ($61F0) is set, else 1; on 1 the script goes to the result after false starts (3C:B89B, never ran)."
out = "A = 0 or 1"

[[sym]]
at = "3C:BA2C"
name = "qd_result_attr"
desc = "On the result board: 2 * variable 7 calls of tile_attr_set with palette 0 at row $0D and the columns of 3C:BA5E (from the last down): the fields of the hat icons get their palette."

[[sym]]
at = "3C:BA49"
name = "qd_result_hat"
desc = "Draws the next hat icon on the result board: ppu_record of the record 3C:BA68 / 3C:BA6D [variable 2] (a 2 x 2 tile hat at $2189, $218C, $218F, $2192), then variable 2 + 1. The result script calls it once per won round after the first (whose hat is a sprite)."

[[sym]]
at = "3C:BAB5"
name = "minigame_end_tick"
desc = "Tick routine of minigame_end: Start newly pressed would send the object to 3C:B9EC (skipping the rest of the 128 frames; never ran); otherwise nothing."

# ================================================================= Egg Catcher (banks 3C, 3B, 3A)

[[sym]]
at = "3C:BC61"
name = "egg_tick_bounce"
desc = "Tick routine of an egg or bomb that bounced off Kirby's closed mouth: egg_fall, then when egg_out_test says it is below the ring, the script 3C:BB16 (a sound, 20 frames, the end)."

[[sym]]
at = "3C:BC78"
name = "egg_fall"
desc = "Gravity for egg_obj: egg_gravity_add with the entry of egg_gravity for variable 2 (the speed at the throw)."

[[sym]]
at = "3C:BC84"
name = "egg_gravity_add"
desc = "Y velocity of object X += the 16-bit entry of egg_gravity at Y (Y = 2 * speed)."
in = "X = the object, Y = 2 * index"

[[sym]]
at = "3C:BD2F"
name = "egg_out_test"
desc = "Carry set when the current object's world Y (low byte) is $9A or more (a signed compare): it has fallen out of the ring. A world X below $38 (never) would give it another picture (3A:85EE) and carry clear."
out = "carry set = below the ring"

[[sym]]
at = "3C:BD58"
name = "egg_icon_add"
desc = """For an eaten egg (from egg_tick_fly): when egg_eaten is 1-30 and not yet drawn ($07B7), $07B7 = egg_eaten and
three tiles are written as a column (ppu_write, length 3) at the name table address of column $07B5 + 2, row
$07B6 + 6, from egg_icon_src. Two eggs share a cell of three rows: after an even count $07B6 goes 3 rows up, and below
row 0 the next column to the left starts at row $0C."""

[[sym]]
at = "3C:BDB1"
name = "egg_icon_src"
desc = "$16/$17 = 3C:BDC9 (tiles $4D $49 $4C: the cell with one egg) when $07B7 is odd, 3C:BDCC ($4A $4B $4C: two eggs) when even."

[[sym]]
at = "3C:BDCF"
name = "egg_aim"
desc = "Script call of egg_obj at the throw: egg_aim_set with Y = 2 * (8 * variable 7 + variable 2), arc and speed."

[[sym]]
at = "3C:BDE2"
name = "egg_aim_set"
desc = "The current object's X velocity = the 16-bit entry of 3C:BE01 at Y, its Y velocity = the entry of 3C:BE31 at Y (leftward and upward: the throw)."
in = "Y = 2 * (8 * arc + speed)"

[[sym]]
at = "3C:BE61"
name = "egg_light_x"
desc = "Script call of the three lights over the ring (3C:BB33, created by the manager in turn): X position = 3C:BE72[variable 3 of slot 1] ($68, $80, $98), high byte 0."

[[sym]]
at = "3C:BE75"
name = "egg_result_box"
desc = "Script call of the bonus banner (3C:BB4F): ppu_record_inline of 3C:BE7B, 4 x 4 tiles at $214E (the box behind the bonus)."

[[sym]]
at = "3C:BEEA"
name = "egg_bounce"
desc = """For egg_tick_fly when a thing meets the closed mouth (X = the object): unless it is going up, its X velocity
is negated, shifted (high byte right, its bit 0 into the low byte from the right), raised by $80 when that is below
$80, and negated back; its Y velocity becomes minus the two bytes each shifted right. So it bounces back up and to the
right."""
in = "X = the object"

[[sym]]
at = "3C:BF2B"
name = "egg_vx_neg"
desc = "X velocity of object X = its negation (16 bits)."
in = "X = the object"

[[sym]]
at = "3B:A6FC"
name = "egg_flash"
desc = "Script call of Egg Catcher's manager after the ball lands: palette_load of 24 colours from entry 4 with the source 3B:A758 / 3B:A75F [variable 7], then variable 7 + 1: the ring's colours in steps."

[[sym]]
at = "3A:80ED"
name = "egg_air_clear"
desc = "A = 1 when slots 5-16 are all free (obj_type $FF), else 0. The manager waits for it after the game is over."
out = "A = 1 when empty"

[[sym]]
at = "3A:8103"
name = "egg_result_music"
desc = "snd_music with 3A:810F[egg_result_kind] and A = that kind."
out = "A = egg_result_kind"

[[sym]]
at = "3A:8113"
name = "egg_result_kind"
desc = "A = 0 when no egg was eaten, 1 when a bomb was eaten (egg_bombs), else 2, or 3 with 30 eggs (never ran)."
out = "A = 0-3"

[[sym]]
at = "3A:814A"
name = "egg_tick_title"
desc = "Tick routine of Egg Catcher's title card: A or B newly pressed sends the manager to 3B:A068 (the ring)."

# ================================================================= Crane Fever (bank 3B)

[[sym]]
at = "3B:B1D8"
name = "crane_bubble_place"
desc = "Script call of a bubble of the pile (part 5): X position 3B:B1FB[i] ($34, $44, $54, $CC, $BC, $AC) and the sprite group pointer 3B:B201 / 3B:B207 / 3B:B20D [i] (three sizes, $3A:96CD-$3A:96D9), i = variable 3 of slot 1 (the manager's count)."

[[sym]]
at = "3B:B3ED"
name = "crane_palette"
desc = "For crane_setup: palette_load of all 32 colours from 3B:BA40."

[[sym]]
at = "3B:B3FC"
name = "crane_claw_drift"
desc = "Script call of the claw when the button is let go: the claw's (slot 2) X velocity = the 16-bit entry of 3B:B411 at random(3) ($0060, $0080, or the two code bytes at 3B:B415). At level 0 the script clears it at once (zero_vel)."

[[sym]]
at = "3B:B420"
name = "crane_credit_pose"
desc = "Script call of the credits sign (part $0C): pose = crane_credits."

[[sym]]
at = "3B:B429"
name = "crane_doll_look"
desc = "Script call of a doll at its start: variable 4 = random(2); the sprite group pointer from 3B:B44F / 3B:B453 / 3B:B457 at variable 4 (+ 2 for the big doll, variable 6 = 1): each doll has two looks."

[[sym]]
at = "3B:B498"
name = "crane_tick_carry"
desc = "Tick routine of the claw carrying a doll home: when the claw's X ($0084) is below $38 the claw's script goes on at 3B:B120 (crane_count_prize, one credit less). $07C5 set (never) would end the carry at 3B:B110."

[[sym]]
at = "3B:B503"
name = "crane_claw_at_end"
desc = "For crane_pad_right: carry set when the claw's world X (slot 2, low byte) is $D6 or more: it is at the right end."
out = "carry set = at the end"

[[sym]]
at = "3B:B53B"
name = "crane_prize_pose"
desc = "Script call of the prize screen (part 7): finds the row of 3B:B56A (four bytes: crane_prize_1, crane_prize_2, -, pose) that matches the two prize bytes and sets the pose from it."

[[sym]]
at = "3B:B64C"
name = "crane_tick_scroll"
desc = "Tick routine of the manager on the prize screen: adds cam_vy to the 24-bit camera Y; when cam_y reaches $A0 (high byte 0), $07BE = 1 (the prizes start) and the script goes on at 3B:AC8B."

[[sym]]
at = "3B:B762"
name = "crane_doll_kind"
desc = "Script call of a doll: variable 7 = 0 or 1 for the small doll (variable 6 = 0; 1 when variable 2 is 2), 2 or 3 for the big one (3 when variable 2 is not 0, never)."

[[sym]]
at = "3B:B785"
name = "crane_tick_rise"
desc = "Tick routine of the claw going up after a grab or a miss: when its world Y is below $58 (signed) its script goes on at 3B:B104 (back to the left)."

[[sym]]
at = "3B:B79F"
name = "crane_tick_doll_rise"
desc = "Tick routine of a held doll going up with the claw: when the claw's world Y is below $58 the doll's script goes on at 3B:AF2F (carried to the left, crane_tick_doll_home)."

[[sym]]
at = "3B:B7C6"
name = "crane_doll_pose_back"
desc = "Script call of the claw after a slip (3B:B0B9): the target doll (slot = the claw's variable 3) gets back the pose saved in the claw's variable 4."

[[sym]]
at = "3B:B898"
name = "crane_hold_size"
desc = "For crane_tick_result on a hold: the claw's variable 6 = 0 when the target doll's variable 6 is 1 (the big doll), else 1."

[[sym]]
at = "3B:B8AA"
name = "crane_claw_look"
desc = "Script call of the claw holding a doll: its sprite group pointer from 3B:B8C5 / 3B:B8C7 / 3B:B8C9 at the target doll's variable 4 (its look)."

[[sym]]
at = "3B:B8E1"
name = "crane_tick_doll_home"
desc = "Tick routine of a held doll carried to the left: when the claw's variable 0 is set and the doll is at X $68 or more it may drop (a random test, never ran); then when crane_home_test answers 1 the doll's script goes on at 3B:AE90 (into the chute)."

# ================================================================= the scenes

[[sym]]
at = "36:B69F"
name = "finale_rod_rise"
desc = "Script call of finale_rod: Kirby's height on the screen (Y position - cam_y): below $20 his Y velocity high byte becomes 1, at $A0 or more $FF; in between nothing, and A = the height (the script's jeq tests it)."

[[sym]]
at = "36:BA47"
name = "finale_snap_y"
desc = "Script call before the boss of the last room (36:BA32): Kirby's (slot 1) position Y = his world Y."

[[sym]]
at = "36:BB3E"
name = "finale_sparks"
desc = "Script call of finale_fountain (36:BAA4): eight objects of type 1 by obj_spawn_child_dir with X = 3 to 10."

[[sym]]
at = "36:BF3A"
name = "finale_fade_dark"
desc = "Script call (finale_rod, 36:B8E4): fade_level = $FC (dark), then finale_screen_on."

[[sym]]
at = "36:BF3F"
name = "finale_screen_on"
desc = "Script call (and the end of finale_fade_dark): ppumask bits 1-2 set (the left column shows background and sprites), scroll_mode = 1, mirror_horiz."

[[sym]]
at = "2E:A0AB"
name = "story_fade_sprite"
desc = "First half of story_fade_step: palette_load of two colours at entry 6 from story_fade_lo / _hi [variable 8]; variable 8 + 1 when variable 7 is 1, - 1 when 0."

[[sym]]
at = "2E:A0E0"
kind = "part"
name = "story_fade_pics"
desc = "Second half of story_fade_step (jumped to): two palette_loads of four colours (entries $1C and $18) from 2E:A188 / 2E:A150 plus the offsets of 2E:A128 / 2E:A13C at 4 * variable 4 + variable 6; variable 6 + 1 when variable 7 is 1, - 1 when 0."

[[sym]]
at = "34:AC93"
name = "lvcard_chr0_82"
desc = "Script call of world 0's card (third figure, 34:A08E): chr_bank 0 = $82."

[[sym]]
at = "34:ACAB"
name = "lvcard_chr0_94"
desc = "Script call of a card figure (34:A3F7): chr_bank 0 = $94."

[[sym]]
at = "34:ACB1"
name = "lvcard_chr1_b4"
desc = "Script call of a card figure (34:A431): chr_bank 1 = $B4."

[[sym]]
at = "3D:BC1D"
kind = "label"
name = "fsel_text_queue"
desc = "The end of fsel_text: $07DE = 3 (mode 3: rows from an address), $07DF/$07E0 = nt_addr of X, Y, and ppu_record of the record $07DE."

[[sym]]
at = "3D:B6AE"
kind = "label"
name = "fsel_file_empty"
desc = "In fsel_file_info, an empty file: save_world = $0B, then fsel_text of the text 3D:B6DC[save_world] at column $0E, row 6, size 2."

[[sym]]
at = "3D:AF4F"
kind = "label"
name = "fsel_restate"
desc = "The exit of fsel_tick (and of fsel_menu's choices): the scene object's script becomes fsel_state (3D:AF1E), which runs the state in variable 9."

[[sym]]
at = "3D:BEE5"
kind = "label"
name = "continue_hub_sync"
desc = "The end of continue_setup: copies stages_done, $0529-$0530 and stages_clear (8 bytes each) to hub_shown_done, hub_shown_29 and hub_shown_clear, so the hub shows no new marks after a continue."

[[sym]]
at = "3D:A80B"
kind = "label"
name = "intro_tick_end"
desc = "The last tick of the drawing intro: intro_skip, then it falls into intro_scroll."

# ================================================================= claims: Quick Draw

[[model]]
name = "leftovers_cam24"
code = '''
def cam_add(frac, lo, hi, vlo, vhi):
    v = vlo | vhi << 8
    v24 = v | (0xFF0000 if v & 0x8000 else 0)
    s = (frac | lo << 8 | hi << 16) + v24
    return s & 0xFFFFFF, s > 0xFFFFFF
'''

