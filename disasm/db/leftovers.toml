[[model]]
name = "leftovers_bounce"
code = '''
def neg16(v):
    return (-v) & 0xFFFF

def bounce(vx, vy):
    vx = neg16(vx)
    hi, lo = vx >> 8, vx & 0xFF
    c = hi & 1
    hi >>= 1
    lo = ((lo << 1) | c) & 0xFF
    if hi == 0 and lo < 0x80:
        lo += 0x80
    vx = neg16(hi << 8 | lo)
    vy = neg16((vy >> 8) >> 1 << 8 | (vy & 0xFF) >> 1)
    return vx, vy

def v16(m, a, X):
    return m(a + X) | m(a + 0x12 + X) << 8
'''

