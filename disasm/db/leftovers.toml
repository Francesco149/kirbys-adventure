[[claim]]
id = "leftovers.fsel.text_queue"
about = ["fsel_text_queue"]
text = "Every call of fsel_text runs fsel_text_queue once: $07DE = 3, $07DF/$07E0 = the name table address of column $00, row $01 (low byte (row * 32 + column % 32) & $FF, high byte $20 + row / 8), and ppu_record runs."
kind = "call"
fn = "fsel_text"
on = ["main@60+100", "w12-sonnet@740+300"]
min_calls = 20
expect = "ran('3D:BC1D') == 1 and wr[0x7DE] == 3 and wr[0x7DF] == (rd[0x01] * 32 + (rd[0x00] & 31)) & 0xFF and wr[0x7E0] == 0x20 + rd[0x01] // 8 and ran('3E:C0DA') == 1"

