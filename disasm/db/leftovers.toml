[[claim]]
id = "leftovers.qd.fx_tick"
about = ["qd_fx_tick", "qd_fx_speed"]
text = "qd_fx_tick: with the step length L from 3C:AFCD (slot 10) or 3C:AFD4 at variable 3: variable 4 = L gives variable 4 = 0, the X velocity of 3C:B021 / 3C:B02D at the step (negated when variable 2 is not 1) and variable 3 + 1 (qd_fx_speed); L = $FF frees the object (3C:AFC6); otherwise variable 4 + 1. All three paths occur."
kind = "call"
fn = "qd_fx_tick"
on = ["cov-minigame-quickdraw@39940+300", "cov-minigame-quickdraw-lose@40020+60"]
min_calls = 100
model = '''
def fx_tick(X, v2, v3, v4):
    lim = ([0, 4, 4, 4, 4, 4, 0xFF] if X == 10 else [0, 4, 4, 4, 4, 0xFF])[v3]
    if lim == v4:
        vx = ([0x800, 0x400, 0, 0xFC00, 0xF800, 0] if X == 10 else [0x800, 0x400, 0xFC00, 0xF800, 0])[v3]
        if v2 != 1:
            vx = (-vx) & 0xFFFF
        return 'step', vx
    if lim == 0xFF:
        return 'free', None
    return 'wait', None

def fx_tick_ok(X, rd, wr, mem, ran):
    kind, vx = fx_tick(X, rd.get(0x61EE + X), rd[0x6200 + X], rd[0x6212 + X])
    if kind == 'step':
        return (wr[0x6212 + X] == 0 and (mem(0x60E0 + X) | mem(0x60F2 + X) << 8) == vx
                and wr[0x6200 + X] == rd[0x6200 + X] + 1 and ran('3C:AFDA') == 1)
    if kind == 'free':
        return ran('3C:AFC6') == 1
    return wr[0x6212 + X] == rd[0x6212 + X] + 1 and ran('3C:AFDA') == 0
'''
expect = "fx_tick_ok(rd[0x6E], rd, wr, mem, ran)"
cases = { "ran('3C:AFDA') == 1" = 20, "ran('3C:AFC6') == 1" = 3, "ran('3C:AFC9') == 1" = 50 }

