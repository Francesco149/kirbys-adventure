[[claim]]
id = "scenes2.lvcard.draw"
about = ["lvcard_draw", "lvcard_chr1", "lvcard_chr3", "lvcard_chr4", "lvcard_recs", "lvcard_mask", "card_world", "lvcard_done"]
text = "lvcard_draw writes split_mode, $051E, scroll_x, scroll_y and lvcard_done = 0, fade_level 4, the six CHR banks of lvcard_model for card_world, reads the world's packed_34_lo / _hi entry, and calls mirror_vert only for world 7; the windows hold the cards of worlds 0 to 7."
kind = "call"
fn = "lvcard_draw"
on = ["main@110+30", "main@11410+50", "main@27530+50", "main@42590+50", "main@61525+50", "main@82510+50", "main@107480+50", "main@130260+50"]
min_calls = 8
model = '''
CHR1 = [0xB6, 0xB4, 0xEE, 0xB8, 0xB6, 0xB6, 0xB8, 0xE4]
CHR3 = [0x0A, 0x18, 0x73, 0x01, 0x12, 0x0B, 0x1B, 0xE3]
CHR4 = [0xBC, 0xBC, 0xBD, 0xBD, 0xBD, 0xBE, 0xBE]
def chr_of(w):
    if w == 7:
        return [0x86, CHR1[w], 0xC0, CHR3[w], 0xBF, 0x7A]
    return [0x84, CHR1[w], 0x00, CHR3[w], CHR4[w], 0xC0]
'''
expect = "(w := rd[0x557]) is not None and [wr.get(0x42 + i) for i in range(6)] == chr_of(w) and wr[0x180] == 0 and wr[0x51E] == 0 and wr[0xEB] == 0 and wr[0xEA] == 0 and wr[0x7D5] == 0 and wr[0x1A2] == 4 and O('packed_34_lo') + w in romrd and O('packed_34_hi') + w in romrd and ('mirror_vert' in calls) == (w == 7)"
cases = { "rd[0x557] == 0" = 1, "rd[0x557] == 7" = 1, "rd[0x557] == 3" = 1 }

