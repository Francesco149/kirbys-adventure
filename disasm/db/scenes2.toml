expect = "[u8(O('lvcard_chr1') + i) for i in range(8)] == [0xB6, 0xB4, 0xEE, 0xB8, 0xB6, 0xB6, 0xB8, 0xE4] and [u8(O('lvcard_chr3') + i) for i in range(8)] == [0x0A, 0x18, 0x73, 0x01, 0x12, 0x0B, 0x1B, 0xE3] and [u8(O('lvcard_chr4') + i) for i in range(7)] == [0xBC, 0xBC, 0xBD, 0xBD, 0xBD, 0xBE, 0xBE] and [u8(O('lvcard_songs') + i) for i in range(7)] == [0, 0x28, 0x32, 0x20, 0x1E, 0x2A, 0x1B] and all(u8(O('lvcard_pal_lo') + w) | u8(O('lvcard_pal_hi') + w) << 8 == 0xBD08 + 0x20 * w and u8(O('lvcard_pal_n') + w) == 0 for w in range(8))"

