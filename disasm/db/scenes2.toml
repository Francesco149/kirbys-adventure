desc = """How many more times each help screen is shown, two bits per screen: bits 0-1 the screen of door kind 9 (the
arena), bits 2-3 kind $D (never shown in the corpus), bits 4-5 kind 8 (the museum). game_state_init sets $15 (each once); help_screen subtracts
1 in the screen's field when it shows it."""

[[sym]]
at = "2E:A98B"
name = "help_screen"
desc = """Far-called by the room loader (13:8319) on every room load. With $F5 = 2 (extra_notice) and $F7 = 0 it shows screen 3, the EXTRA GAME notice, and clears $F5 (cov5-f-del@237018; $F7 not 0 never ran).
Otherwise the low nibble of door_kind picks the screen: 9 -> 0 (ARENA), $D -> 1 (never ran), 8 -> 2 (MUSEUM); any other kind,
or a screen whose field in help_left (help_masks) is 0, returns at once. Else help_left - help_steps[n]; the palette
(palette_base) is kept at $0129-$0148, the display turned off, help_draw, sprite_bufs_hide, camera at 0, split_mode 0,
$051E 0, display_on, help_fade_in; then frames (frame_wait, joypad_edges) until a button is held; help_fade_out,
split_mode + 1, display off, the palette back, chr_bank+2 = 0."""

