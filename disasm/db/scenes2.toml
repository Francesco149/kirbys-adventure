code = '''
SX = [0x08, 0xF8, 0x08, 0xF8, 0x80, 0x80, 0x06, 0xFA]
SY = [0x00, 0x00, 0xEF, 0xEF, 0x00, 0xEF, 0x78, 0x78]
FLY = [0x14, 0x14, 0x14, 0x14, 0x0F, 0x0F, 0x0F, 0x0F]
VXI = [0x0600, 0xFA00, 0x0600, 0xFA00, 0x0000, 0x0000, 0x0800, 0xF800]
VYI = [0x0600, 0x0600, 0xFA00, 0xFA00, 0x0800, 0xF800, 0x0000, 0x0000]
VXO = [0x0300, 0xFD00, 0x0300, 0xFD00, 0x0000, 0x0000, 0x0400, 0xFC00]
VYO = [0x0300, 0x0300, 0xFD00, 0xFD00, 0x0400, 0xFC00, 0x0000, 0x0000]
WIN = [0x11, 0x10, 0x0F, 0x0E, 0x13, 0x12, 0x11, 0x10]
WOUT = [7, 6, 5, 4, 3, 2, 1, 0]
def vel(wr, x):
    return (wr[0x60E0 + x] | wr[0x60F2 + x] << 8, wr[0x6104 + x] | wr[0x6116 + x] << 8)
'''

