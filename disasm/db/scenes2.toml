after each; then a star (sprite_map 37:967D, poses 3-10 turned by the thread title_kirby_spin) flies in from ($7F,
$100) along fixed velocities, and Kirby on it (sprite_map 37:969B) jumps up to ($7F, $17A) in six frames."""

[[script]]
at = "36:AB1E"
name = "title_kirby_idle"
desc = """Tick title_timeout (unit attract); every $D0 frames (208) title_idle_pick and a call_table of three
little animations (36:AB3B, 36:AB42, 36:AB49; index 3 calls none), then Kirby back at ($7F, $17A), pose 0."""

