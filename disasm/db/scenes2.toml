[[claim]]
id = "scenes2.help.model"
about = ["help_screen", "help_left", "help_masks", "help_steps"]
text = "help_screen returns at once, writing nothing but $09, unless door_kind & $F is 9, $D or 8 and the screen's field of help_left is not 0; then it subtracts help_steps[n] from help_left and calls help_draw. The windows hold the first visit of the arena (kind 9) and of the museum (kind 8) and ordinary rooms."
kind = "call"
fn = "help_screen"
on = ["main@200+3000", "cov-minigame-museum@8170+400", "cov-minigame-arena@26680+400", "w12-opus@300+3000"]
min_calls = 10
model = '''
def help_ok(rd, wr, calls):
    k = rd[0x56C] & 0xF
    n = {9: 0, 0xD: 1, 8: 2}.get(k)
    if n is None:
        return not wr
    m = (3, 0xC, 0x30)[n]
    if not rd[0xF6] & m:
        return set(wr) <= {0x09}
    return wr[0xF6] == rd[0xF6] - (1, 4, 0x10)[n] and wr[0x09] == n and 'help_draw' in calls and wr[0x180] & 0x7F == 1
'''
expect = "help_ok(rd, wr, calls)"
cases = { "rd[0x56C] & 0xF == 9" = 1, "rd[0x56C] & 0xF == 8" = 1 }

