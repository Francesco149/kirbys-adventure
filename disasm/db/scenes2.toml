/ _hi [n] expanded to $74C8 and sent with help_rec (32 x 32 tiles to $2000); CHR banks 2-5 = $FF, $DB, $62, $63 (for
n = 3: 5, $DB, $80, $81: the EXTRA GAME notice, cov5-f-del@237022)."""

