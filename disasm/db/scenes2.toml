unit = "scenes2"
title = "The scenes, second half: the level card, the title's stars, the story pages, the help screens, the last scenes of world 7"
summary = """
The scenes that unit scenes left: the level card before a world (type $6C, bank 34, with world 7's card in bank 36), the
title's Kirby and its stars (type $69, variable 0 = 2-4), the story pages after the demo (type $6A, bank 36 with
bank 2E), the help screens of the arena and the museum (bank 2E, a far call of the room loader), and the last scenes
of world 7 (the climb after the Star Rod, the room of the last fight, the start of the ending: Kirby's object, type 1,
running scripts of banks 36 and 2E).

The level card: lvcard_start (unit scenes) picks the world's animation by card_world ($0557); worlds 0-6 share the
manager lvcard_main: lvcard_open (silence, lvcard_draw: CHR banks, the picture packed_34_lo / _hi [w], the palette, music
by lvcard_songs, a fade-in thread), the first figure (which creates the others: Kirby and friends hopping, jumping),
and lvcard_wait: every frame lvcard_pad (A, B or Start) or lvcard_done ($07D5, set at the end of the animations of
worlds 1-3) ends the card with four fade_up steps. World 7's card (lvcard_w7, a far jump table into bank 36) ends at
once when world 7 is already beaten (w7card_beaten) and otherwise by the same button or lvcard_done (w7card_tick); its
planet and stars blink by a CHR bank (w7card_chr_step).

The title's Kirby (title_part2 -> title_kirby, slot 3): eight stars of part 3 fly in from the edges together
(title_star_delay: one per frame, each waiting the rest; title_star_place: position, velocity and length of flight from
tables), then Kirby on his star flies in and stands; every 208 frames title_idle_pick chooses one of three little
animations or none (random, 1/2 after none, 1/4 after one). When title_timeout (unit attract) ends the title,
title_stars_out sends eight stars of part 4 away (title_star_away) before a demo, title_fade_end only fades before the
story. After the story ($07F3 = 1) Kirby stands at once.

The story (story_main, story_pages): story_draw shows the frame of the page and the first text; Kirby on his star
(story_kirby) flies loops, eight stars (story_star) drift down to the left and wrap around (story_star_wrap); five
pages of 508 frames each: a picture (an object of type $6A, part 3, story_pic_spawn from story_pics), the text box and
the picture fade (story_fade_step), the next text is written one row per frame by story_writer while the camera shows
the other name table. A or Start (story_skip) ends it.

The help screens (help_screen, every room load): a door of kind 9 (ARENA), $D or 8 (MUSEUM) shows its screen as long as
its two-bit field of help_left ($F6, $15 at a new game: once each) is not 0: the palette is kept, help_draw puts the
screen's palette, picture and CHR banks, and the game waits for any button.

The last scenes: e06_rod (unit en23) sends Kirby to finale_rod; finale_climb marks world 7 beaten, the camera climbs
(finale_rise slows it near the top), finale_top sets kirby_start_mode = 4 and finale_leave goes to room $10. There
kirby_s_start goes on in finale_start: finale_main, the camera (finale_cam), a figure that climbs at half the camera's
speed (finale_fountain, finale_ride), palette steps (finale_pal_step), and at last the boss of type $4E. After it
(kirby_start_mode 1) the ending room starts with ending_main and a second object (ending_spawn); main ends there.

Also here: two ticks of the drawing intro (intro_wait_bucket, intro_wait_gone) and two of the game over
(gameover_tick_hurry, gameover_free_zzz) that unit scenes left.

Open:
- The level card: the figures' choreographies of worlds 1-6 are named by their dispatchers only (34:A1DE-34:A39C,
  34:A3AB-34:A598, 34:A5A9-34:A6FC, 34:A707-34:A7FE, 34:A80B-34:A929, 34:A93E-34:AA9E); 34:AC93, 34:ACAB, 34:ACB1 (chr
  bank setters) unnamed; world 0's third figure (34:A06F, 34:A17F) ran only on cov-gameover's continue; the five last
  entries of world 6's table (34:AA08-34:AA9E: the notes, when the card plays to its end) first ran in cov5-f-del@152847
  (unit cov5_tour: lvcard_w6_kirby, lvcard_w6_notes); the $F4 = 2 exit of lvcard_start never ran. Why world 0's card
  waits for a button (no lvcard_done) is not known.
- World 7's card: what follows w7card_kirby's three steps ran in cov4-d-w7 up to 36:A0E8, and its parts 3, $0B and
  $0C (Dedede falling in, the redraw of the screen, the dust) are described by unit scn_cov4 (w7card_dedede,
  w7card_redraw, w7card_dust_16). The rest (w7card_kirby from 36:A0EA on, the parts 4, 5 and
  $0D, the scripts of w7card_part_tick 36:A6A0 / 36:A6CC) ran in cov9-a-w7card, the scene played without a button
  into the last fight (unit cov9: w7card_kirby_rest and the rest); part $0E (36:A5D0) never ran; 36:A049 fade thread and 36:A23D described from the listing.
- The title: the animation 36:AB49 (index 2 of the call_table) never ran; part 1 of the title (3D:AAAD) never ran.
- The story: Kirby's loops (story_kirby) are a list of velocities, not described one by one; the tables of
  story_fade_step at 2E:A0E0-2E:A14F are not named.
- The help screens: screen 1 (door kind $D) never ran; screen 3 (extra_notice $F5 = 2 with $F7 = 0, CHR banks 5 $DB
  $80 $81: the EXTRA GAME notice) first ran in cov5-f-del@237018 (unit cov5_tour); what $F7 means is not known. What door kind 8 and 9 rooms are beyond these two screens is unit rooms'.
- The last scenes: the parts of finale_start's table 1-$0C and $10 (36:BEEB, 36:BC59-36:BEA5, 36:BBD1-36:BC58, 36:B7D7,
  36:B7E1), finale_rod's other branch (36:B66B, first in cov6-j-x@384031, the Extra Game) and the tick 23:A49A, 36:BF3A / 36:BF3F, 36:BB3E, 36:BA47 and the
  code after the boss appears (36:BF79) are not described; 22:8FD2 (the sky's background palette by cam_y) and 22:9009
  are used by address. The ending: main holds its first 170 frames (it ends at 137712); the rest, the credits and THE END are in the coverage movie cov2-save-finished and in unit scenes3; 2E:B0A3-2E:B313,
  the parts 1-6 of ending_start and kirby_start_mode 2, 3 and 5 (2E:B4F1, 2E:B8E8, 36:BF60) never ran: the credits are
  not in the corpus.
- Bank 3D's remaining chunks (3D:BC1D, 3D:B6AE, 3D:AF4F, 3D:BEE5, 3D:A80B) are tails and entries inside unit scenes'
  routines (fsel_text, fsel_file_info, fsel_tick, continue_setup, intro_main's last tick); they are not named here so as
  not to split those routines. Bank 3C is the minigames' (unit minigame) and was not taken.
"""

# ================================================================= shared model

[[model]]
name = "scenes2_model"
code = '''
def thread_to(wr, addr, bank):
    """The threads (0-31) whose script obj_set_script / a jump set to bank:addr in this call."""
    return [t for t in range(32) if wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == bank]
'''

# ================================================================= the level card (type $6C), bank 34

[[ram]]
at = "0557"
name = "card_world"
desc = """The world whose level card game_begin shows (0-7): game_state_init sets 0, leave_tail (unit frame) the next world
after a boss, continue_setup the world a continue goes on in. lvcard_start picks the card's animation with it,
lvcard_draw its CHR banks, picture and palette, lvcard_music its song; the dances after a boss (unit en19) read it
too."""

[[ram]]
at = "07D5"
name = "lvcard_done"
desc = """1 when the animation of a level card is over: lvcard_draw clears it, a set_mem8 at the end of the animations of
worlds 1, 2, 3 and 5 (34:A24D, 34:A44D, 34:A697; 34:A8A1, once, cov6-j-x@325954) sets it, and lvcard_wait then ends the card as a button would. World 7's
card (w7card_tick) reads it too."""

[[script]]
at = "34:A023"
name = "lvcard_w0"
desc = """The card of world 0 (and of every new game): a jump table on variable 1: 0 lvcard_main, 1 lvcard_w0_kirby, 2
lvcard_w0_friend, 3 34:A17F (a third figure, only on a continue's card: cov-gameover@7834)."""

[[script]]
at = "34:A02F"
name = "lvcard_main"
desc = """Part 0 of every world's card but the last: every other object freed (3E:DF0D), lvcard_open, one frame, an object
of type $6C with variable 1 = 1 (3E:DE51: the first figure, which creates the others), 60 frames, then lvcard_wait."""

[[script]]
at = "34:AAF6"
name = "lvcard_open"
desc = """Script subroutine: music $17 (3E:DE45; silence while the card is drawn), lvcard_draw (two frames), a thread that
fades in (lvcard_fade_in), camera at 0 (set_dd / set_e0), 16 frames, lvcard_music."""

[[script]]
at = "34:AB0C"
name = "lvcard_fade_in"
desc = "Thread of lvcard_open: fade_level = 4, then four fade_down steps four frames apart, and the thread ends."

[[script]]
at = "34:AB17"
name = "lvcard_wait"
desc = """The card's manager waits: every frame lvcard_pad; a button (A, B or Start) or lvcard_done set ends the card:
every other object freed, four fade_up steps four frames apart, and the object ends; scene_run returns to
game_begin_2 (unit frame)."""

[[sym]]
at = "34:ACCB"
name = "lvcard_pad"
desc = "Script call: A = joypad_new & $D0 (A, B or Start newly pressed; the script's jne ends the card)."
out = "A = the newly pressed A, B and Start bits"

[[sym]]
at = "34:AB75"
name = "lvcard_draw"
desc = """Draws the card of card_world (w): $051E, the mapper's mirroring register and split_mode = 0, one frame
(frame_wait); CHR banks: for w = 7 $86, lvcard_chr1[w], $C0, lvcard_chr3[w], $BF, $7A; otherwise $84, lvcard_chr1[w],
0, lvcard_chr3[w], lvcard_chr4[w], $C0. The picture: packed_34_lo / _hi [w] expanded to room_map ($68C8) and sent with
the first record of lvcard_recs (for w = 7 also mirror_vert and the second record); fade_level 4, lvcard_mask,
lvcard_palette, scroll_x = scroll_y = 0, lvcard_done = 0, display_on."""

[[data]]
at = "34:AC10"
len = 8
name = "lvcard_chr1"
format = "bytes"
desc = "CHR bank 1 (chr_bank+1) of each world's card."

[[data]]
at = "34:AC18"
len = 8
name = "lvcard_chr3"
format = "bytes"
desc = "CHR bank 3 (chr_bank+3) of each world's card."

[[data]]
at = "34:AC20"
len = 8
name = "lvcard_chr4"
format = "bytes"
desc = "CHR bank 4 (chr_bank+4) of the cards of worlds 0-6 (entry 7 is not read: world 7 uses $BF)."

[[data]]
at = "34:AC38"
len = 14
name = "lvcard_recs"
format = "bytes"
desc = "Two PPU records (ppu_record_inline): the expanded picture from $68C8 to name table $2000 (32 x 32 tiles), and for world 7 from $6CC8 to $2400."

[[sym]]
at = "34:AC46"
name = "lvcard_palette"
desc = "palette_load of the 32 entries (Y = $20, from entry lvcard_pal_n[w] = 0) at lvcard_pal_lo / _hi [card_world]."

[[data]]
at = "34:AC5B"
len = 8
name = "lvcard_pal_lo"
format = "bytes"
desc = "Low bytes of the cards' palettes ($BD08 + $20 per world: 34:BD08-34:BE07)."

[[data]]
at = "34:AC63"
len = 8
name = "lvcard_pal_hi"
format = "bytes"
desc = "High bytes of the cards' palettes (all $BD)."

[[data]]
at = "34:AC6B"
len = 8
name = "lvcard_pal_n"
format = "bytes"
desc = "The first palette entry palette_load writes, per world (all 0)."

[[sym]]
at = "34:AC73"
name = "lvcard_mask"
desc = "ppumask |= 6: the left eight pixels of background and sprites are shown."

[[sym]]
at = "34:AC7C"
name = "lvcard_music"
desc = "Script call: snd_music with lvcard_songs[card_world] (the world's card song)."

[[data]]
