desc = """The title's Kirby: variable 0 = 0, variable 9 = 2 (the bound of title_idle_pick). With $07F3 set (the title
shown again after the story) $07F3 = 0 and Kirby stands at once at ($7F, $17A) (sprite_map 37:969B, pose 0) and goes
to title_kirby_idle; otherwise title_kirby_intro."""

