[[script]]
at = "36:ACA2"
name = "story_main"
desc = """Part 0 of the story: every other object freed, story_draw, Kirby on his star (part 1, story_kirby), eight
stars (part 2, story_star; variable 7 counted 0-7), the palette from 36:B5E1 (3E:DF61), then story_pages."""

[[script]]
at = "36:ACCB"
name = "story_pages"
desc = """Camera at 0; variables 0, 3, 4 = 0; the picture of page 0 (story_pic_spawn through 2E:A000); four fade_down
steps; the tick story_skip; 508 frames. Then four times: variable 9 = the next text, story_fade_out (the picture and
the text box fade out, the picture freed), the camera at the other name table (set_e0 0 / $100), a thread that
writes the page (story_writer), story_fade_in (variable 4 + 1: the next picture, fading in), 508 frames. The second
page loads the rest of the texts first (story_more). At the end title_long_wait = 1 and $07F3 = 1 (the title next
skips its intro), four fade_up steps, every other object freed, and the object ends."""

[[script]]
