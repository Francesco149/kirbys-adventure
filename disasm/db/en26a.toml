unit = "en26a"
title = "Object types $38 (the winged flyer, six flight patterns) and $39 (the spiked ball, four paths)"
summary = """
Two enemies of bank 26, with everything between 26:A7E9 and 26:B242: scripts, the 6502 routines the scripts install
as tick routines or call, and their tables.

Type $38 is Bronto Burt: a pink ball with two small wings (main@662, in the air at the right). The kinds $50-$5B of
the rooms' object lists create it; the kind gives variable 0 = the flight pattern 0-5 and variable 1 = a speed class
0 or 1. e38_start keeps the class in obj_param, sets the pose table 30:9C24 (pose 0 / 1 = one wing pose, facing right /
left; 2 / 3 = the other) and e38_setup moves the pattern to variable 2, gives 2 hit points (variable 0), faces Kirby
and jumps by the pattern. Type $1E (26:A3C9) jumps into e38_setup too when its variable 0 is below 6: the same life
with the pose table 32:889F. Every tick routine begins with the hit test for the record 39:8FE4 (box 8 x 8, hurts
Kirby, can be inhaled; hit points gone = script 22:8100). The patterns:
0 e38_wave: flies ahead at e38_fly_speeds[class] (0.75 or 1 pixel per frame) in a wave: every 40 frames
  e38_tick_wave gives it the Y velocity 2.54 down or up and an acceleration of 25/256 against it (e38_turn_*). After
  the turns counted in variable 4 it stops turning and the acceleration upward carries it away.
1 e38_seek: the same flight with 1.93 and 19/256, without an end; halfway through each half wave e38_tick_seek
  compares its height with Kirby's and, 32 pixels or more apart, changes the acceleration so the wave drifts to him.
2 e38_drop: appears at the top of the screen at one of four X (e38_drop_xs, random), falls (e38_tick_drop) until the
  low byte of its Y distance to Kirby is below 16, flies an arc (e38_swoop: back and down, then forward and up) and
  goes on as pattern 1.
3 e38_bounce: flies along a diagonal toward Kirby's quarter at e38_bounce_speeds[class] (1 or 1.5) and is thrown
  back by floors, ceilings and walls: e38_tick_bounce looks the new direction up in e38_bounce_dirs by what
  obj_collide_any0 hit and the old direction, e38_bounce_go makes the velocities and e38_bounce_shape gives them a
  slope of 1:1, 1:2 or 2:1. It flaps twice as fast for 20 frames after a bounce.
4 e38_home: follows Kirby. Every 8 frames e38_tick_home takes the direction to Kirby in eighths of a turn and moves
  both velocities one step (e38_home_accel) toward it, up to e38_home_limit (1 or 1.5). After 6 x 64 frames it gives
  up (e38_leave): it turns away and rises out of the screen.
5 e38_sit: sits on the ground (in the second wing pose). e38_tick_sit lets it take off when there is no floor under it, when
  Kirby is less than 64 pixels away in X, or when he is less than 8 away in Y and the B button is held. It rises
  (3, 2, 1, 0.5 pixels per frame), hangs for 32 frames, faces Kirby and flies at him at 1, 2, then 3 pixels per frame.

Its variables: 0 hit points; 1 obj_dir; 2 the pattern; 3 the class as created, in pattern 3 the fast-flap flag;
4 the turns left (pattern 0), the 64-frame periods (pattern 4), the frames of fast flapping (pattern 3); 5 the
frames to the next turn (patterns 0, 1), the frame counter (pattern 4), 0 = waiting / 1 = released (patterns 2, 5);
6 the half wave 0 / 1 (patterns 0, 1: 0 = accelerating upward, which the script shows by flapping) or the vertical
steering 0 up / 1 none / 2 down / 3 leaving (pattern 4); 8 / 9 the Y acceleration of obj_vy_accel.

Type $39 is Gordo: a black ball with spikes all around and two eyes (main@3000 at the right edge, main@25100 two of
them). Kinds $70-$75; variable 0 = the path 0-3, variable 1 = a speed class. Its record 39:8FFC (box 6 x 6, flag
$80, hurts Kirby) has no reaction at all: nothing Kirby does changes it. e39_start gives it the animation
e39_anim_tab (obj_anim: the four poses of 30:9C50 for 2 to 8 frames each), and by the path: 0 e39_hover (bobs a few
pixels up and down in place), 1 e39_rise (moves up and down at e39_rise_speeds[class], 0.75 or 1, e39_tick_rise
reverses it at a floor or ceiling, the script sways it sideways), 2 e39_cross (moves sideways at
e39_cross_speeds[class], e39_tick_cross reverses it at a wall, the script bobs it), 3 e39_patrol (128 frames up, 16
still, 128 down, 16 still: 88 pixels each way). Its variables: 0 = 2 and 5 = $FF, 6 = 1 are set and nothing
in the unit reads them; 2 the path; 8 / 9 the animation's timer and entry.

Nothing else is in the region: every byte from 26:A7E9 to 26:B242 belongs to these two types.

Open:
- Never ran: the branches of e38_sit_wait (26:A84C) and e38_drop_wait (26:A9BF) for variable 2 = 0, which no
  pattern that reaches them has, with the bytes behind them (26:A85C-A888, 26:A9C2-AA21); the jump at 26:A8D7;
  e38_drop_place for Kirby in the top 32 pixels of the screen (26:AC2D: it would appear above him); in
  e38_tick_seek an object below Kirby with a downward acceleration (26:ACB8); in e38_tick_wave the extra turn of an
  object that began in the lower half (26:AD1D); e38_tick_home entered with variable 6 = 3 (26:AB3F); of
  e38_bounce_shape the entries 0, 3, 4, 5, 7, 8, 9, 11, 12, 13 (the code at 26:AF83, AF8C, AFA1, AFA7, AFAD, AFB0,
  AFBC, AFC2) and e38_vel_steep for |X| >= |Y| (26:B052); the last word of e38_bounce_speeds and the classes 2 and 3
  of the e38_home tables; most of e38_bounce_dirs (9 of 416 entries were read); the end of e39_patrol's loop
  (26:B0D7).
- What 22:9463 / 3F:E012 (the direction to Kirby in e38_tick_home) and obj_vel_polar / 3F:E0F3 (the velocities of
  e38_bounce_go before e38_bounce_shape) compute exactly: the claims check the eighth, the signs and the slopes only.
- What frees these objects when they leave the screen (the position routine 3E:D9BB, by its name in the script) and
  the scripts a hit starts (22:8003 inhaled, 22:8100 hit points gone, 19:B2A0, 16:A9CE) are not in this unit.
- Type $1E's own scripts (26:A3C9-A7E8) apart from its jump into e38_setup.
- The pose tables 30:9C24 and 30:9C50 are still pose_tab_30_9C24 / pose_tab_30_9C50 in unit sprites.
"""

# ------------------------------------------------------------------ scripts, type $38

[[script]]
at = "26:A7E9"
name = "e38_start"
desc = """
First script of object type $38 (Bronto Burt; kinds $50-$5B). Bank 22 at $8000, the position routine 3E:D9BB,
obj_param_set (obj_param = variable 1 as created: the speed class 0 / 1), the pose table 30:9C24, then e38_setup.
"""

[[script]]
at = "26:A7F5"
name = "e38_setup"
desc = """
Common to type $38 and to type $1E with variable 0 below 6 (the jeq at 26:A3D8, after that type's own pose table).
Variable 2 = variable 0 (the pattern), variable 3 = variable 1, variable 0 = 2 (hit points), obj_face_kirby, then by
the pattern: 0 e38_wave, 1 e38_seek, 2 e38_drop, 3 e38_bounce, 4 e38_home, 5 e38_sit.
"""

[[script]]
at = "26:A813"
name = "e38_sit"
desc = "Pattern 5. Tick routine e38_tick_sit, variable 5 = 0, faces Kirby, the second wing pose (2 / 3), then e38_sit_wait."

[[script]]
at = "26:A822"
name = "e38_sit_wait"
desc = """
Waits frame by frame until e38_tick_sit sets variable 5, then the take-off: Y velocity -3 for 4 frames, -2 for 4,
4 more, -1 for 8, 8 more, -0.5 for 8, then +0.5, the wings changing between the steps; variable 2 is the pattern (5),
so the jne at 26:A849 always goes to e38_sit_dash.
"""

[[script]]
at = "26:A889"
name = "e38_sit_dash"
desc = """
After the take-off: 32 more frames sinking at 0.5, then velocity 0, obj_face_kirby, and the X velocity toward Kirby
(3F:E26A: the word after the instruction, negated when obj_dir has bit 7 set) 1 pixel per frame, 6 frames later 2,
6 frames later 3; then e38_flap.
"""

[[script]]
at = "26:A8B1"
name = "e38_flap"
desc = "The endless end of pattern 5: the two wing poses for 4 frames each while the object flies straight on."

[[script]]
at = "26:A8BA"
name = "e38_home"
desc = """
Pattern 4. Tick routine e38_tick_home, faces Kirby, variables 4 and 5 = 0, variable 6 = 1, then the animation by
variable 6 (e38_home_rise, e38_home_level, e38_home_sink; 3 = e38_leave). Every piece of the animation ends with the
same jump by variable 6.
"""

[[script]]
at = "26:A8D9"
name = "e38_home_rise"
desc = "Pattern 4 while variable 6 is 0 (steering upward): the pose of the direction for 4 frames, then e38_home_rise2."

[[script]]
at = "26:A8E8"
name = "e38_home_rise2"
desc = "The other wing pose for 4 frames, back to e38_home_rise while variable 6 is 0 (e38_tick_home sets the first pose again in every frame of that state)."

[[script]]
at = "26:A8F6"
name = "e38_home_level"
desc = "Pattern 4 while variable 6 is 1 (no vertical steering): a slow flap of four pieces of 4 frames, this one the pose of the direction; then e38_home_level2."

[[script]]
at = "26:A905"
name = "e38_home_level2"
desc = "4 frames more of the same pose, then e38_home_level3."

[[script]]
at = "26:A913"
name = "e38_home_level3"
desc = "The other wing pose for 4 frames, then e38_home_level4."

[[script]]
at = "26:A921"
name = "e38_home_level4"
desc = "4 frames more, then e38_home_level again."

[[script]]
at = "26:A92F"
name = "e38_home_sink"
desc = "Pattern 4 while variable 6 is 2 (steering downward): the pose of the direction, held, looked at again every 4 frames."

[[script]]
at = "26:A93E"
name = "e38_leave"
desc = """
Pattern 4 gives up (variable 6 = 3, set by e38_tick_home with an upward acceleration in obj_var8 / obj_var9): faces
Kirby, turns round (22:90BA negates obj_dir), X velocity $0066 forward (3F:E26A), tick routine e38_tick_leave, and
flaps 4 frames a pose for good while it rises away.
"""

[[script]]
at = "26:A95B"
name = "e38_bounce"
desc = """
Pattern 3. Tick routine e38_tick_bounce; obj_dir = the diagonal toward Kirby's quarter (22:917C), e38_bounce_go for
the first velocities; then the flapping: 8 frames a pose while variable 3 is 0, 4 frames a pose while it is not (the
20 frames after a bounce); the loops test variable 3 every frame and change over at once.
"""

[[script]]
at = "26:A9A3"
name = "e38_drop"
desc = "Pattern 2. Tick routine e38_tick_drop, e38_drop_place (to the top of the screen), variable 5 = 0, faces Kirby, then e38_drop_wait."

[[script]]
at = "26:A9B3"
name = "e38_drop_wait"
desc = "Waits frame by frame until e38_tick_drop sets variable 5; variable 2 is the pattern (2), so the jne at 26:A9BC always goes to e38_swoop."

[[script]]
at = "26:AA22"
name = "e38_swoop"
desc = """
The arc of pattern 2, as eleven pairs of velocities set by 22:9340 (two words after the instruction: X, negated when
obj_dir has bit 7 set, and Y), 3 frames apart with the wings changing: (-1, 4), (-2, 3), (-3, 2), (-2, -0.5),
(-1, -1), (-0.5, -2), (1, -3), (1.25, -2), (1.25, -1), (1.25, -0.5), (1.25, 0.5); X is counted along the facing, so
it backs away falling and comes forward rising. 11 frames later it becomes e38_seek.
"""

[[script]]
at = "26:AA83"
name = "e38_seek"
desc = "Pattern 1, and where pattern 2 ends. Tick routine e38_tick_seek, e38_seek_init for the first half wave, then e38_fly."

[[script]]
at = "26:AA8D"
name = "e38_wave"
desc = "Pattern 0. Tick routine e38_tick_wave, e38_wave_init for the first half wave, then e38_fly."

[[script]]
at = "26:AA94"
name = "e38_fly"
desc = "Patterns 0 and 1: X velocity e38_fly_speeds[obj_param] forward (asm_vx_tab), variable 4 = 4 (the turns pattern 0 makes), variable 5 = 40 (frames to the first turn), then e38_fly_loop."

[[script]]
at = "26:AA9F"
name = "e38_fly_loop"
desc = """
The wings of patterns 0 and 1, restarted whenever variable 6 is not 0: the pose of the direction every frame while
variable 6 is 1 (the half wave that accelerates downward: wings held), and 4 frames of it, 4 frames of the other
pose while variable 6 is 0 (accelerating upward: it flaps). The most-run script of the game.
"""

# ------------------------------------------------------------------ scripts, type $39

[[script]]
at = "26:B084"
name = "e39_start"
desc = """
First script of object type $39 (Gordo; kinds $70-$75). Bank 22 at $8000, the position routine 3E:D9BB,
obj_param_set (the speed class), variable 2 = variable 0 (the path), variable 3 = variable 1, variable 0 = 2,
variable 5 = $FF, variable 6 = 1, the animation e39_anim_tab from entry 0 (asm_anim_start), the pose table 30:9C50,
obj_face_kirby, then by the path: 0 e39_hover, 1 e39_rise, 2 e39_cross, 3 e39_patrol.
"""

[[script]]
at = "26:B0B7"
name = "e39_patrol"
desc = "Path 3. Tick routine e39_tick_hover. Y velocity -0.5 for 16 frames, -0.75 for 96, -0.5 for 16, 0 for 16, then the same downward and 16 frames still, and again."

[[script]]
at = "26:B0E2"
name = "e39_cross"
desc = "Path 2. Tick routine e39_tick_cross, X velocity e39_cross_speeds[obj_param] toward the side it faces (asm_vx_tab); then for good the Y velocities -1, -0.5, +0.5, +1 for 2 frames each: a bob of 3 pixels."

[[script]]
at = "26:B0FE"
name = "e39_rise"
desc = "Path 1. Tick routine e39_tick_rise, Y velocity e39_rise_speeds[obj_param] downward (22:8BC0: the word obj_param of the table named after the instruction); then for good the X velocities -1, -0.5, +0.5, +1 for 2 frames each: a sway of 3 pixels."

[[script]]
at = "26:B11A"
name = "e39_hover"
desc = "Path 0. Tick routine e39_tick_hover; for good the Y velocities -0.25, -0.5, +0.5, +0.25 for 8 frames each: it bobs 6 pixels in place."

# ------------------------------------------------------------------ routines, type $38

[[sym]]
at = "26:AADE"
name = "e38_tick_sit"
desc = """
Tick routine of pattern 5. The hit test with the record 39:8FE4. While variable 5 is 0: obj_walk0; no floor under it
= take off. Otherwise obj_dx_kirby: less than 64 pixels = take off. Otherwise obj_dy_kirby: less than 8 pixels and
bit 6 of joypad_held (the B button) set = take off. Taking off is variable 5 + 1 and Y velocity 0; e38_sit_wait does
the rest. With variable 5 not 0 only the hit test runs.
"""

[[sym]]
at = "26:AB24"
name = "e38_tick_leave"
desc = "Tick routine of e38_leave: the hit test with the record 39:8FE4, then obj_vy_accel."

[[sym]]
at = "26:AB2F"
name = "e38_tick_home"
desc = """
Tick routine of pattern 4. The hit test with the record 39:8FE4. Variable 5 + 1; while variable 6 is 0, obj_pose_dir0.
When variable 5 reaches 64 it starts again at 0 and variable 4 + 1; at 6 the object gives up: variable 6 = 3,
obj_var8 / obj_var9 = $FFE7, nothing else. In every frame where variable 5 is a multiple of 8: obj_dir = the
direction to Kirby (22:9463 with Y = 1) rounded to an eighth of a turn, then 22:886F with the four e38_home tables:
by the eighth each velocity moves one step up (to the limit), down (to the negative limit) or toward 0, with the
step and limit of obj_param; variable 6 = 1 + what that did to the Y velocity (+1 raised, -1 lowered, 0 untouched).
"""

[[sym]]
at = "26:ABB9"
name = "e38_tick_bounce"
desc = """
Tick routine of pattern 3. The hit test with the record 39:8FE4. While variable 3 is not 0, variable 4 counts down
and at 0 variable 3 - 1 (the fast flapping ends). obj_collide_any0; when $00 (the number of what was hit, from
obj_hit_codes) is not negative: e38_bounce_dir, and it falls into e38_bounce_go.
"""

[[sym]]
at = "26:ABD9"
name = "e38_bounce_go"
desc = """
The velocities of pattern 3 from obj_dir: obj_vel_polar with the speed e38_bounce_speeds[obj_param], obj_pose_dir0,
e38_bounce_shape; variable 3 = 1 and variable 4 = 20 (flap fast for 20 frames). The script calls it at the start,
e38_tick_bounce falls into it.
"""

[[sym]]
at = "26:AC00"
name = "e38_tick_drop"
desc = """
Tick routine of pattern 2. The hit test with the record 39:8FE4. While variable 5 is 0: obj_gravity_a with $25
(limit 3 pixels per frame), obj_dy_kirby, and variable 5 = 1 when the low byte of the distance is below 16 (the high
byte is not looked at).
"""

[[sym]]
at = "26:AC24"
name = "e38_drop_place"
desc = """
Puts the current object at the top edge of the screen: world and screen Y = cam_y; X = cam_x + a random entry of
e38_drop_xs. (With Kirby less than 32 pixels below the top edge it would take Kirby's X instead; never ran.)
"""

[[sym]]
at = "26:AC81"
name = "e38_tick_seek"
desc = """
Tick routine of pattern 1. The hit test with the record 39:8FE4, obj_vy_accel, variable 5 - 1. At 20 (the middle of a
half wave) obj_dy_kirby; with 32 pixels or more between them the acceleration in obj_var8 / obj_var9 changes: object
above Kirby: $0020 when it was downward, $000D when it was upward; object below Kirby: $FFE0 when it was upward
($FFF3 when downward: never ran). At 0: variable 6 flips, variable 5 = 40, e38_seek_set.
"""

[[sym]]
at = "26:ACF8"
name = "e38_tick_wave"
desc = """
Tick routine of pattern 0. The hit test with the record 39:8FE4, obj_vy_accel. With variable 4 negative nothing more
(it has stopped turning). Otherwise variable 5 - 1 and at 0 a turn: variable 6 flips, variable 4 - 1; while that is
not negative, variable 5 = 40 and the Y velocity and acceleration become entry variable 6 of the e38_turn tables. On
the turn that makes variable 4 negative: variable 6 = 0 and nothing else when the flipped value was 1 (when it was 0
variable 4 would go back to 0 for one more turn: never ran).
"""

[[sym]]
at = "26:AD30"
name = "e38_seek_init"
desc = "For the script of pattern 1: 22:92F3 (Y = 1 when the object is 92 pixels or more below the top of the screen, else 0), then e38_seek_set."

[[sym]]
at = "26:AD33"
name = "e38_seek_set"
desc = "A half wave of pattern 1: Y velocity and obj_var8 / obj_var9 = entry Y + 2 of the e38_turn tables, variable 6 = Y."
in = "Y = 0 (begins downward) or 1 (upward)"

[[sym]]
at = "26:AD3B"
name = "e38_wave_init"
desc = "For the script of pattern 0: 22:92F3 (Y = 1 in the lower part of the screen), then Y velocity and obj_var8 / obj_var9 = entry Y of the e38_turn tables, variable 6 = Y. e38_tick_wave branches into it at 26:AD3E with Y = variable 6."

[[sym]]
at = "26:AD6F"
name = "e38_bounce_dir"
desc = """
obj_dir of the current object = e38_bounce_dirs[16 * $00 + obj_dir / 16]: the direction after hitting what $00
numbers. Nothing when $00 is negative. For $00 below 10 the entry is loaded and a bne skips the code for the other
rows; an entry of 0 (straight up) does not take that branch, runs the other code with A = 0 and ends with the entry
of row 16 in the same column instead (w3-sonnet@55422: 0 was meant, $FF results).
"""
in = "$00 = the number obj_hit_result left (0-$19)"

[[sym]]
at = "26:AF45"
name = "e38_bounce_shape"
desc = "Jumps to entry obj_dir / 16 of e38_shape_tab, which turns the velocities obj_vel_polar made into the ones of the sixteen directions."

[[sym]]
at = "26:AF95"
name = "e38_shape_1"
desc = "Entry 1 of e38_shape_tab: e38_vel_steep, then the Y velocity negated: up, a little right."

[[sym]]
at = "26:AF9B"
name = "e38_shape_2"
desc = "Entry 2: e38_vel_diag, then the Y velocity negated: up and right."

[[sym]]
at = "26:AFAA"
name = "e38_shape_6"
desc = "Entry 6: e38_vel_diag: down and right."

[[sym]]
at = "26:AFB6"
name = "e38_shape_a"
desc = "Entry 10: e38_vel_diag, then the X velocity negated: down and left."

[[sym]]
at = "26:AFCB"
name = "e38_shape_e"
desc = "Entry 14: e38_vel_diag, then both velocities negated: up and left."

[[sym]]
at = "26:AFD4"
name = "e38_shape_f"
desc = "Entry 15: e38_vel_steep, then both velocities negated: up, a little left."

[[sym]]
at = "26:AFDD"
name = "e38_vel_abs"
desc = "$00 / $01 = the absolute value of object X's X velocity, $02 / $03 = that of its Y velocity."
in = "X = object"

[[sym]]
at = "26:B01A"
name = "e38_vel_diag"
desc = "Both velocities of object X = (|X velocity| + |Y velocity|) / 2: a diagonal, to the lower right until the caller negates one."
in = "X = object"

[[sym]]
at = "26:B03F"
name = "e38_vel_steep"
desc = "The larger of |X velocity| and |Y velocity| stays (as a positive number) and the other becomes half of it. Only |Y| larger ever ran."
in = "X = object"

# ------------------------------------------------------------------ routines, type $39

[[sym]]
at = "26:B12D"
name = "e39_tick_cross"
desc = "Tick routine of path 2. The hit test with the record 39:8FFC, e39_anim, obj_collide_any with set 13 of obj_pts; when bit 0 of its answer is set (a wall) obj_vx_neg_cur: it goes back the other way."

[[sym]]
at = "26:B144"
name = "e39_tick_rise"
desc = "Tick routine of path 1. The hit test with the record 39:8FFC, e39_anim, obj_collide_any0; when it landed (carry set) or bit 1 of its answer is set (a ceiling) obj_vy_neg_cur: it goes back the other way."

[[sym]]
at = "26:B15B"
name = "e39_tick_hover"
desc = "Tick routine of paths 0 and 3: the hit test with the record 39:8FFC and e39_anim. The blocks do not stop these two."

[[sym]]
at = "26:B166"
name = "e39_anim"
desc = "obj_anim with e39_anim_tab: one frame of Gordo's animation."

