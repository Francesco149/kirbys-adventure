name = "e38_home_accel_lo"
format = "bytes"
desc = "Pattern 4, low bytes of the velocity step, indexed 2 * obj_param (upward step) and 2 * obj_param + 1 (downward step): $0033 / -$0033 for class 0, $004D / -$004D for the others."

[[data]]
at = "26:ABA1"
