# ------------------------------------------------------------------ model

[[model]]
name = "en26a_model"
code = '''
E26_KEYS = {'vxl': 0x60E0, 'vxh': 0x60F2, 'vyl': 0x6104, 'vyh': 0x6116, 'v3': 0x6200, 'v4': 0x6212,
            'v5': 0x6224, 'v6': 0x6236, 'v8': 0x625A, 'v9': 0x626C}
E26_PAIRS = {'vx': ('vxl', 'vxh'), 'vy': ('vyl', 'vyh'), 'acc': ('v8', 'v9')}
E38_VY = (0x028A, 0xFD76, 0x01EE, 0xFE12)
E38_ACC = (0xFFE7, 0x0019, 0xFFED, 0x0013)
E38_HACC = (0x0033, 0xFFCD, 0x004D, 0xFFB3)
E38_HLIM = (0x0100, 0xFF00, 0x0181, 0xFE7F)
E38_SHAPES = (0xAF83, 0xAF95, 0xAF9B, 0xAFA1, 0xAF8C, 0xAFA7, 0xAFAA, 0xAFAD,
              0xAF83, 0xAFB0, 0xAFB6, 0xAFBC, 0xAF8C, 0xAFC2, 0xAFCB, 0xAFD4)

def e26_w(d, lo, hi, o):
    return d[lo + o] | d[hi + o] << 8

def e26_s(v):
    return v - 0x10000 if v & 0x8000 else v

def e26_neg(v):
    return -v & 0xFFFF

def e26_fin(rd, wr):
    # velocities and variables of the current object at the end of the call (None: neither read nor written)
    o = rd[0x6E]
    return {k: wr[a + o] if a + o in wr else rd.get(a + o) for k, a in E26_KEYS.items()}

def e26_exp(rd, **kw):
    # what the call read, with the changes the model names
    o = rd[0x6E]
    d = {k: rd.get(a + o) for k, a in E26_KEYS.items()}
    for k, v in kw.items():
        if k in E26_PAIRS:
            d[E26_PAIRS[k][0]], d[E26_PAIRS[k][1]] = v & 0xFF, v >> 8 & 0xFF
        else:
            d[k] = v
    return d

def e26_dist(p, q):
    d = p - q & 0xFFFF
    return (-d & 0xFFFF, 1) if d & 0x8000 else (d, 0)

def e26_dx(rd):
    o = rd[0x6E]
    return e26_dist(e26_w(rd, 0x6074, 0x6086, o), e26_w(rd, 0x6074, 0x6086, 1))

def e26_dy(rd):
    o = rd[0x6E]
    return e26_dist(e26_w(rd, 0x6098, 0x60AA, o), e26_w(rd, 0x6098, 0x60AA, 1))

def e26_fall(v, add, cap):
    lo = (v & 0xFF) + add
    hi = (v >> 8) + (lo >> 8) & 0xFF
    if hi - cap & 0x80:
        return hi << 8 | lo & 0xFF
    return cap << 8

def e38_wave(rd):
    o = rd[0x6E]
    vy = e26_w(rd, 0x6104, 0x6116, o) + e26_w(rd, 0x625A, 0x626C, o) & 0xFFFF
    v4 = rd[0x6212 + o]
    if v4 & 0x80:
        return e26_exp(rd, vy=vy)
    v5 = rd[0x6224 + o] - 1 & 0xFF
    if v5:
        return e26_exp(rd, vy=vy, v5=v5)
    v6 = rd[0x6236 + o] ^ 1
    v4 = v4 - 1 & 0xFF
    if v4 & 0x80:
        if not v6:
            raise KeyError('the extra turn never ran')
        return e26_exp(rd, vy=vy, v4=v4, v5=0, v6=0)
    return e26_exp(rd, vy=E38_VY[v6], acc=E38_ACC[v6], v4=v4, v5=0x28, v6=v6)

def e38_seek(rd):
    o = rd[0x6E]
    acc = e26_w(rd, 0x625A, 0x626C, o)
    vy = e26_w(rd, 0x6104, 0x6116, o) + acc & 0xFFFF
    v5 = rd[0x6224 + o] - 1 & 0xFF
    kw = {}
    if v5 == 0x14:
        d, above = e26_dy(rd)
        if d >= 0x20:
            if above:
                kw['acc'] = 0x000D if acc & 0x8000 else 0x0020
            else:
                if not acc & 0x8000:
                    raise KeyError('below Kirby and accelerating downward never ran')
                kw['acc'] = 0xFFE0
    if v5 == 0:
        v6 = rd[0x6236 + o] ^ 1
        return e26_exp(rd, vy=E38_VY[2 + v6], acc=E38_ACC[2 + v6], v5=0x28, v6=v6)
    return e26_exp(rd, vy=vy, v5=v5, **kw)

def e38_sit(rd, nofloor):
    o = rd[0x6E]
    if rd[0x6224 + o]:
        return e26_exp(rd)
    go = nofloor
    if not go:
        go = e26_dx(rd)[0] < 0x40 or (e26_dy(rd)[0] < 8 and rd[0x3A] & 0x40 != 0)
    return e26_exp(rd, v5=1, vy=0) if go else e26_exp(rd)

def e38_to0(v, p):
    if v & 0x8000:
        return v + E38_HACC[p] & 0xFFFF, 1
    if v == 0:
        return 0, 0
    return v + E38_HACC[p + 1] & 0xFFFF, -1

def e38_up(v, p):
    lim = E38_HLIM[p]
    if not v & 0x8000 and v >> 8 >= lim >> 8 and v & 0xFF >= lim & 0xFF:
        return v, 0
    return v + E38_HACC[p] & 0xFFFF, 1

def e38_down(v, p):
    lim = E38_HLIM[p + 1]
    if v & 0x8000 and (v >> 8 < lim >> 8 or (v >> 8 == lim >> 8 and v & 0xFF <= lim & 0xFF)):
        return v, 0
    return v + E38_HACC[p + 1] & 0xFFFF, -1

# per eighth of a turn (0 = up, clockwise): what happens to the X and to the Y velocity
E38_STEER = ((e38_to0, e38_down), (e38_up, e38_down), (e38_up, e38_to0), (e38_up, e38_up),
             (e38_to0, e38_up), (e38_down, e38_up), (e38_down, e38_to0), (e38_down, e38_down))

def e38_home(rd, wr):
    o = rd[0x6E]
    v5 = rd[0x6224 + o] + 1 & 0xFF
    kw = {}
    if v5 >= 0x40:
        v5 = 0
        kw['v4'] = rd[0x6212 + o] + 1 & 0xFF
        if kw['v4'] >= 6:
            return e26_exp(rd, v5=0, v6=3, acc=0xFFE7, **kw)
    if v5 & 7 == 0:
        d = wr.get(0x61DC + o)
        if d is None or d & 0x1F:
            return None
        p = 2 * rd[0x784 + o]
        fx, fy = E38_STEER[d >> 5]
        vx = fx(e26_w(rd, 0x60E0, 0x60F2, o), p)[0]
        vy, t = fy(e26_w(rd, 0x6104, 0x6116, o), p)
        kw.update(vx=vx, vy=vy, v6=1 + t)
    return e26_exp(rd, v5=v5, **kw)

def e38_bounce(rd, wr, romrd, hit, T):
    o = rd[0x6E]
    v3 = rd[0x6200 + o]
    kw = {}
    if v3:
        kw['v4'] = rd[0x6212 + o] - 1 & 0xFF
        if kw['v4'] == 0:
            kw['v3'] = v3 - 1
    ks = [k for k in romrd if T <= k < T + 416]
    f = e26_fin(rd, wr)
    if not hit:
        return not ks and f == e26_exp(rd, **kw)
    col = rd[0x61DC + o] >> 4
    if not ks or (ks[0] - T) & 15 != col:
        return False
    if ks[0] - T < 160 and romrd[ks[0]] == 0:
        # an entry 0 of the rows 0-9 falls through: the entry of row 16 in the same column is used
        ks = ks[1:]
        if ks != [T + 256 + col]:
            return False
    return len(ks) == 1 and wr[0x61DC + o] == romrd[ks[0]] and f['v3'] == 1 and f['v4'] == 0x14

def e38_go(rd, wr, romrd, T):
    o = rd[0x6E]
    p = rd[0x784 + o]
    if {k for k in romrd if T <= k < T + 6} != {T + 2 * p, T + 2 * p + 1}:
        return False
    n = rd[0x61DC + o] >> 4
    sx, sy = e26_s(e26_w(wr, 0x60E0, 0x60F2, o)), e26_s(e26_w(wr, 0x6104, 0x6116, o))
    ax, ay = abs(sx), abs(sy)
    if n in (0, 8):
        ok = sx == 0
    elif n in (4, 12):
        ok = sy == 0
    elif n & 3 == 2:
        ok = ax == ay and ax > 0
    else:
        ok = min(ax, ay) == max(ax, ay) >> 1 and (ay > ax) == (n in (1, 7, 9, 15))
    if 0 < n < 8:
        ok = ok and sx >= 0
    if n > 8:
        ok = ok and sx <= 0
    if n < 4 or n > 12:
        ok = ok and sy <= 0
    if 4 < n < 12:
        ok = ok and sy >= 0
    return ok and wr[0x6200 + o] == 1 and wr[0x6212 + o] == 0x14

def e38_drop(rd):
    o = rd[0x6E]
    if rd[0x6224 + o]:
        return e26_exp(rd)
    vy = e26_fall(e26_w(rd, 0x6104, 0x6116, o), 0x25, 3)
    if e26_dy(rd)[0] & 0xFF < 0x10:
        return e26_exp(rd, vy=vy, v5=1)
    return e26_exp(rd, vy=vy)

def e38_half(rd):
    # 22:92F3: 1 when the object is 92 pixels or more below the top of the screen
    return int(rd[0x6098 + rd[0x6E]] - rd[0xE0] & 0xFF >= 0x5C)

def e26_argw(rom, addr):
    # the word after the three bytes of an asm instruction of bank 26 (PRG offset = bank * $2000)
    a = 0x26 * 0x2000 + (addr & 0x1FFF) + 3
    return rom[a] | rom[a + 1] << 8

def e39_flip(rd, wr, key, lo, hi, flipped):
    # velocities and variables 3-6 unchanged, but for one velocity negated when flipped
    kw = {key: e26_neg(e26_w(rd, lo, hi, rd[0x6E]))} if flipped else {}
    f, e = e26_fin(rd, wr), e26_exp(rd, **kw)
    return all(f[k] == e[k] for k in ('vxl', 'vxh', 'vyl', 'vyh', 'v3', 'v4', 'v5', 'v6'))

def e26_fwd(rd, v):
    # a velocity counted along the facing
    return e26_neg(v) if rd[0x61DC + rd[0x6E]] & 0x80 else v
'''

