desc = "The four X on the screen where pattern 2 can appear: $30, $50, $B0, $D0."

[[data]]
at = "26:AD5F"
len = 4
name = "e38_turn_vy_lo"
format = "bytes"
desc = "Low bytes of the Y velocity a half wave begins with: entries 0 / 1 pattern 0 ($028A down, $FD76 up), 2 / 3 pattern 1 ($01EE, $FE12)."

[[data]]
at = "26:AD63"
len = 4
name = "e38_turn_vy_hi"
format = "bytes"
desc = "High bytes of e38_turn_vy_lo."

[[data]]
at = "26:AD67"
len = 4
name = "e38_turn_acc_lo"
format = "bytes"
