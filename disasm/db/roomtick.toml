[[model]]
name = "roomtick_model"
code = '''
def sx8(v):
    return v - 256 if v >= 0x80 else v

def tick_seen(ok):
    # a path that no movie of the corpus ran: the model has no answer for it
    if not ok:
        raise KeyError('a path that never ran')

def tick_doors(rd, wr, romrd):
    # the door marks of room_tick -> counts of what it calls and the block of every door it sets
    def val(a):
        return wr[a] if a in wr else rd[a]
    r = rd[0x55E] | rd[0x55F] << 8
    lo, hi = O('room_doors_lo'), O('room_doors_hi')
    p = romrd[lo + r] | romrd[hi + r] << 8
    e = romrd[lo + r + 1] | romrd[hi + r + 1] << 8
    off = O('room_doors') - A('room_doors')
    t = {'doors': 0, 'tests': 0, 'sets': 0, 'marks': 0, 'floats': 0, 'back': 0, 'stars': 0, 'blocks': {}}
    while p != e:
        i = t['doors']
        t['doors'] += 1
        b0, b3 = romrd[off + p], romrd[off + p + 3]
        p += 5
        kind = b3 & 0x70 | b0 >> 4
        if kind != 0x10:
            kind &= 0x0F
            if not kind:
                continue
        b1 = romrd[off + p - 4]
        scr = b0 & 0x0F
        row, col = divmod(scr, rd[0x67EE])
        t['tests'] += 1
        cell = 0x68C8 + 192 * scr + (b1 << 4 & 0xF0 | b1 >> 4)
        if rd[0x7F00 + rd[cell]] not in (0x28, 0x58):
            continue
        sx = (col << 8 | b1 & 0xF0) - (rd[0xDD] | rd[0xDE] << 8) & 0xFFFF
        if 0x100 <= sx < 0xFF80:
            continue
        sy = row * 192 + (b1 & 0x0F) * 16 - (rd[0xE0] | rd[0xE1] << 8) & 0xFFFF
        if sy >= 0x100:
            continue
        if kind == 0x10:
            t['back'] += 1
            t['stars'] += 1
            continue
        step = rd[0x6620] if rd[0x56B] == i else 0
        blk = romrd[O('door_open_block') + step]
        last = romrd[O('door_open_mark') + step]
        if kind == 0x0D:
            t['sets'] += 1
            t['blocks'][cell] = blk
            t['floats'] += 2
            if rd[0x7DC] == 1 << rd[0x558]:
                last = 0
            t['marks'] += 1 + (last < 0x80)
            t['back'] += (val(0x6604) < 0x80) + (val(0x6605) < 0x80)
            continue
        if kind >= 8:
            if kind == 8:
                m = 0x0C
            elif kind == 9:
                m = val(0x660B)
            elif kind < 0x0D:
                k = kind - 0x0A
                if rd[0x78D4] & 1 << k:
                    last = 0
                    m = romrd[O('door_shut_mark') + k]
                else:
                    if k == 1:
                        t['floats'] += 1
                        t['back'] += val(0x6603) < 0x80
                    m = val(0x6607 + k)
                    tick_seen(m != 0)
            elif kind == 0x0E:
                m = 0x0B
            else:
                m, c = 0x0A, 0xFE
                if rd[0x78D4] < 0x80:
                    m, c = val(0x6606), 0xFA
                if blk == 0xFF:
                    blk = c
            show = [m, last]
        else:
            bit = 1 << kind - 1
            m, m2 = kind + 0x15, val(0x660D)
            if not rd[0x78D2] & bit:
                m2 = 0xFF
                if rd[0x603D] & 4:
                    m += 0x11
            c = 0xFE if rd[0x78D3] & bit else 0xFA
            if blk == 0xFF:
                blk = c
                if c != 0xFE:
                    last = val(0x660C)
            show = [m, m2, last]
        t['sets'] += 1
        t['blocks'][cell] = blk
        t['marks'] += sum(1 for s in show if s < 0x80)
    return t

def tick_doors_ok(rd, wr, romrd, mem, calls):
    t = tick_doors(rd, wr, romrd)
    return (wr[7] == t['doors'] and calls.count('38:A342') == t['tests'] and calls.count('38:A309') == t['sets']
            and calls.count('38:A288') == t['marks'] and calls.count('38:A2A3') == t['floats']
            and calls.count('sprites_draw_back') == t['back']
            and all(mem(c) == (b if rd[c] >= 0xF8 else b & 0xF7) for c, b in t['blocks'].items()))

def hub_step(rd, romrd):
    # hub_anim -> everything it writes but $00
    w = {}
    def g(a):
        return w[a] if a in w else rd[a]
    fr, tm = O('hub_anim_frames'), O('hub_anim_times')
    for x in range(10, -1, -1):
        t = g(0x5AE + x)
        if t:
            w[0x5AE + x] = t - 1
            if t == 1:
                y = g(0x5A3 + x)
                while romrd[tm + y] == 0xFF:
                    y = romrd[fr + y]
                w[0x5AE + x] = romrd[tm + y]
                w[0x6603 + x] = romrd[fr + y]
                if x < 3:
                    w[0x6614 + x] = romrd[O('hub_anim_vx') + y]
                    w[0x661D + x] = romrd[O('hub_anim_vy') + y]
                w[0x5A3 + x] = y + 1
        if x < 3:
            for pos in (0x660E, 0x6617):
                s = (g(pos + x) << 8 | g(pos + 3 + x)) + 4 * sx8(g(pos + 6 + x)) & 0xFFFF
                w[pos + 3 + x] = s & 0xFF
                w[pos + x] = s >> 8
    return w

def wind(rd, romrd):
    # wind_streaks -> its writes to wind_y, wind_x (wind_timer is checked apart), the number of streaks drawn
    c = rd[0x78D0]
    if c >= 0x80:
        return None
    dy, dx = romrd[O('wind_step') + c], romrd[O('wind_step') + 3 + c]
    w, n = {}, 0
    for x in range(7, -1, -1):
        v = rd[0x78DF + x]
        if v == 0xFF:
            continue
        s = v + dy
        w[0x78DF + x] = s & 0xFF
        if (s >> 8) + (dy >> 7) * 0xFF & 0xFF == 0:
            s = rd[0x78D7 + x] + dx
            w[0x78D7 + x] = s & 0xFF
            if (s >> 8) + (dx >> 7) * 0xFF & 0xFF == 0:
                n += 1
                continue
        w[0x78DF + x] = 0xFF
    if rd[0x78D6] != 1:
        return w, n
    free = [x for x in range(8) if (w[0x78DF + x] if 0x78DF + x in w else rd[0x78DF + x]) == 0xFF]
    tick_seen(free and c < 6)
    x = max(free)
    v = romrd[0x7FC00 + rd[0x603D]]
    if c < 3:
        w[0x78DF + x] = 0xA0
        w[0x78D7 + x] = v << 4 & 0xFF
    else:
        w[0x78D7 + x] = 0
        w[0x78DF + x] = (v << 4 & 0x7F) + 0x10 + (v >> 4 & 1)
    return w, n

def wind_ok(rd, wr, romrd, calls):
    r = wind(rd, romrd)
    if r is None:
        return not wr and not calls
    t = rd[0x78D6] - 1 & 0xFF
    if not t:
        t = wr[0x78D6] if wr[0x78D6] - (rd[0x603D] & 3) in (1, 2) else -1
    return ({k: v for k, v in wr.items() if 0x78D7 <= k <= 0x78E6} == r[0] and wr[0x78D6] == t
            and calls.count('sprites_draw') == r[1])

def map_at(rd, px, py):
    # the place in room_map of the block at a point inside the room, as block_prop_at finds it
    row, rest = divmod(py, 192)
    cell = (px >> 8) + rd[0x676D + row] & 0xFF
    if rd[0x51E] >= 2:
        cell = cell + rd[0x67EE] & 0xFF
    return 0x68C8 + 192 * rd[0x67F6 + cell] + (rest & 0xF0 | (px & 0xFF) >> 4)

def reveal_one(rd, wr, calls):
    # reveal_block
    px = (rd[0x553] | rd[0x554] << 8) + 16 * sx8(rd[0x0A]) & 0xFFFF
    py = (rd[0x555] | rd[0x556] << 8) + 16 * sx8(rd[0x0B]) & 0xFFFF
    maps = {k: v for k, v in wr.items() if 0x68C8 <= k < 0x74C8}
    puffs = {k: v for k, v in wr.items() if 0x106 <= k <= 0x14D}
    if px >= 0x8000 or px >> 8 >= rd[0x67EE] or py >= 0x8000 or py >= (rd[8] | rd[9] << 8):
        return not maps and not puffs and not calls
    a = map_at(rd, px, py)
    if rd[a + 0x600] == rd[a]:
        return not maps and not puffs and 'block_draw' not in calls
    want = {0x14D: rd[0x14D] + 1}
    sx = px - (rd[0x56F] | rd[0x570] << 8) & 0xFFFF
    sy = py - (rd[0x571] | rd[0x572] << 8) & 0xFFFF if sx < 0x100 else 0xFFFF
    drawn = sx < 0x100 and sy < 0xC0
    if drawn:
        slot = next(i for i in range(23, -1, -1) if rd[0x134 + i] >= 6)
        want.update({0x134 + slot: 0, 0x104 + slot: sx, 0x11C + slot: sy})
    return maps == {a: rd[a + 0x600]} and puffs == want and ('block_draw' in calls) == drawn

def puffs(rd, wr, calls):
    # puffs_draw
    if rd[0x551] >= 0x80:
        return not wr and not calls
    live = [i for i in range(24) if rd[0x134 + i] < 6]
    return ({k: v for k, v in wr.items() if 0x134 <= k <= 0x14B} == {0x134 + i: rd[0x134 + i] + 1 for i in live}
            and calls.count('sprites_draw_back') == sum(1 for i in live if not rd[0x134 + i] & 1))

def extra_load(rd, romrd):
    # room_extra_load -> the last values of its variables, the blocks it puts into room_map
    t = O('room_extras')
    w = {0x78D6: 1, 0x78D0: 0xFF, 0x78C9: 0, 0x78D1: 0}
    i = 0
    while romrd[t + i] & romrd[t + i + 1] != 0xFF:
        b0, b1 = romrd[t + i], romrd[t + i + 1]
        i += 6
        if b0 != rd[0x55E] or (b1 & 1) != rd[0x55F]:
            continue
        b = [romrd[t + i - 6 + j] for j in range(2, 4)]
        w[0x78C8] = b1 >> 1
        if b[0] == 0xFE:
            w[0x78D0] = b[1]
            continue
        b4, b5 = romrd[t + i - 2], romrd[t + i - 1]
        if b[0] == 0xFF:
            w.update({0x78C9: b[1], 0x78CA: b4, 0x78CB: b5})
            return w, {}
        px, py = b[0] << 4, b[1] << 4
        a1 = map_at(rd, px, py)
        a2 = map_at(rd, px, py & 0xFF00 | py + 16 & 0xFF)
        w.update({0x78CC: px & 0xFF, 0x78CD: px >> 8, 0x78CE: py & 0xFF, 0x78CF: py >> 8,
                  0x78CA: rd[a1], 0x78CB: rd[a2], 0x78C9: 1, 0x78D1: 1})
        return w, {a1: b4, a2: b5}
    return w, {}

def extra_load_ok(rd, wr, romrd):
    w, m = extra_load(rd, romrd)
    return ({k: v for k, v in wr.items() if 0x78C8 <= k <= 0x78D6} == w
            and {k: v for k, v in wr.items() if 0x68C8 <= k < 0x74C8} == m)

def extra_done(rd):
    # room_extra_done -> its writes to the extra's variables, its calls of block_put_at (the second is a jump)
    if rd[0x78C8]:
        return {0x78C8: rd[0x78C8] - 1}, 0
    s = rd[0x78C9]
    if s == 0:
        return {}, 0
    if s == 1:
        tick_seen(rd[0x59E] == 0)
        return {}, 1
    tick_seen(s != 2)
    return {0x78C9: 0xFF}, 0

def extra_done_ok(rd, wr, calls):
    w, n = extra_done(rd)
    maps = sorted(v for k, v in wr.items() if 0x68C8 <= k < 0x74C8)
    return ({k: v for k, v in wr.items() if 0x78C8 <= k <= 0x78D6} == w and calls.count('block_put_at') == n
            and ((maps == sorted((rd[0x78CA], rd[0x78CB])) and calls[0] == '3F:F07D') if n else not maps))

def arena(rd):
    # arena_lock -> everything it writes
    w = {}
    def g16(a):
        return rd[a] | rd[a + 1] << 8
    def put16(a, v):
        w[a], w[a + 1] = v & 0xFF, v >> 8 & 0xFF
    def limits(lo, hi):
        put16(0x5C8, lo + 0x10)
        put16(0x5CA, hi - 0x11)
    s = rd[0x78C9]
    if s >= 0x80:
        lo = g16(0x5C0) - 6 & 0xFFFF
        put16(0x5C0, lo)
        if lo - g16(0x78CC) & 0x8000:
            lo = g16(0x78CC)
            put16(0x5C0, lo)
            w[0x78C9] = 0
        hi = g16(0x5C2) + 6 & 0xFFFF
        put16(0x5C2, hi)
        if hi - g16(0x78CE) & 0x8000:
            w[0x78C9] = 0xFF
        else:
            hi = g16(0x78CE)
            put16(0x5C2, hi)
        limits(lo, hi)
        return w
    if s != 2:
        return w
    d = g16(0xDD) + 0x40 - g16(0x78CA)
    if d < 0 or d >= 0x50:
        return w
    if d < 0x40:
        put16(0x5C8, (rd[0x6075] | rd[0x6087] << 8) + 2)
        return w
    put16(0x78CC, g16(0x5C0))
    put16(0x78CE, g16(0x5C2))
    cam = g16(0xDD)
    put16(0x5C0, cam)
    put16(0x5C2, cam + 0x100)
    limits(cam, cam + 0x100)
    w[0x78C9] = 3
    return w
'''

