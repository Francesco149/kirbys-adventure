unit = "roomtick"
title = "The room's own frame step: the marks on the hub's doors, the reveal of new hub parts, the goal game's marks, wind streaks, arena locks"
summary = """room_tick (38:A000) is called by obj_run_all between its two passes on every frame on which room_tick_on ($6600)
is not 0, with bank 38 at $A000. It is not about animated blocks: it is the part of a room that is neither block nor
object. It draws sprites straight from the room's door list and from a few per-room variables, and it changes
room_map in two situations (a hub's doors, a hub's reveal). By the room number:

- room + 1 = $FF: nothing.
- room $002A (the goal game at the end of a stage, main@2300): goal_marks. chr_bank + 1 = $E0, the seven marks beside
  the ladder of platforms at X = $C8 (all but the one numbered in goal_mark_off), a blinking group while Kirby's
  object runs the routine at $AD16, and a spinning star at Y = $3B0. Nothing else runs in that room.
- rooms 0-7 (the hubs of the seven worlds, main@2770): chr_bank + 1 = $D8 and hub_anim, which steps eleven little
  animations (hub_frame: the mark numbers that the hub's doors show) and moves three floating marks (hub_float).
- every room but $002A: the reveal, the door marks, puffs_draw, wind_streaks, arena_lock, in that order.

The reveal. A hub keeps two copies of its blocks: the screens 0-7 of room_map are the hub as it was shown last, the
screens 8-15 (1,536 bytes further on) the hub as it is now. While reveal_step is not $FF and reveal_hold is 0,
room_tick copies blocks from the second copy to the first in rings around the point reveal_x / reveal_y:
reveal_ring does step N (the four blocks at +-ring_dx[N], +-ring_dy[N] blocks from the point), reveal_block copies
one block, draws it and starts a puff of smoke on it (puff_timer). Up to four steps are taken per frame, stopping
at the first that changed a block; sound 8 is requested every fourth frame; after step 99 the eight screens are
copied whole and reveal_step becomes $FF. Seen at main@2770: the part of the first hub behind door 1 appearing.

The door marks. For every record of the room's door list (room_doors, unit rooms) whose kind has a low nibble
other than 0, or is $10, and whose block has the property $28 or $58 (door_cell_prop), and which is on the screen:
kind $10 gets a spinning star (door_star; these are the doors that lead to the goal game). The other kinds exist in
hubs only. Each gets a block in room_map (door_block_set, redrawn when it changes) and up to three marks (sprite
groups numbered through mark_lo / mark_hi, drawn by mark_draw). Kinds 1-7 (the stage doors): block $FE when the
stage's bit is set in hub_shut_bits, else $FA with mark hub_frame[9] on it; the stage's number (mark kind + $15),
which alternates with mark kind + $26 every 4 frames while the stage's bit is clear in hub_stage_bits, and mark
hub_frame[10] when the bit is set. Kind 8: mark $0C. Kind 9: mark hub_frame[8]. Kinds $A-$C: with bit kind - $A
of hub_flags set mark door_shut_mark[kind - $A], else mark hub_frame[kind - 6] (kind $B also draws floating mark
0). Kind $D: mark hub_frame[7] and the floating marks 1 and 2. Kind $E: mark $0B. Kind $F: block $FA and mark
hub_frame[3], or block $FE and mark $0A when bit 7 of hub_flags is set. The door Kirby took (door_index) shows
door_open_block[door_open_step] instead, $FB, $FC, $FD: the door opening.

The rest. wind_streaks: in a room with a room-wide current (room_current, unit kblocks) up to eight one-sprite
streaks fly with the current (main@36200). room_extra_load (38:AD5E, a far call during the room load) reads the
room's records in room_extras: a current for the room; or two blocks to replace, with the old ones kept
(extra_state 1); or an X position at which the camera is to lock (extra_state 2). arena_lock does the lock: on the
frame on which cam_x has come to X (cam_x - X from 0 to 15) it pins cam_min_x and cam_end_x to the screen it shows
(extra_state 3; main@4000 in room $31), and after room_extra_done it lets them go back by 6 pixels a frame (extra_state $FF) until they
are what they were. room_extra_done (38:AE2F, called by 3F:E6E8 from the scripts of banks 27, 28, 2A and through
call_vector) ends the room's extra: it puts the two old blocks back with a puff (3F:F07D) or releases the lock.

Open: what the bits of hub_stage_bits, hub_shut_bits and hub_flags are made from (13:AD9A, 15:BC88, 15:BCB1 copy them
from $0521, $0539, $0541, $0549 and $0531 by $0558) and what the hub door kinds 8-$F lead to; who starts a reveal
(13:ABD2) and sets its point (15:BD68); what the routine at $AD16 of Kirby's object in the goal game is and what
sets goal_mark_off (19:A15B and a script); what calls room_extra_done in banks 27, 28 and 2A (the name says only
what it does). The X and Y of a puff are kept at $0104 + slot and $011C + slot, bytes that block_draw, tiles_row,
tiles_col and code of bank 13 also write; they are not named. ring_dx[98] is 7 where the pattern asks for 8: the
block at (8, 9) from the point is never copied by a ring, only by the whole copy at the end. Paths that never ran
and are not described: wind_streaks for a current of 6 or more (38:AA9F) and with all eight streaks in use;
room_extra_done with $059E set (38:AE52: a sound, music $17 and an object) and with extra_state 2; a hub door of
kind $A-$C whose hub_frame mark is 0 (it would go on as a stage door); a negative streak X step. Of
door_shut_mark only entry 2 was read, of mark_lo / mark_hi not entry 10, 28, 45; the marks' sprite groups
(sprites_38_A3DA and the following, unit sprites) are not renamed. room_extras: 17 of its 41 records were never
matched. 38:A776 and room_extra_load are reached through call_vector only, so their callers are not in the
evidence by name."""

# ------------------------------------------------------------------ the frame step

[[sym]]
at = "38:A000"
name = "room_tick"
desc = """The room's frame step, called by obj_run_all when room_tick_on is not 0. room + 1 = $FF: returns. Room $002A: jumps to goal_marks. Rooms 0-7: chr_bank + 1 = $D8, hub_anim. Then, with bank 12 at $8000 (restored at the end): the reveal (38:A02A) when reveal_hold is 0 and reveal_step is not $FF: reveal_changed = 0 and reveal_ring for the step, repeated for up to three more steps while reveal_changed stays 0; snd_play with A = 8 when obj_frame & 3 is 0; reveal_step = the next step, or, from 100 (38:A076), the screens 8-15 of room_map are copied to the screens 0-7 and reveal_step = $FF. Then the door marks (38:A09F): $18/$19 runs through the room's door records up to the next room's ($1A/$1B), $07 counts them. A record is skipped when the low nibble of its kind is 0 and the kind is not $10, when door_cell_prop says its block is no door, or when it is off the screen (X - cam_x from -128 to 255, Y - cam_y from 0 to 255; X = 256 * (cell mod room_width) + 16 * column, Y = 192 * (cell / room_width) + 16 * row). Kind $10: door_star. Otherwise $09 = the block and $04 = the last mark from door_open_block / door_open_mark[door_open_step] when $07 is door_index, else $FF and $FF, and by the low nibble of the kind as the summary says; door_block_set, then the marks that are below $80 through mark_draw. At the end puffs_draw, wind_streaks, arena_lock."""
comments = { "A007" = "room + 1 = $FF", "A014" = "the goal game", "A01B" = "a hub", "A02A" = "the reveal", "A065" = "a step changed a block, or four did not", "A076" = "step 100: copy the screens 8-15 over 0-7", "A09F" = "the door marks", "A0EC" = "next record, 5 bytes", "A0FB" = "kind = byte 3 bits 6-4, byte 0 high nibble", "A115" = "$01 = cell, $02 = position, draw_x / draw_y = the door in the room", "A150" = "is the block a door?", "A155" = "on the screen?", "A187" = "the door Kirby took opens", "A1B2" = "kind $D", "A1D7" = "kinds $E and $F", "A1F8" = "kinds $A-$C", "A220" = "kinds 1-7: the stage doors", "A23A" = "not in hub_stage_bits: the number blinks", "A248" = "in hub_shut_bits: block $FE" }

[[sym]]
at = "38:A288"
name = "mark_draw"
desc = "Draws mark Y at draw_x, draw_y: sprites_draw_back with the address in mark_lo / mark_hi[Y]."
in = "Y = mark, 0-$34"

[[sym]]
at = "38:A291"
kind = "part"
name = "door_star"
desc = "room_tick for a door of kind $10 on the screen: sprites_draw_back with entry (obj_frame & $0E) / 2 of star_frames, then on to the next record (38:A0EC)."

[[sym]]
at = "38:A2A3"
name = "hub_float_draw"
desc = "Draws floating mark Y of a hub: nothing when hub_frame[Y] is negative; otherwise the mark hub_frame[Y] (through mark_lo / mark_hi) at draw_x + hub_float X[Y], draw_y + hub_float Y[Y] (signed bytes), with sprites_draw_back. $01, $02, draw_x and draw_y are saved on the stack and restored."
in = "Y = 0-2"

[[data]]
at = "38:A2FE"
len = 3
name = "door_shut_mark"
format = "bytes"
desc = "room_tick, hub doors of kind $A, $B, $C whose bit is set in hub_flags: the mark drawn, $1D, $0D, $24. Only entry 2 was read."

[[data]]
at = "38:A301"
len = 4
name = "door_open_block"
format = "bytes"
desc = "By door_open_step for the door Kirby took, entry 0 for every other door: the block of the door, $FF (none: the door's kind decides), $FB, $FC, $FD."

[[data]]
at = "38:A305"
len = 4
name = "door_open_mark"
format = "bytes"
desc = "By door_open_step as door_open_block: the last mark drawn on the door, $FF (none) three times, then $34."

[[sym]]
at = "38:A309"
name = "door_block_set"
desc = "Makes the block of the door at cell $01, position $02 the block in $09: reads it with door_cell; when it is below $F8, bit 3 of $09 is cleared first; when it differs from $09 it is replaced in room_map and, with draw_x + 1 = draw_y + 1 = 0 and draw_y below $B0, drawn with block_draw ($10 = block, $00 = its index in the screen). $00 and $04 are saved and restored."
in = "$01 = cell (screen of room_map), $02 = position, $09 = block, draw_x / draw_y = the door on the screen"

[[sym]]
at = "38:A342"
name = "door_cell_prop"
desc = "door_cell, then the block's block_prop: zero flag set when it is $28 or $58 (the two properties door_find of unit inroom takes for a door)."
in = "$01, $02 as door_cell"
out = "A = the property, X = the block; zero flag set: a door"

[[sym]]
at = "38:A350"
name = "door_cell"
desc = "Reads the block of a door: $16/$17 = the address of screen $01 of room_map (screen_lo / screen_hi), Y = the position $02 with its nibbles swapped (row * 16 + column), A = the block there. The cell number of the door record is used as the screen number."
in = "$01 = screen, $02 = position (column in the high nibble, row in the low)"
out = "A = block, Y = index, $16/$17 = the screen, X = $01; $03 used"

[[data]]
at = "38:A370"
len = 53
name = "mark_lo"
format = "bytes"
desc = "Per mark 0-$34: low byte of the address of its sprite group in bank 38 (38:A3DA-A61A)."

[[data]]
at = "38:A3A5"
len = 53
name = "mark_hi"
format = "bytes"
desc = "Per mark: high byte of the address of its sprite group."

# ------------------------------------------------------------------ the hub's animations

[[sym]]
at = "38:A61B"
name = "hub_anim"
desc = "Steps the eleven animations of a hub, 10 down to 0. Animation X: when hub_anim_timer[X] is not 0 it is decremented; at 0 the next entry is taken at hub_anim_pos[X] (an entry whose hub_anim_times byte is $FF continues at the entry numbered in its hub_anim_frames byte): hub_anim_timer[X] = its time, hub_frame[X] = its frame, for X below 3 also the two velocities of hub_float from hub_anim_vx / hub_anim_vy, and hub_anim_pos[X] = the entry after it. For X below 3, every call: the X and Y of hub_float (pixel and fraction) grow by 4 times their signed velocity."
comments = { "A62A" = "$FF: go to the entry in hub_anim_frames", "A656" = "the three floating marks move" }

[[data]]
at = "38:A69C"
len = 83
name = "hub_anim_frames"
format = "bytes"
desc = "The animations of hub_anim, one byte per entry: the value for hub_frame (a mark number; $FF = nothing shown), or, where hub_anim_times has $FF, the entry to continue at."

[[data]]
at = "38:A6EF"
len = 83
name = "hub_anim_times"
format = "bytes"
desc = "Per entry of hub_anim_frames: the number of calls of hub_anim the frame stays, or $FF for a jump."

[[data]]
at = "38:A742"
len = 26
name = "hub_anim_vx"
format = "bytes"
desc = "Per entry 0-25 (the entries the animations 0-2 use): the X velocity of the floating mark while the entry lasts, signed, in 1/64 pixel per call."

[[data]]
at = "38:A75C"
len = 26
name = "hub_anim_vy"
format = "bytes"
desc = "Per entry 0-25: the Y velocity of the floating mark, as hub_anim_vx."

[[sym]]
at = "38:A776"
name = "hub_anim_init"
desc = "Starts the hub's animations: the 18 bytes of hub_float = 0, hub_anim_pos[X] = hub_anim_start[X] and hub_anim_timer[X] = 1 for the eleven animations, so that the first hub_anim takes each one's first entry. Reached through call_vector."

[[data]]
at = "38:A791"
len = 11
name = "hub_anim_start"
format = "bytes"
desc = "The first entry of each of the eleven animations in hub_anim_frames: 0, $0D, $13, $1A, $22, $34, $39, $40, $43, $48, $4F. Animation 2 starts inside the entries of animation 1 and loops with them."

[[data]]
at = "38:A79C"
len = 16
name = "star_frames"
format = "ptr16"
desc = "Eight sprite groups (38:A7AC-A863): the frames of the spinning star of door_star and goal_marks, by (obj_frame & $0E) / 2."

# ------------------------------------------------------------------ the goal game

[[sym]]
at = "38:A864"
kind = "part"
name = "goal_marks"
desc = "room_tick for room $002A. chr_bank + 1 = $E0. For the marks 1-7 ($09), from the last entry of goal_mark_y to the first: unless goal_mark_off is the mark's number, and when its Y minus cam_y is 0-$CF, its group of goal_mark_groups is drawn at X = $C8 with sprites_draw_back. While the routine of Kirby's object (obj_tick_lo / obj_tick_hi of slot 1) is $AD16 and obj_frame & 6 is not 0: the group at 38:A9A7 at X = $82, Y = $60. And when $3B0 - cam_y is 0-$CF: the star_frames entry for obj_frame at X = $78 with sprites_draw."
comments = { "A86E" = "the seven marks", "A8A7" = "Kirby's object runs $AD16", "A8CF" = "the star at Y = $3B0" }

[[data]]
at = "38:A8F8"
len = 14
name = "goal_mark_y"
format = "rows:2"
desc = "Seven 16-bit Y positions in room $002A, $70 to $310 in steps of $70: where goal_marks draws mark 7 (the first entry) to mark 1 (the last)."

[[data]]
at = "38:A906"
len = 14
name = "goal_mark_groups"
format = "ptr16"
desc = "The sprite groups of the seven marks of goal_marks, in the order of goal_mark_y (38:A914 and every 21 bytes after it: five sprites, of which the last differs)."

# ------------------------------------------------------------------ wind

[[sym]]
at = "38:A9F0"
name = "wind_streaks"
desc = "Does nothing while room_current is negative. Otherwise, for the eight streaks (a streak with wind_y = $FF is free): wind_y and wind_x grow by the steps of wind_step for the current; a streak that leaves the 256 x 256 square becomes free, the others are drawn as the one-sprite group at 38:AABA with sprites_draw. Then wind_timer is decremented; at 0 it becomes 1-5 ((obj_frame & 3) + 1 plus the carry) and one free streak starts: for a current of 0-2 at wind_y = $A0 and a wind_x of 16 times the byte of the table at 3F:FC00 for obj_frame, for 3-5 at wind_x = 0 and a wind_y of $10-$90 from the same byte."
comments = { "AA10" = "move and draw the eight streaks", "AA51" = "time for a new one?", "AA6D" = "currents 0-2: from the bottom", "AA84" = "currents 3-5: from the left" }

[[data]]
at = "38:AAAB"
len = 15
name = "wind_step"
format = "bytes"
desc = "The steps of a streak per frame, signed: byte N is the Y step for current N, byte N + 3 the X step. Currents 0-2: Y -16; 3-5: X +16; 6-8: Y +16; 9-11: X -16. Only the bytes for the currents 1 and 4 were read."

# ------------------------------------------------------------------ the reveal

[[sym]]
at = "38:AABF"
name = "reveal_ring"
desc = "Step X of the reveal: $0A = ring_dx[X], $0B = ring_dy[X], $08/$09 = room_height * 192, then reveal_block four times, for (dx, dy), (dx, -dy), (-dx, -dy), (-dx, dy). X is preserved."
in = "X = step, 0-99"
out = "X unchanged; $08-$0B used"

[[sym]]
at = "38:AAF8"
name = "reveal_block"
desc = "Copies one block of the hub's second copy to the first. The point is reveal_x + 16 * $0A, reveal_y + 16 * $0B (signed bytes); nothing happens when its column is outside the room or its Y is negative or not below $08/$09. block_prop_at finds the block's place in room_map; when the byte 1,536 further on (the same block 8 screens later) differs from it, it is copied there, reveal_changed is incremented, and, when the block is in the picture (X - drawn_x and Y - drawn_y both 0-255, and Y - drawn_y below $C0), block_draw draws it and a puff starts on it: the highest of the 24 puff_timer bytes that is 6 or more becomes 0, with the block's X - drawn_x at $0104 + slot and Y - drawn_y at $011C + slot."
in = "$0A, $0B = signed offsets in blocks; $08/$09 = the room's height in pixels"

[[sym]]
at = "38:ABAA"
name = "puffs_draw"
desc = "Does nothing while reveal_step is negative. Otherwise every puff_timer below 6 is incremented, and when it was even (0, 2, 4) the puff is drawn at the X and Y kept at $0104 + slot and $011C + slot: group puff_lo / puff_hi[timer / 2] with sprites_draw_back. A puff lasts 6 calls and is seen on three of them."

[[data]]
at = "38:ABE1"
len = 100
name = "ring_dx"
format = "rows:16"
desc = "Per reveal step 0-99: the X distance in blocks, 0-9. With ring_dy the steps go through the quarter square 10 x 10 from the middle outwards (the larger of the two distances never falls), once each, except that step 98 repeats (7, 9) and (8, 9) is missing."

[[data]]
at = "38:AC45"
len = 100
name = "ring_dy"
format = "rows:16"
desc = "Per reveal step: the Y distance in blocks, 0-9."

[[data]]
at = "38:ACA9"
len = 3
name = "puff_lo"
format = "bytes"
desc = "Low bytes of the addresses of the three frames of a puff (38:ACAF, ACB8, ACC1: two sprites each)."

[[data]]
at = "38:ACAC"
len = 3
name = "puff_hi"
format = "bytes"
desc = "High bytes of the addresses of the three frames of a puff."

# ------------------------------------------------------------------ the room's extra

[[sym]]
at = "38:AD5E"
name = "room_extra_load"
desc = "Part of the room load (a far call from room_rows, with bank 12 at $8000). wind_timer = 1, room_current = $FF, extra_state = 0, room_side_class = 0. Then the records of room_extras are searched for the room. A record of type $FE: room_current = its byte 3, and the search goes on. The first other record ends it: extra_delay = byte 1 >> 1; type $FF: extra_state = byte 3, extra_arg = the bytes 4 and 5. Any other type: extra_box = 16 * byte 2 (X) and 16 * byte 3 (Y), 16 bits each; the block at that point (block_prop_at) is kept in extra_arg and replaced by byte 4, the block 16 pixels below it is kept in extra_arg + 1 and replaced by byte 5 (room_map only, nothing is drawn); extra_state = 1 and room_side_class = 1."
comments = { "AD6F" = "per record of 6 bytes; $FF $FF ends the table", "AD94" = "the room's record", "ADAF" = "two blocks", "AE13" = "type $FF: a camera lock", "AE26" = "type $FE: a current" }

[[sym]]
at = "38:AE2F"
name = "room_extra_done"
desc = "Ends the room's extra; called by 3F:E6E8 with bank 38 mapped. While extra_delay is not 0 it only decrements it. extra_state 0: nothing. 1: 3F:F07D creates an object at extra_box + (8, 16), and block_put_at puts the two kept blocks of extra_arg back at extra_box and 22 pixels below it; extra_state stays 1. 3 (and anything above 2): extra_state = $FF, which makes arena_lock release the camera."
comments = { "AE4D" = "state 1: put the two blocks back", "AE47" = "state 3: release the lock" }

[[sym]]
at = "38:AED0"
name = "arena_lock"
desc = "By extra_state. 2: with d = cam_x + $40 - extra_arg (16 bits): d from 0 to $3F: kirby_min_x = Kirby's world X + 2 (he cannot go back); d from $40 to $4F: the lock: cam_min_x and cam_end_x are saved in extra_box, cam_min_x = cam_x and cam_end_x = cam_x + $100, arena_limits, extra_state = 3. Negative ($FF): the release: cam_min_x goes down by 6 and cam_end_x up by 6, each stopping at its saved value; arena_limits; extra_state = 0 when both have arrived, else $FF. Any other state: nothing."
comments = { "AEDD" = "state 2: is the camera there?", "AEFF" = "lock", "AF31" = "close to it: Kirby cannot go back", "AF43" = "the release" }

[[sym]]
at = "38:AFA6"
name = "arena_limits"
desc = "kirby_min_x = cam_min_x + $10 and kirby_max_x = cam_end_x - $11. The end of arena_lock."

[[data]]
at = "12:9E92"
len = 248
name = "room_extras"
format = "rows:6"
desc = "41 records of 6 bytes and two $FF: what room_extra_load does for a room. Byte 0: the room's low byte. Byte 1: bit 0 = bit 8 of the room, the rest = extra_delay. Byte 2: the type. $FE: byte 3 = room_current. $FF: byte 3 = extra_state (always 2), bytes 4/5 = the X of the camera lock. Anything else: the bytes 2 and 3 are the column and row (in blocks of the whole room) of the upper of two blocks, the bytes 4 and 5 the blocks to put there."

# ------------------------------------------------------------------ RAM

[[ram]]
at = "6600"
name = "room_tick_on"
desc = "Not 0: obj_run_all calls room_tick. room_rows sets it to 1 during a room load; room_pick, obj_init_all and 3F:E440 clear it."

[[ram]]
at = "0551"
name = "reveal_step"
desc = "The step of the hub's reveal, 0-99, or $FF when none runs. 13:ABD2 starts one (0), room_rows sets $FF."

[[ram]]
at = "0552"
name = "reveal_hold"
desc = "Not 0: room_tick leaves the reveal alone. 13:ABD2 and 15:BC5E set it to 1, a script clears it."

[[ram]]
at = "0553"
len = 2
name = "reveal_x"
desc = "The X of the point the reveal spreads from (16 bits). 15:BD68 sets it to cam_x + $80."

[[ram]]
at = "0555"
len = 2
name = "reveal_y"
desc = "The Y of the point the reveal spreads from. 15:BD68 sets it to cam_y + $60."

[[ram]]
at = "014D"
name = "reveal_changed"
desc = "Cleared by room_tick before the reveal's steps of a frame, incremented by reveal_block for every block it copies: not 0 ends the frame's steps."

[[ram]]
at = "0134"
len = 24
name = "puff_timer"
desc = "24 puffs of smoke of the reveal: 0-5 = the age in calls of puffs_draw, 6 or more ($FF from 13:ABD2) = free. Their X and Y on the screen are at $0104 + slot and $011C + slot. Only the slots 2-23 are ever used."

[[ram]]
at = "05A3"
len = 11
name = "hub_anim_pos"
desc = "Per animation of hub_anim: the entry of hub_anim_frames that comes next."

[[ram]]
at = "05AE"
len = 11
name = "hub_anim_timer"
desc = "Per animation of hub_anim: calls left for the current frame; 0 = stopped."

[[ram]]
at = "6603"
len = 11
name = "hub_frame"
desc = "Per animation of hub_anim: the mark it shows now. 0-2: the floating marks of hub_float_draw (negative = none). 3: on a door of kind $F. 4-6: on the doors of kind $A-$C. 7: kind $D. 8: kind 9. 9: on a stage door that is not shut. 10: on a stage door whose bit is set in hub_stage_bits."

[[ram]]
at = "660E"
len = 18
name = "hub_float"
desc = "The three floating marks of a hub, six groups of three bytes: X offset from the door in pixels (signed), its fraction, X velocity (signed, 1/64 pixel per call), then Y offset, fraction and velocity."

[[ram]]
at = "6620"
name = "door_open_step"
desc = "0-3: how far the door Kirby took (door_index) is open; index into door_open_block and door_open_mark. Written by scripts and cleared by 13:ABD2."

[[ram]]
at = "78D2"
name = "hub_stage_bits"
desc = "One bit per stage door of the hub (bit kind - 1). Clear: the door's number blinks. Set: mark hub_frame[10] is drawn on it. Copied from $0539 or $0521 by $0558."

[[ram]]
at = "78D3"
