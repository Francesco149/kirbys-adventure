[[claim]]
id = "tail.e17_nudge.model"
about = ["e17_nudge"]
text = "e17_nudge adds to the 16-bit Y position the byte of e17_offsets + 36 + variable 2 (low) and + 28 (high), with the carry it was called with, and to the X position the bytes at + 32 and + 20 (carry clear)."
kind = "call"
fn = "e17_nudge"
on = ["main@6200+100", "main@0+137712"]
min_calls = 20
model = '''
def nudge(rd, wr, romrd, x, p):
    v = rd[0x61EE + x]
    t = lambda k: romrd[O('e17_offsets') + k + v]
    y = rd[0xB8 + x] + t(36) + (p & 1)
    yh = (rd[0xCA + x] + t(28) + (y >> 8)) & 0xFF
    xl = rd[0x82 + x] + t(32)
    xh = (rd[0x94 + x] + t(20) + (xl >> 8)) & 0xFF
    return (wr[0xB8 + x], wr[0xCA + x], wr[0x82 + x], wr[0x94 + x]) == (y & 0xFF, yh, xl & 0xFF, xh)
'''
expect = "nudge(rd, wr, romrd, x, p)"

