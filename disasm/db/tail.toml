[[claim]]
id = "tail.kirby_spit_dir.model"
about = ["kirby_spit_dir"]
text = "kirby_spit_dir answers 4 with Up held, 5 with Down held, else (2 when floor_kind is not 0, else 0) + 1 when kirby_facing has bit 7 set."
kind = "call"
fn = "kirby_spit_dir"
on = ["w12-sonnet@39750+30", "w12-sonnet@39000+1500"]
min_calls = 1
model = '''
def spit_dir(rd):
    pad = rd[0xE6]
    if pad & 8:
        return 4
    if pad & 4:
        return 5
    return (2 if rd[0x5F4] else 0) + (1 if rd[0x61DD] & 0x80 else 0)
'''
expect = "ra == spit_dir(rd)"

[[claim]]
id = "tail.kirby_spit_dir_test.model"
about = ["kirby_spit_dir_test"]
text = "kirby_spit_dir_test: with no direction held, or the direction (Up 4, Down 5, Right 0, Left 1, + 2 for Right and Left when floor_kind is not 0) equal to $61CB, carry clear and $61CB not written; otherwise carry set and $61CB = the direction. Right and Left also set kirby_facing to $40 / $C0."
kind = "call"
fn = "kirby_spit_dir_test"
on = ["w12-sonnet@39760+40", "w12-sonnet@39000+1500"]
min_calls = 8
model = '''
def spit_test(rd, wr, rp):
    pad = rd[0xE6]
    face = None
    if pad & 8:
        d = 4
    elif pad & 4:
        d = 5
    elif pad & 3:
        d, face = (0, 0x40) if pad & 1 else (1, 0xC0)
        d += 2 if rd[0x5F4] else 0
    else:
        return rp & 1 == 0 and 0x61CB not in wr and 0x61DD not in wr
    if face is not None and wr.get(0x61DD) != face:
        return False
    if d == rd[0x61CB]:
        return rp & 1 == 0 and 0x61CB not in wr
    return rp & 1 == 1 and wr.get(0x61CB) == d
'''
expect = "spit_test(rd, wr, rp)"
cases = { "rd[0xE6] & 3" = 2, "not rd[0xE6] & 15" = 2 }

