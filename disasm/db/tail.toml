unit = "tail"
title = "The tail: small pieces of code and the tables next to documented routines"
summary = """
The last undocumented pieces of code that ran and the most used undocumented tables, each named in the style of the
unit that documents the routine it belongs to, and claimed here. The code: a second entry of e49_floor_changed
(e49_floor_store, unit en2a), the rts that e3b_feel_tab names for "nothing ahead" (e3b_feel_none, en26b), the fall of
type $32 (e32_drop, en27), the one-pixel step of type $17 round an outer corner and its water test (e17_nudge,
e17_water_test, en2b), the quiet hit test of type $4D while it blinks (e4d_hit_quiet, en2a), the script switch of the
fish of type $18 (e18_set_script, en24c), the tick routine of the puff's third variant (e59_tick_held, en26b), three
small routines of Kirby's water spit (kirby_spit_dir, kirby_spit_dir_test, kirby_spit_more, units kst_rest and
scr_obj), the routine that ends the Fireball's trail (fireball_trail_free, scr_obj) and the tick routine of walking
under water with the mouth full (kirby_st_full_wade, kst18). The tables are listed by the unit whose routine reads
them; each description says which routine that is.

Open:
- 3D:BC1D, 3D:B6AE, 3D:A80B, 3D:AF4F and 3D:BEE5 are labels of unit leftovers (fsel_text_queue, fsel_file_empty,
  intro_tick_end, fsel_restate, continue_hub_sync); kd next keeps listing them. The code chunks that never ran
  (26:A469, 3B:B8CB, 3D:B65C, 3D:B673) are not described (2A:B9B6 ran in cov3-b-e4f: e4f_wall_turn, unit tail2).
- The paths of the small routines that no movie took (the spit with Up or Down held or another direction than the
  one stored, kirby_st_full_wade's exits other than Down held, e59_tick_held freeing the puff) are described from the
  code only.
"""

# ================================================================== code

[[sym]]
at = "2A:AF65"
name = "e49_floor_store"
desc = """
Second entry of e49_floor_changed (called by it, and branched to when the floor changed): variable 8 = A (the floor
number), and A = the slope index of e49_slope_index for A - 2: the first five entries when the X velocity is
negative (moving left), the last five otherwise; carry set.
"""
in = "A = floor number ($0C), X = object"
out = "A = slope index; carry set; variable 8 = the floor number"

[[sym]]
at = "26:B643"
kind = "part"
name = "e3b_feel_none"
desc = "The rts at the end of e3b_turn, which entry 0 of e3b_feel_tab (22:9684 answered 0: nothing ahead) names: the tick routine of type $3B ends there."

[[sym]]
at = "27:AF34"
kind = "part"
name = "e32_drop"
desc = "The fall of type $32 (e32_tick with variable 6 not negative): e3x_fall and obj_collide0; at the landing (carry set) variable 6 = $FF (on a floor), Y velocity 0 (22:9458) and sound $0E."

[[sym]]
at = "2B:A9BC"
name = "e17_nudge"
desc = """
For e17_crawl past an edge: moves the object one pixel toward the side of its old surface (variable 2: 0 down, 1
left, 2 up, 3 right): Y position + the byte of e17_offsets at 36 + side (1, 0, -1, 0) with the high byte of the
probe's Y offsets (e17_offsets + 28), X position + the byte at 32 + side (0, -1, 0, 1) with the high byte of the
probe's X offsets (e17_offsets + 20). The Y addition starts with the caller's carry.
"""
in = "X = object, carry from the caller"

[[sym]]
at = "2B:A6DB"
name = "e17_water_test"
desc = "For e17_tick_turn: prop_bit7_at at the object's own position ($4B = X high, $4C = Y high, X = X low, Y = Y low): water there or not."

[[sym]]
at = "2A:A20A"
kind = "part"
name = "e4d_hit_quiet"
desc = "The end of e4d_hit while the boss blinks after a hit (variable 8 not 0): hit_test_far with the record 39:91DC (no reactions), with variable 0 and obj_dir saved on the stack and put back afterwards, so nothing the record does changes them."

[[sym]]
at = "24:B1B1"
kind = "part"
name = "e18_set_script"
desc = "Gives the fish of type $18 the script number X: bank $24, address e18_scripts_lo / e18_scripts_hi [X], obj_set_script. e18_tick_lurk jumps here with X = 2 (24:B114, on in e18_swim) and X = 3 (e18_leap); the code of variant 2 that would use 0 and 1 never ran."

[[sym]]
at = "26:B9D4"
name = "e59_tick_held"
desc = """
Tick routine of the puff's variant 2 (variable 0 = 2: the script 26:B9C4 installs it; ran in the arena,
cov-minigame-arena@27320): the puff lives while variable 6 equals the type of the object in variable 2 (its maker)
and variable 3 is 0; otherwise it is freed (obj_free; never happened).
"""

[[sym]]
at = "21:9DCD"
name = "kirby_spit_dir"
desc = "The direction of the water spit from the pad, for kirby_s_water_spit: A = 4 with Up held, 5 with Down held, otherwise 0 (floor_kind 0) or 2 (floor_kind not 0), + 1 when Kirby faces left."
out = "A = 0-5"

[[sym]]
at = "21:88DE"
name = "kirby_spit_dir_test"
desc = """
For kirby_st_water_spit_2: the spit's direction from the pad compared with variable 0 of slot 1 ($61CB): Up 4,
Down 5, Right 0 (kirby_facing = $40), Left 1 (kirby_facing = $C0), + 2 for the last two when floor_kind is not 0.
A direction that differs from variable 0 is stored there with carry set; the same direction, or no direction held,
gives carry clear.
"""
out = "carry set: the direction changed (variable 0 of slot 1 = the new one)"

[[sym]]
at = "21:9DF2"
name = "kirby_spit_more"
desc = "For kirby_s_water_spit_side: A = 0 while B is held (the spray lasts), 1 when it is not."
out = "A = 0 with B held, else 1"

[[sym]]
at = "18:ACBE"
name = "fireball_trail_free"
desc = "For kirby_s_fireball_wall: frees (obj_free) every object of the slots 3-5 whose type is 2 (Kirby's effects) and whose variable 3 is $0F (the Fireball's trail)."

[[sym]]
at = "18:B54D"
name = "kirby_st_full_wade"
desc = """
Tick routine of kirby_s_full_wade (walking under water with the mouth full): kirby_speed_from_vx, facing_index,
slope_profile, kirby_speed_step with profile + $0E and the pad masked by facing_pad, kirby_step_from_speed; then the
chain of tests: kirby_walls_bump (script $5B), kirby_floor_near ($5D), kirby_speed_zero ($5B), pad_down_held ($59),
21:8AF2 ($58), 21:89F7 ($5D), 21:8A5D ($5C), 21:8A15 (0), 21:89E6 ($5F), each through kirby_script_upkeep; else
kirby_upkeep. Both calls in the corpus left by Down held (script $59).
"""

# ------------------------------------------------------------------ code claims

[[claim]]
id = "tail.e49_floor_store.model"
about = ["e49_floor_store"]
text = "e49_floor_store sets variable 8 of object X to A and returns carry set and A = the byte of e49_slope_index at A - 2, + 5 when the X velocity's high byte is not negative."
kind = "call"
fn = "e49_floor_store"
on = ["w12-opus@26080+400", "main@122480+150", "w12-sonnet@32040+800"]
min_calls = 100
expect = "wr[0x625A + x] == a and rp & 1 == 1 and romrd.get(O('e49_slope_index') + a - 2 + (0 if rd[0x60F2 + x] & 0x80 else 5)) == ra"
cases = { "rd[0x60F2 + x] & 0x80" = 20, "not rd[0x60F2 + x] & 0x80" = 20 }

