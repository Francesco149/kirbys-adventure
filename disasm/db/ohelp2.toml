# ================================================================== steering

[[sym]]
at = "22:886F"
name = "obj_steer"
desc = """One step of acceleration of the current object toward obj_dir. A / X = the address T of the caller's four
tables: $00/$01 = T (step low bytes), $02/$03 = T + 8 (step high), $04/$05 = T + 16 (limit low), $06/$07 = T + 24
(limit high). Y = $10 = 2 * obj_param, $11 = $12 = 0; then the part of obj_steer_parts for obj_dir_octant of obj_dir,
which treats the X velocity and then the Y velocity: eighth 0 (up) X toward 0, Y negative; 1 X positive, Y negative;
2 (right) X positive, Y toward 0; 3 X positive, Y positive; 4 (down) X toward 0, Y positive; 5 X negative, Y positive;
6 (left) X negative, Y toward 0; 7 X negative, Y negative. $11 / $12 end as +1, -1 or 0: the sign of the step added
to each velocity."""
in = "A = low byte, X = high byte of the tables"
out = "X = the current object; $11 / $12 = the steps' signs"

