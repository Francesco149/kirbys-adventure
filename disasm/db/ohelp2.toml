unit = "ohelp2"
title = "The objects' helpers of bank 22, second part: steering, the inhaled and beaten scripts, bursts, creators"
summary = """The rest of what bank 22 gives the enemies, after unit ohelp: the scripts every enemy ends in and the helpers
their code and scripts call most.

The ends. A hit record's reaction "inhaled" starts obj_s_inhaled: the object's position becomes relative to Kirby
(obj_pos_rel_kirby, with the position routine 3E:D97D), and its tick routine obj_tick_inhaled pulls it in
(obj_pull_step: the X velocity gains $2A / 256 toward Kirby every frame, the Y velocity is 32 times the height above or
below him) until it is less than 10 pixels from him on X; then the score (3F:E3A7), inhale_caught + 1, inhale_coming - 1
and the object is freed. The reaction "hit points gone" starts obj_s_beaten: six frames of shaking (obj_s_shake: the
draw routine 3E:DDE7, obj_shake_step sets whole-pixel velocities from obj_shake_vx / obj_shake_vy), sound $2E, and the
burst obj_s_burst2 of 30:85E8 from one of four random first poses for 14, 14, 10 or 9 frames (obj_burst_pose). The
other ends a record or a script can name: a puff of 30:8A81 (obj_s_puff, after the shake obj_s_puff_shake, or after a
shake that keeps the tick routine obj_s_puff_keep, or obj_s_shake_puff), the star burst of 30:8AA2 (obj_s_star: three
rounds of eight poses; obj_s_star_shake, obj_s_star_hit and obj_s_star_timed with a hit test of their own,
obj_s_fx_burst with two of Kirby's effects first), and the end of a boss (obj_s_boss_burst: every other object of the
slots 9-17 freed, eight pieces of type $0D with variable 0 = $0C, one per direction, and the star burst). A piece runs
obj_s_piece; obj_tick_piece gives it the velocity of its direction (variable 1 = 0-7, an eighth of a turn each),
halved when its count (variable 2, 0 in its first frame) reaches 7, 13 and 19 (not 0: the last speed is 0.625 or 0.5 pixels per frame). obj_s_water is the script obj_water_test2 gives an object in
water (it goes on in bank 24). obj_s_trail follows the object in its variable 5 for 33 frames and leaves a puff (type
8) every fourth frame (obj_tick_trail). obj_s_bar_fill fills a boss's hit points (variable 0) from 0 by 3 every 6
frames with a sound to $3C; in a demo it sets $3C at once. obj_s_flash is a boss's flashing palette.

Steering. obj_steer takes one step of acceleration toward obj_dir: by the eighth of the turn (obj_dir_octant and the
table obj_steer_parts) each axis is pushed toward the positive limit, toward the negative limit or toward 0, with the
steps and limits of the caller's table (four tables of eight bytes: step low, step high, limit low, limit high; the
entries 2 * obj_param and 2 * obj_param + 1 are the positive and the negative one). obj_steer_x0, obj_steer_xp and
obj_steer_xn are its three rules for the X velocity, the labels obj_steer_y0 / obj_steer_yp / obj_steer_yn the same for
Y. The step toward 0 does not stop at 0: it adds the step of the other sign once.

Creators: obj_fx (one of Kirby's effects at the object, through fx_at_object of unit en24c, only when the object is on
the screen; asm_fx for a script), asm_spawn_child / asm_spawn_child_dir (obj_spawn_child / obj_spawn_child_dir with
three operands), asm_dust (a child of type $59 with five operands and the parent's type in its variable 6).
Small helpers: obj_aim_to (3F:E012 from the current object to object Y), obj_vel_zero / obj_vx_zero / obj_vy_zero,
obj_dir_neg, obj_var4 as a second direction (obj_var4_face_kirby, obj_var4_pose, asm_vx_var4, obj_var4_neg),
obj_param_get, asm_step_fwd / asm_step_back (the X position by an operand along or against obj_dir), obj_chance4
(1 once in four), obj_walk_look (obj_walk0 and what is ahead), obj_water_test7, obj_xdist / obj_ydist (absolute world
distance between objects X and Y), obj_screen_low, obj_pick (a random index by a table of limits), obj_vel_neg.

In pictures: main@688, two enemies shaking after their hit points are gone (slots 11 and 14), and main@695 their bursts.

Open: 22:80B5-80FB never ran (no movie); 22:80FC (dec inhale_coming, 2 runs) is described, not modelled. Paths that
never ran: obj_walk_look's answer 3 (22:96A2), the carry into the high byte in asm_vx_var4, asm_dust and
asm_step_fwd (22:90A9, 22:95E5, 22:8C39), obj_steer's carries at 22:8878 / 22:888C, obj_water_test7 finding water
(22:83B4: by the code the object gets obj_s_water and carry set). What 3F:E3A7 does with the inhaled object's variable
0, what 3F:E012 computes beyond the side (only the sides and the multiple of 4 are checked), what the asm routines
3E:DE45, 3E:DFE5, 3E:DF38 and 3E:DFFB of obj_s_flash do (palette records 22:83F3 and 22:83FF), the script 22:8226 to
22:822F (part of obj_s_boss_burst) beyond its loop counts, 22:846C (obj_s_bar_fill as a task, 3 runs).
Bank 22 code not taken in this round (what the listing shows): 22:8542 (both velocities negated: obj_vel_neg is
named but only modelled by its writes), 22:8665 / 22:8679 are named; 22:86C5 and 22:8777 (a time or speed from a
direction and a distance through div_recip); 22:883F (pose 0 / 1 by the sign of variable 2); 22:8860 (obj_face_kirby
reversed); 22:89F3 (camera limits = the camera's place, Kirby's limits inside it); 22:8A5D, 22:8A6C, 22:8AC6 (callers
of obj_pos_off); 22:8AF3 (frees every other object of the slots 9-17); 22:8B24; 22:8B35 (a 16-bit division);
22:8B61 / 22:8BC0; 22:8CD9 (Y velocity 0); 22:8D21 / 22:8D2D / 22:8D3B / 22:8D84 / 22:8DDC (the object's state saved
in $0798-$07A4 and brought back, a shake by a table); 22:8E56, 22:8E7E, 22:8EB5, 22:8F1E, 22:8F32 / 22:8F69,
22:8FA2, 22:8FC6 / 22:8FCE / 22:8FD2, 22:9009; 22:917C; 22:91A9 / 22:91B8 / 22:91D8; 22:924B; 22:9282; 22:92B1;
22:932F / 22:9340; 22:93FA; 22:9498; 22:963B (a blink by obj_frame); the tables 22:9F68, 22:9F79, 22:9F8A (by a
block's shape, read by enemy code)."""

# ================================================================== the inhaled object

[[script]]
at = "22:8003"
name = "obj_s_inhaled"
desc = "What every enemy runs when the inhale has caught it (the reaction 'inhaled' of its hit record): the position routine 3E:D97D, obj_pos_rel_kirby (its position becomes the distance from Kirby), the move routine 3E:D86B, the tick routine obj_tick_inhaled, velocity 0, and the thread halts."

[[sym]]
at = "22:8012"
name = "obj_tick_inhaled"
desc = "Tick routine of obj_s_inhaled. obj_pull_step; when it answers carry set (less than 10 pixels from Kirby on X): 3F:E3A7 (the score, unit hit) with A = object variable 0 and X = inhale_caught, inhale_caught + 1, inhale_coming - 1, and the object is freed (obj_free)."

[[sym]]
at = "22:802E"
name = "obj_pull_step"
desc = """One frame of the pull toward Kirby for an object whose position is relative to him. When the absolute value of
the low byte of the X position (as a signed byte) is below 10: carry set and nothing written. Otherwise the 16-bit X
velocity gains $002A (position negative: Kirby is to the right) or -$002A (position 0 or more), and the Y velocity
becomes 32 times the absolute value of the low byte of the Y position, negative (up) when that byte is 0 or more and
positive when it is negative; carry clear. The absolute value of a negative Y is one more when the X addition carried
(the code adds 1 with the carry of the X velocity's high byte)."""
out = "carry set: arrived; X = the current object"
comments = { "803B" = "10 pixels or more: pull", "805F" = "no clc: the carry of the X velocity is added" }

[[sym]]
at = "22:8090"
name = "obj_pos_rel_kirby"
desc = "The position of the current object = its world position minus Kirby's (slot 1), X and Y, 16 bits each."
out = "X = the current object"

[[sym]]
at = "22:80FC"
name = "obj_inhale_drop"
desc = "inhale_coming - 1: an object takes itself off the count of what is on its way to Kirby's mouth (2 runs, main@65679)."

