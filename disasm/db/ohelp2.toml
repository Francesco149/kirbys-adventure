# ================================================================== models

[[model]]
name = "ohelp2_model"
code = '''
def o2_rb(romrd, ad):
    # the one ROM byte the call read at CPU address ad outside bank 22, or None
    c = {v for k, v in romrd.items() if k & 0x1FFF == ad & 0x1FFF and k >> 13 != 0x22}
    return c.pop() if len(c) == 1 else None

def o2_w(d, lo, hi):
    return d[lo] | d[hi] << 8

def o2_vx(d, o):
    return d.get(0x60E0 + o, 0) | d[0x60F2 + o] << 8

def o2_vy(d, o):
    return d.get(0x6104 + o, 0) | d[0x6116 + o] << 8

def o2_same(rd, wr, lo, hi, v):
    # the 16-bit value at lo / hi after the call is v (a low byte the call neither read nor wrote is not compared)
    h = wr.get(hi, rd.get(hi))
    l = wr.get(lo, rd.get(lo))
    return h == v >> 8 and (l is None or l == v & 0xFF)

def o2_steer_ok(rd, wr, romrd, base, o):
    vx, vy, sx, sy = o2_steer(rd, romrd, base, o)
    return (o2_same(rd, wr, 0x60E0 + o, 0x60F2 + o, vx) and o2_same(rd, wr, 0x6104 + o, 0x6116 + o, vy)
            and (wr[0x11], wr[0x12]) == (sx, sy))

def o2_axis(v, mode, base, y, romrd):
    # one axis of obj_steer: mode 0 toward 0, 1 toward the positive limit, 2 toward the negative limit
    # -> (new velocity, sign of the step)
    rb = lambda i: o2_rb(romrd, base + i)
    step = lambda i: rb(i) | rb(8 + i) << 8
    lo, hi = v & 0xFF, v >> 8
    if mode == 0:
        if v == 0:
            return v, 0
        if hi < 0x80:
            return v + step(y + 1) & 0xFFFF, -1
        return v + step(y) & 0xFFFF, 1
    if mode == 1:
        if hi >= 0x80 or hi < rb(24 + y) or lo < rb(16 + y):
            return v + step(y) & 0xFFFF, 1
        return v, 0
    y += 1
    if hi < 0x80:
        return v + step(y) & 0xFFFF, -1
    lh = rb(24 + y)
    if hi < lh:
        return v, 0
    if hi != lh or lo > rb(16 + y):
        return v + step(y) & 0xFFFF, -1
    return v, 0

O2_PARTS = [(0, 2), (1, 2), (1, 0), (1, 1), (0, 1), (2, 1), (2, 0), (2, 2)]

def o2_steer(rd, romrd, base, o):
    y = 2 * rd[0x784 + o] & 0xFF
    xm, ym = O2_PARTS[rd[0x61DC + o] >> 5]
    vx, sx = o2_axis(o2_vx(rd, o), xm, base, y, romrd)
    vy, sy = o2_axis(o2_vy(rd, o), ym, base, y, romrd)
    return vx, vy, sx & 0xFF, sy & 0xFF

def o2_pull(rd, o):
    # obj_pull_step -> None (arrived) or (X velocity, Y velocity)
    xl = rd[0x82 + o]
    ax = xl if xl < 0x80 else (xl ^ 0xFF) + 1 & 0xFF
    if ax < 10:
        return None
    add = 0xFFD6 if xl < 0x80 else 0x002A
    old = o2_vx(rd, o)
    lo = (old & 0xFF) + (add & 0xFF)
    hs = (old >> 8) + (add >> 8) + (lo >> 8)
    vx = (hs & 0xFF) << 8 | lo & 0xFF
    yl = rd[0xB8 + o]
    m = yl if yl < 0x80 else (yl ^ 0xFF) + 1 + (hs >> 8) & 0xFF
    v = m << 5
    vy = v if yl >= 0x80 else -v & 0xFFFF
    return vx, vy

O2_SHAKE_VX = [2, 0xFE, 0xFE, 2, 2, 0xFE, 0xFE, 2, 2, 0xFE, 0xFE, 2]
O2_SHAKE_VY = [1, 0xFF, 0, 1, 0xFF, 0, 0xFF, 1, 0, 0xFF, 1, 0]
O2_BURST_POSE = [0x01, 0x10, 0x2A, 0x35]
O2_BURST_N = [0x0E, 0x0E, 0x0A, 0x09]
O2_UNTIL = [6, 12, 18, 255]
O2_SPEEDS = {0x82B2: [0x600, 0x300, 0x180, 0xA0], 0x82BA: [0xFA00, 0xFD00, 0xFE80, 0xFF60],
             0x82C2: [0x400, 0x200, 0x100, 0x80], 0x82CA: [0xFC00, 0xFE00, 0xFF00, 0xFF80], 0x82D2: [0, 0, 0, 0]}
O2_VXT = [0x82D2, 0x82C2, 0x82B2, 0x82C2, 0x82D2, 0x82CA, 0x82BA, 0x82CA]
O2_VYT = [0x82BA, 0x82CA, 0x82D2, 0x82C2, 0x82B2, 0x82C2, 0x82D2, 0x82CA]

def o2_piece(c, d):
    i = next(k for k in range(4) if c <= O2_UNTIL[k])
    return O2_SPEEDS[O2_VXT[d]][i], O2_SPEEDS[O2_VYT[d]][i]

def o2_arg(rd, romrd, i):
    # byte i after the asm opcode (the scripts that call these helpers are not in bank 22 alone)
    ad = (rd[0x1E] | rd[0x1F] << 8) + i
    c = {v for k, v in romrd.items() if k & 0x1FFF == ad & 0x1FFF}
    return c.pop() if len(c) == 1 else None
'''

