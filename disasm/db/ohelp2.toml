desc = "The X velocity toward its positive limit: the step of entry Y is added and $11 + 1 unless the velocity is not negative, its high byte is at least the limit's high byte and its low byte at least the limit's low byte."
in = "Y = 2 * obj_param; $00-$07 the tables"

[[sym]]
at = "22:897D"
