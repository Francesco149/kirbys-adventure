use = ["en_more_model"]
model = '''
def pull_ok(rd, wr, mem, ran):
    b = rd[0x0784]
    if ran('2D:B3E0'):
        return abs(rd[0x6075] - rd[0x6074 + b]) < 0x0A and wr[0x6050 + b] == 0x80 and em_script(wr, 0x2D, 0xA349) and em_script(wr, 0x2D, 0xA3C7)
    vx = (rd[0x60E1] | rd[0x60F3] << 8) + 0x1E
    if (mem(0x60E1) | mem(0x60F3) << 8) != vx:
        return False
    wx = (rd[0x6075] | rd[0x6087] << 8) * 256 + rd[0x71]
    nx = wx + vx
    return (mem(0x6075) | mem(0x6087) << 8) == (nx >> 8) & 0xFFFF
'''
expect = "pull_ok(rd, wr, mem, ran)"
cases = { "ran('2D:B3E0')" = 1 }

