unit = "boss_cov3"
title = "The bosses' moves the third batch of movies ran: banks 29, 2A, 2D and 2F"
summary = """
The code, scripts and small tables of the enemy banks 29, 2A, 2D and 2F that ran for the first time in the third batch
of coverage movies (cov3-*). Each name follows the unit of its object type (en29, en2a, en2d, en2f, en_more); most of
it ran once, in one movie, so most claims hold one stretch of frames.

Type $4B (unit en29, the 4-4 mid-boss with the round shell; cov3-a-turtle from frame 53183): its grab, its spin and
its throw, and the three attacks e4b_pick had never chosen. A touch (e4b_touch) starts e4b_grab: Kirby gets the
script e4b_held (each frame e4b_hold_kirby puts him 6 pixels below the holder's position), the turtle takes the grip
pose $34 and after $1A frames e4b_throw_kind probes six points beside it for walls; the answer 2 (a wall behind it)
starts e4b_spin: it spins on the spot (e4b_tick_spin: X velocity variable 8 toward its facing, $19 faster every 16
frames up to $EF, the pose wait in variable 6 one shorter each time) for $80 frames, then e4b_throw gives Kirby the
script e4b_kirby_thrown: e4b_throw_kirby throws him at $0400 (by variable 4), e4b_kirby_flown bounces him off a wall
($0100 back, -$0300 up, the effect $0C), the OUCH card and 8 points of hp as in the beetle's slam. Attack 1
(e4b_jump_at) is a jump at Kirby; attack 2 (e4b_leaps) one or three leaps on the spot (e4a_leaps); attack 3
(e4b_leap) a leap high that hangs (e4b_tick_hang, gravity $20) for e4b_hang_times frames, then e4b_drop_shell lets a
small shell fall: a type $4B with variable 0 = 1 (e4b_shell: the pose table 32:9E4E, e4b_shell_tick_fall, then
e4b_shell_bounce with e4b_shell_tick, bouncing at -$0300 until a wall ends it through obj_s_beaten).
Type $4A (unit en29, Bugzzy; cov3-a-bugzzy): the throws 3 and 1 of e4a_grab (e4a_throw_3, e4a_throw_1: up at
-$0400 until it falls, e4a_rising; down at $0400 with no gravity, e4a_fall_0; the slam; a bounce back with
e4a_fall_2f) and the charge into a wall (e4a_bounce with its tick routine e4a_tick_bounce).
Type $4E (unit en29, the last boss's second form; cov3-a-wizard, cov3-c-rodwiz): attack 0's thread e4e_stars (five
objects of type $60 in a fan), attack 3's steer at Kirby after its 60 frames (e4e_steer_x), and the end of attack 1
(e4e_dive_end). Type $60 (e60_*): a star that flies out at the speed of e60_speed_hi / e60_speed_lo along its obj_dir
for 255 frames and bursts (e0d_start with variable 0 = 9) at a wall or a floor. Type $61 (unit en29): what it throws
in attack 1 now ran its rounds: each round e61_star sends a type $60 star in a direction from e61_star_dirs, and
e61_done sends the boss on to e4e_dive_end.
Type $6F (unit en29, the Big Switch; cov3-a-switch): being hit (e6f_hit) and e6f_press, which leaves the room.
Bank 2A, type $4D (unit en2a, the 7-2 mid-boss; cov3-b-e4d): the states 2-5, 8, 9, $0B-$0E of its state machine:
e4d_hop3 (one or three hops at Kirby), e4d_lunge2 (two double lunges), e4d_flame_a and e4d_burn (a burning dash
after a jump), e4d_pounce_far, e4d_catch (it catches Kirby, jumps and lands on him six times: he gets the beetle's
scripts e4a_held, e4a_kirby_slammed and e4a_kirby_thrown), e4d_random_state with e4d_random_states, the leap of
e4d_pounce (e4d_leap) and the shock stars of its landing (e4d_land_stars). Type $4F (unit en2a): the entries $0D
and $0E of e49_scripts (e4f_hop_back, e4f_hops) with their tick routines. Type $1C (unit en2a): the landing after
the reappearance (e1c_land_run, e1c_tick_dash) and its run off a ledge (e1c_fall, e1c_tick_drop). Type $49 (unit
en2a): entry 7 of e49_scripts' tick routine e49_tick_toss and the speeds of the small wheel by slope.
Bank 2D, type $47 (unit en_more, the last boss in the red robe; cov3-c-dedede): the inhale running out
(e47_inhale_out) and catching Kirby (e47_inhale_caught): Kirby gets e47_kirby_caught (pulled into the mouth by
e47_kirby_pull), the boss e47_swallow, then e47_spit creates a type $47 with variable 0 = 3 (e47_star: Kirby spat out
as a star at $0400, which puts him back with e47_kirby_spat: 8 points of hp, and here his death).
Bank 2F, the orb (type $3F, unit en2f; cov3-c-rod): the states 4 (e3f_rise) and 5 (e3f_idle) of e3f_tick at the end
of the fight.

Open:
- Type $4B: the bits behind and in front at once in e4b_throw_kind (its answer 0 entering 29:A8BE directly, the answer
  3 with the script 29:A94B-29:A986 and the random 6 or 7 ran in cov5-i-shell: e4b_throw_3 of unit en_cov5); the answer 1 (e4b_throw_1, unit boss_cov4), its random choice when no
  probe met a wall (29:AB44), the facing right in it and in e4b_throw_kirby (29:AD88) and kirby_form 1 in
  e4b_throw_kirby, e4b_pose_arg and e4b_grab_args ran in cov4-a-turtle; the landing of e4b_kirby_flown (only a wall ran), Kirby's death in
  e4b_kirby_thrown (29:AD23), the bounce of e4b_tick_spin's fall (29:ACA5), the entries 1-3 of e4b_shell_vx_a /
  e4b_shell_vx_b / e4b_shell_vy and e4b_jump_at_vx; the hit tests of e4b_tick_hang and e4b_tick_leaps were never
  hit (29:AC3B, 29:AC4D).
- Type $4A: e4a_tick_bounce's wall and ceiling (29:A4FF, 29:A508); e4a_throw_1 entered directly (only through
  e4a_throw_3).
- Type $60: variable 0 with bit 7 set (29:B9D2) ran only in cov4-a-wiz: e60_launch (unit boss_cov4); the grandparent's variable 9 = 2 (29:B9F1), its life running out
  (29:BA26-29:BA59), the hit test answering carry; what the slot read through two variables 2 is for the stars of
  e4e_stars (the boss's variable 2 is $35 there) is not known. e61_done with the boss's variable 9 not 0.
- Type $4D: the states $0A (2A:A5EF), the far path of e4d_pounce_far (2A:A641), e4d_flame_a's second half
  (2A:A522), e4d_burn's other branch (2A:A55F), e4d_hop3's landing inside the 8 frames (2A:A422), e4d_catch facing
  right (2A:A7E2) and kirby_form 1 in e4d_grip_pose.
- Type $1C: the wall of e1c_tick_dash (entry 9, 2A:BC79) and the landing of e1c_tick_drop (entry $0A, 2A:BC5B).
- Type $4F: e4f_tick_hop_back's count and landing (2A:B5CA, 2A:B5E5); e4f_hop_back's end (2A:B1BC).
- Type $47: e47_kirby_caught with kirby_form not 0 (2D:A3C4). Ran only in cov4-a-ddd, with a sentence in their
  entries here: e47_kirby_caught facing left (2D:A3BC), e47_star facing left (2D:A5FF, 2D:B0E2), the end of
  e47_swallow (2D:A387) and e47_swallow_tick's variable 5; e47_kirby_spat with hp left (2D:A3D8) with e47_spat_vx and
  Kirby's tick routine e47_spat_done after it is documented in unit boss_cov4.
"""

