name = "boss_cov3_model"
code = '''
def bc_grav(v, a, lim=3):
    """obj_gravity_ax: v + a, and exactly lim pixels per frame once the high byte reaches lim."""
    v = (v + a) & 0xFFFF
    return lim << 8 if ((v >> 8) - lim) & 0xFF < 0x80 else v

def bc_vy(m, x):
    return m(0x6104 + x) | m(0x6116 + x) << 8

def bc_rvy(rd, x):
    return rd[0x6104 + x] | rd[0x6116 + x] << 8
'''

