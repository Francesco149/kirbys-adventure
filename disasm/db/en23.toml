name = "e06_cam_restore"
desc = "Undoes e06_warp_setup by e06_lock_kind[variable 5]: 0 puts cam_end_x and kirby_max_x back from warp_cam_save, 1 cam_min_y and kirby_min_y."

[[sym]]
at = "23:A328"
name = "e06_free_low"
desc = "obj_free for every object of the slots 0-8 that exists (Kirby's slot 1, his effects and shots)."

[[sym]]
