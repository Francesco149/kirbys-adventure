def e23_demo_tick_ok(rd, wr, ran, mem):
    s = rd[0x6E]
    y = rd[0xE1] << 16 | rd[0xE0] << 8 | rd[0xDF]
    vy = e23_s16(e23_w(rd, 0x6104 + s, 0x6116 + s))
    n = (y + vy) & 0xFFFFFF
    if n & 0x800000:
        n = 0
    elif rd[0x61CA + s] and rd[0x6116 + s]:
        v0 = rd[0x61CA + s]
        n = (n + (0x100 if v0 < 0x80 else -0x100)) & 0xFFFFFF
        k = (v0 & 0x7F) - 1
        if wr[0x61CA + s] != (0 if k == 0 else k | (v0 & 0x80)):
            return False
    if (mem(0xE1) << 16 | mem(0xE0) << 8 | mem(0xDF)) != n:
        return False
    if mem(0xCA + s) & 0x80:
        return e23_script(wr, 0xAE46) and not ran('23:B354')
    return ran('23:B354') > 0
'''
