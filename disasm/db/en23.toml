def e23_follow_cam_ok(rd, wr):
    if 0xDD in wr or 0xDE in wr:
        return False
    if (rd[0xB9] - rd[0xE0]) & 0xFF < 0x60:
        return 0xE0 not in wr and 0xE1 not in wr
    c = (e23_w(rd, 0xB9, 0xCB) - 0x60) & 0xFFFF
    end = e23_w(rd, 0x05C6, 0x05C7)
