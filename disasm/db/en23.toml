about = ["e06_start", "e06_warp", "e06_cannon", "e0b_fuse"]
text = "In the tables of unit rooms (13:A9D2 type, 13:AAD2 variables 0 and 1 as low and high nibble) the kinds $F0-$FA are type $06 and $FB type $0B: $F0-$F6 with variable 0 = 1 and variable 1 = 0-6, $F7 / $F8 with variable 0 = 0 and variable 1 = 0 / 1, $F9 / $FA with variable 0 = 6 and variable 1 = 0 / 1, $FB with 0 and 0."
