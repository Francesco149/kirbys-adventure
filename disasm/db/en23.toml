name = "e06_warp_spin"
desc = "The warp star's four poses $10-$13, 8 frames each, for ever."

[[script]]
at = "23:A032"
name = "e06_warp_leave"
desc = """
Started by e06_tick_pan when the rider has ended (variable 2 not 0): no pose ($FF), velocity 0, e06_fade_out_wait
