desc = """
First script of object type $06: maps bank 22 (set_bank) and jumps by variable 0 through a table of ten: 0 e06_warp,
1 23:ADAB (never ran), 2 e06_rod, 3 e06_flight, 4 e06_arrive (Kirby's object enters there from kirby_s_start, no
object of type $06 started with 4), 5 e06_sparkle, 6 e06_cannon, 7 e06_burst, 8 23:A791 (never ran), 9 e06_glint.
"""

# ================================================================= variable 0 = 0: the warp star

[[script]]
at = "23:A01A"
name = "e06_warp"
desc = """
The warp star at the end of a stage (kinds $F7 / $F8; main@3330, on the fence at the right). Bank 22, the position
routine obj_pos_camera, the pose table 1C:9CD7, e06_warp_setup, tick routine e06_warp_tick, and on into e06_warp_spin.
"""

[[script]]
