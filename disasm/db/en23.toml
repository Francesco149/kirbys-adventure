[[sym]]
at = "23:A20F"
name = "e06_warp_setup"
desc = """
For e06_warp. In the attract movie (demo_active) nothing. In world 5 the star is put at X $01A8, Y $0030 (both
position and world position) with the position routine obj_pos_camera (once, main@91354). Variable 5 = world * 2 + 1
+ variable 1 (the flight's number). By e06_lock_kind[variable 5]: 0: cam_end_x and kirby_max_x go to warp_cam_save,
