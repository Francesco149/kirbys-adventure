[[sym]]
at = "23:A043"
name = "e06_warp_tick"
desc = """
Tick routine of the warp star. Off the screen (obj_on_screen carry set) and world not 5: the script e06_warp_gone.
Otherwise e06_near with the Y offset 0 and half sizes 8 x 8; Kirby not there: nothing more. Touched: e06_free_low (the
slots 0-8, Kirby's object too), sound $13, e06_puff_others; in the attract movie (demo_active) the script
e06_demo_warp of the current thread and nothing more. Otherwise e06_cam_restore; with n = variable 5 (the flight's
number from e06_warp_setup): warp_arrival and hit_kirby_off = e06_next_arrival[n], variables 4 and 3 =
e06_pan_index[n] (= n), obj_dir = 0, a new object of type $06 (obj_spawn_child_dir) with variable 0 = 3 and variable
1 = n (the rider, e06_flight), its slot in variable 7; the star's script becomes e06_cam_pan (23:B0FA) and
kirby_pal_set (21:9CB3, a far call) gives Kirby his palette.
"""
comments = { "A046" = "off the screen", "A04E" = "Kirby within 8 x 8?", "A05F" = "the attract movie", "A069" = "variable 5: the flight", "A08B" = "the rider: type $06, variable 0 = 3", "A09C" = "the star becomes the camera" }

[[sym]]
at = "23:A148"
name = "e06_near"
desc = """
Is Kirby at the current object? With the point = its world position, Y moved by the signed A: carry clear when |the
16-bit Y distance from Kirby's world Y| is below 256 and below Y + hit_body+2 ($050B, Kirby's height: unit hit) and
|the 16-bit X distance between the world X positions| is below 256 and below X + 4; carry set otherwise. Used by
e06_warp_tick, e06_rod_tick, e06_rod_tick_last and e06_cannon_tick.
"""
in = "A = signed Y offset; X = half width; Y = half height"
out = "carry clear: Kirby is there; X = cur_object; $00-$03, $11, $12 used"

[[sym]]
at = "23:A1C1"
name = "e06_puff_others"
desc = "For every object of the slots 9-17 that exists and is not the current one: obj_bank = $22 and the script 22:82DC (bank 22's puff in which an enemy vanishes)."

[[sym]]
at = "23:A1E7"
name = "e06_puff_type"
desc = "The same as e06_puff_others for the objects of type A only (e06_rod_tick passes 5); the type never matched in any movie."
