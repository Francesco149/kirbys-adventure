[[claim]]
id = "en23.tables"
about = ["e06_start", "e06_pan_index", "e06_lock_kind", "e06_next_arrival", "e06_cam_pan", "e06_flight", "e06_arrive", "e06_burst_vx_lo", "e06_burst_vx_hi", "e06_burst_vy_lo", "e06_burst_vy_hi", "e06_burst_dx_lo", "e06_burst_dx_hi", "e06_burst_dy_lo", "e06_burst_dy_hi", "e06_rod_centre", "e06_rod_pal_lo", "e06_rod_pal_hi", "e06_hub_rooms"]
text = "The tables of bank 23 hold the literals of en23_model: the ten targets of the jump table at 23:A004, e06_pan_index 0-14, e06_lock_kind, e06_next_arrival (22 bytes), the 22 targets of the jump tables at 23:B10D (pans) and 23:B323 (flights), the five at 23:B0E1 (arrivals), the burst's velocities and offsets, e06_rod_centre, the palette addresses of e06_rod_pal_lo / _hi and e06_hub_rooms."
kind = "static"
use = ["en23_model"]
model = '''
def e23_tab(u8, at, n):
    o = O(at)
    return [u8(o + 2 * i) | u8(o + 2 * i + 1) << 8 for i in range(n)]

def e23_split(u8, lo, hi, n):
    return [u8(O(lo) + i) | u8(O(hi) + i) << 8 for i in range(n)]

def e23_static(u8):
    return (u8(O('23:A004')) == 0x0F and u8(O('23:A005')) == 10 and e23_tab(u8, '23:A006', 10) == E06_START
        and [u8(O('e06_pan_index') + i) for i in range(15)] == E06_PAN_INDEX
        and [u8(O('e06_lock_kind') + i) for i in range(15)] == E06_LOCK
        and [u8(O('e06_next_arrival') + i) for i in range(22)] == E06_NEXT
        and u8(O('23:B10E')) == 0x16 and e23_tab(u8, '23:B10F', 22) == E06_PAN
        and u8(O('23:B324')) == 0x16 and e23_tab(u8, '23:B325', 22) == E06_FLIGHT
        and u8(O('23:B0E2')) == 5 and e23_tab(u8, '23:B0E3', 5) == E06_ARRIVE
        and e23_split(u8, 'e06_burst_vx_lo', 'e06_burst_vx_hi', 8) == E06_BURST_VX
        and e23_split(u8, 'e06_burst_vy_lo', 'e06_burst_vy_hi', 8) == E06_BURST_VY
        and e23_split(u8, 'e06_burst_dx_lo', 'e06_burst_dx_hi', 4) == [v & 0xFFFF for v in E06_BURST_DX]
        and e23_split(u8, 'e06_burst_dy_lo', 'e06_burst_dy_hi', 4) == [v & 0xFFFF for v in E06_BURST_DY]
        and [u8(O('e06_rod_centre') + i) for i in range(8)] == E06_ROD_CENTRE
        and e23_split(u8, 'e06_rod_pal_lo', 'e06_rod_pal_hi', 7) == E06_ROD_PAL
        and [u8(O('e06_hub_rooms') + i) for i in range(7)] == E06_HUB_ROOMS)
'''
expect = "e23_static(u8)"

