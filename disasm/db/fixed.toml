unit = "fixed"
title = "The fixed banks' remaining code: directions and velocities, script helpers, the object lists' guards"
summary = """The code of the fixed banks 3E and 3F that the other units used by address: arithmetic of directions,
the small routines that scripts call (asm_w targets), far-call wrappers, the lists of objects taken once, and the
handlers of the four probes.

Directions and velocities. A direction has 256 steps to a turn (0 up, $40 right, $80 down, $C0 left), as obj_dir.
dir_to_point gives the direction from one 16-bit point to another in 64 steps (a multiple of 4): the absolute
differences, both shifted until they fit a byte, q = 256 * |dx| / |dy| through div_recip, and the number of the
16 thresholds dir_tan_lo / dir_tan_hi (256 * tan) that q reaches picks the step inside the quarter that the two signs
select (dir_quad_base). vel_from_dir turns a direction and a speed into two velocities: speed * |sin| and speed *
|cos| from polar_tab (80 words of 256 * |cos| of n 64ths of a turn) by mul16 (16 x 16 -> 32 bits), the low byte
dropped, the signs from the quarter. asm_speed_dir / speed_dir_set put that velocity for the object's obj_dir into the
object, asm_vx_dir only an X velocity along the facing.

Script helpers (an asm_w instruction names the routine; its operand bytes follow the instruction, read through
script_arg or (script_ptr),Y, and A on return becomes the thread's register): sound and song (asm_snd, asm_music);
object creation from operand bytes (asm_spawn_any / asm_spawn / asm_spawn_slot into asm_spawn_args: slots, type, dx,
dy, dz, variable 0, direction offset); asm_free, objs_free_others, objs_freeze_others / objs_thaw_others (bit 7 of
obj_tick_bank stops an object), asm_obj_script, asm_ppu_record, asm_ppumask_or, asm_palette, asm_wait_eq (waits a frame
at a time until a byte has a value), asm_mem_sub and asm_random (a value for jeq / jne), asm_scroll_add /
scroll_add_clear (the shake of the screen), asm_hud_card, asm_kirby_script / kirby_script_far / kirby_knock_back
(Kirby gets a script), kirby_hit_resume (his script goes on after a hit stop), asm_13_a778. Wrappers that map a
bank and call: hit_test_far (every object that can be hit, once per frame), hit_interrupt_far, score_far,
bg_palette_fixed, room_extra_done_fixed. kirby_inhaling_obj answers whether Kirby's inhale holds something;
kirby_inhale_blocks tries nine points in front of him for a block to take (13:A93D).

Taken objects. Items and 1-ups that Kirby took do not come back: item_taken enters the item's index in the room's
object list and the room in one of eight lists (taken_idx, taken_room, from taken_start to taken_end; list `world` for
the 1-up, list 7 for the rest), objs_spawn_ok answers objs_spawn whether an object may be created and keeps the boss
objects of the room in boss_list; taken_reset empties the lists. The experiment fixed.taken.effect shows an entry
keeping an item away; in the corpus no object was ever refused.

Also: star_burst_spawn (the puff where a room's extra puts blocks back), split_pause / irq_pause (the screen split of
the pause screen, split_mode 4), tile_attr_set (a palette for a 16 x 16 field of the name tables), obj_script_pick (a
script by A from a table behind the jsr), three move routines that move the camera too (obj_move_cam_screen,
obj_move_cam_world, obj_move_cam_y), sprites_draw_chr (a draw routine whose data starts with a CHR bank),
sprite_bufs_hide, mirror_vert. The 52 small handlers of the probes (probe_*_h1 ...) are named here as parts of the
code of unit probes; each is one formula over the point's column and row in its block, checked against the probe's
answer.

Open: dir_to_point's first shift loop (|dx| of 256 or more: two calls in main@100646) has its slip modelled, not
explained; what the bits of $05E9 mean (kirby_inhale_blocks tests bit 7); 13:A93D and 13:A778 themselves; scans of
kirby_inhale_blocks that stop early (13:A93D answering carry set: 4 calls in the corpus) are not in the windows;
objs_spawn_ok's two refusals (3F:EAB3, 3F:EB0B: carry set) never ran in the corpus (only the experiment), nor a boss
let through without an arena in the windows; why kinds $49 and $92 count as taken as soon as they are created, and
what kinds $17-$19 are; tile_attr_set's path for horizontal mirroring (3E:CA4F) never ran; what $05FC = 2 means for
kirby_script_far; never-ran bytes between the routines (3E:DEF1-DF05, 3E:DF44-DF4A, 3E:DF55-DF60, 3E:DFB6-DFDE: more
asm helpers of the same kind) are not described."""

# ================================================================== directions and velocities

[[sym]]
at = "3F:E012"
name = "dir_to_point"
desc = """The direction from point 1 ($00/$01 = X, $02/$03 = Y, 16 bits each) to point 2 ($04/$05, $06/$07), in 64 steps
of a turn returned as a multiple of 4 in obj_dir's measure (0 up, $40 right, $80 down, $C0 left). dx = X2 - X1 and
dy = Y1 - Y2 go to $08/$09 and $0A/$0B as absolute values; the two signs pick the quarter (dir_quad_base). When the
high byte of |dx| is not 0, both are shifted right until it is (the loop shifts $0B twice and rotates its low bit
into bit 7 of $0B instead of shifting $0A: a slip in the code that only matters for distances of 256 pixels and
more); then the same for the high byte of |dy|, which shifts both. With the low byte of |dy| zero the step is 16
(across); otherwise q = div_recip(|dx| * 256, |dy|) (about 256 * |dx| / |dy|) and the step is the number of the 16
thresholds of dir_tan_lo / dir_tan_hi (256 * tan of 2.8, 8.4, ... degrees) that q reaches, 0-16, counted from the
top. Right of point 1 and above or level the direction is 4 * step; right and below 4 * (32 - step); left and below
4 * (32 + step); left and above 4 * (64 - step), modulo 256. X and Y are kept."""
in = "$00-$03 = point 1 (X, Y), $04-$07 = point 2 (X, Y), 16 bits each, low byte first"
out = "A = $10 = the direction, a multiple of 4; X, Y unchanged; $00, $08-$0B used"
comments = { "E05A" = "bit 1: X2 >= X1, bit 0: Y1 >= Y2", "E064" = "lsr $0B / ror $0B: $0A is not shifted", "E083" = "no vertical distance: across", "E090" = "count the thresholds from the top", "E0BD" = "the quarter's base" }

[[data]]
at = "3F:E0CD"
len = 4
name = "dir_quad_base"
format = "bytes"
desc = "The base of dir_to_point's quarters in 64ths of a turn, by (X2 >= X1) * 2 + (Y1 >= Y2): $20 (left, below), $30 (left, above), $10 (right, below), 0 (right, above)."

[[data]]
at = "3F:E0D2"
len = 16
name = "dir_tan_lo"
format = "bytes"
desc = "Low bytes of dir_to_point's 16 thresholds (high bytes in dir_tan_hi): 256 * tan((k - 0.5) * 90 / 16 degrees) for k = 1..16, from $000C to $145B."

[[data]]
at = "3F:E0E3"
len = 16
name = "dir_tan_hi"
format = "bytes"
desc = "High bytes of dir_to_point's 16 thresholds (low bytes in dir_tan_lo)."

[[sym]]
at = "3F:E0F3"
name = "vel_from_dir"
desc = """A velocity from a direction and a speed. A = the direction (256 to a turn, only its upper six bits count), $00/$01
= the speed (16 bits). n = A / 4; the X velocity is (speed * polar_tab word n + 16) >> 8 into $08/$09, negated for a
direction of $80 or more (left); the Y velocity (speed * polar_tab word n) >> 8 into $05/$06, negated for a direction
below $40 or of $C0 and more (up). Both products go through mul16 (the 16 bits above the low byte of the 32-bit
product are kept). $02-$07 are used."""
in = "A = direction; $00/$01 = speed"
out = "$08/$09 = X velocity, $05/$06 = Y velocity (16 bits, low byte first)"

[[data]]
at = "3F:E157"
len = 160
name = "polar_tab"
format = "rows:16"
desc = "80 words (low byte first): 256 * |cos| of n 64ths of a turn for n = 0..79, rounded ($0100, $00FE, $00FB ... $0019, 0, $0019 ...). vel_from_dir reads word n (the vertical part) from 3F:E157 and word n + 16 (the horizontal part, |sin|) from 3F:E177. Three entries differ by one from their mirror images ($A3 / $A2, $4B / $4A, $EC / $ED)."

[[sym]]
at = "3F:E1F7"
name = "mul16"
desc = "16 x 16 -> 32 bit multiply: $04-$07 = ($00/$01) * ($02/$03), low byte first, from four calls of mul8."
in = "$00/$01, $02/$03 = the factors"
out = "$04-$07 = the product"

[[sym]]
at = "3F:E23C"
name = "asm_speed_dir"
desc = "For a script (asm_w with a word operand): $00/$01 = the two bytes after the instruction (a speed, 8.8 pixels per frame), then falls into speed_dir_set."

[[sym]]
at = "3F:E247"
name = "speed_dir_set"
desc = "Both velocities of the current object from vel_from_dir with its obj_dir and the speed in $00/$01: obj_vx = $08/$09, obj_vy = $05/$06. Then script_ptr + 2 (past a word operand). Also the end of the asm routine 22:8B61 (a speed from a table by obj_param)."
in = "$00/$01 = speed"
out = "X = the current object"

[[sym]]
at = "3F:E26A"
name = "asm_vx_dir"
desc = "For a script (asm_w with a word operand): the X velocity of the current object = the word after the instruction, negated when obj_dir has bit 7 set (faces left); script_ptr + 2. The Y velocity is not touched."

[[sym]]
at = "3F:E265"
kind = "label"
name = "asm_skip_word"
desc = "script_ptr + 2 (script_skip with A = 2): the end that speed_dir_set and asm_vx_dir share."

[[model]]
name = "fixed_model"
code = '''
FX_TAN = [0x000C, 0x0025, 0x0040, 0x005B, 0x0079, 0x0099, 0x00BD, 0x00E8, 0x011A, 0x0159, 0x01AB, 0x021D, 0x02CB,
          0x03FE, 0x06BD, 0x145B]
FX_QUAD = [0x20, 0x30, 0x10, 0x00]
FX_POLAR = [0x100, 0xFE, 0xFB, 0xF5, 0xEC, 0xE2, 0xD5, 0xC6, 0xB5, 0xA3, 0x8E, 0x79, 0x62, 0x4B, 0x32, 0x19,
            0x00, 0x19, 0x32, 0x4A, 0x62, 0x79, 0x8E, 0xA2, 0xB5, 0xC6, 0xD5, 0xE2, 0xEC, 0xF5, 0xFB, 0xFE,
            0x100, 0xFE, 0xFB, 0xF5, 0xED, 0xE2, 0xD5, 0xC6, 0xB5, 0xA2, 0x8E, 0x79, 0x62, 0x4A, 0x32, 0x19,
            0x00, 0x19, 0x32, 0x4A, 0x62, 0x79, 0x8E, 0xA2, 0xB5, 0xC6, 0xD5, 0xE2, 0xEC, 0xF5, 0xFB, 0xFE,
            0x100, 0xFE, 0xFB, 0xF5, 0xEC, 0xE2, 0xD5, 0xC6, 0xB5, 0xA3, 0x8E, 0x79, 0x62, 0x4B, 0x32, 0x19]

def fx_dir(x1, y1, x2, y2):
    """dir_to_point, step by step as the code does it."""
    cdx = x2 >= x1
    cdy = y1 >= y2
    dx = abs(x2 - x1) & 0xFFFF
    dy = abs(y1 - y2) & 0xFFFF
    d8, d9, da, db = dx & 0xFF, dx >> 8, dy & 0xFF, dy >> 8
    if d9:
        acc = d9
        while True:
            c = acc & 1
            acc >>= 1
            d8 = d8 >> 1 | c << 7
            c = db & 1
            db >>= 1
            db = db >> 1 | c << 7
            if acc == 0:
                break
        d9 = 0
    if db:
        acc = db
        while True:
            c = acc & 1
            acc >>= 1
            da = da >> 1 | c << 7
            c = d9 & 1
            d9 >>= 1
            d8 = d8 >> 1 | c << 7
            if acc == 0:
                break
    if da == 0:
        step = 16
    else:
        q = d8 << 8 if da < 2 else (d8 << 8) * (256 // da) >> 8 & 0xFFFF
        step = 16
        while step and q < FX_TAN[step - 1]:
            step -= 1
    quad = (2 if cdx else 0) | (1 if cdy else 0)
    v = step
    if not cdy:
        v = 16 - v
    if not cdx:
        v = 16 - v
    return ((v + FX_QUAD[quad]) & 0x3F) << 2

def fx_w(lo, hi):
    return lo | hi << 8

def fx_vel(d, speed):
    """vel_from_dir: (vx, vy) as 16-bit values."""
    n = d >> 2
    vx = speed * FX_POLAR[n + 16] >> 8 & 0xFFFF
    vy = speed * FX_POLAR[n] >> 8 & 0xFFFF
    if d >= 0x80:
        vx = -vx & 0xFFFF
    if d < 0x40 or d >= 0xC0:
        vy = -vy & 0xFFFF
    return vx, vy

def fx_ops(romrd, k):
    """the first k ROM bytes the call read (the operand bytes of an asm instruction)"""
    return list(romrd.values())[:k]
'''

[[claim]]
id = "fixed.dir.model"
about = ["dir_to_point", "dir_quad_base", "dir_tan_lo", "dir_tan_hi"]
text = "Every call of dir_to_point in the windows returns in A and $10 the direction the model computes from the two points in $00-$07 (the absolute differences, the shifts of the code with its slip, div_recip, the count of the thresholds, the quarter), and keeps X and Y. The windows hold every quarter, the across case (|dy| low byte 0) and both shift loops."
kind = "call"
fn = "dir_to_point"
on = ["main@1000+15000", "w3-sonnet@1000+15000", "w12-sonnet@20000+15000", "main@100640+20", "main@23670+20", "w3-sonnet@52150+20", "main@14955+20", "w12-opus@7885+20"]
min_calls = 300
max_calls = 2000
use = ["fixed_model"]
cases = { "ran('3F:E026') == 0 and ran('3F:E046') == 0" = 20, "ran('3F:E026') == 0 and ran('3F:E046') > 0" = 20, "ran('3F:E026') > 0 and ran('3F:E046') == 0" = 20, "ran('3F:E026') > 0 and ran('3F:E046') > 0" = 20, "ran('3F:E083') > 0" = 5, "ran('3F:E061') > 0" = 1, "ran('3F:E071') > 0" = 2 }
expect = "ra == wr[0x10] == fx_dir(fx_w(rd[0], rd[1]), fx_w(rd[2], rd[3]), fx_w(rd[4], rd[5]), fx_w(rd[6], rd[7])) and rx == x and ry == y"

[[claim]]
id = "fixed.dir.tables"
about = ["dir_quad_base", "dir_tan_lo", "dir_tan_hi"]
text = "dir_quad_base and the thresholds in dir_tan_lo / dir_tan_hi are the model's literals, and threshold k is 256 * tan((k - 0.5) * 90 / 16 degrees) within 1.5 % for k = 1..16."
kind = "static"
use = ["fixed_model"]
model = '''
import math
'''
expect = "[u8(O('dir_quad_base') + i) for i in range(4)] == FX_QUAD and [u8(O('dir_tan_lo') + i) | u8(O('dir_tan_hi') + i) << 8 for i in range(16)] == FX_TAN and all(abs(FX_TAN[k - 1] - 256 * math.tan(math.radians((k - 0.5) * 90 / 16))) <= 0.015 * FX_TAN[k - 1] + 1 for k in range(1, 17))"

[[claim]]
id = "fixed.vel.model"
about = ["vel_from_dir", "polar_tab"]
text = "Every call of vel_from_dir in the windows leaves in $08/$09 and $05/$06 the X and Y velocity of the model: the speed in $00/$01 times polar_tab word n + 16 (X) and word n (Y), n = A / 4, the low byte dropped, negated to the left (A >= $80) and up (A < $40 or >= $C0). Directions of all four quarters are in the windows."
kind = "call"
fn = "vel_from_dir"
on = ["main@260+3000", "w3-sonnet@375+3000", "w12-sonnet@1040+2000", "main@40000+2000"]
min_calls = 300
max_calls = 3000
use = ["fixed_model"]
cases = { "a < 0x40" = 20, "0x40 <= a < 0x80" = 20, "0x80 <= a < 0xC0" = 20, "a >= 0xC0" = 20, "a & 3 != 0" = 1 }
expect = "(fx_w(wr[8], wr[9]), fx_w(wr[5], wr[6])) == fx_vel(a, fx_w(rd[0], rd[1]))"

[[claim]]
id = "fixed.polar.static"
about = ["polar_tab"]
text = "polar_tab holds the model's 80 words, and word n is 256 * |cos(n * 360 / 64 degrees)| rounded, give or take 1."
kind = "static"
use = ["fixed_model"]
model = '''
import math
'''
expect = "[u8(O('polar_tab') + 2 * i) | u8(O('polar_tab') + 2 * i + 1) << 8 for i in range(80)] == FX_POLAR and all(abs(FX_POLAR[i] - round(256 * abs(math.cos(i * math.pi / 32)))) <= 1 for i in range(80))"

[[claim]]
id = "fixed.mul16.model"
about = ["mul16"]
text = "Every call of mul16 in the windows leaves in $04-$07 the 32-bit product of the words in $00/$01 and $02/$03."
kind = "call"
fn = "mul16"
on = ["main@260+2000", "w3-sonnet@20000+2000"]
min_calls = 100
max_calls = 3000
expect = "fx_w(wr[4], wr[5]) | fx_w(wr[6], wr[7]) << 16 == fx_w(rd[0], rd[1]) * fx_w(rd[2], rd[3])"
use = ["fixed_model"]

[[claim]]
id = "fixed.speed_dir.model"
about = ["asm_speed_dir", "speed_dir_set", "asm_skip_word"]
text = "Every call of asm_speed_dir in the windows reads the two bytes after the instruction as the speed, sets the current object's X and Y velocity to vel_from_dir's answer for its obj_dir and that speed, and moves script_ptr on by 2."
kind = "call"
fn = "asm_speed_dir"
on = ["main@600+3000", "w3-sonnet@5000+3000", "w12-sonnet@20000+3000"]
min_calls = 30
max_calls = 3000
use = ["fixed_model"]
expect = "(fx_w(wr[0x60E0 + rd[0x6E]], wr[0x60F2 + rd[0x6E]]), fx_w(wr[0x6104 + rd[0x6E]], wr[0x6116 + rd[0x6E]])) == fx_vel(rd[0x61DC + rd[0x6E]], fx_w(*fx_ops(romrd, 2))) and fx_w(mem(0x1E), mem(0x1F)) == fx_w(rd[0x1E], rd[0x1F]) + 2"

[[claim]]
id = "fixed.vx_dir.model"
about = ["asm_vx_dir", "asm_skip_word"]
text = "Every call of asm_vx_dir in the windows sets the current object's X velocity to the word after the instruction, negated when obj_dir has bit 7 set, writes no Y velocity, and moves script_ptr on by 2. Both sides happen."
kind = "call"
fn = "asm_vx_dir"
on = ["main@300+3000", "w3-sonnet@5000+3000", "w12-sonnet@20000+3000"]
min_calls = 30
max_calls = 3000
use = ["fixed_model"]
cases = { "rd[0x61DC + rd[0x6E]] >= 0x80" = 10, "rd[0x61DC + rd[0x6E]] < 0x80" = 10 }
expect = "fx_w(wr[0x60E0 + rd[0x6E]], wr[0x60F2 + rd[0x6E]]) == (fx_w(*fx_ops(romrd, 2)) * (-1 if rd[0x61DC + rd[0x6E]] >= 0x80 else 1)) & 0xFFFF and 0x6104 + rd[0x6E] not in wr and 0x6116 + rd[0x6E] not in wr and fx_w(mem(0x1E), mem(0x1F)) == fx_w(rd[0x1E], rd[0x1F]) + 2"

# ================================================================== script helpers of bank 3E (asm_w targets)

[[sym]]
at = "3E:DE4B"
name = "asm_snd"
desc = "For a script: snd_play with the byte after the instruction (script_arg), the sound number."

[[sym]]
at = "3E:DE45"
name = "asm_music"
desc = "For a script: snd_music with the byte after the instruction (script_arg), the song number."

[[sym]]
at = "3E:DE51"
name = "asm_spawn_any"
desc = """For a script: creates an object anywhere in slots 0-17 (spawn_slot_min = 0, spawn_slot_end = $12) from the six
bytes after the instruction, through asm_spawn_args."""

[[sym]]
at = "3E:DE5D"
kind = "part"
name = "asm_spawn_args"
desc = """The common end of asm_spawn_any, asm_spawn and asm_spawn_slot: from the bytes at script_ptr + Y on, the object
type, dx, dy (signed), dz, variable 0 and a direction offset. The new object's position is the current object's world
X + dx and world Y + dy (16 bits: spawn_x_hi / spawn_y_hi and the low bytes in X and Y for obj_spawn), $602D = its
world Z low byte + dz; spawn_vars 0 = variable 0, 1 = obj_dir + the offset, 2 = the creator's slot, 3-7 = 0.
script_ptr moves on past the last byte, then obj_spawn with A = the type."""

[[sym]]
at = "3E:DED0"
name = "asm_spawn"
desc = "For a script: creates an object from eight bytes after the instruction: slot min, slot end (spawn_slot_min / spawn_slot_end), then the six of asm_spawn_args (type, dx, dy, dz, variable 0, direction offset)."

[[sym]]
at = "3E:DEE1"
name = "asm_spawn_slot"
desc = "For a script: creates an object in one slot from seven bytes after the instruction: the slot (spawn_slot_min = it, spawn_slot_end = it + 1), then the six of asm_spawn_args."

[[sym]]
at = "3E:DF06"
name = "asm_free"
desc = "For a script: frees the object whose slot is the byte after the instruction (obj_free)."

[[sym]]
at = "3E:DF0D"
name = "objs_free_others"
desc = "Frees every object on the active list except the current one (obj_free), taking each successor before the free."

[[sym]]
at = "3E:DF20"
name = "asm_obj_script"
desc = "For a script: gives the object in the slot of the first byte after the instruction the script at the next two bytes (low, high) in the bank of the fourth (new_script_bank, obj_set_script)."

[[sym]]
at = "3E:DF38"
name = "asm_ppu_record"
desc = "For a script: ppu_record with the record address of the two bytes after the instruction (low, high)."

[[sym]]
at = "3E:DF4B"
name = "asm_ppumask_or"
desc = "For a script: ppumask = ppumask OR the byte after the instruction (bits of PPUMASK turned on: $18 shows the background and the sprites)."

[[sym]]
at = "3E:DF61"
name = "asm_palette"
desc = "For a script: palette_load from the four bytes after the instruction: the source address (low, high, to $18/$19), the first palette index and the number of colours; script_ptr + 4."

[[sym]]
at = "3E:DF7D"
name = "asm_wait_eq"
desc = """For a script: three bytes after the instruction, an address (low, high) and a value. When the byte at the address
equals the value the script goes on after them; otherwise script_ptr goes back 6 (to before the asm instruction,
which runs again) and the thread waits one frame (thread_wait = 1): the script waits until the byte has the value."""

[[sym]]
at = "3E:DFA3"
name = "asm_mem_sub"
desc = "For a script: three bytes after the instruction, an address (low, high) and a value: A = the value minus the byte at the address (carry set when no borrow); asm_w puts A into the thread's register, for a following jeq / jne."
out = "A = value - byte, carry"

[[sym]]
at = "3E:DFDF"
name = "asm_random"
desc = "For a script: random with the byte after the instruction: A = a random number below it (the raw byte for 0), which asm_w puts into the thread's register."

[[sym]]
at = "3E:DFE5"
name = "objs_freeze_others"
desc = "Sets bit 7 of obj_tick_bank of every object on the active list except the current one: obj_run_all skips them (they stop)."

[[sym]]
at = "3E:DFFB"
name = "objs_thaw_others"
desc = "Clears bit 7 of obj_tick_bank of every object on the active list except the current one, undoing objs_freeze_others."

[[sym]]
at = "3F:E001"
kind = "part"
name = "objs_thaw_step"
desc = "The loop of objs_thaw_others, which runs on from bank 3E into bank 3F: unless the slot is the current object, clear bit 7 of its obj_tick_bank; then the next slot of the active list."

[[sym]]
at = "3E:DDD9"
name = "sprites_draw_chr"
desc = "A draw routine (A/X = the address of the pose's sprite data): the first byte goes to chr_bank + 1 (the sprite CHR bank of the second register) and the sprite group follows from the second byte (sprite_group with Y = 1). Used in the last scenes of the game."
in = "A = low, X = high byte of the sprite data"

[[sym]]
