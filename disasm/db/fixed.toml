def cy(rd, x):
    y = rd[0xA6 + x] | rd[0xB8 + x] << 8 | rd[0xCA + x] << 16
    vy = rd[0x6104 + x] | rd[0x6116 + x] << 8
    vy = vy - 0x10000 if vy >= 0x8000 else vy
    y = y + vy & 0xFFFFFF
    t = (y & 0xFFFF) + (rd[0xE4] | rd[0xE5] << 8)
    return ((y >> 16) + (t >> 16) & 0xFF) << 16 | t & 0xFFFF
'''
