[[model]]
name = "fixed_probe_h"
code = '''
FH = {
    0xF18A: lambda c, r: ('p', 15 - r - c),
    0xF1CE: lambda c, r: ('n', r + 1),
    0xF1D6: lambda c, r: ('n', 15 - c + r + 1),
    0xF1E0: lambda c, r: ('n', c + r + 1),
    0xF224: lambda c, r: ('x', 0x20),
    0xF229: lambda c, r: ('p', c + 16 - r),
    0xF234: lambda c, r: ('p', 15 - c + 16 - r),
    0xF283: lambda c, r: ('p', c - r),
    0xF28B: lambda c, r: ('p', 15 - ((c | 16) >> 1) - r),
    0xF291: lambda c, r: ('p', 15 - (c >> 1) - r),
    0xF29C: lambda c, r: ('p', ((c | 16) >> 1) - r),
    0xF2A2: lambda c, r: ('p', (c >> 1) - r),
    0xF2E5: lambda c, r: ('p', 15 - r + 1),
    0xF2EF: lambda c, r: ('p', 15 - c + 16 - r),
    0xF2FC: lambda c, r: ('p', c + 16 - r),
    0xF307: lambda c, r: ('p', 15 - ((c | 16) >> 1) + 16 - r),
    0xF30D: lambda c, r: ('p', 15 - (c >> 1) + 16 - r),
    0xF31B: lambda c, r: ('p', ((c | 16) >> 1) + 16 - r),
    0xF321: lambda c, r: ('p', (c >> 1) + 16 - r),
    0xF367: lambda c, r: ('x', 0xE0),
    0xF36C: lambda c, r: ('n', c + r + 1),
    0xF374: lambda c, r: ('n', 15 - c + r + 1),
    0xF37E: lambda c, r: ('n', ((c | 16) >> 1) + r + 1),
    0xF384: lambda c, r: ('n', (c >> 1) + r + 1),
    0xF38D: lambda c, r: ('n', 15 - ((c | 16) >> 1) + r + 1),
    0xF393: lambda c, r: ('n', 15 - (c >> 1) + r + 1),
    0xF3DB: lambda c, r: ('p', 16 - c - r),
    0xF3E6: lambda c, r: None if r >= 8 else ('p', 2 * r - c),
    0xF3EF: lambda c, r: None if r < 8 else ('p', 2 * (r & 7) - c),
    0xF43C: lambda c, r: ('n', c + 1),
    0xF444: lambda c, r: ('n', 15 - r + c + 1),
    0xF44E: lambda c, r: ('n', c + 1) if r >= 8 else ('n', 2 * (7 - r) + c + 1),
    0xF456: lambda c, r: ('x', 0xE0) if r < 8 else ('n', 2 * (7 - (r & 7)) + c + 1),
    0xF467: lambda c, r: ('n', r + c + 1),
    0xF4AF: lambda c, r: ('x', 0x20),
    0xF4B4: lambda c, r: ('p', 15 - c + r + 1),
    0xF4BE: lambda c, r: ('x', 0x20) if r >= 8 else ('p', 2 * r + 16 - c),
    0xF4C6: lambda c, r: ('p', 15 - c) if r < 8 else ('p', 2 * (r & 7) + 16 - c),
    0xF4D8: lambda c, r: ('p', (c + r) ^ 0x1F),
    0xF522: lambda c, r: None if r >= 8 else ('p', 2 * (7 - r) - c),
    0xF52B: lambda c, r: None if r < 8 else ('p', 2 * (7 - (r & 7)) - c),
    0xF53C: lambda c, r: ('p', r - c),
    0xF585: lambda c, r: ('p', 16 - c),
    0xF58D: lambda c, r: ('p', (c + r) ^ 0x1F),
    0xF597: lambda c, r: ('p', 16 - c) if r >= 8 else ('p', (2 * r + c + 1) ^ 0x1F),
    0xF59F: lambda c, r: ('x', 0x20) if r < 8 else ('p', (2 * (r & 7) + c + 1) ^ 0x1F),
    0xF5B0: lambda c, r: ('p', 15 - c + r + 1),
    0xF5FB: lambda c, r: ('x', 0xE0),
    0xF600: lambda c, r: ('n', 2 * r + 1),
    0xF608: lambda c, r: ('x', 0xE0) if r >= 8 else ('n', 2 * r + c + 1),
    0xF610: lambda c, r: ('n', c) if r < 8 else ('n', 2 * (r & 7) + c + 1),
    0xF61F: lambda c, r: ('n', 16 - r + c),
}

def fh_s8(v):
    v &= 0xFF
    return v - 256 if v >= 0x80 else v

def fh_want(k, v):
    """(carry, 16-bit distance) of a handler's answer"""
    if k == 'p':
        return 0, fh_s8(v) & 0xFFFF
    if k == 'n':
        return 0, fh_s8(-v) & 0xFFFF
    return 1, fh_s8(v) & 0xFFFF

def fh_ok(ran, mem, wr, rp, addrs):
    c, r = mem(0x11), mem(0x12)
    got = (rp & 1, wr[0x579] | wr[0x57A] << 8)
    for a in addrs:
        if ran("3F:%04X" % a):
            w = FH[a](c, r)
            if w is not None and fh_want(*w) != got:
                return False
    return True
'''

