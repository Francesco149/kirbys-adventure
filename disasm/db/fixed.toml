desc = """Enters the item in slot A (an object of type 5 that Kirby took or inhaled) in the taken lists, so that objs_spawn_ok
keeps it from coming back: nothing for variable 2 = 4 or 5 (the ability star, the sword); list `world` for variable 2 =
1 (the 1-up), list 7 for the others. taken_idx = the slot's room_obj_index, taken_room = the low byte of room, the
list's taken_end + 1. Called by hit_item and by the items' inhaled reaction e05_inhaled."""
in = "A = the item's slot"

