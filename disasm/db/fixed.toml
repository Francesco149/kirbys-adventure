# ---------------------------------------------------------------- claims: script helpers

[[model]]
name = "fixed_asm"
code = '''
def fa_ptr(d):
    return d[0x1E] | d[0x1F] << 8

def fa_moved(rd, mem, k):
    """script_ptr moved on by k (16 bits)"""
    return (mem(0x1E) | mem(0x1F) << 8) == (fa_ptr(rd) + k) & 0xFFFF

def fa_s8(v):
    return v - 256 if v >= 0x80 else v

def fa_active(rd):
    """the active list from the values read (before any write), in order"""
    out = []
    s = rd.get(0x6032, 0xFF)
    while s < 0x80 and len(out) < 18:
        out.append(s)
        s = rd.get(0x613A + s, 0xFF)
    return out

def fa_spawn_ok(rd, wr, ops, lo, end):
    o = rd[0x6E]
    t, dx, dy, dz, v0, dd = ops
    wx = (rd[0x6074 + o] | rd[0x6086 + o] << 8) + fa_s8(dx) & 0xFFFF
    wy = (rd[0x6098 + o] | rd[0x60AA + o] << 8) + fa_s8(dy) & 0xFFFF
    return (wr[0x602F] == lo and wr[0x6030] == end and wr[0x602B] == wx >> 8 and wr[0x602C] == wy >> 8
            and wr[0x602D] == rd[0x60BC + o] + dz & 0xFF
            and [wr[0x6023 + i] for i in range(8)] == [v0, rd[0x61DC + o] + dd & 0xFF, o, 0, 0, 0, 0, 0])
'''

