name = "objs_spawn_ok"
desc = """Asked by objs_spawn before it creates object Y of the room's list (Y is kept in $08); answers carry clear (create it)
in every call of the corpus. By the object's kind byte (objs_kind, Y):
$D0 and more, below $17, $1A-$34, $38-$48 but $37, $4A-$90 and above $92: nothing.
$B0-$CF (the bosses and middle bosses): unless Y is already in boss_list[0 .. boss_count) (then carry set, never ran),
Y goes to boss_list[boss_count], and boss_count + 1 when extra_state is not 0 (an arena is in progress).
$17-$19, $35, $37, $49, $91, $92 use taken list 7, $36 (the 1-up) list `world`: when an entry of that list (from
taken_start[g] to taken_end[g]) holds Y in taken_idx and the low byte of room in taken_room, carry set (the object was
taken before; never ran). Otherwise, for $49 and $92 only, the object is entered at once: taken_idx = Y, taken_room =
room, taken_end[7] + 1."""
in = "Y = index in the room's object list; objs_kind"
out = "carry clear: create it (carry set: no, never ran)"
comments = { "EAA3" = "$B0-$CF: a boss", "EAEC" = "kind $36: the list of the world", "EAF1" = "list 7", "EB12" = "kinds $49 and $92 count as taken at once" }

