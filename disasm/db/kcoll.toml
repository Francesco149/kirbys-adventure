[[claim]]
id = "kcoll.floor.model"
about = ["kirby_floor", "kirby_floor_mid", "kirby_floor_left", "kirby_floor_right", "kirby_land", "kirby_land_set", "foot_flags", "floor_dist", "floor_kind", "floor_flag", "kirby_flags"]
text = "Every call of kirby_floor is for slot 1 and does what the model of the three feet (right, left, centre) gives: carry set exactly when a foot landed; then floor_dist, floor_kind and floor_flag are those of the last foot that landed, bit 2 of kirby_flags is set, the Y position and the world Y position are the old ones plus the sign-extended floor_dist, the Y fraction is $80 and foot_flags is 0. Without a landing bit 2 of kirby_flags is clear, the position is not written, and foot_flags is written only as the model's feet write it."
kind = "call"
fn = "kirby_floor"
on = ["main@400+300", "main@1450+500", "main@4100+200", "w12-sonnet@2100+300", "w12-sonnet@2650+300", "attract@2200+300", "main@21630+15", "main@62125+12", "main@100910+40"]
min_calls = 1000
