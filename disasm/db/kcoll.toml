expect = "rd[0x6E] == 1 and floor(rd, romrd) == after(rd, wr, rp)"
model = '''
def floor(rd, romrd):
    st = feet(rd, romrd, [(6, 1), (-6, 4), (0, 2)])
    if st['land'] is None:
        return (0, None, rd[0x5FB] & 0xFB, st['f'] if st['fw'] else None, None)
    d = sx(st['land'][0])
    return (1, st['land'], rd[0x5FB] & 0xFB | 4, 0,
            ((rd[0xB9] | rd[0xCB] << 8) + d & 0xFFFF, (rd[0x6099] | rd[0x60AB] << 8) + d & 0xFFFF, 0x80))

def after(rd, wr, rp):
    pos = (wr[0xB9] | wr[0xCB] << 8, wr[0x6099] | wr[0x60AB] << 8, wr[0xA7]) if 0xB9 in wr else None
    return (rp & 1, landed(wr), wr[0x5FB], wr.get(0x78E7), pos)
'''

