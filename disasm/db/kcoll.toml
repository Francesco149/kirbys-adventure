unit = "kcoll"
title = "Kirby against the room: his floor, ceiling and wall tests"
summary = """What Kirby's states call after kirby_step has moved him: three tests built on the probes of unit probes, each of
which answers carry set when it stopped him and moves him back out of the block.

The floor (kirby_floor): three probes down from 7 pixels below his position, under his centre and 6 pixels to each
side (kirby_foot_mid, kirby_foot_left, kirby_foot_right; on a slope the side feet correct the distance by 3 or 6
pixels, the height the slope gains over 6). A foot that is on or in the floor (distance 0 or negative) lands unless
he is moving away from the surface (floor_approach: for a flat floor a Y velocity that is not upward, for a slope the
velocity component across it). Landing (kirby_land) records the distance, the kind of surface and the flag bit of the
block in floor_dist, floor_kind, floor_flag and sets bit 2 of kirby_flags; a foot more than 11 pixels deep is not a
landing. A foot that is inside a floor while he moves up gets a bit in foot_flags and is ignored until it is above
the surface again: that is how he rises through the floor-only blocks (classes 2 and 3). After the three feet,
kirby_floor moves him by floor_dist when one landed.

The ceiling (kirby_ceiling): three probes up from 7 pixels above him, centre and 6 to each side, the side ones
corrected by 6 on a sloped ceiling. A probe that is inside the ceiling while he moves into it (ceiling_approach)
pushes him down by the distance. The walls (kirby_walls): two probes 7 pixels ahead of him in the direction of his X
velocity, 6 below and 6 above his position; only a flat face counts, and only when he is no deeper in it than he
moved this frame; he is put back by the distance. The _stop variants also clear the velocity.

In pictures: main@1500 Kirby walks up the first slope of 1-1; main@4820 he runs into a wall; main@39100 he is under
a sloped ceiling.

Open: kirby_ceiling's path for a negative distance at the hit (21:90DC) never ran. 21:9034 is kirby_walls_stop with
a call of 21:8C16 before the velocity is cleared (131 hits; it sets $05E4 from $05BB/$05BC, not looked at). What
floor_kind, floor_flag and the other bits of kirby_flags are used for is in their readers (21:813A, 21:8765,
21:8781, 21:879D, 21:88DE, 21:8FFB, 21:9899, 21:9B96, 21:9BAA, 21:9DCD), not in the unit. kirby_vx_zero clears
$05B9-$05BC with the X velocity; they are not named here ($05B9/$05BA read as Kirby's own copy of his X velocity,
as kirby_vy is for Y). 21:8B4E, the other caller of kirby_land_set and writer of foot_flags, is not in the unit."""

[[sym]]
at = "21:9016"
name = "kirby_floor_stop"
desc = "kirby_floor, and when it answers carry set, kirby_vy_zero."
out = "carry set: he stands on a floor"

[[sym]]
at = "21:9021"
name = "kirby_walls_stop"
desc = "kirby_walls, and when it answers carry set and $05BA and the high byte of his X velocity have the same sign, kirby_vx_zero."
out = "carry set: a wall stopped him"

[[sym]]
at = "21:904A"
name = "kirby_ceiling_stop"
desc = "kirby_ceiling, and when it answers carry set: kirby_vx_zero unless the surface is flat (kind 2), then kirby_vy_zero."
out = "carry set: a ceiling stopped him"

[[sym]]
at = "21:905C"
name = "kirby_ceiling"
desc = "Three probes up (probe_up) from the current object's position: at (0, -7), (-6, -7) and (6, -7). For the side probes a sloped ceiling changes the distance: kind 7 by -6 on the left and +6 on the right, kind 8 the other way round. The first probe with a surface at a positive distance (the point is inside it) for which ceiling_approach answers carry set ends the routine: the object is moved down by the distance (obj_y_add) and the answer is carry set with the kind in A. Otherwise carry clear."
out = "carry set: A = the kind of surface he was pushed out of"

[[sym]]
at = "21:90E3"
name = "ceiling_approach"
desc = "Carry set when Kirby's velocity points into a ceiling of the kind in A: kind 2, his Y velocity is negative; kind 7, X velocity + Y velocity is negative; any other kind (8), Y velocity - X velocity is negative. A is kept."
in = "A = kind of surface"
out = "carry; A unchanged"

[[sym]]
at = "21:9128"
name = "kirby_walls"
desc = "With an X velocity that is not negative: kirby_wall_right for Y = 6, then for Y = -6; with a negative one kirby_wall_left for the same two. On the first carry set, probe_dist (16 bits) is added to the X position and the world X position of slot 1, the X fraction becomes $80, and the answer is carry set."
out = "carry set: he was moved out of a wall"

[[sym]]
at = "21:916B"
name = "kirby_wall_right"
desc = "A probe to the right (probe_right) from the current object's position at (7, Y). Carry set when it finds a flat face (kind 2) at a negative distance d and Kirby is no deeper in it than he moved this frame: the high byte of his X velocity, plus 1 when the fraction carried, plus d is not negative."
in = "Y = signed Y offset"
out = "carry"

[[sym]]
at = "21:9199"
name = "kirby_wall_left"
desc = "A probe to the left (probe_left) from the current object's position at (-7, Y). Carry set when it finds a flat face (kind 2) at a positive distance d and Kirby is no deeper in it than he moved this frame: minus the high byte of his X velocity, minus 1 when the fraction borrowed, minus d is not negative."
in = "Y = signed Y offset"
out = "carry"

[[sym]]
at = "21:91C2"
name = "kirby_floor"
desc = "Clears bit 2 of kirby_flags, then kirby_floor_right, kirby_floor_left, kirby_floor_mid. When one of them landed (bit 2 is set): floor_dist, sign-extended, is added to the Y position and the world Y position of slot 1, the Y fraction becomes $80, foot_flags becomes 0 and the answer is carry set. Otherwise carry clear."
out = "carry set: he stands on a floor"

[[sym]]
at = "21:920F"
name = "kirby_floor_mid"
desc = "One foot of kirby_floor: kirby_foot_mid. Nothing below: return. With a distance that is not negative, bit 1 of foot_flags is cleared; a positive distance returns. Then (the foot is on or in the floor): with the foot's bit set in foot_flags, return; when floor_approach answers carry set, kirby_land; otherwise, with a Y velocity that is negative, the foot's bit is set."

[[sym]]
at = "21:9245"
name = "kirby_floor_left"
desc = "As kirby_floor_mid for kirby_foot_left and bit 2 of foot_flags."

[[sym]]
at = "21:927A"
name = "kirby_floor_right"
desc = "As kirby_floor_mid for kirby_foot_right and bit 0 of foot_flags."

[[sym]]
at = "21:92AF"
name = "kirby_foot_mid"
desc = "probe_down from the current object's position at (0, 7)."
out = "as probe_down"

[[sym]]
at = "21:92BA"
name = "kirby_foot_left"
desc = "probe_down from the current object's position at (-6, 7). On a slope the low byte of probe_dist is corrected: +3 for kind 4, +6 for kind 6, -3 for kind 3, -6 for kind 5."
out = "carry and A = the kind as probe_down; X as probe_down"

[[sym]]
at = "21:92EF"
name = "kirby_foot_right"
desc = "probe_down from the current object's position at (6, 7). On a slope the low byte of probe_dist is corrected: +3 for kind 3, +6 for kind 5, -3 for kind 4, -6 for kind 6."
out = "carry and A = the kind as probe_down; X as probe_down"

[[sym]]
at = "21:9324"
name = "floor_approach"
desc = "Carry set unless Kirby's velocity points away from a floor of the kind in A: kind 2, his Y velocity is not negative; kind 5, X velocity + Y velocity is not negative; kind 6, Y velocity - X velocity; kind 3, X velocity / 2 + Y velocity; any other kind (4), Y velocity - X velocity / 2. A is kept."
in = "A = kind of surface"
out = "carry; A unchanged"

[[sym]]
at = "21:93AF"
name = "kirby_land"
desc = "With the low byte of probe_dist 0 or $F5-$FF (on the surface, or up to 11 pixels in it) it falls into kirby_land_set with that byte in Y; otherwise it returns."
in = "A = kind of surface, X = the block's flag"

[[sym]]
at = "21:93B8"
name = "kirby_land_set"
desc = "floor_kind = A, floor_flag = X, floor_dist = Y, and bit 2 of kirby_flags is set."
in = "A, X, Y"

[[sym]]
at = "21:93CA"
name = "kirby_floor_any"
desc = "kirby_foot_mid, kirby_foot_left, kirby_foot_right in that order: the first that finds a floor at a distance of 0 or less ends the routine with kirby_land and carry set. Otherwise carry clear. The velocity is not looked at and Kirby is not moved."
out = "carry set: a foot is on or in a floor"

[[sym]]
at = "21:86FB"
name = "kirby_vx_zero"
desc = "Clears the X velocity of slot 1 and the four bytes $05B9-$05BC."
out = "A = 0"

[[sym]]
at = "21:9D56"
name = "obj_y_add"
desc = "Adds the 16-bit number X:A to the Y position of the current object, writes the result to its world Y position as well and sets its Y fraction to $80."
in = "A = low byte, X = high byte"

[[ram]]
at = "05F3"
name = "floor_dist"
desc = "The low byte of the distance at which a foot of Kirby landed (0 or $F5-$FF): kirby_floor moves him by it."

[[ram]]
at = "05F4"
name = "floor_kind"
desc = "The kind of surface (2-6, as the probes answer it) a foot of Kirby landed on."

[[ram]]
at = "05F8"
name = "floor_flag"
desc = "Bit 0 of prop_class of the block a foot of Kirby landed on (what probe_down returns in X)."

[[ram]]
at = "05FB"
name = "kirby_flags"
desc = "Flags of Kirby's state. Bit 2: a foot landed in the last kirby_floor (kirby_land_set sets it, kirby_floor clears it first). Bit 7 keeps kirby_step from calling current_push. The other bits are not described."

[[ram]]
at = "78E7"
name = "foot_flags"
desc = "One bit per foot of Kirby (bit 0 right, bit 1 centre, bit 2 left), set while the foot is inside a floor that he entered moving up; such a foot does not land. Cleared per foot once it is at or above the surface, and all at once when he lands."

# ------------------------------------------------------------------ claims

[[model]]
name = "kirby_feet"
code = '''
def k16(v):
    return v - 0x10000 if v & 0x8000 else v

def vel(rd):
    return k16(rd[0x60E1] | rd[0x60F3] << 8), k16(rd[0x6105] | rd[0x6117] << 8)

def point(rd, dx, dy):
    # obj_point_off: the world position of the current object plus an offset -> X low, Y low, ($4B, $4C)
    o = rd[0x6E]
    px = (rd[0x6074 + o] | rd[0x6086 + o] << 8) + dx & 0xFFFF
    py = (rd[0x6098 + o] | rd[0x60AA + o] << 8) + dy & 0xFFFF
    return px & 0xFF, py & 0xFF, (px >> 8, py >> 8)

FOOT = {0: {}, -6: {4: 3, 6: 6, 3: -3, 5: -6}, 6: {3: 3, 5: 6, 4: -3, 6: -6}}

def foot(rd, romrd, dx):
    # -> carry, low byte of probe_dist, kind, the block's flag
    xl, yl, pt = point(rd, dx, 7)
    c, d, k, fl = downx(rd, romrd, xl, yl, pt)
    if not c:
        d += FOOT[dx].get(k, 0)
    return c, d & 0xFF, k, fl

def approach(rd, k):
    # floor_approach: is he not moving away from a floor of kind k
    if k == 2:
        return rd[0x6117] < 0x80
    vx, vy = vel(rd)
    s = {5: vx + vy, 6: vy - vx, 3: (vx >> 1) + vy}.get(k, (-vx >> 1) + vy)
    return s & 0xFFFF < 0x8000

def land(st, k, fl, d):
    if d == 0 or d >= 0xF5:
        st['land'] = (d, k, fl)

def step(rd, romrd, st, dx, bit):
    # one of kirby_floor_right / _left / _mid on the state st = {'f': foot_flags, 'fw': written?, 'land': ...}
    c, d, k, fl = foot(rd, romrd, dx)
    if c:
        return
    if d < 0x80:
        st['f'] = (st['f'] if st['fw'] else rd[0x78E7]) & ~bit
        st['fw'] = True
        if d:
            return
    f = st['f'] if st['fw'] else rd[0x78E7]
    if f & bit:
        return
    if approach(rd, k):
        land(st, k, fl, d)
    elif rd[0x6117] >= 0x80:
        st['f'], st['fw'] = f | bit, True

def feet(rd, romrd, order):
    st = {'f': None, 'fw': False, 'land': None}
    for dx, bit in order:
        step(rd, romrd, st, dx, bit)
    return st

def landed(wr):
    # what a call left in floor_dist, floor_kind, floor_flag (None: not written)
    return (wr[0x5F3], wr[0x5F4], wr[0x5F8]) if 0x5F3 in wr else None

HEAD = {0: {}, -6: {7: -6, 8: 6}, 6: {7: 6, 8: -6}}

def capproach(rd, k):
    if k == 2:
        return rd[0x6117] >= 0x80
    vx, vy = vel(rd)
    return (vx + vy if k == 7 else vy - vx) & 0x8000 != 0

def ceiling(rd, romrd):
    # -> (kind, distance) of the probe that pushes him down, or None
    for dx in (0, -6, 6):
        xl, yl, pt = point(rd, dx, -7)
        c, d, k = up(rd, romrd, xl, yl, pt)
        if c:
            continue
        d = d + HEAD[dx].get(k, 0) & 0xFF
        if 0 < d < 0x80 and capproach(rd, k):
            return k, d
    return None

def wall(rd, romrd, dy, side):
    # kirby_wall_right (side = 1) / kirby_wall_left (side = -1) -> the low byte of the distance on a hit, else None
    xl, yl, pt = point(rd, 7 * side, dy)
    c, d, k = (right if side > 0 else left)(rd, romrd, xl, yl, pt)
    d &= 0xFF
    if c or k != 2 or d == 0 or (d < 0x80) == (side > 0):
        return None
    b = 1 if rd[0x71] < rd[0x60E1] else 0
    t = -rd[0x60F3] - b - d & 0xFF
    if side > 0:
        t = -t & 0xFF
    return d if t < 0x80 else None

def walls(rd, romrd):
    side = 1 if rd[0x60F3] < 0x80 else -1
    for dy in (6, -6):
        d = wall(rd, romrd, dy, side)
        if d is not None:
            return d
    return None

def sx(d):
    return d - 256 if d >= 0x80 else d
'''

