unit = "kst_rest"
title = "The rest of Kirby's states and effects in banks 14, 15 and 16"
summary = """
What units kst14, kst14b, kst15 and kfx left of the code of banks 14, 15 and 16 that ran: the rarer states of Sword
and Parasol Kirby, the hurt reactions 2, 4 and 5, the spit of water, the end of a life, the Sword taken from an item,
and eight effects and shots of object types 2 and 3.

The states follow the shape of their bank: a script sets kirby_action and names its frame routine with on_tick; the
routine moves Kirby with the helpers of bank 21 and asks its tests in a fixed order; the first that answers yes
names the next script (ldx #n / jmp kirby_script_upkeep), with none it ends in kirby_upkeep. The claims model the
order (model kst_rest_model, `chain`: kst15_exits' `took` plus, for an exit that ran, Kirby's script left at the
address of script n, as kst14_chain checks it).

  state (script)              action  routine                       leaves to
  Sword turn ($66)            3       kirby_st_sword_turn           stand $61 (wall, speed 0), fall, jump, slash $70
  Sword dive (15:A405)        5       kirby_st_sword_dive           floor $6B, ceiling, flag 3, spin $71, ladder,
                                                                    puff $72 (Up), water, door; no gravity
  Sword crouch ($6D)          6       kirby_st_sword_crouch         fall, slide $6E (A or B), drop $6C, $60 (Down off)
  Sword slide ($6E)           7       kirby_st_sword_slide          stand (wall), fall $69, stand (slow)
  Sword exhale ($76)          $0A     kirby_st_sword_exhale         water; then the script: puff or $60
  Sword in water ($78)        0       kirby_st_sword_water_stand    swim $7A (no floor; A or Up), slash, walk, door
  Parasol run ($B7 / $B8)     2       kirby_st_para_run             stand $B4 (wall), fall, turn, walk, ladder,
                                                                    crouch $C2, jump, swing, floor, door, puff, drop
  Parasol turn ($B9)          3       kirby_st_para_turn            stand, fall, jump, ladder, crouch, swing $C5, door
  Parasol puff up ($C6)       (kept)  kirby_st_para_puff            door; after 24 frames: kirby_s_para_hover
  Parasol flap ($C7)          $0D     kirby_st_para_flap            exhale $CA (B), water, door
  Parasol hover (15:B4EE)     $0D     kirby_st_para_hover           flap $C7 (A or Up), exhale $CA (B), water, door
  Parasol exhale ($CA)        $0A     kirby_st_para_exhale          water; then the script: puff or $B3
  hurt 2, frozen (14:A459)    (kept)  kirby_st_hurt_frozen          $EA on a floor (then kirby_s_hurt_end)
  hurt 5, Star Rod flight     (kept)  kirby_st_hurt_rodfly          (none: the script ends it)
  water spit ($1B / $1C)      $0C     kirby_st_water_spit           water left $1D; 14:B218: $1C (pad direction)

The pose helpers sword_stand_pose, para_stand_pose, sword_crouch_pose and para_crouch_pose pick a pose by
floor_kind_index (the slope under Kirby). The rectangles of the Sword's slide and dive and of the water spit go
through kirby_rect_set with $0508 = 2. Reaction 4 (the spikes) sets kirby_vy by kirby_spike_vy; kirby_s_die's
helpers free slots 3-5 (kirby_fx_free) and put slot 1's world position into its position (kirby_pos_from_world).
kirby_s_take_sword (14:A703) is where an item gives Kirby the Sword: kirby_take_sword stores ability 3.

Effects (type 2, unit kfx's numbering by variable 3): $0D kfx_spark_rise (made every other frame while Kirby is thrown
up by reactions 1 and 3), $0F kfx_fireball_trail (sparks behind the fireball dash), $11 kfx_die_star (the stars
that fly off when a life is lost; direction by the sign of his Y velocity), $17 kfx_quake_until, $1B kfx_spark_fly,
$1C kfx_heal (8 hit points at a time up to hp_max), $1F kfx_run_puff. Shots (type 3): $01 kfx_shot_spin, $0B
kfx_shot_held (the enemy Back Drop holds: it takes the sprite of the caught object and rides by Kirby's pose until
$05FC says what to do with it). grab_caught (16:A9CE) is the script of the object the grab caught, pulled to Kirby
and then turned into shot $0B.

Open:
- Never ran, so not described further: every exit the claims' cases do not list (the texts name them), in particular
  the door exits of all these states, the ladder exits of the Sword's turn and dive, the Sword dive's ceiling exit, the water exits of hurt 2 and the water spit, down_bit5_test in the crouch ($6C), the
  water spit's second half started by 14:B218 ($1C) (its rectangles for poses $70-$79 first came up in cov5-h-full:
  claim kst_cov5.water_spit_rect.model); kirby_hurt_tick answering
  carry set; script $6C (the others this list named, $6B, $6F, $74, $75 and $C8-$CF, ran in the coverage movies and are documented in units kst_abl, kst_cov3 and kst_cov4; the flag exit to $6A, the
  bounce, first ran in cov6-j-x@304065: kirby_s_sword_bounce, unit cov6_extra). The Sword dive's floor exit ran in cov2-water
  and cov3-c-wade; its B and water exits, the Parasol run's no floor, back, ladder, A, B, Up and Select, the Parasol
  turn's wall, speed zero, A, ladder and Down, and the water exits of the Parasol's flap, hover and exhale first ran in cov4-c-sword and
  cov4-c-para (claims kst_cov4.<state>.exits); (the uncapped step of kfx_heal_step, hp + 8 below hp_max, first ran in
  cov5-h-hammer: claim kst_cov5.heal.uncapped; kfx_heal_count's answer 1 for $F4 not 0 in cov6-j-x@253409, the Extra
  Game); kfx_quake_until_tick with variable 6 set; kfx_shot_spin's break exit; kfx_held_tick for
  $05FC = 5 and with Kirby facing left (the wall exit of kfx_shot_spin_tick and kfx_held_tick for $05FC = 1 and 3 first
  ran in cov5-h-full and cov5-h-bd, 4 in cov2-save-finished: claims kst_cov5.kfx_shot_spin_tick.paths,
  kst_cov5.held_tick.paths); kfx_run_puff facing left.
- Ran once or in one stretch only when this unit was written (claimed in two windows of that stretch, or of a cov-*
  copy of main): the Sword dive, slide, crouch and water stand (main 64700-66000, copied in cov-abilities-sword;
  since then also in cov2-water, cov3-c-wade and cov4-c-sword, some of them in cov3-c-sword and cov4-a-mk), the Parasol turn
  (w12-sonnet@50629; since then 66 calls in cov4-c-para), the water spit (w12-sonnet@39760; since then cov2-water),
  reaction 5 (main@132122), reaction 4 (main@46865), kirby_take_sword (main@105665,
  claimed by an effect only), the heal (main@15658, cov-minigame-arena@27402).
- Documented in unit scr_obj: scripts $77 (15:AA4F, kirby_s_sword_water_in) and $7B (15:ABFC, kirby_s_sword_water_out).
  Not documented: effects $06 and $10 (no 6502 code of their own); shot $0A; the script of the shot $0B for
  $05FC = 5 (16:BAB1; those for 1 and 3, 16:BA2F-16:BA94, are unit kst_cov5's: kfx_held_toss, kfx_held_flung,
  kfx_held_fall); what the kinds 1, 4 and 6 in byte 0 of the rectangle records mean (unit hit).
- What $0598 and the bit $20 of kirby_flags stand for (kirby_take_sword writes them), and what 21:9DCD / 21:9DF2 answer
  in the water spit's script, are not established. That reaction 2 is a freeze is taken from the picture (main@110262:
  Kirby a blue block, the palette changed through asm_palette) and from the thing that hit him, not from bank 39.
"""

[[model]]
name = "kst_rest_model"
code = '''
SCR = {0x01: 0xA74B, 0x60: 0xA00B, 0x61: 0xA020, 0x69: 0xA36B, 0x6E: 0xA5CF, 0x70: 0xA726, 0x71: 0xA808,
       0x72: 0xA8CC, 0x77: 0xAA4F, 0x7A: 0xAB6D, 0xB4: 0xAC29, 0xB9: 0xAEA1, 0xBA: 0xAF12, 0xBC: 0xAF91, 0xC2: 0xB29B,
       0xC4: 0xB34E, 0xC5: 0xB41F, 0xC6: 0xB45E, 0xC7: 0xB499, 0xC8: 0xB54B, 0xCA: 0xB5A0, 0xCB: 0xB5F0, 0xEA: 0xA4B2}

def chain(ran, rd, wr, tests, stay):
    """tests: (exit's ldx, script number, the test's answer or None) in the routine's order. took() of kst15_exits,
    and when an exit ran, Kirby's script was left at the address of that script number."""
    if not took(ran, [(t[0], t[2]) for t in tests], stay):
        return False
    for at, n, _ in tests:
        if ran(at):
            return n in SCR and kst14_script(rd, wr) == SCR[n]
    return True

def fki(kind):
    return kind - 2 if 2 <= kind <= 5 else 4

def rect_at(wr, romrd, o, lo, hi, i, power):
    """the record named by the pointer tables lo / hi (CPU addresses, PRG offset = address + o) at index i was read
    and kirby_rect_set stored power in $0508 and bytes 0, 5, 6 of the record."""
    if lo + o + i not in romrd or hi + o + i not in romrd:
        return False
    rec = (romrd[lo + o + i] | romrd[hi + o + i] << 8) + o
    return (all(rec + k in romrd for k in range(7)) and wr.get(0x508) == power and wr.get(0x501) == romrd[rec]
            and wr.get(0x506) == romrd[rec + 5] and wr.get(0x507) == romrd[rec + 6])

def spit_rect(rd, wr, romrd):
    i = rd[0x62C7] - 0x56
    if not 0 <= i < 0x1A:
        return False
    if romrd.get(0xB278 + 0x1E000 + i) == 0:
        return 0x508 not in wr
    return rect_at(wr, romrd, 0x1E000, 0xB262, 0xB278, i, 2)

def sext(v):
    return 0xFF if v & 0x80 else 0

def held_ride(rd, wr, romrd, k):
    """kfx_held_tick's ride path for the object in slot k."""
    a = rd[0x62C7] if rd[0x5E1] == 0x0C else 0
    i = a >> 1
    b = romrd[O('kfx_held_kind') + i]
    d = O('kfx_held_draw') + (b & 6)
    if (wr[0x6182 + k], wr[0x6194 + k]) != (romrd[d], romrd[d + 1]):
        return False
    if rd[0x6050 + k] != 0xFF and wr.get(0x6050 + k) != romrd[O('kfx_held_z') + (b & 1)]:
        return False
    dy = romrd[O('kfx_held_dy') + i]
    dx = romrd[O('kfx_held_dx') + i]
    if rd[0x61DD] & 0x80:
        dx = -dx & 0xFF
    return ((wr[0xB8 + k], wr[0xCA + k]) == (dy, sext(dy)) and (wr[0x82 + k], wr[0x94 + k]) == (dx, sext(dx))
            and (wr[0x60E0 + k], wr[0x60F2 + k]) == (rd[0x60E1], rd[0x60F3]) and wr[0x61DC + k] == rd[0x61DD])
'''

