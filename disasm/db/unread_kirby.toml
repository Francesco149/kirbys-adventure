unit = "unread_kirby"
title = "Kirby's poses no movie drew (banks 1A-1C), drawn by force"
summary = """
After batch 12 the pose tables of banks 1A-1C (Kirby's forms, his ability attacks, the goal game, the effects and
shots) still pointed at 252 poses and sprite groups that no movie drew: 4,173 bytes that only the format claim of unit
sprites covered, so they stayed "described" (kd.levels). Every claim here takes a corpus window where an object
with that pose table is on the screen in a pose that holds for at least five frames, points that pose's table entry
at one unread pose (a two-byte `patch`), and counts with `nr` that the draw routine read all of the pose's bytes
within 4 frames; the control run (the movie untouched) reads none. One claim per pose or group, 252 claims; together
they read every unread byte of the 17 regions in `about` (sprites_1C_958C's group at 1C:9B14 had been read except
for one sprite at the screen's edge).

Who uses the tables (from their sprite_map sites and the units of those scripts): 1A:8000 plain Kirby; 1A:8676
Kirby with a copy ability; 1A:8846 inhaling and with a full mouth; 1A:8EE6 the Star Rod on the ground; 1A:96A4
holding what he grabbed; 1A:9910 the goal game and the dancers after a boss; 1A:99DA / 1A:99F2 the goal game's
signs; 1B:8000 Sword; 1B:88F2 Hammer; 1B:9320 Parasol; 1B:9BEE Ball; 1B:9DAE Stone; 1C:8216 the ability attacks and
sleep; 1C:8DA6 hurt, frozen or held; 1C:94CE effects; 1C:9CD7 shots and stars; 1C:9F16 the door. Kirby's pose has
his facing in bit 0 (kirby_pose_face, obj_pose_script / obj_pose_faced add 1 facing left), and the forms' standing
and crouching poses are base + 2 * floor_kind_index (floor_kind 2-5 -> 0-3, else 4), so a pose table holds one
pair per kind of floor.

Not reachable (UNUSED.md, "Poses nothing selects"):
- 1A:8000 / 1A:8676 entries 88-97 (1A:83FC-1A:8497): a water spit straight ahead in open water. kirby_spit_dir
  answers 0 / 1 (call table entries 14:B1BD / B1D4 / B200 and 14:BExx, which never ran) only with floor_kind 0,
  and floor_kind is 2 from kirby_start_init and otherwise only kirby_land_set's surface kind (2-6).
- 1A:8676 entries 2, 3 (1A:8788, 1A:8792): Kirby blinking while holding an ability. Plain Kirby's kirby_s_stand
  blinks (pose 2 of 1A:8000); kirby_s_ab_stand does not.
- 1A:9910 entries 3-7, 9-13, 15-19, 21-25: the goal game's and the dancers' figures holding a form's prop (the
  sword, the hammer, the parasol ...). goal_form_vars (19:AF6C, nothing names it, unit dead_kirby) would put
  goal_form_tab[kirby_form] + 2 + 0/6/12/18 into variables 4-7, but no script takes a pose from those variables:
  the scripts set 2, 8, $0E and $14 directly. Entries 26-31 (a fifth group) have no setter at all.
- 1A:8EE6 entries 2-9 (rod_stand_pose on the four slopes), 22-27 (the rod walk's slope cycles 17:A125-A15E, never
  ran), 38-45 (rod_duck_pose on slopes), 84-97 (kirby_s_rod_swim): the ground Star Rod exists only in the last
  room, whose floor is flat and dry.
- 1C:9F16 entries 1, 3, 5: the door script (14:A5E9) steps poses 0, 2, 4 by set_pose_w / inc2_pose_w, without the
  facing; the other scripts with this table set 6 and up.

Reachable and never played (leads; "facing left/right" = the drawn partner pose of the pair, at its first frame):
- Facing the other way: 1A:8000 / 8676 9 (stand on floor_kind 5, pose 8 at main@52612), 27 and 29 (main@52619,
  main@52625), 49 (crouch on floor_kind 3, w12-opus@2118); 1A:8846 29 (full mouth standing on floor_kind 5,
  w3-sonnet@75090), 39 (full-mouth walk on a slope, w3-sonnet@74681); 1A:96A4 11, 19, 21, 23, 25, 33, 51 (the
  grab's holds and drops, attract@6469-6616, cov2-save-finished@143996); 1B:8000 11, 22, 31, 33, 35, 48, 105
  (cov2-water@11274-11366, cov6-j-x@306125, cov3-c-sword@64885); 1B:88F2 27, 28 (cov2-abilities-mole@82169,
  cov5-h-hammer@93214); 1B:9320 17, 21, 25, 38, 53, 65, 89 (cov-pause@17758, cov10-a-para@12770 / 14176,
  cov4-c-para@19854, attract@5366, cov9-b-para@13076, cov2-water-parasol@19511); 1C:8216 11, 13 (attract@4052),
  40-56 even (cov2-abilities-paint@28646-28882), 75-85 odd (attract@4399-4404), 124, 126, 131, 134
  (cov2-abilities-paint@27899-27910), 139, 141 (cov2-abilities-mole@84103), 149, 151 (cov9-a-rocky@72412);
  1C:8DA6 32, 34 (cov5-g-sun@42105), 37, 39 (w12-opus@32849), 41, 43 (w12-sonnet@15053), 45-57 odd (frozen,
  main@110253-110324), 73 (hurt in the rod flight, main@132122).
- On a slope: Sword standing (8 + 2 * index: 12-17 on floor_kind 4-6) and crouching (sword_crouch_pose $2E + 2 *
  index: 50-55); Hammer standing (hammer_stand_pose: 16, 17 on floor_kind 3, 20-23 on 5-6) and crouching
  (hammer_duck_pose: 56, 57, 60-63); Parasol standing (para_stand $0E + 2 * index: 18, 19, 22, 23) and crouching
  ($3A + 2 * index: 60-63, 66, 67); Stone (stone_pose, 1B:9DAE 14-17) on floor_kind 5 and 6; Kirby with a full
  mouth standing on floor_kind 6 (full_stand_pose, 1A:8846 30, 31).
- 1A:8846 40-43: the rest of the full-mouth walk up a slope (18:B040's cycle; 18:B044 on never ran: walk with a
  full mouth along that slope for more than 12 frames).
- 1A:99DA entry 4 and 1A:99F2 entry 4: the sign of the goal game's row 4, which no movie landed on.
- 1C:94CE entry 76 (1C:9B14): drawn in the corpus with one sprite off the screen.

Open (unsure: the pose is drawn by force, who would select it is not traced):
- 1A:8EE6 10-15 (17:A0DA shows a bump with base $0A: 10, 12, 14 would be a ceiling or wall bump in the last room),
  35 and 99 (pose 34 is drawn only in finale_main's scene), 112-122.
- 1A:96A4 26-29, 36, 37 (the throws step poses by add_pose_w; 16:A77D never ran).
- 1A:9910 76, 87 (the mirrored partners of poses the dancers and stars drew); 1A:99F2 entry 6 (row 6 ran once,
  in w1-v2-opus, without it).
- 1B:8000 36, 37; 1B:88F2 36-43, 82, 83; 1B:9320 40, 41, 92-95; 1B:9BEE 16, 18, 23; 1C:8216 132, 133;
  1C:8DA6 10-15 (Kirby with a sword, a hammer head or a parasol over him) and 58-71; 1C:94CE 3, 14, 15;
  1C:9CD7 8, 10, 12.
- The slope verdicts rest on the pose formulas of the units named and on plain Kirby having drawn all five standing
  poses (so all five kinds of floor exist); which rooms have the slopes is not listed here.
"""

