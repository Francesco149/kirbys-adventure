about = ["poses_1A_80F4"]
text = "The pose at 1A:8152 (poses_1A_80F4; entry 9 of pose_tab_1A_8000, plain Kirby's pose table): with entry 0 of the table (the pose that slot 1, object type $01, draws from main@18040) pointed at it, the draw routine reads all 14 bytes within 4 frames; the control run reads none of them."
