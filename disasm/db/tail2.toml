min_calls = 3
max_calls = 3000
model = '''
def vx_ok(rd, wr, romrd, x):
    ks = sorted(k for k in romrd if O('e4b_idle_vx') <= k < O('e4b_idle_vx') + 8 or O('e4b_roll_vx') <= k < O('e4b_roll_vx') + 4)
    if len(ks) != 2 or ks[1] != ks[0] + 1:
        return False
    base = O('e4b_roll_vx') if ks[0] >= O('e4b_roll_vx') else (O('e4b_idle_vx') + (4 if ks[0] >= O('e4b_idle_vx') + 4 else 0))
    if ks[0] != base + 2 * rd[0x784 + x]:
        return False
    v = romrd[ks[0]] | romrd[ks[1]] << 8
    if rd[0x61DC + x] & 0x80:
        v = (-v) & 0xFFFF
    return (wr[0x60E0 + x] | wr[0x60F2 + x] << 8) == v
'''
expect = "vx_ok(rd, wr, romrd, rd[0x6E])"

