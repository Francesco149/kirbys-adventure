unit = "tail2"
title = "The second tail: what the second batch of movies left (the credits' demos, file select texts, small tables)"
summary = """
The pieces the second batch of coverage movies (cov2-*) left undocumented, each named in the style of the unit that
documents its neighbours and claimed here.

The staff credits (cov2-save-finished from frame 143,778; cov2-minigame-bonus is a copy of it up to after them): after
the ending, 3F:E54D plays the attract demos 1-7 one after the other (demo_number counts up, demo_play), each a short
fight with one of the bosses in its own room while the status bar shows the staff (the input streams demo1_inputs ..
demo7_inputs, which follow demo0_inputs in bank 18). Type $00's first script e00_start goes to 18:A3AC for a demo
other than 0: credits_demo_page sets hud_picture to the demo's first page of names ($20 + 2 * (demo_number - 1)), the
script adds 1 for the second page, and it ends each demo with leave_code 1; after demo 7 (18:A3DE) the music fades
and credits_to_the_end sets up the room of THE END (room_return $0012, entry 2, kirby_start_mode 3) before room_enter.
The status bar's picture $2D (the second page of demo 7) is the 45th entry of the packed stream tables of bank 13
(packed_13_lo_2d / packed_13_hi_2d, one past the 44 that unit unpack declares).

The file select (bank 3D, units scenes and scenes3): the PPU records of the QUIT row and of ARE YOU SURE? No Yes
(fsel_quit_rec, fsel_sure_rec), the texts of the finished file's menu (fsel_finished_texts), the rank titles that
fsel_world_text names by the tens of a file's percentage (fsel_rank_texts: Water Drop for 0-9% .. Hero of Lore),
the labels LEVEL and FINISH (fsel_level_texts, fsel_finish_texts), Delete (fsel_delete_text), the 16 blanks that
text 4 has when drawn 23 wide (fsel_text4_wide), the rows a finished file offers (fsel_finished_masks), the state B
leads back to (fsel_back_tab) and the colour of the delete menu (fsel_del_color).

Small tables of enemies of banks 25, 29 and 2A read through obj_param (asm_vx_tab, asm_vy_tab, asm_tab_byte) or by
their own routines; the records of the Crash and Light palettes (bank 16); the climb's pose times on a ladder; Egg
Catcher's colours at the result, the third drift speed of the crane's claw and the claw's variable 7 by the doll it
holds; THE END's colours. The block lookup of bank 3F reads 28 bytes past screen_hi for cells outside the room, values
it throws away: they are the routine prop_extra_0d_at, which first ran in the third batch of coverage movies. The sound gaps (sndgap_*): bytes between or after the track regions of unit
snddata that no stream holds; snd_next_byte reads them only while it steps over the last elements of the stream
before them with Y > 0, and the value is thrown away.

A code chunk that kd next lists as a jump target never ran and is named as bytes, with the never-run code that
reaches it: crash_sweep_spawn_not_run (22:904C, called by crash_sweep's path for type $2A). Three more were named so
and have run since: 2A:B9B6 (e4f_tick_pace at a wall) in the third batch of coverage movies, now the routine
e4f_wall_turn; 26:A469 (the script switch of type $1E, cov4-e-sit) and 3B:B8CB (the claw's picture after a dropped
doll, cov4-d-crane) in the fourth, now e1e_set_script of unit en26b and crane_claw_drop of unit leftovers.

Open:
- 3D:BC1D, 3D:B6AE, 3D:A80B, 3D:AF4F and 3D:BEE5 are labels of unit leftovers (fsel_text_queue, fsel_file_empty,
  intro_tick_end, fsel_restate, continue_hub_sync), each with its claim; kd next lists them because a label does not
  count as described, and naming them again here would rename them.
- e4a_grip_pose (29:AEB9) takes two parameter bytes behind its asm_w (e4a_grab_args, e4a_throw_args): a line
  "29:AEB9" = 2 in db/scriptargs.toml would make them operands; here they are data.
- The script parts 18:A3AC / 18:A3DE (the credits' demos) are not named here. Which boss each demo shows is not
  claimed. The never-run paths of the egg result (kind 0: the colours at 3B:A826) and of the crane's other dolls
  (entries 0, 3-5 of crane_hold_tab) are described from the bytes only.
- tail.toml's crane_drift_vx says the third entry is code: it is the word $0100 at 3B:B415 (crane_drift_vx_2 here).
"""

