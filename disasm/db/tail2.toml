about = ["e4b_roll_vx", "e4b_idle_vx"]
text = "asm_vx_tab called with e4b_roll_vx or e4b_idle_vx sets the X velocity to the word of entry obj_param, negated when obj_dir has bit 7 set."
kind = "call"
