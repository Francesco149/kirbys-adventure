# ================================================================== models

[[model]]
name = "tail2_snd"
code = '''
def gap_read(romrd, g, n):
    return any(O(g) <= k < O(g) + n for k in romrd)

def gap_ahead(romrd, mem, y, g, n):
    ptr = mem(0x22) | mem(0x23) << 8
    return y > 0 and ptr < A(g) and [k for k in romrd if O(g) <= k < O(g) + n] == [O(g) + ptr + y - A(g)]
'''

