id = "tail2.demo_pad_feed.credits"
about = ["demo1_inputs", "demo2_inputs", "demo4_inputs", "demo7_inputs"]
text = "In the credits' demos every call of demo_pad_feed counts demo_input_timer down, steps to the next entry of the stream (and loads its count) when it reaches zero, and writes the entry's buttons to $E6 and the buttons not held before to $E7."
kind = "call"
fn = "demo_pad_feed"
on = ["cov2-save-finished@143800+700", "cov2-save-finished@146050+700", "cov2-save-finished@148480+350"]
min_calls = 1000
max_calls = 800
model = '''
def feed_ok(rd, wr, romrd, base_off, base_addr):
    cnt = (rd[0x6602] - 1) & 0xFF
    ptr = rd[0xE8] | rd[0xE9] << 8
    if cnt == 0:
        ptr += 2
        off = base_off + ptr - base_addr
        if wr.get(0x6602) != romrd.get(off + 1) or wr.get(0xE8) != (ptr & 0xFF):
            return False
        if (ptr >> 8) != rd[0xE9] and wr.get(0xE9) != (ptr >> 8):
            return False
    elif wr.get(0x6602) != cnt or 0xE8 in wr or 0xE9 in wr:
        return False
    b = romrd.get(base_off + ptr - base_addr)
    return b is not None and wr.get(0xE6) == b and wr.get(0xE7) == b & (rd[0xE6] ^ 0xFF)
'''
expect = "feed_ok(rd, wr, romrd, O('demo0_inputs'), A('demo0_inputs')) and A('demo1_inputs') <= (rd[0xE8] | rd[0xE9] << 8) < A('demo7_inputs') + 58"
cases = { "(rd[0x6602] - 1) & 0xFF == 0" = 20 }

