unit = "scenes3"
title = "The scenes, third part: the file select's other menus, the bonus games' levels, the ending, THE END"
summary = """
What the second batch of coverage movies (cov2-save-*, cov2-minigame-bonus, the ending of cov2-save-finished) ran of
the scenes for the first time: the file select with a file in use, the finished file's menus and the bonus games
started from them, the boss rematch, the level card of a loaded game, the ending after the last fight and THE END.

The file select (type $69, unit scenes: fsel_state and its 19 states, fsel_tick / fsel_input and fsel_next_tab). A
file in use shows its percentage: fsel_percent turns byte 2 of the file (the count of things done, 63 for everything)
into count * 400 / 256 rounded down (div_recip by 63; 46 things are 71%) and fsel_digits into two digit tiles.
"Delete Saved Game" (state 6, fsel_del_pick) offers the files in use with "Delete" (fsel_del_rows); choosing one
(state 7, fsel_del_sure) blanks the others (fsel_del_clear) and asks ARE YOU SURE? No / Yes with the hand moved by
Left / Right; Yes (state 9, fsel_del_do) erases bytes 2, 3 and $0A of the file and its backup (fsel_file_erase), and
state 2 again draws the list (fsel_redraw). Choosing a file in use goes to state 3 (fsel_go); for a finished file
(byte 3 = 8 or 9) fsel_finished_rows draws CONTINUE / PLAY BONUS GAMES / (two rows never shown) / QUIT. CONTINUE (state
0, fsel_continue) loads the file (fsel_begin -> save_load: save_transfer from the file, the bosses' marks kept,
continue_hub_sync, the level card of the saved world). PLAY BONUS GAMES (state 4, fsel_bonus_menu / fsel_bonus_rows)
lists PLAY CRANE FEVER, PLAY QUICK DRAW, PLAY EGG CATCHER, V.S. BOSS!, QUIT; a game (kept in variable 6) leads to the
level menu (state 5, fsel_levels: LEVEL1 EASY, LEVEL2 MEDIUM, LEVEL3 CHALLENGING); a level (variable 7) to state $0D
(fsel_bonus_go): fsel_bonus_spawn sets minigame_level and minigame_no_prize = 1 and puts the game's object
(fsel_bonus_types) in slot 1, and fsel_bonus_wait waits for slot 1 to be free; then state $0C (fsel_bonus_back)
draws the title and the bonus menu again. V.S. BOSS! (state $12, fsel_rematch) starts a game with $F4 = 2 and lives 0
in the first boss's room (fsel_rematch_room); after each boss rematch_next sends the game on to the next boss's room
(rematch_room_0..3 by world).

The bonus games at levels 1 and 2: Crane Fever at level 1 lets the claw coast on after the release for up to 8
frames (crane_coast_1, crane_at_right); Quick Draw lost after a won round (qd_shot_wait, qd_tick_shot, qd_any_won,
qd_lost_later) shows the result screen with one hat per round won (qd_rounds_result, qd_hat_count, qd_perfect,
qd_result_close; no prize in the bonus games). The level card of world 0 for a loaded game: its third figure bumps
into Kirby (lvcard_w0_burst, lvcard_w0_unflash, lvcard_chr0_86).

The ending (bank 2E, Kirby's object with ending_start's parts, unit scenes2): after ending_main's first 240 frames,
Kirby flies in the night sky with a trail of part 3 objects (ending_trail_gate, ending_by_kirby_rnd,
ending_offscreen), and ending_to_fountain (room_return $13, leave_code 1, kirby_start_mode 2) leads to the fountain's
room: ending_fountain (its parts, ending_spr_pal and its tables, ending_bg_pal_step, ending_at_kirby,
ending_signal_maker, ending_free_others, ending_fade_spr) ends with leave_code 8 (the credits, banks 28, 2B, 2D, 2F:
not this unit's). kirby_start_mode 3 is THE END (the_end): the fountain's room with the sign, sparkles, a figure at
the fountain, the sprite palette blinking (the_end_pal_cycle); Start (the_end_tick) fades the music and the screen
(the_end_leave, the_end_music_fade) and the_end_reset restarts the game from boot. Two routines of the fixed bank first
ran here: obj_move_world (a move routine) and sprites_draw_mirror_x.

Open:
- File select: states 8 (3D:B104, with 3D:B19D, 3D:B3D2-3D:B439: what Select / A / B change in $07E8 / $07E9 there),
  $0A (3D:B719), $0E-$11 (3D:B08B, 3D:B0A0, 3D:B0BC, 3D:B0F3) never ran; nor the finished file's row 3 (text $1C,
  LISTEN TO SOUNDS: byte 3 = 9) and fsel_digits' 0% and 100% corrections. Row 2 (PLAY EXTRA GAME, fsel_file_flags | 5
  for byte 2 >= 63), fsel_continue's row 2 (game_mode = 1, lives 2, hp $17) and the 100% paths of fsel_percent's
  callers (3D:B4B5, 3D:B60B, 3D:B6BA) first ran in cov5-f-del / cov5-f-extra (unit cov5_tour); the B button's path
  (3D:B20D) ran once, in cov2-minigame-bonus. What the texts $18, $19, $1A of fsel_text say is read from the screen only. $F4 = 2 is the
  rematch (game_mode, unit cov5_tour, which lists its readers). rematch_next's room $000C exit never
  ran, and only world 0 -> 1 was seen.
- Bonus games: Crane Fever at level 2 (3B:B03C, 3B:B056) first ran in the Extra Game (cov5-f-extra@243711:
  crane_speed_2, crane_coast_2, unit cov5_tour); the claw reaching $D6 while coasting never ran; Quick
  Draw's perfect banner after false starts (3C:B8D2) never ran.
- The ending: the scripts of ending_start's parts 1-7 and of ending_fountain's parts are described by their
  dispatchers only (velocity lists); 2E:BA00-2E:BA63 (the sparkles after 2,550 blinks), 2E:BB94, 2E:B5C4 and the
  never-reached ends of the parts' scripts never ran. What ending_blocks' blocks show, what $F7 = 0 does in
  help_screen before boot and what kirby_ability = $19 at THE END shows (the hud's BYE BYE picture) are not claimed.
- The labels 3D:BC1D, 3D:B6AE, 3D:A80B, 3D:AF4F and 3D:BEE5 stay with units scenes / leftovers.
"""

