# ---------------------------------------------------------------- claims: the file select

[[model]]
name = "scenes3_model"
code = '''
FSEL = [0xAF5D, 0xB728, 0xB251, 0xB147, 0xB137, 0xB12A, 0xB298, 0xB2B3, 0xB104, 0xB2C6, 0xB719, 0xB259, 0xB6E9,
        0xB032, 0xB08B, 0xB0A0, 0xB0F3, 0xB0BC, 0xAFFD]
FILES = [0x7903, 0x794F, 0x799B]
BAKS = [0x7929, 0x7975, 0x79C1]

def pct_parts(count):
    p = (count * 100 * 4) >> 8
    t, u = p // 10, p % 10
    if t == 0 and u == 0:
        u = 1
    if t >= 10:
        t, u = 9, 9
    return t, u

def thread_to(wr, addr, bank):
    return [t for t in range(32) if wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == bank]
'''

