# ---------------------------------------------------------------- claims: the ending

[[model]]
name = "ending3_model"
code = '''
def pos_of(m, x):
    """(X, Y) 16-bit position of slot x from a reader m (rd.get / mem)."""
    return (m(0x82 + x) | m(0x94 + x) << 8, m(0xB8 + x) | m(0xCA + x) << 8)

def placed(wr, x, px, py):
    return ((wr[0x82 + x] | wr[0x94 + x] << 8) == px & 0xFFFF and (wr[0xB8 + x] | wr[0xCA + x] << 8) == py & 0xFFFF
            and (wr[0x6074 + x], wr[0x6086 + x], wr[0x6098 + x], wr[0x60AA + x]) == (wr[0x82 + x], wr[0x94 + x], wr[0xB8 + x], wr[0xCA + x]))
'''

[[claim]]
id = "scenes3.ending.by_kirby_rnd"
about = ["ending_by_kirby_rnd", "ending_by_kirby_ofs"]
text = "ending_by_kirby_rnd puts the current object (position and world position) at slot 1's X + 10 and Y + (random(24) answer) - 12, the answer being (24 * new rng_state low byte) >> 8."
kind = "call"
fn = "ending_by_kirby_rnd"
use = ["ending3_model"]
on = ["cov2-save-finished@138490+400", "cov2-save-finished@140540+600"]
min_calls = 50
expect = "'random' in calls and placed(wr, rd[0x6E], pos_of(rd.get, 1)[0] + 10, pos_of(rd.get, 1)[1] + ((24 * wr[0x3E]) >> 8) - 12)"
cases = { "(24 * wr[0x3E]) >> 8 < 12" = 10, "(24 * wr[0x3E]) >> 8 >= 12" = 10 }

