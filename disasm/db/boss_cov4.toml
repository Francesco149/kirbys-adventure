unit = "boss_cov4"
title = "The bosses' moves the fourth batch of movies ran: banks 29, 2D and 2F"
summary = """
The code, scripts and small tables of the enemy banks 29, 2D and 2F that ran for the first time in the fourth batch
of coverage movies (cov4-*); bank 2A had nothing new. Each name follows the unit of its object type (en29, en2d,
en2f, en_more, boss_cov3); most of it ran once or twice, in one movie, so most claims hold one stretch of frames.

Bank 2D, type $47 (units en2d, en_more, boss_cov3: King Dedede by his look; cov4-a-ddd). Entry 4 of e47_set_script
is e47_fly: he puffs up and rises (76 frames of fixed Y velocities), then $0786 / $0787 = $012C and variable 4 = 1;
each frame his tick routine e47_tick_fly counts that down and flies at Kirby: e47_vy_toward adds 5 to the Y velocity
toward Kirby's height (up to $0180 either way), e47_vx_toward 8 to the X velocity toward the side he faces (he turns to
Kirby every frame), a wall or ceiling turns the Y velocity round. When the count runs out (300 frames) he lets the air
out: e47_spawn_self with 2 creates e47_breath (a type $47 with variable 0 = 2, placed by e47_breath_place 14 pixels in
front of his mouth, blown out at $0400 slowing to $0020; e47_breath_tick is its hit test with the record 39:8A8C, which
hurts Kirby), and script $0B, e47_fly_fall: velocity 0, e47_fall_high, a few fixed Y velocities, then gravity
(e47_fly_fall_step) until a floor; there e47_tick_fly_fall gives him script 0 (e47_rethink), with sound $22 when he fell
from high up. The landing of e47_walk_hop creates e47_puff (variable 0 = 1: a small puff thrown up and back from his
place for 3 frames, e47_puff_make and e47_puff_place). Kind 1 of the hammer (e47_swing_1 for him, e63_swing_1 and its
thread e63_swing_1_star for the hammer): up to four hops with a swing each, a shock star (e47_star_make) and the
effect $0C (e47_fx2) on every landing. e47_jump_still: the big jump with Kirby close (variable 5 = 1): the rise and
the fall with no X velocity. e47_swing_hurt: the reaction of the record 39:89FC to damage (the hammer is freed).
After the spat star with hp left Kirby rises in e47_kirby_spat with e47_spat_vx / e47_spat_side and e47_spat_done
puts him back into his normal states.

Bank 29, type $4A (unit en29, Bugzzy by its look; cov4-a-bugm, cov4-a-bug7): attack 1, e4a_fly: up at -$0340,
hovering for e4a_hover_count rounds of wing beats with no gravity (e4a_tick_fly), then e4a_fly_pick: Kirby near on X
(below $20) a landing, near on Y (below $10) the charge, else e4a_dive (e4a_dive_vel: toward Kirby by e4a_dive_vx /
e4a_dive_vy, twice as fast with obj_param 0). The throw 0 of e4a_grab, e4a_throw_0 / e4a_throw_0_shake: six shakes of
Kirby in the grip, the slam and the bounce back. Type $4B (unit en29 / boss_cov3, the shell mid-boss; cov4-a-turtle):
the answer 1 of e4b_throw_kind (e4b_throw_1 into e4b_throw_0: a leap with Kirby, e4b_vx_half, e4b_pose_arg_dir with
e4b_drop_args, e4b_throw_drop: 15 frames of hang and a dive at $0800, e4b_slam, e4b_tumble), Kirby's script after it
(e4b_kirby_dropped). Type $4E / $61 / $60 (the wizard; cov4-a-wiz): the end of attack 2 (e4e_throw2_end); the thrown
type $61 with variable 0 = 1 flies out (e61_star_round) and shoots six stars (e61_star_shot, e61_star_spawn with
e61_star_kind and e61_shot_dx_lo / _hi); a type $60 created with bit 7 of variable 0 set gets its velocity from
e60_launch (e60_launch_vy_lo ... e60_launch_vx_hi by variable 0 AND $7F).

Bank 2F, type $3D (unit en2f, Kracko by its look; cov4-a-kracko): state 2 of the eye, e3d_steer, which e3d_glide
starts when Kirby has passed it: every 4 frames the eye turns 8 toward Kirby and flies at $0140 along its direction.

Open:
- Type $47: e47_tick_fly_fall's e47_hit answering carry (2D:AAE6); e47_puff_place facing right (2D:AFE2); the clamp of
  e47_vy_toward going up (2D:B1F1); e47_swing_1's end after its four rounds (2D:A0EB: the loop was cut by a hit in its
  third round) and e63_swing_1's (2D:A1CC); kind 2 of the hammer (2D:A0EF, 2D:A137, 2D:A1D6); e47_spat_side with
  Kirby's world X high byte 2 or more (2D:A404 to 2D:A3B4) and e47_spat_vx's -$0080 (2D:AA10); the damage reaction of
  the flight's record 39:8A2C (2D:A494). What the sound $22 of a fall from high up means is not known.
- Type $4A: e4a_hover_count with obj_param not 0 (29:A456), e4a_fly_pick's answers 0 and 1 (29:A466, 29:A476), the
  entries 0, 2 and 3 of e4a_dive_vx / e4a_dive_vy, the second word of e4a_fly_vy, e4a_tick_fly answering carry
  (29:A4D7).
- Type $4B: the answer 0 of e4b_throw_kind entering e4b_throw_0 directly; e4b_pose_arg_dir facing right.
- Type $61: e61_star_shot with the boss below $19 hit points (29:B874-29:B889: by its bytes it alternates star kinds
  $81 and $82 by variable 8); entries 1 and 2 of the e60_launch tables, e61_shot_dx_lo / _hi entry 0.
- Type $3D: what ends state 2 is the code of en2f (e3d_glide_count), not checked here.
"""

[[model]]
name = "boss_cov4_model"
code = '''
def bc4_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def bc4_toward(v, a, lim):
    """2D:B1A9 / 2D:B1FC: v + A (sign by the limit's high byte), clamped at the limit, as the code does it
    (the clamp of the positive side stores the limit's high byte in both bytes when the high bytes differ)."""
    lo = (v & 0xFF) + a
    c = lo >> 8
    lo &= 0xFF
    hi = v >> 8
    lhi, llo = lim >> 8, lim & 0xFF
    if not lhi & 0x80:
        hi = (hi + c) & 0xFF
        if hi & 0x80:
            return hi << 8 | lo
        if lhi != hi:
            return hi << 8 | lo if lhi > hi else lhi << 8 | lhi
        return hi << 8 | lo if llo >= lo else lim
    hi = (hi - 1 + c) & 0xFF
    if not hi & 0x80:
        return hi << 8 | lo
    if hi != lhi:
        return hi << 8 | lo if hi >= lhi else lim
    return hi << 8 | lo if lo >= llo else lim

def bc4_script(wr, bank, addr):
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == bank for t in range(32))

def bc4_spawned(wr, typ):
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]

E4A_DIVE_VX = [0x40, 0xC0, 0x40, 0xC0]
E4A_DIVE_VY = [0x00, 0x00, 0xC0, 0xC0]
E60_LAUNCH = [(0x0680, 0x0800), (0x0200, 0x0C00), (0x0800, 0x0600)]
'''

