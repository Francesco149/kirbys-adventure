the pose table 33:9B28, tick routine e47_tick_fly, e47_pose_arg 1; the Y velocity 0 for 8 frames, the next pose, then
-$0300, -$0200, -$0100, -$0080 (4, 8, 8, 8 frames: he rises, puffed up), variable 5 = 1, $0080 for 8 frames, sound $48,
the next pose, $0100, $0080, -$0020, -$0080 for 8 frames each, $0034; then $0786 / $0787 = $012C (the frames of the
flight), variable 4 = 1 (e47_tick_fly flies from now on), and the thread halts."""

[[sym]]
