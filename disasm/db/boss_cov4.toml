[[claim]]
id = "boss_cov4.e47.tick_fly"
about = ["e47_tick_fly"]
text = "e47_tick_fly calls e47_hit first. With variable 4 = 0 it writes nothing else; otherwise $0786 / $0787 counts down by 1; at 0 an object of type $47 with variable 0 = 2 appears and the boss gets the script e47_fly_fall; otherwise his pose is 5 facing right and 4 facing left (obj_dir as obj_face_kirby set it: $40 when he is left of Kirby by world X), and the X velocity is e47_vx_toward's result of the old one with 8 / -8 toward $0180 / -$0180; the Y velocity the same with 5 toward $0180 when he is above Kirby (world Y) and -5 toward -$0180 otherwise, unless obj_vy_neg_cur ran. All the paths happen."
kind = "call"
fn = "e47_tick_fly"
on = ["cov4-a-ddd@132160+400", "cov4-a-ddd@133380+410"]
min_calls = 700
max_calls = 420
use = ["boss_cov4_model"]
model = '''
def fly_ok(x, rd, wr, calls, ran):
    if calls[0] != 'e47_hit':
        return False
    if rd[0x6212 + x] == 0:
        return 0x786 not in wr
    n = (bc4_w(rd, 0x786, 0x787) - 1) & 0xFFFF
    if bc4_w(wr, 0x786, 0x787) != n:
        return False
    if n == 0:
        return any(wr.get(0x61CA + i) == 2 for i in bc4_spawned(wr, 0x47)) and bc4_script(wr, 0x2D, A('e47_fly_fall'))
    own_x = bc4_w(rd, 0x6074 + x, 0x6086 + x)
    kx = bc4_w(rd, 0x6075, 0x6087)
    d = 0x40 if own_x < kx else 0xC0
    if wr[0x61DC + x] != d:
        return False
    if d == 0x40:
        pose, vx = 5, bc4_toward(bc4_w(rd, 0x60E0 + x, 0x60F2 + x), 8, 0x0180)
    else:
        pose, vx = 4, bc4_toward(bc4_w(rd, 0x60E0 + x, 0x60F2 + x), 0xF8, 0xFE80)
    if wr[0x62C6 + x] != pose or bc4_w(wr, 0x60E0 + x, 0x60F2 + x) != vx:
        return False
    if ran('2D:AAB7'):
        return True
    own_y = bc4_w(rd, 0x6098 + x, 0x60AA + x)
    ky = bc4_w(rd, 0x6099, 0x60AB)
    if own_y < ky:
        vy = bc4_toward(bc4_w(rd, 0x6104 + x, 0x6116 + x), 5, 0x0180)
    else:
        vy = bc4_toward(bc4_w(rd, 0x6104 + x, 0x6116 + x), 0xFB, 0xFE80)
    return bc4_w(wr, 0x6104 + x, 0x6116 + x) == vy
'''
expect = "fly_ok(rd[0x6E], rd, wr, calls, ran)"
cases = { "rd[0x6212 + rd[0x6E]] == 0" = 100, "ran('2D:AA89')" = 2, "ran('2D:AAB7')" = 2, "ran('2D:AAD3')" = 200, "ran('2D:AAC9')" = 200, "ran('2D:AAA3')" = 200, "ran('2D:AA9A')" = 100 }

