of the script) nothing more. Otherwise $0786 / $0787 - 1; at 0 e47_spawn_self with 2 (e47_breath) and script $0B
(e47_fly_fall). Otherwise e47_vy_toward with A = 5, limit $0180 when he is above Kirby (obj_dy_kirby's $05 = 1), with
A = -5, limit -$0180 otherwise; obj_collide_any with the point set 9: carry or bit 1 of the answer (a wall or a
ceiling) negates the Y velocity (obj_vy_neg_cur, 3 times in cov4-a-ddd); obj_face_kirby; pose 5 and e47_vx_toward
with 8, limit $0180 facing right, pose 4 and -8, limit -$0180 facing left."""

[[sym]]
at = "2D:B1A9"
name = "e47_vy_toward"
desc = """For e47_tick_fly: the Y velocity of the current object + A (sign-extended by the sign of the limit's high byte
Y), then held at the limit Y:X: with a positive limit a velocity above it (and not negative) becomes the limit; with a
negative limit a velocity below it (and negative) becomes the limit (never reached). When the high bytes differ on the
positive side the code stores the limit's high byte in both bytes (a velocity of $02xx would become $0101)."""
in = "A = the step, Y:X = the limit"

[[sym]]
at = "2D:B1FC"
name = "e47_vx_toward"
desc = "e47_vy_toward for the X velocity: the X velocity + A, held at the limit Y:X in the same way. Both clamps happen."
