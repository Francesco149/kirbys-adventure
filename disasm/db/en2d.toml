by variable 0: 0 the boss (2D:A011); 1, 2 and 3 (2D:A58D, 2D:A59F, 2D:A5E4) are things he creates himself: 3 is
e47_star (unit boss_cov3); 1 (from 2D:AD3A at the landing of e47_walk_hop) and 2 (from 2D:AA64 at the end of his
flight) ran only in cov4-a-ddd and are not documented yet. The boss: variable 3 = 0 (the frames he blinks and cannot be damaged), a second thread with
e47_stand_poses, e47_place; then every frame e47_face and e47_wait_kirby until that answers 0. Then variable 2 = 0
(the number of what he does), $0785 = $FF (the slot of an object he holds: none), $0788 = 0, 22:89F3, e47_plan; when
no demo runs the bar fills: 25 times sound $12 and variable 0 + 4 every 6 frames. At 2D:A04A: variable 0 = $64
