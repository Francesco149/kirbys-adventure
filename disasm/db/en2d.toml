def e21_tick_ok(rd, wr, ran, calls, mem, rec, first, land, wall, script):
    s = rd[0x6E]
    d, v2 = 0x61DC + s, 0x61EE + s
    if calls[0] != "obj_water_test" or wr[0x27] != rec or wr[0x28] != 0x8F:
        return False
    if not ran(first):
        return "obj_collide0" not in calls and v2 not in wr
    if "obj_gravity_a" not in calls or "obj_collide0" not in calls:
        return False
    if ran(land):
        return wr[v2] == (rd[v2] - 1) & 0xFF and e2d_script(wr, script) and d not in wr
    if ran("3E:CCA7"):
        return False
    if ran(wall):
        return "obj_turn" in calls and wr[v2] == 0x28 and wr[d] == rd[d] ^ 0x80
    return v2 not in wr and d not in wr
'''
