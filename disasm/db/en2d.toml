E41_VX = [0x00, 0x00, 0x80, 0xC0]
E47_SCRIPTS = [0xA061, 0xA2AB, 0xA214, 0xA31C, 0xA407, 0xA09D, 0x0000, 0x0000, 0xA187, 0xA0AB, 0xA32A, 0xA453, 0xA51D, 0xA607]
E47_PLANS = [0xADD2, 0xADD2, 0xADDA, 0xADE2, 0xADF2, 0xADEA, 0xADEA, 0xADEA]
E47_LISTS = [3, 5, 2, 5, 3, 2, 5, 3, 5, 1, 3, 5, 1, 5, 3, 5, 1, 2, 5, 2, 5, 1, 2, 5, 3, 2, 3, 2, 1, 3, 1, 2, 5, 1, 3, 2, 5, 2, 1, 5]
E47_RECS = [0x89CC, 0x8A5C, 0x89E4, 0x8A14, 0x8A2C, 0x8A44, 0x89FC]
E64_VX = [0x0200, 0x0080]

def e2d_script(wr, addr):
    """obj_set_script gave a thread this address in bank 2D."""
    return any(wr.get(0x6380 + t) == addr & 0xFF and wr.get(0x63A0 + t) == addr >> 8 and wr.get(0x63C0 + t) == 0x2D for t in range(32))

def e2d_w(m, lo, hi):
    return m[lo] | m[hi] << 8

def e2d_s16(v):
    return v - 0x10000 if v & 0x8000 else v

def e2d_signed(v, d):
    """A speed toward the side a direction faces: negated when bit 7 of the direction is set."""
    return (-v if d & 0x80 else v) & 0xFFFF

def e2d_spawned(wr, typ):
    """The slots 9-17 in which the call created an object of this type."""
    return [i for i in range(9, 18) if wr.get(0x6128 + i) == typ]

def e2d_pick(weights, skip, rng):
    """22:8FA2: an index by weights, never the index skip; rng = rng_state after the call's random."""
    r = ((sum(weights) - weights[skip]) * rng) >> 8
    acc = 0
    for i, w in enumerate(weights):
        if i == skip:
            continue
        acc += w
        if acc >= r:
            return i
'''

