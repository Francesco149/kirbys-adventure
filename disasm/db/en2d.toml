The long sweep of type $20, twice: variable 3 = 0 (not stopped), then per stroke the X velocity $0100 toward the
side it faces (3F:E26A) and five phases, each with its number in variable 2 (e20_tick takes the speed of the phase
from e20_speed_lo / _hi every frame) and a pose of its direction: phase 0 pose 1 for 10 frames, phase 1 the same
pose 10 more, phase 2 pose 2 for 8, phase 3 pose 3 for 10, then sound $23 and a puff of dust (22:9591 creates an
object of type $59, first script 26:B99B, with the variables 0 = 1, 1 = obj_dir, 3 = 1, 4 = $0C, 5 = 8), phase 4
pose 2 for 2 frames. After the two strokes on to e20_next.
