unit = "en2d"
title = "Object types $20, $21, $36, $37, $41, $47, $63, $64: the sweeper, the mushroom, the wheel, the ghost, the blade thrower and the boss of bank 2D"
summary = """
Bank 2D: the object types $20, $21, $36, $37, $41, $47 (the last boss), $64 and $63 (his hammer; only the credits' demo fight started it, documented in unit en_more), in the
pattern of unit en24a (a first script that sets the object up, scripts that are behaviours, tick routines that begin
with the hit test 3F:E31D and a record of bank 39 and start another script through obj_set_script when something
changed), plus two reaction scripts of the record of type $3B (2D:B878-2D:B88D).

Type $21 (e21_*; kind $99): a creature under a mushroom cap that hops toward the side it faces (by its look and its
cap the game's Cappy): X velocity $0040, Y velocity -$0100, gravity $10, a turn at a wall; variable 2 counts 40
landings until it turns by itself. Inhaled, its record gives e21_inhaled: the cap goes into Kirby's mouth and a new
type $21 with variable 0 = 1 is left behind, the creature without its cap (e21_bare), thrown away from Kirby, which
then hops toward him with another record.
Type $20 (e20_*; kind $96): a creature in a pointed hat with a broom (the game's Broom Hatter). It sweeps: a stroke is
five phases whose number (variable 2) picks the X speed from e20_speed_lo / _hi every frame, with a puff of dust
(type $59 through 22:9591) at the stroke's end. e20_choose picks the next of three behaviours by weights 3, 2, 3,
never the same twice (variable 5): two strokes toward Kirby, two away from him, or three short strokes to both sides
(e20_dab). e20_edge stops it in the middle of its block at an edge or a wall (variable 3 = 1, variable 6 reversed),
and the next choice is then a sweep back.
Type $41 (e41_*; kinds $67-$6A, the class 0-3 in variable 9 from variables 0 and 1): a small armoured creature with a
blade on its helmet (the game's Sir Kibble). The classes 0 and 1 stand, 2 and 3 walk at $80 / $C0 and turn at walls
and edges; after $B4 or $78 frames (variable 5) it stops, faces Kirby and after $30 frames throws its blade: a type
$41 with variable 0 = 2 (e41_blade), which flies out at $02A8, slows by $10 per frame to -$02A8 and is freed when it
comes back within 3 x 4 pixels of its thrower (variable 2). The thrower waits $5F frames and walks again.
Type $36 (e36_*; kinds $88-$8A, speed class in obj_param): a wheel (the game's Wheelie). It rolls at $0100 / $0180
for 32 frames, then at $0200 / $0300. A wall on the ground: a hop up (e36_bump) and it rolls back; no floor: it falls
(e36_tick_fall), hangs two frames at a wall in the air and falls on reversed; landing while it rolls away from Kirby
it brakes (e36_brake: dust puffs, $0C less speed per frame), waits 5 or $23 frames turned round and rolls again.
e36_set_script is the common exit of the tick routines, with seven scripts by number.
Type $37 (e37_*; kind $93): a small ghost with a light that drifts left at $0080 per frame in a wave of eight steps of
8 frames, through walls; its tick routine is the hit test alone.
Type $64 (e64_*): a small pale lump that the blue fighter of type $4C creates through 28:A623 / e64_spawn (variable 2
= 1): it flies out at $0200, then $0080, lies there and vanishes; harmless (record 39:8ABC). The boss of type $47
creates it with variable 2 = 0 (record 39:8AA4, which hurts) as the shock stars of his jump and his hammer in the
credits' demo fight (e47_jump_land, e47_star_make: documented in unit en_more).
Type $47 (e47_*; kind $D8): the last boss, the big figure in the red robe with the hammer (the game's King Dedede).
e47_start places him, waits until Kirby has come down (e47_wait_kirby), fills his bar to 100 hit points (unit hud
shows 5/8 of it) and waits. e47_think picks the next action after $18 frames from one of five lists of e47_plans by
what he did last (variable 6) and starts it through e47_set_script / e47_scripts; the fight in main holds e47_walk (walking
at Kirby, e47_walk_poses) and e47_approach (walking to a point $0F beside Kirby). The demo fight of the credits after
the ending (cov2-save-finished@148578-149200) ran the actions 0, 1, 5, 9 and 10, the hop at the end of a walk and the
hammer (type $63): documented in unit en_more (e47_rethink, e47_jump, e47_carry, e47_swing, e47_inhale, e47_walk_hop,
e63_start). Damage (record 39:89CC) starts
e47_hurt: he shakes, and is then shielded for 48 frames (variable 3, e47_hit_shield, blinking). Hit points
gone: e47_dead, a fall to the floor (e47_tick_drop), e47_end: he slides, Kirby is turned to him and given a script,
the screen fades and leave_code = 5. $0786 is his wait counter, $0788 the count of actions, $0785 the slot of an
object he holds ($FF none), $078B / $078C the point he walks to.

Open:
- Never ran in any movie: in type $21 the 40-landing turn (2D:B794; an effect claim shows it) and the wall turn of
  the bare creature (2D:B865); in type $20 the fall script 2D:B657 with its tick routine 2D:B6B8 and e20_edge's
  carry clear and answer-1 paths; in type $41 the second attack 2D:BB8F (a random draw of 2 when Kirby is near,
  never drawn in 6), state 2 (2D:BD00), case 3 of e41_walk_cases (2D:BC9E), the fall at 2D:BC49, a thrower in water
  freeing the blade and the second entry of e41_blade_lo / _hi; in type $36 the brake started by e36_tick_roll's
  draw (the third test never passed) and the third entry of e36_waits; in type $64 the shock star of a boss that
  faces left (2D:A87C in e47_star_make, unit en_more). The variant with variable 2 = 0 (2D:A642, record 39:8AA4) and
  the calls of e64_spawn in the boss's code (2D:A882 in e47_star_make, 2D:AC75 and 2D:AC83 in e47_jump_land) ran in
  the credits' demo fight (unit en_more).
- Type $47: the fight in main (main@129356-130263) ran the actions 2 (e47_walk) and 3 (e47_approach) only; the demo
  fight of the credits (cov2-save-finished@148578-149200) ran the entries 0, 1, 5, 8, 9 and 10 of e47_scripts
  (2D:A061, A2AB, A09D, A187, A0AB, A32A), the arrival of e47_approach, the hop at the end of a walk (2D:A22B) and
  the records 2, 3 and 6 of e47_recs: documented in unit en_more. Entry 13 (2D:A607) is
  e47_star_land (unit boss_cov3). Ran only in cov4-a-ddd and not documented yet: the entries 4 and 11 (2D:A407, the
  puffed-up flight with tick routine 2D:AA64, and 2D:A453, its fall with 2D:AADF), the variants 1 and 2 of the first
  script (2D:A58D, A59F: objects he creates; 3 is e47_star), record 4 of e47_recs, the path of e47_tick_walk for
  variable 5 = $FF (2D:AD29), the count of six actions in e47_tick_think (2D:AD9A), e47_tick_end with a boss facing
  right (2D:AF76) and the bytes 1, 3 and 4 of e47_waits. Never ran: the records 1 and 5 of e47_recs, e47_drop with an
  object held, the path of e47_tick_end for variable 6 positive (2D:AF27), leave_code 7 and byte 7 of e47_waits. Most of his claims here have the calls of
  the fight in main.
- Type $63 (first script 2D:A179, e63_start, tick routine 2D:A73C, e63_tick_held): the boss's hammer, which
  e47_hammer_make creates for action 5; documented in unit en_more.
- The reactions of the record of type $3B for kinds 2 and 3 (2D:B886, 2D:B88D) never ran.
- Bank 22 and other helpers used by address: 22:8003 (inhaled), 22:8100 (hit points gone), 19:B2A0 and 16:A9CE
  (kinds 2, 3 of kirby_rect), 22:9591 (dust puff $59), 22:8C71 (spawn a child with direction), 22:8FA2 (weighted
  pick), 22:962E, 22:9684, 22:83A3, 22:92B1 (moving away from Kirby), 22:9282, 22:90BA, 22:8A6C, 22:89F3, 22:859F,
  22:8C05, 22:8CAA, 3E:DE45.
"""

