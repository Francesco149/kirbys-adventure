unit = "cov10"
title = "What the tenth batch of coverage movies ran first, and the batch's unreachable branches"
summary = """
What the nine movies of the tenth batch ran for the first time (tas/tasks/cov10-*.md), and the branches the batch's
triage found unreachable by the code itself.

The walking squid's life in water (cov10-c-squid). Room 158 is a pier over water with walking squids (type $1D,
variant 0) on its right part. A walker that walks off the end of the pier (e1d_walk_fall) is caught by e1d_hit's water
test in its fall (26:A1A9, 126808): entry 2 of e1d_scripts, e1d_sink. It makes a splash, sinks a quarter pixel a
frame for 96 frames (e1d_tick_sink: the hit test and obj_collide0 only), then bobs (e1d_tick_bob): Y velocities
+0.5, -1, -0.5, -0.25, +0.25 for 10 frames each, 10 pixels up per round of 50 frames, until its position is no longer
in water (127028). Then entry 4, e1d_hop_out: a splash at its place, sound $0D, it faces Kirby and leaps out with X
velocity 1.5 toward him and Y velocity -3 (e1d_tick_hop_turn: e1d_hit_unless_rising, gravity, obj_collide0); it
lands on the pier (127087: sound $0E, entry 5, e1d_hop_land), stands 10 frames (e1d_tick_hit_only) and walks again
(e1d_walk). These entries were never = true in unit dead_en1.

Kirby's states (the exits of state routines that no movie had taken; each is jsr test / bcc / ldx #script /
jmp kirby_script_upkeep, and each ran once): into water from the flap ($30), the puff ($33) and the knock-back of
a hit (kirby_st_hurt to script $EB, kirby_s_hurt_water: the splash and kirby_s_hurt_end; it was never = true in unit
dead_kirby) with the Beam over World 1's pool, and out of it with the Beam's water spit ($39) (cov10-a-pool); Sword
Kirby walking off an underwater step ($7A) and a slash falling into the pool ($77) (cov10-a-sword); Up at a door
(script 0) from the Parasol's run, turn, float, puff and dive, the Parasol's jump at the top of the room ($BC), and
B ($C5), Up ($C6) and Select (1) in the Parasol's dive bounce (cov10-a-para); B ($A8), Up ($A9) and Select in the
Hammer's dive bounce (cov10-b-hdive); the Hammer's flap ($AB) and puff ($AE) into the sea of 6-3, Select while it
swims, and the ladder's step count running below 0 and starting again at 3 (cov10-b-h74); Ball Kirby's jump and
bounce into the ceiling ($D7) and Up at a door from the resting ball (cov10-b-ball); Up in the Star Rod's dive ($8D,
cov10-b-roddive) and the camera exit of the flight during the shot ($EC, cov10-b-rodfly).

Unreachable, by the code (static verdicts of the batch's triage, each checked here against the ROM; claims below):
- pad_up_door after an Up test. pad_up_door answers carry clear unless Up (bit 3 of pad1_held_copy) is held;
  pad_up_held, pad_a_up_held (A or Up) and swim_stroke_test (A or Up) answer carry set whenever Up is held, and
  nothing between two tests of a chain writes pad1_held_copy (only room_enter, demo_init and demo_pad_feed do). So
  in the 29 chains where one of them comes earlier (with its exit), the door exit cannot be taken: kirby_st_fall,
  kirby_st_dive, kirby_st_dive_hit, kirby_st_float, kirby_st_water_stand, kirby_st_water_walk, kirby_st_ab_dive,
  kirby_st_ab_float, kirby_st_ab_water_stand, kirby_st_ab_water_walk (bank 14); kirby_st_sword_dive,
  kirby_st_sword_float, kirby_st_sword_water_stand, kirby_st_sword_wade, kirby_st_para_hover,
  kirby_st_para_water_stand, kirby_st_para_water_walk (bank 15); kirby_st_rod_dive, kirby_st_rod_float, the rod's
  water stand and walk (never run themselves), kirby_st_hammer_fall, kirby_st_hammer_dive, kirby_st_hammer_dive_hit,
  kirby_st_hammer_float, the Hammer's water stand and walk (bank 17); the mouthful's water stand and walk (18:B508,
  18:B5AF). The groups in between are all jsr / bcc / ldx / jmp (claim cov10.up_before_door), and no branch of the
  listing lands inside them from elsewhere (checked on out/src, not claimed).
- The UFO's door test (kirby_st_ufo_hover, 17:B85C) needs ufo_hover_dir to answer no with Up held, that is
  ufo_pad_dir = $FF for a low nibble with bit 3 set: only Up + Down or Up + Left + Right. joypad_store drops Up + Down
  and Left + Right before anything sees the pad, and the demos' input streams hold neither pair: unreachable on the
  hardware too, not only in this emulator. The two drops themselves (3E:C2E8, 3E:C2F6) are reachable on hardware
  with a pad that reports opposite directions; the emulator core the workbench uses filters such pairs, so no movie
  can play them.
- The Noddy's distance test (25:AC4C-25:AC5E in e2e_tick_sleep): needs variable 3 = 0 with variable 2 not 0. The
  sleep sets 2 = $E0 and 3 = 1, variable 3 is decremented only on the frame variable 2 reaches 0, and that frame
  wakes it (25:AC40) before the class test. cov10-c-noddy (in tas/tasks, left out of the corpus) played a class-1
  Noddy asleep: each frame it took 25:AC47 and returned.
- The spin rectangles: sword_spin_rect_hi holds $A8 in all sixteen entries (the index is the spin's pose - $52, poses
  $52-$61 from kirby_s_sword_spin), so 15:A869's beq on a zero high byte is never taken; the same for rod_spin_rect_hi
  ($A3) and the Hammer's air swing (hammer_air_swing_rects + 16, $B4).
- hub_pan_setup loads hub_pan_tab,x twice (15:BD19 and 15:BD25) and compares |dx| with |dx|, so the bcs at 15:BD31
  is always taken and hub_pan_y_first is always 0 (unit kst15 says so too).
- room_pick_kind: lda #$00 / sta stage_kind / beq at 13:A19C: the beq at 13:A1A1 is always taken.
- snd_track_cmd at 1D:8355: clc, the volume's high nibble (0-15) plus the command byte, and the bmi takes every byte
  of $80 or more first, so the sum is at most $8E and the bcc at 1D:835C always goes.
- The lunging squid never meets water (26:A306, 26:A332): kind $4D (variant 2) is in two rooms' object lists only,
  158 (at the top row, position byte $F0) and 245 (twice). Room 158's lunger rises out of the top of the room and is
  freed (main@126318-126344); room 245 has no water (the triage's reading of its map; not claimed here).

Open:
- Room 245's lack of water is not claimed; nor is that the lunger of room 158 is freed in every play.
- In the squid's water life: the bottom (e1d_tick_sink's landing, 26:A141), a ceiling or a wall in the hop, and water
  under the hop's fall (e1d_hit_unless_rising would start e1d_sink again) never ran.
"""

[[model]]
name = "cov10_model"
code = '''
def kx(ran, rd, wr, romrd, at, k, cond):
    """The exit at `at` (ldx #k / jmp kirby_script_upkeep) ran at most once; when it ran, its test's condition
    holds and Kirby's script was set to k."""
    m = ran(at)
    return m == 0 or (m == 1 and bool(cond) and script_set(rd, wr, romrd, k))

def wet(romrd):
    """bit 7 (water) of a prop_shape entry the call read"""
    return any(v & 0x80 for o, v in romrd.items() if O('prop_shape') <= o < O('prop_shape') + 127)

def e1d_pc(rd, wr):
    """the program counter the call gave the current object's thread, or None"""
    t = rd.get(0x614C + rd[0x6E])
    if t is None or 0x6380 + t not in wr:
        return None
    return wr[0x6380 + t] | wr[0x63A0 + t] << 8

def ladder_ok(rd, wr, mem, romrd):
    v2 = (rd[0x61EF] - 1) & 0xFF
    v3 = rd[0x6201]
    if v2 >= 0x80:
        v3 = (v3 - 1) & 0xFF
        if v3 >= 0x80:
            v3 = 3
        v2 = romrd.get(O('hammer_ladder_waits') + v3)
    return mem(0x61EF) == v2 and mem(0x6201) == v3 and wr.get(0x62C7) == romrd.get(O('hammer_ladder_poses') + v3)

def grp(o):
    b = rom[o:o + 10]
    return len(b) == 10 and b[0] == 0x20 and b[3] == 0x90 and b[4] == 5 and b[5] == 0xA2 and b[7] == 0x4C and u16(o + 8) == A('kirby_script_upkeep')

def up_door_sites():
    """PRG offsets of the decoded jsr pad_up_door groups whose chain has an Up test (pad_up_held, pad_a_up_held,
    swim_stroke_test) earlier, with only such groups in between"""
    ups = (A('pad_up_held'), A('pad_a_up_held'), A('swim_stroke_test'))
    out = []
    for o in range(len(rom) - 10):
        if rom[o] == 0x20 and u16(o + 1) == A('pad_up_door') and kind(o) == 'c' and grp(o):
            p = o
            while p >= 10 and grp(p - 10):
                p -= 10
                if u16(p + 1) in ups:
                    out.append(o)
                    break
    return out

def lungers():
    """(room, position byte) of every object of the 327 rooms' lists whose kind makes type $1D with variant 2"""
    out = []
    for r in range(327):
        o = u8(O('room_objs_bank') + r) << 13 | (u8(O('room_objs_lo') + r) | u8(O('room_objs_hi') + r) << 8) & 0x1FFF
        nc = u8(o)
        n = u8(o + 2 + nc - 1)
        xy = o + 2 + nc
        for i in range(n):
            k = u8(xy + n + i)
            if u8(O('objs_kind_type') + k) == 0x1D and u8(O('objs_kind_vars') + k) & 0x0F == 2:
                out.append((r, u8(xy + i)))
    return out
'''

# ================================================================= the walking squid in water (cov10-c-squid)

[[script]]
at = "26:A06B"
name = "e1d_sink"
desc = """
Run once (cov10-c-squid@126809: a walker that fell off room 158's pier into the water). Entries 2 (e1d_hit found water)
and 8 (the lunger's water test, never) of e1d_scripts. asm_far 21:9952 with 00 F0 05 00 (an effect object of type 5,
the splash, 16 pixels above it), tick routine e1d_tick_sink, velocity 0, pose 4, Y velocity $0040 (a quarter pixel a
frame down) for $60 frames; then tick routine e1d_tick_bob and from 26:A083 for good the Y velocities $0080, $FF00,
$FF80, $FFC0, $0040 for 10 frames each: 10 pixels up per round.
"""

[[script]]
at = "26:A095"
name = "e1d_hop_out"
desc = """
Run once (cov10-c-squid@127029). Entry 4 of e1d_scripts (e1d_tick_bob: no water at its place): the splash at its own
height (asm_far 21:9952, 00 00 05 00), sound $0D, tick routine e1d_tick_hop_turn, obj_face_kirby, X velocity $0180
toward Kirby (3F:E26A), Y velocity -3, pose 5, halt.
"""

[[script]]
at = "26:A0B3"
name = "e1d_hop_land"
desc = """
Run once (cov10-c-squid@127088). Entry 5 of e1d_scripts (the hop landed): velocity 0, tick routine e1d_tick_hit_only,
pose 4 for 10 frames, then e1d_walk: it walks again.
"""

[[sym]]
at = "26:A130"
name = "e1d_tick_sink"
desc = """
96 calls (cov10-c-squid from 126809). Tick routine of e1d_sink: hit_test_far with the record 39:8F0C (carry set:
done); obj_collide0: landed, or bit 1 of its answer (a ceiling): Y velocity 0 (22:9458; never: the squid of the
movie never reached the bottom). No water test: it sinks wherever it is.
"""

[[sym]]
at = "26:A145"
name = "e1d_tick_bob"
desc = """
124 calls (cov10-c-squid from 126905). Tick routine of the bobbing: obj_pos_off (0, 0) and prop_bit7_at; no water
at its place: entry 4 of e1d_scripts (e1d_hop_out; once, 127028). In water: the hit test 39:8F0C and obj_collide0
(Y velocity 0 when it lands or meets a ceiling: never).
"""

[[sym]]
at = "26:A16D"
name = "e1d_tick_hop_turn"
desc = """
59 calls (cov10-c-squid from 127029). Tick routine of e1d_hop_out: e1d_hit_unless_rising, obj_gravity, obj_collide0;
landed: sound $0E and entry 5 of e1d_scripts (e1d_hop_land; once, 127087). In the air a wall would turn it (obj_turn,
22:84BC) and a ceiling negate its Y velocity (22:8503): neither ran.
"""

[[sym]]
at = "26:A192"
name = "e1d_tick_hit_only"
desc = "10 calls (cov10-c-squid from 127088). Tick routine of e1d_hop_land: e1d_hit and nothing else."

[[sym]]
at = "26:A196"
name = "e1d_hit_unless_rising"
desc = """
59 calls, from e1d_tick_hop_turn. While the object moves up (Y velocity high byte negative) it goes to 26:A1B0, the
hit-test part of e1d_hit; otherwise it falls into e1d_hit, whose water test comes first. So the squid leaping out of
the water does not start e1d_sink again on its way up.
"""

