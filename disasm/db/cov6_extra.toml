# ================================================================== models

[[model]]
name = "cov6_snd"
code = '''
TRACK_LEN = {0xE0: 3, 0xE3: 2, 0xF0: 2, 0xF1: 2, 0xF2: 2, 0xF3: 2, 0xF4: 2, 0xF5: 2, 0xF6: 2,
             0xF8: 3, 0xFA: 3, 0xFB: 1, 0xFC: 2, 0xFD: 1, 0xFF: 1}
ENV_LEN = {0xF8: 3, 0xFA: 3, 0xFB: 1, 0xFC: 2, 0xFD: 1, 0xFF: 1}


def elen(b, env):
    if env:
        return 1 if b < 0xA0 else ENV_LEN.get(b)
    return 1 if b < 0xC0 else 2 if b < 0xE0 else TRACK_LEN.get(b)


def song_hdr(i):
    b = u8(O('snd_song_bank') + i)
    h = u8(O('snd_song_lo') + i) | u8(O('snd_song_hi') + i) << 8
    return b * 0x2000 + (h & 0x1FFF)


def sfx_hdr(i):
    h = u8(O('snd_sfx_lo') + i) | u8(O('snd_sfx_hi') + i) << 8
    return 0x1D * 0x2000 + (h & 0x1FFF)


def hdr_whole(o):
    return all(dataread(o + k) for k in range(1 + 3 * u8(o)))


def walk(starts, env):
    """-> (offsets of every element reachable from starts, [(offset, byte)] of first bytes that are no element)."""
    seen, bad, todo = set(), [], list(starts)
    while todo:
        o = todo.pop()
        bank = o >> 13
        w = 0x8000 if bank == 0x1D else 0xA000
        while o < (bank + 1) * 0x2000 and o not in seen:
            b = u8(o)
            n = elen(b, env)
            if n is None:
                bad.append((o, b))
                break
            seen.add(o)
            if b in (0xF8, 0xFA):
                todo.append(bank * 0x2000 + (u8(o + 1) | u8(o + 2) << 8) - w)
            if b in (0xFF, 0xFB, 0xF8):
                break
            o += n
    return seen, bad


def tracks():
    out = []
    for o in [sfx_hdr(i) for i in range(88)] + [song_hdr(i) for i in range(58)]:
        bank = o >> 13
        w = 0x8000 if bank == 0x1D else 0xA000
        out += [bank * 0x2000 + (u8(o + 1 + 3 * k) | u8(o + 2 + 3 * k) << 8) - w for k in range(u8(o))]
    return out


def envs():
    return [0x1D * 0x2000 + (u8(O('snd_inst_envs') + 2 * i) | u8(O('snd_inst_envs') + 2 * i + 1) << 8) - 0x8000
            for i in range(82)]
'''

# ================================================================== claims: the sound test

[[claim]]
id = "cov6_extra.snd.step"
about = ["fsel_input_snd", "snd_test_step"]
text = "In state 8 every call of fsel_input that reaches snd_test_step (Right on the MUSIC or SOUND EFFECT row) adds 1 to $07E8 (row 0, modulo $3A) or $07E9 (row 1, modulo $58), writes $9C + the new number's high nibble to $07E5 and $9C + its low nibble to $07E6, calls fsel_text and answers carry clear; no call there plays sound $2C. Both rows are in the windows."
kind = "call"
fn = "fsel_input"
on = ["cov6-j-x@406200+12000", "cov6-j-x@452000+6700"]
max_calls = 13000
min_calls = 60
where = "rd.get(0x626C + rd[0x6E]) == 8 and ran('3D:B3D2')"
model = '''
def snd_step(rd, wr, row):
    addr, mod = (0x7E8, 0x3A) if row == 0 else (0x7E9, 0x58)
    v = (rd[addr] + 1) % mod
    return wr[addr] == v and wr[0x7E5] == 0x9C + (v >> 4) and wr[0x7E6] == 0x9C + (v & 15)
'''
expect = "rd[0x3C] & 3 == 1 and snd_step(rd, wr, rd[0x6248 + rd[0x6E]]) and 'fsel_text' in calls and 'snd_play' not in calls and rp & 1 == 0"
cases = { "rd[0x6248 + rd[0x6E]] == 0" = 15, "rd[0x6248 + rd[0x6E]] == 1" = 60 }

