unit = "cov6_extra"
title = "The Extra Game finished and the sound test: what cov6-j-x ran first"
summary = """
What cov6-j-x ran for the first time. The movie starts at cov5-f-extra's file select (the 100% file), plays the whole
Extra Game (game_mode 1, three bars) with main's input and repairs, Nightmare, the ending, THE END, and then the file
select of a file with byte 3 = 9 and its fourth menu row, LISTEN TO SOUNDS.

The sound test is state 8 of the file select (type $69, fsel_state; unit scenes, and scenes3 for the other states).
snd_test_open clears $07E8 (the song number shown on the MUSIC row), $07E9 (the sound number of the SOUND EFFECT
row), $07EA (1 once a song was started) and $07EB (1 once a sound was started), draws its box (fsel_screen with
packed_3D_B774: MUSIC, SOUND EFFECT, QUIT) and gives the title's Kirby (slot 3) the headphone hop snd_test_kirby_hop;
then snd_test_wait: state 8, the rows 0, 1 and 4 in the row mask ($13), fsel_tick. In state 8 fsel_input takes Right
(+1) and Left (-1, never pressed) on the row under the hand (fsel_input_snd -> snd_test_step): the MUSIC row counts
0-$39 and the SOUND EFFECT row 0-$57, each wrapping round (the wrap never ran), and the number is drawn as two hex
digit tiles ($9C + nibble at $07E5 / $07E6, fsel_text 2 whose source is that RAM) at column $14 of the row; Up, Down
and Select move the hand without sound $2C, A and Start choose without sound $2D. A chooses by fsel_next_tab's row for
state 8 (0E 0F 00 00 10): on MUSIC state $0E (snd_test_song: snd_test_song_start calls snd_music with $07E8 only while
$07EA is 0, then sets it), on SOUND EFFECT state $0F (snd_test_sound: snd_test_sound_play silences the sounds when $07EB
is set, then snd_play with $07E9, and sets $07EB), on QUIT state $10 (snd_test_quit: music $35, silence, the title's
Kirby back to title_kirby_idle at 36:AB2F, state 2, the file list). B leads by fsel_back_tab to state $11 (snd_test_back,
never ran): by its bytes its routine 3D:B0C8 stops the song (music $FF, $07EA = 0) on the MUSIC row or the sounds ($FF,
$07EB = 0) on the SOUND EFFECT row and stays in the sound test; on QUIT, or with nothing started on that row, it plays
music $35 and goes to state 3 (the finished file's menu). So a second song can only start after B has stopped the
first: the movie stepped the MUSIC row from 0 to $39 and pressed A 58 times, but never B, so only song 0 was started
(snd_song stayed 0); the SOUND EFFECT row started all 88 sounds 0-$57 (the 7 that had never started before, 0, $16,
$2A, $4D, $52, $53, $56, are now started too, claim cov6_extra.snd.headers).

What the corpus says about the songs (unit snddata's question "which number is which tune"): 13 of the 58 songs were
never started, 1, 2, 4, $10, $12, $1C, $1F, $21, $26, $29, $2B, $33, $34 (the header of every other song was read
whole); unit sound's older list of 25 was out of date. Where some are started (claim cov6_extra.snd.places): $35 at
power-on with the title and again when the sound test is left; $17 when a new game starts from the file select;
song 0 with World 1's level card (and the sound test's first song); $08 the goal game; $22 Vegetable Valley's hub;
$0C the fight with Whispy Woods; $07 after Whispy Woods is beaten; $0B GAME OVER; $37 the ending in the night sky.
The track commands $E1, $E2, $F7, $FE and the envelope byte $F0, which the engine knows and which never ran, occur in
no stream: every stream reachable from the 146 headers and the 41 instruments parses with the commands that ran
(claim cov6_extra.snd.no_unrun_commands), so they cannot run in this ROM.

The Extra Game's end: save_game_complete stores $0528 = 9 (byte 3 of the file: the Extra Game finished) for game_mode
1 (3D:BD12, cov6-j-x@389500); the file select then shows "100% : PERFECT" (fsel_perfect_texts, text $15 for file 0) and
the rank text $10 "~ Super Star ~" (fsel_world_text entry $0C), and the finished file's menu has its row 3, LISTEN TO
SOUNDS. kfx_heal_count answered 1 (16:B222, cov6-j-x@253409: one round of kfx_heal in the Extra Game).

Kirby: Sword Kirby's dive that broke a block (kirby_flag3_test in kirby_st_sword_dive) bounces up (script $6A,
kirby_s_sword_bounce: Y velocity -$2C0, a fall with gravity profile 0 and the fall's tests); the Star Rod's fall after
28 frames becomes a dive (kirby_s_rod_dive, the shape of kirby_st_sword_dive: no gravity, the rectangle rod_dive_rec of
kind 6 that breaks blocks). Bank 2B (Meta Knight in the Extra Game) is unit en2b's (e42_face_jump, e42_slash2,
e42_reset_walk, e42_reset_timer, e42_tick_beaten_fall).

The level cards: world 6's card (lvcard_w5, LEVEL 6 ORANGE OCEAN) played to its end for the first time: Kirby
(lvcard_w5_kirby) is knocked off the post into the sea by the cannon's part (lvcard_w5_part2), a fin crosses
(lvcard_w5_part3), and Kirby swims across while lvcard_w5_chr_b8 / lvcard_w5_chr_b6 flip the second sprite CHR bank
($B8 / $B6) and part 2's pose ($0D / $0C) every 3 frames, 28 times; then lvcard_done = 1. World 7's card got to its end
too: after lvcard_w6_kirby's sway the picture 35:8954, chr_bank $96 (lvcard_chr0_96) and the picture pose_tab_35_9898.

Open:
- Never ran: Left on the sound test (3D:B34C), the wraps of both numbers (3D:B3ED, 3D:B3F1, 3D:B430, 3D:B434), Right on
  the QUIT row (3D:B3D9 taken), snd_test_back and its routine 3D:B0C8 (B in the sound test); snd_test_kirby_back's obj_free of
  slot 4 (3D:B1B2). snd_test_song_start's snd_music ran once.
- In kirby_st_sword_bounce only the upkeep and B ($71) exits ran; in kirby_st_rod_dive only the upkeep and B ($8C).
- What the songs not in the claim are in the game, and what the 13 never-started songs are, is not known.
"""

