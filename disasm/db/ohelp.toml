[[ram]]
at = "61DE"
len = 16
name = "obj_dir"
desc = "Object variable 1 of the scripts (var_base of unit vm: $61CA + 18), one byte per object; the name covers the slots 2-17 ($61DC + slot). For the objects that use these helpers it is the direction, 256 to a turn: 0 up, $40 right, $80 down, $C0 left. Bit 7 set = the object faces left: poses get bit 0 flipped and X velocities are negated. obj_spawn copies spawn_vars + 1 into it, so until an object's code sets a direction it holds the number the object was created with. Kirby's byte (slot 1) is kirby_facing."

[[ram]]
at = "078D"
len = 9
name = "obj_param"
desc = "$0784 + slot for the slots 9-17: a number an object keeps for itself, by which the asm_tab helpers and the objects' own code index their tables (speeds, waits). obj_setup and obj_param_set fill it from obj_dir, obj_param_copy from the parent. The bytes $0784-$078C (the slots 0-8) are used by other code for other things."

[[ram]]
at = "625A"
len = 18
name = "obj_var8"
desc = "Object variable 8 of the scripts, one byte per object. To obj_anim: the frames left of the pose shown. To obj_vy_accel: the low byte of the Y acceleration. Many objects keep other things in it."

[[ram]]
at = "626C"
len = 18
name = "obj_var9"
desc = "Object variable 9 of the scripts, one byte per object. To obj_anim: the entry of the animation table that is shown. To obj_vy_accel: the high byte of the Y acceleration. Many objects keep other things in it."

