text = "Every call of obj_spawn_child sets spawn_slot_min = 9, spawn_slot_end = $12, spawn_vars = X, Y and the current object, spawn_x_hi / spawn_y_hi = the high bytes of its world position and $602D / $602E = its third world coordinate; and when a slot comes back (A is not $FF) that slot is 9-17 with type A of the call, the variables 0-2 = X, Y and the parent's slot, and the parent's world X and Y as its position."
kind = "call"
fn = "obj_spawn_child"
on = ["main@260+400", "w3-sonnet@375+400", "w12-sonnet@1040+400"]
min_calls = 10
max_calls = 4000
use = ["ohelp_model"]
model = '''
def child_ok(o, a, v0, v1, ra, rd, wr):
    if not ((wr[0x602F], wr[0x6030], wr[0x6023], wr[0x6024], wr[0x6025]) == (9, 0x12, v0, v1, o)
            and (wr[0x602B], wr[0x602C], wr[0x602D], wr[0x602E]) == (rd[0x6086 + o], rd[0x60AA + o], rd[0x60BC + o], rd[0x60CE + o])):
        return False
    if ra == 0xFF:
        return True
    return (9 <= ra < 18 and wr[0x6128 + ra] == a and (wr[0x61CA + ra], wr[0x61DC + ra], wr[0x61EE + ra]) == (v0, v1, o)
            and (wr[0x82 + ra], wr[0x94 + ra], wr[0xB8 + ra], wr[0xCA + ra]) == (rd[0x6074 + o], rd[0x6086 + o], rd[0x6098 + o], rd[0x60AA + o]))
'''
cases = { "ra != 0xFF" = 5 }
expect = "child_ok(rd[0x6E], a, x, y, ra, rd, wr)"

