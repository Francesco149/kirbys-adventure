unit = "ohelp"
title = "The objects' helpers of bank 22: velocities, facing, distances, animation, children"
summary = """The small routines of bank 22 that the code of the enemies and other objects (banks 19 and 23-2D: their tick
routines, and their scripts through the asm opcodes) calls for the current object (cur_object). The tests against the
room are unit ocoll; this unit is the rest of the layer, the most used first.

The vocabulary they share. obj_dir (object variable 1) is the object's direction, 256 to a turn: 0 up, $40 right, $80
down, $C0 left; bit 7 set is "faces left", and that bit mirrors poses and X velocities. obj_param ($0784 + slot, slots
9-17) is a number an object keeps for itself (obj_param_set copies obj_dir into it before obj_dir becomes a
direction); the table helpers index the scripts' tables with it. obj_var8 / obj_var9 (object variables 8 and 9) are
what the caller makes of them: the 16-bit Y acceleration of obj_vy_accel, or the timer and the index of obj_anim.

Velocity: obj_gravity (Y velocity + $15, limit 3 pixels per frame; obj_gravity_a, obj_gravity_ax with other numbers),
obj_vy_accel, obj_vx_slow (X velocity toward 0 by 3; obj_vx_slow_a by A), obj_vx_neg / obj_vy_neg (and the _cur
entries that take the current object), obj_vel_polar (a speed along obj_dir, through 3F:E0F3).
Facing: obj_face_kirby (obj_dir = $40 or $C0), obj_turn_dir (+ $80), obj_turn (and the X velocity), obj_turn_pose
(and the pose), obj_pose_flip, obj_pose_dir (pose A, + 1 when facing left; obj_pose_dir0 for pose 0), obj_dir_left,
obj_vy_up, obj_dir_octant.
Where Kirby is: obj_dx_to / obj_dy_to (the distance to object Y along one axis and which side; obj_dx_kirby /
obj_dy_kirby for slot 1), obj_near (inside a box around an object), obj_far_x, obj_quadrant_kirby, obj_aim_at /
obj_aim_at_04 / obj_aim_kirby (the direction of 3F:E012 toward a point), obj_abs16.
The screen: obj_on_screen (carry clear when the object is in the 256 x 192 pixels the camera shows), obj_sound (a sound
only then), obj_screen_pos, obj_flicker (the draw routine alternates every two frames).
Position: obj_pos_copy, obj_pos_add.
Animation: obj_anim counts obj_var8 down and at 0 steps to the next entry (obj_var9) of a table of pairs (pose,
frames) with commands in it (jump, call, a pose mirrored by obj_dir); obj_anim_start / asm_anim_start begin one.
Children: obj_spawn_child / obj_spawn_child_dir create an object in the slots 9-17 at the object's own place
(obj_spawn_at_self), with the parent's slot in its variable 2.
For scripts (they read their operands after the asm opcode and step over them with asm_skip): asm_tab_byte,
asm_tab_wait, asm_vx_tab, asm_vx, asm_pose_dir, asm_sound.
obj_water_test (four entries) abandons its caller and gives the object the script 22:833B when it is in water.
obj_setup is the common beginning of an enemy's first script. tick_hit_8b34 and tick_hit_timed are two tick routines
that call 3F:E31D (unit hit) with a record of bank 39.

In pictures: w12-sonnet@38500, the enemy in the air at the upper left: obj_face_kirby runs for it every frame.


Open: what 3F:E012 (direction between two points) and 3F:E0F3 (velocity from direction and speed) compute exactly is
not modelled here, only the sides and signs the callers rely on. Paths that never ran: obj_water_test entered at
22:8341 / 22:8345 finding water (22:8357), a pose in A for the water entries (22:8390), obj_anim's command with bit 2
clear (22:9702), a carry into the high byte in obj_dx_to (22:910F). What the script 22:833B (it goes on at 24:BA23)
does. $602D / $602E, which obj_spawn_at_self fills from the parent's third world coordinate. obj_anim_start and the animation command with bit 2 ran in one movie only (main, from frame 130,782).
Bank 22 code not taken in this round, with what the listing shows:
22:8012 / 22:802E / 22:8090 (an object that homes in on the origin of its own coordinates and is freed there; 22:8090
makes them relative to Kirby); 22:80FC (dec $05E5); 22:811D (a random pose of four); 22:824A (velocities by obj_dir
and a counter from the tables at 22:82B2); 22:8301 (six steps of velocity from 22:8320 / 22:832C); 22:83A3 (the water
test at (0, 7) that returns carry set); 22:8414 (a tick: stays on the object in variable 5, counts variable 6 down,
a child every 4 frames); 22:84CF (obj_turn_dir for the current object, 10 runs); 22:8501 / 22:8542 beyond what is
named (22:8542 negates both velocities); 22:8553 (a random index by a table of thresholds); 22:859F / 22:85B0
(on screen: 24:BA8C); 22:8665 / 22:8679 (absolute X / Y distance of the objects X and Y into $10 / $11); 22:86C5 and
22:8777 (a time or speed from the direction and a distance, through div_recip); 22:883F (pose 0 / 1 by the sign of
variable 2); 22:8860 (obj_face_kirby reversed, 18 runs); 22:886F with its eight parts 22:88C9-22:8901 and 22:8909,
22:8959, 22:89A1, 22:89F3 (by obj_dir_octant through the table at 22:88B9: points around an 8-pixel grid);
22:8A5D, 22:8A6C, 22:8AC6 (callers of obj_pos_off); 22:8AF3 (frees every other object of the slots 9-17); 22:8B24;
22:8B35 (a 16-bit division); 22:8B61 and 22:8BC0 (asm: a word of a table by obj_param for 3F:E247 / as Y velocity);
22:8C05 / 22:8C19 (asm: the X position moves by the operand, forward / backward); 22:8C71 / 22:8C87 (asm:
obj_spawn_child_dir / obj_spawn_child with three operands); 22:8CAA is taken, 22:8CD9 (Y velocity 0); 22:8D21,
22:8D2D, 22:8D3B, 22:8D84 (save the object's pose, direction, velocities, position and wait in $0798-$07A4 and bring
them back); 22:8DDC (velocity by a table and $079D); 22:8E56 (frees the slots 0 and 2-8, retypes slot 1 to $6E);
22:8E7E; 22:8EB5 (asm: clears bit 7 of obj_tick_bank for a range of slots); 22:8F1E (2D:B15B); 22:8F32 / 22:8F69
(asm: stores into a variable of another object); 22:8FA2 (a random choice by weights at ($16)); 22:8FC6, 22:8FCE /
22:8FD2 (a palette by the camera's height, $078A); 22:9009 (3D:BCFC); 22:9066, 22:9075, 22:9084, 22:90C8 (the same
as obj_face_kirby, obj_pose_dir0, asm_vx and a negation for variable 4 as a second direction); 22:90BA (obj_dir
negated); 22:917C (obj_dir = obj_quadrant_kirby); 22:91A9 / 22:91B8 (keep the world X in obj_var8 / obj_var9 and
put it back); 22:91D8 (obj_pos_copy from the object in variable 2); 22:924B (X position + A); 22:927C (A =
obj_param); 22:9282 (X velocity - A without a limit); 22:92B1 (A = 1 when the X velocity points away from Kirby);
22:92F3 (Y = 1 when the object is in the lower half of the screen); 22:932F / 22:9340 (asm: both velocities from
operands, X mirrored by obj_dir); 22:93A1 and 22:93C0 (parts of obj_vel_polar that other code jumps to; 22:93C0 an X
velocity mirrored by obj_dir); 22:93FA (obj_dir turns 8 toward Kirby); 22:943C / 22:944D / 22:9458 (velocities to
0); 22:9463 (3F:E012 toward object Y); 22:9498 (keeps the object inside a box around the camera); 22:9591 (asm: a
child of type $59 with five operands); 22:962E (A = 1 once in four, random); 22:963B (draw routine and bit 7 of
obj_sprite_bank by A and the frame); 22:9684 (obj_walk0, then obj_shape_ahead for a floor ahead)."""

# ------------------------------------------------------------------ velocity

[[sym]]
at = "22:851C"
name = "obj_gravity"
desc = "obj_gravity_ax with A = $15 and X = 3: the common gravity of the enemies."
out = "as obj_gravity_ax"

[[sym]]
at = "22:851E"
name = "obj_gravity_a"
desc = "obj_gravity_ax with X = 3."
in = "A = what is added to the Y velocity"
out = "as obj_gravity_ax"

[[sym]]
at = "22:8520"
name = "obj_gravity_ax"
desc = "Adds A to the 16-bit Y velocity of the current object (obj_vy_lo / obj_vy_hi). When the high byte minus X is then not negative (as a byte), the velocity becomes X pixels per frame exactly (low byte 0)."
in = "A = what is added (1/256 pixel per frame), X = the limit in pixels per frame"
out = "X = the current object; $00 = the limit; A = the new high byte"
comments = { "8533" = "at or over the limit?", "8537" = "the limit, low byte 0" }

[[sym]]
at = "22:9319"
name = "obj_vy_accel"
desc = "Adds the 16-bit number in obj_var8 (low) and obj_var9 (high) of the current object to its Y velocity."
out = "X = the current object; A = the new high byte"

[[sym]]
at = "22:8CE4"
name = "obj_vx_slow"
desc = "obj_vx_slow_a with A = 3."
out = "as obj_vx_slow_a"

[[sym]]
at = "22:8CE6"
name = "obj_vx_slow_a"
desc = "Moves the 16-bit X velocity of the current object toward 0 by A: a velocity that is not negative loses A and becomes 0 when it would turn negative; a negative one gains A and becomes 0 when it would stop being negative."
in = "A = the step (1/256 pixel per frame)"
out = "X = the current object; $00 = the step; A = the new high byte"
comments = { "8CFF" = "past 0: stop", "8D18" = "past 0: stop" }

[[sym]]
at = "22:84E6"
name = "obj_vx_neg_cur"
desc = "obj_vx_neg for the current object."
out = "X = the current object"

[[sym]]
at = "22:84E8"
name = "obj_vx_neg"
desc = "Negates the 16-bit X velocity of object X."
in = "X = object"

[[sym]]
at = "22:8501"
name = "obj_vy_neg_cur"
desc = "obj_vy_neg for the current object."
out = "X = the current object"

[[sym]]
at = "22:8503"
name = "obj_vy_neg"
desc = "Negates the 16-bit Y velocity of object X."
in = "X = object"

[[sym]]
at = "22:939D"
name = "obj_vel_polar"
desc = "Both velocities of the current object from its direction and a speed: $00 = A, $01 = Y, then 3F:E0F3 with A = obj_dir; the X velocity is what that leaves in $08 / $09, the Y velocity what it leaves in $05 / $06. A direction below $80 gives an X velocity that is not negative, one above $80 an X velocity that is not positive; a direction between $40 and $C0 a Y velocity that is not negative (down), the others one that is not positive. Other code jumps to 22:93A1 with $00 / $01 already set (e17_tick_home, e17_set_dir), and 29:BAA3 calls it there (cov3-c-rodwiz, cov3-a-wizard), which makes 22:93A1 a routine of its own: the read of obj_dir and the call of vel_from_dir are 22:93A1's in the xref."
in = "A = speed, low byte; Y = high byte"
out = "X = the current object"

# ------------------------------------------------------------------ facing

[[sym]]
at = "22:8851"
name = "obj_face_kirby"
desc = "obj_dx_kirby, then obj_dir of the current object = $40 when the object is left of Kirby (it faces right), $C0 otherwise (also at the same X)."
out = "X = the current object; A = the direction; $00 / $01, $04 as obj_dx_kirby"

[[sym]]
at = "22:84D1"
name = "obj_turn_dir"
desc = "Adds $80 to obj_dir of object X: the opposite direction."
in = "X = object"
out = "A = the new direction"

[[sym]]
at = "22:84DB"
name = "obj_pose_flip"
desc = "Flips bit 0 of obj_pose of the current object: the mirrored pose of a pair."
out = "X = the current object; A = the new pose"

[[sym]]
at = "22:84B9"
name = "obj_turn_pose"
desc = "obj_pose_flip, then obj_turn."

[[sym]]
at = "22:84BC"
name = "obj_turn"
desc = "The current object turns round: obj_turn_dir, then obj_vx_neg."
out = "X = the current object"

[[sym]]
at = "22:8829"
name = "obj_pose_dir0"
desc = "obj_pose_dir with A = 0: pose 0 facing right, pose 1 facing left."
out = "as obj_pose_dir"

[[sym]]
at = "22:882B"
name = "obj_pose_dir"
desc = "obj_pose of the current object = A, with bit 0 flipped when bit 7 of obj_dir is set (the object faces left)."
in = "A = the pose for facing right"
out = "A = the pose; X = the current object; Y = obj_dir"

[[sym]]
at = "22:8AE7"
name = "obj_dir_left"
desc = "A = 1 when bit 7 of obj_dir of the current object is set, else 0."
out = "A = 0 or 1; X = the current object; Y = obj_dir"

[[sym]]
at = "22:8E74"
name = "obj_vy_up"
desc = "A = 1 when the Y velocity of the current object is negative (it moves up), else 0."
out = "A = 0 or 1; X = the current object"

[[sym]]
at = "22:854B"
name = "obj_dir_octant"
desc = "A = A / 32: the eighth of the turn a direction lies in (0-7)."
in = "A = direction"
out = "A = 0-7; carry clear"

# ------------------------------------------------------------------ distances

[[sym]]
at = "22:864E"
name = "obj_abs16"
desc = "The absolute value of the 16-bit number in $10 / $11, in place."
out = "A = the high byte"

[[sym]]
at = "22:90D6"
name = "obj_dx_kirby"
desc = "obj_dx_to with Y = 1: Kirby."
out = "as obj_dx_to"

[[sym]]
at = "22:90D8"
name = "obj_dx_to"
desc = "The horizontal distance from the current object to object Y, from the world X positions: $00 / $01 = the absolute value of (own X - the other's X), $04 = 1 when the difference is negative (the current object is left of the other), else 0. $08 and $09 are used."
in = "Y = the other object"
out = "$00 / $01, $04; X = the current object; Y unchanged"

[[sym]]
at = "22:9112"
name = "obj_dy_kirby"
desc = "obj_dy_to with Y = 1: Kirby."
out = "as obj_dy_to"

[[sym]]
at = "22:9114"
name = "obj_dy_to"
desc = "The vertical distance from the current object to object Y, from the world Y positions: $02 / $03 = the absolute value of (own Y - the other's Y), $05 = 1 when the difference is negative (the current object is above the other), else 0. $08 and $09 are used."
in = "Y = the other object"
out = "$02 / $03, $05; X = the current object; Y unchanged"

[[sym]]
at = "22:914E"
name = "obj_near"
desc = "A = 1 when object A is inside a box around the current object: obj_dx_to gives a distance of at most X and (only then looked at) obj_dy_to one of at most Y; else A = 0. The limits are kept plus one in $11 and $12, the object in $10."
in = "A = the other object, X = the reach to each side, Y = the reach up and down (pixels)"
out = "A = 0 or 1"

[[sym]]
at = "22:8F07"
name = "obj_far_x"
desc = "The absolute value of (X position of the current object - world X of Kirby) into $10 / $11 through obj_abs16, and a comparison of its high byte with 2: carry set when the object is 512 pixels or more from Kirby."
out = "carry; A = the high byte; $10 / $11"

[[sym]]
at = "22:9183"
name = "obj_quadrant_kirby"
desc = "obj_dx_kirby and obj_dy_kirby, then the diagonal that points to Kirby's quarter: object left of Kirby and above him A = $60, Y = 1; left and not above A = $20, Y = 0; not left and above A = $A0, Y = 2; neither A = $E0, Y = 3."
out = "A = direction, Y = 0-3; X = the current object"

[[sym]]
at = "22:868D"
name = "obj_aim_kirby"
desc = "obj_aim_at with Y = 1, and the answer becomes obj_dir of the current object."
out = "A = the direction; X = the current object"

[[sym]]
at = "22:8698"
name = "obj_aim_at"
desc = "The direction from the current object to object Y: $04-$07 = the other's world X and Y (16 bits each), then obj_aim_at_04."
in = "Y = the other object"
out = "as obj_aim_at_04"

[[sym]]
at = "22:86AC"
name = "obj_aim_at_04"
desc = "$00-$03 = the world X and Y of the current object, then 3F:E012: the direction from that point to the point in $04-$07, a multiple of 4 in obj_dir's measure (a point to the right gives 0-$80, one below $40-$C0)."
in = "$04 / $05 = X, $06 / $07 = Y of the point"
out = "A = $10 = the direction; X = the current object; Y unchanged"

# ------------------------------------------------------------------ the screen

[[sym]]
at = "22:85C5"
name = "obj_on_screen"
desc = "Carry clear when the world position of the current object is in view: 0 <= world X - cam_x < 256 and 0 <= world Y - cam_y < 192. Else carry set. A is lost, X and Y are kept. $00 and $02 are used."
out = "carry clear: on screen; X, Y unchanged"

[[sym]]
at = "22:8EF0"
name = "obj_sound"
desc = "snd_play with A when obj_on_screen says the current object is in view; nothing otherwise."
in = "A = sound number"
out = "carry clear: it was requested"

[[sym]]
at = "22:92CC"
name = "obj_screen_pos"
desc = "Where object X is on the screen: $06 / $07 = world X - cam_x, $08 / $09 = world Y - cam_y (16 bits each)."
in = "X = object"
out = "X = $06, Y = $08: the low bytes"

[[sym]]
at = "22:8ED6"
name = "obj_flicker"
desc = "Sets the draw routine of the current object by bit 1 of obj_frame, from obj_flicker_lo / obj_flicker_hi: 3E:DA89 (the default) when it is clear, 3E:DDE7 when it is set. Called every frame it makes the object's drawing alternate two frames and two frames."
out = "X = the current object"

[[data]]
at = "22:8EEC"
len = 2
name = "obj_flicker_lo"
format = "bytes"
desc = "Low bytes of obj_flicker's two draw routines: $89, $E7."

[[data]]
at = "22:8EEE"
len = 2
name = "obj_flicker_hi"
format = "bytes"
desc = "High bytes of obj_flicker's two draw routines: $DA, $DD."

# ------------------------------------------------------------------ position

[[sym]]
at = "22:91DD"
name = "obj_pos_copy"
desc = "Object Y gets the X and Y position of object X (the 16-bit positions, not the fractions), in the position and in the world position."
in = "X = from, Y = to"

[[sym]]
at = "22:9202"
name = "obj_pos_add"
desc = "Moves the current object by a signed number of pixels: X is added to its X position, A to its Y position (sign-extended to 16 bits, in $00 / $01 and $02 / $03), and both results go to the world position as well."
in = "X = pixels right, A = pixels down (signed)"
out = "Y = the current object"

# ------------------------------------------------------------------ animation

[[sym]]
at = "22:96DC"
name = "obj_anim"
desc = "One frame of an animation of the current object. obj_var8 is counted down; while it is not 0 nothing else happens. At 0: $16 / $17 = the table, obj_var9 is stepped to the next entry, and obj_anim_run shows it."
in = "A = low byte, Y = high byte of the table's address"
out = "X = the current object"

[[sym]]
at = "22:96EC"
name = "obj_anim_run"
desc = "Shows entry obj_var9 of the animation table at ($16) for object X. An entry is two bytes. First byte below $80: obj_pose = it, obj_var8 = the second byte (frames). $C0-$FF: obj_pose = its low six bits, plus 1 when bit 7 of obj_dir is set; obj_var8 = the second byte. $80-$BF are commands: bit 0 set, obj_var9 = the second byte and that entry is run (a jump); else bit 1 set, obj_var9 moves on by two entries and obj_anim_call calls the routine whose address is the entry after the command, then the entry it moved on to is run; else bit 2 set, obj_var9 moves on by one, obj_pose = the second byte, the routine addressed by the next entry is called and what it returns in A becomes obj_var8."
in = "X = object; $16 / $17 = table"
comments = { "96F5" = "$C0 and more: a pose by direction", "96F9" = "bit 0: jump", "96FC" = "bit 1: call", "96FF" = "bit 2: pose, and the frames from a call" }

[[sym]]
at = "22:9758"
name = "obj_anim_call"
desc = "Jumps to the routine whose address is at ($16) + Y (through call_target)."
in = "Y = index of the address in the table"

[[sym]]
at = "22:96A8"
kind = "part"
name = "obj_anim_start"
desc = "Begins an animation of the current object: $16 / $17 = A / Y, obj_var9 = X, obj_anim_run, then obj_var8 + 1 (obj_anim counts first and shows after)."
in = "A = low byte, Y = high byte of the table; X = the entry to begin at"
out = "X = the current object"

[[sym]]
at = "22:96B9"
name = "asm_anim_start"
desc = "obj_anim_start for a script: the table's address is the two bytes after the asm opcode (stepped over), the entry is A."
in = "A = the entry to begin at"
out = "X = the current object"

# ------------------------------------------------------------------ children

[[sym]]
at = "22:856E"
name = "obj_spawn_child_dir"
desc = "obj_spawn_child with obj_dir of the current object added to Y: the child's variable 1 is a direction relative to the parent's."
in = "A = object type, X = the child's variable 0, Y = added to obj_dir for its variable 1"
out = "as obj_spawn"

[[sym]]
at = "22:8589"
name = "obj_spawn_child"
desc = "Creates an object of type A in the slots 9-17 at the place of the current object: spawn_slot_min = 9, spawn_slot_end = $12, spawn_vars = X, spawn_vars + 1 = Y, then obj_spawn_at_self."
in = "A = object type, X = the child's variable 0, Y = its variable 1"
out = "as obj_spawn: A = X = the new slot, or A = $FF"

[[sym]]
at = "22:8628"
kind = "part"
name = "obj_spawn_at_self"
desc = "The end of the two spawn helpers (the type is on the stack): spawn_vars + 2 = X, the parent's slot; spawn_x_hi, spawn_y_hi and the X and Y registers = the parent's world position; $602D / $602E = its third world coordinate; then obj_spawn."

# ------------------------------------------------------------------ for scripts

[[sym]]
at = "22:8C9D"
kind = "part"
name = "asm_skip"
desc = "Adds Y to script_ptr (16 bits): steps over Y operand bytes of the asm opcode that called. A is kept."
in = "Y = bytes"
out = "A unchanged"

[[sym]]
at = "22:8BED"
name = "asm_tab_byte"
desc = "For a script: A = byte obj_param (of the current object) of the table whose address is the two bytes after the asm opcode; the two bytes are stepped over."
out = "A = the byte; X = the current object"

[[sym]]
at = "22:8BE4"
name = "asm_tab_wait"
desc = "asm_tab_byte, and the byte becomes thread_wait of the current thread: a wait whose length depends on obj_param."
out = "A = the byte; X = the current thread"

[[sym]]
at = "22:8B7F"
name = "asm_vx_tab"
desc = "For a script: the X velocity of the current object = word obj_param of the table whose address is the two bytes after the asm opcode, negated when bit 7 of obj_dir is set; the two bytes are stepped over."
out = "X = the current object"

[[sym]]
at = "22:8CAA"
name = "asm_vx"
desc = "For a script: the X velocity of the current object = the 16-bit number after the asm opcode, negated when bit 7 of obj_dir is set; the two bytes are stepped over."
out = "X = the current object; $10 / $11 = the velocity"

[[sym]]
at = "22:8C53"
name = "asm_pose_dir"
desc = "For a script: obj_pose_dir with the byte after the asm opcode, which is stepped over."

[[sym]]
at = "22:8EFB"
name = "asm_sound"
desc = "For a script: obj_sound with the byte after the asm opcode, which is stepped over."

# ------------------------------------------------------------------ the rest

[[sym]]
at = "22:8341"
name = "obj_water_test"
desc = "obj_water_test_ay with A = $FF (no pose) and Y = 0."

[[sym]]
at = "22:8345"
name = "obj_water_test_ay"
desc = "Looks at the block 6 pixels below the position of the current object (obj_pos_off, prop_bit7_at). No water: returns with A as it came and carry clear. Water never was found here; the code for it is that of obj_water_test2_a with one return address dropped instead of two."
in = "A = a pose, or $FF; Y = a value for object variable 2"
out = "A unchanged; carry clear"

[[sym]]
at = "22:8371"
name = "obj_water_test2"
desc = "obj_water_test2_a with A = $FF (no pose)."

[[sym]]
at = "22:8373"
name = "obj_water_test2_a"
