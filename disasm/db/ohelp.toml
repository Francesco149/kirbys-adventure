[[model]]
name = "ohelp_model"
code = '''
def oh_ns(ws):
    # the addresses outside the stack page
    return {w for w in ws if w >> 8 != 1}

def oh_neg(v):
    return -v & 0xFFFF

def oh_w(d, lo, hi, o=0):
    return d[lo + o] | d[hi + o] << 8

def oh_fall(v, add, cap):
    lo = (v & 0xFF) + add
    hi = (v >> 8) + (lo >> 8) & 0xFF
    if hi - cap & 0x80:
        return hi << 8 | lo & 0xFF
    return cap << 8

def oh_slow(v, step):
    lo, hi = v & 0xFF, v >> 8
    if hi < 0x80:
        t = lo - step
        h = hi - (t < 0) & 0xFF
        return 0 if h & 0x80 else h << 8 | t & 0xFF
    t = lo + step
    h = hi + (t > 255) & 0xFF
    return h << 8 | t & 0xFF if h & 0x80 else 0

def oh_dist(p, q):
    # |p - q| and 1 when p - q is negative
    d = p - q & 0xFFFF
    return (oh_neg(d), 1) if d & 0x8000 else (d, 0)

def oh_wx(rd, o):
    return rd[0x6074 + o] | rd[0x6086 + o] << 8

def oh_wy(rd, o):
    return rd[0x6098 + o] | rd[0x60AA + o] << 8

def oh_seen(rd):
    # obj_on_screen: True when the current object is in view
    o = rd[0x6E]
    cx = rd[0xDD] | rd[0xDE] << 8
    wx = oh_wx(rd, o)
    if wx - cx & 0x8000:
        return False
    if not wx - (cx & 0xFF | (cx + 0x100 & 0xFF00)) & 0x8000:
        return False
    dy = oh_wy(rd, o) - (rd[0xE0] | rd[0xE1] << 8) & 0xFFFF
    return dy < 0xC0

def oh_rom(romrd, addr):
    # the values of the ROM bytes the call read at this CPU address (the bank is not known)
    return {v for k, v in romrd.items() if k & 0x1FFF == addr & 0x1FFF}

def oh_arg(rd, romrd, i):
    # byte i after the asm opcode
    return oh_rom(romrd, (rd[0x1E] | rd[0x1F] << 8) + i)

def oh_argw(rd, romrd, i):
    return {l | h << 8 for l in oh_arg(rd, romrd, i) for h in oh_arg(rd, romrd, i + 1)}

def oh_skipped(rd, wr, k):
    # script_ptr moved on by k: the low byte, and the high byte is written exactly on a carry
    lo = rd[0x1E] + k
    return wr[0x1E] == lo & 0xFF and (0x1F in wr) == (lo > 255) and (lo < 256 or wr[0x1F] == rd[0x1F] + 1 & 0xFF)

def oh_bit7(romrd):
    return [v >> 7 for k, v in romrd.items() if O('prop_shape') <= k < O('prop_shape') + 127]

def oh_side(d, lo, hi):
    # True when direction d lies in the half turn from lo to hi (ends included)
    return (d - lo & 0xFF) <= (hi - lo & 0xFF)

def oh_anim(rd, wr, romrd, base, i, o):
    # obj_anim_run from entry i -> (obj_var9, obj_pose, obj_var8); obj_var8 None when a call gives it.
    # obj_dir is the value the call read, or the one a called routine wrote before
    rom = lambda ad: (lambda c: c.pop() if len(c) == 1 else None)(oh_rom(romrd, ad))
    for _ in range(40):
        b = rom(base + 2 * i)
        if b < 0x80:
            return (i, b, rom(base + 2 * i + 1))
        if b >= 0xC0:
            return (i, (b & 0x3F) + (rd.get(0x61DC + o, wr.get(0x61DC + o)) >> 7), rom(base + 2 * i + 1))
        if b & 1:
            i = rom(base + 2 * i + 1)
        elif b & 2:
            i = i + 2 & 0xFF
        elif b & 4:
            return (i + 1 & 0xFF, rom(base + 2 * i + 1), None)
        else:
            raise KeyError('a command that never ran')

def oh_anim_ok(exp, o, wr, mem):
    return (mem(0x626C + o) == exp[0] and wr[0x62C6 + o] == exp[1]
            and (exp[2] is None or mem(0x625A + o) == exp[2]))
'''

