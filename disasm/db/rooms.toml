unit = "rooms"
title = "Rooms: the room loader, the room format, doors, tile sets, the room's object list, the bank helpers"
summary = """A room is a number (room, 0-326). room_load (3F:E638) builds it in five steps that hand over to each other
by jumps between bank 3F and bank 13. (1) room_pick frees the objects and decides the room: room + 1 = $FF means
"go back" (to room_return, or to the room saved at $055A when room_return + 1 is $FF); otherwise the door that was
taken (door_index) is looked up in the door list of the room being left (room_doors_lo/hi, 5 bytes per door) and
room_goto stores the destination in room and room_entry. (2) room_load_data has tileset_load expand the room's tile
set (room_tileset gives its number) and split it into the block tables at $7A00-$7FFF, then expands the room's own
stream (room_data_*, unit unpack) at $67EE: a header of 218 bytes (width and height in screens, graphics and palette
numbers, and from byte 8 one byte per cell that names the screen shown there) and then 192 bytes per screen, one
block number for each 16x16 pixel block of 16 columns and 12 rows. (3) room_rows builds the table of row * width,
room_place puts Kirby at room_entry and the camera inside cam_min/cam_end, room_draw draws the screen and loads the
CHR banks and colours the header names. (4) room_load_objects reads the room's object list (room_objs_*: per cell
where its objects end, then one position byte per object, then one kind byte per object; the 327 lists are the
room_objlists_* regions, 4,742 bytes) and has objs_spawn_row create the
objects of the 12 block rows at the camera. (5) the tail of room_draw (13:A690) sets three CHR banks from the
header and bg_palette loads the background palette. The bank helpers (bank8_* and banka_* in bank 3F) are here
because the loader is their heaviest user.

Open: rooms 0-6 change their map after unpacking (13:ABD2 from room_place, through 13:ACD5 and 13:AD5A), and
the far call to 38:AD5E in room_rows replaces single blocks during the load (two in room $67); 38:A000, 38:AAF8, 38:A309
and 3F:EEF1 write room_map at other times; none of that is described here. Door kinds other than 0 are described only as what the code does with them (kinds 1-7 store kind - 1 in
$0559 and the room being left at $055A; $10 leads to room $2A and keeps the real destination in room_return; $F
takes the destination from boss_room by $0558); the paths for kinds 8, 9, $A-$C with $F4 set, $D, $E, $20 and $70
never ran. Room $0C is rebuilt after unpacking (13:A3BA: width 5, another cell table, rows of blocks copied) and
the rooms that room_flags gives $051E >= 2 get one screen less and two blocks changed; the claims leave those rooms
out. Byte 1 of an object list is not read by anything in the corpus. Header bytes 6 and 7 ($67F4, read by 3F:E47C; $67F5, read by 3F:F9E4) are not named. What the block tables
mean is in unit tiles (block_tile_0-3 are the corners, block_attr the palette); block_prop belongs to the round of
collision; tileset_byte is copied to $056D and not understood (31 bytes, all 8, up to the table at 12:9C7E that 13:AC94 reads;
rooms use tile sets 0-28). The 41 bytes
between room_doors_hi and room_doors, the 2 bytes between room_doors_lo and room_doors_hi are not claimed. The lengths of room_chr_3/4/5 (256 each) and room_palette (ten tables of 256)
follow from the code's indexing; rooms use 55 and 199 entries. room_doors ends where boss_room begins; nothing
says how many doors a room has except the next room's list. objs_kind_type and objs_kind_vars are taken as 256
entries each. 3F:E945 (the other caller of objs_spawn, used while scrolling), 38:A000 (finds the door Kirby is at),
38:AD5E, 13:A7D0, 13:A904, 13:A916, 13:A928, 13:ABD2, 13:ADCB and 3F:EA9B are not in this unit."""

# ------------------------------------------------------------------ bank helpers

[[sym]]
at = "3F:F025"
name = "bank8_push"
desc = "Saves the bank mapped at $8000 (bank_8000) in bank_8000_saved, then continues as bank8_set: the `bit $48` at 3F:F02B hides bank8_set's first instruction."
in = "A = bank"
out = "bank A mapped at $8000; A unchanged"

[[sym]]
at = "3F:F02C"
name = "bank8_set"
desc = "Maps bank A at $8000: writes $86 to the mapper's select register $8000 (and to mmc3_select), then A to bank_8000 and to the data register $8001."
in = "A = bank"
out = "A unchanged"

[[sym]]
at = "3F:F03B"
name = "bank8_pop"
desc = "Maps the bank kept in bank_8000_saved at $8000 again."
out = "A = that bank"

[[sym]]
at = "3F:F04B"
name = "banka_push"
desc = "Saves the bank mapped at $A000 (bank_a000) in bank_a000_saved, then continues as banka_set (the same hidden entry as in bank8_push)."
in = "A = bank"
out = "bank A mapped at $A000; A unchanged"

[[sym]]
at = "3F:F052"
name = "banka_set"
desc = "Maps bank A at $A000: writes $87 to the select register $8000 (and to mmc3_select), then A to bank_a000 and to $8001."
in = "A = bank"
out = "A unchanged"

[[sym]]
at = "3F:F061"
name = "banka_pop"
desc = "Maps the bank kept in bank_a000_saved at $A000 again."
out = "A = that bank"

[[sym]]
at = "3F:F071"
name = "nib_join"
desc = "Returns the high four bits of A with the high four bits of Y below them: the position byte (column, row) of the block that holds pixel X = A, Y = Y inside a screen. $F3 is used."
in = "A, Y"
out = "A = (A & $F0) | (Y >> 4)"

# ------------------------------------------------------------------ the loader

[[sym]]
at = "3F:E638"
name = "room_load"
desc = "Loads a room: maps bank 13 at $A000 and jumps to room_pick. The steps return to each other by jumps (room_pick -> room_load_data -> 13:A38C room_fix -> room_load_objects -> 13:A690), and the rts of bg_palette ends the call. On the path for door kinds $A-$C (13:A24A) the call ends in obj_spawn without loading anything."
in = "room, door_index, room_return"
out = "room, room_entry; the room's header and map at $67EE, the block tables at $7A00, Kirby in slot 1, the camera, CHR banks and background palette"

[[sym]]
at = "3F:E640"
kind = "part"
name = "room_load_data"
desc = "Second step of room_load. Maps bank 38 at $A000 and calls tileset_load; then takes the room's stream from room_data_lo/hi/bank (indexed by room, bit 7 of the bank byte masked off), maps its bank at $A000 and has unpack expand it at $67EE; maps bank 13 again and jumps to room_fix (13:A38C)."

[[sym]]
at = "3F:E684"
kind = "part"
name = "room_load_objects"
desc = "Fourth step of room_load. Maps objs_bank at $A000 and reads the head of the room's object list at ($16): byte 0, the number of cells the list covers, goes to objs_cells; objs_xy = objs_ends + that number; objs_kind = objs_xy + the end index of the last cell, which is the number of objects. Then calls objs_spawn_row for 12 rows of blocks, starting at the cell and pixel row in $4B/$4C/$11/$12 (set from the camera by room_draw) and moving down 16 pixels each time ($4C counts the carry of $12, $4B is put back after each row). Clears $66E2. Ends by mapping bank 13 and jumping to 13:A690."
comments = { "E68F" = "byte 0 of the list: cells", "E6A1" = "the last cell's end index: the number of objects", "E6AE" = "12 rows of blocks" }

[[sym]]
at = "13:A000"
kind = "part"
name = "room_pick"
desc = "First step of room_load: decides which room to load. Maps bank 12 at $8000, frees every object (obj_free on all 18 slots, except an object of type 2 whose $6200 byte is $19), clears $0158-$015F, spawn_vars 0-3, door_kind, $051C, $6600, $059E, $059F and sets $058F = $FC, $36 = $18. Then: room $000C becomes room $000D with room_entry = 0, $78. room + 1 = $FF: the room and entry in room_return are taken, or, when room_return + 1 is $FF too, those at $055A-$055D (which are also copied to room_return). Otherwise the door: the list of the room's doors is at room_doors_lo/hi[room], record door_index of 5 bytes is copied to $01-$05, door_kind = (byte 3 & $70) | (byte 0 >> 4), $03/$04 = the destination room (byte 2, bit 7 of byte 3), $06 = the destination cell (byte 3 & $0F), $05 = the destination position; kind 0 falls into room_goto, other kinds go to room_pick_kind. Every path ends in room_pick_end."
comments = { "A007" = "free all 18 object slots", "A04A" = "room $000C: load $000D instead", "A06F" = "room + 1 = $FF: go back", "A0BF" = "a door: its record", "A0DA" = "5 bytes per door", "A0EF" = "kind: bits 6-4 of byte 3, high nibble of byte 0" }

[[sym]]
at = "13:A115"
name = "room_goto"
desc = "Makes the room in $03 (low byte) / $04 (bit 8) the room to load, entered at cell $06, position $05. When bit 7 of the destination's room_data_bank byte is clear, room_return gets the same room and entry. When it is set, room_return gets the room that is being left and $01/$02 (the door's own first two bytes) instead, before room changes. Jumps to room_pick_end."
in = "$01-$06 = the door record as room_pick left it"

[[sym]]
at = "13:A162"
kind = "part"
name = "room_pick_kind"
desc = "The door kinds other than 0, by the low nibble of door_kind (the high nibble of the door's first byte). 1-7: $0559 = the nibble - 1, $66D5 = $46, the room being left and the door's first two bytes are saved at $055A-$055D, then room_goto. 0 with bits 6-4 = 1: $0520 = 0, room_return = the door's destination, 3F:F859 is called with A = 5, and the room loaded is $002A, cell 4, position $8B, with $051C = 1. $A-$C: $0520 = the nibble - $A, $07D1, $051E, $0180, $056A, $07D0 and $051C are set, the destination is saved by 13:A928, and an object of type $65-$67 is created in slot 1; no room is loaded. The other paths never ran."

[[sym]]
at = "13:A28E"
kind = "part"
name = "room_pick_boss"
desc = "Door kinds $D and above. For kind $F, when bit 7 of $0531[$0558] is clear: the room being left and the door's first two bytes go to $055A-$055D and to room_return, and the destination is read from boss_room[$0558] (room, bit 8 and cell, position) instead of from the door; $0520 = 7, $051C = 3, the door's own destination is saved by 13:A928; when that room is $000C the cell is 5. Falls into room_pick_end."

[[sym]]
at = "13:A319"
kind = "part"
name = "room_pick_end"
desc = "Where every path of room_pick meets: a far call (3E:D805 with the three bytes after it: 2E:A98B), then room_flags."

[[sym]]
at = "13:A31F"
kind = "part"
name = "room_flags"
desc = "Sets the per-room switches from short lists of room numbers: $056A = 0; $0180 = 2, 1 or 2 for rooms $000F, $0011, $0010 and 1 otherwise; for rooms 0-6, $0558 becomes the room number (3F:EA87 is called when that changes it); $051E = 5, 4, 3 or 2 for the rooms $00E6, $00DF, $00D4, $00CD and 1 otherwise. Calls 3E:C42F and jumps to room_load_data."

[[sym]]
at = "13:A38C"
kind = "part"
name = "room_fix"
desc = "Third step of room_load, after the room is unpacked. When $051E >= 2: room_height is lowered by 1 and two blocks of the map are replaced from the tables at 13:A3A7. Then room_patch."

[[sym]]
at = "13:A3B3"
kind = "part"
name = "room_patch"
desc = "For room $000C only: room_width = 5, the ten cells of room_screens become 0 1 2 1 2 3 4 5 4 5, and 192-byte rows of the map are copied over each other. Then room_rows."

[[sym]]
at = "13:A3F9"
kind = "part"
name = "room_rows"
desc = "Fills room_row_cell with row * room_width for rows 0-127 (low byte), stores room_width * room_height in room_cells, sets $6600 = 1 and $0551 = $FF, makes a far call to 38:AD5E and continues in room_place."

[[sym]]
at = "13:A422"
kind = "part"
name = "room_place"
desc = "Puts Kirby and the camera into the room. room_entry is a cell number and a position byte: Kirby (type 1) is created in slot 1 at X = (cell mod room_width) * 256 + (position & $F0) + 8 and Y = (cell / room_width) * 192 + (position & $0F) * 16 + 9. The camera starts 120 pixels left of and 112 above that point. The limits become cam_min_x = 0, cam_end_x = room_width * 256, cam_min_y = 8, cam_end_y = room_height * 192 + 72, and the camera is clamped to cam_min <= camera <= cam_end - 256 on both axes (room $000E and the rooms with $051E >= 2 get other limits from their own tables). For rooms 0-6 13:ABD2 is called first; room $000D also gets an object of type 6. 13:A904 and 13:A916 derive $05C8-$05CB from the limits, and $05CC = cam_min_y + 28."
comments = { "A431" = "cell -> column and row", "A44F" = "X = high nibble * 16 + 8", "A46A" = "Y = low nibble * 16 + 9, plus 192 per row", "A498" = "Kirby: type 1 in slot 1", "A4C3" = "the limits of the camera", "A50E" = "clamp X", "A53C" = "clamp Y" }

[[sym]]
at = "13:A5BE"
kind = "part"
name = "room_draw"
desc = "Draws the room at the camera and loads what the header names. With cam_y rounded down to 16 for the duration: scroll_init, then tiles_row (unit tiles) for 24 rows of tiles ($12 steps by 8 and wraps at 192 into the next cell), then 13:ADCB. chr_bank + 1 = room_chr_bank; $0197-$0199 = $30, $37, $17; the six colours of record room_colors of room_bg_colors go to $019B-$019D and $019F-$01A1; room_obj_index is filled with $FF; the room's object list (room_objs_bank/hi/lo by room) is put in objs_bank and $16/$17, and objs_ends = that address + 2; $4B/$4C and $11/$12 get the camera's cell and pixel offsets, then room_load_objects. Its tail at 13:A690 is the last step: maps bank 05 at $8000, sets chr_bank + 3/4/5 from room_chr_3/4/5[room_chr_set] (and chr_bank + 2 = 0 unless the room is 0-6), copies chr_bank + 5 to $058E, and falls into bg_palette_far with Y = room_pal."
comments = { "A5D4" = "24 rows of tiles", "A600" = "CHR bank from the header", "A614" = "six colours, 6 bytes per record", "A63C" = "no object of the list is on screen yet", "A646" = "the room's object list", "A690" = "last step: CHR banks by room_chr_set" }

[[sym]]
at = "13:A6BD"
name = "bg_palette_far"
desc = "Maps bank 00 at $8000 and falls into bg_palette."
in = "Y = palette number"

[[sym]]
at = "13:A6C2"
name = "bg_palette"
desc = "Loads background palette Y from the ten tables of room_palette into the palette copy at $0182-$019E: table 0 is the shared colour 0 of all eight palettes ($0182, $0186, ... $019E), tables 1-3 go to $0183-$0185, 4-6 to $0187-$0189, 7-9 to $018B-$018D. $018F-$0191 become $37, $27, $07, except in rooms $009A-$00A2 ($20, $10, $00) and room $0011 ($0F, $00, $20). Bank 00 must be mapped at $8000."
in = "Y = palette number"

[[sym]]
at = "38:ACCA"
name = "tileset_load"
desc = "Loads the tile set of the room: its number is room_tileset[room]; tileset_byte of that number goes to $056D; tileset_unpack expands its stream at $67EE. The 1,344 bytes are then split: bytes 0-1023 are four bytes per block, dealt out to block_tile_0, 1, 2, 3; bytes 1024-1087 hold four 2-bit fields each, highest first, one field per block in block_attr; bytes 1088-1343 are block_prop."
out = "block_tile_0-3, block_attr, block_prop; $16-$19 used"

[[sym]]
at = "3F:F7F6"
name = "tileset_unpack"
desc = "Maps the bank of tile set Y (tileset_bank) at $A000, calls unpack with the $16-$19 the caller set, and maps bank 38 at $A000 again."
in = "Y = tile set number; $16/$17 = stream, $18/$19 = destination"

[[sym]]
at = "3F:ECF1"
name = "room_cell"
desc = "Turns a column and a 16-bit Y position into a cell of the room: the row is Y / 192, the result is column + row * room_width (through room_row_cell) and what is left of Y. A Y of $6000 or more gives A = $FF, Y = 0. $00 is used."
in = "A = column (the high byte of an X position), X = high byte and Y = low byte of the Y position"
out = "A = cell, Y = Y position inside the cell (0-191), X = row"

[[sym]]
at = "3F:E8DC"
name = "objs_spawn_row"
desc = "Creates the objects of the room's list that stand in one row of 16 blocks. The row starts at cell column $4B, row $4C, at the block holding pixel $11, $12 of that cell, and runs right across the cell border. For each block whose cell lies inside the room (column < room_width, cell < objs_cells) it compares the block's position byte with those of the cell's objects (objs_xy, from objs_ends[cell - 1], or 0 for cell 0, up to objs_ends[cell]) and calls objs_spawn with the index of each match. Maps bank 12 at $8000 and objs_bank at $A000 for the duration and restores both (bank8_push / bank8_pop, banka_push / banka_pop). Does nothing when $4C >= objs_cells (never ran)."
in = "$4B, $4C = cell column and row; $11, $12 = pixel inside the cell"
out = "$4B is one more; $00, $01, $02, $10 used"

[[sym]]
at = "3F:E9BB"
name = "objs_spawn"
desc = "Creates object Y of the room's list, unless a slot of 9-17 already holds it (room_obj_index) and is in use, or 3F:EA9B says no (carry set; never ran). The object's kind byte (objs_kind) indexes objs_kind_type for the object type and objs_kind_vars for object variables 0 (low nibble) and 1 (high nibble); variables 2 and 3 are 0. The slot range is 9-15, or 9-17 for the types 3F:EA9B returns in A = $35-$37, $49, $91, $92 and $F0 and above. The position is cell column $4B, row $4C, and 8 + 16 * the nibbles of the object's position byte (objs_xy). The list index is stored in room_obj_index for the new slot. Kinds $B0-$DF also set $059A-$059C and clear $66E9."
in = "Y = index in the room's object list; $4B, $4C = cell column and row"
out = "Y unchanged; $03, $04 used; bank objs_bank mapped at $A000"

# ------------------------------------------------------------------ data

[[data]]
at = "12:8618"
len = 327
name = "room_tileset"
format = "rows:16"
desc = "Per room: the number of its tile set (0-28), the index into tileset_lo/hi/bank and tileset_byte."

[[data]]
at = "12:9C5F"
len = 31
name = "tileset_byte"
format = "rows:16"
desc = "Per tile set: a byte that tileset_load copies to $056D. All 31 are 8."

[[data]]
at = "12:8A80"
len = 327
name = "room_objs_bank"
format = "rows:16"
desc = "Per room: the bank of the room's object list."

[[data]]
at = "12:8BC7"
len = 327
name = "room_objs_hi"
format = "rows:16"
desc = "Per room: high byte of the address (in the $A000 window) of the room's object list."

[[data]]
at = "12:8D0E"
len = 327
name = "room_objs_lo"
format = "rows:16"
desc = "Per room: low byte of the address of the room's object list. The list: byte 0 = number of cells it covers (1 to width * height), byte 1 is not read, then per cell the index one past its last object (the last of them is the number of objects), then one position byte per object (column in the high nibble, row in the low nibble, in blocks inside the cell), then one kind byte per object."

[[data]]
at = "12:8E55"
len = 300
name = "room_bg_colors"
format = "rows:6"
desc = "50 records of six colours, chosen by header byte 5 (room_colors): bytes 0-2 go to $019B-$019D, bytes 3-5 to $019F-$01A1 when a room is loaded."

[[data]]
at = "12:8F82"
len = 327
name = "room_doors_lo"
format = "rows:16"
desc = "Per room: low byte of the address (bank 12) of the room's door list in room_doors."

[[data]]
at = "12:90CB"
len = 327
name = "room_doors_hi"
format = "rows:16"
desc = "Per room: high byte of the address of the room's door list."

[[data]]
at = "12:923B"
len = 2575
name = "room_doors"
format = "rows:5"
desc = "The doors of all rooms, 5 bytes each, a room's doors one after the other. Byte 0: low nibble = the cell the door is in, high nibble = the low half of the door's kind. Byte 1: the door's position in the cell (column, row). Byte 2: destination room, low byte. Byte 3: bit 7 = bit 8 of the destination room, bits 6-4 = the high half of the kind, bits 3-0 = destination cell. Byte 4: position in the destination cell (column, row)."

[[data]]
at = "12:9C4A"
len = 21
name = "boss_room"
format = "rows:3"
desc = "Seven records indexed by $0558: room (low byte), bit 7 = bit 8 of the room and bits 6-0 = cell, position. Where a door of kind $F leads."

[[data]]
at = "00:A000"
len = 2560
name = "room_palette"
format = "rows:16"
desc = "Background palettes as ten tables of 256, indexed by palette number: table 0 = colour 0, tables 1-3 = colours 1-3 of palette 0, tables 4-6 of palette 1, tables 7-9 of palette 2. Read by bg_palette."

[[data]]
at = "05:B418"
len = 256
name = "room_chr_3"
format = "rows:16"
desc = "Per graphics set (header byte 2): the value of chr_bank + 3 for the room."

[[data]]
at = "05:B518"
len = 256
name = "room_chr_4"
format = "rows:16"
desc = "Per graphics set: the value of chr_bank + 4."

[[data]]
at = "05:B618"
len = 256
name = "room_chr_5"
format = "rows:16"
desc = "Per graphics set: the value of chr_bank + 5 (also copied to $058E)."

[[data]]
at = "13:A9D2"
len = 256
name = "objs_kind_type"
format = "rows:16"
desc = "Per kind byte of a room's object list: the object type that objs_spawn creates."

[[data]]
at = "13:AAD2"
len = 256
name = "objs_kind_vars"
format = "rows:16"
desc = "Per kind byte of a room's object list: object variable 0 in the low nibble and object variable 1 in the high nibble of the new object."

# ------------------------------------------------------------------ RAM

[[ram]]
at = "0038"
name = "mmc3_select"
desc = "The last value written to the mapper's bank select register $8000 by the bank helpers ($86 = the bank at $8000, $87 = the bank at $A000)."

[[ram]]
at = "0048"
name = "bank_8000"
desc = "The PRG bank mapped at $8000."

[[ram]]
at = "0049"
name = "bank_a000"
desc = "The PRG bank mapped at $A000."

[[ram]]
at = "0575"
name = "bank_8000_saved"
desc = "The bank bank8_push found at $8000; bank8_pop maps it again."

[[ram]]
at = "0576"
name = "bank_a000_saved"
desc = "The bank banka_push found at $A000; banka_pop maps it again."

[[ram]]
at = "055E"
len = 2
name = "room"
desc = "The room number (0-326, 16 bits). room_load takes it as the room being left and stores the room it loads. $FF in the high byte asks room_load to go back to room_return."

[[ram]]
at = "0560"
len = 2
name = "room_entry"
desc = "Where Kirby enters the room: the cell (low byte) and the position inside it (high byte: column in the high nibble, row in the low nibble, in blocks)."

[[ram]]
at = "0562"
len = 4
name = "room_return"
desc = "A room number (2 bytes) and an entry (cell, position) that room_load goes to when room + 1 is $FF. room_goto stores the destination here when it is an ordinary room, and the room being left when bit 7 of the destination's room_data_bank byte is set."

[[ram]]
at = "056B"
name = "door_index"
desc = "The number of the door that was taken, in the door list of the room being left."

[[ram]]
at = "056C"
name = "door_kind"
desc = "The kind of the door room_pick last looked up: (byte 3 & $70) | (byte 0 >> 4) of its record; 0 after a load that used no door."

[[ram]]
at = "057D"
name = "objs_bank"
desc = "The bank of the room's object list."

[[ram]]
at = "057E"
name = "objs_cells"
desc = "The number of cells the room's object list covers (its first byte)."

[[ram]]
at = "057F"
len = 9
name = "room_obj_index"
desc = "Per object slot 9-17: the index in the room's object list of the object the slot was created from, $FF for none. objs_spawn does not create an object again while its slot is in use."

[[ram]]
at = "00ED"
len = 2
name = "objs_ends"
desc = "Address of the room's object list + 2: per cell, the index one past the cell's last object."

[[ram]]
at = "00EF"
len = 2
name = "objs_xy"
desc = "Address of the position bytes of the room's object list, one per object."

[[ram]]
