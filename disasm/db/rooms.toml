[[claim]]
id = "rooms.load.data"
about = ["room_load", "room_load_data", "room", "room_width", "room_height", "room_chr_set", "room_pal", "room_chr_bank", "room_colors", "room_screens", "room_map"]
text = "After room_load, in every load that unpacked a room above 6 other than room $000C and with $051E below 2: the call read every byte of the stream of room_data_lo/hi/bank[room], for the room number that is in room at the end; the model of unpack expands it to 218 + 192 * (the largest of the first width * height bytes of room_screens + 1) bytes; the 218 header bytes at $67EE are exactly that expansion, and so is room_map except for at most 2 blocks per load (room $67 at main@101332 has two blocks replaced during the load)."
kind = "call"
fn = "room_load"
on = ["main@200+3000", "main@10300+1500", "w3-sonnet@20000+3000", "main@100000+4000"]
min_calls = 12
max_calls = 14
where = "0x67EE in wr and mem(0x51E) < 2 and room(mem) != 0x0C and room(mem) > 6"
expect = "check(mem, wr, romrd, O('room_data_lo'), O('room_data_hi'), O('room_data_bank'))"
model = '''
def room(mem):
    return mem(0x55E) | mem(0x55F) << 8

def expand(get, o):
    out = []
    while True:
        b = get(o); o += 1
        if b == 0xFF:
            return out
        if b >> 5 == 7:
            c = (b >> 2) & 7; n = ((b & 3) << 8 | get(o)) + 1; o += 1
        else:
            c = b >> 5; n = (b & 31) + 1
        if c == 0:
            out += [get(o + i) for i in range(n)]; o += n
        elif c == 1:
            out += [get(o)] * n; o += 1
        elif c == 2:
            out += [get(o), get(o + 1)] * n; o += 2
        elif c == 3:
            out += [(get(o) + i) & 255 for i in range(n)]; o += 1
        else:
            ref = get(o) << 8 | get(o + 1); o += 2
            for i in range(n):
                v = out[ref - i] if c == 6 else out[ref + i]
                out.append(int(f"{v:08b}"[::-1], 2) if c == 5 else v)

def check(mem, wr, romrd, lo, hi, bank):
    r = room(mem)
    get = lambda o: romrd[o]
    off = (get(bank + r) & 0x7F) << 13 | (get(lo + r) | get(hi + r) << 8) & 0x1FFF
    out = expand(get, off)
    w, h = out[0], out[1]
    return (len(out) == 218 + 192 * (max(out[8:8 + w * h]) + 1)
            and all(wr[0x67EE + i] == v for i, v in enumerate(out[:218]))
            and sum(wr[0x67EE + i] != out[i] for i in range(218, len(out))) <= 2)
'''

