model = '''
def expand(get, o):
    out = []
    while True:
        b = get(o); o += 1
        if b == 0xFF:
            return out
        if b >> 5 == 7:
            c = (b >> 2) & 7; n = ((b & 3) << 8 | get(o)) + 1; o += 1
        else:
            c = b >> 5; n = (b & 31) + 1
        if c == 0:
            out += [get(o + i) for i in range(n)]; o += n
        elif c == 1:
            out += [get(o)] * n; o += 1
        elif c == 2:
            out += [get(o), get(o + 1)] * n; o += 2
        elif c == 3:
            out += [(get(o) + i) & 255 for i in range(n)]; o += 1
        else:
            ref = get(o) << 8 | get(o + 1); o += 2
            for i in range(n):
                v = out[ref - i] if c == 6 else out[ref + i]
                out.append(int(f"{v:08b}"[::-1], 2) if c == 5 else v)

def room_ok(rom, r, lo, hi, bank, olo, ohi, obank, dlo, dhi, doors, ts):
    get = lambda o: rom[o]
    out = expand(get, (rom[bank + r] & 0x7F) << 13 | (rom[lo + r] | rom[hi + r] << 8) & 0x1FFF)
    w, h = out[0], out[1]
    cells = w * h
    if not (1 <= cells <= 14 and len(out) == 218 + 192 * (max(out[8:8 + cells]) + 1) and not any(out[8 + cells:218])):
        return False
    if not (rom[ts + r] < 29 and out[5] < 50):
        return False
    o = rom[obank + r] << 13 | (rom[olo + r] | rom[ohi + r] << 8) & 0x1FFF
    nc = rom[o]
    ends = list(rom[o + 2:o + 2 + nc])
    if not (1 <= nc <= cells and ends == sorted(ends)):
        return False
    d = (rom[dlo + r] | rom[dhi + r] << 8) - doors
    return 0 <= d < 2575 and d % 5 == 0
