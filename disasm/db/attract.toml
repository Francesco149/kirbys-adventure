id = "attract.demo_play.abort"
about = ["demo_play_frame", "demo_play", "title_attract_loop"]
text = "Holding Start on the real pad during demo 0 aborts it: the loop is back on the title, running title_timeout, with demo_active clear."
kind = "effect"
on = "attract@2000"
frames = 60
input = "T*10 .*50"
expect = "ram[0x6128] == 0x69 and ctl[0x6128] == 0x00 and ram[0x07DD] == 0 and n('title_timeout') > 0 and cn('title_timeout') == 0"

[[claim]]
id = "attract.demo_number.no_abort"
about = ["demo_number", "demo_play_frame"]
text = "With demo_number nonzero the same Start press does not abort the demo."
kind = "effect"
on = "attract@2000"
frames = 60
input = "T*10 .*50"
poke = { "6601" = 1 }
hold = true
expect = "ram[0x6128] == 0x00 and ram[0x07DD] == 1 and n('title_timeout') == 0 and n('demo_pad_feed') > 0"

[[claim]]
id = "attract.demo_number.xref"
about = ["demo_number", "demo_init", "demo_play_start"]
text = "Only demo_init (and the power-on reset 18:A761) write demo_number, which demo_init and demo_play_frame read; demo_play_start is what loads the stage (3F:E638) and starts scene 0 (3E:CB78). With the second batch of coverage movies (round 68): writers('demo_number'): also leave_tail."
kind = "xref"
expect = "writers('demo_number') == {'demo_init', 'game_state_init', 'leave_tail'} and readers('demo_number') >= {'demo_init', 'demo_play_frame'} and callees('demo_play_start') >= {'3F:E638', '3E:CB78'}"
