# ---------------------------------------------------------------- claims: playing the demo
[[claim]]
id = "attract.demo_init.model"
about = ["demo_init", "demo_setup", "demo_number", "demo_input_ptr", "demo_input_timer", "demo0_inputs"]
text = "demo_init stores the demo number, copies entry A of every demo_setup column to its variable, seeds rng_state with $7777, and starts the input stream (first entry's buttons in $E6/$E7, its count in demo_input_timer)."
kind = "call"
fn = "demo_init"
on = ["attract@1100+5", "attract@12045+5", "attract@22990+5"]
min_calls = 1
max_calls = 1
model = '''
def init_ok(a, wr, romrd, setup, inp_off, inp_addr):
    col = lambda c: romrd.get(setup + 8 * c + a)
    ptr = col(2) | col(3) << 8
    off = inp_off + ptr - inp_addr
    return (wr.get(0x6601) == a and wr.get(0x3E) == 0x77 and wr.get(0x3F) == 0x77
            and wr.get(0xE8) == col(2) and wr.get(0xE9) == col(3)
            and wr.get(0xE6) == romrd.get(off) and wr.get(0xE7) == romrd.get(off)
            and wr.get(0x6602) == romrd.get(off + 1)
            and wr.get(0x05E0) == col(0) and wr.get(0x05E3) == col(1) and wr.get(0x055A) == col(4)
            and wr.get(0x055B) == col(5) and wr.get(0x055C) == col(6) and wr.get(0x055D) == col(7)
            and wr.get(0x0597) == 0x3F and wr.get(0x07DD) == 1)
'''
expect = "init_ok(a, wr, romrd, O('demo_setup'), O('demo0_inputs'), A('demo0_inputs'))"

[[claim]]
id = "attract.demo_pad_feed.model"
about = ["demo_pad_feed", "demo_input_ptr", "demo_input_timer", "demo0_inputs"]
text = "Every call counts demo_input_timer down, steps demo_input_ptr to the next entry (and loads its count) when it hits zero, and writes the entry's buttons to $E6 and the buttons not held before to $E7."
kind = "call"
fn = "demo_pad_feed"
on = ["attract@1200+2000", "attract@14000+2000", "attract@23100+800"]
min_calls = 500
model = '''
def feed_ok(rd, wr, romrd, base_off, base_addr):
    cnt = (rd[0x6602] - 1) & 0xFF
    ptr = rd[0xE8] | rd[0xE9] << 8
    if cnt == 0:
        ptr += 2
        off = base_off + ptr - base_addr
        if wr.get(0x6602) != romrd.get(off + 1) or wr.get(0xE8) != (ptr & 0xFF):
            return False
        if (ptr >> 8) != rd[0xE9] and wr.get(0xE9) != (ptr >> 8):
            return False
    elif wr.get(0x6602) != cnt or 0xE8 in wr or 0xE9 in wr:
        return False
    b = romrd.get(base_off + ptr - base_addr)
    return b is not None and wr.get(0xE6) == b and wr.get(0xE7) == b & (rd[0xE6] ^ 0xFF)
'''
expect = "feed_ok(rd, wr, romrd, O('demo0_inputs'), A('demo0_inputs'))"

